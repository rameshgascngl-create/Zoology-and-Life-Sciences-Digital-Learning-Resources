name: Cell Biology v3.12.3 Final Android Validation

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'Cell-Biology-Android/**'
      - '.github/workflows/cell-biology-v3123-final-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reconstruct canonical v3.12.2 baseline
        run: |
          set -euo pipefail
          test "$(find Cell-Biology-Android/source-parts -maxdepth 1 -name 'part-*.b64' | wc -l)" -eq 18
          cat Cell-Biology-Android/source-parts/part-*.b64 | base64 --decode > /tmp/cellbio-v3121.tar.xz
          echo 'c33c32242d9fffeff167f19f073d8335292eba3f042b199ad2fc055fd2cdfe0c  /tmp/cellbio-v3121.tar.xz' | sha256sum -c -
          test "$(find Cell-Biology-Android/v3122-patch -maxdepth 1 -name 'p*.b64' | wc -l)" -eq 5
          cat Cell-Biology-Android/v3122-patch/p*.b64 | base64 --decode > /tmp/cellbio-v3122-patch.xz
          echo '010f87b9bc05f2e57852246aa3070878379fa1eb981bf861b3b4110705722216  /tmp/cellbio-v3122-patch.xz' | sha256sum -c -
          xz -dc /tmp/cellbio-v3122-patch.xz > /tmp/cellbio-v3122.patch
          python - <<'PY'
          from pathlib import Path
          import re
          data=Path('/tmp/cellbio-v3122.patch').read_text()
          sections=re.split(r'(?=^diff --git )', data, flags=re.M)
          native='diff --git a/app/src/main/java/in/gov/tn/gascngl/zoology/cellbiology/MainActivity.java b/app/src/main/java/in/gov/tn/gascngl/zoology/cellbiology/MainActivity.java'
          kept=[s for s in sections if not s.startswith(native)]
          if len(kept)==len(sections): raise SystemExit('native diff section not found')
          Path('/tmp/cellbio-v3122-nonnative.patch').write_text(''.join(kept))
          PY
          rm -rf Cell-Biology-Android/work-v3123
          mkdir -p Cell-Biology-Android/work-v3123
          tar -xJf /tmp/cellbio-v3121.tar.xz -C Cell-Biology-Android/work-v3123
          mv Cell-Biology-Android/work-v3123/CellBiologyAndroid-v3.12.1 Cell-Biology-Android/work-v3123/CellBiologyAndroid-v3.12.3
          PROJECT="$GITHUB_WORKSPACE/Cell-Biology-Android/work-v3123/CellBiologyAndroid-v3.12.3"
          cd "$PROJECT"
          patch --dry-run -p1 < /tmp/cellbio-v3122-nonnative.patch
          patch -p1 < /tmp/cellbio-v3122-nonnative.patch
          echo 'c87925c055a766072f617e92e92ce0714e3897285d4cb1447ff5fcc41908ba5c  Cell-Biology-Android/v3122-final/MainActivity.java' | (cd "$GITHUB_WORKSPACE" && sha256sum -c -)
          echo 'aa397faaed1d599899af9a6b99ed1980a3f8a8367270f33df970373176e9d7fc  Cell-Biology-Android/v3122-final/MainActivitySmokeTest.java' | (cd "$GITHUB_WORKSPACE" && sha256sum -c -)
          cp "$GITHUB_WORKSPACE/Cell-Biology-Android/v3122-final/MainActivity.java" app/src/main/java/in/gov/tn/gascngl/zoology/cellbiology/MainActivity.java
          rm -f app/src/androidTest/java/in/gov/tn/gascngl/zoology/cellbiology/DeviceValidationTest.java
          cp "$GITHUB_WORKSPACE/Cell-Biology-Android/v3122-final/MainActivitySmokeTest.java" app/src/androidTest/java/in/gov/tn/gascngl/zoology/cellbiology/MainActivitySmokeTest.java
          python - <<'PY'
          from pathlib import Path
          styles=Path('app/src/main/res/values/styles.xml')
          styles.write_text(styles.read_text().replace('        <item name="android:windowLightNavigationBar">true</item>\n',''))
          v27=Path('app/src/main/res/values-v27'); v27.mkdir(parents=True, exist_ok=True)
          (v27/'styles.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.CellBiology" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowLightNavigationBar">true</item>
              </style>
          </resources>
          ''')
          PY
          rm -f gradle/wrapper/gradle-wrapper.jar

      - name: Apply deterministic v3.12.3 compatibility repair
        run: |
          set -euo pipefail
          echo 'f92dc47177d0bf0f3a3e1a74637e2065254b1681ded5c3c536ce00f86e60420c  Cell-Biology-Android/v3123-final/apply_v3123.py' | sha256sum -c -
          python Cell-Biology-Android/v3123-final/apply_v3123.py Cell-Biology-Android/work-v3123/CellBiologyAndroid-v3.12.3

      - name: Verify canonical v3.12.3 invariants
        working-directory: Cell-Biology-Android/work-v3123/CellBiologyAndroid-v3.12.3
        run: |
          set -euo pipefail
          echo '68b58282c497b7450b1d261873458e0c8528f31cf94e05d026e83c0cee167519  app/src/main/assets/www/index.html' | sha256sum -c -
          echo 'dff9d98f10142a26d6a59f8b27f4ce121f6f614c6b27a392da24c45496750148  app/src/androidTest/java/in/gov/tn/gascngl/zoology/cellbiology/MainActivitySmokeTest.java' | sha256sum -c -
          echo 'c87925c055a766072f617e92e92ce0714e3897285d4cb1447ff5fcc41908ba5c  app/src/main/java/in/gov/tn/gascngl/zoology/cellbiology/MainActivity.java' | sha256sum -c -
          grep -q 'versionName = "3.12.3"' app/build.gradle.kts
          grep -q 'versionCode = 31203' app/build.gradle.kts
          ! grep -qF '?.' app/src/main/assets/www/index.html
          grep -q 'if (!Object.values)' app/src/main/assets/www/index.html
          grep -q 'if (!Object.entries)' app/src/main/assets/www/index.html
          grep -q 'if (!Object.fromEntries)' app/src/main/assets/www/index.html
          ! grep -q 'id="carrow"' app/src/main/assets/www/index.html
          ! grep -q 'url(#carrow)' app/src/main/assets/www/index.html
          ! grep -q 'All 26 Diagram Library entries' app/src/main/assets/www/index.html
          grep -q 'parent="android:style/Theme.Material.Light.NoActionBar"' app/src/main/res/values-v27/styles.xml
          python tools/verify_canonical.py
          node tools/verify_html.mjs

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Unit test, lint and assemble v3.12.3 APKs
        working-directory: Cell-Biology-Android/work-v3123/CellBiologyAndroid-v3.12.3
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Upload v3.12.3 app APK
        uses: actions/upload-artifact@v7
        with:
          name: CellBiologyLearningHub-v3.12.3-debug-apk
          path: Cell-Biology-Android/work-v3123/CellBiologyAndroid-v3.12.3/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload v3.12.3 instrumentation APK
        uses: actions/upload-artifact@v7
        with:
          name: CellBiologyLearningHub-v3.12.3-androidTest-apk
          path: Cell-Biology-Android/work-v3123/CellBiologyAndroid-v3.12.3/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CellBiologyLearningHub-v3.12.3-lint
          path: Cell-Biology-Android/work-v3123/CellBiologyAndroid-v3.12.3/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api: [24, 26, 33, 35, 36]
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install emulator runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0 libxcb-cursor0
          ldconfig -p | grep 'libpulse.so.0'
          dpkg -s libxcb-cursor0 | grep '^Status: install ok installed$'

      - name: Download v3.12.3 app APK
        uses: actions/download-artifact@v4
        with:
          name: CellBiologyLearningHub-v3.12.3-debug-apk
          path: artifacts/app

      - name: Download v3.12.3 instrumentation APK
        uses: actions/download-artifact@v4
        with:
          name: CellBiologyLearningHub-v3.12.3-androidTest-apk
          path: artifacts/test

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare atomic validation script
        run: |
          cat > /tmp/cellbio-v3123-validation.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          API="$1"
          cd "$GITHUB_WORKSPACE"
          mkdir -p validation-output
          cleanup() {
            adb exec-out screencap -p > "validation-output/failure-api-${API}.png" 2>/dev/null || true
            adb logcat -d > "validation-output/logcat-api-${API}.txt" 2>/dev/null || true
          }
          trap cleanup EXIT
          APP_APK=$(find artifacts/app -name '*.apk' -print -quit)
          TEST_APK=$(find artifacts/test -name '*.apk' -print -quit)
          test -n "$APP_APK"; test -n "$TEST_APK"
          sha256sum "$APP_APK" "$TEST_APK" | tee "validation-output/apk-sha256-api-${API}.txt"
          adb shell getprop ro.build.version.release | tee "validation-output/android-release-api-${API}.txt"
          adb shell getprop ro.build.version.sdk | tee "validation-output/android-sdk-api-${API}.txt"
          adb install -r "$APP_APK"
          adb install -r "$TEST_APK"
          PKG=in.gov.tn.gascngl.zoology.cellbiology
          TESTPKG=in.gov.tn.gascngl.zoology.cellbiology.test
          RUNNER=androidx.test.runner.AndroidJUnitRunner
          CLASS=in.gov.tn.gascngl.zoology.cellbiology.MainActivitySmokeTest
          adb shell pm list instrumentation | tee "validation-output/instrumentation-api-${API}.txt"
          if [ "$API" -ge 33 ]; then
            adb shell cmd overlay enable-exclusive --category com.android.internal.systemui.navbar.gestural || adb shell cmd overlay enable com.android.internal.systemui.navbar.gestural || true
            adb shell cmd overlay list | grep -i navbar | tee "validation-output/navbar-api-${API}.txt" || true
          fi
          run_test() {
            METHOD="$1"; shift
            OUT="validation-output/api-${API}-${METHOD}-$(date +%s%N).txt"
            echo "===== API ${API} :: ${METHOD} $* ====="
            set +e
            adb shell am instrument -w -r "$@" -e class "$CLASS#$METHOD" "$TESTPKG/$RUNNER" | tee "$OUT"
            RC=${PIPESTATUS[0]}
            set -e
            if [ "$RC" -ne 0 ] || grep -q 'FAILURES!!!' "$OUT" || ! grep -Eq 'OK \(1 test\)|INSTRUMENTATION_CODE: -1' "$OUT"; then
              echo "FAILED: ${METHOD} on API ${API}" | tee -a "$OUT"
              return 1
            fi
            echo "PASSED: ${METHOD} on API ${API}" | tee -a "$OUT"
          }
          run_test launchesOfflineHardenedWebView
          run_test bootTamilThemeAndResponsiveLayout -e cbilSize 360x800 -e cbilDensity 320 -e cbilOrientation portrait
          run_test bootTamilThemeAndResponsiveLayout -e cbilSize 800x360 -e cbilDensity 320 -e cbilOrientation landscape
          run_test bootTamilThemeAndResponsiveLayout -e cbilSize 600x960 -e cbilDensity 160 -e cbilOrientation portrait
          run_test bootTamilThemeAndResponsiveLayout -e cbilSize 960x600 -e cbilDensity 160 -e cbilOrientation landscape
          run_test bootTamilThemeAndResponsiveLayout -e cbilSize 800x1280 -e cbilDensity 160 -e cbilOrientation portrait
          run_test bootTamilThemeAndResponsiveLayout -e cbilSize 1280x800 -e cbilDensity 160 -e cbilOrientation landscape
          run_test nativeBackReturnsToPreviousSection
          run_test printFlowOpensAndroidPrintUi
          run_test exportFlowOpensCreateDocumentPicker
          run_test importFlowOpensOpenDocumentPicker
          run_test persistencePhase1StoresMarker
          adb shell am force-stop "$PKG"
          sleep 1
          run_test persistencePhase2ReadsMarker
          adb exec-out screencap -p > "validation-output/final-api-${API}.png" || true
          adb logcat -d > "validation-output/logcat-api-${API}.txt" || true
          trap - EXIT
          echo "ALL VALIDATIONS PASSED ON API ${API}" | tee "validation-output/PASS-api-${API}.txt"
          BASH
          chmod +x /tmp/cellbio-v3123-validation.sh
          bash -n /tmp/cellbio-v3123-validation.sh

      - name: Android ${{ matrix.api }} validation
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -gpu swiftshader_indirect -no-metrics
          script: bash /tmp/cellbio-v3123-validation.sh ${{ matrix.api }}

      - name: Upload API ${{ matrix.api }} evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CellBiology-v3.12.3-api-${{ matrix.api }}-validation
          path: validation-output
          if-no-files-found: ignore
