name: Cell Biology v3.12.2 Canonical Validation

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'Cell-Biology-Android/**'
      - '.github/workflows/cell-biology-v3122-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct base v3.12.1 source
        run: |
          test "$(find Cell-Biology-Android/source-parts -maxdepth 1 -name 'part-*.b64' | wc -l)" -eq 18
          cat Cell-Biology-Android/source-parts/part-*.b64 | base64 --decode > /tmp/cellbio-v3121.tar.xz
          echo 'c33c32242d9fffeff167f19f073d8335292eba3f042b199ad2fc055fd2cdfe0c  /tmp/cellbio-v3121.tar.xz' | sha256sum -c -

      - name: Reconstruct and identify v3.12.2 patch
        run: |
          test "$(find Cell-Biology-Android/v3122-patch -maxdepth 1 -name 'p*.b64' | wc -l)" -eq 5
          cat Cell-Biology-Android/v3122-patch/p*.b64 | base64 --decode > /tmp/cellbio-v3122-patch.xz
          echo '010f87b9bc05f2e57852246aa3070878379fa1eb981bf861b3b4110705722216  /tmp/cellbio-v3122-patch.xz' | sha256sum -c -
          xz -t /tmp/cellbio-v3122-patch.xz
          xz -dc /tmp/cellbio-v3122-patch.xz > /tmp/cellbio-v3122-patch.payload
          echo '--- payload type ---'
          file /tmp/cellbio-v3122-patch.payload
          echo '--- first 120 lines ---'
          head -n 120 /tmp/cellbio-v3122-patch.payload
          echo '--- marker scan ---'
          grep -n -m 30 '3.12.2\|__CBIL_CARROW__\|UiDevice.swipe\|MainActivitySmokeTest\|build.gradle' /tmp/cellbio-v3122-patch.payload || true
