name: Cell Biology v3.12.3 Canonical Build Gate

on:
  push:
    branches: [ cell-biology-v3.12.3-release-gate ]
    paths:
      - 'Cell-Biology-Android/**'
      - '.github/workflows/cell-biology-v3123-release-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare and verify canonical v3.12.3 source
        run: |
          set -euo pipefail
          PREP='Cell-Biology-Android/v3123-final/prepare_v3123.sh'
          test "$(git hash-object "$PREP")" = '17d8e4d4afe6fca9e30823398d1a12e7fd1c546c'
          sha256sum "$PREP"
          chmod +x "$PREP"
          bash -n "$PREP"
          "$PREP"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Unit test, lint and assemble APKs
        working-directory: Cell-Biology-Android/work-v3123/CellBiologyAndroid-v3.12.3
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Record APK SHA-256
        working-directory: Cell-Biology-Android/work-v3123/CellBiologyAndroid-v3.12.3
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk \
                    app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk | tee apk-sha256.txt

      - name: Upload app APK
        uses: actions/upload-artifact@v7
        with:
          name: CellBiologyLearningHub-v3.12.3-release-gate-app
          path: Cell-Biology-Android/work-v3123/CellBiologyAndroid-v3.12.3/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload instrumentation APK
        uses: actions/upload-artifact@v7
        with:
          name: CellBiologyLearningHub-v3.12.3-release-gate-test
          path: Cell-Biology-Android/work-v3123/CellBiologyAndroid-v3.12.3/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload APK hashes
        uses: actions/upload-artifact@v7
        with:
          name: CellBiologyLearningHub-v3.12.3-apk-sha256
          path: Cell-Biology-Android/work-v3123/CellBiologyAndroid-v3.12.3/apk-sha256.txt
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CellBiologyLearningHub-v3.12.3-release-gate-lint
          path: Cell-Biology-Android/work-v3123/CellBiologyAndroid-v3.12.3/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
