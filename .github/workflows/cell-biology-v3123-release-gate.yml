name: Cell Biology v3.12.3 Release Gate

on:
  push:
    branches: [ cell-biology-v3.12.3-release-gate ]
    paths:
      - 'Cell-Biology-Android/**'
      - '.github/workflows/cell-biology-v3123-release-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare and verify canonical v3.12.3 source
        run: |
          set -euo pipefail
          echo 'd3ad78a9f4e81ab59e76b9d5caf2fa28bb06448d040ae10c9269676fbe7625b4  Cell-Biology-Android/v3123-final/prepare_v3123.sh' | sha256sum -c -
          chmod +x Cell-Biology-Android/v3123-final/prepare_v3123.sh
          bash -n Cell-Biology-Android/v3123-final/prepare_v3123.sh
          Cell-Biology-Android/v3123-final/prepare_v3123.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Unit test, lint and assemble APKs
        working-directory: Cell-Biology-Android/work-v3123/CellBiologyAndroid-v3.12.3
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Upload app APK
        uses: actions/upload-artifact@v7
        with:
          name: CellBiologyLearningHub-v3.12.3-release-gate-app
          path: Cell-Biology-Android/work-v3123/CellBiologyAndroid-v3.12.3/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload instrumentation APK
        uses: actions/upload-artifact@v7
        with:
          name: CellBiologyLearningHub-v3.12.3-release-gate-test
          path: Cell-Biology-Android/work-v3123/CellBiologyAndroid-v3.12.3/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CellBiologyLearningHub-v3.12.3-release-gate-lint
          path: Cell-Biology-Android/work-v3123/CellBiologyAndroid-v3.12.3/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api: [24, 26, 33, 35, 36]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install emulator runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0 libxcb-cursor0

      - name: Download app APK
        uses: actions/download-artifact@v4
        with:
          name: CellBiologyLearningHub-v3.12.3-release-gate-app
          path: artifacts/app

      - name: Download instrumentation APK
        uses: actions/download-artifact@v4
        with:
          name: CellBiologyLearningHub-v3.12.3-release-gate-test
          path: artifacts/test

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify validation harness
        run: |
          echo '733f8f17b03bb06d1b23ffae2588cfb53ebf920c70ba625bd03bb67318e7b8b2  Cell-Biology-Android/v3123-final/validate_emulator.sh' | sha256sum -c -
          chmod +x Cell-Biology-Android/v3123-final/validate_emulator.sh
          bash -n Cell-Biology-Android/v3123-final/validate_emulator.sh

      - name: Android ${{ matrix.api }} validation
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -gpu swiftshader_indirect -no-metrics
          script: bash "$GITHUB_WORKSPACE/Cell-Biology-Android/v3123-final/validate_emulator.sh" ${{ matrix.api }}

      - name: Upload API ${{ matrix.api }} evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CellBiology-v3.12.3-release-gate-api-${{ matrix.api }}
          path: validation-output
          if-no-files-found: ignore
