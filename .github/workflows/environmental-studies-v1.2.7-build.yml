name: Environmental Studies v1.2.7 Conservative WebView Build

on:
  push:
    branches:
      - environmental-studies-v1.2.7-build
    paths:
      - 'tools/apply-v1.2.7-conservative-webview-fix.py'
      - '.github/workflows/environmental-studies-v1.2.7-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify v1.2.5 source archive
        shell: bash
        run: |
          test -f Environmental-Studies-Android-v1.2.5-Mobile-Reader-Fixed.zip
          echo '2e8da19d768b116362493e1cd47c19fd951d4a9d4d64755f12ff4261f073ce9f  Environmental-Studies-Android-v1.2.5-Mobile-Reader-Fixed.zip' | sha256sum -c -

      - name: Extract source
        shell: bash
        run: |
          rm -rf build-source
          mkdir build-source
          unzip -q Environmental-Studies-Android-v1.2.5-Mobile-Reader-Fixed.zip -d build-source

      - name: Apply v1.2.6 base handset correction
        run: python tools/apply-v1.2.6-handset-fix.py

      - name: Apply v1.2.7 conservative interaction correction
        run: python tools/apply-v1.2.7-conservative-webview-fix.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install verifier dependencies
        working-directory: build-source/Environmental-Sciences-Android
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt

      - name: Verify content integrity
        working-directory: build-source/Environmental-Sciences-Android
        run: python tools/verify_content_integrity.py

      - name: Verify interaction blocker removed
        working-directory: build-source/Environmental-Sciences-Android
        shell: bash
        run: |
          grep -q 'v1.2.7 conservative Android WebView reader' app/src/main/assets/index.html
          ! grep -q "closest?.('.book-toolbar'))e.preventDefault" app/src/main/assets/index.html
          ! grep -q "br.addEventListener('touchstart'" app/src/main/assets/index.html
          ! grep -q "br.addEventListener('touchend'" app/src/main/assets/index.html
          grep -q "bookLangTa',()=>setLang('ta')" app/src/main/assets/index.html
          grep -q 'setUseWideViewPort(true)' app/src/main/java/edu/gascnagercoil/environmentalsciences/MainActivity.java
          grep -q 'versionCode 10207' app/build.gradle
          grep -q "versionName '1.2.7'" app/build.gradle

      - name: Build test and lint
        working-directory: build-source/Environmental-Sciences-Android
        run: gradle --no-daemon clean lint test assembleDebug bundleRelease

      - name: Verify outputs
        working-directory: build-source/Environmental-Sciences-Android
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/bundle/release/app-release.aab

      - name: Upload v1.2.7 artifact
        uses: actions/upload-artifact@v4
        with:
          name: environmental-studies-v1.2.7-build
          if-no-files-found: error
          retention-days: 30
          path: |
            build-source/Environmental-Sciences-Android/app/build/outputs/apk/debug/app-debug.apk
            build-source/Environmental-Sciences-Android/app/build/outputs/bundle/release/app-release.aab
            build-source/Environmental-Sciences-Android/app/build/reports/lint-results-debug.html
