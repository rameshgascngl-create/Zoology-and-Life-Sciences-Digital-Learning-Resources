name: Cell Biology v3.12.4 Release Packaging

on:
  push:
    branches: [ cell-biology-v3.12.4-icon ]
    paths:
      - '.github/workflows/cell-biology-v3124-release-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reconstruct verified v3.12.3 source
        run: |
          set -euo pipefail
          PREP='Cell-Biology-Android/v3123-final/prepare_v3123.sh'
          chmod +x "$PREP"
          "$PREP"

      - name: Apply generated launcher icon and v3.12.4 identity
        run: |
          set -euo pipefail
          PROJECT='Cell-Biology-Android/work-v3123/CellBiologyAndroid-v3.12.3'
          PAYLOAD='Cell-Biology-Android/v3124-icon/cell_app_icon.webp.b64'
          SCRIPT='Cell-Biology-Android/v3124-icon/apply_icon_v3124.py'
          base64 --decode "$PAYLOAD" > /tmp/cell_app_icon.webp
          echo 'eee78833c0b3bc651819c016470bb0b97dd86e2ce63a9bb532cb3375fa139025  /tmp/cell_app_icon.webp' | sha256sum -c -
          python "$SCRIPT" "$PROJECT" "$PAYLOAD"
          grep -q 'versionCode = 31204' "$PROJECT/app/build.gradle.kts"
          grep -q 'versionName = "3.12.4"' "$PROJECT/app/build.gradle.kts"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Build unsigned release APK and AAB
        working-directory: Cell-Biology-Android/work-v3123/CellBiologyAndroid-v3.12.3
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease :app:bundleRelease --stacktrace
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print

      - name: Verify release metadata and signing state
        working-directory: Cell-Biology-Android/work-v3123/CellBiologyAndroid-v3.12.3
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' -print -quit)
          test -n "$APK"
          test -n "$AAB"
          aapt dump badging "$APK" | tee release-badging.txt
          grep -q "package: name='in.gov.tn.gascngl.zoology.cellbiology'" release-badging.txt
          grep -q "versionCode='31204'" release-badging.txt
          grep -q "versionName='3.12.4'" release-badging.txt
          sha256sum "$APK" "$AAB" | tee release-sha256.txt
          if apksigner verify "$APK"; then
            echo 'Unexpected: release APK is signed' >&2
            exit 1
          else
            echo 'Confirmed: release APK is unsigned and requires the existing production/upload key.' | tee release-signing-status.txt
          fi
          cp "$APK" CellBiologyLearningHub-v3.12.4-release-UNSIGNED.apk
          cp "$AAB" CellBiologyLearningHub-v3.12.4-release-UNSIGNED.aab

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v7
        with:
          name: CellBiologyLearningHub-v3.12.4-release-UNSIGNED-APK
          path: Cell-Biology-Android/work-v3123/CellBiologyAndroid-v3.12.3/CellBiologyLearningHub-v3.12.4-release-UNSIGNED.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v7
        with:
          name: CellBiologyLearningHub-v3.12.4-release-UNSIGNED-AAB
          path: Cell-Biology-Android/work-v3123/CellBiologyAndroid-v3.12.3/CellBiologyLearningHub-v3.12.4-release-UNSIGNED.aab
          if-no-files-found: error
          compression-level: 0

      - name: Upload release evidence
        uses: actions/upload-artifact@v7
        with:
          name: CellBiologyLearningHub-v3.12.4-release-evidence
          path: |
            Cell-Biology-Android/work-v3123/CellBiologyAndroid-v3.12.3/release-badging.txt
            Cell-Biology-Android/work-v3123/CellBiologyAndroid-v3.12.3/release-sha256.txt
            Cell-Biology-Android/work-v3123/CellBiologyAndroid-v3.12.3/release-signing-status.txt
          if-no-files-found: error
