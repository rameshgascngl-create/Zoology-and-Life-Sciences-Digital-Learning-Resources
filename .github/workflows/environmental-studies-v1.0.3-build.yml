name: Environmental Studies v1.0.3 Android Build

on:
  push:
    branches:
      - environmental-sciences-android
    paths:
      - '.build/environmental-studies-v1.0.3-source.zip'
      - '.github/workflows/environmental-studies-v1.0.3-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify exact source archive
        shell: bash
        run: |
          set -euo pipefail
          echo "d2805de2b6f0eabfe247f3304250272f879cfec12dcf144734dc2f119210f2f8  .build/environmental-studies-v1.0.3-source.zip" | sha256sum -c -
          rm -rf /tmp/environmental-studies-build
          unzip -q .build/environmental-studies-v1.0.3-source.zip -d /tmp/environmental-studies-build
          test -f /tmp/environmental-studies-build/Environmental-Sciences-Android/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Audit release configuration
        working-directory: /tmp/environmental-studies-build/Environmental-Sciences-Android
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'edu.gascnagercoil.environmentalsciences'" app/build.gradle
          grep -q "versionCode 10003" app/build.gradle
          grep -q "versionName '1.0.3'" app/build.gradle
          grep -q "targetSdk 36" app/build.gradle
          if grep -R "android.permission.INTERNET" app/src/main/AndroidManifest.xml; then
            echo "Unexpected INTERNET permission found" >&2
            exit 1
          fi

      - name: Lint, test and build
        working-directory: /tmp/environmental-studies-build/Environmental-Sciences-Android
        run: gradle --no-daemon clean lint test assembleDebug bundleRelease

      - name: Verify build outputs
        working-directory: /tmp/environmental-studies-build/Environmental-Sciences-Android
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/bundle/release/app-release.aab

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: environmental-studies-v1.0.3-debug-apk
          path: /tmp/environmental-studies-build/Environmental-Sciences-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: environmental-studies-v1.0.3-unsigned-release-aab
          path: /tmp/environmental-studies-build/Environmental-Sciences-Android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environmental-studies-v1.0.3-lint-report
          path: /tmp/environmental-studies-build/Environmental-Sciences-Android/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
