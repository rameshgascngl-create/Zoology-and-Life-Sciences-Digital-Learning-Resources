name: Environmental Studies Android Build Probe

on:
  push:
    branches:
      - environmental-studies-build-fix
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          set -e
          ZIP_FILE=$(find .build -maxdepth 1 -type f -name 'Environmental-Studies-Android-Source-v1.0.9-Scroll-Reliability-Hotfix*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          echo "Using: $ZIP_FILE"
          rm -rf /tmp/es
          mkdir -p /tmp/es
          unzip "$ZIP_FILE" -d /tmp/es
          find /tmp/es -name "settings.gradle*" -print

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build
        run: |
          set -e
          SETTINGS_FILE=$(find /tmp/es -type f -name "settings.gradle" | head -n 1)
          test -n "$SETTINGS_FILE"
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Project: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon clean lint test assembleDebug bundleRelease

      - name: Collect outputs
        run: |
          set -e
          mkdir -p /tmp/output
          APK=$(find /tmp/es -type f -name "app-debug.apk" | head -n 1)
          AAB=$(find /tmp/es -type f -name "app-release.aab" | head -n 1)
          LINT=$(find /tmp/es -type f -name "lint-results-debug.html" | head -n 1)
          test -n "$APK"
          test -n "$AAB"
          test -n "$LINT"
          cp "$APK" /tmp/output/Environmental-Studies-v1.0.9-debug.apk
          cp "$AAB" /tmp/output/Environmental-Studies-v1.0.9-release.aab
          cp "$LINT" /tmp/output/lint-results-debug.html
          sha256sum /tmp/output/Environmental-Studies-v1.0.9-debug.apk
          sha256sum /tmp/output/Environmental-Studies-v1.0.9-release.aab

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: environmental-studies-v1.0.9-build
          path: /tmp/output/
