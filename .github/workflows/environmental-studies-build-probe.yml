name: Environmental Studies Android Build Probe

on:
  push:
    branches: [environmental-studies-build-fix]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p /tmp/es
          unzip ".build/Environmental-Studies-Android-Source-v1.0.9-Scroll-Reliability-Hotfix (1).zip" -d /tmp/es

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build
        working-directory: /tmp/es/Environmental-Sciences-Android
        run: gradle --no-daemon clean lint test assembleDebug bundleRelease

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: environmental-studies-v1.0.9-build
          path: |
            /tmp/es/Environmental-Sciences-Android/app/build/outputs/apk/debug/app-debug.apk
            /tmp/es/Environmental-Sciences-Android/app/build/outputs/bundle/release/app-release.aab
            /tmp/es/Environmental-Sciences-Android/app/build/reports/lint-results-debug.html
