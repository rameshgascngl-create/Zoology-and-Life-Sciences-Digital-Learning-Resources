name: Invertebrate Lab v1.0.3 GitHub Build

on:
  push:
    branches: [ invertebrate-lab-v1.0.3-build ]
    paths:
      - '.github/workflows/invertebrate-lab-v1.0.3-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Reconstruct audited native shell
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rebuild/app/src/main/java/com/gasczoology/invertebratelab
          mkdir -p rebuild/app/src/main/assets/www
          mkdir -p rebuild/app/src/main/res/drawable
          mkdir -p rebuild/app/src/main/res/values
          mkdir -p rebuild/app/src/main/res/xml

          cat > rebuild/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "InvertebrateLab"
          include(":app")
          EOF

          cat > rebuild/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > rebuild/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat > rebuild/app/build.gradle.kts <<'EOF'
          import java.util.Properties

          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          val keystorePropertiesFile = rootProject.file("keystore.properties")
          val keystoreProperties = Properties()
          if (keystorePropertiesFile.exists()) {
              keystorePropertiesFile.inputStream().use { keystoreProperties.load(it) }
          }

          android {
              namespace = "com.gasczoology.invertebratelab"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.gasczoology.invertebratelab"
                  minSdk = 24
                  targetSdk = 36
                  versionCode = 103
                  versionName = "1.0.3"
              }

              signingConfigs {
                  if (keystorePropertiesFile.exists()) {
                      create("release") {
                          storeFile = rootProject.file(keystoreProperties.getProperty("storeFile"))
                          storePassword = keystoreProperties.getProperty("storePassword")
                          keyAlias = keystoreProperties.getProperty("keyAlias")
                          keyPassword = keystoreProperties.getProperty("keyPassword")
                      }
                  }
              }

              buildTypes {
                  debug {
                      isDebuggable = true
                      applicationIdSuffix = ".debug"
                      versionNameSuffix = "-debug"
                  }
                  release {
                      isDebuggable = false
                      isMinifyEnabled = false
                      isShrinkResources = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                      if (keystorePropertiesFile.exists()) {
                          signingConfig = signingConfigs.getByName("release")
                      }
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  buildConfig = false
              }
          }

          dependencies {
              implementation("androidx.webkit:webkit:1.12.1")
              implementation("androidx.activity:activity-ktx:1.9.3")
          }
          EOF

          cat > rebuild/app/proguard-rules.pro <<'EOF'
          # Offline WebView lab — no JS bridge. Keep default Android rules only.
          # If a JavascriptInterface is added later, keep those methods explicitly.
          EOF

          cat > rebuild/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Intentionally no INTERNET / STORAGE / CAMERA permissions. -->

              <application
                  android:allowBackup="false"
                  android:fullBackupContent="false"
                  android:dataExtractionRules="@xml/data_extraction_rules"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:usesCleartextTraffic="false"
                  android:extractNativeLibs="false"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.InvertebrateLab">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode|density|smallestScreenSize"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > rebuild/app/src/main/java/com/gasczoology/invertebratelab/MainActivity.kt <<'EOF'
          package com.gasczoology.invertebratelab

          import android.annotation.SuppressLint
          import android.graphics.Color
          import android.os.Bundle
          import android.view.View
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebView
          import androidx.activity.ComponentActivity
          import androidx.activity.OnBackPressedCallback
          import androidx.webkit.WebViewAssetLoader
          import androidx.webkit.WebViewClientCompat

          class MainActivity : ComponentActivity() {

              private lateinit var webView: WebView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  webView = WebView(this).apply {
                      setBackgroundColor(Color.WHITE)
                      overScrollMode = View.OVER_SCROLL_NEVER
                  }
                  setContentView(webView)

                  val assetLoader = WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", WebViewAssetLoader.AssetsPathHandler(this))
                      .build()

                  webView.webViewClient = object : WebViewClientCompat() {
                      override fun shouldInterceptRequest(
                          view: WebView,
                          request: WebResourceRequest
                      ): WebResourceResponse? = assetLoader.shouldInterceptRequest(request.url)

                      override fun shouldOverrideUrlLoading(
                          view: WebView,
                          request: WebResourceRequest
                      ): Boolean {
                          val url = request.url.toString()
                          val allowed = url.startsWith(ASSET_ORIGIN) || url.startsWith("about:blank")
                          return !allowed
                      }
                  }
                  webView.webChromeClient = WebChromeClient()

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      allowFileAccess = false
                      allowContentAccess = false
                      allowFileAccessFromFileURLs = false
                      allowUniversalAccessFromFileURLs = false
                      mediaPlaybackRequiresUserGesture = false
                      builtInZoomControls = true
                      displayZoomControls = false
                      javaScriptCanOpenWindowsAutomatically = false
                      loadsImagesAutomatically = true
                      setSupportZoom(true)
                  }

                  onBackPressedDispatcher.addCallback(
                      this,
                      object : OnBackPressedCallback(true) {
                          override fun handleOnBackPressed() {
                              if (webView.canGoBack()) {
                                  webView.evaluateJavascript(HOME_JS, null)
                                  webView.goBack()
                              } else {
                                  isEnabled = false
                                  onBackPressedDispatcher.onBackPressed()
                              }
                          }
                      }
                  )

                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState)
                  } else {
                      webView.loadUrl(START_URL)
                  }
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  super.onSaveInstanceState(outState)
                  webView.saveState(outState)
              }

              override fun onDestroy() {
                  webView.apply {
                      stopLoading()
                      loadUrl("about:blank")
                      destroy()
                  }
                  super.onDestroy()
              }

              companion object {
                  private const val ASSET_ORIGIN = "https://appassets.androidplatform.net/"
                  private const val START_URL =
                      "https://appassets.androidplatform.net/assets/www/index.html"
                  private const val HOME_JS =
                      "(function(){var b=document.getElementById('invMenuHome');if(b){b.click();}else{window.scrollTo(0,0);}})()"
              }
          }
          EOF

          cat > rebuild/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Invertebrate Virtual Laboratory</string>
          </resources>
          EOF

          cat > rebuild/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="launcher_bg">#0F2C4C</color>
              <color name="launcher_ink">#E8F4FF</color>
              <color name="launcher_accent">#5CB3FF</color>
          </resources>
          EOF

          cat > rebuild/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.InvertebrateLab" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">#0F2C4C</item>
                  <item name="android:navigationBarColor">#0F2C4C</item>
                  <item name="android:windowBackground">#FFFFFF</item>
              </style>
          </resources>
          EOF

          cat > rebuild/app/src/main/res/xml/data_extraction_rules.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <cloud-backup>
                  <exclude domain="root" path="." />
              </cloud-backup>
              <device-transfer>
                  <exclude domain="root" path="." />
              </device-transfer>
          </data-extraction-rules>
          EOF

          cat > rebuild/app/src/main/res/xml/network_security_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="false">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

          cat > rebuild/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="@color/launcher_bg" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#00000000" android:strokeColor="@color/launcher_accent" android:strokeWidth="2.2" android:pathData="M54,9a45,45 0,1 0,0 90a45,45 0,1 0,0 -90" />
              <path android:fillColor="@color/launcher_ink" android:pathData="M54,21 C58,21 60,32 61,39 C62,43 64,44 68,42 C75,38 88,33 90,37 C92,41 80,51 74,56 C71,59 71,61 74,64 C80,70 89,83 85,86 C81,89 68,79 62,73 C59,70 57,71 56,75 C54,82 51,96 46,95 C41,94 42,79 43,72 C44,68 42,66 38,68 C31,72 17,79 15,74 C13,69 27,61 34,57 C38,55 38,52 34,50 C28,46 16,37 19,33 C22,29 35,36 42,40 C46,42 48,41 49,37 C51,30 50,21 54,21Z" />
              <path android:fillColor="#00000000" android:strokeColor="@color/launcher_bg" android:strokeWidth="1.6" android:pathData="M54,45a11,11 0,1 0,0 22a11,11 0,1 0,0 -22" />
              <path android:fillColor="@color/launcher_accent" android:pathData="M56,54a2.4,2.4 0,1 0,0 4.8a2.4,2.4 0,1 0,0 -4.8" />
          </vector>
          EOF

          cat > rebuild/app/src/main/assets/www/index.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invertebrate Virtual Laboratory</title></head><body><h1>Invertebrate Virtual Laboratory</h1><p>CI native-shell build. Full educational assets are inserted after compilation.</p></body></html>
          EOF

      - name: Verify source invariants
        working-directory: rebuild
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.gasczoology.invertebratelab"' app/build.gradle.kts
          grep -q 'versionCode = 103' app/build.gradle.kts
          grep -q 'versionName = "1.0.3"' app/build.gradle.kts
          grep -q 'minSdk = 24' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          ! grep -q 'addJavascriptInterface' app/src/main/java/com/gasczoology/invertebratelab/MainActivity.kt
          grep -q 'WebViewAssetLoader' app/src/main/java/com/gasczoology/invertebratelab/MainActivity.kt
          grep -q 'allowFileAccess = false' app/src/main/java/com/gasczoology/invertebratelab/MainActivity.kt

      - name: Lint and build debug plus unsigned release
        working-directory: rebuild
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:lintDebug :app:assembleDebug :app:assembleRelease --stacktrace
          find app/build/outputs -type f -name '*.apk' -print

      - name: Verify APK metadata and permissions
        working-directory: rebuild
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$DEBUG_APK"
          test -f "$RELEASE_APK"
          "$AAPT" dump badging "$DEBUG_APK" | tee debug-badging.txt
          "$AAPT" dump badging "$RELEASE_APK" | tee release-badging.txt
          grep -q "package: name='com.gasczoology.invertebratelab.debug'" debug-badging.txt
          grep -q "versionCode='103'" debug-badging.txt
          grep -q "versionName='1.0.3-debug'" debug-badging.txt
          grep -q "package: name='com.gasczoology.invertebratelab'" release-badging.txt
          grep -q "versionCode='103'" release-badging.txt
          grep -q "versionName='1.0.3'" release-badging.txt
          "$AAPT" dump permissions "$DEBUG_APK" | tee debug-permissions.txt
          "$AAPT" dump permissions "$RELEASE_APK" | tee release-permissions.txt
          ! grep -q 'android.permission.INTERNET' debug-permissions.txt
          ! grep -q 'android.permission.INTERNET' release-permissions.txt
          ! grep -Eq 'CAMERA|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|RECORD_AUDIO|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION' debug-permissions.txt
          sha256sum "$DEBUG_APK" "$RELEASE_APK" | tee apk-sha256.txt

      - name: Upload debug shell APK
        uses: actions/upload-artifact@v7
        with:
          name: InvertebrateLab-v1.0.3-debug-shell
          path: rebuild/app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
          if-no-files-found: error

      - name: Upload unsigned release shell APK
        uses: actions/upload-artifact@v7
        with:
          name: InvertebrateLab-v1.0.3-release-unsigned-shell
          path: rebuild/app/build/outputs/apk/release/app-release-unsigned.apk
          compression-level: 0
          if-no-files-found: error

      - name: Upload build evidence
        uses: actions/upload-artifact@v7
        with:
          name: InvertebrateLab-v1.0.3-build-evidence
          path: |
            rebuild/debug-badging.txt
            rebuild/release-badging.txt
            rebuild/debug-permissions.txt
            rebuild/release-permissions.txt
            rebuild/apk-sha256.txt
            rebuild/app/build/reports/lint-results-debug.html
          if-no-files-found: error
