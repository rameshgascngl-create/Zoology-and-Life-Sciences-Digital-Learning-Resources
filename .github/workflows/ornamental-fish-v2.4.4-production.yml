name: Ornamental Fish v2.4.4 Production Release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_ZIP: OrnamentalFish-v2.4.4-PRIVACY-CORRECTION-SOURCE.zip
  SOURCE_SHA256: 311da22c98bcc0555480730d19d59691b4ccd0ddd291de569852350d10122682
  EXPECTED_CERT_SHA256: A0FCF7B98242E4652793EF686D94EE30D3309EEF56EB0697993D32159BA74B7F
  BUILD_TOOLS_VERSION: 36.0.0
  SRC_DIR: ornamental-fish-v244-src

jobs:
  signed-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Verify exact correction source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP" || {
            echo "::error::Missing $SOURCE_ZIP at repository root"
            exit 1
          }
          echo "$SOURCE_SHA256  $SOURCE_ZIP" | sha256sum -c -
          rm -rf "$SRC_DIR"
          mkdir -p "$SRC_DIR"
          unzip -q "$SOURCE_ZIP" -d "$SRC_DIR"

      - name: Verify frozen application identity and academic payload
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.tnfisheries.ornamental'" "$SRC_DIR/app/build.gradle"
          grep -q "versionCode 244" "$SRC_DIR/app/build.gradle"
          grep -q "versionName '2.4.4'" "$SRC_DIR/app/build.gradle"
          grep -q "targetSdk 36" "$SRC_DIR/app/build.gradle"
          ! grep -Rqs "android.permission.INTERNET" "$SRC_DIR/app/src/main/AndroidManifest.xml"
          test -f "$SRC_DIR/app/src/main/assets/privacy-policy.html"
          grep -Rqs "ornamental-fish-science/privacy-policy.html" "$SRC_DIR/app/src/main/assets"
          (
            cd "$SRC_DIR/app/src/main"
            sha256sum -c ../../../release-evidence/ACADEMIC_PAYLOAD_SHA256_v2.4.3.txt
          )
          echo "SOURCE / ACADEMIC PAYLOAD GATE: PASS"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 36 build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' "build-tools;$BUILD_TOOLS_VERSION"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore established production keystore
        shell: bash
        env:
          OFISH_KEYSTORE_BASE64: ${{ secrets.OFISH_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${OFISH_KEYSTORE_BASE64:-}" || {
            echo "::error::Missing OFISH_KEYSTORE_BASE64"
            exit 1
          }
          printf '%s' "$OFISH_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ornamental-release.jks"
          chmod 600 "$RUNNER_TEMP/ornamental-release.jks"

      - name: Build signed v2.4.4 release
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        env:
          OFISH_KEYSTORE_FILE: ${{ runner.temp }}/ornamental-release.jks
          OFISH_KEYSTORE_PASSWORD: ${{ secrets.OFISH_KEYSTORE_PASSWORD }}
          OFISH_KEY_ALIAS: ${{ secrets.OFISH_KEY_ALIAS }}
          OFISH_KEY_PASSWORD: ${{ secrets.OFISH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for n in OFISH_KEYSTORE_PASSWORD OFISH_KEY_ALIAS OFISH_KEY_PASSWORD; do
            test -n "${!n:-}" || { echo "::error::Missing signing secret: $n"; exit 1; }
          done
          gradle --no-daemon clean :app:assembleRelease

      - name: Verify final APK identity, signing continuity and security
        shell: bash
        run: |
          set -euo pipefail
          APK="$SRC_DIR/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          AAPT2="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2"

          test -f "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee release-signing.txt

          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' release-signing.txt | tr -d ':' | tr '[:lower:]' '[:upper:]' | head -1)"
          test "$CERT" = "$EXPECTED_CERT_SHA256" || {
            echo "::error::SIGNING CONTINUITY FAIL. Actual certificate: $CERT"
            exit 1
          }

          "$AAPT2" dump badging "$APK" | tee release-badging.txt
          grep -q "package: name='com.tnfisheries.ornamental' versionCode='244' versionName='2.4.4'" release-badging.txt
          grep -q "sdkVersion:'24'" release-badging.txt
          grep -q "targetSdkVersion:'36'" release-badging.txt
          if grep -q "uses-permission: name='android.permission.INTERNET'" release-badging.txt; then
            echo "::error::Unexpected INTERNET permission"
            exit 1
          fi

          unzip -l "$APK" | tee release-apk-contents.txt
          grep -q "assets/privacy-policy.html" release-apk-contents.txt
          grep -q "assets/data/species.json" release-apk-contents.txt
          grep -q "assets/data/book.json" release-apk-contents.txt
          grep -q "assets/data/quiz.json" release-apk-contents.txt
          grep -q "assets/data/labs.json" release-apk-contents.txt

          cp "$APK" OrnamentalFish-v2.4.4-STORE-READY.apk
          sha256sum OrnamentalFish-v2.4.4-STORE-READY.apk | tee release-sha256.txt

          {
            echo "applicationId=com.tnfisheries.ornamental"
            echo "versionName=2.4.4"
            echo "versionCode=244"
            echo "expectedCertificateSHA256=$EXPECTED_CERT_SHA256"
            echo "privacyPolicy=https://rameshgascngl-create.github.io/Zoology-and-Life-Sciences-Digital-Learning-Resources/ornamental-fish-science/privacy-policy.html"
          } > release-gate-summary.txt

          echo "PRODUCTION RELEASE GATE: PASS"

      - uses: actions/upload-artifact@v4
        with:
          name: OrnamentalFish-v2.4.4-STORE-READY
          path: |
            OrnamentalFish-v2.4.4-STORE-READY.apk
            release-signing.txt
            release-badging.txt
            release-apk-contents.txt
            release-sha256.txt
            release-gate-summary.txt
          if-no-files-found: error
          retention-days: 30
