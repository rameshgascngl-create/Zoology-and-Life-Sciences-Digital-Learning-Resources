n genomics.","difficulty":"Foundation","cognitive":"Concept","topic":"Human Genome Project"},{"id":"unit2-mcq-20","unit":"unit2","q":"Which prenatal diagnostic procedure can generally be performed earlier in pregnancy than amniocentesis?","options":["Chorionic Villus Sampling","Karyotyping after birth","Pedigree analysis","Barr-body staining of the mother"],"answer":0,"explanation":"CVS samples chorionic villi and is generally available earlier than amniocentesis.","difficulty":"Foundation","cognitive":"Comparison","topic":"Chorionic Villus Sampling"},{"id":"unit2-mcq-21","unit":"unit2","q":"Amniocentesis obtains material primarily from:","options":["Maternal blood only","Amniotic fluid containing fetal-derived cells/biomolecules","Adult bone marrow","Paternal saliva"],"answer":1,"explanation":"Amniotic fluid contains fetal cells and analytes that can be used for selected prenatal diagnostic tests.","difficulty":"Foundation","cognitive":"Concept","topic":"Amniocentesis"},{"id":"unit2-mcq-22","unit":"unit2","q":"Which practice is most consistent with contemporary genetic counselling?","options":["Directing the family toward the counsellor’s preferred reproductive choice","Withholding test limitations","Providing accurate risk information, discussing uncertainty and supporting informed autonomous decisions","Assuming a genotype determines destiny"],"answer":2,"explanation":"Modern counselling is non-directive, evidence-based and centred on informed consent and autonomy.","difficulty":"Advanced","cognitive":"Ethics","topic":"Genetic counselling"},{"id":"unit2-mcq-23","unit":"unit2","q":"How should eugenics be treated in a modern genetics course?","options":["As an ethically neutral breeding programme for humans","As identical to genetic counselling","As a synonym for environmental improvement","As a historically important but scientifically and ethically problematic movement associated with coercion and discrimination"],"answer":3,"explanation":"Eugenics has a history of coercive and discriminatory misuse and should be analysed critically, not endorsed.","difficulty":"Advanced","cognitive":"Ethics","topic":"Eugenics"},{"id":"unit2-mcq-24","unit":"unit2","q":"A gene is present in both sexes, but the phenotype is expressed only in males because the relevant anatomy or hormonal context occurs only in males. This is:","options":["Sex-limited inheritance","X-linked inheritance necessarily","Codominance","Mitochondrial inheritance"],"answer":0,"explanation":"Sex-limited traits can be genetically present in both sexes but phenotypically expressed in only one.","difficulty":"Intermediate","cognitive":"Application","topic":"Sex-limited characters"},{"id":"unit2-mcq-25","unit":"unit2","q":"A trait allele behaves as dominant in one sex but recessive in the other. The trait is best described as:","options":["Sex-limited only","Sex-influenced","Y-linked necessarily","Cytoplasmic"],"answer":1,"explanation":"Sex-influenced expression reflects sex-dependent penetrance or dominance patterns, often through hormonal context.","difficulty":"Intermediate","cognitive":"Application","topic":"Sex-influenced characters"},{"id":"unit3-mcq-01","unit":"unit3","q":"Which claim is characteristic of classical Lamarckism rather than modern evolutionary genetics?","options":["Allele frequencies can change by drift","Natural selection acts on heritable variation","Acquired characteristics are generally inherited because of use and disuse","Mutation creates new alleles"],"answer":2,"explanation":"Lamarck’s use/disuse and inheritance of acquired characters is historically important but not a general mechanism of genetic inheritance.","difficulty":"Foundation","cognitive":"Comparison","topic":"Lamarckism"},{"id":"unit3-mcq-02","unit":"unit3","q":"Natural selection requires which combination most directly?","options":["Identical phenotypes and identical fitness","No reproduction","Mutation directed toward need","Heritable variation and differences in reproductive success"],"answer":3,"explanation":"Selection changes populations when heritable differences influence survival or reproduction.","difficulty":"Foundation","cognitive":"Mechanism","topic":"Darwinism"},{"id":"unit3-mcq-03","unit":"unit3","q":"Why is mutation theory alone insufficient as a complete modern explanation of evolution?","options":["Variation must also be filtered and redistributed by processes such as selection, drift, gene flow and recombination","Mutations never occur","Mutation always prevents adaptation","All evolution is caused only by migration"],"answer":0,"explanation":"Mutation supplies variation, but population-level evolutionary outcomes depend on multiple forces.","difficulty":"Intermediate","cognitive":"Reasoning","topic":"Mutation theory"},{"id":"unit3-mcq-04","unit":"unit3","q":"The Modern Synthesis is best characterised by integration of:","options":["Lamarckism and spontaneous generation only","Mendelian genetics, population genetics and Darwinian natural selection","Cytology without evolution","Geology without heredity"],"answer":1,"explanation":"The synthesis joined Mendelian inheritance with Darwinian selection through population genetics.","difficulty":"Foundation","cognitive":"Concept","topic":"Modern evolutionary synthesis"},{"id":"unit3-mcq-05","unit":"unit3","q":"The gene pool of a population refers to:","options":["Only dominant alleles","Only genes expressed in adults","All alleles present in the population and their representation","The genome of one individual"],"answer":2,"explanation":"The gene pool is a population-level concept encompassing all alleles across individuals.","difficulty":"Foundation","cognitive":"Concept","topic":"Gene pool"},{"id":"unit3-mcq-06","unit":"unit3","q":"A diploid population has 40 AA, 40 Aa and 20 aa individuals. What is the frequency of allele A?","options":["0.2","0.4","0.8","0.6"],"answer":3,"explanation":"A copies = 2(40)+40 = 120; total alleles = 200; p = 120/200 = 0.6.","difficulty":"Intermediate","cognitive":"Calculation","topic":"Allele frequency"},{"id":"unit3-mcq-07","unit":"unit3","q":"Which statement about mutation is most accurate?","options":["Mutation is random with respect to adaptive need, although mutation rates vary","Adaptive environments cause exactly the mutations organisms need","All mutations are beneficial","Mutation and recombination are identical"],"answer":0,"explanation":"Mutations are not produced because they would be useful, though biochemical context affects mutation probability.","difficulty":"Intermediate","cognitive":"Reasoning","topic":"Mutation"},{"id":"unit3-mcq-08","unit":"unit3","q":"Transposable elements can contribute to genome evolution because they can:","options":["Prevent all mutation","Move or copy within genomes and alter sequence/regulation","Function only as ribosomes","Eliminate recombination"],"answer":1,"explanation":"Transposable elements can create insertions, rearrangements and regulatory changes.","difficulty":"Intermediate","cognitive":"Mechanism","topic":"Transposable elements"},{"id":"unit3-mcq-09","unit":"unit3","q":"What does meiotic recombination primarily do to existing genetic variation?","options":["Creates new chemical elements","Guarantees beneficial mutations","Rearranges alleles into new combinations","Eliminates all linkage"],"answer":2,"explanation":"Recombination reshuffles existing alleles; mutation is the ultimate source of new sequence variants.","difficulty":"Foundation","cognitive":"Concept","topic":"Recombination"},{"id":"unit3-mcq-10","unit":"unit3","q":"In population genetics, fitness is best understood as:","options":["Physical strength only","An absolute species-wide constant","Body size only","Relative reproductive contribution in a specified environment"],"answer":3,"explanation":"Evolutionary fitness is context-dependent reproductive success relative to alternatives.","difficulty":"Intermediate","cognitive":"Concept","topic":"Natural selection"},{"id":"unit3-mcq-11","unit":"unit3","q":"What is a common effect of sustained gene flow between two populations?","options":["It tends to reduce allele-frequency differences between them","It necessarily makes them different","It always causes extinction","It stops mutation"],"answer":0,"explanation":"Migration mixes alleles and often homogenises populations, although selection can oppose this effect.","difficulty":"Intermediate","cognitive":"Reasoning","topic":"Migration and gene flow"},{"id":"unit3-mcq-12","unit":"unit3","q":"Genetic drift is expected to produce the largest generation-to-generation allele-frequency fluctuations in:","options":["Very large populations","Small populations","Only polyploid plants","Populations with no alleles"],"answer":1,"explanation":"Sampling error is proportionally stronger when population size is small.","difficulty":"Foundation","cognitive":"Concept","topic":"Genetic drift"},{"id":"unit3-mcq-13","unit":"unit3","q":"A few individuals colonise an island and establish a population whose allele frequencies differ sharply from the source. This is:","options":["Stabilising selection","Codominance","Founder effect","Sympatric speciation by definition"],"answer":2,"explanation":"A new population founded by a small sample can carry an unrepresentative subset of source variation.","difficulty":"Foundation","cognitive":"Application","topic":"Founder effect"},{"id":"unit3-mcq-14","unit":"unit3","q":"A catastrophe reduces a population from 50,000 to 50 individuals. Even after recovery, genetic diversity remains low. This illustrates:","options":["Complete dominance","Gene duplication only","Hybrid vigour","Population bottleneck"],"answer":3,"explanation":"A bottleneck samples only a small fraction of the former gene pool, and later numerical recovery does not automatically restore lost alleles.","difficulty":"Foundation","cognitive":"Application","topic":"Population bottleneck"},{"id":"unit3-mcq-15","unit":"unit3","q":"Which condition is part of the ideal Hardy–Weinberg model?","options":["Large population with random mating and negligible mutation/migration/selection","Strong selection","Continuous immigration","Assortative mating"],"answer":0,"explanation":"Hardy–Weinberg equilibrium is a null model requiring absence or negligible action of major frequency-changing forces plus random mating.","difficulty":"Intermediate","cognitive":"Concept","topic":"Hardy–Weinberg equilibrium"},{"id":"unit3-mcq-16","unit":"unit3","q":"A recessive phenotype occurs at frequency q² = 0.16 in a Hardy–Weinberg population. What is the expected heterozygote frequency?","options":["0.16","0.48","0.24","0.64"],"answer":1,"explanation":"q = 0.4, p = 0.6; 2pq = 2(0.6)(0.4)=0.48.","difficulty":"Intermediate","cognitive":"Calculation","topic":"Hardy–Weinberg calculations"},{"id":"unit3-mcq-17","unit":"unit3","q":"If p = 0.7 and q = 0.3, what genotype frequency is expected for heterozygotes under Hardy–Weinberg equilibrium?","options":["0.09","0.21","0.42","0.49"],"answer":2,"explanation":"Heterozygote frequency = 2pq = 2(0.7)(0.3)=0.42.","difficulty":"Foundation","cognitive":"Calculation","topic":"Hardy–Weinberg calculations"},{"id":"unit3-mcq-18","unit":"unit3","q":"A population’s mean beak size shifts steadily upward because larger beaks confer greater fitness. This is:","options":["Stabilising selection","Disruptive selection","Genetic equilibrium","Directional selection"],"answer":3,"explanation":"Directional selection favours one extreme and shifts the trait mean.","difficulty":"Foundation","cognitive":"Interpretation","topic":"Directional selection"},{"id":"unit3-mcq-19","unit":"unit3","q":"Very small and very large birth weights have lower survival than intermediate birth weights. This pattern illustrates:","options":["Stabilising selection","Directional selection","Disruptive selection","Founder effect"],"answer":0,"explanation":"Stabilising selection favours intermediate phenotypes and reduces extremes.","difficulty":"Foundation","cognitive":"Application","topic":"Stabilising selection"},{"id":"unit3-mcq-20","unit":"unit3","q":"If both very small and very large phenotypes have higher fitness than intermediate phenotypes, the pattern is:","options":["Stabilising selection","Disruptive selection","Directional selection","No selection"],"answer":1,"explanation":"Disruptive selection favours both extremes relative to intermediate forms.","difficulty":"Foundation","cognitive":"Application","topic":"Disruptive selection"},{"id":"unit3-mcq-21","unit":"unit3","q":"Which distinction between natural selection and genetic drift is most accurate?","options":["Both are always deterministic","Drift occurs only when selection is absent","Selection is related to fitness differences; drift is stochastic sampling of alleles","Selection never changes allele frequencies"],"answer":2,"explanation":"Selection is non-random with respect to fitness; drift reflects random sampling, though both can operate simultaneously.","difficulty":"Intermediate","cognitive":"Comparison","topic":"Evolutionary forces"},{"id":"unit3-mcq-22","unit":"unit3","q":"A resident population has allele frequency p = 0.20. Migrants make up 10% of the breeding population and have p = 0.80. Ignoring other forces, what is p after one migration step?","options":["0.14","0.50","0.80","0.26"],"answer":3,"explanation":"p′ = (1−m)p_resident + m p_migrant = 0.9(0.2)+0.1(0.8)=0.26.","difficulty":"Advanced","cognitive":"Calculation","topic":"Migration and gene flow"},{"id":"unit3-mcq-23","unit":"unit3","q":"Can a selectively neutral allele become fixed in a finite population?","options":["Yes, genetic drift can fix or lose neutral alleles","No, fixation always proves adaptation","Only if it is dominant","Only through gene flow"],"answer":0,"explanation":"Random genetic drift can drive neutral alleles to fixation or loss, particularly in small populations.","difficulty":"Advanced","cognitive":"Reasoning","topic":"Genetic drift"},{"id":"unit3-mcq-24","unit":"unit3","q":"Hardy–Weinberg equilibrium is most useful as:","options":["A claim that real populations never evolve","A null expectation against which observed genotype frequencies can be compared","A model of directional selection","A pedigree rule"],"answer":1,"explanation":"It provides a baseline; departures can motivate tests of selection, population structure, non-random mating or technical issues.","difficulty":"Intermediate","cognitive":"Reasoning","topic":"Hardy–Weinberg equilibrium"},{"id":"unit3-mcq-25","unit":"unit3","q":"Which statement correctly separates selection from evolution?","options":["Individuals genetically evolve during their lifetime","Selection and evolution are synonyms at every level","Selection acts through differential success of individuals, while evolution is measured as population-level genetic change across generations","Evolution requires conscious adaptation"],"answer":2,"explanation":"Individuals experience selection; populations evolve as inherited variant frequencies change over generations.","difficulty":"Advanced","cognitive":"Conceptual integration","topic":"Natural selection"},{"id":"unit4-mcq-01","unit":"unit4","q":"Which statement best reflects the scientific status of origin-of-life research?","options":["A single complete historical pathway has been experimentally proven","Evolutionary biology requires spontaneous generation today","Origin of life and natural selection are identical processes","Multiple testable hypotheses examine prebiotic chemistry, replication and compartmentalisation; the exact historical sequence remains under investigation"],"answer":3,"explanation":"Origin-of-life science evaluates plausible chemical and protocellular pathways without claiming a fully observed historical sequence.","difficulty":"Advanced","cognitive":"Scientific reasoning","topic":"Origin of life"},{"id":"unit4-mcq-02","unit":"unit4","q":"In molecular evolution, a substitution is best distinguished from a mutation because a substitution is:","options":["A sequence change that has become fixed or represented between lineages/populations in comparative data","Any DNA damage in one cell","Always beneficial","Always an insertion"],"answer":0,"explanation":"Mutations arise in individuals; substitutions describe evolutionary sequence differences that persist through lineage history.","difficulty":"Intermediate","cognitive":"Concept","topic":"Molecular evolution"},{"id":"unit4-mcq-03","unit":"unit4","q":"Why can raw percentage sequence difference underestimate long-term molecular divergence?","options":["DNA cannot mutate twice at one site","Multiple substitutions can occur at the same site and mask earlier changes","All sites evolve at identical rates","Insertions never occur"],"answer":1,"explanation":"Repeated hits, reversals and parallel substitutions make observed differences smaller than the true number of historical changes.","difficulty":"Advanced","cognitive":"Reasoning","topic":"Molecular divergence"},{"id":"unit4-mcq-04","unit":"unit4","q":"Before inferring a phylogeny from sequences, the most fundamental requirement is that compared positions represent:","options":["Random unrelated nucleotides","Only GC-rich sites","Homologous characters","Identical species names"],"answer":2,"explanation":"Phylogenetic comparison assumes characters are homologous and therefore evolutionarily comparable.","difficulty":"Foundation","cognitive":"Concept","topic":"Molecular phylogenetics"},{"id":"unit4-mcq-05","unit":"unit4","q":"Which is an example of a sequence-defined molecular marker?","options":["Spindle fibre","Centrosome number","Barr body only","SNP"],"answer":3,"explanation":"A SNP is a specific nucleotide variant that can be genotyped and compared among individuals or taxa.","difficulty":"Foundation","cognitive":"Concept","topic":"Molecular markers"},{"id":"unit4-mcq-06","unit":"unit4","q":"A molecular clock estimate is most defensible when:","options":["Rate model, calibration information and lineage-specific rate variation are considered","A universal identical rate is assumed without testing","All branch lengths are ignored","Only morphology is used"],"answer":0,"explanation":"Modern molecular dating uses calibrations and often relaxed-clock models because substitution rates vary among lineages.","difficulty":"Advanced","cognitive":"Reasoning","topic":"Molecular clock"},{"id":"unit4-mcq-07","unit":"unit4","q":"Two sequences differ at 12 of 300 aligned nucleotide positions. Their uncorrected p-distance is:","options":["0.004","0.04","0.12","0.40"],"answer":1,"explanation":"p-distance = 12/300 = 0.04, or 4%.","difficulty":"Foundation","cognitive":"Calculation","topic":"Sequence evolution"},{"id":"unit4-mcq-08","unit":"unit4","q":"The principal purpose of multiple sequence alignment in phylogenetic analysis is to:","options":["Arrange sequences by length only","Guarantee the correct tree","Place homologous positions into comparable columns","Remove all variable sites"],"answer":2,"explanation":"Alignment establishes positional homology so that characters can be compared across taxa.","difficulty":"Foundation","cognitive":"Concept","topic":"Multiple sequence alignment"},{"id":"unit4-mcq-09","unit":"unit4","q":"A column identical across many homologous protein sequences is described as highly:","options":["Recombined","Aneuploid","Unrooted","Conserved"],"answer":3,"explanation":"Conserved positions have changed little and may reflect functional or structural constraint.","difficulty":"Foundation","cognitive":"Interpretation","topic":"Multiple sequence alignment"},{"id":"unit4-mcq-10","unit":"unit4","q":"What information is added by rooting a phylogenetic tree?","options":["A hypothesis about direction from ancestral to descendant lineages","Colour of the taxa","Proof that the leftmost taxon is primitive","Exact fossil age for every node"],"answer":0,"explanation":"A root provides directionality and defines the common ancestral reference point.","difficulty":"Intermediate","cognitive":"Concept","topic":"Rooted and unrooted trees"},{"id":"unit4-mcq-11","unit":"unit4","q":"Which set forms a clade?","options":["Any species with similar body shape","An ancestor plus all of its descendants","A group excluding some descendants of its common ancestor","Only extinct taxa"],"answer":1,"explanation":"A clade is monophyletic: it includes a common ancestor and all descendants.","difficulty":"Foundation","cognitive":"Concept","topic":"Clades"},{"id":"unit4-mcq-12","unit":"unit4","q":"An internal node on a phylogenetic tree most directly represents:","options":["A named living individual","A mutation rate of zero","An inferred common ancestor or lineage-splitting event","A geographic barrier only"],"answer":2,"explanation":"Nodes are hypotheses of common ancestry/branching, not necessarily directly sampled organisms.","difficulty":"Foundation","cognitive":"Tree interpretation","topic":"Nodes"},{"id":"unit4-mcq-13","unit":"unit4","q":"Taxa A and B share a more recent common ancestor with each other than either does with C. A and B are:","options":["Outgroups","Necessarily the same species","Paraphyletic by definition","Sister taxa"],"answer":3,"explanation":"Sister taxa share an immediate common ancestral node.","difficulty":"Foundation","cognitive":"Tree interpretation","topic":"Sister taxa"},{"id":"unit4-mcq-14","unit":"unit4","q":"Why is an outgroup included in many phylogenetic analyses?","options":["To help root the tree and infer character polarity","To make all sequences identical","To increase mutation rate","To remove the ingroup"],"answer":0,"explanation":"A suitably related external lineage helps distinguish ancestral from derived states and orient the tree.","difficulty":"Intermediate","cognitive":"Reasoning","topic":"Outgroups"},{"id":"unit4-mcq-15","unit":"unit4","q":"On a cladogram where branch lengths are arbitrary, a longer drawn branch means:","options":["More evolutionary change with certainty","Nothing quantitative unless the diagram defines branch length that way","Greater intelligence","More recent origin"],"answer":1,"explanation":"Cladograms encode topology; branch lengths cannot be interpreted quantitatively unless explicitly scaled.","difficulty":"Advanced","cognitive":"Tree interpretation","topic":"Branches"},{"id":"unit4-mcq-16","unit":"unit4","q":"Neighbor-Joining is primarily classified as a:","options":["Prenatal diagnostic method","Pedigree method","Distance-based tree method","Chromosome-staining method"],"answer":2,"explanation":"Neighbor-Joining constructs a tree from pairwise distances.","difficulty":"Intermediate","cognitive":"Method classification","topic":"Distance methods"},{"id":"unit4-mcq-17","unit":"unit4","q":"Maximum likelihood phylogenetic inference is character-based because it:","options":["Uses only taxon names","Requires no sequence alignment","Uses pairwise distance only","Evaluates site/character data under an explicit evolutionary model"],"answer":3,"explanation":"Likelihood methods evaluate the probability of observed characters under candidate trees and substitution models.","difficulty":"Advanced","cognitive":"Method reasoning","topic":"Character-based approaches"},{"id":"unit4-mcq-18","unit":"unit4","q":"What does a high bootstrap percentage on a clade most directly indicate?","options":["The clade has a high resampling support under the analysis, not a literal probability that it is true","The taxa are morphologically identical","The tree is rooted correctly by definition","The divergence date is exact"],"answer":0,"explanation":"Bootstrap support measures stability of a grouping under resampled datasets and should not be overinterpreted as direct posterior probability.","difficulty":"Advanced","cognitive":"Statistical interpretation","topic":"Tree construction"},{"id":"unit4-mcq-19","unit":"unit4","q":"Which limitation is most relevant to the Biological Species Concept?","options":["It cannot discuss reproductive isolation","It is difficult to apply directly to fossils and asexual organisms","It requires DNA sequencing","It defines all lineages as one species"],"answer":1,"explanation":"The BSC centres on actual/potential interbreeding, which is difficult to test in fossils or asexual lineages.","difficulty":"Intermediate","cognitive":"Comparison","topic":"Biological species concept"},{"id":"unit4-mcq-20","unit":"unit4","q":"Which mechanism is prezygotic?","options":["Hybrid sterility","Reduced F2 fertility","Temporal isolation preventing mating","Hybrid inviability"],"answer":2,"explanation":"Temporal isolation acts before fertilisation and therefore is prezygotic.","difficulty":"Foundation","cognitive":"Classification","topic":"Prezygotic isolation"},{"id":"unit4-mcq-21","unit":"unit4","q":"Mule sterility is a classic example of:","options":["Prezygotic habitat isolation","Founder effect","Molecular clock","Postzygotic reproductive isolation"],"answer":3,"explanation":"The hybrid forms but has greatly reduced fertility, making the barrier postzygotic.","difficulty":"Foundation","cognitive":"Application","topic":"Postzygotic isolation"},{"id":"unit4-mcq-22","unit":"unit4","q":"A mountain range splits one interbreeding population; the isolated populations later become reproductively isolated. This is:","options":["Allopatric speciation","Sympatric speciation","Codominance","Artificial selection only"],"answer":0,"explanation":"Geographic separation initiates divergence in allopatric speciation.","difficulty":"Foundation","cognitive":"Application","topic":"Allopatric speciation"},{"id":"unit4-mcq-23","unit":"unit4","q":"Rapid diversification of one ancestral lineage into many species occupying different ecological niches is:","options":["Convergent evolution","Adaptive radiation","Genetic equilibrium","Euthenics"],"answer":1,"explanation":"Adaptive radiation combines lineage diversification with ecological opportunity/niche differentiation.","difficulty":"Foundation","cognitive":"Concept","topic":"Adaptive radiation"},{"id":"unit4-mcq-24","unit":"unit4","q":"Shark and dolphin streamlined bodies evolved in distant lineages under similar aquatic selection pressures. This is:","options":["Sister-taxon identity","Polyploidy","Convergent evolution","Genetic drift only"],"answer":2,"explanation":"Similar selective environments can independently produce analogous forms in unrelated lineages.","difficulty":"Foundation","cognitive":"Application","topic":"Convergent evolution"},{"id":"unit4-mcq-25","unit":"unit4","q":"An altruistic behaviour reduces an actor’s direct reproduction but preferentially helps close relatives. Which framework can explain its evolution?","options":["Hardy–Weinberg equilibrium alone","Chromosomal nondisjunction","Molecular clock","Inclusive fitness/kin selection"],"answer":3,"explanation":"Helping relatives can increase transmission of shared alleles; inclusive-fitness theory formalises this indirect fitness component.","difficulty":"Advanced","cognitive":"Application","topic":"Altruism"},{"id":"unit5-mcq-01","unit":"unit5","q":"Which statement correctly distinguishes microevolution from macroevolution?","options":["Microevolution concerns population-level genetic change; macroevolution examines patterns at and above the species level over longer timescales","They are unrelated processes governed by different laws","Microevolution occurs only in microbes","Macroevolution means individual growth"],"answer":0,"explanation":"The terms refer mainly to scale; speciation and long-term lineage patterns connect population processes to macroevolution.","difficulty":"Foundation","cognitive":"Comparison","topic":"Microevolution"},{"id":"unit5-mcq-02","unit":"unit5","q":"The term megaevolution has historically been used for:","options":["Only daily allele-frequency fluctuation","Very large-scale evolutionary transitions and origins of major body-plan or lineage innovations","Mendelian segregation","Pedigree analysis"],"answer":1,"explanation":"Megaevolution is a descriptive large-scale concept rather than a separate inheritance mechanism.","difficulty":"Intermediate","cognitive":"Concept","topic":"Megaevolution"},{"id":"unit5-mcq-03","unit":"unit5","q":"Which condition is essential for coevolution?","options":["No ecological interaction","Identical mutation rates","Reciprocal evolutionary influence between interacting lineages","Complete reproductive isolation from all organisms"],"answer":2,"explanation":"Coevolution requires reciprocal selection/evolutionary response, not merely coexistence.","difficulty":"Intermediate","cognitive":"Concept","topic":"Coevolution"},{"id":"unit5-mcq-04","unit":"unit5","q":"Why should evolutionary rates not be assumed constant across all lineages?","options":["All organisms have identical mutation rates","Fossils prevent molecular change","Only morphology evolves","Generation time, ecology, selection, population size and genomic processes can differ"],"answer":3,"explanation":"Both molecular and phenotypic rates vary because biological and environmental determinants vary.","difficulty":"Advanced","cognitive":"Reasoning","topic":"Evolutionary rates"},{"id":"unit5-mcq-05","unit":"unit5","q":"Which pattern is most consistent with phyletic gradualism?","options":["Long-term accumulation of relatively small changes within a lineage","Only abrupt instantaneous creation of species","No evolutionary change ever","Chromosomal nondisjunction"],"answer":0,"explanation":"Phyletic gradualism emphasises gradual transformation through accumulated small changes.","difficulty":"Foundation","cognitive":"Concept","topic":"Phyletic gradualism"},{"id":"unit5-mcq-06","unit":"unit5","q":"Punctuated equilibrium predicts which fossil pattern?","options":["Constant identical change in every lineage","Long intervals of relative stasis punctuated by comparatively rapid change associated with speciation","No extinction","Only molecular evolution"],"answer":1,"explanation":"The model highlights stasis and geologically brief intervals of concentrated change.","difficulty":"Foundation","cognitive":"Interpretation","topic":"Punctuated equilibrium"},{"id":"unit5-mcq-07","unit":"unit5","q":"Which era contains the major diversification of dinosaurs and the first birds, and ends at the K–Pg boundary?","options":["Paleozoic","Cenozoic","Mesozoic","Hadean"],"answer":2,"explanation":"The Mesozoic includes Triassic, Jurassic and Cretaceous and ends with the K–Pg mass extinction.","difficulty":"Foundation","cognitive":"Chronology","topic":"Geological time scale"},{"id":"unit5-mcq-08","unit":"unit5","q":"The K–Pg boundary is especially important in vertebrate evolution because it marks:","options":["The origin of Earth","The first cellular life","The origin of meiosis","A mass extinction including non-avian dinosaurs, followed by major Cenozoic radiations"],"answer":3,"explanation":"The end-Cretaceous extinction restructured ecosystems and preceded extensive mammalian and avian diversification.","difficulty":"Intermediate","cognitive":"Chronology","topic":"Geological time scale"},{"id":"unit5-mcq-09","unit":"unit5","q":"Which is the best way to represent major evolutionary transitions?","options":["As branching histories in which new levels of organisation arise through multiple innovations","As a single ladder from “lower” to “higher” organisms","As a sequence determined by need","As identical rates in every lineage"],"answer":0,"explanation":"Evolution is branching and contingent; major transitions do not form a universal progress ladder.","difficulty":"Advanced","cognitive":"Scientific reasoning","topic":"Major evolutionary transitions"},{"id":"unit5-mcq-10","unit":"unit5","q":"Which combination is broadly characteristic of primates?","options":["Feathers and pneumatic bones","Grasping extremities, stereoscopic vision and flexible limb use","Gills throughout adulthood","No parental care"],"answer":1,"explanation":"Primate evolution commonly includes grasping adaptations, enhanced visual overlap and flexible locomotor anatomy.","difficulty":"Foundation","cognitive":"Concept","topic":"Primate evolution"},{"id":"unit5-mcq-11","unit":"unit5","q":"Which feature is especially important for recognising early hominin adaptation?","options":["Loss of all teeth","Development of wings","Habitual bipedal locomotion","Obligate quadrupedal knuckle-walking in all species"],"answer":2,"explanation":"Habitual bipedalism is a key derived feature of the hominin lineage and precedes large modern human brain size.","difficulty":"Foundation","cognitive":"Concept","topic":"Hominin evolution"},{"id":"unit5-mcq-12","unit":"unit5","q":"Why is it misleading to teach Dryopithecus as a guaranteed direct ancestor in a straight line leading to Homo sapiens?","options":["Dryopithecus is a modern human","Fossils cannot inform evolution","All Miocene apes are the same species","Fossil apes represent a diverse branching radiation and precise ancestor–descendant relationships are often uncertain"],"answer":3,"explanation":"Phylogeny is branching; a fossil taxon may be close to an ancestral population without being demonstrably the direct ancestor.","difficulty":"Advanced","cognitive":"Scientific reasoning","topic":"Dryopithecus and fossil apes"},{"id":"unit5-mcq-13","unit":"unit5","q":"Australopithecines are important because they show that:","options":["Habitual bipedalism existed in hominins with relatively small brains","Large modern human brain size evolved before bipedalism","Humans evolved from living chimpanzees","Tool use defines all hominins"],"answer":0,"explanation":"Australopithecines demonstrate mosaic evolution: bipedality preceded the major encephalisation seen later in Homo.","difficulty":"Intermediate","cognitive":"Interpretation","topic":"Australopithecines"},{"id":"unit5-mcq-14","unit":"unit5","q":"Which description best fits early Homo as currently interpreted?","options":["A single perfectly linear species sequence","A diverse set of early Homo populations showing mosaic changes in brain, dentition, body form and behaviour","Modern Homo sapiens living in the Miocene","A group known only from DNA with no fossils"],"answer":1,"explanation":"Early Homo taxonomy is debated, but the evidence points to diversity and mosaic evolutionary change rather than a simple ladder.","difficulty":"Advanced","cognitive":"Interpretation","topic":"Early Homo"},{"id":"unit5-mcq-15","unit":"unit5","q":"Homo erectus is strongly associated with which broad evolutionary pattern?","options":["Origin of flowering plants","First eukaryotic cells","Long-duration persistence and dispersal beyond Africa in early Homo","Loss of bipedalism"],"answer":2,"explanation":"H. erectus/ergaster populations persisted widely and are central to early Homo dispersal and body-form evolution.","difficulty":"Intermediate","cognitive":"Chronology","topic":"Homo erectus"},{"id":"unit5-mcq-16","unit":"unit5","q":"The label “archaic Homo” should be used cautiously because:","options":["It refers only to living chimpanzees","It means all fossils are ancestors of modern humans","It is a chromosome abnormality","It may group diverse Middle Pleistocene populations with complex relationships rather than one uniform species"],"answer":3,"explanation":"Middle Pleistocene Homo diversity and taxonomy remain complex; umbrella labels can conceal branching structure.","difficulty":"Advanced","cognitive":"Scientific reasoning","topic":"Archaic Homo"},{"id":"unit5-mcq-17","unit":"unit5","q":"Genome data show that many present-day non-African human populations carry a small proportion of ancestry from:","options":["Neanderthals","Australopithecus afarensis directly","Dryopithecus only","No archaic humans"],"answer":0,"explanation":"Ancient genomes demonstrate gene flow between Neanderthals and ancestors of many modern non-African populations.","difficulty":"Intermediate","cognitive":"Evidence interpretation","topic":"Neanderthals"},{"id":"unit5-mcq-18","unit":"unit5","q":"Denisovans were initially recognised primarily through:","options":["A complete living population discovered today","Ancient DNA from limited fossil remains","Mendelian pea crosses","Barr-body staining"],"answer":1,"explanation":"Genomic analysis revealed a distinct archaic human lineage from fragmentary remains, illustrating the power of palaeogenomics.","difficulty":"Intermediate","cognitive":"Evidence interpretation","topic":"Denisovans"},{"id":"unit5-mcq-19","unit":"unit5","q":"Which statement is most consistent with current evidence for Homo sapiens origins?","options":["Modern humans arose independently on every continent with no common ancestry","Neanderthals transformed directly into all modern humans","Modern humans arose in Africa within a structured population history and later dispersed widely","Homo sapiens predates all primates"],"answer":2,"explanation":"Fossil and genomic evidence supports African origins with population structure, later dispersals and limited admixture with archaic humans.","difficulty":"Advanced","cognitive":"Evidence integration","topic":"Homo sapiens"},{"id":"unit5-mcq-20","unit":"unit5","q":"Human global dispersal is best represented as:","options":["One perfectly synchronous migration to every continent","No movement outside Africa","A process inferred only from morphology","Multiple expansions, population splits, replacements and admixture events over time"],"answer":3,"explanation":"Genomic and archaeological evidence indicates a complex, multi-stage dispersal history.","difficulty":"Advanced","cognitive":"Evidence integration","topic":"Human dispersal"},{"id":"unit5-mcq-21","unit":"unit5","q":"Mitochondrial DNA is particularly useful for lineage analysis because it is predominantly:","options":["Maternally inherited","Paternally inherited","Transmitted only to sons","Recombined like every autosomal locus"],"answer":0,"explanation":"mtDNA is predominantly maternally inherited and has a smaller effective population size than autosomes.","difficulty":"Foundation","cognitive":"Concept","topic":"Mitochondrial DNA evidence"},{"id":"unit5-mcq-22","unit":"unit5","q":"What is the main lineage perspective provided by much of the non-recombining Y chromosome?","options":["Maternal lineage","Paternal lineage","Only mitochondrial ancestry","No ancestry information"],"answer":1,"explanation":"Most of the Y chromosome is transmitted through paternal lines, while recognising that one locus cannot represent the entire population history.","difficulty":"Foundation","cognitive":"Concept","topic":"Y-chromosome evidence"},{"id":"unit5-mcq-23","unit":"unit5","q":"A central methodological challenge in ancient-DNA research is:","options":["DNA is always perfectly preserved","Ancient samples contain no DNA chemistry","Short degraded fragments and contamination require authentication and damage-aware analysis","Modern DNA cannot contaminate ancient samples"],"answer":2,"explanation":"Ancient DNA is fragmented and chemically damaged, and contamination control is essential for credible inference.","difficulty":"Advanced","cognitive":"Method reasoning","topic":"Ancient DNA"},{"id":"unit5-mcq-24","unit":"unit5","q":"Why is a simple ladder diagram inadequate for human evolution?","options":["Because species never share ancestors","Because phylogenies cannot include fossils","Because evolution has a predetermined goal","Because human evolution includes branching lineages and documented admixture among some lineages"],"answer":3,"explanation":"Human evolutionary history includes divergence, extinction and gene flow; a reticulate branching model is more accurate.","difficulty":"Advanced","cognitive":"Scientific reasoning","topic":"Human evolutionary phylogeny"},{"id":"unit5-mcq-25","unit":"unit5","q":"Which statement about “mitochondrial Eve” is correct?","options":["She is the most recent woman from whom all living humans inherited their mtDNA along uninterrupted maternal lines; other women of her time also contributed other parts of the genome","She was the only woman alive at the time","She was the first Homo sapiens individual","She proves humans evolved in a single family"],"answer":0,"explanation":"Coalescent ancestors for one genetic locus do not imply that only one person or one breeding pair existed.","difficulty":"Advanced","cognitive":"Misconception diagnosis","topic":"Mitochondrial DNA evidence"}],"ar":[{"id":"ar-01","unit":"unit1","assertion":"Crossing over can generate recombinant chromatids.","reason":"Crossing over involves reciprocal exchange between non-sister chromatids of homologous chromosomes.","answer":"A","explanation":"Both statements are true, and the Reason correctly explains the Assertion."},{"id":"ar-02","unit":"unit1","assertion":"A monohybrid Aa × Aa cross has a 1:2:1 genotypic expectation.","reason":"Complete dominance can convert three genotypes into two phenotype classes.","answer":"B","explanation":"Both statements are true, but the Reason is a related fact rather than the direct explanation of the Assertion."},{"id":"ar-03","unit":"unit1","assertion":"Codominance allows both allelic products to be detected in a heterozygote.","reason":"Codominance causes homologous chromosomes to fail to segregate during meiosis.","answer":"C","explanation":"The Assertion is true, but the Reason is false."},{"id":"ar-04","unit":"unit1","assertion":"A 3:1 phenotypic ratio is universal for all monohybrid crosses.","reason":"Incomplete dominance can produce a 1:2:1 phenotypic ratio.","answer":"D","explanation":"The Assertion is false, but the Reason is true."},{"id":"ar-05","unit":"unit1","assertion":"Recombination frequency can underestimate physical separation between widely spaced linked loci.","reason":"Double crossovers can restore parental marker combinations and escape detection in a two-point cross.","answer":"A","explanation":"Both statements are true, and the Reason correctly explains the Assertion."},{"id":"ar-06","unit":"unit2","assertion":"A balanced reciprocal translocation can occur without net loss of chromosomal material.","reason":"A balanced carrier may nevertheless produce unbalanced gametes during meiosis.","answer":"B","explanation":"Both statements are true, but the Reason is a related fact rather than the direct explanation of the Assertion."},{"id":"ar-07","unit":"unit2","assertion":"Barr bodies reflect X-chromosome inactivation in somatic cells with more than one X chromosome.","reason":"Every gene on the inactive X chromosome is completely and permanently silenced.","answer":"C","explanation":"The Assertion is true, but the Reason is false."},{"id":"ar-08","unit":"unit2","assertion":"Aneuploidy means gain or loss of complete haploid chromosome sets.","reason":"Trisomy is an example of aneuploidy involving one extra chromosome.","answer":"D","explanation":"The Assertion is false, but the Reason is true."},{"id":"ar-09","unit":"unit2","assertion":"An inversion can suppress recovery of recombinant chromatids within the inverted region in heterozygotes.","reason":"Crossovers within an inversion can generate chromatids with abnormal duplication/deletion or dicentric/acentric products depending on inversion type.","answer":"A","explanation":"Both statements are true, and the Reason correctly explains the Assertion."},{"id":"ar-10","unit":"unit2","assertion":"Genetic counselling should communicate recurrence risk and test limitations.","reason":"Prenatal diagnosis can provide information about some fetal genetic or chromosomal conditions.","answer":"B","explanation":"Both statements are true, but the Reason is a related fact rather than the direct explanation of the Assertion."},{"id":"ar-11","unit":"unit3","assertion":"Natural selection can change allele frequencies when heritable variants differ in reproductive success.","reason":"Selection acts through differences in survival or reproduction associated with heritable variation.","answer":"A","explanation":"Both statements are true, and the Reason correctly explains the Assertion."},{"id":"ar-12","unit":"unit3","assertion":"Genetic drift is strongest in small populations.","reason":"Genetic drift always moves beneficial alleles toward fixation.","answer":"C","explanation":"The Assertion is true, but the Reason is false."},{"id":"ar-13","unit":"unit3","assertion":"Gene flow can reduce allele-frequency differences between populations.","reason":"Migration moves alleles between populations when migrants contribute to reproduction.","answer":"A","explanation":"Both statements are true, and the Reason correctly explains the Assertion."},{"id":"ar-14","unit":"unit3","assertion":"Hardy–Weinberg equilibrium proves that a population is not evolving at any locus.","reason":"A population can meet Hardy–Weinberg genotype proportions at one locus while evolutionary processes act elsewhere.","answer":"D","explanation":"The Assertion is false, but the Reason is true."},{"id":"ar-15","unit":"unit3","assertion":"Mutation is the ultimate source of new alleles.","reason":"Recombination creates new combinations of already-existing alleles.","answer":"B","explanation":"Both statements are true, but the Reason is a related fact rather than the direct explanation of the Assertion."},{"id":"ar-16","unit":"unit4","assertion":"Rotating branches around an internal node changes the biological relationships represented by a phylogenetic tree.","reason":"Tree topology depends on branching connections, not the left-to-right order of terminal taxa.","answer":"D","explanation":"The Assertion is false, but the Reason is true."},{"id":"ar-17","unit":"unit4","assertion":"A monophyletic group contains a common ancestor and all of its descendants.","reason":"A paraphyletic group includes an ancestor but excludes at least one descendant lineage.","answer":"B","explanation":"Both statements are true, but the Reason is a related fact rather than the direct explanation of the Assertion."},{"id":"ar-18","unit":"unit4","assertion":"A molecular clock can be used without calibration or any assumption about substitution rate.","reason":"Substitution rates can vary among genes and lineages.","answer":"D","explanation":"The Assertion is false, but the Reason is true."},{"id":"ar-19","unit":"unit4","assertion":"An outgroup can help infer the root and character polarity of an ingroup tree.","reason":"The outgroup should be more closely related to one ingroup taxon than that ingroup taxon is to the rest.","answer":"C","explanation":"The Assertion is true, but the Reason is false."},{"id":"ar-20","unit":"unit4","assertion":"Allopatric speciation is facilitated when gene flow is reduced by geographic separation.","reason":"Reduced gene flow allows divergent selection and drift to accumulate differences between separated populations.","answer":"A","explanation":"Both statements are true, and the Reason correctly explains the Assertion."},{"id":"ar-21","unit":"unit5","assertion":"Punctuated equilibrium proposes that all evolutionary change occurs instantaneously.","reason":"The model emphasises comparatively long intervals of stasis interrupted by geologically shorter episodes of change associated with lineage splitting.","answer":"D","explanation":"The Assertion is false, but the Reason is true."},{"id":"ar-22","unit":"unit5","assertion":"Human evolution is best represented as a branching history rather than a single linear ladder.","reason":"Several hominin lineages coexisted and some later populations exchanged genes.","answer":"A","explanation":"Both statements are true, and the Reason correctly explains the Assertion."},{"id":"ar-23","unit":"unit5","assertion":"Mitochondrial DNA represents one maternally inherited component of ancestry.","reason":"Autosomal genomes recombine and represent ancestry from many genealogical lineages.","answer":"B","explanation":"Both statements are true, but the Reason is a related fact rather than the direct explanation of the Assertion."},{"id":"ar-24","unit":"unit5","assertion":"Ancient DNA can provide direct molecular evidence from past organisms.","reason":"Ancient DNA is free from contamination and post-mortem damage once it is sequenced.","answer":"C","explanation":"The Assertion is true, but the Reason is false."},{"id":"ar-25","unit":"unit5","assertion":"Convergent evolution can produce similar traits in distantly related lineages.","reason":"Similarity alone therefore cannot establish close common ancestry.","answer":"B","explanation":"Both statements are true, but the Reason is a related fact rather than the direct explanation of the Assertion."}],"cases":[{"id":"case-01","unit":"unit1","case":"In an F2 generation, 148 offspring are scored as 37 purple, 76 lilac and 35 white. A complete-dominance model predicts two phenotype classes, whereas an incomplete-dominance model predicts three classes in a 1:2:1 ratio. Which model is better supported, and what expected counts would you compare with the observations?","answer":"Incomplete dominance is better supported. For 148 offspring, a 1:2:1 model predicts approximately 37 purple : 74 lilac : 37 white. The observations 37:76:35 are close to that expectation; a formal chi-square test could evaluate sampling deviation."},{"id":"case-02","unit":"unit1","case":"A two-point testcross produces 205 AB, 205 ab, 45 Ab and 45 aB offspring. Identify parental and recombinant classes, calculate recombination frequency, and state the approximate map distance.","answer":"AB and ab are parental classes; Ab and aB are recombinants. Recombinants = 90 of 500, so RF = 18%. The estimated genetic distance is approximately 18 cM for this interval, recognising that undetected multiple crossovers can cause underestimation over long distances."},{"id":"case-03","unit":"unit1","case":"A three-point testcross yields eight classes. ABC and abc are the most frequent; AbC and aBc are the least frequent. Compare each rare class with its corresponding parental class and infer the middle gene.","answer":"The rare double-crossover classes differ from the parental classes only at locus B, so B is the middle gene. The inferred order is A—B—C. Interval distances must include the double-crossover progeny in both adjacent intervals."},{"id":"case-04","unit":"unit1","case":"A pathogenic genotype is molecularly confirmed in 100 unrelated individuals. Eighty show the recognised phenotype, while severity among affected individuals ranges from mild to severe. Which quantity is 80%, and what term describes the variation in severity?","answer":"The 80% value is penetrance. Variation in severity among individuals who express the phenotype is variable expressivity. Penetrance concerns presence/absence; expressivity concerns degree of expression."},{"id":"case-05","unit":"unit2","case":"A phenotypic male has a 47,XXY karyotype. A buccal-smear sex-chromatin test is also performed. Identify the chromosomal condition, predict the usual number of Barr bodies per somatic nucleus, and state the chromosomal principle behind that prediction.","answer":"The condition is Klinefelter syndrome. Typically one Barr body is expected because the number of Barr bodies is approximately the number of X chromosomes minus one in cells showing conventional X inactivation."},{"id":"case-06","unit":"unit2","case":"Across a three-generation pedigree, affected individuals are almost exclusively male; affected sons are often born to unaffected mothers; affected fathers do not transmit the trait to sons, but their daughters may transmit it to grandsons. Which inheritance model is most consistent, and what alternative complication could obscure the pattern?","answer":"X-linked recessive inheritance is most consistent. Reduced penetrance, de novo variants, small family size or phenocopies can obscure an idealised pedigree pattern, so molecular confirmation may be required."},{"id":"case-07","unit":"unit2","case":"Chromosome analysis shows that a segment with gene order A–B–C–D–E becomes A–D–C–B–E without net gain or loss of DNA. Name the rearrangement and explain one meiotic consequence in a heterozygote.","answer":"This is an inversion of the B–C–D segment. In an inversion heterozygote, pairing requires an inversion loop; crossovers within the loop can generate abnormal recombinant chromatids, reducing recovery of viable recombinants."},{"id":"case-08","unit":"unit2","case":"A pregnant patient seeks an invasive diagnostic test earlier in gestation than standard amniocentesis. The proposed procedure samples placental chorionic tissue. Identify the procedure and explain why counselling must still discuss limitations even when laboratory analysis is technically successful.","answer":"The procedure is chorionic villus sampling (CVS). Counselling should address procedural risks, confined placental mosaicism, the specific conditions detectable by the chosen laboratory test, uncertain findings and the fact that no test excludes all fetal disorders."},{"id":"case-09","unit":"unit3","case":"Six individuals colonise an island from a mainland population. Mainland allele A has frequency 0.60, but among the founders its frequency is 0.25 by chance. The island population later expands to thousands. Name the process and explain why population growth does not recreate the original mainland frequencies.","answer":"This is the founder effect, a demographic form of genetic drift. Expansion increases census size but descendants inherit the allele sample carried by the founders; absent substantial gene flow or new mutation, lost or underrepresented variants are not automatically restored."},{"id":"case-10","unit":"unit3","case":"A population declines from 10,000 individuals to 60 after a cyclone and later rebounds to 5,000. Genomic sampling shows reduced heterozygosity and loss of several rare alleles compared with pre-cyclone samples. Explain the evolutionary process and why census recovery does not guarantee genetic recovery.","answer":"A severe bottleneck caused stochastic loss of alleles and reduced heterozygosity. Later numerical growth amplifies the surviving gene pool; genetic diversity can remain depressed unless mutation and/or gene flow introduce variation over time."},{"id":"case-11","unit":"unit3","case":"In a large randomly mating population, a recessive phenotype has frequency 0.09 and the trait is assumed to meet Hardy–Weinberg conditions with complete recessivity. Estimate q, p and the expected heterozygote frequency.","answer":"q² = 0.09, so q = 0.30 and p = 0.70. The expected heterozygote frequency is 2pq = 2(0.7)(0.3) = 0.42. These estimates depend on the stated Hardy–Weinberg and phenotype-genotype assumptions."},{"id":"case-12","unit":"unit3","case":"A quantitative trait has highest reproductive success at both low and high phenotypic extremes, while intermediate phenotypes have lower fitness. Predict the immediate effect on the trait distribution and name the selection pattern.","answer":"This is disruptive (diversifying) selection. Selection favours both extremes relative to intermediates, tending to increase phenotypic variance and potentially produce a bimodal distribution if the pattern persists."},{"id":"case-13","unit":"unit4","case":"Two published phylogenetic diagrams contain the same internal connections, but one diagram has several branches rotated around internal nodes so the terminal taxa appear in a different left-to-right order. One student claims the trees support different histories. Evaluate the claim.","answer":"The claim is incorrect. Rotating branches around a node does not change topology or common-ancestry relationships. The trees are biologically equivalent if the branching connections are identical."},{"id":"case-14","unit":"unit4","case":"An alignment contains 600 homologous nucleotide positions for two taxa. They differ at 12 positions, with no gaps in the compared region. Calculate the uncorrected p-distance and explain why it may underestimate evolutionary change for old divergences.","answer":"p-distance = 12/600 = 0.02, or 2%. It can underestimate historical substitutions because multiple changes may occur at the same site; model-corrected distances attempt to account for such hidden substitutions."},{"id":"case-15","unit":"unit4","case":"A proposed taxonomic group contains ancestral lineage X and descendants A, B and C, but excludes descendant D because D looks morphologically unusual. Is the retained group monophyletic? Explain using tree membership rather than morphology.","answer":"No. A monophyletic group contains the common ancestor and all descendants. Excluding descendant D makes the retained group paraphyletic, regardless of D's morphological distinctiveness."},{"id":"case-16","unit":"unit4","case":"Two populations occupy the same geographic region but specialise on different host plants, mate mainly on their host, and genomic data show reduced gene flow at loci associated with host use. Which speciation mode is suggested, and what evidence would strengthen the inference?","answer":"The pattern suggests sympatric ecological speciation. Stronger evidence would include persistent assortative mating, reduced effective gene flow despite geographic overlap, divergent selection associated with host use and genomic differentiation not explainable by hidden geographic separation."},{"id":"case-17","unit":"unit5","case":"A textbook diagram places an older Miocene ape below Homo sapiens and labels it 'the direct ancestor' solely because of its age and some shared primitive traits. Identify the inferential error and state what evidence would be needed for a stronger ancestry claim.","answer":"Older age and morphological similarity do not by themselves establish direct ancestry. Human evolution is branching; a stronger claim would require a phylogenetic analysis integrating diagnostic characters, stratigraphic age, geographic context and, where available, molecular evidence."},{"id":"case-18","unit":"unit5","case":"A present-day population contains genomic segments that cluster more closely with high-coverage Neanderthal genomes than with other modern-human segments. The signal occurs in long haplotypes unlikely to be explained by ancestral polymorphism alone. What evolutionary event is supported?","answer":"The evidence supports historical admixture/interbreeding between ancestors of the modern population and Neanderthal-related populations. The inference should be distinguished from simple shared ancestry by modelling lineage sorting and haplotype length."},{"id":"case-19","unit":"unit5","case":"A fossil lineage shows little net morphological change through several stratigraphic intervals, followed by comparatively rapid change around a lineage-splitting event. Which tempo model is consistent with this pattern, and what should not be inferred from the word 'rapid'?","answer":"The pattern is consistent with punctuated equilibrium: relatively long stasis with geologically shorter episodes of change associated with speciation. 'Rapid' is relative to geological timescales and does not imply instantaneous change or a single-generation transformation."},{"id":"case-20","unit":"unit5","case":"A study reconstructs population history only from mitochondrial DNA and finds a clear maternal lineage split. Another student concludes that the same split date and topology must describe the entire genome. Explain why that conclusion is unwarranted.","answer":"mtDNA is a single, maternally inherited, non-recombining locus and has its own genealogical history. Autosomal and sex-chromosome loci can have different coalescent histories because of recombination, drift, sex-biased demography and admixture; whole-genome ancestry requires multilocus evidence."}],"shortAnswers":[{"id":"sa-unit1-01-mendelian-principles","unit":"unit1","q":"Define Mendelian principles precisely and explain the biological mechanism or process that produces the pattern described in the syllabus.","answer":"Mendelian inheritance explains how discrete hereditary factors (genes) are transmitted from parents to offspring. The core principles are segregation of allele pairs during gamete formation and, for unlinked loci, independent assortment. Alleles separate during meiosis; fertilisation restores diploidy. An adequate answer should also distinguish genotypic segregation from phenotypic expression, and expected probability from finite-sample deviation and should recognise the principal limitation: small sample size, viability differences, segregation distortion, penetrance and departures from complete dominance."},{"id":"sa-unit1-02-monohybrid-cross","unit":"unit1","q":"Distinguish Monohybrid cross from the most closely related concept in this unit. Give one criterion that would allow the two to be separated in data or observation.","answer":"A monohybrid cross follows inheritance at one locus, commonly between heterozygotes such as Aa × Aa. With complete dominance it predicts a 1:2:1 genotypic ratio and a 3:1 phenotypic ratio. The 3:1 phenotype ratio is conditional on complete dominance and equal viability. An adequate answer should also distinguish genotypic segregation from phenotypic expression, and expected probability from finite-sample deviation and should recognise the principal limitation: small sample size, viability differences, segregation distortion, penetrance and departures from complete dominance."},{"id":"sa-unit1-03-law-of-segregation","unit":"unit1","q":"Using Law of segregation as the focus, state the relevant assumptions and predict what kind of observation would indicate that those assumptions are violated.","answer":"The law of segregation states that the two alleles at a diploid locus separate during gamete formation, so each gamete carries one allele. The cytological basis is separation of homologous chromosomes, and later sister chromatids, during meiosis. Segregation is a meiotic consequence of chromosome behaviour. An adequate answer should also distinguish genotypic segregation from phenotypic expression, and expected probability from finite-sample deviation and should recognise the principal limitation: small sample size, viability differences, segregation distortion, penetrance and departures from complete dominance."},{"id":"sa-unit1-04-classical-3-1-phenotypic-ratio","unit":"unit1","q":"Explain Classical 3:1 phenotypic ratio as a cause-and-effect sequence rather than as a definition. Identify the biological level at which the key event occurs.","answer":"A 3:1 F2 phenotypic ratio arises from Aa × Aa under complete dominance, random fertilisation, equal viability, and no segregation distortion. Modified ratios indicate alternative dominance relations, lethality, or gene interaction. Always distinguish phenotypic ratios from genotypic ratios. An adequate answer should also distinguish genotypic segregation from phenotypic expression, and expected probability from finite-sample deviation and should recognise the principal limitation: small sample size, viability differences, segregation distortion, penetrance and departures from complete dominance."},{"id":"sa-unit1-05-incomplete-dominance","unit":"unit1","q":"Interpret the following conceptual anchor for Incomplete dominance: “Incomplete dominance changes phenotype expression, not segregation of alleles.” Explain why this statement matters and one common error it prevents.","answer":"In incomplete dominance the heterozygote has a phenotype intermediate between the two homozygotes. Because all three genotypes are phenotypically distinguishable, the F2 phenotypic ratio is typically 1:2:1. Incomplete dominance changes phenotype expression, not segregation of alleles. An adequate answer should also distinguish allelic segregation from genotype-to-phenotype mapping, and single-locus effects from interactions among loci or pathways and should recognise the principal limitation: misclassification of phenotypes, incomplete penetrance, viability selection and conflation of dominance with epistasis."},{"id":"sa-unit1-06-codominance","unit":"unit1","q":"Construct a short examination answer on Codominance that includes definition, mechanism, biological significance and one limitation of inference.","answer":"In codominance both alleles are detectably expressed in the heterozygote. The human ABO system illustrates codominance between Iᴬ and Iᴮ, although the locus also contains a recessive i allele. Codominance means simultaneous expression, not blending. An adequate answer should also distinguish allelic segregation from genotype-to-phenotype mapping, and single-locus effects from interactions among loci or pathways and should recognise the principal limitation: misclassification of phenotypes, incomplete penetrance, viability selection and conflation of dominance with epistasis."},{"id":"sa-unit1-07-lethal-genes","unit":"unit1","q":"How would a geneticist or evolutionary biologist obtain evidence for Lethal genes? Name the kind of data required and explain how the result would be interpreted.","answer":"Lethal alleles reduce viability in particular genotypes and can modify expected Mendelian ratios. In an Aa × Aa cross with recessive aa lethality, removal of the aa class yields a 1 AA : 2 Aa surviving genotype ratio; the surviving phenotype ratio depends on how AA and Aa are expressed. Distinguish zygotic genotype ratios from ratios among surviving offspring. An adequate answer should also distinguish allelic segregation from genotype-to-phenotype mapping, and single-locus effects from interactions among loci or pathways and should recognise the principal limitation: misclassification of phenotypes, incomplete penetrance, viability selection and conflation of dominance with epistasis."},{"id":"sa-unit1-08-two-gene-interactions","unit":"unit1","q":"Critically evaluate Two-gene interactions: what does the concept explain well, and what should not be inferred from it without additional evidence?","answer":"When two loci influence one phenotype, the F2 9:3:3:1 classes can be regrouped according to pathway relationships. The resulting modified ratios provide evidence for complementary, epistatic, duplicate or inhibitory interactions while each locus still segregates Mendelianly. Modified dihybrid phenotype ratios can arise when independently segregating loci act in the same biochemical or developmental pathway. An adequate answer should also distinguish allelic segregation from genotype-to-phenotype mapping, and single-locus effects from interactions among loci or pathways and should recognise the principal limitation: misclassification of phenotypes, incomplete penetrance, viability selection and conflation of dominance with epistasis."},{"id":"sa-unit1-09-epistasis","unit":"unit1","q":"Relate Epistasis to another major concept in the same unit and explain the direction of the causal or logical connection between them.","answer":"Epistasis occurs when alleles at one locus modify or mask phenotypic expression at another locus. Classical dihybrid ratios such as 9:3:4, 12:3:1, 9:7, 15:1 and 13:3 reflect different interaction architectures. Epistasis is interaction between loci; dominance is interaction between alleles at one locus. An adequate answer should also distinguish allelic segregation from genotype-to-phenotype mapping, and single-locus effects from interactions among loci or pathways and should recognise the principal limitation: misclassification of phenotypes, incomplete penetrance, viability selection and conflation of dominance with epistasis."},{"id":"sa-unit1-10-complementary-gene-interaction","unit":"unit1","q":"A student gives only the statement “The 9:7 ratio reflects two loci acting in the same pathway.” for Complementary gene interaction. Expand it into a complete postgraduate explanation with the necessary assumptions and biological context.","answer":"Complementary gene action requires a particular dominant allele at each of two loci for a phenotype to appear. A classic F2 pattern is 9:7. The 9:7 ratio reflects two loci acting in the same pathway. An adequate answer should also distinguish allelic segregation from genotype-to-phenotype mapping, and single-locus effects from interactions among loci or pathways and should recognise the principal limitation: misclassification of phenotypes, incomplete penetrance, viability selection and conflation of dominance with epistasis."},{"id":"sa-unit1-11-supplementary-gene-interaction","unit":"unit1","q":"Give a data-oriented explanation of Supplementary gene interaction. Specify what would be measured, what pattern would be expected, and how an alternative explanation could be ruled out.","answer":"Supplementary interactions occur when one gene produces a primary effect and another modifies or supplements that phenotype, creating modified dihybrid ratios. Interpret the biochemical pathway behind the ratio rather than memorising ratios alone. An adequate answer should also distinguish allelic segregation from genotype-to-phenotype mapping, and single-locus effects from interactions among loci or pathways and should recognise the principal limitation: misclassification of phenotypes, incomplete penetrance, viability selection and conflation of dominance with epistasis."},{"id":"sa-unit1-12-multiple-gene-interactions","unit":"unit1","q":"Why is Multiple-gene interactions important in Genetics and Evolution? Answer by linking the immediate mechanism to a broader consequence at chromosome, organism, population or lineage level.","answer":"Phenotypes may depend on networks containing more than two loci. Such interactions produce many genotype-to-phenotype mappings and are best analysed by separating segregation at each locus from the biochemical or developmental pathway that combines their effects. Multilocus networks can preserve Mendelian segregation at each locus while producing complex combined phenotypes. An adequate answer should also distinguish allelic segregation from genotype-to-phenotype mapping, and single-locus effects from interactions among loci or pathways and should recognise the principal limitation: misclassification of phenotypes, incomplete penetrance, viability selection and conflation of dominance with epistasis."},{"id":"sa-unit1-13-pleiotropy","unit":"unit1","q":"Define Pleiotropy precisely and explain the biological mechanism or process that produces the pattern described in the syllabus.","answer":"Pleiotropy is the influence of one gene on multiple phenotypic traits, often because a gene product participates in several tissues or biological processes. One gene can affect multiple traits without implying one gene controls each trait independently. An adequate answer should also distinguish allelic segregation from genotype-to-phenotype mapping, and single-locus effects from interactions among loci or pathways and should recognise the principal limitation: misclassification of phenotypes, incomplete penetrance, viability selection and conflation of dominance with epistasis."},{"id":"sa-unit1-14-penetrance","unit":"unit1","q":"Distinguish Penetrance from the most closely related concept in this unit. Give one criterion that would allow the two to be separated in data or observation.","answer":"Penetrance is the proportion of individuals with a genotype who express its associated phenotype. Reduced penetrance can cause apparently unaffected individuals to transmit disease-associated alleles. Penetrance is a population proportion. An adequate answer should also distinguish allelic segregation from genotype-to-phenotype mapping, and single-locus effects from interactions among loci or pathways and should recognise the principal limitation: misclassification of phenotypes, incomplete penetrance, viability selection and conflation of dominance with epistasis."},{"id":"sa-unit1-15-expressivity","unit":"unit1","q":"Using Expressivity as the focus, state the relevant assumptions and predict what kind of observation would indicate that those assumptions are violated.","answer":"Expressivity describes the degree or severity with which a genotype is phenotypically expressed among individuals who show the phenotype. Expressivity concerns intensity; penetrance concerns presence or absence. An adequate answer should also distinguish allelic segregation from genotype-to-phenotype mapping, and single-locus effects from interactions among loci or pathways and should recognise the principal limitation: misclassification of phenotypes, incomplete penetrance, viability selection and conflation of dominance with epistasis."},{"id":"sa-unit1-16-linkage","unit":"unit1","q":"Explain Linkage as a cause-and-effect sequence rather than as a definition. Identify the biological level at which the key event occurs.","answer":"Genes located on the same chromosome can be inherited together more often than expected by independent assortment. Recombination can break linkage, and recombination frequency generally rises with physical distance for relatively close loci. Recombination frequency approaches 50% for effectively unlinked loci. An adequate answer should also distinguish physical chromosome location from recombination-based genetic distance, and crossover events from recovered recombinant classes and should recognise the principal limitation: double crossovers, crossover interference, sex-specific recombination and the 50% recombination ceiling."},{"id":"sa-unit1-17-types-of-linkage","unit":"unit1","q":"Interpret the following conceptual anchor for Types of linkage: “Complete versus incomplete linkage concerns recombinant recovery, whereas coupling (cis) and repulsion (trans) describe haplotype phase.” Explain why this statement matters and one common error it prevents.","answer":"Linkage may be described as complete when no detectable recombinants occur and incomplete when crossing over generates recombinant gametes. Coupling (cis) and repulsion (trans) describe alternative haplotype phases of alleles at linked loci. Complete versus incomplete linkage concerns recombinant recovery, whereas coupling (cis) and repulsion (trans) describe haplotype phase. An adequate answer should also distinguish physical chromosome location from recombination-based genetic distance, and crossover events from recovered recombinant classes and should recognise the principal limitation: double crossovers, crossover interference, sex-specific recombination and the 50% recombination ceiling."},{"id":"sa-unit1-18-crossing-over","unit":"unit1","q":"Construct a short examination answer on Crossing over that includes definition, mechanism, biological significance and one limitation of inference.","answer":"Crossing over is reciprocal exchange between non-sister chromatids of homologous chromosomes during meiotic prophase I. It produces recombinant chromatids and contributes to genetic variation. Crossing over occurs after homologous pairing and is associated with chiasmata. An adequate answer should also distinguish physical chromosome location from recombination-based genetic distance, and crossover events from recovered recombinant classes and should recognise the principal limitation: double crossovers, crossover interference, sex-specific recombination and the 50% recombination ceiling."},{"id":"sa-unit1-19-types-of-crossing-over","unit":"unit1","q":"How would a geneticist or evolutionary biologist obtain evidence for Types of crossing over? Name the kind of data required and explain how the result would be interpreted.","answer":"Crossing over may involve single, double or multiple exchanges between homologous chromatids. Double crossovers can involve two, three or four chromatids; their recovery depends on chromatid participation and crossover interference. Single, double and multiple crossovers differ in exchange number and position; recovered products also depend on which chromatids participate. An adequate answer should also distinguish physical chromosome location from recombination-based genetic distance, and crossover events from recovered recombinant classes and should recognise the principal limitation: double crossovers, crossover interference, sex-specific recombination and the 50% recombination ceiling."},{"id":"sa-unit1-20-mechanism-of-crossing-over","unit":"unit1","q":"Critically evaluate Mechanism of crossing over: what does the concept explain well, and what should not be inferred from it without additional evidence?","answer":"Modern molecular models explain crossing over through programmed DNA double-strand breaks, strand invasion, homologous pairing and resolution of recombination intermediates. Classical chiasma observations are cytological manifestations of underlying DNA recombination. An adequate answer should also distinguish physical chromosome location from recombination-based genetic distance, and crossover events from recovered recombinant classes and should recognise the principal limitation: double crossovers, crossover interference, sex-specific recombination and the 50% recombination ceiling."},{"id":"sa-unit1-21-theories-of-crossing-over","unit":"unit1","q":"Relate Theories of crossing over to another major concept in the same unit and explain the direction of the causal or logical connection between them.","answer":"Historical cytological theories attempted to explain the relation between chiasmata and genetic recombination. Modern interpretation is molecular: programmed DNA double-strand breaks are repaired through homologous recombination pathways that can resolve as crossovers or non-crossovers. Modern crossover models are based on programmed DNA breaks and homologous-repair intermediates that can yield crossover or non-crossover products. An adequate answer should also distinguish physical chromosome location from recombination-based genetic distance, and crossover events from recovered recombinant classes and should recognise the principal limitation: double crossovers, crossover interference, sex-specific recombination and the 50% recombination ceiling."},{"id":"sa-unit1-22-genetic-mapping","unit":"unit1","q":"A student gives only the statement “Map distance is an estimate derived from recombination, not a direct base-pair measurement.” for Genetic mapping. Expand it into a complete postgraduate explanation with the necessary assumptions and biological context.","answer":"Genetic mapping orders loci using recombination frequencies. For short intervals, 1% recombination is approximately 1 centimorgan, but multiple crossovers make the relationship nonlinear over long distances. Map distance is an estimate derived from recombination, not a direct base-pair measurement. An adequate answer should also distinguish physical chromosome location from recombination-based genetic distance, and crossover events from recovered recombinant classes and should recognise the principal limitation: double crossovers, crossover interference, sex-specific recombination and the 50% recombination ceiling."},{"id":"sa-unit1-23-cytological-mapping","unit":"unit1","q":"Give a data-oriented explanation of Cytological mapping. Specify what would be measured, what pattern would be expected, and how an alternative explanation could be ruled out.","answer":"Cytological mapping assigns genes or DNA sequences to visible chromosome regions using chromosome morphology, banding, deletions, translocations or in situ hybridisation. It links genetic phenomena to physical chromosome location but has different resolution from linkage and sequence maps. Cytological maps localise loci to visible chromosome regions and should not be confused with recombination distances or base-pair coordinates. An adequate answer should also distinguish physical chromosome location from recombination-based genetic distance, and crossover events from recovered recombinant classes and should recognise the principal limitation: double crossovers, crossover interference, sex-specific recombination and the 50% recombination ceiling."},{"id":"sa-unit1-24-linkage-maps","unit":"unit1","q":"Why is Linkage maps important in Genetics and Evolution? Answer by linking the imme
