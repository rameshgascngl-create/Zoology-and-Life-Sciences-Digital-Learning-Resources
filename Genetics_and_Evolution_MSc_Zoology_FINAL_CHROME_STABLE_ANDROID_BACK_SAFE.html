diate mechanism to a broader consequence at chromosome, organism, population or lineage level.","answer":"A linkage map places markers in relative order along chromosomes using recombination data. Three-point crosses can infer gene order and reveal double crossovers. Gene order is inferred by comparing parental and double-crossover classes. An adequate answer should also distinguish physical chromosome location from recombination-based genetic distance, and crossover events from recovered recombinant classes and should recognise the principal limitation: double crossovers, crossover interference, sex-specific recombination and the 50% recombination ceiling."},{"id":"sa-unit1-25-molecular-marker-mapping","unit":"unit1","q":"Define Molecular-marker mapping precisely and explain the biological mechanism or process that produces the pattern described in the syllabus.","answer":"Molecular markers such as SNPs, microsatellites and sequence variants can be used to track chromosomal regions and map traits through linkage or association approaches. A useful marker is polymorphic and reliably genotyped. An adequate answer should also distinguish physical chromosome location from recombination-based genetic distance, and crossover events from recovered recombinant classes and should recognise the principal limitation: double crossovers, crossover interference, sex-specific recombination and the 50% recombination ceiling."},{"id":"sa-unit1-26-somatic-cell-hybrid-mapping","unit":"unit1","q":"Distinguish Somatic-cell hybrid mapping from the most closely related concept in this unit. Give one criterion that would allow the two to be separated in data or observation.","answer":"Somatic-cell hybrid mapping historically assigned human genes to chromosomes by correlating retention of particular human chromosomes with expression of a gene product in hybrid cell lines. This approach preceded modern genome sequencing and dense molecular marker maps. An adequate answer should also distinguish physical chromosome location from recombination-based genetic distance, and crossover events from recovered recombinant classes and should recognise the principal limitation: double crossovers, crossover interference, sex-specific recombination and the 50% recombination ceiling."},{"id":"sa-unit1-27-polygenic-inheritance","unit":"unit1","q":"Using Polygenic inheritance as the focus, state the relevant assumptions and predict what kind of observation would indicate that those assumptions are violated.","answer":"Polygenic inheritance occurs when many loci contribute to a quantitative trait, often producing continuous phenotypic variation. Environmental effects commonly add further variance. Quantitative traits reflect distributions rather than simple categorical ratios. An adequate answer should also distinguish population variance components from individual causation, and broad-sense from narrow-sense heritability and should recognise the principal limitation: environment dependence, genotype–environment interaction, non-additive variance and sampling design."},{"id":"sa-unit1-28-heritability","unit":"unit1","q":"Explain Heritability as a cause-and-effect sequence rather than as a definition. Identify the biological level at which the key event occurs.","answer":"Heritability is the proportion of phenotypic variance attributable to genetic variance in a specified population and environment. Broad-sense heritability includes all genetic variance; narrow-sense heritability emphasises additive genetic variance. Heritability is population- and environment-specific, not a fixed property of a trait. An adequate answer should also distinguish population variance components from individual causation, and broad-sense from narrow-sense heritability and should recognise the principal limitation: environment dependence, genotype–environment interaction, non-additive variance and sampling design."},{"id":"sa-unit1-29-measurement-of-heritability","unit":"unit1","q":"Interpret the following conceptual anchor for Measurement of heritability: “High heritability does not mean a trait cannot respond to environmental change.” Explain why this statement matters and one common error it prevents.","answer":"Heritability can be estimated from variance components, resemblance among relatives, parent–offspring regression or designed breeding studies. Interpretation depends on study design and assumptions. High heritability does not mean a trait cannot respond to environmental change. An adequate answer should also distinguish population variance components from individual causation, and broad-sense from narrow-sense heritability and should recognise the principal limitation: environment dependence, genotype–environment interaction, non-additive variance and sampling design."},{"id":"sa-unit2-01-chromosome-structure","unit":"unit2","q":"Construct a short examination answer on Chromosome structure that includes definition, mechanism, biological significance and one limitation of inference.","answer":"A chromosome is a DNA–protein complex organised into chromatin. Eukaryotic chromosomes contain linear DNA, centromeres, telomeres and chromosomal domains that compact and regulate the genome. Chromosome structure integrates packaging, replication, segregation and gene regulation. An adequate answer should also distinguish chromosome morphology from molecular chromatin organisation, and descriptive cytogenetics from functional interpretation and should recognise the principal limitation: resolution limits, tissue-specific mosaicism, cell-cycle state and interpretation of variants of uncertain significance."},{"id":"sa-unit2-02-chromosome-chemical-composition","unit":"unit2","q":"How would a geneticist or evolutionary biologist obtain evidence for Chromosome chemical composition? Name the kind of data required and explain how the result would be interpreted.","answer":"Eukaryotic chromosomes consist primarily of DNA, histones and non-histone chromosomal proteins, together with associated RNAs. Nucleosomes form the basic repeating unit of chromatin. Histone proteins package DNA and participate in epigenetic regulation. An adequate answer should also distinguish chromosome morphology from molecular chromatin organisation, and descriptive cytogenetics from functional interpretation and should recognise the principal limitation: resolution limits, tissue-specific mosaicism, cell-cycle state and interpretation of variants of uncertain significance."},{"id":"sa-unit2-03-chromosome-organisation","unit":"unit2","q":"Critically evaluate Chromosome organisation: what does the concept explain well, and what should not be inferred from it without additional evidence?","answer":"Chromosome organisation is hierarchical, from DNA wrapped around histone octamers to higher-order chromatin loops and chromosome territories. Euchromatin and heterochromatin differ in compaction and functional state. Chromosome organisation is dynamic rather than a single fixed fibre structure. An adequate answer should also distinguish chromosome morphology from molecular chromatin organisation, and descriptive cytogenetics from functional interpretation and should recognise the principal limitation: resolution limits, tissue-specific mosaicism, cell-cycle state and interpretation of variants of uncertain significance."},{"id":"sa-unit2-04-special-chromosomes","unit":"unit2","q":"Relate Special chromosomes to another major concept in the same unit and explain the direction of the causal or logical connection between them.","answer":"Special chromosomes are unusually organised chromosomes that become conspicuous in particular cell types or developmental stages. Polytene chromosomes contain many aligned DNA copies and display banding/puffs, whereas lampbrush chromosomes have extended transcriptionally active loops; both are classic models for relating chromosome structure to gene activity. Polytene and lampbrush chromosomes reveal unusual structural states linked to DNA replication or intense transcription, not extra chromosome types in the normal complement. An adequate answer should also distinguish chromosome morphology from molecular chromatin organisation, and descriptive cytogenetics from functional interpretation and should recognise the principal limitation: resolution limits, tissue-specific mosaicism, cell-cycle state and interpretation of variants of uncertain significance."},{"id":"sa-unit2-05-b-chromosomes","unit":"unit2","q":"A student gives only the statement “B chromosomes are not part of the normal essential chromosome set.” for B chromosomes. Expand it into a complete postgraduate explanation with the necessary assumptions and biological context.","answer":"B chromosomes are supernumerary chromosomes present in addition to the standard A-chromosome complement in some species. They often show non-Mendelian transmission and variable effects on fitness. B chromosomes are not part of the normal essential chromosome set. An adequate answer should also distinguish chromosome morphology from molecular chromatin organisation, and descriptive cytogenetics from functional interpretation and should recognise the principal limitation: resolution limits, tissue-specific mosaicism, cell-cycle state and interpretation of variants of uncertain significance."},{"id":"sa-unit2-06-karyotype","unit":"unit2","q":"Give a data-oriented explanation of Karyotype. Specify what would be measured, what pattern would be expected, and how an alternative explanation could be ruled out.","answer":"A karyotype describes the chromosome complement of an individual, including chromosome number and gross morphology. Cytogenetic analysis can detect large numerical and structural abnormalities. Karyotyping detects chromosome-scale changes, not most small sequence variants. An adequate answer should also distinguish chromosome morphology from molecular chromatin organisation, and descriptive cytogenetics from functional interpretation and should recognise the principal limitation: resolution limits, tissue-specific mosaicism, cell-cycle state and interpretation of variants of uncertain significance."},{"id":"sa-unit2-07-barr-body","unit":"unit2","q":"Why is Barr body important in Genetics and Evolution? Answer by linking the immediate mechanism to a broader consequence at chromosome, organism, population or lineage level.","answer":"A Barr body is a condensed, largely inactive X chromosome visible in many somatic nuclei. X-chromosome inactivation provides dosage compensation in therian mammals and creates cellular mosaicism. The number of Barr bodies is typically one fewer than the number of X chromosomes. An adequate answer should also distinguish chromosome morphology from molecular chromatin organisation, and descriptive cytogenetics from functional interpretation and should recognise the principal limitation: resolution limits, tissue-specific mosaicism, cell-cycle state and interpretation of variants of uncertain significance."},{"id":"sa-unit2-08-numerical-chromosome-aberrations","unit":"unit2","q":"Define Numerical chromosome aberrations precisely and explain the biological mechanism or process that produces the pattern described in the syllabus.","answer":"Numerical chromosome aberrations change chromosome number through errors such as meiotic or mitotic nondisjunction, anaphase lag, or whole-genome duplication. The central distinction is between euploid changes in complete chromosome sets and aneuploid gain or loss of individual chromosomes. Euploidy alters whole chromosome sets, whereas aneuploidy alters the copy number of individual chromosomes. An adequate answer should also distinguish numerical from structural change, balanced from unbalanced rearrangement, and chromosome dosage from breakpoint effects and should recognise the principal limitation: mosaicism, submicroscopic changes, apparently balanced rearrangements and phenotype variability."},{"id":"sa-unit2-09-euploidy","unit":"unit2","q":"Distinguish Euploidy from the most closely related concept in this unit. Give one criterion that would allow the two to be separated in data or observation.","answer":"Euploidy refers to variation involving complete chromosome sets, such as haploidy or polyploidy. Polyploidy is especially important in plant evolution and speciation. Euploid changes affect whole chromosome sets. An adequate answer should also distinguish numerical from structural change, balanced from unbalanced rearrangement, and chromosome dosage from breakpoint effects and should recognise the principal limitation: mosaicism, submicroscopic changes, apparently balanced rearrangements and phenotype variability."},{"id":"sa-unit2-10-aneuploidy","unit":"unit2","q":"Using Aneuploidy as the focus, state the relevant assumptions and predict what kind of observation would indicate that those assumptions are violated.","answer":"Aneuploidy is gain or loss of individual chromosomes, commonly produced by nondisjunction. Examples include trisomy 21 and monosomy X. Aneuploidy differs from polyploidy because individual chromosomes, not whole sets, are altered. An adequate answer should also distinguish numerical from structural change, balanced from unbalanced rearrangement, and chromosome dosage from breakpoint effects and should recognise the principal limitation: mosaicism, submicroscopic changes, apparently balanced rearrangements and phenotype variability."},{"id":"sa-unit2-11-structural-chromosome-aberrations","unit":"unit2","q":"Explain Structural chromosome aberrations as a cause-and-effect sequence rather than as a definition. Identify the biological level at which the key event occurs.","answer":"Structural chromosome aberrations arise when chromosome breakage and repair alter segment order or dosage. Deletions and duplications change copy number; inversions reverse segment orientation; translocations move material within or between chromosomes, with balanced and unbalanced outcomes distinguished by net DNA dosage. Structural rearrangements alter chromosome order, dosage or breakpoint context; a balanced DNA content does not guarantee reproductive neutrality. An adequate answer should also distinguish numerical from structural change, balanced from unbalanced rearrangement, and chromosome dosage from breakpoint effects and should recognise the principal limitation: mosaicism, submicroscopic changes, apparently balanced rearrangements and phenotype variability."},{"id":"sa-unit2-12-deletion","unit":"unit2","q":"Interpret the following conceptual anchor for Deletion: “Large deletions can be cytogenetically visible; microdeletions require molecular methods.” Explain why this statement matters and one common error it prevents.","answer":"A chromosomal deletion removes a segment of DNA and can cause dosage imbalance or expose recessive alleles. Phenotypic severity depends on the genes and regulatory regions lost. Large deletions can be cytogenetically visible; microdeletions require molecular methods. An adequate answer should also distinguish numerical from structural change, balanced from unbalanced rearrangement, and chromosome dosage from breakpoint effects and should recognise the principal limitation: mosaicism, submicroscopic changes, apparently balanced rearrangements and phenotype variability."},{"id":"sa-unit2-13-duplication","unit":"unit2","q":"Construct a short examination answer on Duplication that includes definition, mechanism, biological significance and one limitation of inference.","answer":"A chromosomal duplication creates an extra copy of a chromosome segment. Gene duplication can alter dosage and, over evolutionary time, provide material for functional divergence. Duplications can be pathogenic or evolutionarily innovative depending on context. An adequate answer should also distinguish numerical from structural change, balanced from unbalanced rearrangement, and chromosome dosage from breakpoint effects and should recognise the principal limitation: mosaicism, submicroscopic changes, apparently balanced rearrangements and phenotype variability."},{"id":"sa-unit2-14-inversion","unit":"unit2","q":"How would a geneticist or evolutionary biologist obtain evidence for Inversion? Name the kind of data required and explain how the result would be interpreted.","answer":"An inversion occurs when a chromosome segment is reversed in orientation. In heterozygotes, crossing over within the inverted region can produce unbalanced products and reduce apparent recombination. Paracentric and pericentric inversions differ in whether the centromere is included. An adequate answer should also distinguish numerical from structural change, balanced from unbalanced rearrangement, and chromosome dosage from breakpoint effects and should recognise the principal limitation: mosaicism, submicroscopic changes, apparently balanced rearrangements and phenotype variability."},{"id":"sa-unit2-15-translocation","unit":"unit2","q":"Critically evaluate Translocation: what does the concept explain well, and what should not be inferred from it without additional evidence?","answer":"A translocation moves chromosome material to a new chromosomal location. Reciprocal translocation carriers can be phenotypically normal but may produce unbalanced gametes. Balanced structural rearrangements can have reproductive consequences without changing total DNA amount. An adequate answer should also distinguish numerical from structural change, balanced from unbalanced rearrangement, and chromosome dosage from breakpoint effects and should recognise the principal limitation: mosaicism, submicroscopic changes, apparently balanced rearrangements and phenotype variability."},{"id":"sa-unit2-16-down-syndrome","unit":"unit2","q":"Relate Down syndrome to another major concept in the same unit and explain the direction of the causal or logical connection between them.","answer":"Down syndrome most commonly results from trisomy 21, usually due to meiotic nondisjunction; less often it results from a Robertsonian translocation or mosaicism. Use person-centred language and distinguish cytogenetic mechanisms. An adequate answer should also distinguish the chromosomal diagnosis from variable clinical expression and the meiotic origin from the final karyotype and should recognise the principal limitation: mosaicism, ascertainment bias, variable expressivity and overgeneralisation from syndrome stereotypes."},{"id":"sa-unit2-17-turner-syndrome","unit":"unit2","q":"A student gives only the statement “The typical karyotype is 45,X, but mosaic and structural X variants occur.” for Turner syndrome. Expand it into a complete postgraduate explanation with the necessary assumptions and biological context.","answer":"Turner syndrome involves complete or partial monosomy X in phenotypic females, with considerable clinical variability and frequent mosaic forms. The typical karyotype is 45,X, but mosaic and structural X variants occur. An adequate answer should also distinguish the chromosomal diagnosis from variable clinical expression and the meiotic origin from the final karyotype and should recognise the principal limitation: mosaicism, ascertainment bias, variable expressivity and overgeneralisation from syndrome stereotypes."},{"id":"sa-unit2-18-edwards-syndrome","unit":"unit2","q":"Give a data-oriented explanation of Edwards syndrome. Specify what would be measured, what pattern would be expected, and how an alternative explanation could be ruled out.","answer":"Edwards syndrome is usually caused by trisomy 18 and is associated with severe developmental abnormalities and high infant mortality. It is a numerical chromosomal abnormality. An adequate answer should also distinguish the chromosomal diagnosis from variable clinical expression and the meiotic origin from the final karyotype and should recognise the principal limitation: mosaicism, ascertainment bias, variable expressivity and overgeneralisation from syndrome stereotypes."},{"id":"sa-unit2-19-klinefelter-syndrome","unit":"unit2","q":"Why is Klinefelter syndrome important in Genetics and Evolution? Answer by linking the immediate mechanism to a broader consequence at chromosome, organism, population or lineage level.","answer":"Klinefelter syndrome most commonly has a 47,XXY karyotype and affects phenotypic males. Meiotic nondisjunction is a major cause, and mosaic cases also occur. One Barr body is typically present in 47,XXY somatic cells. An adequate answer should also distinguish the chromosomal diagnosis from variable clinical expression and the meiotic origin from the final karyotype and should recognise the principal limitation: mosaicism, ascertainment bias, variable expressivity and overgeneralisation from syndrome stereotypes."},{"id":"sa-unit2-20-pedigree-analysis","unit":"unit2","q":"Define Pedigree analysis precisely and explain the biological mechanism or process that produces the pattern described in the syllabus.","answer":"Pedigree analysis infers inheritance patterns by tracing phenotypes through generations. It is used to evaluate autosomal, sex-linked and mitochondrial transmission and to estimate recurrence risks. Pedigree inference depends on penetrance, family size, ascertainment and accurate relationships. An adequate answer should also distinguish inheritance probability from visual pedigree pattern, and gene location from sex-dependent phenotypic expression and should recognise the principal limitation: small pedigrees, reduced penetrance, phenocopies, de novo variants and incomplete family information."},{"id":"sa-unit2-21-human-genome-project","unit":"unit2","q":"Distinguish Human Genome Project from the most closely related concept in this unit. Give one criterion that would allow the two to be separated in data or observation.","answer":"The Human Genome Project produced a reference human genome sequence and catalysed large-scale genomics, mapping and technology development. Modern human genomics now uses multiple reference assemblies and population-scale variation resources. A reference genome is not a complete representation of all human genetic diversity. An adequate answer should also distinguish risk estimation from deterministic prediction, and diagnostic information from reproductive decision-making and should recognise the principal limitation: test sensitivity, uncertain variants, procedural risk, consent, psychosocial context and ethical misuse of genetic information."},{"id":"sa-unit2-22-prenatal-diagnosis","unit":"unit2","q":"Using Prenatal diagnosis as the focus, state the relevant assumptions and predict what kind of observation would indicate that those assumptions are violated.","answer":"Prenatal genetic diagnosis uses fetal or placental material to answer a defined clinical genetic question. Invasive sampling such as CVS or amniocentesis can support cytogenetic or molecular testing; interpretation must address test scope, false-positive/false-negative limits, procedural risk, informed consent and non-directive counselling. Prenatal diagnosis can investigate specified fetal genetic or chromosomal conditions, but no single test excludes all disorders. An adequate answer should also distinguish risk estimation from deterministic prediction, and diagnostic information from reproductive decision-making and should recognise the principal limitation: test sensitivity, uncertain variants, procedural risk, consent, psychosocial context and ethical misuse of genetic information."},{"id":"sa-unit2-23-amniocentesis","unit":"unit2","q":"Explain Amniocentesis as a cause-and-effect sequence rather than as a definition. Identify the biological level at which the key event occurs.","answer":"Amniocentesis samples amniotic fluid, typically in the second trimester, to obtain fetal cells or analytes for diagnostic testing. It is an invasive procedure and must be discussed in a clinical and ethical context. Educational discussion should distinguish screening from diagnostic testing. An adequate answer should also distinguish risk estimation from deterministic prediction, and diagnostic information from reproductive decision-making and should recognise the principal limitation: test sensitivity, uncertain variants, procedural risk, consent, psychosocial context and ethical misuse of genetic information."},{"id":"sa-unit2-24-chorionic-villus-sampling","unit":"unit2","q":"Interpret the following conceptual anchor for Chorionic Villus Sampling: “CVS is invasive and requires specialist clinical counselling.” Explain why this statement matters and one common error it prevents.","answer":"Chorionic villus sampling obtains placental chorionic tissue earlier in pregnancy than amniocentesis and can support prenatal genetic diagnosis. CVS is invasive and requires specialist clinical counselling. An adequate answer should also distinguish risk estimation from deterministic prediction, and diagnostic information from reproductive decision-making and should recognise the principal limitation: test sensitivity, uncertain variants, procedural risk, consent, psychosocial context and ethical misuse of genetic information."},{"id":"sa-unit2-25-genetic-counselling","unit":"unit2","q":"Construct a short examination answer on Genetic counselling that includes definition, mechanism, biological significance and one limitation of inference.","answer":"Genetic counselling is a communication process that helps individuals and families understand genetic conditions, testing options, inheritance, uncertainty and reproductive choices while supporting autonomous decision-making. Modern genetic counselling is non-directive and ethically grounded. An adequate answer should also distinguish risk estimation from deterministic prediction, and diagnostic information from reproductive decision-making and should recognise the principal limitation: test sensitivity, uncertain variants, procedural risk, consent, psychosocial context and ethical misuse of genetic information."},{"id":"sa-unit2-26-eugenics","unit":"unit2","q":"How would a geneticist or evolutionary biologist obtain evidence for Eugenics? Name the kind of data required and explain how the result would be interpreted.","answer":"Eugenics refers to historical and contemporary attempts to influence reproduction in order to change the genetic composition of populations. Coercive eugenic policies caused major human-rights abuses and are scientifically and ethically discredited. Teach eugenics critically in its historical and bioethical context. An adequate answer should also distinguish risk estimation from deterministic prediction, and diagnostic information from reproductive decision-making and should recognise the principal limitation: test sensitivity, uncertain variants, procedural risk, consent, psychosocial context and ethical misuse of genetic information."},{"id":"sa-unit2-27-euthenics","unit":"unit2","q":"Critically evaluate Euthenics: what does the concept explain well, and what should not be inferred from it without additional evidence?","answer":"Euthenics is the historical concept of improving human well-being through environmental, educational and social conditions rather than selective reproduction. It should be distinguished from eugenics. An adequate answer should also distinguish risk estimation from deterministic prediction, and diagnostic information from reproductive decision-making and should recognise the principal limitation: test sensitivity, uncertain variants, procedural risk, consent, psychosocial context and ethical misuse of genetic information."},{"id":"sa-unit2-28-sex-linked-inheritance","unit":"unit2","q":"Relate Sex-linked inheritance to another major concept in the same unit and explain the direction of the causal or logical connection between them.","answer":"Sex-linked inheritance involves genes located on sex chromosomes. X-linked patterns differ between individuals with one versus two X chromosomes because hemizygosity exposes recessive X-linked alleles. Sex linkage refers to chromosomal location, not restriction of a trait to one sex. An adequate answer should also distinguish inheritance probability from visual pedigree pattern, and gene location from sex-dependent phenotypic expression and should recognise the principal limitation: small pedigrees, reduced penetrance, phenocopies, de novo variants and incomplete family information."},{"id":"sa-unit2-29-sex-limited-characters","unit":"unit2","q":"A student gives only the statement “Sex-limited expression does not require sex-chromosome linkage.” for Sex-limited characters. Expand it into a complete postgraduate explanation with the necessary assumptions and biological context.","answer":"Sex-limited traits are genetically present in both sexes but expressed in only one because of anatomical or hormonal context. Sex-limited expression does not require sex-chromosome linkage. An adequate answer should also distinguish inheritance probability from visual pedigree pattern, and gene location from sex-dependent phenotypic expression and should recognise the principal limitation: small pedigrees, reduced penetrance, phenocopies, de novo variants and incomplete family information."},{"id":"sa-unit2-30-sex-influenced-characters","unit":"unit2","q":"Give a data-oriented explanation of Sex-influenced characters. Specify what would be measured, what pattern would be expected, and how an alternative explanation could be ruled out.","answer":"Sex-influenced traits are expressed differently in the sexes, often because dominance relationships or hormonal environments differ. Sex-influenced and sex-linked are distinct concepts. An adequate answer should also distinguish inheritance probability from visual pedigree pattern, and gene location from sex-dependent phenotypic expression and should recognise the principal limitation: small pedigrees, reduced penetrance, phenocopies, de novo variants and incomplete family information."},{"id":"sa-unit3-01-organic-evolution","unit":"unit3","q":"Why is Organic evolution important in Genetics and Evolution? Answer by linking the immediate mechanism to a broader consequence at chromosome, organism, population or lineage level.","answer":"Organic evolution is heritable change in populations across generations. It includes changes in allele frequencies, trait distributions and lineage composition produced by mutation, recombination, natural selection, genetic drift and gene flow; individual acclimatisation or development is not itself evolutionary change. Evolution is heritable population-level change across generations; individual development or acclimatisation is not itself evolution. An adequate answer should also distinguish historical observation from proposed mechanism, and the origin of variation from processes that alter its frequency and should recognise the principal limitation: retrospective simplification of historical theories and assuming one mechanism explains all evolutionary change."},{"id":"sa-unit3-02-lamarckism","unit":"unit3","q":"Define Lamarckism precisely and explain the biological mechanism or process that produces the pattern described in the syllabus.","answer":"Lamarck proposed that organisms change through use and disuse and that acquired characteristics could be inherited. Although important historically, this mechanism does not explain modern genetic inheritance. Separate historical significance from modern evidential support. An adequate answer should also distinguish historical observation from proposed mechanism, and the origin of variation from processes that alter its frequency and should recognise the principal limitation: retrospective simplification of historical theories and assuming one mechanism explains all evolutionary change."},{"id":"sa-unit3-03-darwinism","unit":"unit3","q":"Distinguish Darwinism from the most closely related concept in this unit. Give one criterion that would allow the two to be separated in data or observation.","answer":"Darwinian evolution centres on descent with modification and natural selection acting on heritable variation. Darwin lacked modern genetics, which was later integrated into the evolutionary synthesis. Natural selection filters heritable variation; it does not create variation because it is needed. An adequate answer should also distinguish historical observation from proposed mechanism, and the origin of variation from processes that alter its frequency and should recognise the principal limitation: retrospective simplification of historical theories and assuming one mechanism explains all evolutionary change."},{"id":"sa-unit3-04-mutation-theory","unit":"unit3","q":"Using Mutation theory as the focus, state the relevant assumptions and predict what kind of observation would indicate that those assumptions are violated.","answer":"Hugo de Vries emphasised mutations as discontinuous sources of variation and proposed saltational evolutionary change. Modern evolutionary genetics recognises mutation as a source of new alleles but not a complete theory of evolution by itself. Mutation supplies variation; population processes determine its fate. An adequate answer should also distinguish historical observation from proposed mechanism, and the origin of variation from processes that alter its frequency and should recognise the principal limitation: retrospective simplification of historical theories and assuming one mechanism explains all evolutionary change."},{"id":"sa-unit3-05-modern-evolutionary-synthesis","unit":"unit3","q":"Explain Modern evolutionary synthesis as a cause-and-effect sequence rather than as a definition. Identify the biological level at which the key event occurs.","answer":"The Modern Synthesis united Mendelian genetics, population genetics, natural selection and systematics, explaining evolution as changes in allele frequencies and their consequences over time. It connected microevolutionary genetics with broader evolutionary patterns. An adequate answer should also distinguish historical observation from proposed mechanism, and the origin of variation from processes that alter its frequency and should recognise the principal limitation: retrospective simplification of historical theories and assuming one mechanism explains all evolutionary change."},{"id":"sa-unit3-06-population","unit":"unit3","q":"Interpret the following conceptual anchor for Population: “Evolutionary population boundaries depend on reproductive connectivity and gene flow, not geography alone.” Explain why this statement matters and one common error it prevents.","answer":"In evolutionary genetics, a population is a set of conspecific individuals that occupy a defined spatial and temporal context and exchange genes to some degree. Population boundaries are biological hypotheses: dispersal, mating structure and reproductive connectivity determine whether sampled individuals behave as one evolutionary unit or several structured subpopulations. Evolutionary population boundaries depend on reproductive connectivity and gene flow, not geography alone. An adequate answer should also distinguish allele frequency from genotype frequency, and the generation of variation from its subsequent evolutionary fate and should recognise the principal limitation: population structure, sampling bias, sequencing/genotyping error and conflating polymorphism with adaptation."},{"id":"sa-unit3-07-gene-pool","unit":"unit3","q":"Construct a short examination answer on Gene pool that includes definition, mechanism, biological significance and one limitation of inference.","answer":"The gene pool is the complete set of alleles present in an interbreeding population, considered together with their frequencies. Evolutionary change can therefore be quantified as changes in the composition of this population-level allele pool across generations. Evolutionary forces alter the composition of the gene pool. An adequate answer should also distinguish allele frequency from genotype frequency, and the generation of variation from its subsequent evolutionary fate and should recognise the principal limitation: population structure, sampling bias, sequencing/genotyping error and conflating polymorphism with adaptation."},{"id":"sa-unit3-08-allele-frequency","unit":"unit3","q":"How would a geneticist or evolutionary biologist obtain evidence for Allele frequency? Name the kind of data required and explain how the result would be interpreted.","answer":"Allele frequency is the proportion of all gene copies at a locus represented by a particular allele. In a diploid population it is calculated from genotype counts, and its change through generations is a central quantitative measure of evolution. Allele frequency is not the same as genotype frequency. An adequate answer should also distinguish allele frequency from genotype frequency, and the generation of variation from its subsequent evolutionary fate and should recognise the principal limitation: population structure, sampling bias, sequencing/genotyping error and conflating polymorphism with adaptation."},{"id":"sa-unit3-09-sources-of-genetic-variation","unit":"unit3","q":"Critically evaluate Sources of genetic variation: what does the concept explain well, and what should not be inferred from it without additional evidence?","answer":"Genetic variation originates through mutation, recombination, independent assortment, gene duplication, transposable-element activity and other genome changes; gene flow can introduce already-existing variants from other populations. These processes generate or redistribute heritable differences on which selection and drift subsequently act. Mutation creates new sequence variants, recombination reshuffles existing variants, and gene flow can introduce variants from other populations. An adequate answer should also distinguish allele frequency from genotype frequency, and the generation of variation from its subsequent evolutionary fate and should recognise the principal limitation: population structure, sampling bias, sequencing/genotyping error and conflating polymorphism with adaptation."},{"id":"sa-unit3-10-mutation","unit":"unit3","q":"Relate Mutation to another major concept in the same unit and explain the direction of the causal or logical connection between them.","answer":"Mutation is a heritable change in genetic material and is the ultimate source of new alleles. Mutation types range from nucleotide substitutions to large structural changes. Mutation is random with respect to adaptive need, though mutation rates vary across genomes. An adequate answer should also distinguish allele frequency from genotype frequency, and the generation of variation from its subsequent evolutionary fate and should recognise the principal limitation: population structure, sampling bias, sequencing/genotyping error and conflating polymorphism with adaptation."},{"id":"sa-unit3-11-transposable-elements","unit":"unit3","q":"A student gives only the statement “Transposons are major evolutionary components of many eukaryotic genomes.” for Transposable elements. Expand it into a complete postgraduate explanation with the necessary assumptions and biological context.","answer":"Transposable elements are DNA sequences capable of moving or copying within genomes. They can generate insertional mutations, regulatory changes, recombination substrates and genome expansion. Transposons are major evolutionary components of many eukaryotic genomes. An adequate answer should also distinguish allele frequency from genotype frequency, and the generation of variation from its subsequent evolutionary fate and should recognise the principal limitation: population structure, sampling bias, sequencing/genotyping error and conflating polymorphism with adaptation."},{"id":"sa-unit3-12-recombination","unit":"unit3","q":"Give a data-oriented explanation of Recombination. Specify what would be measured, what pattern would be expected, and how an alternative explanation could be ruled out.","answer":"Recombination reshuffles alleles between homologous chromosomes and creates new haplotypes. It changes associations among loci without necessarily changing allele frequencies directly. Recombination is a source of genotypic variation. An adequate answer should also distinguish allele frequency from genotype frequency, and the generation of variation from its subsequent evolutionary fate and should recognise the principal limitation: population structure, sampling bias, sequencing/genotyping error and conflating polymorphism with adaptation."},{"id":"sa-unit3-13-natural-selection","unit":"unit3","q":"Why is Natural selection important in Genetics and Evolution? Answer by linking the immediate mechanism to a broader consequence at chromosome, organism, population or lineage level.","answer":"Natural selection is differential survival and reproduction associated with heritable phenotypic differences. It changes allele frequencies when trait variation has a genetic basis. Selection acts on phenotypes but evolution is measured genetically at the population level. An adequate answer should also distinguish deterministic fitness differences from stochastic sampling and movement of alleles among populations and should recognise the principal limitation: confounding among selection, drift, demography and migration, especially in small or structured populations."},{"id":"sa-unit3-14-evolutionary-forces","unit":"unit3","q":"Define Evolutionary forces precisely and explain the biological mechanism or process that produces the pattern described in the syllabus.","answer":"Evolutionary forces are processes that alter allele frequencies, genotype frequencies or their spatial distribution. Mutation introduces new alleles, selection changes representation according to fitness, drift changes frequencies stochastically, and gene flow moves alleles among populations; non-random mating primarily alters genotype proportions and can interact with these forces. Selection, drift, gene flow and mutation alter populations through distinct causal mechanisms and leave different—often overlapping—signatures. An adequate answer should also distinguish deterministic fitness differences from stochastic sampling and movement of alleles among populations and should recognise the principal limitation: confounding among selection, drift, demography and migration, especially in small or structured populations."},{"id":"sa-unit3-15-migration-and-gene-flow","unit":"unit3","q":"Distinguish Migration and gene flow from the most closely related concept in this unit. Give one criterion that would allow the two to be separated in data or observation.","answer":"Gene flow is the movement of alleles among populations through migration and reproduction. It can increase variation within populations while reducing divergence between them. Gene flow can oppose local differentiation. An adequate answer should also distinguish deterministic fitness differences from stochastic sampling and movement of alleles among populations and should recognise the principal limitation: confounding among selection, drift, demography and migration, especially in small or structured populations."},{"id":"sa-unit3-16-genetic-drift","unit":"unit3","q":"Using Genetic drift as the focus, state the relevant assumptions and predict what kind of observation would indicate that those assumptions are violated.","answer":"Genetic drift is stochastic change in allele frequencies due to finite population sampling. It is especially strong in small populations and can lead to fixation or loss independent of adaptive value. Drift is random with respect to fitness. An adequate answer should also distinguish deterministic fitness differences from stochastic sampling and movement of alleles among populations and should recognise the principal limitation: confounding among selection, drift, demography and migration, especially in small or structured populations."},{"id":"sa-unit3-17-founder-effect","unit":"unit3","q":"Explain Founder effect as a cause-and-effect sequence rather than as a definition. Identify the biological level at which the key event occurs.","answer":"A founder effect occurs when a new population is established by a small sample of a larger population, causing allele frequencies and genetic diversity to differ by chance. Founder effects are a special case of genetic drift. An adequate answer should also distinguish deterministic fitness differences from stochastic sampling and movement of alleles among populations and should recognise the principal limitation: confounding among selection, drift, demography and migration, especially in small or structured populations."},{"id":"sa-unit3-18-population-bottleneck","unit":"unit3","q":"Interpret the following conceptual anchor for Population bottleneck: “Population recovery in numbers does not automatically restore lost genetic diversity.” Explain why this statement matters and one common error it prevents.","answer":"A population bottleneck is a sharp temporary reduction in population size that can cause random allele loss, reduced heterozygosity and long-lasting genetic consequences. Population recovery in numbers does not automatically restore lost genetic diversity. An adequate answer should also distinguish allele frequency from genotype frequency, and the generation of variation from its subsequent evolutionary fate and should recognise the principal limitation: population structure, sampling bias, sequencing/genotyping error and conflating polymorphism with adaptation."},{"id":"sa-unit3-19-hardy-weinberg-equilibrium","unit":"unit3","q":"Construct a short examination answer on Hardy–Weinberg equilibrium that includes definition, mechanism, biological significance and one limitation of inference.","answer":"The Hardy–Weinberg model provides a null expectation for genotype frequencies in an idealised population with random mating, very large size, and no selection, mutation or migration. For two alleles, p+q=1 and p²+2pq+q²=1. Departure from Hardy–Weinberg proportions can indicate violated assumptions or technical issues. An adequate answer should also distinguish a null-model expectation from evidence of a particular evolutionary cause and should recognise the principal limitation: population subdivision, inbreeding, selection, technical genotyping error and inappropriate pooling of samples."},{"id":"sa-unit3-20-hardy-weinberg-calculations","unit":"unit3","q":"How would a geneticist or evolutionary biologist obtain evidence for Hardy–Weinberg calculations? Name the kind of data required and explain how the result would be interpreted.","answer":"Hardy–Weinberg calculations connect observed genotype or phenotype data with allele-frequency estimates under an explicit null model. For two alleles, p + q = 1 and expected genotype frequencies after random mating are p², 2pq and q²; observed counts can then be compared with expectations using appropriate statistical tests. Hardy–Weinberg proportions are a null expectation under explicit assumptions; a deviation signals that the model needs explanation but does not identify the cause by itself. An adequate answer should also distinguish a null-model expectation from evidence of a particular evolutionary cause and should recognise the principal limitation: population subdivision, inbreeding, selection, technical genotyping error and inappropriate pooling of samples."},{"id":"sa-unit3-21-stabilising-selection","unit":"unit3","q":"Critically evaluate Stabilising selection: what does the concept explain well, and what should not be inferred from it without additional evidence?","answer":"Stabilising selection favours intermediate phenotypes over extremes. It can reduce phenotypic variance around an optimum while leaving the population mean relatively unchanged, provided the selective environment remains stable. The population mean may remain relatively stable while extremes are selected against. An adequate answer should also distinguish deterministic fitness differences from stochastic sampling and movement of alleles among populations and should recognise the principal limitation: confounding among selection, drift, demography and migration, especially in small or structured populations."},{"id":"sa-unit3-22-directional-selection","unit":"unit3","q":"Relate Directional selection to another major concept in the same unit and explain the direction of the causal or logical connection between them.","answer":"Directional selection favours phenotypes toward one end of a distribution, shifting the population mean through generations. It commonly occurs when environmental conditions change or when a new selective pressure alters relative fitness. A changing environment can produce directional selection. An adequate answer should also distinguish deterministic fitness differences from stochastic sampling and movement of alleles among populations and should recognise the principal limitation: confounding among selection, drift, demography and migration, especially in small or structured populations."},{"id":"sa-unit3-23-disruptive-selection","unit":"unit3","q":"A student gives only the statement “Disruptive selection is also called diversifying selection.” for Disruptive selection. Expand it into a complete postgraduate explanation with the necessary assumptions and biological context.","answer":"Disruptive selection favours phenotypic extremes over intermediates and may increase variation. Under some ecological conditions it can contribute to divergence. Disruptive selection is also called diversifying selection. An adequate answer should also distinguish deterministic fitness differences from stochastic sampling and movement of alleles among populations and should recognise the principal limitation: confounding among selection, drift, demography and migration, especially in small or structured populations."},{"id":"sa-unit4-01-origin-of-life","unit":"unit4","q":"Give a data-oriented explanation of Origin of life. Specify what would be measured, what pattern would be expected, and how an alternative explanation could be ruled out.","answer":"Origin-of-life research investigates how prebiotic chemistry could generate self-replicating, compartmentalised systems capable of Darwinian evolution. Hypotheses include RNA-world models, metabolism-first models and hydrothermal scenarios. Abiogenesis and biological evolution are related but distinct research questions. An adequate answer should also distinguish prebiotic chemical plausibility from evidence of a complete historical pathway to the first evolving systems and should recognise the principal limitation: limited direct historical evidence, uncertain early-Earth conditions and multiple plausible pathways."},{"id":"sa-unit4-02-molecular-evolution","unit":"unit4","q":"Why is Molecular evolution important in Genetics and Evolution? Answer by linking the immediate mechanism to a broader consequence at chromosome, organism, population or lineage level.","answer":"Molecular evolution examines changes in DNA, RNA and protein sequences through time and the population processes that shape them. Sequence variation provides evidence for ancestry, divergence and selection. An adequate answer should also distinguish homology from superficial similarity, mutation from substitution, and observed sequence difference from model-corrected evolutionary distance and should recognise the principal limitation: alignment error, saturation, recombination, rate heterogeneity, calibration uncertainty and model misspecification."},{"id":"sa-unit4-03-principles-of-molecular-evolutionary-studi","unit":"unit4","q":"Define Principles of molecular evolutionary studies precisely and explain the biological mechanism or process that produces the pattern described in the syllabus.","answer":"Molecular evolutionary studies begin by establishing homology, obtaining an appropriate sequence alignment, choosing an evolutionary model, and distinguishing mutation from substitution. Inference then depends on sampling, rate variation, selection, recombination, calibration and statistical uncertainty; molecular similarity alone is not equivalent to a resolved phylogeny. Homology, alignment, evolutionary model, sampling and calibration assumptions must be made explicit before molecular inference is interpreted. An adequate answer should also distinguish homology from superficial similarity, mutation from substitution, and observed sequence difference from model-corrected evolutionary distance and should recognise the principal limitation: alignment error, saturation, recombination, rate heterogeneity, calibration uncertainty and model misspecification."},{"id":"sa-unit4-04-molecular-divergence","unit":"unit4","q":"Distinguish Molecular divergence from the most closely related concept in this unit. Give one criterion that would allow the two to be separated in data or observation.","answer":"Molecular divergence is the accumulation of sequence differences between lineages after separation from a common ancestor. Observed divergence reflects mutation, fixation, selection and time. An adequate answer should also distinguish homology from superficial similarity, mutation from substitution, and observed sequence difference from model-corrected evolutionary distance and should recognise the principal limitation: alignment error, saturation, recombination, rate heterogeneity, calibration uncertainty and model misspecification."},{"id":"sa-unit4-05-molecular-phylogenetics","unit":"unit4","q":"Using Molecular phylogenetics as the focus, state the relevant assumptions and predict what kind of observation would indicate that those assumptions are violated.","answer":"Molecular phylogenetics reconstructs evolutionary relationships using DNA, RNA or protein sequence data and explicit models of sequence change. Phylogenetic inference is model-based and includes uncertainty. An adequate answer should also distinguish tree topology from branch length, ancestry from visual tip order, and support for a clade from mere similarity and should recognise the principal limitation: poor taxon sampling, long-branch attraction, recombination, gene-tree/species-tree discordance and model choice."},{"id":"sa-unit4-06-molecular-markers","unit":"unit4","q":"Explain Molecular markers as a cause-and-effect sequence rather than as a definition. Identify the biological level at which the key event occurs.","answer":"Molecular markers are heritable DNA variants used to identify individuals, populations, genomic regions or evolutionary relationships. SNPs, microsatellites and sequence loci are common examples. Marker choice depends on scale, mutation rate and research question. An adequate answer should also distinguish homology from superficial similarity, mutation from substitution, and observed sequence difference from model-corrected evolutionary distance and should recognise the principal limitation: alignment error, saturation, recombination, rate heterogeneity, calibration uncertainty and model misspecification."},{"id":"sa-unit4-07-molecular-clock","unit":"unit4","q":"Interpret the following conceptual anchor for Molecular clock: “Molecular clocks require calibration and model assumptions.” Explain why this statement matters and one common error it prevents.","answer":"A molecular clock estimates divergence time from molecular change, calibrated using fossils, biogeography or known dates. Strict clocks assume constant rates; relaxed-clock models allow rate variation. Molecular clocks require calibration and model assumptions. An adequate answer should also distinguish homology from superficial similarity, mutation from substitution, and observed sequence difference from model-corrected evolutionary distance and should recognise the principal limitation: alignment error, saturation, recombination, rate heterogeneity, calibration uncertainty and model misspecification."},{"id":"sa-unit4-08-sequence-evolution","unit":"unit4","q":"Construct a short examination answer on Sequence evolution that includes definition, mechanism, biological significance and one limitation of inference.","answer":"Sequence evolution comprises substitutions, insertions, deletions, duplications, gene conversion and other changes that accumulate in DNA, RNA or proteins through time. The observed pattern reflects mutation processes plus population-genetic filtering by selection and drift, and repeated substitutions can obscure the true number of historical changes. Observed sequence differences reflect mutation plus fixation history and can hide repeated substitutions at the same site. An adequate answer should also distinguish homology from superficial similarity, mutation from substitution, and observed sequence difference from model-corrected evolutionary distance and should recognise the principal limitation: alignment error, saturation, recombination, rate heterogeneity, calibration uncertainty and model misspecification."},{"id":"sa-unit4-09-multiple-sequence-alignment","unit":"unit4","q":"How would a geneticist or evolutionary biologist obtain evidence for Multiple sequence alignment? Name the kind of data required and explain how the result would be interpreted.","answer":"Multiple sequence alignment arranges homologous sequences to infer positional correspondence, conserved regions and substitutions. Alignment quality strongly influences downstream phylogenetic inference. Alignment is a hypothesis of homology, not merely text formatting. An adequate answer should also distinguish homology from superficial similarity, mutation from substitution, and observed sequence difference from model-corrected evolutionary distance and should recognise the principal limitation: alignment error, saturation, recombination, rate heterogeneity, calibration uncertainty and model misspecification."},{"id":"sa-unit4-10-phylogenetic-trees","unit":"unit4","q":"Critically evaluate Phylogenetic trees: what does the concept explain well, and what should not be inferred from it without additional evidence?","answer":"A phylogenetic tree is a hypothesis about evolutionary relationships. Nodes represent lineage divergences or sampled ancestors depending on representation; tips represent sampled taxa or sequences. Tip order left-to-right does not indicate evolutionary progress. An adequate answer should also distinguish tree topology from branch length, ancestry from visual tip order, and support for a clade from mere similarity and should recognise the principal limitation: poor taxon sampling, long-branch attraction, recombination, gene-tree/species-tree discordance and model choice."},{"id":"sa-unit4-11-tree-terminology","unit":"unit4","q":"Relate Tree terminology to another major concept in the same unit and explain the direction of the causal or logical connection between them.","answer":"Phylogenetic-tree terminology describes hypotheses of ancestry using roots, branches, internal nodes, terminal taxa, clades, sister groups and outgroups. Topology records branching relationships, whereas branch lengths may represent time, amount of change or no quantitative scale at all depending on the tree. Phylogenetic topology is encoded by branching connections, not by the left-to-right order or rotation of tips. An adequate answer should also distinguish tree topology from branch length, ancestry from visual tip order, and support for a clade from mere similarity and should recognise the principal limitation: poor taxon sampling, long-branch attraction, recombination, gene-tree/species-tree discordance and model choice."},{"id":"sa-unit4-12-rooted-and-unrooted-trees","unit":"unit4","q":"A student gives only the statement “Outgroups can help infer the root of a tree.” for Rooted and unrooted trees. Expand it into a complete postgraduate explanation with the necessary assumptions and biological context.","answer":"A rooted tree specifies the direction of ancestry from a common ancestor, whereas an unrooted tree depicts relationships without specifying the ancestral root. Outgroups can help infer the root of a tree. An adequate answer should also distinguish tree topology from branch length, ancestry from visual tip order, and support for a clade from mere similarity and should recognise the principal limitation: poor taxon sampling, long-branch attraction, recombination, gene-tree/species-tree discordance and model choice."},{"id":"sa-unit4-13-clades","unit":"unit4","q":"Give a data-oriented explanation of Clades. Specify what would be measured, what pattern would be expected, and how an alternative explanation could be ruled out.","answer":"A clade is a monophyletic group consisting of a common ancestor and all of its descendants. Clade membership is defined by branching history and shared ancestry rather than by superficial similarity. Clades are defined by common ancestry. An adequate answer should also distinguish tree topology from branch length, ancestry from visual tip order, and support for a clade from mere similarity and should recognise the principal limitation: poor taxon sampling, long-branch attraction, recombination, gene-tree/species-tree discordance and model choice."},{"id":"sa-unit4-14-nodes","unit":"unit4","q":"Why is Nodes important in Genetics and Evolution? Answer by linking the immediate mechanism to a broader consequence at chromosome, organism, population or lineage level.","answer":"A node in a phylogenetic tree is a branching or terminal point. An internal node represents the inferred most recent common ancestor of the descendant lineages emerging from it, whereas a terminal node represents a sampled taxon or sequence; an internal node is not automatically a known fossil species. An internal node represents an inferred common ancestor or lineage-splitting event, not automatically a sampled fossil ancestor. An adequate answer should also distinguish tree topology from branch length, ancestry from visual tip order, and support for a clade from mere similarity and should recognise the principal limitation: poor taxon sampling, long-branch attraction, recombination, gene-tree/species-tree discordance and model choice."},{"id":"sa-unit4-15-branches","unit":"unit4","q":"Define Branches precisely and explain the biological mechanism or process that produces the pattern described in the syllabus.","answer":"Branches in a phylogenetic tree connect nodes and represent evolutionary lineages between divergence events or sampled endpoints. Their visual length has meaning only when the tree explicitly scales branches to time or amount of change; horizontal order and line length in an unscaled cladogram do not indicate evolutionary advancement. Branch length is quantitatively meaningful only when the tree explicitly defines it as time or amount of evolutionary change. An adequate answer should also distinguish tree topology from branch length, ancestry from visual tip order, and support for a clade from mere similarity and should recognise the principal limitation: poor taxon sampling, long-branch attraction, recombination, gene-tree/species-tree discordance and model choice."},{"id":"sa-unit4-16-sister-taxa","unit":"unit4","q":"Distinguish Sister taxa from the most closely related concept in this unit. Give one criterion that would allow the two to be separated in data or observation.","answer":"Sister taxa are two lineages that share an immediate most recent common ancestor not shared with any other included taxon. Neither sister taxon should be interpreted as the direct ancestor of the other. Sister relationships are read from branching topology, not visual proximity alone. An adequate answer should also distinguish tree topology from branch length, ancestry from visual tip order, and support for a clade from mere similarity and should recognise the principal limitation: poor taxon sampling, long-branch attraction, recombination, gene-tree/species-tree discordance and model choice."},{"id":"sa-unit4-17-outgroups","unit":"unit4","q":"Using Outgroups as the focus, state the relevant assumptions and predict what kind of observation would indicate that those assumptions are violated.","answer":"An outgroup is a taxon or lineage outside the focal ingroup used to help polarise character changes and root phylogenetic trees. A suitable outgroup is related to, but outside, the ingroup. An adequate answer should also distinguish tree topology from branch length, ancestry from visual tip order, and support for a clade from mere similarity and should recognise the principal limitation: poor taxon sampling, long-branch attraction, recombination, gene-tree/species-tree discordance and model choice."},{"id":"sa-unit4-18-tree-construction","unit":"unit4","q":"Explain Tree construction as a cause-and-effect sequence rather than as a definition. Identify the biological level at which the key event occurs.","answer":"Phylogenetic tree construction involves selecting homologous characters, aligning or coding them, choosing an evolutionary model or optimality criterion, inferring topology and assessing support. Tree building is an inferential workflow, not a drawing exercise. An adequate answer should also distinguish tree topology from branch length, ancestry from visual tip order, and support for a clade from mere similarity and should recognise the principal limitation: poor taxon sampling, long-branch attraction, recombination, gene-tree/species-tree discordance and model choice."},{"id":"sa-unit4-19-distance-methods","unit":"unit4","q":"Interpret the following conceptual anchor for Distance methods: “Distance methods compress character information into pairwise summaries.” Explain why this statement matters and one common error it prevents.","answer":"Distance methods convert pairwise sequence differences into evolutionary distance estimates and infer trees from the resulting matrix. Neighbor-joining is a common example. Distance methods compress character information into pairwise summaries. An adequate answer should also distinguish tree topology from branch length, ancestry from visual tip order, and support for a clade from mere similarity and should recognise the principal limitation: poor taxon sampling, long-branch attraction, recombination, gene-tree/species-tree discordance and model choice."},{"id":"sa-unit4-20-character-based-approaches","unit":"unit4","q":"Construct a short examination answer on Character-based approaches that includes definition, mechanism, biological significance and one limitation of inference.","answer":"Character-based phylogenetic methods analyse individual character states directly. Maximum parsimony seeks minimal change, while maximum likelihood and Bayesian approaches use explicit evolutionary models. Different methods can yield different trees depending on data and assumptions. An adequate answer should also distinguish tree topology from branch length, ancestry from visual tip order, and support for a clade from mere similarity and should recognise the principal limitation: poor taxon sampling, long-branch attraction, recombination, gene-tree/species-tree discordance and model choice."},{"id":"sa-unit4-21-tree-interpretation","unit":"unit4","q":"How would a geneticist or evolutionary biologist obtain evidence for Tree interpretation? Name the kind of data required and explain how the result would be interpreted.","answer":"Tree interpretation requires reading branching order, common ancestry, clade membership, rooting and support without mistaking tip order or branch rotation for evolutionary rank. Rotating branches around a node does not change topology. An adequate answer should also distinguish tree topology from branch length, ancestry from visual tip order, and support for a clade from mere similarity and should recognise the principal limitation: poor taxon sampling, long-branch attraction, recombination, gene-tree/species-tree discordance and model choice."},{"id":"sa-unit4-22-biological-species-concept","unit":"unit4","q":"Critically evaluate Biological species concept: what does the concept explain well, and what should not be inferred from it without additional evidence?","answer":"The biological species concept defines species as groups of actually or potentially interbreeding natural populations reproductively isolated from other such groups. It is difficult to apply to fossils, asexual organisms and many geographically separated populations. An adequate answer should also distinguish reproductive isolation from geographic separation and species delimitation from any single diagnostic character and should recognise the principal limitation: hybridisation, incomplete lineage sorting, continuous divergence and disagreement among species concepts."},{"id":"sa-unit4-23-phylogenetic-species-concept","unit":"unit4","q":"Relate Phylogenetic species concept to another major concept in the same unit and explain the direction of the causal or logical connection between them.","answer":"Phylogenetic species concepts identify species as diagnosable or independently evolving lineages in a phylogenetic framework. Different operational definitions can change species boundaries. An adequate answer should also distinguish tree topology from branch length, ancestry from visual tip order, and support for a clade from mere similarity and should recognise the principal limitation: poor taxon sampling, long-branch attraction, recombination, gene-tree/species-tree discordance and model choice."},{"id":"sa-unit4-24-speciation","unit":"unit4","q":"A student gives only the statement “Speciation is usually a process rather than a single instantaneous event.” for Speciation. Expand it into a complete postgraduate explanation with the necessary assumptions and biological context.","answer":"Speciation is the evolution of reproductive isolation and lineage independence. It can involve geographic separation, ecological divergence, sexual selection and genomic differentiation. Speciation is usually a process rather than a single instantaneous event. An adequate answer should also distinguish reproductive isolation from geographic separation and species delimitation from any single diagnostic character and should recognise the principal limitation: hybridisation, incomplete lineage sorting, continuous divergence and disagreement among species concepts."},{"id":"sa-unit4-25-reproductive-isolation","unit":"unit4","q":"Give a data-oriented explanation of Reproductive isolation. Specify what would be measured, what pattern would be expected, and how an alternative explanation could be ruled out.","answer":"Reproductive isolation comprises barriers that reduce gene flow between populations. Barriers may act before fertilisation or after hybrid formation. Isolation evolves in degrees and can be incomplete. An adequate answer should also distinguish reproductive isolation from geographic separation and species delimitation from any single diagnostic character and should recognise the principal limitation: hybridisation, incomplete lineage sorting, continuous divergence and disagreement among species concepts."},{"id":"sa-unit4-26-prezygotic-isolation","unit":"unit4","q":"Why is Prezygotic isolation important in Genetics and Evolution? Answer by linking the immediate mechanism to a broader consequence at chromosome, organism, population or lineage level.","answer":"Prezygotic barriers prevent mating or fertilisation through habitat, temporal, behavioural, mechanical or gametic isolation. These mechanisms act before a zygote is formed. An adequate answer should also distinguish reproductive isolation from geographic separation and species delimitation from any single diagnostic character and should recognise the principal limitation: hybridisation, incomplete lineage sorting, continuous divergence and disagreement among species concepts."},{"id":"sa-unit4-27-postzygotic-isolation","unit":"unit4","q":"Define Postzygotic isolation precisely and explain the biological mechanism or process that produces the pattern described in the syllabus.","answer":"Postzygotic isolation acts after fertilisation and reduces gene flow because hybrids have reduced viability, reduced fertility, or later-generation breakdown. Hybrid inviability and hybrid sterility are common examples. Hybrid sterility is a classic postzygotic barrier. An adequate answer should also distinguish reproductive isolation from geographic separation and species delimitation from any single diagnostic character and should recognise the principal limitation: hybridisation, incomplete lineage sorting, continuous divergence and disagreement among species concepts."},{"id":"sa-unit4-28-allopatric-speciation","unit":"unit4","q":"Distinguish Allopatric speciation from the most closely related concept in this unit. Give one criterion that would allow the two to be separated in data or observation.","answer":"Allopatric speciation occurs when geographic separation restricts gene flow, allowing populations to diverge through selection, drift and mutation. Geographic isolation facilitates, but does not by itself guarantee, speciation. An adequate answer should also distinguish reproductive isolation from geographic separation and species delimitation from any single diagnostic character and should recognise the principal limitation: hybridisation, incomplete lineage sorting, continuous divergence and disagreement among species concepts."},{"id":"sa-unit4-29-sympatric-speciation","unit":"unit4","q":"Using Sympatric speciation as the focus, state the relevant assumptions and predict what kind of observation would indicate that those assumptions are violated.","answer":"Sympatric speciation occurs without complete geographic separation, often through strong ecological divergence, assortative mating or, in plants, polyploidy. Demonstrating sympatric speciation requires evidence that geographic isolation was not the primary cause. An adequate answer should also distinguish reproductive isolation from geographic separation and species delimitation from any single diagnostic character and should recognise the principal limitation: hybridisation, incomplete lineage sorting, continuous divergence and disagreement among species concepts."},{"id":"sa-unit4-30-adaptive-radiation","unit":"unit4","q":"Explain Adaptive radiation as a cause-and-effect sequence rather than as a definition. Identify the biological level at which the key event occurs.","answer":"Adaptive radiation is rapid diversification of a lineage into multiple ecological forms, often after ecological opportunity or key innovations. Classic examples include island radiations and post-extinction diversifications. An adequate answer should also distinguish shared ancestry from independently evolved similarity and ecological opportunity from a simple increase in species number and should recognise the principal limitation: correlated traits, incomplete fossil sampling, uncertain ancestral states and convergence that obscures relationship."},{"id":"sa-unit4-31-convergent-evolution","unit":"unit4","q":"Interpret the following conceptual anchor for Convergent evolution: “Similarity from convergence is analogous, not evidence of recent shared ancestry for that trait.” Explain why this statement matters and one common error it prevents.","answer":"Convergent evolution produces similar traits independently in different lineages under similar selective pressures or functional constraints. Similarity from convergence is analogous, not evidence of recent shared ancestry for that trait. An adequate answer should also distinguish shared ancestry from independently evolved similarity and ecological opportunity from a simple increase in species number and should recognise the principal limitation: correlated traits, incomplete fossil sampling, uncertain ancestral states and convergence that obscures relationship."},{"id":"sa-unit4-32-sexual-selection","unit":"unit4","q":"Construct a short examination answer on Sexual selection that includes definition, mechanism, biological significance and one limitation of inference.","answer":"Sexual selection arises from differences in mating success and includes competition within a sex and mate choice between sexes. It can favour traits that increase reproduction even when they carry survival costs. Sexual selection is a component of natural selection focused on reproductive success. An adequate answer should also distinguish direct fitness from indirect fitness, and a descriptive social behaviour from the evolutionary conditions that can maintain it and should recognise the principal limitation: misestimated relatedness or fitness, ecological context, repeated interactions and confusing proximate motivation with evolutionary function."},{"id":"sa-unit4-33-altruism","unit":"unit4","q":"How would a geneticist or evolutionary biologist obtain evidence for Altruism? Name the kind of data required and explain how the result would be interpreted.","answer":"Evolutionary altruism describes behaviour that reduces an actor’s direct fitness while increasing another individual’s fitness. Kin selection, inclusive fitness and reciprocal interactions can explain the evolution of such behaviour under specific conditions. Evolutionary altruism is defined by fitness consequences, not human moral intent. An adequate answer should also distinguish direct fitness from indirect fitness, and a descriptive social behaviour from the evolutionary conditions that can maintain it and should recognise the principal limitation: misestimated relatedness or fitness, ecological context, repeated interactions and confusing proximate motivation with evolutionary function."},{"id":"sa-unit4-34-evolution-of-social-behaviour","unit":"unit4","q":"Critically evaluate Evolution of social behaviour: what does the concept explain well, and what should not be inferred from it without additional evidence?","answer":"The evolution of social behaviour is analysed through its consequences for direct and indirect fitness. Cooperation, altruism, conflict and helping can evolve through mechanisms such as kin selection, reciprocal interactions, mutual benefit and population structure; Hamilton’s rule formalises when an indirect-fitness benefit to relatives can offset a cost to the actor. Social behaviours evolve through their effects on direct and indirect fitness; altruism requires conditions that offset the actor's direct-fitness cost. An adequate answer should also distinguish direct fitness from indirect fitness, and a descriptive social behaviour from the evolutionary conditions that can maintain it and should recognise the principal limitation: misestimated relatedness or fitness, ecological context, repeated interactions and confusing proximate motivation with evolutionary function."},{"id":"sa-unit5-01-origin-of-higher-categories","unit":"unit5","q":"Relate Origin of higher categories to another major concept in the same unit and explain the direction of the causal or logical connection between them.","answer":"Higher taxonomic categories arise through repeated lineage splitting, extinction and the accumulation of evolutionary novelties over deep time. Modern macroevolution does not require a separate mechanism for 'higher' taxa; it examines how speciation, developmental change, ecological opportunity and differential diversification generate large-scale phylogenetic patterns. Higher taxa arise through branching, extinction and cumulative evolutionary innovation rather than through a separate 'higher-category' evolutionary law. An adequate answer should also distinguish process from pattern, and differences of evolutionary scale or tempo from claims that different fundamental laws operate and should recognise the principal limitation: incomplete fossil sampling, time averaging, dating uncertainty and extrapolating short-term rates across deep time
