."},{"id":"sa-unit5-02-microevolution","unit":"unit5","q":"A student gives only the statement “Mutation, selection, drift and gene flow drive microevolution.” for Microevolution. Expand it into a complete postgraduate explanation with the necessary assumptions and biological context.","answer":"Microevolution refers to changes in allele frequencies and trait distributions within populations over relatively short evolutionary timescales. Mutation, selection, drift and gene flow drive microevolution. An adequate answer should also distinguish process from pattern, and differences of evolutionary scale or tempo from claims that different fundamental laws operate and should recognise the principal limitation: incomplete fossil sampling, time averaging, dating uncertainty and extrapolating short-term rates across deep time."},{"id":"sa-unit5-03-macroevolution","unit":"unit5","q":"Give a data-oriented explanation of Macroevolution. Specify what would be measured, what pattern would be expected, and how an alternative explanation could be ruled out.","answer":"Macroevolution concerns large-scale evolutionary patterns at and above the species level, including speciation, extinction and clade diversification. Macroevolution is connected to, but not reducible in description to, short-term allele-frequency change. An adequate answer should also distinguish process from pattern, and differences of evolutionary scale or tempo from claims that different fundamental laws operate and should recognise the principal limitation: incomplete fossil sampling, time averaging, dating uncertainty and extrapolating short-term rates across deep time."},{"id":"sa-unit5-04-megaevolution","unit":"unit5","q":"Why is Megaevolution important in Genetics and Evolution? Answer by linking the immediate mechanism to a broader consequence at chromosome, organism, population or lineage level.","answer":"Megaevolution is an older term sometimes used for very large-scale evolutionary transitions and origins of major body plans. Modern evolutionary biology more commonly discusses macroevolutionary transitions and developmental innovation. Treat the term as historical or contextual rather than a distinct mechanism. An adequate answer should also distinguish process from pattern, and differences of evolutionary scale or tempo from claims that different fundamental laws operate and should recognise the principal limitation: incomplete fossil sampling, time averaging, dating uncertainty and extrapolating short-term rates across deep time."},{"id":"sa-unit5-05-coevolution","unit":"unit5","q":"Define Coevolution precisely and explain the biological mechanism or process that produces the pattern described in the syllabus.","answer":"Coevolution is reciprocal evolutionary change between interacting lineages, such as hosts and parasites, predators and prey, or mutualists. Reciprocal selection is central to coevolution. An adequate answer should also distinguish process from pattern, and differences of evolutionary scale or tempo from claims that different fundamental laws operate and should recognise the principal limitation: incomplete fossil sampling, time averaging, dating uncertainty and extrapolating short-term rates across deep time."},{"id":"sa-unit5-06-evolutionary-rates","unit":"unit5","q":"Distinguish Evolutionary rates from the most closely related concept in this unit. Give one criterion that would allow the two to be separated in data or observation.","answer":"Evolutionary rates vary among traits, genes, lineages and time intervals. Rates can be expressed morphologically, genetically or in diversification processes. There is no single universal rate of evolution. An adequate answer should also distinguish process from pattern, and differences of evolutionary scale or tempo from claims that different fundamental laws operate and should recognise the principal limitation: incomplete fossil sampling, time averaging, dating uncertainty and extrapolating short-term rates across deep time."},{"id":"sa-unit5-07-phyletic-gradualism","unit":"unit5","q":"Using Phyletic gradualism as the focus, state the relevant assumptions and predict what kind of observation would indicate that those assumptions are violated.","answer":"Phyletic gradualism describes evolutionary change as the cumulative transformation of a lineage through many relatively small changes over long intervals. It is a model of evolutionary tempo and pattern, not a claim that rates must be identical or constant. It is a model of tempo, not a separate evolutionary mechanism. An adequate answer should also distinguish process from pattern, and differences of evolutionary scale or tempo from claims that different fundamental laws operate and should recognise the principal limitation: incomplete fossil sampling, time averaging, dating uncertainty and extrapolating short-term rates across deep time."},{"id":"sa-unit5-08-punctuated-equilibrium","unit":"unit5","q":"Explain Punctuated equilibrium as a cause-and-effect sequence rather than as a definition. Identify the biological level at which the key event occurs.","answer":"Punctuated equilibrium proposes that species often show long intervals of relative morphological stasis interrupted by geologically shorter episodes of change associated with speciation. Punctuated equilibrium addresses evolutionary tempo and fossil patterns. An adequate answer should also distinguish process from pattern, and differences of evolutionary scale or tempo from claims that different fundamental laws operate and should recognise the principal limitation: incomplete fossil sampling, time averaging, dating uncertainty and extrapolating short-term rates across deep time."},{"id":"sa-unit5-09-geological-time-scale","unit":"unit5","q":"Interpret the following conceptual anchor for Geological time scale: “Dates are periodically refined as geochronological evidence improves.” Explain why this statement matters and one common error it prevents.","answer":"The geological time scale organises Earth history into eons, eras, periods and epochs using stratigraphy, radiometric dating and major geological or biological transitions. Dates are periodically refined as geochronological evidence improves. An adequate answer should also distinguish process from pattern, and differences of evolutionary scale or tempo from claims that different fundamental laws operate and should recognise the principal limitation: incomplete fossil sampling, time averaging, dating uncertainty and extrapolating short-term rates across deep time."},{"id":"sa-unit5-10-major-evolutionary-transitions","unit":"unit5","q":"Construct a short examination answer on Major evolutionary transitions that includes definition, mechanism, biological significance and one limitation of inference.","answer":"Major evolutionary transitions are episodes in which biological organisation, inheritance or individuality changes substantially—for example the origin of eukaryotic cells, multicellularity and complex social integration. They are reconstructed by combining comparative, fossil, developmental and molecular evidence rather than by assuming a predetermined progression toward complexity. Major transitions reorganise biological individuality or inheritance and must be evaluated from comparative, fossil, developmental and molecular evidence. An adequate answer should also distinguish process from pattern, and differences of evolutionary scale or tempo from claims that different fundamental laws operate and should recognise the principal limitation: incomplete fossil sampling, time averaging, dating uncertainty and extrapolating short-term rates across deep time."},{"id":"sa-unit5-11-primate-evolution","unit":"unit5","q":"How would a geneticist or evolutionary biologist obtain evidence for Primate evolution? Name the kind of data required and explain how the result would be interpreted.","answer":"Primate evolution includes diversification of strepsirrhines, haplorhines, monkeys and apes, with changes in vision, grasping, brain organisation, locomotion and social behaviour. Humans are nested within primate phylogeny. An adequate answer should also distinguish shared ancestry from superficial linear ‘progress’, and population relationships from claims of direct ancestry and should recognise the principal limitation: fragmentary fossils, dating uncertainty, admixture, incomplete lineage sorting, contamination and over-simplified linear narratives."},{"id":"sa-unit5-12-hominin-evolution","unit":"unit5","q":"Critically evaluate Hominin evolution: what does the concept explain well, and what should not be inferred from it without additional evidence?","answer":"Hominin evolution is a branching history of lineages more closely related to humans than to chimpanzees after their last common ancestor. Bipedal adaptations appeared well before modern human brain size. Avoid linear “ape-to-human” ladder models. An adequate answer should also distinguish shared ancestry from superficial linear ‘progress’, and population relationships from claims of direct ancestry and should recognise the principal limitation: fragmentary fossils, dating uncertainty, admixture, incomplete lineage sorting, contamination and over-simplified linear narratives."},{"id":"sa-unit5-13-primate-versus-hominin-characteristics","unit":"unit5","q":"Relate Primate versus hominin characteristics to another major concept in the same unit and explain the direction of the causal or logical connection between them.","answer":"Hominins share primate traits but are distinguished in the fossil record especially by habitual bipedal adaptations, dental changes and later trends in brain expansion, technology and life history. No single trait alone defines every stage of hominin evolution. An adequate answer should also distinguish shared ancestry from superficial linear ‘progress’, and population relationships from claims of direct ancestry and should recognise the principal limitation: fragmentary fossils, dating uncertainty, admixture, incomplete lineage sorting, contamination and over-simplified linear narratives."},{"id":"sa-unit5-14-dryopithecus-and-fossil-apes","unit":"unit5","q":"A student gives only the statement “Modern phylogeny treats fossil apes in a branching framework with uncertain exact placements.” for Dryopithecus and fossil apes. Expand it into a complete postgraduate explanation with the necessary assumptions and biological context.","answer":"Dryopithecus is a Miocene fossil ape genus important for understanding hominoid diversity. It should not be presented as a proven direct ancestor of Homo sapiens. Modern phylogeny treats fossil apes in a branching framework with uncertain exact placements. An adequate answer should also distinguish shared ancestry from superficial linear ‘progress’, and population relationships from claims of direct ancestry and should recognise the principal limitation: fragmentary fossils, dating uncertainty, admixture, incomplete lineage sorting, contamination and over-simplified linear narratives."},{"id":"sa-unit5-15-australopithecines","unit":"unit5","q":"Give a data-oriented explanation of Australopithecines. Specify what would be measured, what pattern would be expected, and how an alternative explanation could be ruled out.","answer":"Australopithecines were diverse African hominins combining habitual bipedalism with relatively small brains and varied locomotor adaptations. They represent several species and lineages, not one simple sequential stage. An adequate answer should also distinguish shared ancestry from superficial linear ‘progress’, and population relationships from claims of direct ancestry and should recognise the principal limitation: fragmentary fossils, dating uncertainty, admixture, incomplete lineage sorting, contamination and over-simplified linear narratives."},{"id":"sa-unit5-16-early-homo","unit":"unit5","q":"Why is Early Homo important in Genetics and Evolution? Answer by linking the immediate mechanism to a broader consequence at chromosome, organism, population or lineage level.","answer":"Early Homo includes early members of the genus Homo associated with changes in body proportions, brain size and technology, although species boundaries and fossil assignments remain debated. Human evolution contains overlapping lineages and mosaic traits. An adequate answer should also distinguish shared ancestry from superficial linear ‘progress’, and population relationships from claims of direct ancestry and should recognise the principal limitation: fragmentary fossils, dating uncertainty, admixture, incomplete lineage sorting, contamination and over-simplified linear narratives."},{"id":"sa-unit5-17-homo-erectus","unit":"unit5","q":"Define Homo erectus precisely and explain the biological mechanism or process that produces the pattern described in the syllabus.","answer":"Homo erectus sensu lato had a more human-like body plan, expanded geographic range and substantial encephalisation relative to earlier hominins. Taxonomic boundaries between African and Eurasian forms remain debated. An adequate answer should also distinguish shared ancestry from superficial linear ‘progress’, and population relationships from claims of direct ancestry and should recognise the principal limitation: fragmentary fossils, dating uncertainty, admixture, incomplete lineage sorting, contamination and over-simplified linear narratives."},{"id":"sa-unit5-18-archaic-homo","unit":"unit5","q":"Distinguish Archaic Homo from the most closely related concept in this unit. Give one criterion that would allow the two to be separated in data or observation.","answer":"The informal term archaic Homo is used for diverse Middle Pleistocene human populations showing mosaics of ancestral and derived features. Their relationships to Neanderthals, Denisovan-related groups and Homo sapiens are complex, and taxonomic labels remain debated; they should not be treated as one uniform stage in a linear human sequence. Archaic Homo is an informal umbrella for diverse Middle Pleistocene populations, not a single uniform stage directly ancestral to Homo sapiens. An adequate answer should also distinguish shared ancestry from superficial linear ‘progress’, and population relationships from claims of direct ancestry and should recognise the principal limitation: fragmentary fossils, dating uncertainty, admixture, incomplete lineage sorting, contamination and over-simplified linear narratives."},{"id":"sa-unit5-19-neanderthals","unit":"unit5","q":"Using Neanderthals as the focus, state the relevant assumptions and predict what kind of observation would indicate that those assumptions are violated.","answer":"Neanderthals were a Eurasian human lineage adapted to Pleistocene environments. Genomic evidence shows interbreeding with ancestors of many present-day non-African populations. Neanderthals were close relatives, not simply a failed linear stage before modern humans. An adequate answer should also distinguish shared ancestry from superficial linear ‘progress’, and population relationships from claims of direct ancestry and should recognise the principal limitation: fragmentary fossils, dating uncertainty, admixture, incomplete lineage sorting, contamination and over-simplified linear narratives."},{"id":"sa-unit5-20-denisovans","unit":"unit5","q":"Explain Denisovans as a cause-and-effect sequence rather than as a definition. Identify the biological level at which the key event occurs.","answer":"Denisovans are an archaic human lineage identified largely through ancient DNA and limited fossil remains. Their ancestry contributed genetically to some present-day populations, especially in Oceania and parts of Asia. Ancient DNA can reveal lineages poorly represented in the fossil record. An adequate answer should also distinguish shared ancestry from superficial linear ‘progress’, and population relationships from claims of direct ancestry and should recognise the principal limitation: fragmentary fossils, dating uncertainty, admixture, incomplete lineage sorting, contamination and over-simplified linear narratives."},{"id":"sa-unit5-21-homo-sapiens","unit":"unit5","q":"Interpret the following conceptual anchor for Homo sapiens: “Species history includes both divergence and limited gene flow.” Explain why this statement matters and one common error it prevents.","answer":"Homo sapiens evolved in Africa and later dispersed widely, interacting and interbreeding with some archaic human populations. Modern human origins are best understood as a branching, reticulate population history. Species history includes both divergence and limited gene flow. An adequate answer should also distinguish shared ancestry from superficial linear ‘progress’, and population relationships from claims of direct ancestry and should recognise the principal limitation: fragmentary fossils, dating uncertainty, admixture, incomplete lineage sorting, contamination and over-simplified linear narratives."},{"id":"sa-unit5-22-human-dispersal","unit":"unit5","q":"Construct a short examination answer on Human dispersal that includes definition, mechanism, biological significance and one limitation of inference.","answer":"Human dispersal involved multiple movements within and out of Africa, followed by population expansions, founder effects, admixture and local adaptation. A single simple migration arrow cannot capture the full demographic history. An adequate answer should also distinguish shared ancestry from superficial linear ‘progress’, and population relationships from claims of direct ancestry and should recognise the principal limitation: fragmentary fossils, dating uncertainty, admixture, incomplete lineage sorting, contamination and over-simplified linear narratives."},{"id":"sa-unit5-23-molecular-evidence-for-human-evolution","unit":"unit5","q":"How would a geneticist or evolutionary biologist obtain evidence for Molecular evidence for human evolution? Name the kind of data required and explain how the result would be interpreted.","answer":"Genomic variation, ancient DNA, mitochondrial genomes and Y-chromosome lineages provide complementary evidence about population history, divergence and admixture. Gene trees and population histories must be interpreted probabilistically. An adequate answer should also distinguish shared ancestry from superficial linear ‘progress’, and population relationships from claims of direct ancestry and should recognise the principal limitation: fragmentary fossils, dating uncertainty, admixture, incomplete lineage sorting, contamination and over-simplified linear narratives."},{"id":"sa-unit5-24-mitochondrial-dna-evidence","unit":"unit5","q":"Critically evaluate Mitochondrial DNA evidence: what does the concept explain well, and what should not be inferred from it without additional evidence?","answer":"Mitochondrial DNA is maternally inherited in humans and has been widely used to study maternal lineages and population history. It represents one locus and therefore does not capture the entire species history. Do not equate mitochondrial ancestry with total genomic ancestry. An adequate answer should also distinguish shared ancestry from superficial linear ‘progress’, and population relationships from claims of direct ancestry and should recognise the principal limitation: fragmentary fossils, dating uncertainty, admixture, incomplete lineage sorting, contamination and over-simplified linear narratives."},{"id":"sa-unit5-25-y-chromosome-evidence","unit":"unit5","q":"Relate Y-chromosome evidence to another major concept in the same unit and explain the direction of the causal or logical connection between them.","answer":"The non-recombining region of the Y chromosome traces paternal lineages and can complement autosomal and mitochondrial data in studies of male-mediated population history. Y-chromosome history is one lineage-specific component of human ancestry. An adequate answer should also distinguish shared ancestry from superficial linear ‘progress’, and population relationships from claims of direct ancestry and should recognise the principal limitation: fragmentary fossils, dating uncertainty, admixture, incomplete lineage sorting, contamination and over-simplified linear narratives."},{"id":"sa-unit5-26-ancient-dna","unit":"unit5","q":"A student gives only the statement “Authentication and contamination control are essential in ancient-DNA research.” for Ancient DNA. Expand it into a complete postgraduate explanation with the necessary assumptions and biological context.","answer":"Ancient DNA sequencing retrieves genetic information from archaeological and palaeontological remains. It has transformed reconstruction of human evolution, admixture and population replacement. Authentication and contamination control are essential in ancient-DNA research. An adequate answer should also distinguish shared ancestry from superficial linear ‘progress’, and population relationships from claims of direct ancestry and should recognise the principal limitation: fragmentary fossils, dating uncertainty, admixture, incomplete lineage sorting, contamination and over-simplified linear narratives."},{"id":"sa-unit5-27-human-evolutionary-phylogeny","unit":"unit5","q":"Give a data-oriented explanation of Human evolutionary phylogeny. Specify what would be measured, what pattern would be expected, and how an alternative explanation could be ruled out.","answer":"Human evolutionary phylogeny is a branching network of fossil and genetic lineages. Some relationships remain uncertain, and introgression means population history can include reticulation as well as splitting. Represent uncertainty and admixture rather than forcing a single ladder. An adequate answer should also distinguish shared ancestry from superficial linear ‘progress’, and population relationships from claims of direct ancestry and should recognise the principal limitation: fragmentary fossils, dating uncertainty, admixture, incomplete lineage sorting, contamination and over-simplified linear narratives."}],"essays":[{"unit":"unit1","q":"Explain Mendelian inheritance and critically analyse how incomplete dominance, codominance, lethality and epistasis modify classical phenotypic ratios.","modelAnswer":"Mendelian segregation arises from meiotic separation of homologous alleles and predicts offspring ratios only under explicit assumptions such as random fertilisation and equal viability. Incomplete dominance and codominance alter heterozygote expression without changing allele segregation; lethal genotypes alter the classes recovered among survivors; epistasis regroups dihybrid phenotypes because loci act in the same or interacting pathways. A strong answer should derive representative ratios rather than merely list them and should distinguish genotype ratios from phenotype ratios.","markingPoints":["State segregation and the assumptions behind classical Mendelian ratios.","Derive the Aa × Aa 1:2:1 genotype and 3:1 phenotype expectation under complete dominance.","Explain incomplete dominance and codominance with 1:2:1 phenotypic outcomes where appropriate.","Explain how lethality changes recovered surviving classes and distinguish genotype from phenotype ratios.","Explain epistasis as interaction between loci and illustrate at least two modified dihybrid ratios.","Conclude that modified ratios do not imply failure of segregation at the underlying loci."]},{"unit":"unit1","q":"Describe linkage, crossing over and the construction of genetic maps, including the logic of three-point mapping.","modelAnswer":"Linkage reflects physical association of loci on the same chromosome, whereas crossing over is meiotic exchange between homologous non-sister chromatids that generates recombinants. Recombination frequency provides a genetic-distance estimate for short intervals, but double crossovers cause underestimation across longer intervals. Three-point mapping uses the most frequent parental classes, least frequent double-crossover classes and comparison of allele phase to identify the middle gene, then includes double crossovers in both interval distances. Coefficient of coincidence and interference evaluate crossover dependence.","markingPoints":["Define linkage, recombination and crossing over distinctly.","Explain why recombination frequency estimates map distance and why it approaches 50% for effectively unlinked loci.","Describe parental, single-crossover and double-crossover classes.","Show how the middle gene is inferred in a three-point test cross.","Calculate both interval distances with double crossovers counted in each relevant interval.","Explain coefficient of coincidence and interference and state limitations of genetic maps."]},{"unit":"unit1","q":"Discuss polygenic inheritance and the concept, estimation and interpretation of heritability.","modelAnswer":"Polygenic inheritance results when many loci contribute to quantitative variation, often together with environmental effects. Phenotypic variance can be partitioned conceptually into genetic and environmental components, with genetic variance further separated into additive, dominance and interaction components. Broad-sense heritability is VG/VP, whereas narrow-sense heritability is VA/VP and is more directly related to response to selection. Heritability is population- and environment-specific and is not the fraction of an individual's trait caused by genes.","markingPoints":["Define polygenic/quantitative inheritance and continuous variation.","Explain genetic and environmental contributions to phenotypic variance.","Distinguish broad-sense from narrow-sense heritability.","Give the relevant variance-ratio expressions.","Describe estimation approaches such as parent–offspring regression, selection response or variance components.","Interpret heritability correctly and state its population/environment dependence."]},{"unit":"unit2","q":"Describe numerical and structural chromosomal aberrations and explain their cytogenetic consequences with human examples.","modelAnswer":"Chromosome-number abnormalities arise mainly from nondisjunction, anaphase lag or whole-set changes, whereas structural abnormalities follow chromosome breakage and abnormal repair. Euploidy changes complete sets; aneuploidy changes individual chromosomes. Deletions and duplications alter dosage, inversions reverse segment orientation, and translocations relocate chromosome segments. Clinical consequences depend on gene dosage, breakpoint position, mosaicism and whether a rearrangement is balanced or unbalanced. Human examples include trisomy 21, trisomy 18, monosomy X and XXY.","markingPoints":["Classify numerical abnormalities into euploidy and aneuploidy.","Explain nondisjunction and other mechanisms producing numerical change.","Describe deletion, duplication, inversion and translocation.","Distinguish balanced from unbalanced rearrangements.","Relate representative human karyotypes to Down, Edwards, Turner and Klinefelter syndromes.","Discuss dosage, breakpoint and mosaic effects and appropriate cytogenetic interpretation."]},{"unit":"unit2","q":"Explain pedigree analysis and distinguish autosomal, sex-linked and mitochondrial inheritance patterns.","modelAnswer":"Pedigree analysis infers inheritance from transmission patterns across generations rather than from a single affected individual. Autosomal dominant traits often show vertical transmission and affect both sexes; autosomal recessive traits can skip generations and arise from unaffected carrier parents. X-linked recessive inheritance shows characteristic sex-linked transmission and lacks father-to-son transmission; X-linked dominant patterns differ in transmission from affected fathers. Mitochondrial traits are transmitted through affected mothers but not affected fathers, with expression modified by heteroplasmy and threshold effects.","markingPoints":["State standard pedigree symbols and the logic of generational analysis.","Describe autosomal dominant inheritance and its caveats.","Describe autosomal recessive inheritance and carrier logic.","Distinguish X-linked recessive and X-linked dominant transmission.","Explain mitochondrial maternal transmission and heteroplasmy.","Mention penetrance, variable expressivity, small pedigrees and phenocopies as interpretive limitations."]},{"unit":"unit2","q":"Discuss prenatal diagnosis and genetic counselling with appropriate scientific and ethical considerations.","modelAnswer":"Prenatal diagnosis should begin with a defined genetic question and an appropriate test rather than with a procedure alone. Chorionic villus sampling generally obtains placental tissue earlier in pregnancy, whereas amniocentesis samples amniotic fluid later; both are invasive and can support cytogenetic or molecular testing. Screening and diagnosis must be distinguished. Genetic counselling should communicate risk, test scope, uncertainty, possible outcomes and reproductive options in a non-directive manner while respecting informed consent, confidentiality and patient autonomy.","markingPoints":["Define prenatal genetic screening versus diagnostic testing.","Explain the sampling principle of CVS and amniocentesis and their relative timing conceptually.","Relate sampled material to karyotype, chromosomal or molecular analysis as appropriate.","Discuss test limitations, mosaicism and uncertainty.","Define non-directive genetic counselling and risk communication.","Address informed consent, confidentiality, autonomy and avoidance of coercive eugenic framing."]},{"unit":"unit3","q":"Explain Hardy–Weinberg equilibrium and discuss how selection, mutation, migration and genetic drift alter population genetic structure.","modelAnswer":"Hardy–Weinberg equilibrium is a null model linking allele frequencies p and q with genotype frequencies p², 2pq and q² after random mating under idealised assumptions. Selection changes allele representation according to fitness; mutation introduces new alleles; migration changes frequencies by gene flow; and genetic drift causes stochastic frequency changes whose magnitude increases as effective population size decreases. The model is therefore not a claim that populations do not evolve but a baseline against which departures and evolutionary processes can be analysed.","markingPoints":["State p + q = 1 and p² + 2pq + q² = 1 for a two-allele locus.","List the principal Hardy–Weinberg assumptions.","Explain the equilibrium as a null model rather than a universal biological state.","Explain how selection alters frequencies through differential fitness.","Explain mutation and migration/gene flow effects.","Explain genetic drift and its dependence on effective population size, with an example of founder/bottleneck effects."]},{"unit":"unit3","q":"Compare Lamarckism, Darwinism, mutation theory and the Modern Synthesis in historical and mechanistic perspective.","modelAnswer":"Lamarck proposed use/disuse and inheritance of acquired characters; Darwin established descent with modification and natural selection acting on heritable variation but lacked a genetic mechanism. De Vries emphasised mutation and saltational change. The Modern Synthesis integrated Mendelian genetics, population genetics, systematics and Darwinian selection, interpreting evolution through population-level changes in allele frequencies and their long-term consequences. Historical theories should be evaluated in context: observations may remain important even when proposed mechanisms are superseded.","markingPoints":["Present Lamarck's principal mechanism and its historical significance.","Explain Darwinian natural selection and descent with modification.","Explain de Vries' mutation theory and its limitation as a complete evolutionary mechanism.","Show how Mendelian genetics resolved the inheritance problem for evolutionary theory.","Define the Modern Synthesis and its population-genetic foundation.","Compare the theories critically rather than as a chronological list."]},{"unit":"unit3","q":"Discuss genetic drift, founder effect and population bottlenecks, with emphasis on effective population size and loss of diversity.","modelAnswer":"Genetic drift is stochastic sampling of alleles between generations and becomes stronger as effective population size decreases. A founder effect occurs when a new population is established by a small, non-representative sample; a bottleneck is a sharp reduction in population size that similarly intensifies drift. Both can reduce heterozygosity, lose rare alleles and shift allele frequencies without adaptive cause. Effective population size, not merely census size, determines the strength of drift, and recovery of population numbers does not automatically restore lost genetic diversity.","markingPoints":["Define genetic drift as stochastic allele-frequency change.","Relate drift strength to effective population size.","Explain founder effect and give its sampling logic.","Explain population bottlenecks and genetic consequences.","Discuss loss of allelic richness and heterozygosity.","Distinguish stochastic drift effects from natural selection and note conservation implications."]},{"unit":"unit4","q":"Describe the workflow of molecular phylogenetics from sequence alignment to tree construction and interpretation.","modelAnswer":"A molecular phylogenetic analysis begins by selecting homologous sequences and appropriate taxa, then generating an alignment that represents positional homology. An evolutionary/substitution model is chosen where required, and a tree is inferred using a method such as distance, maximum parsimony, maximum likelihood or Bayesian inference. Support and uncertainty must be assessed, often by resampling or posterior measures. Rooting, outgroup choice, recombination, paralogy, alignment quality, model fit and sampling can all alter interpretation. The final tree is a hypothesis of relationships, not a ladder of advancement.","markingPoints":["Establish homology and appropriate taxon/sequence sampling.","Explain multiple sequence alignment as a hypothesis of positional homology.","Distinguish distance and character/model-based tree methods.","Explain rooting and correct outgroup use.","Describe support assessment such as bootstrap values conceptually.","Discuss alignment, model, sampling, paralogy/recombination and interpretation limitations."]},{"unit":"unit4","q":"Explain species concepts, reproductive isolation and mechanisms of allopatric and sympatric speciation.","modelAnswer":"The biological species concept defines species through actual or potential interbreeding and reproductive isolation, whereas phylogenetic concepts emphasise diagnosable or independently evolving lineages. Speciation evolves when gene flow is sufficiently reduced for divergence to accumulate. Prezygotic barriers prevent mating or fertilisation; postzygotic barriers reduce hybrid viability or fertility. Allopatric speciation is promoted by geographic separation, whereas sympatric speciation occurs without geographic separation through mechanisms such as assortative mating, ecological divergence or polyploidy in suitable taxa.","markingPoints":["Compare biological and phylogenetic species concepts and their domains of usefulness.","Define speciation as lineage divergence with reduced gene flow/reproductive cohesion.","Distinguish prezygotic from postzygotic isolation with examples.","Explain allopatric speciation and the role of geographic separation.","Explain sympatric speciation and plausible mechanisms.","Discuss reinforcement, hybridisation or limitations of species concepts where relevant."]},{"unit":"unit4","q":"Discuss molecular clocks, their assumptions, calibration and limitations in estimating divergence time.","modelAnswer":"A molecular clock estimates divergence time from accumulated sequence change only when rate and calibration assumptions are addressed. The simplest relation links genetic distance to elapsed time and lineage rate, but real rates vary among genes, lineages and timescales. Fossils, biogeographic events or dated samples can calibrate clocks, each with uncertainty. Multiple substitutions, selection, saturation, generation-time effects, model misspecification and calibration error can bias estimates. Modern analyses therefore often use relaxed clocks and report credible or confidence intervals rather than a single exact date.","markingPoints":["Explain the basic relation between molecular divergence, substitution rate and time.","Distinguish mutation rate from substitution rate.","Explain why rate constancy is an assumption, not a universal fact.","Describe fossil/biogeographic/dated-sample calibration conceptually.","Discuss saturation, selection, lineage-rate variation and model uncertainty.","Explain relaxed clocks and the need to report uncertainty around divergence estimates."]},{"unit":"unit5","q":"Compare phyletic gradualism and punctuated equilibrium as models of evolutionary tempo.","modelAnswer":"Phyletic gradualism emphasises cumulative change through many relatively small transformations within lineages, whereas punctuated equilibrium predicts long intervals of relative morphological stasis interrupted by comparatively rapid change associated with speciation in the geological record. They concern tempo and pattern, not mutually exclusive genetic mechanisms. Fossil resolution, sampling, trait choice and timescale matter: apparently abrupt change can still span many generations, and gradual evolution can occur in some traits or lineages while stasis characterises others.","markingPoints":["Define phyletic gradualism accurately.","Define punctuated equilibrium accurately.","Compare their predictions for fossil patterns and evolutionary tempo.","Clarify that 'rapid' is geological and does not imply instantaneous change.","Discuss stasis, speciation and sampling/resolution issues.","Conclude that empirical patterns can vary among lineages, traits and timescales."]},{"unit":"unit5","q":"Describe human evolution as a branching phylogeny and integrate fossil, anatomical and molecular evidence.","modelAnswer":"Human evolution is a branching population history, not a linear ladder from an ape ancestor to modern humans. Fossils document mosaics of bipedal, dental, cranial and behavioural traits among diverse hominins, including australopithecines and multiple Homo lineages. Comparative anatomy places humans within primates and hominoids. Molecular phylogenies support close relationships among African apes and humans, while ancient genomes reveal admixture between Homo sapiens and Neanderthal/Denisovan-related populations. Evidence should be integrated with geographic and chronological context, and uncertain fossil taxonomy should be acknowledged.","markingPoints":["Reject a linear ladder model and describe branching hominin phylogeny.","Use key anatomical evidence such as bipedalism, dentition and cranial change.","Place hominins within primate/hominoid phylogeny.","Discuss representative australopithecine and Homo diversity without implying every taxon is a direct ancestor.","Integrate molecular and ancient-DNA evidence, including archaic admixture.","Acknowledge dating, fossil sampling and taxonomic uncertainty."]},{"unit":"unit5","q":"Evaluate the contributions and limitations of mitochondrial DNA, Y-chromosome markers and ancient DNA in reconstructing human origins.","modelAnswer":"Mitochondrial DNA traces maternally inherited lineages and is useful because of high copy number and a compact non-recombining genome, but it represents only one locus and one genealogical history. The Y chromosome similarly traces paternal lineages in relevant regions and has sex-specific demographic sensitivity. Ancient DNA directly samples past genomes and has transformed reconstruction of archaic relationships and admixture, but preservation, contamination, reference bias and uneven geographic sampling are major limitations. Robust human-origin models therefore integrate autosomal genomes, uniparental markers, ancient DNA, fossils and archaeology.","markingPoints":["Explain what mitochondrial DNA can infer and why it is maternally informative.","Explain Y-chromosome paternal-lineage inference and its sampling limitations.","Explain the distinctive value of ancient DNA as direct historical genomic evidence.","Discuss uniparental-marker limitations and stochastic genealogy.","Discuss preservation, contamination, sampling and analytical bias in ancient DNA.","Integrate mtDNA, Y, autosomal, fossil and archaeological evidence rather than treating one marker as the complete human history."]}]}</script>
<script type="application/json" id="data-flashcards">[{"id":"fc-unit1-01-mendelian-principles","unit":"unit1","front":"Mendelian principles","back":"Mendelian inheritance explains how discrete hereditary factors (genes) are transmitted from parents to offspring. The core principles are segregation of allele pairs during gamete formation and, for unlinked loci, independent assortment."},{"id":"fc-unit1-02-monohybrid-cross","unit":"unit1","front":"Monohybrid cross","back":"A monohybrid cross follows inheritance at one locus, commonly between heterozygotes such as Aa × Aa. With complete dominance it predicts a 1:2:1 genotypic ratio and a 3:1 phenotypic ratio."},{"id":"fc-unit1-03-law-of-segregation","unit":"unit1","front":"Law of segregation","back":"The law of segregation states that the two alleles at a diploid locus separate during gamete formation, so each gamete carries one allele. The cytological basis is separation of homologous chromosomes, and later sister chromatids, during meiosis."},{"id":"fc-unit1-04-classical-3-1-phenotypic-ratio","unit":"unit1","front":"Classical 3:1 phenotypic ratio","back":"A 3:1 F2 phenotypic ratio arises from Aa × Aa under complete dominance, random fertilisation, equal viability, and no segregation distortion. Modified ratios indicate alternative dominance relations, lethality, or gene interaction."},{"id":"fc-unit1-05-incomplete-dominance","unit":"unit1","front":"Incomplete dominance","back":"In incomplete dominance the heterozygote has a phenotype intermediate between the two homozygotes. Because all three genotypes are phenotypically distinguishable, the F2 phenotypic ratio is typically 1:2:1."},{"id":"fc-unit1-06-codominance","unit":"unit1","front":"Codominance","back":"In codominance both alleles are detectably expressed in the heterozygote. The human ABO system illustrates codominance between Iᴬ and Iᴮ, although the locus also contains a recessive i allele."},{"id":"fc-unit1-07-lethal-genes","unit":"unit1","front":"Lethal genes","back":"Lethal alleles reduce viability in particular genotypes and can modify expected Mendelian ratios. In an Aa × Aa cross with recessive aa lethality, removal of the aa class yields a 1 AA : 2 Aa surviving genotype ratio; the surviving phenotype ratio depends on how AA and Aa are expressed."},{"id":"fc-unit1-08-two-gene-interactions","unit":"unit1","front":"Two-gene interactions","back":"When two loci influence one phenotype, the F2 9:3:3:1 classes can be regrouped according to pathway relationships. The resulting modified ratios provide evidence for complementary, epistatic, duplicate or inhibitory interactions while each locus still segregates Mendelianly."},{"id":"fc-unit1-09-epistasis","unit":"unit1","front":"Epistasis","back":"Epistasis occurs when alleles at one locus modify or mask phenotypic expression at another locus. Classical dihybrid ratios such as 9:3:4, 12:3:1, 9:7, 15:1 and 13:3 reflect different interaction architectures."},{"id":"fc-unit1-10-complementary-gene-interaction","unit":"unit1","front":"Complementary gene interaction","back":"Complementary gene action requires a particular dominant allele at each of two loci for a phenotype to appear. A classic F2 pattern is 9:7."},{"id":"fc-unit1-11-supplementary-gene-interaction","unit":"unit1","front":"Supplementary gene interaction","back":"Supplementary interactions occur when one gene produces a primary effect and another modifies or supplements that phenotype, creating modified dihybrid ratios."},{"id":"fc-unit1-12-multiple-gene-interactions","unit":"unit1","front":"Multiple-gene interactions","back":"Phenotypes may depend on networks containing more than two loci. Such interactions produce many genotype-to-phenotype mappings and are best analysed by separating segregation at each locus from the biochemical or developmental pathway that combines their effects."},{"id":"fc-unit1-13-pleiotropy","unit":"unit1","front":"Pleiotropy","back":"Pleiotropy is the influence of one gene on multiple phenotypic traits, often because a gene product participates in several tissues or biological processes."},{"id":"fc-unit1-14-penetrance","unit":"unit1","front":"Penetrance","back":"Penetrance is the proportion of individuals with a genotype who express its associated phenotype. Reduced penetrance can cause apparently unaffected individuals to transmit disease-associated alleles."},{"id":"fc-unit1-15-expressivity","unit":"unit1","front":"Expressivity","back":"Expressivity describes the degree or severity with which a genotype is phenotypically expressed among individuals who show the phenotype."},{"id":"fc-unit1-16-linkage","unit":"unit1","front":"Linkage","back":"Genes located on the same chromosome can be inherited together more often than expected by independent assortment. Recombination can break linkage, and recombination frequency generally rises with physical distance for relatively close loci."},{"id":"fc-unit1-17-types-of-linkage","unit":"unit1","front":"Types of linkage","back":"Linkage may be described as complete when no detectable recombinants occur and incomplete when crossing over generates recombinant gametes. Coupling (cis) and repulsion (trans) describe alternative haplotype phases of alleles at linked loci."},{"id":"fc-unit1-18-crossing-over","unit":"unit1","front":"Crossing over","back":"Crossing over is reciprocal exchange between non-sister chromatids of homologous chromosomes during meiotic prophase I. It produces recombinant chromatids and contributes to genetic variation."},{"id":"fc-unit1-19-types-of-crossing-over","unit":"unit1","front":"Types of crossing over","back":"Crossing over may involve single, double or multiple exchanges between homologous chromatids. Double crossovers can involve two, three or four chromatids; their recovery depends on chromatid participation and crossover interference."},{"id":"fc-unit1-20-mechanism-of-crossing-over","unit":"unit1","front":"Mechanism of crossing over","back":"Modern molecular models explain crossing over through programmed DNA double-strand breaks, strand invasion, homologous pairing and resolution of recombination intermediates."},{"id":"fc-unit1-21-theories-of-crossing-over","unit":"unit1","front":"Theories of crossing over","back":"Historical cytological theories attempted to explain the relation between chiasmata and genetic recombination. Modern interpretation is molecular: programmed DNA double-strand breaks are repaired through homologous recombination pathways that can resolve as crossovers or non-crossovers."},{"id":"fc-unit1-22-genetic-mapping","unit":"unit1","front":"Genetic mapping","back":"Genetic mapping orders loci using recombination frequencies. For short intervals, 1% recombination is approximately 1 centimorgan, but multiple crossovers make the relationship nonlinear over long distances."},{"id":"fc-unit1-23-cytological-mapping","unit":"unit1","front":"Cytological mapping","back":"Cytological mapping assigns genes or DNA sequences to visible chromosome regions using chromosome morphology, banding, deletions, translocations or in situ hybridisation. It links genetic phenomena to physical chromosome location but has different resolution from linkage and sequence maps."},{"id":"fc-unit1-24-linkage-maps","unit":"unit1","front":"Linkage maps","back":"A linkage map places markers in relative order along chromosomes using recombination data. Three-point crosses can infer gene order and reveal double crossovers."},{"id":"fc-unit1-25-molecular-marker-mapping","unit":"unit1","front":"Molecular-marker mapping","back":"Molecular markers such as SNPs, microsatellites and sequence variants can be used to track chromosomal regions and map traits through linkage or association approaches."},{"id":"fc-unit1-26-somatic-cell-hybrid-mapping","unit":"unit1","front":"Somatic-cell hybrid mapping","back":"Somatic-cell hybrid mapping historically assigned human genes to chromosomes by correlating retention of particular human chromosomes with expression of a gene product in hybrid cell lines."},{"id":"fc-unit1-27-polygenic-inheritance","unit":"unit1","front":"Polygenic inheritance","back":"Polygenic inheritance occurs when many loci contribute to a quantitative trait, often producing continuous phenotypic variation. Environmental effects commonly add further variance."},{"id":"fc-unit1-28-heritability","unit":"unit1","front":"Heritability","back":"Heritability is the proportion of phenotypic variance attributable to genetic variance in a specified population and environment. Broad-sense heritability includes all genetic variance; narrow-sense heritability emphasises additive genetic variance."},{"id":"fc-unit1-29-measurement-of-heritability","unit":"unit1","front":"Measurement of heritability","back":"Heritability can be estimated from variance components, resemblance among relatives, parent–offspring regression or designed breeding studies. Interpretation depends on study design and assumptions."},{"id":"fc-unit2-01-chromosome-structure","unit":"unit2","front":"Chromosome structure","back":"A chromosome is a DNA–protein complex organised into chromatin. Eukaryotic chromosomes contain linear DNA, centromeres, telomeres and chromosomal domains that compact and regulate the genome."},{"id":"fc-unit2-02-chromosome-chemical-composition","unit":"unit2","front":"Chromosome chemical composition","back":"Eukaryotic chromosomes consist primarily of DNA, histones and non-histone chromosomal proteins, together with associated RNAs. Nucleosomes form the basic repeating unit of chromatin."},{"id":"fc-unit2-03-chromosome-organisation","unit":"unit2","front":"Chromosome organisation","back":"Chromosome organisation is hierarchical, from DNA wrapped around histone octamers to higher-order chromatin loops and chromosome territories. Euchromatin and heterochromatin differ in compaction and functional state."},{"id":"fc-unit2-04-special-chromosomes","unit":"unit2","front":"Special chromosomes","back":"Special chromosomes are unusually organised chromosomes that become conspicuous in particular cell types or developmental stages. Polytene chromosomes contain many aligned DNA copies and display banding/puffs, whereas lampbrush chromosomes have extended transcriptionally active loops; both are classic models for relating chromosome structure to gene activity."},{"id":"fc-unit2-05-b-chromosomes","unit":"unit2","front":"B chromosomes","back":"B chromosomes are supernumerary chromosomes present in addition to the standard A-chromosome complement in some species. They often show non-Mendelian transmission and variable effects on fitness."},{"id":"fc-unit2-06-karyotype","unit":"unit2","front":"Karyotype","back":"A karyotype describes the chromosome complement of an individual, including chromosome number and gross morphology. Cytogenetic analysis can detect large numerical and structural abnormalities."},{"id":"fc-unit2-07-barr-body","unit":"unit2","front":"Barr body","back":"A Barr body is a condensed, largely inactive X chromosome visible in many somatic nuclei. X-chromosome inactivation provides dosage compensation in therian mammals and creates cellular mosaicism."},{"id":"fc-unit2-08-numerical-chromosome-aberrations","unit":"unit2","front":"Numerical chromosome aberrations","back":"Numerical chromosome aberrations change chromosome number through errors such as meiotic or mitotic nondisjunction, anaphase lag, or whole-genome duplication. The central distinction is between euploid changes in complete chromosome sets and aneuploid gain or loss of individual chromosomes."},{"id":"fc-unit2-09-euploidy","unit":"unit2","front":"Euploidy","back":"Euploidy refers to variation involving complete chromosome sets, such as haploidy or polyploidy. Polyploidy is especially important in plant evolution and speciation."},{"id":"fc-unit2-10-aneuploidy","unit":"unit2","front":"Aneuploidy","back":"Aneuploidy is gain or loss of individual chromosomes, commonly produced by nondisjunction. Examples include trisomy 21 and monosomy X."},{"id":"fc-unit2-11-structural-chromosome-aberrations","unit":"unit2","front":"Structural chromosome aberrations","back":"Structural chromosome aberrations arise when chromosome breakage and repair alter segment order or dosage. Deletions and duplications change copy number; inversions reverse segment orientation; translocations move material within or between chromosomes, with balanced and unbalanced outcomes distinguished by net DNA dosage."},{"id":"fc-unit2-12-deletion","unit":"unit2","front":"Deletion","back":"A chromosomal deletion removes a segment of DNA and can cause dosage imbalance or expose recessive alleles. Phenotypic severity depends on the genes and regulatory regions lost."},{"id":"fc-unit2-13-duplication","unit":"unit2","front":"Duplication","back":"A chromosomal duplication creates an extra copy of a chromosome segment. Gene duplication can alter dosage and, over evolutionary time, provide material for functional divergence."},{"id":"fc-unit2-14-inversion","unit":"unit2","front":"Inversion","back":"An inversion occurs when a chromosome segment is reversed in orientation. In heterozygotes, crossing over within the inverted region can produce unbalanced products and reduce apparent recombination."},{"id":"fc-unit2-15-translocation","unit":"unit2","front":"Translocation","back":"A translocation moves chromosome material to a new chromosomal location. Reciprocal translocation carriers can be phenotypically normal but may produce unbalanced gametes."},{"id":"fc-unit2-16-down-syndrome","unit":"unit2","front":"Down syndrome","back":"Down syndrome most commonly results from trisomy 21, usually due to meiotic nondisjunction; less often it results from a Robertsonian translocation or mosaicism."},{"id":"fc-unit2-17-turner-syndrome","unit":"unit2","front":"Turner syndrome","back":"Turner syndrome involves complete or partial monosomy X in phenotypic females, with considerable clinical variability and frequent mosaic forms."},{"id":"fc-unit2-18-edwards-syndrome","unit":"unit2","front":"Edwards syndrome","back":"Edwards syndrome is usually caused by trisomy 18 and is associated with severe developmental abnormalities and high infant mortality."},{"id":"fc-unit2-19-klinefelter-syndrome","unit":"unit2","front":"Klinefelter syndrome","back":"Klinefelter syndrome most commonly has a 47,XXY karyotype and affects phenotypic males. Meiotic nondisjunction is a major cause, and mosaic cases also occur."},{"id":"fc-unit2-20-pedigree-analysis","unit":"unit2","front":"Pedigree analysis","back":"Pedigree analysis infers inheritance patterns by tracing phenotypes through generations. It is used to evaluate autosomal, sex-linked and mitochondrial transmission and to estimate recurrence risks."},{"id":"fc-unit2-21-human-genome-project","unit":"unit2","front":"Human Genome Project","back":"The Human Genome Project produced a reference human genome sequence and catalysed large-scale genomics, mapping and technology development. Modern human genomics now uses multiple reference assemblies and population-scale variation resources."},{"id":"fc-unit2-22-prenatal-diagnosis","unit":"unit2","front":"Prenatal diagnosis","back":"Prenatal genetic diagnosis uses fetal or placental material to answer a defined clinical genetic question. Invasive sampling such as CVS or amniocentesis can support cytogenetic or molecular testing; interpretation must address test scope, false-positive/false-negative limits, procedural risk, informed consent and non-directive counselling."},{"id":"fc-unit2-23-amniocentesis","unit":"unit2","front":"Amniocentesis","back":"Amniocentesis samples amniotic fluid, typically in the second trimester, to obtain fetal cells or analytes for diagnostic testing. It is an invasive procedure and must be discussed in a clinical and ethical context."},{"id":"fc-unit2-24-chorionic-villus-sampling","unit":"unit2","front":"Chorionic Villus Sampling","back":"Chorionic villus sampling obtains placental chorionic tissue earlier in pregnancy than amniocentesis and can support prenatal genetic diagnosis."},{"id":"fc-unit2-25-genetic-counselling","unit":"unit2","front":"Genetic counselling","back":"Genetic counselling is a communication process that helps individuals and families understand genetic conditions, testing options, inheritance, uncertainty and reproductive choices while supporting autonomous decision-making."},{"id":"fc-unit2-26-eugenics","unit":"unit2","front":"Eugenics","back":"Eugenics refers to historical and contemporary attempts to influence reproduction in order to change the genetic composition of populations. Coercive eugenic policies caused major human-rights abuses and are scientifically and ethically discredited."},{"id":"fc-unit2-27-euthenics","unit":"unit2","front":"Euthenics","back":"Euthenics is the historical concept of improving human well-being through environmental, educational and social conditions rather than selective reproduction."},{"id":"fc-unit2-28-sex-linked-inheritance","unit":"unit2","front":"Sex-linked inheritance","back":"Sex-linked inheritance involves genes located on sex chromosomes. X-linked patterns differ between individuals with one versus two X chromosomes because hemizygosity exposes recessive X-linked alleles."},{"id":"fc-unit2-29-sex-limited-characters","unit":"unit2","front":"Sex-limited characters","back":"Sex-limited traits are genetically present in both sexes but expressed in only one because of anatomical or hormonal context."},{"id":"fc-unit2-30-sex-influenced-characters","unit":"unit2","front":"Sex-influenced characters","back":"Sex-influenced traits are expressed differently in the sexes, often because dominance relationships or hormonal environments differ."},{"id":"fc-unit3-01-organic-evolution","unit":"unit3","front":"Organic evolution","back":"Organic evolution is heritable change in populations across generations. It includes changes in allele frequencies, trait distributions and lineage composition produced by mutation, recombination, natural selection, genetic drift and gene flow; individual acclimatisation or development is not itself evolutionary change."},{"id":"fc-unit3-02-lamarckism","unit":"unit3","front":"Lamarckism","back":"Lamarck proposed that organisms change through use and disuse and that acquired characteristics could be inherited. Although important historically, this mechanism does not explain modern genetic inheritance."},{"id":"fc-unit3-03-darwinism","unit":"unit3","front":"Darwinism","back":"Darwinian evolution centres on descent with modification and natural selection acting on heritable variation. Darwin lacked modern genetics, which was later integrated into the evolutionary synthesis."},{"id":"fc-unit3-04-mutation-theory","unit":"unit3","front":"Mutation theory","back":"Hugo de Vries emphasised mutations as discontinuous sources of variation and proposed saltational evolutionary change. Modern evolutionary genetics recognises mutation as a source of new alleles but not a complete theory of evolution by itself."},{"id":"fc-unit3-05-modern-evolutionary-synthesis","unit":"unit3","front":"Modern evolutionary synthesis","back":"The Modern Synthesis united Mendelian genetics, population genetics, natural selection and systematics, explaining evolution as changes in allele frequencies and their consequences over time."},{"id":"fc-unit3-06-population","unit":"unit3","front":"Population","back":"In evolutionary genetics, a population is a set of conspecific individuals that occupy a defined spatial and temporal context and exchange genes to some degree. Population boundaries are biological hypotheses: dispersal, mating structure and reproductive connectivity determine whether sampled individuals behave as one evolutionary unit or several structured subpopulations."},{"id":"fc-unit3-07-gene-pool","unit":"unit3","front":"Gene pool","back":"The gene pool is the complete set of alleles present in an interbreeding population, considered together with their frequencies. Evolutionary change can therefore be quantified as changes in the composition of this population-level allele pool across generations."},{"id":"fc-unit3-08-allele-frequency","unit":"unit3","front":"Allele frequency","back":"Allele frequency is the proportion of all gene copies at a locus represented by a particular allele. In a diploid population it is calculated from genotype counts, and its change through generations is a central quantitative measure of evolution."},{"id":"fc-unit3-09-sources-of-genetic-variation","unit":"unit3","front":"Sources of genetic variation","back":"Genetic variation originates through mutation, recombination, independent assortment, gene duplication, transposable-element activity and other genome changes; gene flow can introduce already-existing variants from other populations. These processes generate or redistribute heritable differences on which selection and drift subsequently act."},{"id":"fc-unit3-10-mutation","unit":"unit3","front":"Mutation","back":"Mutation is a heritable change in genetic material and is the ultimate source of new alleles. Mutation types range from nucleotide substitutions to large structural changes."},{"id":"fc-unit3-11-transposable-elements","unit":"unit3","front":"Transposable elements","back":"Transposable elements are DNA sequences capable of moving or copying within genomes. They can generate insertional mutations, regulatory changes, recombination substrates and genome expansion."},{"id":"fc-unit3-12-recombination","unit":"unit3","front":"Recombination","back":"Recombination reshuffles alleles between homologous chromosomes and creates new haplotypes. It changes associations among loci without necessarily changing allele frequencies directly."},{"id":"fc-unit3-13-natural-selection","unit":"unit3","front":"Natural selection","back":"Natural selection is differential survival and reproduction associated with heritable phenotypic differences. It changes allele frequencies when trait variation has a genetic basis."},{"id":"fc-unit3-14-evolutionary-forces","unit":"unit3","front":"Evolutionary forces","back":"Evolutionary forces are processes that alter allele frequencies, genotype frequencies or their spatial distribution. Mutation introduces new alleles, selection changes representation according to fitness, drift changes frequencies stochastically, and gene flow moves alleles among populations; non-random mating primarily alters genotype proportions and can interact with these forces."},{"id":"fc-unit3-15-migration-and-gene-flow","unit":"unit3","front":"Migration and gene flow","back":"Gene flow is the movement of alleles among populations through migration and reproduction. It can increase variation within populations while reducing divergence between them."},{"id":"fc-unit3-16-genetic-drift","unit":"unit3","front":"Genetic drift","back":"Genetic drift is stochastic change in allele frequencies due to finite population sampling. It is especially strong in small populations and can lead to fixation or loss independent of adaptive value."},{"id":"fc-unit3-17-founder-effect","unit":"unit3","front":"Founder effect","back":"A founder effect occurs when a new population is established by a small sample of a larger population, causing allele frequencies and genetic diversity to differ by chance."},{"id":"fc-unit3-18-population-bottleneck","unit":"unit3","front":"Population bottleneck","back":"A population bottleneck is a sharp temporary reduction in population size that can cause random allele loss, reduced heterozygosity and long-lasting genetic consequences."},{"id":"fc-unit3-19-hardy-weinberg-equilibrium","unit":"unit3","front":"Hardy–Weinberg equilibrium","back":"The Hardy–Weinberg model provides a null expectation for genotype frequencies in an idealised population with random mating, very large size, and no selection, mutation or migration. For two alleles, p+q=1 and p²+2pq+q²=1."},{"id":"fc-unit3-20-hardy-weinberg-calculations","unit":"unit3","front":"Hardy–Weinberg calculations","back":"Hardy–Weinberg calculations connect observed genotype or phenotype data with allele-frequency estimates under an explicit null model. For two alleles, p + q = 1 and expected genotype frequencies after random mating are p², 2pq and q²; observed counts can then be compared with expectations using appropriate statistical tests."},{"id":"fc-unit3-21-stabilising-selection","unit":"unit3","front":"Stabilising selection","back":"Stabilising selection favours intermediate phenotypes over extremes. It can reduce phenotypic variance around an optimum while leaving the population mean relatively unchanged, provided the selective environment remains stable."},{"id":"fc-unit3-22-directional-selection","unit":"unit3","front":"Directional selection","back":"Directional selection favours phenotypes toward one end of a distribution, shifting the population mean through generations. It commonly occurs when environmental conditions change or when a new selective pressure alters relative fitness."},{"id":"fc-unit3-23-disruptive-selection","unit":"unit3","front":"Disruptive selection","back":"Disruptive selection favours phenotypic extremes over intermediates and may increase variation. Under some ecological conditions it can contribute to divergence."},{"id":"fc-unit4-01-origin-of-life","unit":"unit4","front":"Origin of life","back":"Origin-of-life research investigates how prebiotic chemistry could generate self-replicating, compartmentalised systems capable of Darwinian evolution. Hypotheses include RNA-world models, metabolism-first models and hydrothermal scenarios."},{"id":"fc-unit4-02-molecular-evolution","unit":"unit4","front":"Molecular evolution","back":"Molecular evolution examines changes in DNA, RNA and protein sequences through time and the population processes that shape them."},{"id":"fc-unit4-03-principles-of-molecular-evolutionary-studi","unit":"unit4","front":"Principles of molecular evolutionary studies","back":"Molecular evolutionary studies begin by establishing homology, obtaining an appropriate sequence alignment, choosing an evolutionary model, and distinguishing mutation from substitution. Inference then depends on sampling, rate variation, selection, recombination, calibration and statistical uncertainty; molecular similarity alone is not equivalent to a resolved phylogeny."},{"id":"fc-unit4-04-molecular-divergence","unit":"unit4","front":"Molecular divergence","back":"Molecular divergence is the accumulation of sequence differences between lineages after separation from a common ancestor."},{"id":"fc-unit4-05-molecular-phylogenetics","unit":"unit4","front":"Molecular phylogenetics","back":"Molecular phylogenetics reconstructs evolutionary relationships using DNA, RNA or protein sequence data and explicit models of sequence change."},{"id":"fc-unit4-06-molecular-markers","unit":"unit4","front":"Molecular markers","back":"Molecular markers are heritable DNA variants used to identify individuals, populations, genomic regions or evolutionary relationships. SNPs, microsatellites and sequence loci are common examples."},{"id":"fc-unit4-07-molecular-clock","unit":"unit4","front":"Molecular clock","back":"A molecular clock estimates divergence time from molecular change, calibrated using fossils, biogeography or known dates. Strict clocks assume constant rates; relaxed-clock models allow rate variation."},{"id":"fc-unit4-08-sequence-evolution","unit":"unit4","front":"Sequence evolution","back":"Sequence evolution comprises substitutions, insertions, deletions, duplications, gene conversion and other changes that accumulate in DNA, RNA or proteins through time. The observed pattern reflects mutation processes plus population-genetic filtering by selection and drift, and repeated substitutions can obscure the true number of historical changes."},{"id":"fc-unit4-09-multiple-sequence-alignment","unit":"unit4","front":"Multiple sequence alignment","back":"Multiple sequence alignment arranges homologous sequences to infer positional correspondence, conserved regions and substitutions. Alignment quality strongly influences downstream phylogenetic inference."},{"id":"fc-unit4-10-phylogenetic-trees","unit":"unit4","front":"Phylogenetic trees","back":"A phylogenetic tree is a hypothesis about evolutionary relationships. Nodes represent lineage divergences or sampled ancestors depending on representation; tips represent sampled taxa or sequences."},{"id":"fc-unit4-11-tree-terminology","unit":"unit4","front":"Tree terminology","back":"Phylogenetic-tree terminology describes hypotheses of ancestry using roots, branches, internal nodes, terminal taxa, clades, sister groups and outgroups. Topology records branching relationships, whereas branch lengths may represent time, amount of change or no quantitative scale at all depending on the tree."},{"id":"fc-unit4-12-rooted-and-unrooted-trees","unit":"unit4","front":"Rooted and unrooted trees","back":"A rooted tree specifies the direction of ancestry from a common ancestor, whereas an unrooted tree depicts relationships without specifying the ancestral root."},{"id":"fc-unit4-13-clades","unit":"unit4","front":"Clades","back":"A clade is a monophyletic group consisting of a common ancestor and all of its descendants. Clade membership is defined by branching history and shared ancestry rather than by superficial similarity."},{"id":"fc-unit4-14-nodes","unit":"unit4","front":"Nodes","back":"A node in a phylogenetic tree is a branching or terminal point. An internal node represents the inferred most recent common ancestor of the descendant lineages emerging from it, whereas a terminal node represents a sampled taxon or sequence; an internal node is not automatically a known fossil species."},{"id":"fc-unit4-15-branches","unit":"unit4","front":"Branches","back":"Branches in a phylogenetic tree connect nodes and represent evolutionary lineages between divergence events or sampled endpoints. Their visual length has meaning only when the tree explicitly scales branches to time or amount of change; horizontal order and line length in an unscaled cladogram do not indicate evolutionary advancement."},{"id":"fc-unit4-16-sister-taxa","unit":"unit4","front":"Sister taxa","back":"Sister taxa are two lineages that share an immediate most recent common ancestor not shared with any other included taxon. Neither sister taxon should be interpreted as the direct ancestor of the other."},{"id":"fc-unit4-17-outgroups","unit":"unit4","front":"Outgroups","back":"An outgroup is a taxon or lineage outside the focal ingroup used to help polarise character changes and root phylogenetic trees."},{"id":"fc-unit4-18-tree-construction","unit":"unit4","front":"Tree construction","back":"Phylogenetic tree construction involves selecting homologous characters, aligning or coding them, choosing an evolutionary model or optimality criterion, inferring topology and assessing support."},{"id":"fc-unit4-19-distance-methods","unit":"unit4","front":"Distance methods","back":"Distance methods convert pairwise sequence differences into evolutionary distance estimates and infer trees from the resulting matrix. Neighbor-joining is a common example."},{"id":"fc-unit4-20-character-based-approaches","unit":"unit4","front":"Character-based approaches","back":"Character-based phylogenetic methods analyse individual character states directly. Maximum parsimony seeks minimal change, while maximum likelihood and Bayesian approaches use explicit evolutionary models."},{"id":"fc-unit4-21-tree-interpretation","unit":"unit4","front":"Tree interpretation","back":"Tree interpretation requires reading branching order, common ancestry, clade membership, rooting and support without mistaking tip order or branch rotation for evolutionary rank."},{"id":"fc-unit4-22-biological-species-concept","unit":"unit4","front":"Biological species concept","back":"The biological species concept defines species as groups of actually or potentially interbreeding natural populations reproductively isolated from other such groups."},{"id":"fc-unit4-23-phylogenetic-species-concept","unit":"unit4","front":"Phylogenetic species concept","back":"Phylogenetic species concepts identify species as diagnosable or independently evolving lineages in a phylogenetic framework."},{"id":"fc-unit4-24-speciation","unit":"unit4","front":"Speciation","back":"Speciation is the evolution of reproductive isolation and lineage independence. It can involve geographic separation, ecological divergence, sexual selection and genomic differentiation."},{"id":"fc-unit4-25-reproductive-isolation","unit":"unit4","front":"Reproductive isolation","back":"Reproductive isolation comprises barriers that reduce gene flow between populations. Barriers may act before fertilisation or after hybrid formation."},{"id":"fc-unit4-26-prezygotic-isolation","unit":"unit4","front":"Prezygotic isolation","back":"Prezygotic barriers prevent mating or fertilisation through habitat, temporal, behavioural, mechanical or gametic isolation."},{"id":"fc-unit4-27-postzygotic-isolation","unit":"unit4","front":"Postzygotic isolation","back":"Postzygotic isolation acts after fertilisation and reduces gene flow because hybrids have reduced viability, reduced fertility, or later-generation breakdown. Hybrid inviability and hybrid sterility are common examples."},{"id":"fc-unit4-28-allopatric-speciation","unit":"unit4","front":"Allopatric speciation","back":"Allopatric speciation occurs when geographic separation restricts gene flow, allowing populations to diverge through selection, drift and mutation."},{"id":"fc-unit4-29-sympatric-speciation","unit":"unit4","front":"Sympatric speciation","back":"Sympatric speciation occurs without complete geographic separation, often through strong ecological divergence, assortative mating or, in plants, polyploidy."},{"id":"fc-unit4-30-adaptive-radiation","unit":"unit4","front":"Adaptive radiation","back":"Adaptive radiation is rapid diversification of a lineage into multiple ecological forms, often after ecological opportunity or key innovations."},{"id":"fc-unit4-31-convergent-evolution","unit":"unit4","front":"Convergent evolution","back":"Convergent evolution produces similar traits independently in different lineages under similar selective pressures or functional constraints."},{"id":"fc-unit4-32-sexual-selection","unit":"unit4","front":"Sexual selection","back":"Sexual selection arises from differences in mating success and includes competition within a sex and mate choice between sexes. It can favour traits that increase reproduction even when they carry survival costs."},{"id":"fc-unit4-33-altruism","unit":"unit4","front":"Altruism","back":"Evolutionary altruism describes behaviour that reduces an actor’s direct fitness while increasing another individual’s fitness. Kin selection, inclusive fitness and reciprocal interactions can explain the evolution of such behaviour under specific conditions."},{"id":"fc-unit4-34-evolution-of-social-behaviour","unit":"unit4","front":"Evolution of social behaviour","back":"The evolution of social behaviour is analysed through its consequences for direct and indirect fitness. Cooperation, altruism, conflict and helping can evolve through mechanisms such as kin selection, reciprocal interactions, mutual benefit and population structure; Hamilton’s rule formalises when an indirect-fitness benefit to relatives can offset a cost to the actor."},{"id":"fc-unit5-01-origin-of-higher-categories","unit":"unit5","front":"Origin of higher categories","back":"Higher taxonomic categories arise through repeated lineage splitting, extinction and the accumulation of evolutionary novelties over deep time. Modern macroevolution does not require a separate mechanism for 'higher' taxa; it examines how speciation, developmental change, ecological opportunity and differential diversification generate large-scale phylogenetic patterns."},{"id":"fc-unit5-02-microevolution","unit":"unit5","front":"Microevolution","back":"Microevolution refers to changes in allele frequencies and trait distributions within populations over relatively short evolutionary timescales."},{"id":"fc-unit5-03-macroevolution","unit":"unit5","front":"Macroevolution","back":"Macroevolution concerns large-scale evolutionary patterns at and above the species level, including speciation, extinction and clade diversification."},{"id":"fc-unit5-04-megaevolution","unit":"unit5","front":"Megaevolution","back":"Megaevolution is an older term sometimes used for very large-scale evolutionary transitions and origins of major body plans. Modern evolutionary biology more commonly discusses macroevolutionary transitions and developmental innovation."},{"id":"fc-unit5-05-coevolution","unit":"unit5","front":"Coevolution","back":"Coevolution is reciprocal evolutionary change between interacting lineages, such as hosts and parasites, predators and prey, or mutualists."},{"id":"fc-unit5-06-evolutionary-rates","unit":"unit5","front":"Evolutionary rates","back":"Evolutionary rates vary among traits, genes, lineages and time intervals. Rates can be expressed morphologically, genetically or in diversification processes."},{"id":"fc-unit5-07-phyletic-gradualism","unit":"unit5","front":"Phyletic gradualism","back":"Phyletic gradualism describes evolutionary change as the cumulative transformation of a lineage through many relatively small changes over long intervals. It is a model of evolutionary tempo and pattern, not a claim that rates must be identical or constant."},{"id":"fc-unit5-08-punctuated-equilibrium","unit":"unit5","front":"Punctuated equilibrium","back":"Punctuated equilibrium proposes that species often show long intervals of relative morphological stasis interrupted by geologically shorter episodes of change associated with speciation."},{"id":"fc-unit5-09-geological-time-scale","unit":"unit5","front":"Geological time scale","back":"The geological time scale organises Earth history into eons, eras, periods and epochs
