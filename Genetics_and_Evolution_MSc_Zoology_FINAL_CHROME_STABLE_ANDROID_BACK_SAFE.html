function atlasView(){renderNav('atlas');return `<div class="section-title"><div><h1>Genetics & Evolution Atlas</h1><p>Concept diagrams designed for biological interpretation and comparison.</p></div></div><div class="grid"><article class="card span-6"><h2>Meiotic crossing over</h2><svg viewBox="0 0 600 280" role="img" aria-label="Crossing over between homologous chromosomes"><rect width="600" height="280" rx="18" fill="var(--surface2)"/><path d="M120 40 C180 90 180 190 120 240" stroke="#2563eb" stroke-width="14" fill="none"/><path d="M200 40 C140 90 140 190 200 240" stroke="#7c3aed" stroke-width="14" fill="none"/><path d="M380 40 C440 90 440 190 380 240" stroke="#2563eb" stroke-width="14" fill="none"/><path d="M460 40 C400 90 400 190 460 240" stroke="#7c3aed" stroke-width="14" fill="none"/><text x="300" y="265" text-anchor="middle" fill="var(--text)">Homologous non-sister chromatids exchange DNA during meiotic prophase I</text></svg><p><strong>Interpret:</strong> a cytological chiasma reflects an underlying recombination event; not every DNA repair event becomes a crossover.</p></article><article class="card span-6"><h2>Pedigree symbols</h2><div class="pedigree-symbols" aria-label="Pedigree symbol legend"><span><i class="pedigree-symbol"></i> male</span><span><i class="pedigree-symbol circle"></i> female</span><span><i class="pedigree-symbol filled"></i> affected male</span><span><i class="pedigree-symbol circle filled"></i> affected female</span></div><p>Transmission pattern must be inferred across generations; sex ratio alone is insufficient.</p></article><article class="card span-6"><h2>Chromosome structural rearrangements</h2><svg viewBox="0 0 700 300" role="img" aria-label="Deletion duplication inversion and translocation chromosome diagrams"><rect width="700" height="300" rx="18" fill="var(--surface2)"/><g font-size="16" fill="var(--text)"><text x="20" y="45">Normal</text><text x="20" y="105">Deletion</text><text x="20" y="165">Duplication</text><text x="20" y="225">Inversion</text><text x="20" y="285">Translocation</text></g><g font-size="18" font-weight="700"><text x="130" y="45" fill="#2563eb">A—B—C—D—E—F</text><text x="130" y="105" fill="#b42318">A—B—D—E—F</text><text x="130" y="165" fill="#0f766e">A—B—C—C—D—E—F</text><text x="130" y="225" fill="#7e22ce">A—B—E—D—C—F</text><text x="130" y="285" fill="#b45309">A—B—C | M—N—D—E—F</text></g></svg><p>Structural changes may be balanced or unbalanced; phenotype depends strongly on dosage and breakpoint context.</p></article><article class="card span-6"><h2>Selection patterns</h2><canvas id="selectionCanvas" width="700" height="300" aria-label="Selection pattern graph"></canvas><div class="result" id="selectionText" role="status">Choose a selection pattern to display a textual interpretation of the graph.</div><div class="tabs"><button class="btn" data-selection="stabilising">Stabilising</button><button class="btn" data-selection="directional">Directional</button><button class="btn" data-selection="disruptive">Disruptive</button></div></article><article class="card span-12 phylo"><h2>Phylogenetic tree anatomy</h2><svg viewBox="0 0 860 360" role="img" aria-label="Rooted phylogenetic tree in which outgroup D diverges before the ingroup containing taxa A, B and C"><g stroke="var(--text)" stroke-width="3" fill="none"><path d="M60 180 H150"/><path d="M150 180 V310 H700"/><path d="M150 180 V110 H260"/><path d="M260 110 V180 H700"/><path d="M260 110 V65 H380"/><path d="M380 65 V35 H700"/><path d="M380 65 V95 H700"/></g><g fill="var(--text)" font-size="18"><text x="16" y="185">Root</text><text x="715" y="40">Taxon A</text><text x="715" y="100">Taxon B</text><text x="715" y="185">Taxon C</text><text x="715" y="315">Outgroup D</text><text x="392" y="72">MRCA of A + B</text><text x="270" y="118">MRCA of A + B + C</text></g><g fill="var(--primary2)"><circle cx="150" cy="180" r="7"/><circle cx="260" cy="110" r="7"/><circle cx="380" cy="65" r="7"/></g></svg><p><strong>Interpretation:</strong> D is a valid outgroup because it diverges before the most recent common ancestor of the ingroup A + B + C. A and B are sister taxa; C is sister to the A + B clade. Rotating branches around any node does not change these relationships.</p></article><article class="card span-6"><h2>Karyotype concept</h2><div class="karyotype">${Array.from({length:24},(_,i)=>`<div class="chrom"><i></i><small>${i<22?i+1:(i===22?'X':'Y')}</small></div>`).join('')}</div><p>Human chromosome pairs are conventionally organised by size, centromere position and banding. The schematic above is not a diagnostic karyogram.</p></article><article class="card span-6"><h2>Genetic map concept</h2><svg viewBox="0 0 650 250" role="img" aria-label="Three gene linkage map"><rect width="650" height="250" rx="18" fill="var(--surface2)"/><line x1="100" y1="130" x2="550" y2="130" stroke="var(--text)" stroke-width="5"/><g stroke="var(--primary2)" stroke-width="5"><line x1="140" y1="105" x2="140" y2="155"/><line x1="305" y1="105" x2="305" y2="155"/><line x1="500" y1="105" x2="500" y2="155"/></g><g fill="var(--text)" font-size="18" text-anchor="middle"><text x="140" y="90">A</text><text x="305" y="90">B</text><text x="500" y="90">C</text><text x="222" y="190">11 cM</text><text x="402" y="190">19 cM</text></g></svg><p>Genetic distance is estimated from recombination. The physical DNA length corresponding to a cM is not constant.</p></article><article class="card span-12"><h2>Geological time framework</h2><div class="geo-time"><div><strong>Precambrian</strong><br><small>Origin of Earth, earliest life, oxygenation, early eukaryotes and multicellularity.</small></div><div><strong>Paleozoic</strong><br><small>Major marine radiations, colonisation of land, fishes, tetrapods and end-Permian extinction.</small></div><div><strong>Mesozoic</strong><br><small>Dinosaurs, early mammals and birds, flowering plants; ends with K–Pg extinction.</small></div><div><strong>Cenozoic</strong><br><small>Mammalian and avian radiations, grasslands, primate and hominin evolution.</small></div></div><p>Use formal stratigraphic charts for precise boundary ages; this atlas emphasises biological sequence and scale.</p></article><article class="card span-12"><h2>Human evolution: branching model</h2><p>Do not interpret the sequence below as a direct-ancestor ladder.</p><div class="table-wrap"><table><thead><tr><th>Group</th><th>Evolutionary significance</th><th>Interpretive caution</th></tr></thead><tbody><tr><td>Miocene apes</td><td>Context for hominoid diversification</td><td>Exact ancestry of later hominins often uncertain</td></tr><tr><td>Australopithecines</td><td>Diverse bipedal hominins with small brains</td><td>Several lineages coexisted</td></tr><tr><td>Early Homo</td><td>Mosaic changes in brain, body and technology</td><td>Species boundaries remain debated</td></tr><tr><td><em>H. erectus</em> sensu lato</td><td>Expanded body size and geographic range</td><td>Regional taxonomy varies</td></tr><tr><td>Neanderthals / Denisovan-related groups</td><td>Archaic Eurasian lineages with genomic admixture</td><td>Population history is reticulate</td></tr><tr><td><em>H. sapiens</em></td><td>African origin followed by dispersal and admixture</td><td>Modern populations are not separate evolutionary species</td></tr></tbody></table></div></article></div>`}
function labsView(){renderNav('labs');return `<div class="section-title"><div><h1>Interactive Genetics & Evolution Labs</h1><p>Analytical tools run locally in the browser. Results are educational models; assumptions are shown explicitly.</p></div></div><div class="tool-grid"><section class="card tool"><h2>1. Punnett Square</h2><label>Parent 1 genotype<input id="p1" value="Aa" maxlength="2"></label><label>Parent 2 genotype<input id="p2" value="Aa" maxlength="2"></label><button class="btn primary" id="punnettBtn">Generate cross</button><div class="result" role="status" id="punnettResult">Enter two diploid genotypes such as Aa × Aa.</div></section><section class="card tool"><h2>2. Epistasis ratio explorer</h2><label>Interaction model<select id="epiModel"><option value="9:3:4">Recessive epistasis — 9:3:4</option><option value="12:3:1">Dominant epistasis — 12:3:1</option><option value="9:7">Complementary genes — 9:7</option><option value="15:1">Duplicate dominant — 15:1</option><option value="13:3">Dominant suppression — 13:3</option><option value="9:6:1">Duplicate interaction — 9:6:1</option></select></label><label>Total F2 offspring<input id="epiN" type="number" min="16" value="160"></label><button class="btn primary" id="epiBtn">Calculate expected classes</button><div class="result" role="status" id="epiResult"></div></section><section class="card tool"><h2>3. Recombination calculator</h2><label>Recombinant offspring<input id="recombinants" type="number" min="0" value="90"></label><label>Total offspring<input id="offspring" type="number" min="1" value="500"></label><button class="btn primary" id="recombBtn">Calculate</button><div class="result" role="status" id="recombResult"></div></section><section class="card tool"><h2>4. Hardy–Weinberg calculator</h2><label>Recessive phenotype frequency q²<input id="q2" type="number" min="0" max="1" step="0.01" value="0.09"></label><button class="btn primary" id="hwBtn">Calculate p, q and genotype frequencies</button><div class="result" role="status" id="hwResult"></div></section><section class="card tool lab-wide"><h2>5. Three-point mapping laboratory</h2><p>Enter eight gamete classes as <code>haplotype count</code>, one per line. The algorithm identifies parental and DCO classes, infers the middle gene, includes DCOs in both interval distances, and calculates interference.</p><textarea id="threePointData" class="threepoint-input" aria-label="Three point mapping gamete classes">ABC 355
abc 355

aBC 50

llion years<input id="rate" type="number" step="0.0001" value="0.002"></label><button class="btn primary" id="clockBtn">Estimate divergence time</button><div class="result" role="status" id="clockResult">Uses t ≈ d/(2r) for a simple two-lineage model.</div></section><section class="card tool"><h2>10. Pairwise sequence comparator</h2><label>Sequence A<input id="seqA" value="ATGCTACGTA"></label><label>Sequence B<input id="seqB" value="ATGTTACATA"></label><button class="btn primary" id="seqBtn">Compare</button><div class="result" role="status" id="seqResult"></div></section><section class="card tool lab-wide"><h2>11. Multiple-sequence alignment explorer</h2><p>Enter taxon name followed by an already aligned sequence. Conserved columns are marked with <strong>*</strong>. This is an interpretation tool, not a full alignment algorithm.</p><textarea id="msaData" class="threepoint-input" aria-label="Aligned sequences">Taxon_A ATGCTACGTA

,1"></label><button class="btn primary" id="chiBtn">Calculate χ²</button><div class="result" role="status" id="chiResult"></div></section><section class="card tool lab-wide"><h2>16. Phylogenetic branch-rotation demonstrator</h2><p>Rotate sister tips around the same internal node. The drawing changes, the topology does not.</p><svg id="rotateTree" viewBox="0 0 760 300" role="img" aria-label="Rotatable phylogenetic tree" style="width:100%;max-height:320px;background:var(--surface2);border:1px solid var(--line);border-radius:12px"></svg><div style="margin-top:10px"><button class="btn primary" id="rotateTreeBtn">Rotate A/B around node</button></div><div class="result" id="rotateTreeResult">Topology: ((A,B),C),D</div></section></div>`}

function masteryView(tab='notes'){renderNav('mastery');const tabs=[['notes','Master notes'],['compare','Comparisons'],['worked','Worked problems'],['miscon','Misconceptions'],['formula','Formula centre']];return `<div class="section-title"><div><h1>Mastery Centre</h1><p>Synthesis, analytical problems and misconception repair across the complete syllabus.</p></div></div><div class="mastery-tabs" role="tablist">${tabs.map(([id,label])=>`<button class="btn" data-mastery="${id}" aria-selected="${tab===id}">${label}</button>`).join('')}</div><div id="masteryContent">${masteryContent(tab)}</div>`}
function masteryContent(tab){if(tab==='notes')return DATA.units.map(u=>{const m=DATA.masterNotes[u.id];return `<article class="card" style="margin-bottom:14px"><span class="pill">Unit ${u.num}</span><h2>${bio(u.title)}</h2><p>${esc(m.synthesis)}</p><h3>Concept anchors</h3><ul>${m.anchors.map(x=>`<li>${bio(x)}</li>`).join('')}</ul><h3>Equations / quantitative anchors</h3><div class="compact-list">${m.equations.map(x=>`<div class="formula">${esc(x)}</div>`).join('')}</div><h3>University-exam focus</h3><ul>${m.examFocus.map(x=>`<li>${bio(x)}</li>`).join('')}</ul></article>`}).join('');if(tab==='compare')return masteryData().comparisons.map(c=>`<article class="card" style="margin-bottom:14px"><span class="pill">${c.unit.toUpperCase()}</span><h2>${bio(c.title)}</h2><div class="table-wrap"><table><thead><tr>${c.headers.map(h=>`<th>${bio(h)}</th>`).join('')}</tr></thead><tbody>${c.rows.map(r=>`<tr>${r.map(x=>`<td>${bio(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></article>`).join('');if(tab==='worked')return masteryData().workedProblems.map((w,i)=>`<article class="card" style="margin-bottom:14px"><span class="pill">${w.unit.toUpperCase()} · Problem ${i+1}</span><h2>${bio(w.title)}</h2><p><strong>Problem:</strong> ${bio(w.problem)}</p><details><summary>Show worked reasoning</summary><ol class="worked-steps">${w.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p class="callout"><strong>Answer:</strong> ${bio(w.answer)}</p></details></article>`).join('');if(tab==='miscon')return `<div class="grid">${masteryData().misconceptions.map(m=>`<article class="card span-6"><span class="pill">${m.unit.toUpperCase()}</span><h3>✗ ${bio(m.claim)}</h3><p><strong>Correction:</strong> ${bio(m.correction)}</p><p><strong>Why:</strong> ${bio(m.why)}</p></article>`).join('')}</div>`;return `<div class="grid">${masteryData().formulas.map(f=>`<article class="card span-6"><span class="pill">${f.unit.toUpperCase()}</span><h2>${bio(f.title)}</h2><div class="formula">${esc(f.formula)}</div><p>${bio(f.variables)}</p><p><strong>Example:</strong> ${bio(f.example)}</p></article>`).join('')}</div>`}


function revisionView(mode='five'){renderNav('revision');const modes=[['five','5-minute'],['fifteen','15-minute'],['unit','Unit revision'],['preexam','Pre-exam']];return `<div class="section-title"><div><h1>Revision Centre</h1><p>Compressed retrieval paths for rapid review without replacing full lesson study.</p></div></div><div class="mastery-tabs" role="tablist">${modes.map(([id,label])=>`<button class="btn" data-revision="${id}" aria-selected="${mode===id}">${label}</button>`).join('')}</div><div id="revisionContent">${revisionContent(mode)}</div>`}
function revisionContent(mode){if(mode==='five'){const anchors=DATA.units.flatMap(u=>DATA.masterNotes[u.id].anchors.slice(0,2));return `<section class="card"><h2>5-minute high-yield retrieval</h2><p>Recall each item before expanding the explanation in the relevant unit.</p><ol>${anchors.map(x=>`<li>${bio(x)}</li>`).join('')}</ol><h3>Core equations</h3><div class="compact-list">${masteryData().formulas.slice(0,8).map(f=>`<div><strong>${bio(f.title)}</strong><div class="formula">${esc(f.formula)}</div></div>`).join('')}</div></section>`}if(mode==='fifteen'){return DATA.units.map(u=>{const m=DATA.masterNotes[u.id];return `<article class="card" style="margin-bottom:14px"><span class="pill">Unit ${u.num}</span><h2>${bio(u.title)}</h2><p>${esc(m.synthesis)}</p><details><summary>Rapid recall prompts</summary><ul>${m.anchors.map(x=>`<li>${bio(x)}</li>`).join('')}</ul></details></article>`}).join('')}if(mode==='unit'){return `<div class="grid">${DATA.units.map(u=>{const m=DATA.masterNotes[u.id];return `<article class="card span-6"><span class="pill">Unit ${u.num}</span><h2>${bio(u.title)}</h2><h3>Exam focus</h3><ul>${m.examFocus.map(x=>`<li>${bio(x)}</li>`).join('')}</ul><button class="btn" data-unit="${u.id}">Open unit lessons</button></article>`}).join('')}</div>`}return `<section class="card"><h2>Pre-exam consolidation</h2><p>Prioritise interpretation and calculation, not isolated memorisation.</p>${DATA.units.map(u=>{const m=DATA.masterNotes[u.id];return `<details><summary><strong>Unit ${u.num}: ${bio(u.title)}</strong></summary><ul>${m.examFocus.map(x=>`<li>${bio(x)}</li>`).join('')}</ul>${m.equations.length?`<div class="compact-list">${m.equations.map(x=>`<div class="formula">${esc(x)}</div>`).join('')}</div>`:''}</details>`}).join('')}<div class="callout" style="margin-top:16px"><strong>Final check:</strong> use the Exam Simulator only after you can explain the assumptions behind Hardy–Weinberg, linkage mapping, molecular-clock estimates and tree interpretation.</div></section>`}

let practicePage=0,practiceActiveTab='mcq';const PRACTICE_PAGE_SIZE=25;
function assessmentPager(total,page){const pages=Math.max(1,Math.ceil(total/PRACTICE_PAGE_SIZE));if(pages<=1)return '';return `<nav class="pager" aria-label="Assessment pages"><button class="btn" data-practice-page="${Math.max(0,page-1)}" ${page<=0?'disabled':''}>← Previous</button><span class="pill">Page ${page+1} of ${pages}</span><button class="btn" data-practice-page="${Math.min(pages-1,page+1)}" ${page>=pages-1?'disabled':''}>Next →</button></nav>`}
function practiceView(tab='mcq'){renderNav('practice');practiceActiveTab=tab;practicePage=0;return `<div class="section-title"><div><h1>Practice & Assessment</h1><p>${COUNTS.mcqs} MCQs · ${COUNTS.ar} Assertion–Reason · ${COUNTS.cases} case-based questions · ${COUNTS.shortAnswers} short-answer prompts.</p></div></div><div class="tabs" role="tablist"><button class="btn" data-practice="mcq" aria-selected="${tab==='mcq'}">MCQ</button><button class="btn" data-practice="ar" aria-selected="${tab==='ar'}">Assertion–Reason</button><button class="btn" data-practice="case" aria-selected="${tab==='case'}">Case-based</button><button class="btn" data-practice="short" aria-selected="${tab==='short'}">Short answer</button><button class="btn" data-practice="essay" aria-selected="${tab==='essay'}">Essay bank</button><button class="btn" data-practice="exam" aria-selected="${tab==='exam'}">Exam simulator</button></div><div id="practiceContent">${practiceContent(tab,0)}</div>`}
function practiceContent(tab,page=practicePage){const A=assessmentData();if(tab==='mcq'){const start=page*PRACTICE_PAGE_SIZE,items=A.mcqs.slice(start,start+PRACTICE_PAGE_SIZE);return items.map((q,i)=>`<article class="card quiz-card" data-qid="${q.id}"><span class="pill">${q.unit.toUpperCase()} · ${q.difficulty}${q.cognitive?' · '+esc(q.cognitive):''}</span><h3>${start+i+1}. ${bio(q.q)}</h3><div class="options">${q.options.map((o,j)=>`<button class="option" data-mcq="${q.id}" data-opt="${j}">${String.fromCharCode(65+j)}. ${bio(o)}</button>`).join('')}</div><div class="explain" hidden></div></article>`).join('')+assessmentPager(A.mcqs.length,page)}if(tab==='ar')return `<section class="card notice"><strong>Assertion–Reason key:</strong> A = both true and Reason correctly explains Assertion; B = both true but Reason does not explain Assertion; C = Assertion true, Reason false; D = Assertion false, Reason true.</section>`+A.ar.map((q,i)=>`<article class="card quiz-card"><h3>${i+1}. Assertion–Reason</h3><p><strong>Assertion:</strong> ${bio(q.assertion)}</p><p><strong>Reason:</strong> ${bio(q.reason)}</p><details><summary>Reveal answer</summary><p><strong>${q.answer}</strong> — ${bio(q.explanation)}</p></details></article>`).join('');if(tab==='case')return A.cases.map((q,i)=>`<article class="card quiz-card"><h3>${i+1}. Case analysis</h3><p>${bio(q.case)}</p><details><summary>Reveal model analysis</summary><p>${bio(q.answer)}</p></details></article>`).join('');if(tab==='short'){const start=page*PRACTICE_PAGE_SIZE,items=A.shortAnswers.slice(start,start+PRACTICE_PAGE_SIZE);return items.map((q,i)=>`<article class="card quiz-card"><span class="pill">${q.unit.toUpperCase()}</span><h3>${start+i+1}. ${bio(q.q)}</h3><details><summary>Model answer</summary><p>${bio(q.answer)}</p></details></article>`).join('')+assessmentPager(A.shortAnswers.length,page)}if(tab==='exam')return `<section class="card"><h2>Configurable MCQ examination</h2><div class="grid"><label class="span-4">Unit<select id="examUnit" style="width:100%;padding:10px"><option value="all">All units</option>${DATA.units.map(u=>`<option value="${u.id}">Unit ${u.num}</option>`).join('')}</select></label><label class="span-4">Questions<select id="examCount" style="width:100%;padding:10px"><option>10</option><option>20</option><option>25</option></select></label><label class="span-4">Difficulty<select id="examDifficulty" style="width:100%;padding:10px"><option value="all">Mixed</option><option>Foundation</option><option>Intermediate</option><option>Advanced</option></select></label></div><button class="btn primary" id="startExam">Start exam</button><div id="examArea" aria-live="polite"></div></section>`;return `<div class="grid">${A.essays.map((q,i)=>`<article class="card span-6"><span class="pill">${q.unit.toUpperCase()}</span><h3>${i+1}. ${bio(q.q)}</h3><details class="section-accordion"><summary>Model answer framework</summary><div class="section-accordion-content academic-prose"><p>${bio(q.modelAnswer||'')}</p><h4>Indicative marking points</h4><ul>${(q.markingPoints||[]).map(x=>`<li>${bio(x)}</li>`).join('')}</ul><p class="subtle">A high-quality essay should integrate these points into a coherent argument with appropriate examples, diagrams or calculations where relevant.</p></div></details></article>`).join('')}</div>`}
function renderPracticeTab(tab,page=0){practiceActiveTab=tab;practicePage=page;const c=$('#practiceContent');if(!c)return;c.innerHTML=practiceContent(tab,page);$$('[data-practice]').forEach(x=>x.setAttribute('aria-selected',String(x.dataset.practice===tab)));bindViewDynamic();bindPracticePager()}
function bindPracticePager(){const c=$('#practiceContent');if(!c)return;$$('[data-practice-page]',c).forEach(b=>b.onclick=()=>{practicePage=Number(b.dataset.practicePage)||0;renderPracticeTab(practiceActiveTab,practicePage);c.scrollIntoView({block:'start'})})}
function localDateISO(addDays=0){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+addDays);const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function dueFlashCount(){const today=localDateISO();return flashcardsData().filter(f=>!state.flashSrs[f.id]||state.flashSrs[f.id].due<=today).length}

function referencesView(){renderNav('references');return `<div class="section-title"><div><h1>${t('references')}</h1><p>Core sources selected for postgraduate genetics, evolution, molecular phylogenetics and geological context.</p></div></div><div class="grid"><article class="card span-6"><h2>Core textbooks</h2><ul><li>Griffiths, A. J. F., Doebley, J., Peichel, C. L. &amp; Wassarman, D. A. (2020). <em>An Introduction to Genetic Analysis</em>, 12th ed. W. H. Freeman / Macmillan Learning.</li><li>Pierce, B. A. (2024). <em>Genetics: A Conceptual Approach</em>, 7th ed., Digital Update. Macmillan Learning.</li><li>Futuyma, D. J. &amp; Kirkpatrick, M. (2023). <em>Evolution</em>, 5th ed. Oxford University Press.</li><li>Herron, J. C. &amp; Freeman, S. (2022). <em>Evolutionary Analysis</em>, 5th ed. Pearson.</li></ul></article><article class="card span-6"><h2>Authoritative scientific resources</h2><ul><li><strong>NCBI</strong> — sequence, genome, variation and literature-linked molecular resources.</li><li><strong>Ensembl</strong> — comparative genomics, genome annotation and orthology resources.</li><li><strong>International Commission on Stratigraphy (ICS)</strong> — formal geological time-scale terminology and boundary ages.</li><li><strong>NHGRI / Human Genome resources</strong> — historical and contemporary context for human genomics.</li><li><strong>Peer-reviewed primary literature</strong> — required for rapidly developing subjects such as ancient DNA, molecular clocks, human admixture and genome-scale phylogenetics.</li></ul></article><article class="card span-12"><h2>Topic-to-source guide</h2><div class="table-wrap"><table><thead><tr><th>Course area</th><th>Recommended starting source</th><th>Why</th></tr></thead><tbody><tr><td>Mendelian, linkage and quantitative genetics</td><td>Griffiths et al.; Pierce</td><td>Problem-centred genetic analysis, chromosome behaviour and modern molecular interpretation.</td></tr><tr><td>Human genetics and cytogenetics</td><td>Griffiths et al.; Pierce + authoritative clinical/genomic resources</td><td>Connects classical chromosome analysis with genomic methods and ethical interpretation.</td></tr><tr><td>Population genetics and evolutionary mechanisms</td><td>Futuyma &amp; Kirkpatrick; Herron &amp; Freeman</td><td>Integrates selection, drift, gene flow, mutation and evolutionary evidence.</td></tr><tr><td>Molecular evolution and phylogenetics</td><td>Futuyma &amp; Kirkpatrick + NCBI/Ensembl + primary literature</td><td>Supports sequence-based inference, model assumptions and contemporary genomic methods.</td></tr><tr><td>Geological time and human evolution</td><td>ICS + current peer-reviewed palaeoanthropology/ancient-DNA literature</td><td>Boundary ages and human evolutionary interpretations can change as new evidence appears.</td></tr></tbody></table></div></article></div>`}

function bindMcq(){$$('[data-mcq]').forEach(b=>b.onclick=()=>{const q=assessmentData().mcqs.find(x=>x.id===b.dataset.mcq);const card=b.closest('[data-qid]');if(!q||!card)return;const opt=Number(b.dataset.opt);$$('.option',card).forEach((x,j)=>{x.disabled=true;if(j===q.answer)x.classList.add('correct');else if(j===opt)x.classList.add('wrong')});const ex=$('.explain',card);ex.hidden=false;ex.textContent=(opt===q.answer?'Correct. ':'Review. ')+q.explanation;const st=state.mcqStats[q.id]||{attempted:0,correct:0};st.attempted++;if(opt===q.answer)st.correct++;state.mcqStats[q.id]=st;persist()})}
function punnett(){const a=$('#p1').value.trim(),b=$('#p2').value.trim();if(a.length!==2||b.length!==2){$('#punnettResult').textContent='Use two-character diploid genotypes, e.g., Aa and Aa.';return}const g1=[a[0],a[1]],g2=[b[0],b[1]],kids=[];for(const x of g1)for(const y of g2)kids.push(([x,y].sort((m,n)=>m.toLowerCase()===n.toLowerCase()? (m<n?-1:1):m.localeCompare(n))).join(''));const counts={};kids.forEach(k=>counts[k]=(counts[k]||0)+1);$('#punnettResult').innerHTML=`Gametes: ${esc(g1.join(', '))} × ${esc(g2.join(', '))}<br><strong>Offspring:</strong> ${Object.entries(counts).map(([k,v])=>`${esc(k)} ${v}/4`).join(' · ')}`}

function epistasis(){const ratio=$('#epiModel').value.split(':').map(Number),n=Number($('#epiN').value);if(!(n>0)){return $('#epiResult').textContent='Enter a positive F2 total.'}const sum=ratio.reduce((a,b)=>a+b,0);$('#epiResult').innerHTML=`Ratio <strong>${ratio.join(':')}</strong> · expected classes: `+ratio.map((x,i)=>`Class ${i+1}: <strong>${(n*x/sum).toFixed(1)}</strong>`).join(' · ')+`<br><small>Expected counts need not be integers; observed data should be evaluated statistically rather than forced to an exact ratio.</small>`}
function parseThreePoint(){const lines=$('#threePointData').value.trim().split(/\n+/),arr=[];for(const line of lines){const m=line.trim().match(/^([A-Za-z]{3})\s+([0-9]+(?:\.\d+)?)$/);if(!m)return {error:`Could not parse: ${line}`};arr.push({hap:m[1],n:Number(m[2])})}if(arr.length!==8)return {error:'Enter exactly eight three-locus gamete classes.'};const uniq=new Set(arr.map(x=>x.hap));if(uniq.size!==8)return {error:'Each haplotype class must be unique.'};return {arr}}
function hamming(a,b){let d=0;for(let i=0;i<Math.min(a.length,b.length);i++)if(a[i]!==b[i])d++;return d}
function threePoint(){const p=parseThreePoint();if(p.error){$('#threePointResult').textContent=p.error;return}const arr=p.arr.slice().sort((a,b)=>b.n-a.n),parents=arr.slice(0,2),dcos=arr.slice(-2),P=parents[0].hap;let closest=dcos[0].hap;if(hamming(P,dcos[1].hap)<hamming(P,closest))closest=dcos[1].hap;const diff=[];for(let i=0;i<3;i++)if(P[i]!==closest[i])diff.push(i);if(diff.length!==1){$('#threePointResult').textContent='The two least-frequent classes do not yield a single middle-gene change relative to a parental class. Check labels/counts or consider whether the standard mapping assumptions are violated.';return}const mid=diff[0],others=[0,1,2].filter(i=>i!==mid),order=[others[0],mid,others[1]],genes=order.map(i=>P[i].toUpperCase());const Q=parents[1].hap,total=arr.reduce((a,x)=>a+x.n,0);function pairIsParental(h,i,j){const pair=h[i]+h[j],p1=P[i]+P[j],p2=Q[i]+Q[j];return pair===p1||pair===p2}let r1=0,r2=0;for(const x of arr){if(!pairIsParental(x.hap,order[0],order[1]))r1+=x.n;if(!pairIsParental(x.hap,order[1],order[2]))r2+=x.n}const f1=r1/total,f2=r2/total,obs=dcos.reduce((a,x)=>a+x.n,0),exp=f1*f2*total,coc=exp?obs/exp:NaN,intf=Number.isFinite(coc)?1-coc:NaN;$('#threePointResult').innerHTML=`<strong>Parental classes:</strong> ${parents.map(x=>esc(x.hap)+' ('+x.n+')').join(', ')}<br><strong>DCO classes:</strong> ${dcos.map(x=>esc(x.hap)+' ('+x.n+')').join(', ')}<br><strong>Inferred order:</strong> ${genes.join(' — ')}<br><strong>${genes[0]}–${genes[1]}:</strong> ${(f1*100).toFixed(2)} cM · <strong>${genes[1]}–${genes[2]}:</strong> ${(f2*100).toFixed(2)} cM<br><strong>Observed DCO:</strong> ${obs} · expected under independence: ${exp.toFixed(2)} · CoC: ${Number.isFinite(coc)?coc.toFixed(3):'—'} · interference: ${Number.isFinite(intf)?intf.toFixed(3):'—'}<br><small>Assumes reciprocal classes, correct scoring, and that the least frequent classes are DCOs. Very long intervals require additional mapping logic.</small>`}
let pedIndex=0;function newPedigreeCase(){pedIndex=Math.floor(Math.random()*pedigreeData().length);const c=pedigreeData()[pedIndex];if($('#pedCase'))$('#pedCase').textContent=c.case;if($('#pedGuess'))$('#pedGuess').value='';if($('#pedResult'))$('#pedResult').textContent=''}
function checkPedigree(){const c=pedigreeData()[pedIndex],g=$('#pedGuess').value;if(!g)return $('#pedResult').textContent='Choose an inheritance pattern first.';$('#pedResult').innerHTML=(g===c.pattern?'<strong>Correct.</strong> ':'<strong>Review.</strong> ')+`${esc(c.clue)} Best fit: <strong>${esc(c.pattern)}</strong>.`}
function migrationCalc(){const p=Number($('#migP').value),pm=Number($('#migPm').value),m=Number($('#migM').value);if([p,pm,m].some(x=>!Number.isFinite(x)||x<0||x>1))return $('#migResult').textContent='All frequencies and m must be between 0 and 1.';const next=(1-m)*p+m*pm;$('#migResult').innerHTML=`p′ = (1−${m})(${p}) + ${m}(${pm}) = <strong>${next.toFixed(4)}</strong><br><small>This one-step island-model calculation ignores selection, drift and mutation during the same interval.</small>`}
function msaInspect(){const lines=$('#msaData').value.trim().split(/\n+/),rows=[];for(const line of lines){const m=line.trim().match(/^(\S+)\s+([A-Za-z\-]+)$/);if(!m)return $('#msaResult').textContent='Use one taxon name and one aligned sequence per line.';rows.push({name:m[1],seq:m[2].toUpperCase()})}if(rows.length<2)return $('#msaResult').textContent='Enter at least two sequences.';const L=rows[0].seq.length;if(rows.some(r=>r.seq.length!==L))return $('#msaResult').textContent='Sequences must already be aligned to equal length.';let cons='';for(let i=0;i<L;i++){const c=rows[0].seq[i];cons+=rows.every(r=>r.seq[i]===c)?'*':' '}$('#msaResult').innerHTML=`<div class="table-wrap"><table><thead><tr><th>Taxon</th><th>Aligned sequence</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td><code>${esc(r.seq)}</code></td></tr>`).join('')}<tr><td>Conserved</td><td><code>${esc(cons)}</code></td></tr></tbody></table></div><small>* marks invariant columns in this supplied alignment. Alignment quality and positional homology must be assessed before phylogenetic inference.</small>`}


function bottleneck(){const p=Number($('#bottleP').value),N=Math.floor(Number($('#bottleN').value));if(!Number.isFinite(p)||p<0||p>1||N<2)return $('#bottleResult').textContent='Enter p between 0 and 1 and at least two diploid founders/survivors.';let copies=0;for(let i=0;i<2*N;i++)if(Math.random()<p)copies++;const p2=copies/(2*N),h1=2*p*(1-p),h2=2*p2*(1-p2);$('#bottleResult').innerHTML=`Sampled A copies: <strong>${copies}/${2*N}</strong><br>p before = ${p.toFixed(3)} · p after sampling = <strong>${p2.toFixed(3)}</strong><br>Expected heterozygosity 2pq: before ${h1.toFixed(3)} · after ${h2.toFixed(3)}<br><small>Repeat the sampling to see stochastic variation. A single draw is not the expected deterministic outcome.</small>`}
function karyotypeInterpret(){const k=$('#karyoSelect').value;const map={'46,XX':['46 chromosomes','1 Barr body','Typical female karyotype; two X chromosomes with one usually inactive in somatic cells.'],'46,XY':['46 chromosomes','0 Barr bodies','Typical male karyotype.'],'47,XX,+21':['47 chromosomes','1 Barr body','Trisomy 21; a numerical chromosomal abnormality (aneuploidy) associated with Down syndrome.'],'45,X':['45 chromosomes','0 Barr bodies','Monosomy X; associated with Turner syndrome.'],'47,XXY':['47 chromosomes','1 Barr body','Sex-chromosome aneuploidy associated with Klinefelter syndrome.'],'47,XX,+18':['47 chromosomes','1 Barr body','Trisomy 18; associated with Edwards syndrome.'],'47,XXX':['47 chromosomes','2 Barr bodies','Triple-X karyotype; Barr body number is typically X chromosomes minus one.']};const v=map[k];$('#karyoResult').innerHTML=`<strong>${esc(k)}</strong><br>${v[0]} · ${v[1]}<br>${v[2]}`}
function chiSquare(){const obs=$('#chiObs').value.split(',').map(x=>Number(x.trim())),rat=$('#chiRatio').value.split(',').map(x=>Number(x.trim()));if(obs.length<2||obs.length!==rat.length||obs.some(x=>!Number.isFinite(x)||x<0)||rat.some(x=>!Number.isFinite(x)||x<=0))return $('#chiResult').textContent='Observed counts must be non-negative; expected-ratio terms must be positive; both lists must have equal length.';const total=obs.reduce((a,b)=>a+b,0),rs=rat.reduce((a,b)=>a+b,0),exp=rat.map(r=>total*r/rs);let chi=0;obs.forEach((o,i)=>chi+=(o-exp[i])**2/exp[i]);const df=obs.length-1;$('#chiResult').innerHTML=`Total N = ${total}<br>Expected counts: ${exp.map(x=>x.toFixed(2)).join(', ')}<br>χ² = <strong>${chi.toFixed(3)}</strong> · df = <strong>${df}</strong><br><small>Use the appropriate χ² distribution/critical value or exact statistical software for formal inference. A small χ² means observed counts are close to the specified ratio; it does not prove the genetic model.</small>`}
let treeRotated=false;function drawRotateTree(rot){const svg=$('#rotateTree');if(!svg)return;const ay=rot?120:45,by=rot?45:120;svg.innerHTML=`<g stroke="var(--text)" stroke-width="4" fill="none"><path d="M70 150 H180 V85 H320"/><path d="M180 150 V230 H320"/><path d="M320 85 H430 V${ay} H650"/><path d="M430 85 V${by} H650"/><path d="M320 230 H650"/></g><g fill="var(--text)" font-size="20"><text x="660" y="${ay+6}">A</text><text x="660" y="${by+6}">B</text><text x="660" y="236">C</text><text x="20" y="156">Root</text></g><g fill="var(--primary2)"><circle cx="180" cy="150" r="7"/><circle cx="320" cy="85" r="7"/><circle cx="430" cy="85" r="7"/></g>`}
function rotateTree(){treeRotated=!treeRotated;drawRotateTree(treeRotated);$('#rotateTreeResult').innerHTML=`Topology remains <strong>((A,B),C)</strong>: A and B remain sister taxa, and C is sister to the A + B clade. Only drawing orientation changed.`}

function recomb(){const r=Number($('#recombinants').value),n=Number($('#offspring').value);if(!(n>0)||r<0||r>n){$('#recombResult').textContent='Enter valid counts.';return}const rf=r/n*100;$('#recombResult').innerHTML=`Recombination frequency = ${r}/${n} × 100 = <strong>${rf.toFixed(2)}%</strong><br>Approximate map distance for a short interval ≈ <strong>${rf.toFixed(2)} cM</strong>.`}
function hardy(){const q2=Number($('#q2').value);if(q2<0||q2>1||!Number.isFinite(q2)){$('#hwResult').textContent='q² must be between 0 and 1.';return}const q=Math.sqrt(q2),p=1-q;$('#hwResult').innerHTML=`q = √${q2} = <strong>${q.toFixed(4)}</strong><br>p = 1 − q = <strong>${p.toFixed(4)}</strong><br>p² = ${(p*p).toFixed(4)} · 2pq = ${(2*p*q).toFixed(4)} · q² = ${q2.toFixed(4)}`}
function clock(){const d=Number($('#divergence').value),r=Number($('#rate').value);if(!(d>=0)||!(r>0)){$('#clockResult').textContent='Enter non-negative divergence and a positive rate.';return}const t=d/(2*r);$('#clockResult').innerHTML=`t ≈ d/(2r) = ${d}/(2 × ${r}) = <strong>${t.toFixed(2)} million years</strong><br><small>Simple educational estimate; real molecular dating requires model choice, calibration and rate uncertainty.</small>`}
function drift(){const N=Math.max(2,Math.floor(Number($('#driftN').value))),G=Math.max(1,Math.floor(Number($('#driftG').value)));let p=Math.min(1,Math.max(0,Number($('#driftP').value)));const startP=p,pts=[p];for(let g=0;g<G;g++){let copies=0;for(let i=0;i<2*N;i++)if(Math.random()<p)copies++;p=copies/(2*N);pts.push(p);if(p===0||p===1){for(let j=g+1;j<G;j++)pts.push(p);break}}drawLine($('#driftCanvas'),pts,'Allele frequency p');const out=$('#driftText');if(out){const final=pts[pts.length-1],min=Math.min(...pts),max=Math.max(...pts),stateTxt=final===0?'allele lost (p = 0)':final===1?'allele fixed (p = 1)':'allele remains polymorphic';const step=Math.max(1,Math.ceil(pts.length/20));const sampled=pts.map((v,i)=>({g:i,v})).filter((x,i)=>i===0||i===pts.length-1||x.g%step===0);out.innerHTML=`<strong>Numerical summary:</strong> N = ${N}; start p = ${startP.toFixed(3)}; final p = ${final.toFixed(3)}; minimum = ${min.toFixed(3)}; maximum = ${max.toFixed(3)}; outcome: ${stateTxt}.<details><summary>Generation values (sampled)</summary><div class="table-wrap"><table><thead><tr><th>Generation</th><th>Allele frequency p</th></tr></thead><tbody>${sampled.map(x=>`<tr><td>${x.g}</td><td>${x.v.toFixed(3)}</td></tr>`).join('')}</tbody></table></div></details>`}}
function seqCompare(){const a=$('#seqA').value.toUpperCase().replace(/\s/g,''),b=$('#seqB').value.toUpperCase().replace(/\s/g,'');const n=Math.min(a.length,b.length);let diff=0,mark='';for(let i=0;i<n;i++){if(a[i]!==b[i]){diff++;mark+='^'}else mark+='|'}const extra=Math.abs(a.length-b.length);diff+=extra;const denom=Math.max(a.length,b.length)||1;$('#seqResult').innerHTML=`<code>${esc(a)}<br>${esc(mark)}<br>${esc(b)}</code><br>Differences: <strong>${diff}</strong> of ${denom} positions · Uncorrected difference ≈ <strong>${(diff/denom*100).toFixed(2)}%</strong>`}
function drawLine(canvas,pts,label){if(!canvas)return;const c=canvas.getContext('2d'),w=canvas.width,h=canvas.height;c.clearRect(0,0,w,h);const cs=getComputedStyle(document.documentElement),line=cs.getPropertyValue('--line').trim()||'#ccc',text=cs.getPropertyValue('--text').trim()||'#111',primary=cs.getPropertyValue('--primary2').trim()||'#2563eb';c.strokeStyle=line;c.lineWidth=1;for(let y=0;y<=1;y+=.25){const yy=h-30-y*(h-50);c.beginPath();c.moveTo(42,yy);c.lineTo(w-15,yy);c.stroke();c.fillStyle=text;c.font='14px sans-serif';c.fillText(y.toFixed(2),5,yy+4)}c.strokeStyle=primary;c.lineWidth=3;c.beginPath();pts.forEach((p,i)=>{const x=42+i/(pts.length-1)*(w-60),y=h-30-p*(h-50);i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();c.fillStyle=text;c.fillText(label,50,18)}
function drawSelection(mode){const cv=$('#selectionCanvasLab')||$('#selectionCanvas');if(!cv)return;const c=cv.getContext('2d'),w=cv.width,h=cv.height;c.clearRect(0,0,w,h);const cs=getComputedStyle(document.documentElement),text=cs.getPropertyValue('--text').trim(),line=cs.getPropertyValue('--line').trim(),p=cs.getPropertyValue('--primary2').trim(),a=cs.getPropertyValue('--accent').trim();c.strokeStyle=line;c.beginPath();c.moveTo(50,h-35);c.lineTo(w-20,h-35);c.stroke();function curve(mu,sigma,color,amp=1){c.beginPath();for(let x=0;x<500;x++){const z=(x/500*6-3),y=Math.exp(-Math.pow(z-mu,2)/(2*sigma*sigma))*amp;const X=70+x/500*(w-110),Y=h-35-y*(h-80);x?c.lineTo(X,Y):c.moveTo(X,Y)}c.strokeStyle=color;c.lineWidth=3;c.stroke()}curve(0,1.1,p,.75);if(mode==='stabilising')curve(0,.62,a,1);else if(mode==='directional')curve(1,.9,a,.95);else{curve(-1.1,.55,a,.72);curve(1.1,.55,a,.72)}c.fillStyle=text;c.font='16px sans-serif';c.fillText(mode[0].toUpperCase()+mode.slice(1)+' selection',50,22);const out=$('#selectionTextLab')||$('#selectionText');if(out){const desc=mode==='stabilising'?'Stabilising selection: intermediate phenotypes have the highest relative fitness; the post-selection distribution narrows around a similar mean, so variance is reduced.':mode==='directional'?'Directional selection: fitness is higher toward one phenotypic extreme; the post-selection distribution shifts its mean toward that extreme.':'Disruptive selection: both phenotypic extremes have higher relative fitness than intermediates; the distribution becomes broader or bimodal and intermediate phenotypes decline.';out.textContent=desc}}
function flipFlash(){state.flashBack=!state.flashBack;route()}

function rateFlash(rating){const f=flashcardsData()[state.flashIndex],days={again:1,hard:3,good:7,easy:14}[rating]||1;state.flashSrs[f.id]={rating,due:localDateISO(days),reviewed:localDateISO()};persist();toast(`Scheduled in ${days} day${days===1?'':'s'}`);state.flashIndex=(state.flashIndex+1)%flashcardsData().length;state.flashBack=false;route()}
function startExam(){let pool=assessmentData().mcqs.slice(),u=$('#examUnit').value,d=$('#examDifficulty').value,n=Number($('#examCount').value);if(u!=='all')pool=pool.filter(q=>q.unit===u);if(d!=='all')pool=pool.filter(q=>q.difficulty===d);pool=pool.sort(()=>Math.random()-.5).slice(0,Math.min(n,pool.length));state.examQuestions=pool;const area=$('#examArea');if(!pool.length){area.innerHTML='<p>No questions match these filters.</p>';return}area.innerHTML=`<form id="examForm"><p><strong>${pool.length} questions.</strong> Feedback is withheld until submission.</p>${pool.map((q,i)=>`<fieldset class="exam-question"><legend><strong>${i+1}. ${esc(q.q)}</strong></legend>${q.options.map((o,j)=>`<label><input type="radio" name="exam_${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${esc(o)}</label>`).join('')}</fieldset>`).join('')}<button type="submit" class="btn primary">Submit exam</button></form>`;$('#examForm').onsubmit=e=>{e.preventDefault();scoreExam()}}
function scoreExam(){let correct=0,answered=0;state.examQuestions.forEach((q,i)=>{const el=$(`input[name="exam_${i}"]:checked`);if(el){answered++;if(Number(el.value)===q.answer)correct++}});const pct=state.examQuestions.length?Math.round(correct/state.examQuestions.length*100):0;const form=$('#examForm');form.insertAdjacentHTML('afterend',`<section class="card" style="margin-top:14px"><h3 class="${pct>=70?'score-good':'score-warn'}">Score: ${correct}/${state.examQuestions.length} (${pct}%)</h3><p>${answered<state.examQuestions.length?`${state.examQuestions.length-answered} question(s) unanswered. `:''}${pct>=80?'Strong performance. Review explanations for any missed concepts.':pct>=60?'Competent but not secure. Revisit the missed conceptual areas before another mixed test.':'Return to Master Notes and Worked Problems before repeating the assessment.'}</p><details><summary>Review answer key</summary><ol>${state.examQuestions.map(q=>`<li><strong>${String.fromCharCode(65+q.answer)}.</strong> ${esc(q.options[q.answer])} — ${esc(q.explanation)}</li>`).join('')}</ol></details></section>`);$$('input,button',form).forEach(x=>x.disabled=true)}

function doSearch(q){const box=$('#searchResults');q=q.trim().toLowerCase();if(q.length<2){box.style.display='none';box.innerHTML='';return}const hits=[];for(const l of DATA.lessons)if((l.title+' '+(l.taTitle||'')+' '+(l.taSummary||'')+' '+(l.fact||'')).toLowerCase().includes(q))hits.push({type:'Lesson',label:lessonLabel(l),hash:'lesson/'+l.id});if(hits.length<18){for(const g of glossaryData())if((g.term+' '+g.definition+' '+(g.ta||'')).toLowerCase().includes(q))hits.push({type:'Glossary',label:g.term,hash:'glossary'});const md=masteryData();for(const w of md.workedProblems)if((w.title+' '+w.problem+' '+w.answer).toLowerCase().includes(q))hits.push({type:'Worked problem',label:w.title,hash:'mastery'});for(const c of md.comparisons)if((c.title+' '+c.rows.flat().join(' ')).toLowerCase().includes(q))hits.push({type:'Comparison',label:c.title,hash:'mastery'});for(const x of md.misconceptions)if((x.claim+' '+x.correction).toLowerCase().includes(q))hits.push({type:'Misconception',label:x.claim,hash:'mastery'})}box.innerHTML=hits.slice(0,24).map(h=>`<button data-search-hash="${h.hash}"><strong>${esc(h.type)}</strong> · ${esc(h.label)}</button>`).join('')||'<div style="padding:12px">No results</div>';box.style.display='block';$$('[data-search-hash]',box).forEach(b=>b.onclick=()=>{setRoute(b.dataset.searchHash);box.style.display='none'})}
let searchTimer=null;$('#globalSearch').addEventListener('input',e=>{clearTimeout(searchTimer);const q=e.target.value;searchTimer=setTimeout(()=>doSearch(q),180)});document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#searchResults').style.display='none'});
$('#skipBtn').addEventListener('click',()=>{$('#main').focus();$('#main').scrollIntoView({block:'start'})});$('#teachingBtn').addEventListener('click',()=>{state.teaching=!state.teaching;persist();applyPrefs()});$('#langSelect').addEventListener('change',e=>{state.lang=e.target.value;persist();applyPrefs();route()});$('#themeSelect').addEventListener('change',e=>{state.theme=e.target.value;persist();applyPrefs();route()});$('#menuBtn').onclick=()=>{const open=$('#sidebar').classList.toggle('open');$('#menuBtn').setAttribute('aria-expanded',String(open))};$('#homeBtn').onclick=()=>setRoute('home');window.addEventListener('error',e=>console.error('Course runtime error',e.error||e.message));
window.addEventListener('popstate',e=>{
  const saved=e.state&&e.state.courseHistory?normaliseRoute(e.state.courseRoute):null;
  if(saved){
    setRoute(saved,{fromPop:true});
    return;
  }
  // If the browser reaches the document's original entry while the course is not on Home,
  // keep the document open and return to Home instead of allowing an accidental exit.
  if(currentRoute!=='home'){
    currentRoute='home';
    route('home');
    if(courseHistorySupported) pushCourseHistory('home');
  }
});
applyPrefs();renderNav();
(function safeColdStart(){
  currentRoute='home';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    route('home');
    // Add a same-URL Home sentinel. This gives Android/Chrome a course-history entry
    // without altering file:// or content:// addresses and without using hashes.
    courseHistoryReady=pushCourseHistory('home');
  }));
})();
</script>
