using stratigraphy, radiometric dating and major geological or biological transitions."},{"id":"fc-unit5-10-major-evolutionary-transitions","unit":"unit5","front":"Major evolutionary transitions","back":"Major evolutionary transitions are episodes in which biological organisation, inheritance or individuality changes substantially—for example the origin of eukaryotic cells, multicellularity and complex social integration. They are reconstructed by combining comparative, fossil, developmental and molecular evidence rather than by assuming a predetermined progression toward complexity."},{"id":"fc-unit5-11-primate-evolution","unit":"unit5","front":"Primate evolution","back":"Primate evolution includes diversification of strepsirrhines, haplorhines, monkeys and apes, with changes in vision, grasping, brain organisation, locomotion and social behaviour."},{"id":"fc-unit5-12-hominin-evolution","unit":"unit5","front":"Hominin evolution","back":"Hominin evolution is a branching history of lineages more closely related to humans than to chimpanzees after their last common ancestor. Bipedal adaptations appeared well before modern human brain size."},{"id":"fc-unit5-13-primate-versus-hominin-characteristics","unit":"unit5","front":"Primate versus hominin characteristics","back":"Hominins share primate traits but are distinguished in the fossil record especially by habitual bipedal adaptations, dental changes and later trends in brain expansion, technology and life history."},{"id":"fc-unit5-14-dryopithecus-and-fossil-apes","unit":"unit5","front":"Dryopithecus and fossil apes","back":"Dryopithecus is a Miocene fossil ape genus important for understanding hominoid diversity. It should not be presented as a proven direct ancestor of Homo sapiens."},{"id":"fc-unit5-15-australopithecines","unit":"unit5","front":"Australopithecines","back":"Australopithecines were diverse African hominins combining habitual bipedalism with relatively small brains and varied locomotor adaptations."},{"id":"fc-unit5-16-early-homo","unit":"unit5","front":"Early Homo","back":"Early Homo includes early members of the genus Homo associated with changes in body proportions, brain size and technology, although species boundaries and fossil assignments remain debated."},{"id":"fc-unit5-17-homo-erectus","unit":"unit5","front":"Homo erectus","back":"Homo erectus sensu lato had a more human-like body plan, expanded geographic range and substantial encephalisation relative to earlier hominins."},{"id":"fc-unit5-18-archaic-homo","unit":"unit5","front":"Archaic Homo","back":"The informal term archaic Homo is used for diverse Middle Pleistocene human populations showing mosaics of ancestral and derived features. Their relationships to Neanderthals, Denisovan-related groups and Homo sapiens are complex, and taxonomic labels remain debated; they should not be treated as one uniform stage in a linear human sequence."},{"id":"fc-unit5-19-neanderthals","unit":"unit5","front":"Neanderthals","back":"Neanderthals were a Eurasian human lineage adapted to Pleistocene environments. Genomic evidence shows interbreeding with ancestors of many present-day non-African populations."},{"id":"fc-unit5-20-denisovans","unit":"unit5","front":"Denisovans","back":"Denisovans are an archaic human lineage identified largely through ancient DNA and limited fossil remains. Their ancestry contributed genetically to some present-day populations, especially in Oceania and parts of Asia."},{"id":"fc-unit5-21-homo-sapiens","unit":"unit5","front":"Homo sapiens","back":"Homo sapiens evolved in Africa and later dispersed widely, interacting and interbreeding with some archaic human populations. Modern human origins are best understood as a branching, reticulate population history."},{"id":"fc-unit5-22-human-dispersal","unit":"unit5","front":"Human dispersal","back":"Human dispersal involved multiple movements within and out of Africa, followed by population expansions, founder effects, admixture and local adaptation."},{"id":"fc-unit5-23-molecular-evidence-for-human-evolution","unit":"unit5","front":"Molecular evidence for human evolution","back":"Genomic variation, ancient DNA, mitochondrial genomes and Y-chromosome lineages provide complementary evidence about population history, divergence and admixture."},{"id":"fc-unit5-24-mitochondrial-dna-evidence","unit":"unit5","front":"Mitochondrial DNA evidence","back":"Mitochondrial DNA is maternally inherited in humans and has been widely used to study maternal lineages and population history. It represents one locus and therefore does not capture the entire species history."},{"id":"fc-unit5-25-y-chromosome-evidence","unit":"unit5","front":"Y-chromosome evidence","back":"The non-recombining region of the Y chromosome traces paternal lineages and can complement autosomal and mitochondrial data in studies of male-mediated population history."},{"id":"fc-unit5-26-ancient-dna","unit":"unit5","front":"Ancient DNA","back":"Ancient DNA sequencing retrieves genetic information from archaeological and palaeontological remains. It has transformed reconstruction of human evolution, admixture and population replacement."},{"id":"fc-unit5-27-human-evolutionary-phylogeny","unit":"unit5","front":"Human evolutionary phylogeny","back":"Human evolutionary phylogeny is a branching network of fossil and genetic lineages. Some relationships remain uncertain, and introgression means population history can include reticulation as well as splitting."}]</script>
<script type="application/json" id="data-glossary">[{"term":"Mendelian principles","definition":"Mendelian inheritance explains how discrete hereditary factors (genes) are transmitted from parents to offspring. The core principles are segregation of allele pairs during gamete formation and, for unlinked loci, independent assortment.","ta":"மெண்டேலிய மரபியல் கோட்பாடுகள்","unit":"unit1"},{"term":"Monohybrid cross","definition":"A monohybrid cross follows inheritance at one locus, commonly between heterozygotes such as Aa × Aa. With complete dominance it predicts a 1:2:1 genotypic ratio and a 3:1 phenotypic ratio.","ta":"ஒற்றைப் பண்புக் கலப்பு","unit":"unit1"},{"term":"Law of segregation","definition":"The law of segregation states that the two alleles at a diploid locus separate during gamete formation, so each gamete carries one allele. The cytological basis is separation of homologous chromosomes, and later sister chromatids, during meiosis.","ta":"பிரிதல் விதி","unit":"unit1"},{"term":"Classical 3:1 phenotypic ratio","definition":"A 3:1 F2 phenotypic ratio arises from Aa × Aa under complete dominance, random fertilisation, equal viability, and no segregation distortion. Modified ratios indicate alternative dominance relations, lethality, or gene interaction.","ta":"மரபுவழி 3:1 தோற்றவகை விகிதம்","unit":"unit1"},{"term":"Incomplete dominance","definition":"In incomplete dominance the heterozygote has a phenotype intermediate between the two homozygotes. Because all three genotypes are phenotypically distinguishable, the F2 phenotypic ratio is typically 1:2:1.","ta":"முழுமையற்ற ஆதிக்கம்","unit":"unit1"},{"term":"Codominance","definition":"In codominance both alleles are detectably expressed in the heterozygote. The human ABO system illustrates codominance between Iᴬ and Iᴮ, although the locus also contains a recessive i allele.","ta":"இணைஆதிக்கம்","unit":"unit1"},{"term":"Lethal genes","definition":"Lethal alleles reduce viability in particular genotypes and can modify expected Mendelian ratios. In an Aa × Aa cross with recessive aa lethality, removal of the aa class yields a 1 AA : 2 Aa surviving genotype ratio; the surviving phenotype ratio depends on how AA and Aa are expressed.","ta":"உயிர்க்கொல்லி மரபணுக்கள்","unit":"unit1"},{"term":"Two-gene interactions","definition":"When two loci influence one phenotype, the F2 9:3:3:1 classes can be regrouped according to pathway relationships. The resulting modified ratios provide evidence for complementary, epistatic, duplicate or inhibitory interactions while each locus still segregates Mendelianly.","ta":"இரு மரபணு இடையினைவுகள்","unit":"unit1"},{"term":"Epistasis","definition":"Epistasis occurs when alleles at one locus modify or mask phenotypic expression at another locus. Classical dihybrid ratios such as 9:3:4, 12:3:1, 9:7, 15:1 and 13:3 reflect different interaction architectures.","ta":"எபிஸ்டாசிஸ் — மரபணு மறைத்தல் இடையினைவு","unit":"unit1"},{"term":"Complementary gene interaction","definition":"Complementary gene action requires a particular dominant allele at each of two loci for a phenotype to appear. A classic F2 pattern is 9:7.","ta":"இணைநிறைவு மரபணு இடையினைவு","unit":"unit1"},{"term":"Supplementary gene interaction","definition":"Supplementary interactions occur when one gene produces a primary effect and another modifies or supplements that phenotype, creating modified dihybrid ratios.","ta":"துணைநிறைவு மரபணு இடையினைவு","unit":"unit1"},{"term":"Multiple-gene interactions","definition":"Phenotypes may depend on networks containing more than two loci. Such interactions produce many genotype-to-phenotype mappings and are best analysed by separating segregation at each locus from the biochemical or developmental pathway that combines their effects.","ta":"பல மரபணு இடையினைவுகள்","unit":"unit1"},{"term":"Pleiotropy","definition":"Pleiotropy is the influence of one gene on multiple phenotypic traits, often because a gene product participates in several tissues or biological processes.","ta":"பலவிளைவு மரபணுச் செயல்","unit":"unit1"},{"term":"Penetrance","definition":"Penetrance is the proportion of individuals with a genotype who express its associated phenotype. Reduced penetrance can cause apparently unaffected individuals to transmit disease-associated alleles.","ta":"பெனிட்ரன்ஸ் — genotype வெளிப்படும் விகிதம்","unit":"unit1"},{"term":"Expressivity","definition":"Expressivity describes the degree or severity with which a genotype is phenotypically expressed among individuals who show the phenotype.","ta":"வெளிப்பாட்டுத் தீவிரம்","unit":"unit1"},{"term":"Linkage","definition":"Genes located on the same chromosome can be inherited together more often than expected by independent assortment. Recombination can break linkage, and recombination frequency generally rises with physical distance for relatively close loci.","ta":"மரபணு இணைப்பு","unit":"unit1"},{"term":"Types of linkage","definition":"Linkage may be described as complete when no detectable recombinants occur and incomplete when crossing over generates recombinant gametes. Coupling (cis) and repulsion (trans) describe alternative haplotype phases of alleles at linked loci.","ta":"மரபணு இணைப்பின் வகைகள்","unit":"unit1"},{"term":"Crossing over","definition":"Crossing over is reciprocal exchange between non-sister chromatids of homologous chromosomes during meiotic prophase I. It produces recombinant chromatids and contributes to genetic variation.","ta":"குறுக்குப் பரிமாற்றம்","unit":"unit1"},{"term":"Types of crossing over","definition":"Crossing over may involve single, double or multiple exchanges between homologous chromatids. Double crossovers can involve two, three or four chromatids; their recovery depends on chromatid participation and crossover interference.","ta":"குறுக்குப் பரிமாற்றத்தின் வகைகள்","unit":"unit1"},{"term":"Mechanism of crossing over","definition":"Modern molecular models explain crossing over through programmed DNA double-strand breaks, strand invasion, homologous pairing and resolution of recombination intermediates.","ta":"குறுக்குப் பரிமாற்றத்தின் இயங்குமுறை","unit":"unit1"},{"term":"Theories of crossing over","definition":"Historical cytological theories attempted to explain the relation between chiasmata and genetic recombination. Modern interpretation is molecular: programmed DNA double-strand breaks are repaired through homologous recombination pathways that can resolve as crossovers or non-crossovers.","ta":"குறுக்குப் பரிமாற்றக் கோட்பாடுகள்","unit":"unit1"},{"term":"Genetic mapping","definition":"Genetic mapping orders loci using recombination frequencies. For short intervals, 1% recombination is approximately 1 centimorgan, but multiple crossovers make the relationship nonlinear over long distances.","ta":"மரபணு வரைபடமிடல்","unit":"unit1"},{"term":"Cytological mapping","definition":"Cytological mapping assigns genes or DNA sequences to visible chromosome regions using chromosome morphology, banding, deletions, translocations or in situ hybridisation. It links genetic phenomena to physical chromosome location but has different resolution from linkage and sequence maps.","ta":"செலியியல் வரைபடமிடல்","unit":"unit1"},{"term":"Linkage maps","definition":"A linkage map places markers in relative order along chromosomes using recombination data. Three-point crosses can infer gene order and reveal double crossovers.","ta":"இணைப்பு வரைபடங்கள்","unit":"unit1"},{"term":"Molecular-marker mapping","definition":"Molecular markers such as SNPs, microsatellites and sequence variants can be used to track chromosomal regions and map traits through linkage or association approaches.","ta":"மூலக்கூறு குறியீட்டு வரைபடமிடல்","unit":"unit1"},{"term":"Somatic-cell hybrid mapping","definition":"Somatic-cell hybrid mapping historically assigned human genes to chromosomes by correlating retention of particular human chromosomes with expression of a gene product in hybrid cell lines.","ta":"உடல்செல் கலப்பின வரைபடமிடல்","unit":"unit1"},{"term":"Polygenic inheritance","definition":"Polygenic inheritance occurs when many loci contribute to a quantitative trait, often producing continuous phenotypic variation. Environmental effects commonly add further variance.","ta":"பல்மரபணு மரபுரிமை","unit":"unit1"},{"term":"Heritability","definition":"Heritability is the proportion of phenotypic variance attributable to genetic variance in a specified population and environment. Broad-sense heritability includes all genetic variance; narrow-sense heritability emphasises additive genetic variance.","ta":"மரபுரிமைத்திறன்","unit":"unit1"},{"term":"Measurement of heritability","definition":"Heritability can be estimated from variance components, resemblance among relatives, parent–offspring regression or designed breeding studies. Interpretation depends on study design and assumptions.","ta":"மரபுரிமைத்திறன் அளவீடு","unit":"unit1"},{"term":"Chromosome structure","definition":"A chromosome is a DNA–protein complex organised into chromatin. Eukaryotic chromosomes contain linear DNA, centromeres, telomeres and chromosomal domains that compact and regulate the genome.","ta":"குரோமோசோம் அமைப்பு","unit":"unit2"},{"term":"Chromosome chemical composition","definition":"Eukaryotic chromosomes consist primarily of DNA, histones and non-histone chromosomal proteins, together with associated RNAs. Nucleosomes form the basic repeating unit of chromatin.","ta":"குரோமோசோமின் வேதியியல் அமைப்பு","unit":"unit2"},{"term":"Chromosome organisation","definition":"Chromosome organisation is hierarchical, from DNA wrapped around histone octamers to higher-order chromatin loops and chromosome territories. Euchromatin and heterochromatin differ in compaction and functional state.","ta":"குரோமோசோம் ஒழுங்கமைவு","unit":"unit2"},{"term":"Special chromosomes","definition":"Special chromosomes are unusually organised chromosomes that become conspicuous in particular cell types or developmental stages. Polytene chromosomes contain many aligned DNA copies and display banding/puffs, whereas lampbrush chromosomes have extended transcriptionally active loops; both are classic models for relating chromosome structure to gene activity.","ta":"சிறப்பு வகை குரோமோசோம்கள்","unit":"unit2"},{"term":"B chromosomes","definition":"B chromosomes are supernumerary chromosomes present in addition to the standard A-chromosome complement in some species. They often show non-Mendelian transmission and variable effects on fitness.","ta":"B குரோமோசோம்கள்","unit":"unit2"},{"term":"Karyotype","definition":"A karyotype describes the chromosome complement of an individual, including chromosome number and gross morphology. Cytogenetic analysis can detect large numerical and structural abnormalities.","ta":"கேரியோடைப்","unit":"unit2"},{"term":"Barr body","definition":"A Barr body is a condensed, largely inactive X chromosome visible in many somatic nuclei. X-chromosome inactivation provides dosage compensation in therian mammals and creates cellular mosaicism.","ta":"பார் உடல்","unit":"unit2"},{"term":"Numerical chromosome aberrations","definition":"Numerical chromosome aberrations change chromosome number through errors such as meiotic or mitotic nondisjunction, anaphase lag, or whole-genome duplication. The central distinction is between euploid changes in complete chromosome sets and aneuploid gain or loss of individual chromosomes.","ta":"எண்ணிக்கைக் குரோமோசோம் மாற்றங்கள்","unit":"unit2"},{"term":"Euploidy","definition":"Euploidy refers to variation involving complete chromosome sets, such as haploidy or polyploidy. Polyploidy is especially important in plant evolution and speciation.","ta":"யூப்ளாய்டி","unit":"unit2"},{"term":"Aneuploidy","definition":"Aneuploidy is gain or loss of individual chromosomes, commonly produced by nondisjunction. Examples include trisomy 21 and monosomy X.","ta":"அன்யூப்ளாய்டி","unit":"unit2"},{"term":"Structural chromosome aberrations","definition":"Structural chromosome aberrations arise when chromosome breakage and repair alter segment order or dosage. Deletions and duplications change copy number; inversions reverse segment orientation; translocations move material within or between chromosomes, with balanced and unbalanced outcomes distinguished by net DNA dosage.","ta":"குரோமோசோம் கட்டமைப்பு மாற்றங்கள்","unit":"unit2"},{"term":"Deletion","definition":"A chromosomal deletion removes a segment of DNA and can cause dosage imbalance or expose recessive alleles. Phenotypic severity depends on the genes and regulatory regions lost.","ta":"நீக்கம்","unit":"unit2"},{"term":"Duplication","definition":"A chromosomal duplication creates an extra copy of a chromosome segment. Gene duplication can alter dosage and, over evolutionary time, provide material for functional divergence.","ta":"இரட்டிப்பு","unit":"unit2"},{"term":"Inversion","definition":"An inversion occurs when a chromosome segment is reversed in orientation. In heterozygotes, crossing over within the inverted region can produce unbalanced products and reduce apparent recombination.","ta":"தலைகீழ்மாற்றம்","unit":"unit2"},{"term":"Translocation","definition":"A translocation moves chromosome material to a new chromosomal location. Reciprocal translocation carriers can be phenotypically normal but may produce unbalanced gametes.","ta":"இடமாற்றம்","unit":"unit2"},{"term":"Down syndrome","definition":"Down syndrome most commonly results from trisomy 21, usually due to meiotic nondisjunction; less often it results from a Robertsonian translocation or mosaicism.","ta":"டவுன் சிண்ட்ரோம்","unit":"unit2"},{"term":"Turner syndrome","definition":"Turner syndrome involves complete or partial monosomy X in phenotypic females, with considerable clinical variability and frequent mosaic forms.","ta":"டர்னர் சிண்ட்ரோம்","unit":"unit2"},{"term":"Edwards syndrome","definition":"Edwards syndrome is usually caused by trisomy 18 and is associated with severe developmental abnormalities and high infant mortality.","ta":"எட்வர்ட்ஸ் சிண்ட்ரோம்","unit":"unit2"},{"term":"Klinefelter syndrome","definition":"Klinefelter syndrome most commonly has a 47,XXY karyotype and affects phenotypic males. Meiotic nondisjunction is a major cause, and mosaic cases also occur.","ta":"க்லைன்ஃபெல்டர் சிண்ட்ரோம்","unit":"unit2"},{"term":"Pedigree analysis","definition":"Pedigree analysis infers inheritance patterns by tracing phenotypes through generations. It is used to evaluate autosomal, sex-linked and mitochondrial transmission and to estimate recurrence risks.","ta":"வம்சவரிசைப் பகுப்பாய்வு","unit":"unit2"},{"term":"Human Genome Project","definition":"The Human Genome Project produced a reference human genome sequence and catalysed large-scale genomics, mapping and technology development. Modern human genomics now uses multiple reference assemblies and population-scale variation resources.","ta":"மனித ஜீனோம் திட்டம்","unit":"unit2"},{"term":"Prenatal diagnosis","definition":"Prenatal genetic diagnosis uses fetal or placental material to answer a defined clinical genetic question. Invasive sampling such as CVS or amniocentesis can support cytogenetic or molecular testing; interpretation must address test scope, false-positive/false-negative limits, procedural risk, informed consent and non-directive counselling.","ta":"பிறப்புக்கு முன் மரபியல் நோயறிதல்","unit":"unit2"},{"term":"Amniocentesis","definition":"Amniocentesis samples amniotic fluid, typically in the second trimester, to obtain fetal cells or analytes for diagnostic testing. It is an invasive procedure and must be discussed in a clinical and ethical context.","ta":"அம்னியோசென்டீசிஸ்","unit":"unit2"},{"term":"Chorionic Villus Sampling","definition":"Chorionic villus sampling obtains placental chorionic tissue earlier in pregnancy than amniocentesis and can support prenatal genetic diagnosis.","ta":"கோரியானிக் வில்லஸ் மாதிரி எடுப்பு","unit":"unit2"},{"term":"Genetic counselling","definition":"Genetic counselling is a communication process that helps individuals and families understand genetic conditions, testing options, inheritance, uncertainty and reproductive choices while supporting autonomous decision-making.","ta":"மரபியல் ஆலோசனை","unit":"unit2"},{"term":"Eugenics","definition":"Eugenics refers to historical and contemporary attempts to influence reproduction in order to change the genetic composition of populations. Coercive eugenic policies caused major human-rights abuses and are scientifically and ethically discredited.","ta":"யூஜெனிக்ஸ் — வரலாற்று மற்றும் உயிரியல் நெறியியல் பார்வை","unit":"unit2"},{"term":"Euthenics","definition":"Euthenics is the historical concept of improving human well-being through environmental, educational and social conditions rather than selective reproduction.","ta":"யூதெனிக்ஸ் — சூழல் மற்றும் சமூக நல மேம்பாடு","unit":"unit2"},{"term":"Sex-linked inheritance","definition":"Sex-linked inheritance involves genes located on sex chromosomes. X-linked patterns differ between individuals with one versus two X chromosomes because hemizygosity exposes recessive X-linked alleles.","ta":"பாலினக் குரோமோசோம் சார்ந்த மரபுரிமை","unit":"unit2"},{"term":"Sex-limited characters","definition":"Sex-limited traits are genetically present in both sexes but expressed in only one because of anatomical or hormonal context.","ta":"பாலின வரையறுக்கப்பட்ட பண்புகள்","unit":"unit2"},{"term":"Sex-influenced characters","definition":"Sex-influenced traits are expressed differently in the sexes, often because dominance relationships or hormonal environments differ.","ta":"பாலினத் தாக்கமுள்ள பண்புகள்","unit":"unit2"},{"term":"Organic evolution","definition":"Organic evolution is heritable change in populations across generations. It includes changes in allele frequencies, trait distributions and lineage composition produced by mutation, recombination, natural selection, genetic drift and gene flow; individual acclimatisation or development is not itself evolutionary change.","ta":"உயிரியல் பரிணாமம்","unit":"unit3"},{"term":"Lamarckism","definition":"Lamarck proposed that organisms change through use and disuse and that acquired characteristics could be inherited. Although important historically, this mechanism does not explain modern genetic inheritance.","ta":"லாமார்க்கியம்","unit":"unit3"},{"term":"Darwinism","definition":"Darwinian evolution centres on descent with modification and natural selection acting on heritable variation. Darwin lacked modern genetics, which was later integrated into the evolutionary synthesis.","ta":"டார்வினியம்","unit":"unit3"},{"term":"Mutation theory","definition":"Hugo de Vries emphasised mutations as discontinuous sources of variation and proposed saltational evolutionary change. Modern evolutionary genetics recognises mutation as a source of new alleles but not a complete theory of evolution by itself.","ta":"திடீர்மாற்றக் கோட்பாடு","unit":"unit3"},{"term":"Modern evolutionary synthesis","definition":"The Modern Synthesis united Mendelian genetics, population genetics, natural selection and systematics, explaining evolution as changes in allele frequencies and their consequences over time.","ta":"நவீன பரிணாம ஒருங்கிணைப்புக் கோட்பாடு","unit":"unit3"},{"term":"Population","definition":"In evolutionary genetics, a population is a set of conspecific individuals that occupy a defined spatial and temporal context and exchange genes to some degree. Population boundaries are biological hypotheses: dispersal, mating structure and reproductive connectivity determine whether sampled individuals behave as one evolutionary unit or several structured subpopulations.","ta":"மக்கள்தொகை","unit":"unit3"},{"term":"Gene pool","definition":"The gene pool is the complete set of alleles present in an interbreeding population, considered together with their frequencies. Evolutionary change can therefore be quantified as changes in the composition of this population-level allele pool across generations.","ta":"மரபணுக் களஞ்சியம்","unit":"unit3"},{"term":"Allele frequency","definition":"Allele frequency is the proportion of all gene copies at a locus represented by a particular allele. In a diploid population it is calculated from genotype counts, and its change through generations is a central quantitative measure of evolution.","ta":"அலீல் அதிர்வெண்","unit":"unit3"},{"term":"Sources of genetic variation","definition":"Genetic variation originates through mutation, recombination, independent assortment, gene duplication, transposable-element activity and other genome changes; gene flow can introduce already-existing variants from other populations. These processes generate or redistribute heritable differences on which selection and drift subsequently act.","ta":"மரபியல் மாறுபாட்டின் மூலங்கள்","unit":"unit3"},{"term":"Mutation","definition":"Mutation is a heritable change in genetic material and is the ultimate source of new alleles. Mutation types range from nucleotide substitutions to large structural changes.","ta":"திடீர்மாற்றம்","unit":"unit3"},{"term":"Transposable elements","definition":"Transposable elements are DNA sequences capable of moving or copying within genomes. They can generate insertional mutations, regulatory changes, recombination substrates and genome expansion.","ta":"இடம்பெயரும் மரபியல் கூறுகள்","unit":"unit3"},{"term":"Recombination","definition":"Recombination reshuffles alleles between homologous chromosomes and creates new haplotypes. It changes associations among loci without necessarily changing allele frequencies directly.","ta":"மறுசேர்க்கை","unit":"unit3"},{"term":"Natural selection","definition":"Natural selection is differential survival and reproduction associated with heritable phenotypic differences. It changes allele frequencies when trait variation has a genetic basis.","ta":"இயற்கைத் தேர்வு","unit":"unit3"},{"term":"Evolutionary forces","definition":"Evolutionary forces are processes that alter allele frequencies, genotype frequencies or their spatial distribution. Mutation introduces new alleles, selection changes representation according to fitness, drift changes frequencies stochastically, and gene flow moves alleles among populations; non-random mating primarily alters genotype proportions and can interact with these forces.","ta":"பரிணாம விசைகள்","unit":"unit3"},{"term":"Migration and gene flow","definition":"Gene flow is the movement of alleles among populations through migration and reproduction. It can increase variation within populations while reducing divergence between them.","ta":"இடம்பெயர்வு மற்றும் மரபணு ஓட்டம்","unit":"unit3"},{"term":"Genetic drift","definition":"Genetic drift is stochastic change in allele frequencies due to finite population sampling. It is especially strong in small populations and can lead to fixation or loss independent of adaptive value.","ta":"மரபணுச் சறுக்கு","unit":"unit3"},{"term":"Founder effect","definition":"A founder effect occurs when a new population is established by a small sample of a larger population, causing allele frequencies and genetic diversity to differ by chance.","ta":"சிறு தொடக்கக் குழு விளைவு","unit":"unit3"},{"term":"Population bottleneck","definition":"A population bottleneck is a sharp temporary reduction in population size that can cause random allele loss, reduced heterozygosity and long-lasting genetic consequences.","ta":"மக்கள்தொகை சுருக்கநிலை விளைவு","unit":"unit3"},{"term":"Hardy–Weinberg equilibrium","definition":"The Hardy–Weinberg model provides a null expectation for genotype frequencies in an idealised population with random mating, very large size, and no selection, mutation or migration. For two alleles, p+q=1 and p²+2pq+q²=1.","ta":"ஹார்டி–வைன்பெர்க் சமநிலை","unit":"unit3"},{"term":"Hardy–Weinberg calculations","definition":"Hardy–Weinberg calculations connect observed genotype or phenotype data with allele-frequency estimates under an explicit null model. For two alleles, p + q = 1 and expected genotype frequencies after random mating are p², 2pq and q²; observed counts can then be compared with expectations using appropriate statistical tests.","ta":"ஹார்டி–வைன்பெர்க் கணக்கீடுகள்","unit":"unit3"},{"term":"Stabilising selection","definition":"Stabilising selection favours intermediate phenotypes over extremes. It can reduce phenotypic variance around an optimum while leaving the population mean relatively unchanged, provided the selective environment remains stable.","ta":"நிலைப்படுத்தும் தேர்வு","unit":"unit3"},{"term":"Directional selection","definition":"Directional selection favours phenotypes toward one end of a distribution, shifting the population mean through generations. It commonly occurs when environmental conditions change or when a new selective pressure alters relative fitness.","ta":"திசைத் தேர்வு","unit":"unit3"},{"term":"Disruptive selection","definition":"Disruptive selection favours phenotypic extremes over intermediates and may increase variation. Under some ecological conditions it can contribute to divergence.","ta":"பிளவூட்டும் தேர்வு","unit":"unit3"},{"term":"Origin of life","definition":"Origin-of-life research investigates how prebiotic chemistry could generate self-replicating, compartmentalised systems capable of Darwinian evolution. Hypotheses include RNA-world models, metabolism-first models and hydrothermal scenarios.","ta":"உயிரின் தோற்றம்","unit":"unit4"},{"term":"Molecular evolution","definition":"Molecular evolution examines changes in DNA, RNA and protein sequences through time and the population processes that shape them.","ta":"மூலக்கூறு பரிணாமம்","unit":"unit4"},{"term":"Principles of molecular evolutionary studies","definition":"Molecular evolutionary studies begin by establishing homology, obtaining an appropriate sequence alignment, choosing an evolutionary model, and distinguishing mutation from substitution. Inference then depends on sampling, rate variation, selection, recombination, calibration and statistical uncertainty; molecular similarity alone is not equivalent to a resolved phylogeny.","ta":"மூலக்கூறு பரிணாம ஆய்வின் அடிப்படைக் கோட்பாடுகள்","unit":"unit4"},{"term":"Molecular divergence","definition":"Molecular divergence is the accumulation of sequence differences between lineages after separation from a common ancestor.","ta":"மூலக்கூறு வேறுபாடு","unit":"unit4"},{"term":"Molecular phylogenetics","definition":"Molecular phylogenetics reconstructs evolutionary relationships using DNA, RNA or protein sequence data and explicit models of sequence change.","ta":"மூலக்கூறு வம்சவழியியல்","unit":"unit4"},{"term":"Molecular markers","definition":"Molecular markers are heritable DNA variants used to identify individuals, populations, genomic regions or evolutionary relationships. SNPs, microsatellites and sequence loci are common examples.","ta":"மூலக்கூறு குறியீடுகள்","unit":"unit4"},{"term":"Molecular clock","definition":"A molecular clock estimates divergence time from molecular change, calibrated using fossils, biogeography or known dates. Strict clocks assume constant rates; relaxed-clock models allow rate variation.","ta":"மூலக்கூறு கடிகாரம்","unit":"unit4"},{"term":"Sequence evolution","definition":"Sequence evolution comprises substitutions, insertions, deletions, duplications, gene conversion and other changes that accumulate in DNA, RNA or proteins through time. The observed pattern reflects mutation processes plus population-genetic filtering by selection and drift, and repeated substitutions can obscure the true number of historical changes.","ta":"வரிசை பரிணாமம்","unit":"unit4"},{"term":"Multiple sequence alignment","definition":"Multiple sequence alignment arranges homologous sequences to infer positional correspondence, conserved regions and substitutions. Alignment quality strongly influences downstream phylogenetic inference.","ta":"பல வரிசை ஒப்பமைவு","unit":"unit4"},{"term":"Phylogenetic trees","definition":"A phylogenetic tree is a hypothesis about evolutionary relationships. Nodes represent lineage divergences or sampled ancestors depending on representation; tips represent sampled taxa or sequences.","ta":"வம்சவழி மரங்கள்","unit":"unit4"},{"term":"Tree terminology","definition":"Phylogenetic-tree terminology describes hypotheses of ancestry using roots, branches, internal nodes, terminal taxa, clades, sister groups and outgroups. Topology records branching relationships, whereas branch lengths may represent time, amount of change or no quantitative scale at all depending on the tree.","ta":"வம்சவழி மரக் கலைச்சொற்கள்","unit":"unit4"},{"term":"Rooted and unrooted trees","definition":"A rooted tree specifies the direction of ancestry from a common ancestor, whereas an unrooted tree depicts relationships without specifying the ancestral root.","ta":"வேருடைய மற்றும் வேரற்ற வம்சவழி மரங்கள்","unit":"unit4"},{"term":"Clades","definition":"A clade is a monophyletic group consisting of a common ancestor and all of its descendants. Clade membership is defined by branching history and shared ancestry rather than by superficial similarity.","ta":"ஒற்றை முன்னோர் கிளைக் குழுக்கள் (clades)","unit":"unit4"},{"term":"Nodes","definition":"A node in a phylogenetic tree is a branching or terminal point. An internal node represents the inferred most recent common ancestor of the descendant lineages emerging from it, whereas a terminal node represents a sampled taxon or sequence; an internal node is not automatically a known fossil species.","ta":"முடிச்சுப் புள்ளிகள்","unit":"unit4"},{"term":"Branches","definition":"Branches in a phylogenetic tree connect nodes and represent evolutionary lineages between divergence events or sampled endpoints. Their visual length has meaning only when the tree explicitly scales branches to time or amount of change; horizontal order and line length in an unscaled cladogram do not indicate evolutionary advancement.","ta":"வம்சவழி கிளைகள்","unit":"unit4"},{"term":"Sister taxa","definition":"Sister taxa are two lineages that share an immediate most recent common ancestor not shared with any other included taxon. Neither sister taxon should be interpreted as the direct ancestor of the other.","ta":"சகோதரி வரிவகைகள்","unit":"unit4"},{"term":"Outgroups","definition":"An outgroup is a taxon or lineage outside the focal ingroup used to help polarise character changes and root phylogenetic trees.","ta":"வெளிக்குழுக்கள்","unit":"unit4"},{"term":"Tree construction","definition":"Phylogenetic tree construction involves selecting homologous characters, aligning or coding them, choosing an evolutionary model or optimality criterion, inferring topology and assessing support.","ta":"வம்சவழி மர கட்டமைப்பு","unit":"unit4"},{"term":"Distance methods","definition":"Distance methods convert pairwise sequence differences into evolutionary distance estimates and infer trees from the resulting matrix. Neighbor-joining is a common example.","ta":"தூர அடிப்படையிலான முறைகள்","unit":"unit4"},{"term":"Character-based approaches","definition":"Character-based phylogenetic methods analyse individual character states directly. Maximum parsimony seeks minimal change, while maximum likelihood and Bayesian approaches use explicit evolutionary models.","ta":"பண்புக்கூறு அடிப்படையிலான அணுகுமுறைகள்","unit":"unit4"},{"term":"Tree interpretation","definition":"Tree interpretation requires reading branching order, common ancestry, clade membership, rooting and support without mistaking tip order or branch rotation for evolutionary rank.","ta":"வம்சவழி மர விளக்கம்","unit":"unit4"},{"term":"Biological species concept","definition":"The biological species concept defines species as groups of actually or potentially interbreeding natural populations reproductively isolated from other such groups.","ta":"உயிரியல் இனக் கருத்து","unit":"unit4"},{"term":"Phylogenetic species concept","definition":"Phylogenetic species concepts identify species as diagnosable or independently evolving lineages in a phylogenetic framework.","ta":"வம்சவழியியல் இனக் கருத்து","unit":"unit4"},{"term":"Speciation","definition":"Speciation is the evolution of reproductive isolation and lineage independence. It can involve geographic separation, ecological divergence, sexual selection and genomic differentiation.","ta":"இனவாக்கம்","unit":"unit4"},{"term":"Reproductive isolation","definition":"Reproductive isolation comprises barriers that reduce gene flow between populations. Barriers may act before fertilisation or after hybrid formation.","ta":"இனப்பெருக்கத் தனிமைப்படுத்தல்","unit":"unit4"},{"term":"Prezygotic isolation","definition":"Prezygotic barriers prevent mating or fertilisation through habitat, temporal, behavioural, mechanical or gametic isolation.","ta":"சைகோட் உருவாக்கத்திற்கு முன் தனிமைப்படுத்தல்","unit":"unit4"},{"term":"Postzygotic isolation","definition":"Postzygotic isolation acts after fertilisation and reduces gene flow because hybrids have reduced viability, reduced fertility, or later-generation breakdown. Hybrid inviability and hybrid sterility are common examples.","ta":"சைகோட் உருவாக்கத்திற்குப் பின் தனிமைப்படுத்தல்","unit":"unit4"},{"term":"Allopatric speciation","definition":"Allopatric speciation occurs when geographic separation restricts gene flow, allowing populations to diverge through selection, drift and mutation.","ta":"புவியியல் தனிமை இனவாக்கம்","unit":"unit4"},{"term":"Sympatric speciation","definition":"Sympatric speciation occurs without complete geographic separation, often through strong ecological divergence, assortative mating or, in plants, polyploidy.","ta":"ஒரே புவியிட இனவாக்கம்","unit":"unit4"},{"term":"Adaptive radiation","definition":"Adaptive radiation is rapid diversification of a lineage into multiple ecological forms, often after ecological opportunity or key innovations.","ta":"தகவமைப்பு சார்ந்த விரைவு பரிணாமப் பல்வகைப்படுதல்","unit":"unit4"},{"term":"Convergent evolution","definition":"Convergent evolution produces similar traits independently in different lineages under similar selective pressures or functional constraints.","ta":"ஒருங்குமுகப் பரிணாமம்","unit":"unit4"},{"term":"Sexual selection","definition":"Sexual selection arises from differences in mating success and includes competition within a sex and mate choice between sexes. It can favour traits that increase reproduction even when they carry survival costs.","ta":"பாலியல் தேர்வு","unit":"unit4"},{"term":"Altruism","definition":"Evolutionary altruism describes behaviour that reduces an actor’s direct fitness while increasing another individual’s fitness. Kin selection, inclusive fitness and reciprocal interactions can explain the evolution of such behaviour under specific conditions.","ta":"பிறர்நல நடத்தை","unit":"unit4"},{"term":"Evolution of social behaviour","definition":"The evolution of social behaviour is analysed through its consequences for direct and indirect fitness. Cooperation, altruism, conflict and helping can evolve through mechanisms such as kin selection, reciprocal interactions, mutual benefit and population structure; Hamilton’s rule formalises when an indirect-fitness benefit to relatives can offset a cost to the actor.","ta":"சமூக நடத்தையின் பரிணாமம்","unit":"unit4"},{"term":"Origin of higher categories","definition":"Higher taxonomic categories arise through repeated lineage splitting, extinction and the accumulation of evolutionary novelties over deep time. Modern macroevolution does not require a separate mechanism for 'higher' taxa; it examines how speciation, developmental change, ecological opportunity and differential diversification generate large-scale phylogenetic patterns.","ta":"உயர் வகைப்பாட்டுக் குழுக்களின் தோற்றம்","unit":"unit5"},{"term":"Microevolution","definition":"Microevolution refers to changes in allele frequencies and trait distributions within populations over relatively short evolutionary timescales.","ta":"நுண்பரிணாமம்","unit":"unit5"},{"term":"Macroevolution","definition":"Macroevolution concerns large-scale evolutionary patterns at and above the species level, including speciation, extinction and clade diversification.","ta":"பெரும்பரிணாமம்","unit":"unit5"},{"term":"Megaevolution","definition":"Megaevolution is an older term sometimes used for very large-scale evolutionary transitions and origins of major body plans. Modern evolutionary biology more commonly discusses macroevolutionary transitions and developmental innovation.","ta":"மிகப்பெரும் பரிணாமம்","unit":"unit5"},{"term":"Coevolution","definition":"Coevolution is reciprocal evolutionary change between interacting lineages, such as hosts and parasites, predators and prey, or mutualists.","ta":"இணைப் பரிணாமம்","unit":"unit5"},{"term":"Evolutionary rates","definition":"Evolutionary rates vary among traits, genes, lineages and time intervals. Rates can be expressed morphologically, genetically or in diversification processes.","ta":"பரிணாம வேகங்கள்","unit":"unit5"},{"term":"Phyletic gradualism","definition":"Phyletic gradualism describes evolutionary change as the cumulative transformation of a lineage through many relatively small changes over long intervals. It is a model of evolutionary tempo and pattern, not a claim that rates must be identical or constant.","ta":"வம்சவழி படிப்படியான மாற்றம்","unit":"unit5"},{"term":"Punctuated equilibrium","definition":"Punctuated equilibrium proposes that species often show long intervals of relative morphological stasis interrupted by geologically shorter episodes of change associated with speciation.","ta":"பங்க்ச்சுவேட்டட் ஈக்விலிப்ரியம் — நீண்ட நிலைத்தன்மை மற்றும் குறுகிய வேகமாற்றக் கட்டங்கள்","unit":"unit5"},{"term":"Geological time scale","definition":"The geological time scale organises Earth history into eons, eras, periods and epochs using stratigraphy, radiometric dating and major geological or biological transitions.","ta":"புவியியல் கால அளவுகோல்","unit":"unit5"},{"term":"Major evolutionary transitions","definition":"Major evolutionary transitions are episodes in which biological organisation, inheritance or individuality changes substantially—for example the origin of eukaryotic cells, multicellularity and complex social integration. They are reconstructed by combining comparative, fossil, developmental and molecular evidence rather than by assuming a predetermined progression toward complexity.","ta":"முக்கிய பரிணாம மாற்றங்கள்","unit":"unit5"},{"term":"Primate evolution","definition":"Primate evolution includes diversification of strepsirrhines, haplorhines, monkeys and apes, with changes in vision, grasping, brain organisation, locomotion and social behaviour.","ta":"பிரைமேட் பரிணாமம்","unit":"unit5"},{"term":"Hominin evolution","definition":"Hominin evolution is a branching history of lineages more closely related to humans than to chimpanzees after their last common ancestor. Bipedal adaptations appeared well before modern human brain size.","ta":"ஹோமினின் பரிணாமம்","unit":"unit5"},{"term":"Primate versus hominin characteristics","definition":"Hominins share primate traits but are distinguished in the fossil record especially by habitual bipedal adaptations, dental changes and later trends in brain expansion, technology and life history.","ta":"பிரைமேட் மற்றும் ஹோமினின் பண்புகளின் ஒப்பீடு","unit":"unit5"},{"term":"Dryopithecus and fossil apes","definition":"Dryopithecus is a Miocene fossil ape genus important for understanding hominoid diversity. It should not be presented as a proven direct ancestor of Homo sapiens.","ta":"ட்ரையோபிதிகஸ் மற்றும் புதைபடிவ வாலில்லாக் குரங்குகள்","unit":"unit5"},{"term":"Australopithecines","definition":"Australopithecines were diverse African hominins combining habitual bipedalism with relatively small brains and varied locomotor adaptations.","ta":"ஆஸ்ட்ரலோபிதிசின்கள்","unit":"unit5"},{"term":"Early Homo","definition":"Early Homo includes early members of the genus Homo associated with changes in body proportions, brain size and technology, although species boundaries and fossil assignments remain debated.","ta":"ஆரம்பகால Homo","unit":"unit5"},{"term":"Homo erectus","definition":"Homo erectus sensu lato had a more human-like body plan, expanded geographic range and substantial encephalisation relative to earlier hominins.","ta":"Homo erectus","unit":"unit5"},{"term":"Archaic Homo","definition":"The informal term archaic Homo is used for diverse Middle Pleistocene human populations showing mosaics of ancestral and derived features. Their relationships to Neanderthals, Denisovan-related groups and Homo sapiens are complex, and taxonomic labels remain debated; they should not be treated as one uniform stage in a linear human sequence.","ta":"பழையகால Homo","unit":"unit5"},{"term":"Neanderthals","definition":"Neanderthals were a Eurasian human lineage adapted to Pleistocene environments. Genomic evidence shows interbreeding with ancestors of many present-day non-African populations.","ta":"நியாண்டர்தால்கள்","unit":"unit5"},{"term":"Denisovans","definition":"Denisovans are an archaic human lineage identified largely through ancient DNA and limited fossil remains. Their ancestry contributed genetically to some present-day populations, especially in Oceania and parts of Asia.","ta":"டெனிசோவன்கள்","unit":"unit5"},{"term":"Homo sapiens","definition":"Homo sapiens evolved in Africa and later dispersed widely, interacting and interbreeding with some archaic human populations. Modern human origins are best understood as a branching, reticulate population history.","ta":"Homo sapiens","unit":"unit5"},{"term":"Human dispersal","definition":"Human dispersal involved multiple movements within and out of Africa, followed by population expansions, founder effects, admixture and local adaptation.","ta":"மனித பரவல்","unit":"unit5"},{"term":"Molecular evidence for human evolution","definition":"Genomic variation, ancient DNA, mitochondrial genomes and Y-chromosome lineages provide complementary evidence about population history, divergence and admixture.","ta":"மனித பரிணாமத்திற்கான மூலக்கூறு ஆதாரங்கள்","unit":"unit5"},{"term":"Mitochondrial DNA evidence","definition":"Mitochondrial DNA is maternally inherited in humans and has been widely used to study maternal lineages and population history. It represents one locus and therefore does not capture the entire species history.","ta":"மைட்டோகாண்ட்ரியல் DNA ஆதாரம்","unit":"unit5"},{"term":"Y-chromosome evidence","definition":"The non-recombining region of the Y chromosome traces paternal lineages and can complement autosomal and mitochondrial data in studies of male-mediated population history.","ta":"Y-குரோமோசோம் ஆதாரம்","unit":"unit5"},{"term":"Ancient DNA","definition":"Ancient DNA sequencing retrieves genetic information from archaeological and palaeontological remains. It has transformed reconstruction of human evolution, admixture and population replacement.","ta":"பண்டைய DNA","unit":"unit5"},{"term":"Human evolutionary phylogeny","definition":"Human evolutionary phylogeny is a branching network of fossil and genetic lineages. Some relationships remain uncertain, and introgression means population history can include reticulation as well as splitting.","ta":"மனித பரிணாம வம்சவழியியல்","unit":"unit5"},{"term":"Allele","definition":"An alternative sequence form at a genetic locus.","ta":"அலீல்","unit":"all"},{"term":"Locus","definition":"A defined position on a chromosome or genomic sequence.","ta":"மரபணு இடம் (locus)","unit":"all"},{"term":"Genotype","definition":"The genetic constitution of an organism or the allelic state at specified loci.","ta":"மரபணுவகை (genotype)","unit":"all"},{"term":"Phenotype","definition":"Observable or measurable characteristics arising from genotype, environment and their interaction.","ta":"தோற்றவகை (phenotype)","unit":"all"},{"term":"Homozygous","definition":"Having identical alleles at a diploid locus.","ta":"ஒத்த அலீல் நிலை (homozygous)","unit":"all"},{"term":"Heterozygous","definition":"Having different alleles at a diploid locus.","ta":"வேறுபட்ட அலீல் நிலை (heterozygous)","unit":"all"},{"term":"Dominance","definition":"An intralocus relationship in which the heterozygote resembles one homozygote for a specified phenotype.","ta":"ஆதிக்கம்","unit":"all"},{"term":"Centimorgan","definition":"A genetic map unit corresponding approximately to 1% recombination for short intervals.","ta":"சென்டிமார்கன் (cM)","unit":"all"},{"term":"Chiasma","definition":"A cytologically visible connection between homologous chromosomes associated with crossing over.","ta":"கையாஸ்மா — குறுக்குப் பரிமாற்றத் தொடர்புப்புள்ளி","unit":"all"},{"term":"Haplotype","definition":"A combination of alleles or variants inherited together on the same chromosomal segment.","ta":"ஹாப்லோடைப் — இணைந்து பரவும் allele/marker அமைவு","unit":"all"},{"term":"Nondisjunction","definition":"Failure of homologous chromosomes or sister chromatids to segregate normally.","ta":"பிரிவின்மை (nondisjunction)","unit":"all"},{"term":"Mosaicism","definition":"Presence of two or more genetically distinct cell populations derived from one zygote.","ta":"மோசெய்சிசம் — ஒரே உடலில் வேறுபட்ட செல்மரபியல் வரிசைகள்","unit":"all"},{"term":"Monophyletic group","definition":"An ancestor and all of its descendants.","ta":"ஒற்றைமுன்னோர் முழுக் கிளைக்குழு (monophyletic group)","unit":"all"},{"term":"Homology","definition":"Similarity due to shared ancestry.","ta":"ஒரே பரிணாமத் தோற்ற ஒற்றுமை (homology)","unit":"all"},{"term":"Analogy","definition":"Similarity of function or form not inherited from the same ancestral trait state.","ta":"செயற்பாட்டு ஒற்றுமை; வேறு பரிணாமத் தோற்றம் (analogy)","unit":"all"},{"term":"Synapomorphy","definition":"A shared derived character supporting a clade.","ta":"பகிரப்பட்ட பெறப்பட்ட பண்பு (synapomorphy)","unit":"all"},{"term":"Fitness","definition":"Relative contribution of an individual or genotype to future generations.","ta":"பரிணாமத் தகுதி — சார்பு இனப்பெருக்க வெற்றி","unit":"all"},{"term":"Selection coefficient","definition":"A measure of relative reduction in fitness compared with a reference genotype.","ta":"தேர்வு குணகம் (selection coefficient)","unit":"all"},{"term":"Effective population size","definition":"The size of an idealised population experiencing the same strength of genetic drift as the population studied.","ta":"செயற்பாட்டு மக்கள்தொகை அளவு (Nₑ)","unit":"all"},{"term":"Heterozygosity","definition":"The proportion of individuals heterozygous at a locus or a related measure of genetic diversity.","ta":"வேறுபட்ட அலீல் தன்மை (heterozygosity)","unit":"all"},{"term":"Fixation","definition":"State in which one allele reaches frequency 1 at a locus in a population.","ta":"ஒரு allele frequency 1.0 ஆக நிலைபெறுதல் (fixation)","unit":"all"},{"term":"Introgression","definition":"Incorporation of genetic material from one population or species into another through hybridisation and backcrossing.","ta":"இன/lineage கலப்பின் மூலம் மரபணு உட்புகுத்தல் (introgression)","unit":"all"},{"term":"Coalescent","definition":"A retrospective population-genetic framework tracing gene copies back to common ancestors.","ta":"பொதுமுன்னோர் இணைவு மாதிரி (coalescent)","unit":"all"},{"term":"Bootstrap support","definition":"A resampling-based measure used to evaluate stability of inferred phylogenetic groupings.","ta":"மறுமாதிரி ஆதரவு (bootstrap support)","unit":"all"},{"term":"Outgroup","definition":"A lineage outside the focal ingroup used to help root a phylogeny and polarise character changes.","ta":"வெளிக்குழு (outgroup)","unit":"all"}]</script>
<script type="application/json" id="data-mastery">{"comparisons":[{"unit":"unit1","title":"Complete dominance vs incomplete dominance vs codominance","headers":["Feature","Complete dominance","Incomplete dominance","Codominance"],"rows":[["Heterozygote phenotype","Same as one homozygote","Intermediate between homozygotes","Both allele products evident"],["Typical F2 phenotype ratio","3:1","1:2:1","1:2:1"],["Genotype ratio","1:2:1","1:2:1","1:2:1"],["Key point","Dominance changes phenotype grouping","Not blending inheritance; alleles remain discrete","Simultaneous expression does not mean allele fusion"]]},{"unit":"unit1","title":"Penetrance vs expressivity","headers":["Feature","Penetrance","Expressivity"],"rows":[["Question asked","Is the phenotype expressed?","To what degree is it expressed?"],["Typical measure","Proportion/percentage of genotype carriers showing phenotype","Range or severity among expressing individuals"],["Consequence","Can make a dominant trait appear to skip individuals","Produces variable phenotype among same-genotype individuals"]]},{"unit":"unit1","title":"Linkage map vs physical map","headers":["Feature","Linkage map","Physical map"],"rows":[["Unit","centimorgan (cM)","base pairs"],["Basis","meiotic recombination","DNA/chromosome coordinates"],["Additivity","Approximate, model-dependent","Direct coordinate distance"],["Resolution","Depends on informative meioses/recombination","Can reach sequence-level resolution"]]},{"unit":"unit2","title":"Euploidy vs aneuploidy","headers":["Feature","Euploidy","Aneuploidy"],"rows":[["Definition","Change in complete chromosome sets","Gain or loss of individual chromosomes"],["Examples","3n, 4n","2n+1, 2n−1"],["Common mechanism","Whole-set segregation/fertilisation changes","Nondisjunction or chromosome loss"]]},{"unit":"unit2","title":"Deletion vs duplication vs inversion vs translocation","headers":["Rearrangement","What changes","Dosage effect","Key meiotic issue"],"rows":[["Deletion","Segment lost","Usually reduced dosage","Pairing loop/deficiency"],["Duplication","Segment repeated","Increased dosage","Misalignment and unequal exchange"],["Inversion","Segment orientation reversed","Usually balanced","Inversion loop; recombinant imbalance may occur"],["Translocation","Segment moved/exchanged between chromosomes","May be balanced","Complex segregation; unbalanced gametes possible"]]},{"unit":"unit2","title":"Amniocentesis vs chorionic villus sampling","headers":["Feature","Amniocentesis","CVS"],"rows":[["Sample","Amniotic fluid containing fetal cells","Placental chorionic villi"],["Typical timing","Usually later than CVS","Usually earlier than amniocentesis"],["Use","Diagnostic genetic/cytogenetic testing","Diagnostic genetic/cytogenetic testing"],["Important limitation","Procedure-related risks and test-specific limits","Placental mosaicism can complicate interpretation"]]},{"unit":"unit2","title":"Sex-linked vs sex-limited vs sex-influenced","headers":["Category","Basis","Expression"],"rows":[["Sex-linked","Gene located on sex chromosome","Transmission depends on chromosome inheritance"],["Sex-limited","Gene may be autosomal or sex-linked","Phenotype expressed only in one sex"],["Sex-influenced","Usually autosomal with sex-dependent expression","Penetrance/dominance differs between sexes"]]},{"unit":"unit3","title":"Natural selection vs genetic drift","headers":["Feature","Natural selection","Genetic drift"],"rows":[["Relation to fitness","Biased by fitness differences","Random with respect to fitness"],["Strength","Depends on selection coefficient and context","Stronger in small effective populations"],["Outcome","Can produce adaptation","Can fix, lose or fluctuate alleles stochastically"],["Predictability","Direction may be modelled if fitnesses known","Individual trajectories unpredictable"]]},{"unit":"unit3","title":"Founder effect vs bottleneck","headers":["Feature","Founder effect","Bottleneck"],"rows":[["Demography","New population founded by few individuals","Existing population sharply reduced"],["Sampling","Founders are a sample of source gene pool","Survivors are a sample of original population"],["Consequence","Allele frequencies may differ from source","Diversity and heterozygosity may decline"]]},{"unit":"unit3","title":"Directional vs stabilising vs disruptive selection","headers":["Pattern","Favoured phenotypes","Distributional effect"],"rows":[["Directional","One extreme","Mean shifts"],["Stabilising","Intermediate","Variance tends to narrow"],["Disruptive","Both extremes","Intermediate reduced; variance/bimodality may increase"]]},{"unit":"unit4","title":"Homology vs similarity","headers":["Feature","Homology","Similarity"],"rows":[["Meaning","Shared ancestry hypothesis","Measured resemblance"],["Can be percentage?","No","Yes, sequence identity/similarity can be quantified"],["Phylogenetic use","Homologous characters are compared","Similarity alone may reflect convergence"]]},{"unit":"unit4","title":"Rooted vs unrooted phylogenetic trees","headers":["Feature","Rooted tree","Unrooted tree"],"rows":[["Ancestral direction","Represented from root","Not specified"],["Common ancestor interpretation","Root provides direction of descent","Shows relationships without temporal direction"],["How rooted","Outgroup or clock/model assumptions","Not applicable until a rooting criterion is added"]]},{"unit":"unit4","title":"Distance vs character-based phylogenetic methods","headers":["Feature","Distance methods","Character-based methods"],"rows":[["Input","Pairwise distance matrix","Site/character states"],["Information retained","Condensed into distances","Individual character patterns retained"],["Examples","UPGMA, neighbour joining","Maximum parsimony, maximum likelihood, Bayesian inference"]]},{"unit":"unit4","title":"Biological vs phylogenetic species concepts","headers":["Feature","Biological species concept","Phylogenetic species concept"],"rows":[["Emphasis","Reproductive isolation","Smallest diagnosable/monophyletic lineage depending formulation"],["Best suited","Sexually reproducing contemporaneous populations","Broad comparative/phylogenetic applications"],["Limitation","Difficult for fossils/asexuals/allopatric populations","Can split lineages depending criteria and sampling"]]},{"unit":"unit4","title":"Allopatric vs sympatric speciation","headers":["Feature","Allopatric","Sympatric"],"rows":[["Geography","Spatial separation reduces gene flow","Divergence occurs without geographic isolation"],["Common drivers","Vicariance, dispersal, drift, divergent selection","Disruptive selection, host shift, assortative mating, polyploidy in some taxa"],["Central challenge","Accumulation of reproductive isolation","Reproductive isolation must evolve despite potential gene flow"]]},{"unit":"unit5","title":"Microevolution vs macroevolution","headers":["Feature","Microevolution","Macroevolution"],"rows":[["Scale","Within populations/species","At and above species level"],["Processes emphasised","Allele-frequency change","Speciation, extinction, diversification, major transitions"],["Evidence","Population genetic data","Fossils, phylogenies, comparative datasets plus population processes"]]},{"unit":"unit5","title":"Phyletic gradualism vs punctuated equilibrium","headers":["Feature","Phyletic gradualism","Punctuated equilibrium"],"rows":[["Pattern","Change accumulates relatively continuously","Long stasis with shorter intervals of change associated with speciation"],["Fossil expectation","More continuous directional sequences","Stasis common within species"],["Misconception to avoid","Not necessarily constant rate","Does not mean instantaneous evolution or macromutation"]]},{"unit":"unit5","title":"Fossil vs molecular evidence in human evolution","headers":["Feature","Fossil/anatomical evidence","Molecular/genomic evidence"],"rows":[["Direct information","Morphology, age, geography, behaviour-associated remains","Genetic relationships, divergence, population history, admixture"],["Strength","Documents extinct anatomy and chronology","Quantifies genealogical relationships and introgression"],["Limitation","Incomplete preservation and sampling","DNA preservation limits; model dependence; genes do not fossilise morphology"]]}],"workedProblems":[{"unit":"unit1","title":"Monohybrid probability","problem":"In Aa × Aa, what is the probability of an aa offspring?","steps":["Each parent produces A and a gametes with probability 1/2.","P(a from first) × P(a from second) = 1/2 × 1/2."],"answer":"1/4 = 25%."},{"unit":"unit1","title":"Recessive lethal modifies 3:1","problem":"Aa × Aa is performed, but aa is embryonic lethal. What genotype ratio is expected among surviving offspring?","steps":["Before lethality is expressed, Aa × Aa gives the zygotic genotype expectation 1 AA : 2 Aa : 1 aa.","The aa class is embryonic lethal and is absent from the scored surviving offspring.","Renormalising the viable genotypes gives 1 AA : 2 Aa.","Convert genotype classes to phenotype classes only after specifying the dominance/phenotype relationship; a 2:1 genotype ratio is not automatically a 2:1 phenotype ratio."],"answer":"Among surviving offspring the genotype ratio is 1 AA : 2 Aa. If AA and Aa share the same visible phenotype under complete dominance, the survivors form one phenotype class rather than a 2:1 phenotypic ratio. A 2:1 phenotype ratio requires the two viable genotypes to be phenotypically distinguishable, as in classic cases where the heterozygote has a distinct visible phenotype and one homozygous class is lethal."},{"unit":"unit1","title":"Complementary gene interaction","problem":"A dihybrid F2 follows a 9:7 complementary-gene ratio. Out of 160 offspring, how many are expected in each phenotype class?","steps":["The ratio contains 16 total parts.","160/16 = 10 offspring per ratio part.","9 × 10 = 90; 7 × 10 = 70."],"answer":"90 in the phenotype requiring both dominant alleles and 70 in the alternative phenotype."},{"unit":"unit1","title":"Two-point recombination mapping","problem":"A testcross yields 90 recombinant offspring among 500 total. Estimate the genetic distance.","steps":["RF = recombinant / total × 100.","RF = 90/500 × 100 = 18%.","For a short interval, 1% recombination ≈ 1 cM."],"answer":"Approximately 18 cM."},{"unit":"unit1","title":"Three-point mapping","problem":"Gamete classes are ABC 355, abc 355, ABc 90, abC 90, Abc 50, aBC 50, AbC 5, aBc 5. Determine gene order, map distances and interference.","steps":["ABC and abc are parental (largest classes); AbC and aBc are double crossovers (smallest).","Comparing ABC with AbC changes only B, so B is the middle gene: A–B–C.","A–B recombinants = Abc + aBC + both DCO = 50+50+5+5 = 110; distance = 11 cM.","B–C recombinants = ABc + abC + both DCO = 90+90+5+5 = 190; distance = 19 cM.","Expected DCO = 0.11 × 0.19 × 1000 = 20.9; observed DCO = 10.","Coefficient of coincidence = 10/20.9 ≈ 0.478; interference ≈ 0.522."],"answer":"Gene order A–B–C; A–B ≈ 11 cM; B–C ≈ 19 cM; interference ≈ 0.52."},{"unit":"unit2","title":"Barr body count","problem":"How many Barr bodies are expected in a typical non-mosaic 47,XXY somatic cell?","steps":["Barr body number is usually the number of X chromosomes minus one.","There are two X chromosomes."],"answer":"One Barr body."},{"unit":"unit2","title":"Autosomal recessive recurrence risk","problem":"Two unaffected heterozygous carriers (Aa × Aa) have a child. What are the probabilities of affected, carrier and non-carrier offspring?","steps":["Punnett ratio = 1 AA : 2 Aa : 1 aa.","aa is affected, Aa are unaffected carriers, AA are unaffected non-carriers."],"answer":"Affected 25%; carrier 50%; unaffected non-carrier 25%."},{"unit":"unit2","title":"Autosomal dominant recurrence risk","problem":"An affected heterozygous parent (Aa) and an unaffected parent (aa) have children. Assuming full penetrance, what is the affected risk per pregnancy?","steps":["Affected parent produces A or a gametes equally.","Unaffected parent produces only a.","Half the offspring are Aa and half aa."],"answer":"50% affected per pregnancy; each pregnancy is an independent event."},{"unit":"unit2","title":"Interpreting 47,+21","problem":"A karyotype has 47 chromosomes with an additional chromosome 21. Classify the abnormality.","steps":["The diploid set has gained one individual chromosome rather than an entire set.","2n+1 is a trisomy and therefore aneuploidy."],"answer":"Trisomy 21, a numerical chromosomal abnormality (aneuploidy) associated with Down syndrome."},{"unit":"unit2","title":"Balanced translocation counselling logic","problem":"A phenotypically normal person carries a balanced reciprocal translocation. Why can reproductive risk still be increased?","steps":["Balanced carriers may have no net loss/gain of major chromosomal material.","During meiosis, the rearranged chromosomes form a multivalent.","Alternative segregation can be balanced, whereas adjacent segregation can generate duplications and deletions in gametes."],"answer":"Normal phenotype does not eliminate reproductive risk because meiotic segregation can produce chromosomally unbalanced conceptions."},{"unit":"unit3","title":"Hardy–Weinberg from recessive phenotype","problem":"A recessive phenotype occurs in 9% of a population. Assuming Hardy–Weinberg equilibrium, estimate q, p and heterozygote frequency.","steps":["q² = 0.09, so q = 0.30.","p = 1 − q = 0.70.","2pq = 2 × 0.70 × 0.30 = 0.42."],"answer":"q = 0.30, p = 0.70, heterozygotes = 0.42 (42%)."},{"unit":"unit3","title":"Allele frequency from genotype counts","problem":"Among 100 diploid individuals, AA=40, Aa=50 and aa=10. Calculate p(A) and q(a).","steps":["A copies = 2×40 + 50 = 130.","Total allele copies = 2×100 = 200.","p = 130/200 = 0.65; q = 1−p = 0.35."],"answer":"p(A)=0.65 and q(a)=0.35."},{"unit":"unit3","title":"Gene flow calculation","problem":"A resident population has p=0.80. Migrants with p=0.20 replace 10% of the breeding population. Estimate p after one migration step.","steps":["Use p′ = (1−m)p + m p_m.","p′ = 0.90×0.80 + 0.10×0.20.","p′ = 0.72 + 0.02."],"answer":"p′ = 0.74."},{"unit":"unit3","title":"Strength of genetic drift","problem":"For p=0.5 and effective population size Nₑ=50, estimate Var(Δp) from one generation of Wright–Fisher sampling.","steps":["Var(Δp) ≈ p(1−p)/(2Nₑ).","= 0.5×0.5/(100).","= 0.25/100."],"answer":"0.0025. A larger Nₑ would reduce this sampling variance."},{"unit":"unit3","title":"Selection changes genotype proportions","problem":"Before selection, genotype frequencies are AA=.49, Aa=.42, aa=.09. Relative fitnesses are 1, 1 and 0.5. What is the post-selection frequency of aa among survivors?","steps":["Weighted frequencies: .49, .42, .045.","Mean fitness = .49+.42+.045 = .955.","Normalise aa: .045/.955."],"answer":"Approximately 0.0471 (4.71%) among survivors."},{"unit":"unit4","title":"Uncorrected molecular divergence","problem":"Two aligned sequences differ at 12 of 200 compared nucleotide positions. Calculate p-distance.","steps":["p = differences / compared sites.","p = 12/200 = 0.06."],"answer":"p-distance = 0.06 substitutions per compared site, or 6% observed difference."},{"unit":"unit4","title":"Simple molecular clock","problem":"Pairwise divergence d=0.04 and the substitution rate per lineage is r=0.002 substitutions/site/million years. Estimate divergence time.","steps":["For two lineages use t ≈ d/(2r).","t = 0.04/(0.004)."],"answer":"Approximately 10 million years, subject to model and calibration assumptions."},{"unit":"unit4","title":"Jukes–Cantor correction","problem":"Observed nucleotide p-distance is 0.10. Estimate Jukes–Cantor distance d = −3/4 ln(1−4p/3).","steps":["1−4p/3 = 1−0.13333 = 0.86667.","ln(0.86667) ≈ −0.1431.","−3/4 × −0.1431 ≈ 0.1073."],"answer":"d ≈ 0.107 substitutions/site, slightly larger than p because multiple hits are corrected."},{"unit":"unit4","title":"Tree topology interpretation","problem":"In the rooted topology ((A,B),C),D, which taxa are sister taxa and which taxon is the outgroup if D is used to root the tree?","steps":["A and B share the most recent internal node with each other.","C joins the A+B clade at an older node.","D branches outside the ingroup by definition of the chosen rooting."],"answer":"A and B are sister taxa; D is the outgroup."},{"unit":"unit4","title":"Speciation with gene flow","problem":"Two host-associated insect populations occupy the same region but mate mainly on different host plants. What evolutionary process could reduce gene flow without geographic separation?","steps":["Different host use creates ecological divergence.","Assortative mating by host association reduces interbreeding.","Divergent selection plus assortative mating can strengthen reproductive isolation."],"answer":"A sympatric or parapatric speciation process driven by ecological divergence and assortative mating is plausible."},{"unit":"unit5","title":"Ordering evolutionary events","problem":"Place these broadly from older to younger: first tetrapods, non-avian dinosaur extinction, earliest hominins, Homo sapiens.","steps":["Tetrapods appear in the Devonian.","Non-avian dinosaurs disappear at the end-Cretaceous boundary.","Hominins appear in the late Miocene/early Pliocene record.","Homo sapiens is much later in the Pleistocene."],"answer":"First tetrapods → non-avian dinosaur extinction → earliest hominins → Homo sapiens."},{"unit":"unit5","title":"Rate calculation","problem":"A lineage shows 30 arbitrary units of morphological change over 6 million years. What is the average rate?","steps":["Rate = amount of change / time.","30/6 = 5."],"answer":"5 morphological units per million years; this average does not imply a constant instantaneous rate."},{"unit":"unit5","title":"Interpreting punctuated pattern","problem":"A fossil lineage shows little net morphological change for several million years, followed by a geologically shorter interval associated with lineage splitting. Which model does this pattern resemble?","steps":["Long intervals of relative stasis are present.","Change is concentrated around a shorter speciation-associated interval."],"answer":"It resembles punctuated equilibrium, while not excluding ordinary genetic mechanisms during the interval of change."},{"unit":"unit5","title":"mtDNA versus total ancestry","problem":"Why can an mtDNA genealogy not by itself represent the complete ancestry of a human population?","steps":["mtDNA is one maternally inherited genetic locus.","Autosomal chromosomes contain many independently recombining genealogies.","Population history can include sex-biased migration, admixture and lineage sorting."],"answer":"mtDNA traces one maternal lineage system; total population ancestry requires genome-wide and other evidence."},{"unit":"unit5","title":"Ancient DNA and admixture","problem":"A present-day genome contains segments closely related to an archaic human genome. What additional pattern would support ancient introgression rather than simple shared ancestral variation?","steps":["Introgressed segments are expected to form blocks with characteristic lengths and derived-allele sharing.","Genome-wide tests compare excess allele sharing among alternative population trees.","A consistent asymmetric signal across many loci can reject a strictly bifurcating history."],"answer":"Excess, asymmetric archaic allele sharing and introgressed haplotype blocks support admixture; rigorous inference requires explicit demographic tests."}],"misconceptions":[{"unit":"unit1","claim":"A dominant allele is always common in a population.","correction":"Dominance describes the phenotype of a heterozygote; population frequency is a separate property.","why":"Rare dominant disease alleles and common recessive alleles demonstrate the distinction."},{"unit":"unit1","claim":"Incomplete dominance is blending inheritance.","correction":"Alleles remain discrete and segregate normally; only the heterozygote phenotype is intermediate.","why":"The parental phenotypes reappear in the F2 because allele identity is preserved."},{"unit":"unit1","claim":"Linked genes never recombine.","correction":"Linked loci can recombine through crossing over unless recombination is effectively absent in the interval.","why":"Incomplete linkage is detected precisely through recombinant progeny."},{"unit":"unit1","claim":"One centimorgan always equals a fixed number of base pairs.","correction":"cM measures recombination, whose rate varies across chromosomes, sexes and genomic regions.","why":"Hotspots and cold regions produce different physical distances per cM."},{"unit":"unit1","claim":"Heritability tells what proportion of an individual trait is genetic.","correction":"Heritability partitions population variance under specified environmental conditions.","why":"It is not an individual-level causal percentage and can change across populations/environments."},{"unit":"unit2","claim":"All chromosomal rearrangements produce an abnormal phenotype.","correction":"Balanced rearrangements can be phenotypically silent, although reproductive consequences may remain.","why":"No large net dosage change may be present in the carrier."},{"unit":"unit2","claim":"A Barr body is an inactive Y chromosome.","correction":"A Barr body is condensed inactive X chromatin.","why":"X inactivation produces facultative heterochromatin in cells with more than one X."},{"unit":"unit2","claim":"Pedigree analysis gives certainty about genotype.","correction":"Pedigrees support probabilistic inheritance hypotheses and may be ambiguous.","why":"Small family size, penetrance, phenocopies and new mutations can mimic patterns."},{"unit":"unit2","claim":"Prenatal diagnosis and prenatal screening are the same.","correction":"Screening estimates risk; diagnostic testing directly investigates a specific genetic/chromosomal condition.","why":"The clinical implications and certainty differ."},{"unit":"unit2","claim":"Genetic counselling should tell families which reproductive choice to make.","correction":"Modern genetic counselling is non-directive and supports informed autonomous decisions.","why":"Risk communication is separated from coercive decision-making."},{"unit":"unit3","claim":"Individual organisms evolve because they adapt during life.","correction":"Evolution is change in inherited population properties across generations.","why":"Acclimatisation within an individual is not equivalent to allele-frequency evolution."},{"unit":"unit3","claim":"Natural selection creates mutations that organisms need.","correction":"Mutations arise without foresight; selection changes their frequencies according to fitness effects.","why":"Need does not direct mutation toward adaptive outcomes."},{"unit":"unit3","claim":"Evolution is completely random.","correction":"Mutation and drift contain stochastic components, whereas natural selection is non-random with respect to differential reproductive success.","why":"Evolutionary outcomes combine stochastic and deterministic processes."},{"unit":"unit3","claim":"Hardy–Weinberg equilibrium means evolution never occurs.","correction":"It is a null model for genotype frequencies under specified assumptions.","why":"It is used to identify and reason about departures caused by population processes."},{"unit":"unit3","claim":"Genetic drift only affects harmful alleles.","correction":"Drift changes allele frequencies irrespective of fitness, especially when selection is weak.","why":"Neutral, beneficial and deleterious alleles can all be influenced by sampling."},{"unit":"unit4","claim":"The taxa drawn next to one another on a tree are necessarily closest relatives.","correction":"Relationships depend on shared nodes, not visual tip spacing.","why":"Branches can be rotated around nodes without changing topology."},{"unit":"unit4","claim":"A longer horizontal branch always means a more advanced organism.","correction":"Branch length may represent time or amount of change, depending on the tree; evolution has no universal advanced direction.","why":"Tree topology records ancestry, not a ladder of progress."},{"unit":"unit4","claim":"High sequence similarity proves homology.","correction":"Homology is an inference of common ancestry; similarity is evidence that can support it.","why":"Convergence, repeats and chance similarity can complicate interpretation."},{"unit":"unit4","claim":"Molecular clocks tick at exactly the same rate in all genes and lineages.","correction":"Rates vary and modern dating often uses relaxed-clock models.","why":"Mutation, selection, generation time and genomic context affect substitution rates."},{"unit":"unit4","claim":"Speciation always requires complete geographic isolation.","correction":"Geographic isolation is common but not universal; reproductive isolation can evolve with some gene flow.","why":"Sympatric and parapatric divergence are empirically documented."},{"unit":"unit5","claim":"Humans evolved from living chimpanzees or monkeys.","correction":"Humans and living apes share extinct common ancestors; each lineage has evolved independently since divergence.","why":"Phylogeny is branching rather than ancestor-to-modern-species replacement."},{"unit":"unit5","claim":"Dryopithecus can be drawn as a proven direct ancestor of Homo sapiens.","correction":"Dryopithecus is a Miocene fossil ape important to hominoid evolution, but direct ancestry is not established.","why":"Fossil phylogenetic placement is uncertain and branching alternatives exist."},{"unit":"unit5","claim":"Punctuated equilibrium means species appear instantaneously.","correction":"The model concerns geological patterns of stasis and comparatively concentrated change.","why":"Short on geological scales can still encompass many generations."},{"unit":"unit5","claim":"Mitochondrial Eve was the only woman alive at her time.","correction":"She represents the most recent common ancestor of present-day mtDNA lineages, not the sole woman or sole ancestor.","why":"Other contemporaries can contribute auto
