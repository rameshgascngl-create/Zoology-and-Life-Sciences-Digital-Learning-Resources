somal ancestry even if their mtDNA lineages ended."},{"unit":"unit5","claim":"Human populations form discrete biological races with separate evolutionary origins.","correction":"Human genetic variation is largely shared and geographically structured with extensive gene flow and admixture.","why":"Population history is networked and clinal rather than a set of deeply isolated natural categories."}],"formulas":[{"unit":"unit1","title":"Recombination frequency","formula":"RF (%) = (recombinant progeny / total progeny) × 100","variables":"RF estimates recombination between loci; for short intervals RF% approximates cM.","example":"90 recombinants / 500 total = 18% ≈ 18 cM."},{"unit":"unit1","title":"Coefficient of coincidence","formula":"CoC = observed double crossovers / expected double crossovers","variables":"Expected DCO ≈ r₁r₂N when interval crossovers are independent.","example":"Observed 10, expected 20.9 → CoC ≈ 0.478."},{"unit":"unit1","title":"Interference","formula":"I = 1 − CoC","variables":"Positive interference means fewer DCOs than expected.","example":"CoC 0.478 → I ≈ 0.522."},{"unit":"unit1","title":"Broad-sense heritability","formula":"H² = V_G / V_P","variables":"V_G total genetic variance; V_P phenotypic variance.","example":"V_G=40, V_P=100 → H²=0.40."},{"unit":"unit1","title":"Narrow-sense heritability","formula":"h² = V_A / V_P","variables":"V_A additive genetic variance; predicts response to selection more directly than H².","example":"V_A=25, V_P=100 → h²=0.25."},{"unit":"unit3","title":"Hardy–Weinberg allele relation","formula":"p + q = 1","variables":"p and q are frequencies of two alleles at a locus.","example":"If q=0.30, p=0.70."},{"unit":"unit3","title":"Hardy–Weinberg genotype relation","formula":"p² + 2pq + q² = 1","variables":"Expected frequencies of AA, Aa and aa under the model.","example":"p=.7, q=.3 → .49 + .42 + .09 = 1."},{"unit":"unit3","title":"Allele frequency from genotype counts","formula":"p(A) = (2N_AA + N_Aa) / (2N)","variables":"N is diploid sample size.","example":"AA=40, Aa=50, N=100 → p=.65."},{"unit":"unit3","title":"One-step migration","formula":"p′ = (1−m)p + m p_m","variables":"m is migrant fraction; p_m is migrant allele frequency.","example":"p=.8, p_m=.2, m=.1 → p′=.74."},{"unit":"unit3","title":"Drift variance approximation","formula":"Var(Δp) ≈ p(1−p)/(2Nₑ)","variables":"Nₑ is effective diploid population size in a Wright–Fisher approximation.","example":"p=.5, Nₑ=50 → variance=.0025."},{"unit":"unit4","title":"p-distance","formula":"p = differing aligned sites / compared aligned sites","variables":"Uncorrected observed sequence difference.","example":"12/200 = .06."},{"unit":"unit4","title":"Simple two-lineage molecular clock","formula":"t ≈ d/(2r)","variables":"d pairwise divergence; r substitutions/site/time per lineage.","example":"d=.04, r=.002/Myr → t≈10 Myr."},{"unit":"unit4","title":"Jukes–Cantor correction","formula":"d = −(3/4) ln(1 − 4p/3)","variables":"Corrects observed nucleotide p-distance under a simple equal-rate/equal-frequency substitution model.","example":"p=.10 → d≈.107 substitutions/site."}]}</script>
<script type="application/json" id="data-pedigree">[{"pattern":"Autosomal dominant","case":"Affected individuals appear in successive generations; both sexes are affected; father-to-son transmission occurs; an affected heterozygote with an unaffected partner has about half affected offspring.","clue":"Vertical transmission plus father-to-son inheritance argues against X linkage."},{"pattern":"Autosomal recessive","case":"Two unaffected parents have affected sons and daughters; the trait may skip generations and is more frequent among relatives sharing ancestry.","clue":"Unaffected parents producing affected children is classic for a recessive model."},{"pattern":"X-linked recessive","case":"Affected males predominate; there is no father-to-son transmission; daughters of affected males receive the mutant X and may be carriers if the mother supplies a normal allele.","clue":"Absence of male-to-male transmission is a key clue."},{"pattern":"X-linked dominant","case":"An affected father transmits the trait to all daughters and no sons when the mother is unaffected; an affected heterozygous mother can transmit to either sex.","clue":"All daughters of an affected father inherit his X chromosome."},{"pattern":"Y-linked","case":"Only males are affected, and an affected father transmits the trait to all sons in a fully penetrant model.","clue":"Strict father-to-son transmission follows the Y chromosome."},{"pattern":"Mitochondrial","case":"An affected mother can transmit the trait to sons and daughters, whereas an affected father does not transmit it through mitochondria.","clue":"Maternal transmission reflects cytoplasmic mitochondrial inheritance."}]</script>

ctice","flashcards":"Flashcards","glossary":"Glossary","progress":"Progress","bookmarks":"Bookmarks","notes":"Notes","references":"References","help":"Help","search":"Search Genetics & Evolution…","continue":"Continue learning","open":"Open","completed":"Completed","markComplete":"Mark complete","lesson":"Lesson","overview":"Overview","outcomes":"Learning outcomes","core":"Detailed explanation","advanced":"Advanced interpretation","research":"Research connection","misconception":"Misconception check","quick":"Quick check","answer":"Reveal answer","theme":"Theme","language":"Language","interfaceNotice":"English postgraduate content with a Tamil study layer across all 143 lessons. Tamil titles, concept summaries, unit syntheses and glossary support are available; full line-by-line Tamil parity for advanced/research sections and all assessments is not yet claimed.","mastery":"Concept Mastery","teaching":"Presentation mode","revision":"Revision"},"ta":{"home":"முகப்பு","units":"அலகுகள்","learn":"கற்றல்","atlas":"வரைபடத் தொகுப்பு","labs":"ஆய்வகங்கள்","practice":"பயிற்சி","flashcards":"நினைவுக் கார்டுகள்","glossary":"கலைச்சொற்கள்","progress":"முன்னேற்றம்","bookmarks":"புத்தகக்குறிகள்","notes":"குறிப்புகள்","references":"மேற்கோள்கள்","help":"உதவி","search":"மரபியல் மற்றும் பரிணாமத்தில் தேடுக…","continue":"கற்றலைத் தொடர்க","open":"திற","completed":"முடிக்கப்பட்டது","markComplete":"முடித்ததாக குறி","lesson":"பாடம்","overview":"மேலோட்டம்","outcomes":"கற்றல் விளைவுகள்","core":"மைய விளக்கம்","advanced":"மேம்பட்ட பார்வை","research":"ஆராய்ச்சி பார்வை","misconception":"தவறான புரிதல் சோதனை","quick":"விரைவு சோதனை","answer":"பதிலை காண்க","theme":"தோற்றம்","language":"மொழி","interfaceNotice":"143 பாடங்களிலும் தமிழ் தலைப்புகள், கருத்துச் சுருக்கங்கள், அலகு ஒருங்கிணைப்புகள் மற்றும் கலைச்சொல் ஆதரவு சேர்க்கப்பட்டுள்ளது. ஆனால் advanced/research பகுதிகள் மற்றும் அனைத்து மதிப்பீடுகளுக்கும் முழுமையான வரி-வரி தமிழ் சமநிலை இன்னும் அறிவிக்கப்படவில்லை.","mastery":"திறனாய்வு","teaching":"கற்பித்தல் முறை","revision":"மீள்பார்வை"},"dual":{"home":"Home","units":"Units","learn":"Learn","atlas":"Visual Atlas","labs":"Interactive Studies","practice":"Practice","flashcards":"Flashcards","glossary":"Glossary","progress":"Progress","bookmarks":"Bookmarks","notes":"Notes","references":"References","help":"Help","search":"Search Genetics & Evolution…","continue":"Continue learning","open":"Open","completed":"Completed","markComplete":"Mark complete","lesson":"Lesson","overview":"Overview","outcomes":"Learning outcomes","core":"Detailed explanation","advanced":"Advanced interpretation","research":"Research connection","misconception":"Misconception check","quick":"Quick check","answer":"Reveal answer","theme":"Theme","language":"Language","interfaceNotice":"Dual study mode: English postgraduate detail is shown together with the Tamil lesson study layer. Full line-by-line Tamil parity for advanced/research sections and all assessments is not yet claimed.","mastery":"Concept Mastery","teaching":"Presentation mode","revision":"Revision"}},"unitIntro":{"unit1":"This unit develops the logic of inheritance from Mendelian segregation to gene interactions, linkage, recombination, chromosome mapping and quantitative inheritance. The emphasis is on prediction, mechanism and problem solving.","unit2":"This unit connects chromosome biology with human inheritance, cytogenetic abnormalities, pedigrees, genomic medicine, prenatal diagnostics and the ethical practice of genetic counselling.","unit3":"This unit explains how genetic variation is transformed into evolutionary change at the population level through selection, mutation, recombination, migration and genetic drift, using Hardy–Weinberg equilibrium as the null model.","unit4":"This unit moves from molecules to lineages: sequence evolution, molecular clocks, phylogenetic inference, species concepts, reproductive isolation and mechanisms of speciation.","unit5":"This unit integrates microevolution with macroevolutionary tempo, the geological record and modern human evolutionary biology, emphasising branching phylogeny and molecular evidence."},"masterNotes":{"unit1":{"synthesis":"Inheritance analysis begins with segregation at individual loci, then asks how dominance, viability and interactions alter phenotype classes. Linkage couples loci on chromosomes; recombination supplies the observable events used for genetic mapping. Quantitative genetics extends inheritance to continuously varying traits.","anchors":["Segregation predicts allele transmission; dominance describes phenotype, not allele frequency or molecular strength.","Modified Mendelian ratios usually reflect grouping of underlying genotype classes, not failure of segregation.","Recombination frequency is bounded by 50%; long intervals require mapping functions or additional markers.","In a three-point cross, parental classes are usually most frequent and double-crossovers least frequent.","Heritability describes variance among individuals in a specified population and environment."],"equations":["RF = recombinants / total × 100","Map distance ≈ RF (cM) for short intervals","Coefficient of coincidence = observed DCO / expected DCO","Interference = 1 − coefficient of coincidence","H² = V_G / V_P; h² = V_A / V_P"],"examFocus":["Derive modified F2 ratios from gene interaction models.","Solve two-point and three-point mapping problems.","Distinguish penetrance, expressivity and pleiotropy.","Explain limitations of recombination as a physical-distance measure."]},"unit2":{"synthesis":"Human genetics integrates chromosome structure, cytogenetic abnormalities, pedigree reasoning, genome-scale analysis and ethically responsible counselling. Chromosomal disorders must be interpreted through dosage, breakpoints, mosaicism and reproductive consequences rather than as simple labels.","anchors":["A karyotype is an organised chromosome display; a karyogram is the image arrangement used for analysis.","Barr bodies reflect X-chromosome inactivation; number is usually X chromosomes minus one in somatic cells.","Balanced structural rearrangements can create unbalanced gametes.","Pedigree patterns are probabilistic and can be obscured by penetrance, small family size and de novo mutation.","Prenatal sampling method and genetic laboratory test are distinct decisions."],"equations":["Barr bodies ≈ number of X chromosomes − 1","Autosomal recessive Aa × Aa: affected risk = 1/4","Autosomal dominant Aa × aa: affected risk = 1/2"],"examFocus":["Compare numerical and structural aberrations.","Interpret pedigrees with explicit inheritance criteria.","Differentiate CVS and amniocentesis.","Discuss genetic counselling as non-directive risk communication."]},"unit3":{"synthesis":"Population genetics translates inheritance into evolution by tracking allele frequencies through time. Hardy–Weinberg equilibrium supplies a null expectation; mutation, selection, drift, migration, non-random mating and population structure generate departures from that expectation in different ways.","anchors":["Individuals do not evolve; population allele frequencies change across generations.","Mutation creates new variants but does not direct them toward need.","Selection is fitness-biased; drift is stochastic and strongest at small effective population size.","Gene flow can homogenise populations and also introduce adaptive alleles.","Hardy–Weinberg is a model to test against data, not a claim that natural populations are static."],"equations":["p + q = 1","p² + 2pq + q² = 1","p = (2N_AA + N_Aa)/(2N)","After migration: p′ = (1−m)p + mp_m","Approx. drift variance per generation: Var(Δp) = p(1−p)/(2N_e)"],"examFocus":["Solve Hardy–Weinberg and allele-count problems.","Compare directional, stabilising and disruptive selection.","Explain founder effect versus bottleneck.","Relate effective population size to genetic drift."]},"unit4":{"synthesis":"Molecular evolution infers historical change from homologous sequence data, while phylogenetics reconstructs branching relationships. Alignment, substitution models, tree inference and calibration are linked analytical steps. Speciation connects lineage divergence to reproductive isolation and ecological differentiation.","anchors":["Similarity is measured; homology is a hypothesis of common ancestry.","A molecular clock is calibrated and may vary among lineages.","Tip order on a tree has no meaning independent of topology.","Rotating branches around a node does not change relationships.","Gene trees and species trees can differ because of lineage sorting, introgression or duplication."],"equations":["p-distance = differing aligned sites / compared sites","Simple clock: t ≈ d/(2r)","Jukes–Cantor: d = −3/4 ln(1 − 4p/3)"],"examFocus":["Interpret rooted and unrooted trees.","Explain steps and limitations of multiple sequence alignment.","Compare biological and phylogenetic species concepts.","Analyse allopatric versus sympatric speciation."]},"unit5":{"synthesis":"Large-scale evolution emerges from the interaction of lineage change, speciation, extinction and ecological opportunity across geological time. Human evolution is a branching hominin history reconstructed from fossils, archaeology and genomes, including episodes of admixture among lineages.","anchors":["Microevolution and macroevolution operate at different observational scales but are not disconnected processes.","Punctuated equilibrium predicts stasis plus comparatively rapid change around speciation; it does not imply instantaneous saltation.","Fossil apes such as Dryopithecus provide evolutionary context but should not be asserted as certain direct human ancestors.","Bipedalism evolved before modern human brain size.","mtDNA and Y chromosomes trace single genealogical systems and cannot alone represent total human ancestry."],"equations":["Evolutionary rate = amount of change / elapsed time","Lineage diversification depends jointly on speciation and extinction"],"examFocus":["Compare gradualism and punctuated equilibrium.","Place major events in geological-time context.","Explain derived hominin features relative to other primates.","Integrate fossil and molecular evidence for Homo sapiens origins."]}},"unitIntroTa":{"unit1":"Mendelian probability-யிலிருந்து gene interaction, linkage, recombination, genetic mapping மற்றும் quantitative inheritance வரை இந்த அலகு genetics-ன் அடிப்படை reasoning-ஐ கட்டமைக்கிறது. ஒவ்வொரு ratio-யையும் memorise செய்வதற்குப் பதிலாக meiosis, probability மற்றும் experimental evidence-உடன் இணைத்து கற்க வேண்டும்.","unit2":"chromosome organisation, numerical/structural aberrations, human syndromes, pedigree reasoning, genome resources, prenatal diagnosis மற்றும் counselling ஆகியவற்றை cytogenetic mechanism மற்றும் bioethics-உடன் இணைத்து இந்த அலகு கற்பிக்கிறது.","unit3":"Darwinian reasoning, modern synthesis, variation மற்றும் population-genetic forces ஆகியவற்றை allele-frequency change என்ற ஒருங்கிணைந்த கருத்தில் இந்த அலகு அமைக்கிறது. Hardy–Weinberg equilibrium ஒரு null model; selection, drift மற்றும் gene flow அதிலிருந்து departures-ஐ விளக்குகின்றன.","unit4":"sequence evolution, molecular clock, alignment, phylogenetic inference, species concepts மற்றும் speciation-ஐ ஒரு தொடர்ச்சியான evidence framework ஆக இந்த அலகு இணைக்கிறது. phylogenetic tree-ஐ diagram அல்ல, testable hypothesis ஆக வாசிப்பது முக்கியம்.","unit5":"microevolution-இலிருந்து macroevolution, evolutionary tempo, geological time மற்றும் human evolution வரை பல கால அளவுகளை இந்த அலகு இணைக்கிறது. மனித பரிணாமம் நேர்கோட்டுக் ladder அல்ல; branching மற்றும் admixture கொண்ட history ஆக கற்பிக்கப்படுகிறது."},"masterNotesTa":{"unit1":"Allele segregation → modified Mendelian ratios → gene interaction → linkage/recombination → mapping → polygenic inheritance மற்றும் heritability என்ற reasoning chain-ஐ ஒரே genetic framework ஆகப் பார்க்கவும்.","unit2":"DNA packaging → chromosome structure → aberration mechanism → karyotype/pedigree interpretation → genomic diagnosis → ethical genetic counselling என்ற clinical-cytogenetic தொடரை நினைவில் கொள்ளவும்.","unit3":"Variation உருவாக்கம் → allele-frequency measurement → Hardy–Weinberg null model → selection/drift/gene flow → population divergence என்ற evolutionary genetics தொடரை பயன்படுத்தவும்.","unit4":"Homologous sequences → alignment → evolutionary model → tree inference → tree interpretation → reproductive isolation → speciation என்ற molecular-to-species reasoning chain-ஐ இணைக்கவும்.","unit5":"Population change → speciation/extinction → macroevolutionary pattern → geological timescale → fossil + genomic evidence → branching human phylogeny என்ற பல-அளவிலான framework-ஐ பயன்படுத்தவும்."},"lessons":[{"id":"unit1-01-mendelian-principles","unit":"unit1","title":"Mendelian principles","index":1,"fact":"Alleles separate during meiosis; fertilisation restores diploidy.","taTitle":"மெண்டேலிய மரபியல் கோட்பாடுகள்","taSummary":"அலீல்கள் meiosis-இல் பிரிந்து தனித்தனி gamete-களில் செல்கின்றன; fertilisation அவற்றை மீண்டும் diploid நிலையில் இணைக்கிறது. இந்த விதிகள் probability, meiosis மற்றும் குறிப்பிட்ட மரபியல் முன்னெண்ணங்களின் அடிப்படையில் புரிந்துகொள்ளப்பட வேண்டும்."},{"id":"unit1-02-monohybrid-cross","unit":"unit1","title":"Monohybrid cross","index":2,"fact":"The 3:1 phenotype ratio is conditional on complete dominance and equal viability.","taTitle":"ஒற்றைப் பண்புக் கலப்பு","taSummary":"ஒரே locus-இன் மரபுரிமையைப் பின்தொடரும் கலப்பே monohybrid cross. Aa × Aa இல் genotype விகிதம் 1:2:1; முழு ஆதிக்கம் இருந்தால் phenotype விகிதம் 3:1 ஆகும்."},{"id":"unit1-03-law-of-segregation","unit":"unit1","title":"Law of segregation","index":3,"fact":"Segregation is a meiotic consequence of chromosome behaviour.","taTitle":"பிரிதல் விதி","taSummary":"ஒரு diploid locus-இன் இரண்டு alleles gamete உருவாக்கத்தின் போது பிரிகின்றன. இதன் செலியியல் அடிப்படை homologous chromosomes-ன் meiosis பிரிதலாகும்."},{"id":"unit1-04-classical-3-1-phenotypic-ratio","unit":"unit1","title":"Classical 3:1 phenotypic ratio","index":4,"fact":"Always distinguish phenotypic ratios from genotypic ratios.","taTitle":"மரபுவழி 3:1 தோற்றவகை விகிதம்","taSummary":"Aa × Aa கலப்பில் முழு ஆதிக்கம், சமமான viability மற்றும் சீரான fertilisation இருந்தால் F2 phenotype 3:1 ஆக அமையும். இந்த முன்னெண்ணங்கள் மாறினால் விகிதமும் மாறும்."},{"id":"unit1-05-incomplete-dominance","unit":"unit1","title":"Incomplete dominance","index":5,"fact":"Incomplete dominance changes phenotype expression, not segregation of alleles.","taTitle":"முழுமையற்ற ஆதிக்கம்","taSummary":"heterozygote-ன் phenotype இரு homozygote-களுக்கிடையிலான இடைநிலையாக இருக்கும். எனவே F2-ல் genotype மட்டுமன்றி phenotype விகிதமும் 1:2:1 ஆகும்."},{"id":"unit1-06-codominance","unit":"unit1","title":"Codominance","index":6,"fact":"Codominance means simultaneous expression, not blending.","taTitle":"இணைஆதிக்கம்","taSummary":"heterozygote-இல் இரு alleles-உம் தெளிவாக வெளிப்படும் நிலையே codominance. ABO முறையில் Iᴬ மற்றும் Iᴮ alleles இதற்குச் சிறந்த எடுத்துக்காட்டு."},{"id":"unit1-07-lethal-genes","unit":"unit1","title":"Lethal genes","index":7,"fact":"Distinguish zygotic genotype ratios from ratios among surviving offspring.","taTitle":"உயிர்க்கொல்லி மரபணுக்கள்","taSummary":"சில genotype-கள் உயிர்வாழ்தலைக் குறைப்பதால் எதிர்பார்க்கப்படும் Mendelian விகிதங்கள் மாறுகின்றன. recessive lethal நிலைகளில் உயிர்வாழும் சந்ததிகளில் 2:1 விகிதம் தோன்றலாம்."},{"id":"unit1-08-two-gene-interactions","unit":"unit1","title":"Two-gene interactions","index":8,"fact":"Connect the observed inheritance pattern to a testable genetic model.","taTitle":"இரு மரபணு இடையினைவுகள்","taSummary":"இரு loci ஒன்றிணைந்து ஒரே phenotype-ஐ நிர்ணயிக்கும்போது dihybrid விகிதங்கள் 9:3:3:1 இலிருந்து மாறலாம். pathway மற்றும் gene-product தொடர்பு இங்கு முக்கியம்."},{"id":"unit1-09-epistasis","unit":"unit1","title":"Epistasis","index":9,"fact":"Epistasis is interaction between loci; dominance is interaction between alleles at one locus.","taTitle":"எபிஸ்டாசிஸ் — மரபணு மறைத்தல் இடையினைவு","taSummary":"ஒரு locus-இன் allele மற்றொரு locus-இன் phenotypic expression-ஐ மறைக்க அல்லது மாற்றக்கூடும். dominance என்பது ஒரே locus-இல் alleles-க்கிடையிலான உறவு; epistasis loci-களுக்கிடையிலான உறவு."},{"id":"unit1-10-complementary-gene-interaction","unit":"unit1","title":"Complementary gene interaction","index":10,"fact":"The 9:7 ratio reflects two loci acting in the same pathway.","taTitle":"இணைநிறைவு மரபணு இடையினைவு","taSummary":"ஒரு phenotype வெளிப்பட இரு loci-லுமுள்ள குறிப்பிட்ட dominant alleles தேவைப்படும் நிலை complementary interaction. மரபுவழி F2 விகிதம் 9:7 ஆக இருக்கலாம்."},{"id":"unit1-11-supplementary-gene-interaction","unit":"unit1","title":"Supplementary gene interaction","index":11,"fact":"Interpret the biochemical pathway behind the ratio rather than memorising ratios alone.","taTitle":"துணைநிறைவு மரபணு இடையினைவு","taSummary":"ஒரு gene உருவாக்கும் அடிப்படை phenotype-ஐ மற்றொரு gene மாற்றி அல்லது மேம்படுத்தும் போது supplementary interaction ஏற்படும். இது modified dihybrid ratios-ஐ உருவாக்கும்."},{"id":"unit1-12-multiple-gene-interactions","unit":"unit1","title":"Multiple-gene interactions","index":12,"fact":"Connect the observed inheritance pattern to a testable genetic model.","taTitle":"பல மரபணு இடையினைவுகள்","taSummary":"இரண்டுக்கும் மேற்பட்ட genes ஒரே phenotype அல்லது pathway-ஐ பாதிக்கும் போது பல்மரபணு இடையினைவு உருவாகிறது. phenotype-ஐ single-gene காரணமாக மட்டும் விளக்க முடியாது."},{"id":"unit1-13-pleiotropy","unit":"unit1","title":"Pleiotropy","index":13,"fact":"One gene can affect multiple traits without implying one gene controls each trait independently.","taTitle":"பலவிளைவு மரபணுச் செயல்","taSummary":"ஒரே gene பல phenotypic traits-ஐ பாதிக்கும் தன்மை pleiotropy. gene product பல tissues அல்லது pathways-ல் பங்கு வகிப்பது இதற்குக் காரணமாக இருக்கலாம்."},{"id":"unit1-14-penetrance","unit":"unit1","title":"Penetrance","index":14,"fact":"Penetrance is a population proportion.","taTitle":"பெனிட்ரன்ஸ் — genotype வெளிப்படும் விகிதம்","taSummary":"ஒரு genotype கொண்டவர்களில் எத்தனை பேருக்கு எதிர்பார்க்கப்பட்ட phenotype வெளிப்படுகிறது என்பதைக் penetrance அளவிடுகிறது. இது சதவீதமாகக் குறிப்பிடப்படுகிறது."},{"id":"unit1-15-expressivity","unit":"unit1","title":"Expressivity","index":15,"fact":"Expressivity concerns intensity; penetrance concerns presence or absence.","taTitle":"வெளிப்பாட்டுத் தீவிரம்","taSummary":"ஒரே genotype phenotype-ஆக வெளிப்படும் அளவு அல்லது தீவிரத்தில் individuals-க்கிடையே வேறுபாடு ஏற்படுவது expressivity. penetrance-இலிருந்து இதைத் தெளிவாக வேறுபடுத்த வேண்டும்."},{"id":"unit1-16-linkage","unit":"unit1","title":"Linkage","index":16,"fact":"Recombination frequency approaches 50% for effectively unlinked loci.","taTitle":"மரபணு இணைப்பு","taSummary":"ஒரே chromosome-இல் அருகருகே உள்ள genes independent assortment-ஐ விட ஒன்றாக அதிகம் பரம்பரையாகலாம். recombination linkage-ஐ உடைக்கக்கூடும்."},{"id":"unit1-17-types-of-linkage","unit":"unit1","title":"Types of linkage","index":17,"fact":"Connect the observed inheritance pattern to a testable genetic model.","taTitle":"மரபணு இணைப்பின் வகைகள்","taSummary":"complete மற்றும் incomplete linkage போன்ற வகைகள் recombination நிகழ்வின் அளவால் வேறுபடுகின்றன. gene distance மற்றும் crossover வாய்ப்பு இவற்றை நிர்ணயிக்கின்றன."},{"id":"unit1-18-crossing-over","unit":"unit1","title":"Crossing over","index":18,"fact":"Crossing over occurs after homologous pairing and is associated with chiasmata.","taTitle":"குறுக்குப் பரிமாற்றம்","taSummary":"meiotic prophase I-இல் homologous chromosomes-ன் non-sister chromatids DNA பகுதிகளை பரிமாறிக் கொள்கின்றன. இதனால் recombinant chromatids உருவாகின்றன."},{"id":"unit1-19-types-of-crossing-over","unit":"unit1","title":"Types of crossing over","index":19,"fact":"Connect the observed inheritance pattern to a testable genetic model.","taTitle":"குறுக்குப் பரிமாற்றத்தின் வகைகள்","taSummary":"single, double மற்றும் multiple crossover நிகழ்வுகள் genetic mapping-ஐ வேறுபட்ட அளவில் பாதிக்கின்றன. double crossover தொலைவான loci-களின் recombination-ஐ குறைவாக மதிப்பிடச் செய்யலாம்."},{"id":"unit1-20-mechanism-of-crossing-over","unit":"unit1","title":"Mechanism of crossing over","index":20,"fact":"Classical chiasma observations are cytological manifestations of underlying DNA recombination.","taTitle":"குறுக்குப் பரிமாற்றத்தின் இயங்குமுறை","taSummary":"programmed DNA double-strand breaks, strand invasion, homologous pairing மற்றும் recombination intermediate resolution ஆகிய molecular நிகழ்வுகள் crossover-க்கு அடிப்படையாக உள்ளன."},{"id":"unit1-21-theories-of-crossing-over","unit":"unit1","title":"Theories of crossing over","index":21,"fact":"Connect the observed inheritance pattern to a testable genetic model.","taTitle":"குறுக்குப் பரிமாற்றக் கோட்பாடுகள்","taSummary":"crossing over-ஐ விளக்க பழைய cytological கருத்துகளிலிருந்து modern DNA break-repair models வரை பல கோட்பாடுகள் உருவாகியுள்ளன. தற்போதைய விளக்கம் molecular recombination mechanism-ஐ மையமாகக் கொண்டது."},{"id":"unit1-22-genetic-mapping","unit":"unit1","title":"Genetic mapping","index":22,"fact":"Map distance is an estimate derived from recombination, not a direct base-pair measurement.","taTitle":"மரபணு வரைபடமிடல்","taSummary":"recombination frequency-ஐ பயன்படுத்தி loci-களின் வரிசை மற்றும் சார்பு தூரம் கணிக்கப்படுகிறது. குறுகிய interval-களில் 1% recombination சுமார் 1 cM ஆகக் கருதலாம்."},{"id":"unit1-23-cytological-mapping","unit":"unit1","title":"Cytological mapping","index":23,"fact":"Connect the observed inheritance pattern to a testable genetic model.","taTitle":"செலியியல் வரைபடமிடல்","taSummary":"chromosome band, deletion, inversion அல்லது visible cytological landmark-களுடன் gene location-ஐ தொடர்புபடுத்துவது cytological mapping. இது genetic mapping-க்கு physical context வழங்குகிறது."},{"id":"unit1-24-linkage-maps","unit":"unit1","title":"Linkage maps","index":24,"fact":"Gene order is inferred by comparing parental and double-crossover classes.","taTitle":"இணைப்பு வரைபடங்கள்","taSummary":"recombination data அடிப்படையில் markers அல்லது genes-ன் வரிசை மற்றும் cM தூரங்கள் காட்டப்படும் வரைபடமே linkage map. இது physical DNA distance-க்கு நேரடி சமமாக இருக்காது."},{"id":"unit1-25-molecular-marker-mapping","unit":"unit1","title":"Molecular-marker mapping","index":25,"fact":"A useful marker is polymorphic and reliably genotyped.","taTitle":"மூலக்கூறு குறியீட்டு வரைபடமிடல்","taSummary":"SNP, microsatellite மற்றும் sequence variants போன்ற markers மூலம் traits அல்லது genomic regions-ஐ linkage அல்லது association முறையில் பின்தொடரலாம்."},{"id":"unit1-26-somatic-cell-hybrid-mapping","unit":"unit1","title":"Somatic-cell hybrid mapping","index":26,"fact":"This approach preceded modern genome sequencing and dense molecular marker maps.","taTitle":"உடல்செல் கலப்பின வரைபடமிடல்","taSummary":"human–rodent somatic-cell hybrids-ல் குறிப்பிட்ட human chromosome தங்கியிருப்பதையும் gene product expression-ஐயும் ஒப்பிட்டு genes-ஐ chromosome-களுக்கு ஒதுக்கிய வரலாற்றுச் mapping முறை இது."},{"id":"unit1-27-polygenic-inheritance","unit":"unit1","title":"Polygenic inheritance","index":27,"fact":"Quantitative traits reflect distributions rather than simple categorical ratios.","taTitle":"பல்மரபணு மரபுரிமை","taSummary":"பல loci சேர்ந்து quantitative trait-ஐ நிர்ணயிக்கும்போது continuous phenotypic variation தோன்றலாம். environment கூட phenotypic variance-க்கு பங்களிக்கிறது."},{"id":"unit1-28-heritability","unit":"unit1","title":"Heritability","index":28,"fact":"Heritability is population- and environment-specific, not a fixed property of a trait.","taTitle":"மரபுரிமைத்திறன்","taSummary":"ஒரு குறிப்பிட்ட population மற்றும் environment-இல் phenotypic variance-இன் எவ்வளவு பகுதி genetic variance-ஆல் விளக்கப்படுகிறது என்பதே heritability. இது trait-இன் நிலையான உலகளாவிய மதிப்பு அல்ல."},{"id":"unit1-29-measurement-of-heritability","unit":"unit1","title":"Measurement of heritability","index":29,"fact":"High heritability does not mean a trait cannot respond to environmental change.","taTitle":"மரபுரிமைத்திறன் அளவீடு","taSummary":"variance components, relatives resemblance, parent–offspring regression போன்ற முறைகள் மூலம் heritability மதிப்பிடப்படுகிறது. broad-sense மற்றும் narrow-sense மதிப்புகள் வேறு genetic components-ஐ குறிக்கின்றன."},{"id":"unit2-01-chromosome-structure","unit":"unit2","title":"Chromosome structure","index":1,"fact":"Chromosome structure integrates packaging, replication, segregation and gene regulation.","taTitle":"குரோமோசோம் அமைப்பு","taSummary":"chromosome என்பது DNA மற்றும் protein கொண்ட chromatin அமைப்பு. centromere, telomere, chromatin domains மற்றும் higher-order packaging replication, segregation மற்றும் gene regulation-இல் பங்கு வகிக்கின்றன."},{"id":"unit2-02-chromosome-chemical-composition","unit":"unit2","title":"Chromosome chemical composition","index":2,"fact":"Histone proteins package DNA and participate in epigenetic regulation.","taTitle":"குரோமோசோமின் வேதியியல் அமைப்பு","taSummary":"chromosome-களில் DNA, histones, non-histone proteins மற்றும் தொடர்புடைய RNA-கள் காணப்படுகின்றன. nucleosome chromatin-ன் அடிப்படை packing unit ஆகும்."},{"id":"unit2-03-chromosome-organisation","unit":"unit2","title":"Chromosome organisation","index":3,"fact":"Chromosome organisation is dynamic rather than a single fixed fibre structure.","taTitle":"குரோமோசோம் ஒழுங்கமைவு","taSummary":"DNA nucleosome-களில் சுருட்டப்பட்டு loops மற்றும் chromosome territories வரை பல நிலைகளில் ஒழுங்குபடுத்தப்படுகிறது. euchromatin மற்றும் heterochromatin செயல்பாட்டு நிலைகளில் வேறுபடுகின்றன."},{"id":"unit2-04-special-chromosomes","unit":"unit2","title":"Special chromosomes","index":4,"fact":"Distinguish descriptive cytogenetics from molecular diagnosis and ethical counselling.","taTitle":"சிறப்பு வகை குரோமோசோம்கள்","taSummary":"polytene, lampbrush மற்றும் பிற specialised chromosomes குறிப்பிட்ட cells அல்லது developmental stages-ல் தனித்துவமான organisation-ஐ காட்டுகின்றன. அவை chromosome function-ஐ ஆய்வு செய்ய உதவும் மாதிரிகள்."},{"id":"unit2-05-b-chromosomes","unit":"unit2","title":"B chromosomes","index":5,"fact":"B chromosomes are not part of the normal essential chromosome set.","taTitle":"B குரோமோசோம்கள்","taSummary":"standard A-chromosome complement-க்கு மேலாக சில species-ல் காணப்படும் supernumerary chromosomes B chromosomes. அவை non-Mendelian transmission மற்றும் variable phenotypic effects காட்டலாம்."},{"id":"unit2-06-karyotype","unit":"unit2","title":"Karyotype","index":6,"fact":"Karyotyping detects chromosome-scale changes, not most small sequence variants.","taTitle":"கேரியோடைப்","taSummary":"ஒரு cell அல்லது individual-ன் chromosome number மற்றும் morphology-ஐ ஒழுங்குபடுத்திக் காட்டும் தொகுப்பே karyotype. numerical மற்றும் பெரிய structural abnormalities-ஐ அடையாளம் காண பயன்படுகிறது."},{"id":"unit2-07-barr-body","unit":"unit2","title":"Barr body","index":7,"fact":"The number of Barr bodies is typically one fewer than the number of X chromosomes.","taTitle":"பார் உடல்","taSummary":"செயலிழக்கச் செய்யப்பட்ட X chromosome interphase nucleus-ல் condensed Barr body ஆகத் தெரியும். பொதுவாக Barr body எண்ணிக்கை X chromosome எண்ணிக்கையை விட ஒன்று குறைவு."},{"id":"unit2-08-numerical-chromosome-aberrations","unit":"unit2","title":"Numerical chromosome aberrations","index":8,"fact":"Distinguish descriptive cytogenetics from molecular diagnosis and ethical counselling.","taTitle":"எண்ணிக்கைக் குரோமோசோம் மாற்றங்கள்","taSummary":"முழு chromosome sets அல்லது தனிப்பட்ட chromosomes எண்ணிக்கையில் ஏற்படும் மாற்றங்கள் numerical aberrations. nondisjunction முக்கிய காரணிகளில் ஒன்று."},{"id":"unit2-09-euploidy","unit":"unit2","title":"Euploidy","index":9,"fact":"Euploid changes affect whole chromosome sets.","taTitle":"யூப்ளாய்டி","taSummary":"முழு haploid chromosome set-களின் எண்ணிக்கை மாறுதல் euploidy. polyploidy தாவரங்களில் பொதுவாகக் காணப்பட்டாலும் உயிரினங்களின் viability மீது context-dependent விளைவுகள் உண்டு."},{"id":"unit2-10-aneuploidy","unit":"unit2","title":"Aneuploidy","index":10,"fact":"Aneuploidy differs from polyploidy because individual chromosomes, not whole sets, are altered.","taTitle":"அன்யூப்ளாய்டி","taSummary":"முழு set அல்லாமல் ஒரு அல்லது சில chromosomes கூடுதல் அல்லது குறைவாக இருப்பதே aneuploidy. monosomy மற்றும் trisomy இதன் முக்கிய வடிவங்கள்."},{"id":"unit2-11-structural-chromosome-aberrations","unit":"unit2","title":"Structural chromosome aberrations","index":11,"fact":"Distinguish descriptive cytogenetics from molecular diagnosis and ethical counselling.","taTitle":"குரோமோசோம் கட்டமைப்பு மாற்றங்கள்","taSummary":"chromosome breakage மற்றும் தவறான rejoining மூலம் deletion, duplication, inversion, translocation போன்ற structural changes உருவாகின்றன. dosage மற்றும் breakpoint location phenotype-ஐ பாதிக்கும்."},{"id":"unit2-12-deletion","unit":"unit2","title":"Deletion","index":12,"fact":"Large deletions can be cytogenetically visible; microdeletions require molecular methods.","taTitle":"நீக்கம்","taSummary":"ஒரு chromosome segment இழக்கப்படுவது deletion. இதில் genes குறைவதால் dosage imbalance மற்றும் developmental abnormalities ஏற்படலாம்."},{"id":"unit2-13-duplication","unit":"unit2","title":"Duplication","index":13,"fact":"Duplications can be pathogenic or evolutionarily innovative depending on context.","taTitle":"இரட்டிப்பு","taSummary":"ஒரு chromosome segment கூடுதல் copy பெறுவது duplication. gene dosage அதிகரிப்பதோடு evolutionary innovation-க்கும் gene duplication மூலப்பொருளாக செயல்படலாம்."},{"id":"unit2-14-inversion","unit":"unit2","title":"Inversion","index":14,"fact":"Paracentric and pericentric inversions differ in whether the centromere is included.","taTitle":"தலைகீழ்மாற்றம்","taSummary":"chromosome segment இரண்டு breakpoints இடையில் 180° திரும்பி மீண்டும் இணைவது inversion. carriers balanced ஆக இருந்தாலும் meiosis-ல் crossover abnormal products உருவாக்கலாம்."},{"id":"unit2-15-translocation","unit":"unit2","title":"Translocation","index":15,"fact":"Balanced structural rearrangements can have reproductive consequences without changing total DNA amount.","taTitle":"இடமாற்றம்","taSummary":"chromosome segment வேறு chromosome இடத்துக்கு நகர்வது translocation. reciprocal balanced translocation carriers phenotypically normal ஆக இருந்தாலும் reproductive risk அதிகரிக்கலாம்."},{"id":"unit2-16-down-syndrome","unit":"unit2","title":"Down syndrome","index":16,"fact":"Use person-centred language and distinguish cytogenetic mechanisms.","taTitle":"டவுன் சிண்ட்ரோம்","taSummary":"பெரும்பாலான Down syndrome வழக்குகள் chromosome 21 trisomy காரணமாகும். nondisjunction, translocation அல்லது mosaicism போன்ற cytogenetic mechanisms வேறுபடலாம்."},{"id":"unit2-17-turner-syndrome","unit":"unit2","title":"Turner syndrome","index":17,"fact":"The typical karyotype is 45,X, but mosaic and structural X variants occur.","taTitle":"டர்னர் சிண்ட்ரோம்","taSummary":"45,X போன்ற X-chromosome monosomy அல்லது mosaic states Turner syndrome-ஐ ஏற்படுத்தலாம். phenotype மற்றும் clinical features chromosome constitution-ஐப் பொறுத்து மாறுபடும்."},{"id":"unit2-18-edwards-syndrome","unit":"unit2","title":"Edwards syndrome","index":18,"fact":"It is a numerical chromosomal abnormality.","taTitle":"எட்வர்ட்ஸ் சிண்ட்ரோம்","taSummary":"chromosome 18 trisomy Edwards syndrome-க்கு முக்கிய காரணம். இது பல congenital abnormalities மற்றும் அதிகமான developmental/viability பாதிப்புகளுடன் தொடர்புடையது."},{"id":"unit2-19-klinefelter-syndrome","unit":"unit2","title":"Klinefelter syndrome","index":19,"fact":"One Barr body is typically present in 47,XXY somatic cells.","taTitle":"க்லைன்ஃபெல்டர் சிண்ட்ரோம்","taSummary":"47,XXY போன்ற கூடுதல் X chromosome கொண்ட phenotypic males-ல் Klinefelter syndrome காணப்படும். பொதுவாக ஒரு Barr body இருக்கலாம்."},{"id":"unit2-20-pedigree-analysis","unit":"unit2","title":"Pedigree analysis","index":20,"fact":"Pedigree inference depends on penetrance, family size, ascertainment and accurate relationships.","taTitle":"வம்சவரிசைப் பகுப்பாய்வு","taSummary":"பல தலைமுறைகளில் phenotype பரவலைப் பார்த்து autosomal, X-linked, Y-linked அல்லது mitochondrial inheritance pattern-ஐ மதிப்பிடுவது pedigree analysis."},{"id":"unit2-21-human-genome-project","unit":"unit2","title":"Human Genome Project","index":21,"fact":"A reference genome is not a complete representation of all human genetic diversity.","taTitle":"மனித ஜீனோம் திட்டம்","taSummary":"மனித genome-ன் reference sequence மற்றும் gene mapping வளங்களை உருவாக்கிய சர்வதேச முயற்சி Human Genome Project. modern genomics இதைத் தொடர்ந்து variation மற்றும் function ஆய்வுகளுக்கு விரிவடைந்தது."},{"id":"unit2-22-prenatal-diagnosis","unit":"unit2","title":"Prenatal diagnosis","index":22,"fact":"Distinguish descriptive cytogenetics from molecular diagnosis and ethical counselling.","taTitle":"கருவுக்கு முன் மரபியல் நோயறிதல்","taSummary":"கருவில் chromosome அல்லது genetic abnormalities-ஐ மதிப்பிட invasive மற்றும் non-invasive முறைகள் பயன்படுத்தப்படுகின்றன. test limitation, risk மற்றும் counselling அவசியமான பகுதிகள்."},{"id":"unit2-23-amniocentesis","unit":"unit2","title":"Amniocentesis","index":23,"fact":"Educational discussion should distinguish screening from diagnostic testing.","taTitle":"அம்னியோசென்டீசிஸ்","taSummary":"amniotic fluid-இல் உள்ள fetal cells அல்லது biomolecules-ஐப் பெறும் prenatal diagnostic procedure amniocentesis. இது குறிப்பிட்ட gestational stage-ல் செய்யப்படுகிறது மற்றும் procedure-related risk உள்ளது."},{"id":"unit2-24-chorionic-villus-sampling","unit":"unit2","title":"Chorionic Villus Sampling","index":24,"fact":"CVS is invasive and requires specialist clinical counselling.","taTitle":"கோரியானிக் வில்லஸ் மாதிரி எடுப்பு","taSummary":"placental chorionic villi-லிருந்து fetal genetic material பெறும் prenatal diagnostic முறை CVS. amniocentesis-ஐ விட பொதுவாக முன்னதாக செய்ய முடியும்."},{"id":"unit2-25-genetic-counselling","unit":"unit2","title":"Genetic counselling","index":25,"fact":"Modern genetic counselling is non-directive and ethically grounded.","taTitle":"மரபியல் ஆலோசனை","taSummary":"genetic risk, test options, uncertainty மற்றும் reproductive choices பற்றிய தகவலை non-directive முறையில் பகிர்வதே genetic counselling. informed consent மற்றும் autonomy மையக் கொள்கைகள்."},{"id":"unit2-26-eugenics","unit":"unit2","title":"Eugenics","index":26,"fact":"Teach eugenics critically in its historical and bioethical context.","taTitle":"யூஜெனிக்ஸ் — வரலாற்று மற்றும் உயிரியல் நெறியியல் பார்வை","taSummary":"“மனித மரபை மேம்படுத்துதல்” என்ற பெயரில் coercion மற்றும் discrimination-ஐ ஏற்படுத்திய வரலாற்று eugenics இயக்கங்கள் அறிவியல் மற்றும் நெறியியல் ரீதியாக கடுமையாக விமர்சிக்கப்படுகின்றன. இதை endorsement இல்லாமல் வரலாற்றுப் பாடமாக கற்பிக்க வேண்டும்."},{"id":"unit2-27-euthenics","unit":"unit2","title":"Euthenics","index":27,"fact":"It should be distinguished from eugenics.","taTitle":"யூதெனிக்ஸ்","taSummary":"சுற்றுச்சூழல், ஊட்டச்சத்து, கல்வி மற்றும் சமூக நிலைகளை மேம்படுத்தி மனித நலத்தை உயர்த்தும் கருத்து euthenics. இது inherited genotype-ஐ மாற்றுவது அல்ல."},{"id":"unit2-28-sex-linked-inheritance","unit":"unit2","title":"Sex-linked inheritance","index":28,"fact":"Sex linkage refers to chromosomal location, not restriction of a trait to one sex.","taTitle":"பாலினக் குரோமோசோம் சார்ந்த மரபுரிமை","taSummary":"X அல்லது Y chromosome-ல் உள்ள genes-ன் inheritance pattern sex-linked inheritance. X-linked traits-ல் father-to-son transmission இல்லாமை போன்ற pedigree clues பயன்படும்."},{"id":"unit2-29-sex-limited-characters","unit":"unit2","title":"Sex-limited characters","index":29,"fact":"Sex-limited expression does not require sex-chromosome linkage.","taTitle":"பாலின வரையறுக்கப்பட்ட பண்புகள்","taSummary":"genes இரு பாலினங்களிலும் இருந்தாலும் phenotype ஒரு பாலினத்தில் மட்டும் வெளிப்படும் பண்புகள் sex-limited traits. sex-specific anatomy அல்லது hormones இதை நிர்ணயிக்கலாம்."},{"id":"unit2-30-sex-influenced-characters","unit":"unit2","title":"Sex-influenced characters","index":30,"fact":"Sex-influenced and sex-linked are distinct concepts.","taTitle":"பாலினத் தாக்கமுள்ள பண்புகள்","taSummary":"ஒரே genotype ஆண் மற்றும் பெண் பாலினங்களில் வேறுபட்ட phenotypic expression அல்லது dominance pattern காட்டும் பண்புகள் sex-influenced traits."},{"id":"unit3-01-organic-evolution","unit":"unit3","title":"Organic evolution","index":1,"fact":"Always identify the population, timescale and evolutionary force involved.","taTitle":"உயிரியல் பரிணாமம்","taSummary":"பரம்பரையாகக் கடத்தப்படும் மாறுபாடுகள் தலைமுறைகள் கடந்தும் population-களில் மாறுவதையே biological evolution எனப் பார்க்க வேண்டும். individual மாற்றம் evolution அல்ல."},{"id":"unit3-02-lamarckism","unit":"unit3","title":"Lamarckism","index":2,"fact":"Separate historical significance from modern evidential support.","taTitle":"லாமார்க்கியம்","taSummary":"use and disuse மற்றும் acquired characters inheritance மூலம் evolution நிகழும் என Lamarck முன்மொழிந்தார். இது வரலாற்று முக்கியத்துவம் கொண்டாலும் modern genetics இதை பொதுவான inheritance mechanism ஆக ஆதரிக்கவில்லை."},{"id":"unit3-03-darwinism","unit":"unit3","title":"Darwinism","index":3,"fact":"Natural selection filters heritable variation; it does not create variation because it is needed.","taTitle":"டார்வினியம்","taSummary":"heritable variation மீது natural selection செயல்பட்டு differential reproductive success உருவாக்கும் என்ற கருத்து Darwinian evolution-ன் மையம். modern genetics பின்னர் இதனுடன் இணைக்கப்பட்டது."},{"id":"unit3-04-mutation-theory","unit":"unit3","title":"Mutation theory","index":4,"fact":"Mutation supplies variation; population processes determine its fate.","taTitle":"திடீர்மாற்றக் கோட்பாடு","taSummary":"de Vries mutation-களுக்கு evolution-ல் மிகப்பெரும் தனிப்பங்கு அளித்தார். mutation variation உருவாக்கினாலும் evolution-ஐ முழுமையாக விளக்க selection, drift, gene flow மற்றும் recombination போன்ற forces தேவை."},{"id":"unit3-05-modern-evolutionary-synthesis","unit":"unit3","title":"Modern evolutionary synthesis","index":5,"fact":"It connected microevolutionary genetics with broader evolutionary patterns.","taTitle":"நவீன பரிணாம ஒருங்கிணைப்புக் கோட்பாடு","taSummary":"Mendelian genetics, population genetics மற்றும் Darwinian natural selection-ஐ ஒருங்கிணைத்த modern synthesis allele-frequency மாற்றங்களை evolution-ன் population-level அடிப்படையாகக் கொண்டது."},{"id":"unit3-06-population","unit":"unit3","title":"Population","index":6,"fact":"Always identify the population, timescale and evolutionary force involved.","taTitle":"மக்கள்தொகை","taSummary":"ஒரே species-ஐச் சேர்ந்த, குறிப்பிட்ட இடம் மற்றும் காலத்தில் interbreeding செய்யும் individuals-ன் தொகுதியே evolutionary population. அதன் allele frequencies காலத்தோடு மாறலாம்."},{"id":"unit3-07-gene-pool","unit":"unit3","title":"Gene pool","index":7,"fact":"Evolutionary forces alter the composition of the gene pool.","taTitle":"மரபணுக் களஞ்சியம்","taSummary":"ஒரு population-ல் உள்ள அனைத்து alleles மற்றும் அவற்றின் frequencies-ன் மொத்தத் தொகுப்பே gene pool. evolution gene pool composition-இன் தலைமுறை மாற்றமாக அளவிடப்படுகிறது."},{"id":"unit3-08-allele-frequency","unit":"unit3","title":"Allele frequency","index":8,"fact":"Allele frequency is not the same as genotype frequency.","taTitle":"அலீல் அதிர்வெண்","taSummary":"ஒரு locus-ல் குறிப்பிட்ட allele மொத்த allele copies-ல் எவ்வளவு பங்கைப் பெறுகிறது என்பதே allele frequency. diploid population-ல் genotype counts மூலம் இதை கணக்கிடலாம்."},{"id":"unit3-09-sources-of-genetic-variation","unit":"unit3","title":"Sources of genetic variation","index":9,"fact":"Always identify the population, timescale and evolutionary force involved.","taTitle":"மரபியல் மாறுபாட்டின் மூலங்கள்","taSummary":"mutation புதிய alleles உருவாக்குகிறது; recombination புதிய allele combinations உருவாக்குகிறது; gene flow populations இடையே variation-ஐ நகர்த்துகிறது. இவை selection மற்றும் drift செயல்படும் மூலப்பொருளை வழங்குகின்றன."},{"id":"unit3-10-mutation","unit":"unit3","title":"Mutation","index":10,"fact":"Mutation is random with respect to adaptive need, though mutation rates vary across genomes.","taTitle":"திடீர்மாற்றம்","taSummary":"DNA sequence-ல் ஏற்படும் heritable change mutation. mutation adaptive need-க்கு ஏற்ப நோக்கமுடன் உருவாகாது; ஆனால் mutation rate genome regions மற்றும் conditions-க்கு ஏற்ப மாறலாம்."},{"id":"unit3-11-transposable-elements","unit":"unit3","title":"Transposable elements","index":11,"fact":"Transposons are major evolutionary components of many eukaryotic genomes.","taTitle":"இடம்பெயரும் மரபியல் கூறுகள்","taSummary":"genome-இல் இடம் மாறக்கூடிய DNA elements transposable elements. அவை insertion mutation, gene regulation மாற்றம் மற்றும் genome evolution-க்கு பங்களிக்கலாம்."},{"id":"unit3-12-recombination","unit":"unit3","title":"Recombination","index":12,"fact":"Recombination is a source of genotypic variation.","taTitle":"மறுசேர்க்கை","taSummary":"meiosis-ல் homologous chromosomes இடையேயான crossover மற்றும் independent assortment புதிய allele combinations உருவாக்குகின்றன. recombination variation-ஐ மறுசீரமைக்கிறது; புதிய allele உருவாக்காது."},{"id":"unit3-13-natural-selection","unit":"unit3","title":"Natural selection","index":13,"fact":"Selection acts on phenotypes but evolution is measured genetically at the population level.","taTitle":"இயற்கைத் தேர்வு","taSummary":"heritable phenotypes reproductive success-இல் வேறுபாடு காட்டும்போது allele frequencies தலைமுறைகளில் non-random முறையில் மாறலாம். fitness எப்போதும் குறிப்பிட்ட environment-ஐச் சார்ந்தது."},{"id":"unit3-14-evolutionary-forces","unit":"unit3","title":"Evolutionary forces","index":14,"fact":"Always identify the population, timescale and evolutionary force involved.","taTitle":"பரிணாம விசைகள்","taSummary":"mutation, natural selection, genetic drift, gene flow மற்றும் recombination population genetic structure-ஐ மாற்றுகின்றன. ஒவ்வொரு force-க்கும் deterministic அல்லது stochastic தாக்கம் வேறுபடும்."},{"id":"unit3-15-migration-and-gene-flow","unit":"unit3","title":"Migration and gene flow","index":15,"fact":"Gene flow can oppose local differentiation.","taTitle":"இடம்பெயர்வு மற்றும் மரபணு ஓட்டம்","taSummary":"individuals அல்லது gametes populations இடையே நகர்ந்து alleles-ஐ கொண்டு செல்லும் போது gene flow ஏற்படும். இது populations-ன் allele frequencies-ஐ ஒரேபோலாக்கும் போக்கு கொண்டிருக்கலாம்."},{"id":"unit3-16-genetic-drift","unit":"unit3","title":"Genetic drift","index":16,"fact":"Drift is random with respect to fitness.","taTitle":"மரபணுச் சறுக்கு","taSummary":"சிறிய populations-ல் random sampling காரணமாக allele frequencies தலைமுறைகளில் சீரற்ற முறையில் மாறுவது genetic drift. neutral alleles கூட fixation அல்லது loss அடையலாம்."},{"id":"unit3-17-founder-effect","unit":"unit3","title":"Founder effect","index":17,"fact":"Founder effects are a special case of genetic drift.","taTitle":"நிறுவனர் விளைவு","taSummary":"சிறிய எண்ணிக்கையிலான founders புதிய population உருவாக்கும்போது அவர்களின் allele frequencies source population-ஐ பிரதிநிதித்துவப்படுத்தாமல் இருக்கலாம். இது drift-ன் ஒரு சிறப்பு நிலை."},{"id":"unit3-18-population-bottleneck","unit":"unit3","title":"Population bottleneck","index":18,"fact":"Population recovery in numbers does not automatically restore lost genetic diversity.","taTitle":"மக்கள்தொகை நெருக்கடிவிளைவு","taSummary":"population திடீரென மிகவும் குறையும்போது surviving sample மட்டுமே gene pool-ஐத் தொடரும். பின்னர் population பெருகினாலும் genetic diversity குறைந்திருக்கலாம்."},{"id":"unit3-19-hardy-weinberg-equilibrium","unit":"unit3","title":"Hardy–Weinberg equilibrium","index":19,"fact":"Departure from Hardy–Weinberg proportions can indicate violated assumptions or technical issues.","taTitle":"ஹார்டி–வைன்பெர்க் சமநிலை","taSummary":"ஒரு ideal population-ல் selection, mutation, migration, drift மற்றும் non-random mating இல்லையெனில் allele மற்றும் genotype frequencies நிலையாக இருக்கும் என்ற null model Hardy–Weinberg equilibrium."},{"id":"unit3-20-hardy-weinberg-calculations","unit":"unit3","title":"Hardy–Weinberg calculations","index":20,"fact":"Always identify the population, timescale and evolutionary force involved.","taTitle":"ஹார்டி–வைன்பெர்க் கணக்கீடுகள்","taSummary":"இரு alleles கொண்ட locus-ல் p + q = 1 மற்றும் p² + 2pq + q² = 1 பயன்படுத்தி allele/genotype frequencies கணக்கிடலாம். observed data-வை equilibrium expectation-உடன் ஒப்பிடுவது முக்கியம்."},{"id":"unit3-21-stabilising-selection","unit":"unit3","title":"Stabilising selection","index":21,"fact":"The population mean may remain relatively stable while extremes are selected against.","taTitle":"நிலைப்படுத்தும் தேர்வு","taSummary":"intermediate phenotype-கள் அதிக fitness பெற்று extremes குறையும் selection pattern stabilising selection. mean மிகக் குறைவாக மாறினாலும் variance குறையலாம்."},{"id":"unit3-22-directional-selection","unit":"unit3","title":"Directional selection","index":22,"fact":"A changing environment can produce directional selection.","taTitle":"திசைத் தேர்வு","taSummary":"ஒரு phenotypic extreme அதிக fitness பெறும்போது population mean ஒரு திசையில் நகரும். environmental change directional selection-ஐத் தூண்டலாம்."},{"id":"unit3-23-disruptive-selection","unit":"unit3","title":"Disruptive selection","index":23,"fact":"Disruptive selection is also called diversifying selection.","taTitle":"பிளவூட்டும் தேர்வு","taSummary":"இரு extremes-க்கும் intermediate phenotype-ஐ விட அதிக fitness இருக்கும் போது disruptive selection ஏற்படும். இது phenotypic distribution-ஐ இருமுனையாக மாற்றலாம்."},{"id":"unit4-01-origin-of-life","unit":"unit4","title":"Origin of life","index":1,"fact":"Abiogenesis and biological evolution are related but distinct research questions.","taTitle":"உயிரின் தோற்றம்","taSummary":"abiotic chemistry-லிருந்து self-replicating மற்றும் compartmentalised systems உருவான விதத்தை origin-of-life research ஆராய்கிறது. இது பல hypotheses மற்றும் experimental models கொண்ட துறை; ஒரே நிரூபிக்கப்பட்ட வரிசை இல்லை."},{"id":"unit4-02-molecular-evolution","unit":"unit4","title":"Molecular evolution","index":2,"fact":"Sequence variation provides evidence for ancestry, divergence and selection.","taTitle":"மூலக்கூறு பரிணாமம்","taSummary":"DNA, RNA மற்றும் protein sequences தலைமுறைகளில் மாற்றம் அடையும் விதத்தை molecular evolution ஆய்வு செய்கிறது. mutation, substitution, selection, drift மற்றும் demographic history இவை அனைத்தும் sequence patterns-ஐ வடிவமைக்கின்றன."},{"id":"unit4-03-principles-of-molecular-evolutionary-studi","unit":"unit4","title":"Principles of molecular evolutionary studies","index":3,"fact":"Treat phylogenetic trees as hypotheses supported to varying degrees by data.","taTitle":"மூலக்கூறு பரிணாம ஆய்வின் அடிப்படைக் கோட்பாடுகள்","taSummary":"homology, sequence alignment, substitution models, rate variation மற்றும் statistical inference ஆகியவை molecular evolution ஆய்வின் மையக் கூறுகள். data மற்றும் model assumptions தெளிவாகப் பிரிக்கப்பட வேண்டும்."},{"id":"unit4-04-molecular-divergence","unit":"unit4","title":"Molecular divergence","index":4,"fact":"Observed divergence reflects mutation, fixation, selection and time.","taTitle":"மூலக்கூறு வேறுபாடு","taSummary":"இரு lineages பிரிந்தபின் sequences-ல் substitutions சேருவதால் molecular divergence அதிகரிக்கிறது. observed difference multiple hits மற்றும் selection காரணமாக நேரத்துடன் நேரியல் அல்லாமல் இருக்கலாம்."},{"id":"unit4-05-molecular-phylogenetics","unit":"unit4","title":"Molecular phylogenetics","index":5,"fact":"Phylogenetic inference is model-based and includes uncertainty.","taTitle":"மூலக்கூறு வம்சவழியியல்","taSummary":"DNA அல்லது protein sequence data மூலம் common ancestry மற்றும் branching relationships-ஐ infer செய்வது molecular phylogenetics. tree என்பது data மற்றும் model அடிப்படையிலான hypothesis ஆகும்."},{"id":"unit4-06-molecular-markers","unit":"unit4","title":"Molecular markers","index":6,"fact":"Marker choice depends on scale, mutation rate and research question.","taTitle":"மூலக்கூறு குறியீடுகள்","taSummary":"SNP, microsatellite, indel அல்லது sequence haplotype போன்ற heritable molecular variants populations, pedigrees மற்றும் phylogeny-யை ஆய்வு செய்ய markers ஆக பயன்படுகின்றன."},{"id":"unit4-07-molecular-clock","unit":"unit4","title":"Molecular clock","index":7,"fact":"Molecular clocks require calibration and model assumptions.","taTitle":"மூலக்கூறு கடிகாரம்","taSummary":"sequence substitutions ஒரு சுமார் rate-ல் சேரும் என்ற கருத்தை பயன்படுத்தி divergence time கணிக்கலாம். strict clock எல்லா lineages-க்கும் பொருந்தாது; calibration மற்றும் rate variation கவனிக்க வேண்டும்."},{"id":"unit4-08-sequence-evolution","unit":"unit4","title":"Sequence evolution","index":8,"fact":"Treat phylogenetic trees as hypotheses supported to varying degrees by data.","taTitle":"வரிசை பரிணாமம்","taSummary":"substitution, insertion, deletion, duplication மற்றும் selection ஆகியவை DNA/protein sequences-ஐ காலத்தோடு மாற்றுகின்றன. homologous positions சரியாக அடையாளம் காணப்படுவது analysis-க்கு முக்கியம்."},{"id":"unit4-09-multiple-sequence-alignment","unit":"unit4","title":"Multiple sequence alignment","index":9,"fact":"Alignment is a hypothesis of homology, not merely text formatting.","taTitle":"பல வரிசை ஒப்பமைவு","taSummary":"மூன்றிற்கும் மேற்பட்ட homologous sequences-ல் evolutionary correspondence உள்ள positions-ஐ columns ஆக அமைப்பதே MSA. conserved மற்றும் variable sites function மற்றும் phylogeny குறித்து தகவல் தருகின்றன."},{"id":"unit4-10-phylogenetic-trees","unit":"unit4","title":"Phylogenetic trees","index":10,"fact":"Tip order left-to-right does not indicate evolutionary progress.","taTitle":"வம்சவழி மரங்கள்","taSummary":"taxa-களின் inferred common ancestry மற்றும் branching order-ஐ tree வடிவில் காட்டுவது phylogenetic tree. tip position அல்ல, node topology தான் உறவை நிர்ணயிக்கிறது."},{"id":"unit4-11-tree-terminology","unit":"unit4","title":"Tree terminology","index":11,"fact":"Treat phylogenetic trees as hypotheses supported to varying degrees by data.","taTitle":"வம்சவழி மரக் கலைச்சொற்கள்","taSummary":"root, node, branch, tip, clade, sister taxa, outgroup போன்ற சொற்களைத் தெளிவாகப் புரிந்துகொள்ளாமல் phylogenetic tree-ஐ சரியாக வாசிக்க முடியாது."},{"id":"unit4-12-rooted-and-unrooted-trees","unit":"unit4","title":"Rooted and unrooted trees","index":12,"fact":"Outgroups can help infer the root of a tree.","taTitle":"வேருடைய மற்றும் வேரற்ற வம்சவழி மரங்கள்","taSummary":"rooted tree ancestor-to-descendant direction பற்றிய hypothesis காட்டும்; unrooted tree taxa-களின் relative relationship-ஐ மட்டும் காட்டும். outgroup அல்லது clock rooting பயன்படலாம்."},{"id":"unit4-13-clades","unit":"unit4","title":"Clades","index":13,"fact":"Clades are defined by common ancestry.","taTitle":"கிளேடுகள்","taSummary":"ஒரு common ancestor மற்றும் அதன் அனைத்து descendants-ஐ உள்ளடக்கிய monophyletic group clade. சில descendants-ஐ நீக்கினால் அது முழுமையான clade அல்ல."},{"id":"unit4-14-nodes","unit":"unit4","title":"Nodes","index":14,"fact":"Treat phylogenetic trees as hypotheses supported to varying degrees by data.","taTitle":"முடிச்சுப் புள்ளிகள்","taSummary":"tree-இல் branching node ஒரு inferred common ancestor-ஐ குறிக்கிறது. internal node-ஐ நேரடி fossil individual எனப் பொருள் கொள்ளக் கூடாது."},{"id":"unit4-15-branches","unit":"unit4","title":"Branches","index":15,"fact":"Treat phylogenetic trees as hypotheses supported to varying degrees by data.","taTitle":"வம்சவழி கிளைகள்","taSummary":"branches lineages-ஐ இணைக்கின்றன; branch length meaning tree வகையைப் பொறுத்தது. சில trees-ல் length மாற்றத்தை அல்லது நேரத்தை குறிக்கும்; cladogram-ல் அவசியமில்லை."},{"id":"unit4-16-sister-taxa","unit":"unit4","title":"Sister taxa","index":16,"fact":"Sister relationships are read from branching topology, not visual proximity alone.","taTitle":"சகோதரி வரிசைக்குழுக்கள்","taSummary":"ஒரே immediate common ancestor-ஐ பகிரும் இரண்டு lineages sister taxa. அவை ஒருவரிடமிருந்து மற்றவர் நேரடியாக உருவானவை அல்ல."},{"id":"unit4-17-outgroups","unit":"unit4","title":"Outgroups","index":17,"fact":"A suitable outgroup is related to, but outside, the ingroup.","taTitle":"வெளிக்குழுக்கள்","taSummary":"ingroup-க்கு வெளியேயுள்ள தொடர்புடைய taxon outgroup ஆகத் தேர்ந்தெடுக்கப்பட்டு ancestral/derived character states மற்றும் tree root-ஐ infer செய்ய உதவுகிறது."},{"id":"unit4-18-tree-construction","unit":"unit4","title":"Tree construction","index":18,"fact":"Tree building is an inferential workflow, not a drawing exercise.","taTitle":"வம்சவழி மர கட்டமைப்பு","taSummary":"character அல்லது distance data, evolutionary model மற்றும் optimisation criterion அடிப்படையில் candidate trees உருவாக்கப்படுகின்றன. ஒரே dataset பல trees-ஐ ஆதரிக்கக்கூடும்."},{"id":"unit4-19-distance-methods","unit":"unit4","title":"Distance methods","index":19,"fact":"Distance methods compress character information into pairwise summaries.","taTitle":"தூர அடிப்படையிலான முறைகள்","taSummary":"pairwise evolutionary distances-ஐ சுருக்கமாகப் பயன்படுத்தி tree உருவாக்கும் முறைகள் distance methods. Neighbor-Joining ஒரு பொதுவான எடுத்துக்காட்டு."},{"id":"unit4-20-character-based-approaches","unit":"unit4","title":"Character-based approaches","index":20,"fact":"Different methods can yield different trees depending on data and assumptions.","taTitle":"பண்புக்கூறு அடிப்படையிலான அணுகுமுறைகள்","taSummary":"ஒவ்வொரு aligned character/site-இன் state-ஐ நேரடியாகப் பயன்படுத்தி tree-ஐ மதிப்பிடும் methods character-based approaches. parsimony, maximum likelihood மற்றும் Bayesian inference இதில் அடங்கும்."},{"id":"unit4-21-tree-interpretation","unit":"unit4","title":"Tree interpretation","index":21,"fact":"Rotating branches around a node does not change topology.","taTitle":"வம்சவழி மர விளக்கம்","taSummary":"branch rotation topology-ஐ மாற்றாது; tip-களின் இடதிலிருந்து வலதான வரிசை “மேம்பட்டது” என்பதைச் சொல்லாது. recent common ancestor அடிப்படையில் உறவுகளை வாசிக்க வேண்டும்."},{"id":"unit4-22-biological-species-concept","unit":"unit4","title":"Biological species concept","index":22,"fact":"It is difficult to apply to fossils, asexual organisms and many geographically separated populations.","taTitle":"உயிரியல் இனக் கருத்து","taSummary":"இயற்கையில் interbreed செய்யக்கூடிய மற்றும் பிற குழுக்களிலிருந்து reproductive isolation கொண்ட populations-ஐ species என Biological Species Concept வரையறுக்கிறது. fossils மற்றும் asexual organisms-க்கு இதன் பயன்பாடு குறைவு."},{"id":"unit4-23-phylogenetic-species-concept","unit":"unit4","title":"Phylogenetic species concept","index":23,"fact":"Different operational definitions can change species boundaries.","taTitle":"வம்சவழியியல் இனக் கருத்து","taSummary":"பிரித்தறியக்கூடிய evolutionary lineage அல்லது smallest diagnosable/monophyletic unit-ஐ species எனக் கருதும் அணுகுமுறை phylogenetic species concept. operational criterion study-ஐப் பொறுத்து மாறலாம்."},{"id":"unit4-24-speciation","unit":"unit4","title":"Speciation","index":24,"fact":"Speciation is usually a process rather than a single instantaneous event.","taTitle":"இனவாக்கம்","taSummary":"ஒரு ancestral population-லிருந்து reproductive isolation மற்றும் genetic divergence அதிகரித்து தனித்த species lineages உருவாகும் process speciation."},{"id":"unit4-25-reproductive-isolation","unit":"unit4","title":"Reproductive isolation","index":25,"fact":"Isolation evolves in degrees and can be incomplete.","taTitle":"இனப்பெருக்கத் தனிமைப்படுத்தல்","taSummary":"gene flow-ஐ குறைக்கும் prezygotic அல்லது postzygotic barriers reproductive isolation. இது speciation-ஐ உருவாக்கவும் பராமரிக்கவும் உதவும்."},{"id":"unit4-26-prezygotic-isolation","unit":"unit4","title":"Prezygotic isolation","index":26,"fact":"These mechanisms act before a zygote is formed.","taTitle":"கருவுறுதலுக்கு முன் தனிமைப்படுத்தல்","taSummary":"mating அல்லது fertilisation நடைபெறும்முன் gene flow-ஐத் தடுக்கும் temporal, behavioural, ecological, mechanical அல்லது gametic barriers prezygotic isolation."},{"id":"unit4-27-postzygotic-isolation","unit":"unit4","title":"Postzygotic isolation","index":27,"fact":"Hybrid sterility is a classic postzygotic barrier.","taTitle":"கருவுறுதலுக்குப் பின் தனிமைப்படுத்தல்","taSummary":"hybrid zygote உருவான பின் குறைந்த viability, sterility அல்லது breakdown ஏற்படுவது postzygotic isolation."},{"id":"unit4-28-allopatric-speciation","unit":"unit4","title":"Allopatric speciation","index":28,"fact":"Geographic isolation facilitates, but does not by itself guarantee, speciation.","taTitle":"புவியியல் தனிமை இனவாக்கம்","taSummary":"geographic barrier populations-ஐப் பிரித்து gene flow-ஐக் குறைக்கும் போது drift, selection மற்றும் mutation மூலம் divergence அதிகரித்து allopatric speciation உருவாகலாம்."},{"id":"unit4-29-sympatric-speciation","unit":"unit4","title":"Sympatric speciation","index":29,"fact":"Demonstrating sympatric speciation requires evidence that geographic isolation was not the primary cause.","taTitle":"ஒரே புவியிட இனவாக்கம்","taSummary":"பெரிய geographic separation இல்லாமலேயே reproductive isolation உருவாகும் speciation sympatric speciation. polyploidy, host shift அல்லது assortative mating போன்ற mechanisms பங்கு வகிக்கலாம்."},{"id":"unit4-30-adaptive-radiation","unit":"unit4","title":"Adaptive radiation","index":30,"fact":"Classic examples include island radiations and post-extinction diversifications.","taTitle":"தகவமைப்பு கதிர்வீச்சு","taSummary":"ஒரே ancestral lineage பல ecological niches-ஐ பயன்படுத்தி குறுகிய evolutionary காலத்தில் பல species-ஆக விரிவடைவது adaptive radiation."},{"id":"unit4-31-convergent-evolution","unit":"unit4","title":"Convergent evolution","index":31,"fact":"Similarity from convergence is analogous, not evidence of recent shared ancestry for that trait.","taTitle":"ஒருங்குமுகப் பரிணாமம்","taSummary":"தொலைவான lineages ஒத்த selective pressures-க்கு பதிலளித்து ஒரேபோன்ற adaptations-ஐ தனித்தனியாக உருவாக்குவது convergent evolution. similarity எப்போதும் close ancestry-ஐ குறிக்காது."},{"id":"unit4-32-sexual-selection","unit":"unit4","title":"Sexual selection","index":32,"fact":"Sexual selection is a component of natural selection focused on reproductive success.","taTitle":"பாலியல் தேர்வு","taSummary":"mating success-இல் வேறுபாடு ஏற்படுத்தும் traits மீது sexual selection செயல்படுகிறது. mate choice மற்றும் intrasexual competition முக்கிய mechanisms."},{"id":"unit4-33-altruism","unit":"unit4","title":"Altruism","index":33,"fact":"Evolutionary altruism is defined by fitness consequences, not human moral intent.","taTitle":"பிறர்நல நடத்தை","taSummary":"ஒரு individual-க்கு direct fitness cost இருந்தும் மற்றொருவருக்கு benefit தரும் behaviour altruism. kin selection, inclusive fitness மற்றும் reciprocity போன்ற frameworks இதன் evolution-ஐ விளக்க உதவுகின்றன."},{"id":"unit4-34-evolution-of-social-behaviour","unit":"unit4","title":"Evolution of social behaviour","index":34,"fact":"Treat phylogenetic trees as hypotheses supported to varying degrees by data.","taTitle":"சமூக நடத்தையின் பரிணாமம்","taSummary":"cooperation, conflict, kinship, reciprocity மற்றும் group structure போன்ற factors social behaviour evolution-ஐ வடிவமைக்கின்றன. individual மற்றும் inclusive fitness இரண்டையும் ஆராய வேண்டும்."},{"id":"unit5-01-origin-of-higher-categories","unit":"unit5","title":"Origin of higher categories","index":1,"fact":"Use branching evolutionary reasoning and distinguish evidence from historical textbook shorthand.","taTitle":"உயர் வகைப்பாட்டுக் குழுக்களின் தோற்றம்","taSummary":"higher taxonomic groups-ன் தோற்றம் நீண்டகால speciation, extinction மற்றும் morphological/genomic innovation-களின் விளைவு. taxonomic rank-ஐ ஒரு தனித்த evolutionary mechanism எனக் கருதக் கூடாது."},{"id":"unit5-02-microevolution","unit":"unit5","title":"Microevolution","index":2,"fact":"Mutation, selection, drift and gene flow drive microevolution.","taTitle":"நுண்பரிணாமம்","taSummary":"population-களில் allele frequencies மற்றும் trait distributions குறுகிய காலத்தில் மாறுவது microevolution. selection, drift, mutation மற்றும் gene flow இதை இயக்குகின்றன."},{"id":"unit5-03-macroevolution","unit":"unit5","title":"Macroevolution","index":3,"fact":"Macroevolution is connected to, but not reducible in description to, short-term allele-frequency change.","taTitle":"பெரும்பரிணாமம்","taSummary":"species level மற்றும் அதற்கு மேற்பட்ட கால அளவில் speciation, extinction மற்றும் lineage diversification patterns-ஐ macroevolution ஆய்வு செய்கிறது. இது microevolution-க்கு எதிரான தனி இயற்கை விதி அல்ல."},{"id":"unit5-04-megaevolution","unit":"unit5","title":"Megaevolution","index":4,"fact":"Treat the term as historical or contextual rather than a distinct mechanism.","taTitle":"மிகப்பெரும் பரிணாமம்","taSummary":"மிகப் பெரிய evolutionary transitions மற்றும் புதிய body plans/major lineages உருவாக்கம் போன்ற பரந்த patterns-ஐ விவரிக்க megaevolution என்ற சொல் வரலாற்றில் பயன்படுத்தப்பட்டது. modern analysis developmental, genomic மற்றும் ecological mechanisms-ஐ இணைக்கிறது."},{"id":"unit5-05-coevolution","unit":"unit5","title":"Coevolution","index":5,"fact":"Reciprocal selection is central to coevolution.","taTitle":"இணைப் பரிணாமம்","taSummary":"இரு அல்லது அதற்கு மேற்பட்ட interacting species ஒருவர்மீது ஒருவர் reciprocal selective pressure செலுத்தும்போது coevolution நிகழ்கிறது. host–parasite மற்றும் plant–pollinator systems எடுத்துக்காட்டுகள்."},{"id":"unit5-06-evolutionary-rates","unit":"unit5","title":"Evolutionary rates","index":6,"fact":"There is no single universal rate of evolution.","taTitle":"பரிணாம வேகங்கள்","taSummary":"morphological அல்லது molecular change எல்லா lineages-லும் ஒரே வேகத்தில் நடைபெறாது. generation time, selection, population size, ecology மற்றும் genomic constraints rate-ஐ பாதிக்கலாம்."},{"id":"unit5-07-phyletic-gradualism","unit":"unit5","title":"Phyletic gradualism","index":7,"fact":"It is a model of tempo, not a separate evolutionary mechanism.","taTitle":"வம்சவழி படிப்படியான மாற்றம்","taSummary":"ஒரு lineage காலத்தோடு சிறிய மாற்றங்களைத் தொடர்ந்து சேர்த்துக்கொண்டு gradual transformation காணும் model phyletic gradualism."},{"id":"unit5-08-punctuated-equilibrium","unit":"unit5","title":"Punctuated equilibrium","index":8,"fact":"Punctuated equilibrium addresses evolutionary tempo and fossil patterns.","taTitle":"இடைவெளியுடனான சமநிலை","taSummary":"fossil record-ல் நீண்ட morphological stasis-ஐ ஒட்டி ஒப்பீட்டளவில் குறுகிய காலங்களில் rapid change/speciation காணப்படும் pattern-ஐ punctuated equilibrium விவரிக்கிறது."},{"id":"unit5-09-geological-time-scale","unit":"unit5","title":"Geological time scale","index":9,"fact":"Dates are periodically refined as geochronological evidence improves.","taTitle":"புவியியல் கால அளவுகோல்","taSummary":"Earth history eons, eras, periods, epochs என stratigraphic evidence அடிப்படையில் பிரிக்கப்படுகிறது. biological events-ஐ absolute dates மற்றும் formal boundaries-உடன் தொடர்புபடுத்த வேண்டும்."},{"id":"unit5-10-major-evolutionary-transitions","unit":"unit5","title":"Major evolutionary transitions","index":10,"fact":"Use branching evolutionary reasoning and distinguish evidence from historical textbook shorthand.","taTitle":"முக்கிய பரிணாம மாற்றங்கள்","taSummary":"replicating molecules முதல் cells, eukaryotes, multicellularity, social organisation போன்ற transitions biological organisation-ன் புதிய நிலைகளை உருவாக்கின. அவை ஒரே நேர்கோட்டுப் பாதை அல்ல."},{"id":"unit5-11-primate-evolution","unit":"unit5","title":"Primate evolution","index":11,"fact":"Humans are nested within primate phylogeny.","taTitle":"பிரைமேட் பரிணாமம்","taSummary":"grasping extremities, stereoscopic vision, flexible shoulder மற்றும் enlarged brain போன்ற traits primate evolution-ல் பல்வேறு அளவில் உருவாகின. extant primates அனைத்தும் தங்களுக்கே உரிய modern lineages."},{"id":"unit5-12-hominin-evolution","unit":"unit5","title":"Hominin evolution","index":12,"fact":"Avoid linear “ape-to-human” ladder models.","taTitle":"ஹோமினின் பரிணாமம்","taSummary":"human lineage மற்றும் அதன் extinct close relatives-ன் branching history hominin evolution. habitual bipedalism, dentition மற்றும் later brain/cultural changes mosaic pattern-ஆக உருவானன."},{"id":"unit5-13-primate-versus-hominin-characteristics","unit":"unit5","title":"Primate versus hominin characteristics","index":13,"fact":"No single trait alone defines every stage of hominin evolution.","taTitle":"பிரைமேட் மற்றும் ஹோமினின் பண்புகளின் ஒப்பீடு","taSummary":"hominins primate traits-ஐ பகிர்ந்தாலும் habitual bipedal locomotion, pelvic/foramen magnum changes மற்றும் குறிப்பிட்ட dental trends போன்ற derived traits முக்கியம். எல்லா traits-மும் ஒரே நேரத்தில் தோன்றவில்லை."},{"id":"unit5-14-dryopithecus-and-fossil-apes","unit":"unit5","title":"Dryopithecus and fossil apes","index":14,"fact":"Modern phylogeny treats fossil apes in a branching framework with uncertain exact placements.","taTitle":"ட்ரையோபிதிகஸ் மற்றும் புதைபடிவ வாலில்லாக் குரங்குகள்","taSummary":"Miocene fossil apes hominoid evolution-ன் diversity-ஐ காட்டுகின்றன. Dryopithecus-ஐ Homo sapiens-க்கு நேரடி “கட்டாய முன்னோர்” என நேர்கோட்டில் வைக்கக் கூடாது."},{"id":"unit5-15-australopithecines","unit":"unit5","title":"Australopithecines","index":15,"fact":"They represent several species and lineages, not one simple sequential stage.","taTitle":"ஆஸ்ட்ரலோபிதிசின்கள்","taSummary":"Australopithecus மற்றும் தொடர்புடைய hominins habitual bipedalism உடன் comparatively small brains-ஐக் கொண்டிருந்தன. மனித பரிணாமம் locomotor change முதலில் நிகழ்ந்த mosaic process என்பதை அவை காட்டுகின்றன."},{"id":"unit5-16-early-homo","unit":"unit5","title":"Early Homo","index":16,"fact":"Human evolution contains overlapping lineages and mosaic traits.","taTitle":"ஆரம்பகால Homo","taSummary":"early Homo species-ல் brain size, dentition, body proportions மற்றும் tool-associated behaviour மாறுபட்ட mosaic-ஆகத் தெரிகிறது. species boundaries மற்றும் phylogeny குறித்து fossil evidence-ல் uncertainty உள்ளது."},{"id":"unit5-17-homo-erectus","unit":"unit5","title":"Homo erectus","index":17,"fact":"Taxonomic boundaries between African and Eurasian forms remain debated.","taTitle":"Homo erectus","taSummary":"Homo erectus/ergaster complex நீண்ட கால நிலைத்திருப்பு, அதிகமான body size, dispersal மற்றும் Acheulean technology-யுடன் தொடர்புடையது. regional variation அதன் taxonomy-ஐ சிக்கலாக்குகிறது."},{"id":"unit5-18-archaic-homo","unit":"unit5","title":"Archaic Homo","index":18,"fact":"Use branching evolutionary reasoning and distinguish evidence from historical textbook shorthand.","taTitle":"பழையகால Homo","taSummary":"Middle Pleistocene Homo populations modern humans, Neanderthals மற்றும் Denisovan-related lineages நோக்கி பல branching relationships காட்டுகின்றன. “archaic Homo” ஒரு வசதியான umbrella term ஆக இருக்கலாம்."},{"id":"unit5-19-neanderthals","unit":"unit5","title":"Neanderthals","index":19,"fact":"Neanderthals were close relatives, not simply a failed linear stage before modern humans.","taTitle":"நியாண்டர்தால்கள்","taSummary":"Neanderthals மேற்கு Eurasia-வில் வாழ்ந்த distinct human lineage. ancient DNA modern non-African populations-ல் Neanderthal ancestry இருப்பதை admixture மூலம் காட்டியுள்ளது."},{"id":"unit5-20-denisovans","unit":"unit5","title":"Denisovans","index":20,"fact":"Ancient DNA can reveal lineages poorly represented in the fossil record.","taTitle":"டெனிசோவன்கள்","taSummary":"Denisovans முதன்மையாக ancient DNA மூலம் அடையாளம் காணப்பட்ட archaic human lineage. சில present-day populations-ல் Denisovan ancestry introgression காணப்படுகிறது."},{"id":"unit5-21-homo-sapiens","unit":"unit5","title":"Homo sapiens","index":21,"fact":"Species history includes both divergence and limited gene flow.","taTitle":"Homo sapiens","taSummary":"anatomically modern Homo sapiens African populations-ல் உருவாகி பின்னர் உலகளவில் பரவினர். modern humans-ன் history branching, migration மற்றும் archaic admixture கொண்டது."},{"id":"unit5-22-human-dispersal","unit":"unit5","title":"Human dispersal","index":22,"fact":"A single simple migration arrow cannot capture the full demographic history.","taTitle":"மனித பரவல்","taSummary":"Homo sapiens Africa-விலிருந்து பல கட்டங்களில் பரவி Eurasia, Sahul மற்றும் பின்னர் Americas உட்பட உலகின் பல பகுதிகளை அடைந்தனர். dispersal ஒரு single simple wave அல்ல."},{"id":"unit5-23-molecular-evidence-for-human-evolution","unit":"unit5","title":"Molecular evidence for human evolution","index":23,"fact":"Gene trees and population histories must be interpreted probabilistically.","taTitle":"மனித பரிணாமத்திற்கான மூலக்கூறு ஆதாரங்கள்","taSummary":"genome-wide variation, mtDNA, Y chromosome மற்றும் ancient DNA common ancestry, population splits, migration மற்றும் admixture குறித்து அளவிடத்தக்க evidence வழங்குகின்றன."},{"id":"unit5-24-mitochondrial-dna-evidence","unit":"unit5","title":"Mitochondrial DNA evidence","index":24,"fact":"Do not equate mitochondrial ancestry with total genomic ancestry.","taTitle":"மைட்டோகாண்ட்ரியல் DNA ஆதாரம்","taSummary":"mtDNA பெரும்பாலும் maternal lineage வழியாக கடத்தப்படுவதால் population history மற்றும் coalescent analyses-க்கு பயன்படுகிறது. “mitochondrial Eve” காலத்தில் வாழ்ந்த ஒரே பெண் என்று பொருள் அல்ல."},{"id":"unit5-25-y-chromosome-evidence","unit":"unit5","title":"Y-chromosome evidence","index":25,"fact":"Y-chromosome history is one lineage-specific component of human ancestry.","taTitle":"Y-குரோமோசோம் ஆதாரம்","taSummary":"recombining pseudoautosomal regions தவிர Y chromosome பெரும்பாலும் paternal lineage history-ஐ பின்தொடர உதவுகிறது. இது genome முழுவதையும் பிரதிநிதித்துவப்படுத்தும் ஒரே ancestry tree அல்ல."},{"id":"unit5-26-ancient-dna","unit":"unit5","title":"Ancient DNA","index":26,"fact":"Authentication and contamination control are essential in ancient-DNA research.","taTitle":"பண்டைய DNA","taSummary":"புதைபடிவ அல்லது archaeological material-லிருந்து பெறப்படும் degraded DNA ancient DNA. contamination control, fragment damage மற்றும் authentication ஆகியவை analysis-ல் முக்கியம்."},{"id":"unit5-27-human-evolutionary-phylogeny","unit":"unit5","title":"Human evolutionary phylogeny","index":27,"fact":"Represent uncertainty and admixture rather than forcing a single ladder.","taTitle":"மனித பரிணாம வம்சவழியியல்","taSummary":"மனித பரிணாமத்தை branching tree மட்டுமன்றி சில lineages இடையிலான admixture கொண்ட reticulate history ஆகப் பார்க்க வேண்டும். fossil மற்றும் genomic evidence uncertainty-யுடன் ஒருங்கிணைக்கப்பட வேண்டும்."}]};

let currentRoute='home';
let courseHistoryReady=false;
let courseHistorySupported=true;
function normaliseRoute(target){return String(target||'home').replace(/^#/,'')||'home'}
function pushCourseHistory(routeName){
  if(!courseHistorySupported)return false;
  try{
    const payload={courseRoute:normaliseRoute(routeName),courseHistory:true};
    // Deliberately omit the URL argument: the local file/content-provider address never changes.
    history.pushState(payload,'');
    return true;
  }catch(err){
    courseHistorySupported=false;
    console.warn('Internal browser history is unavailable in this browser context.',err);
    return false;
  }
}
function setRoute(target,options={}){
  const next=normaliseRoute(target);
  const fromPop=!!options.fromPop;
  if(!fromPop && courseHistoryReady && next!==currentRoute) pushCourseHistory(next);
  currentRoute=next;
  route(currentRoute);
}
