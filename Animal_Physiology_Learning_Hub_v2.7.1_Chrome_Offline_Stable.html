lling to distant receptor-bearing targets."},{term:"Erythropoietin",definition:"Kidney-derived hormone stimulating erythrocyte production."},{term:"Filtration",definition:"Pressure-driven movement of fluid and small solutes across a barrier."},{term:"Glomerular filtration rate",definition:"Volume of filtrate formed by all glomeruli per unit time."},{term:"Haematocrit",definition:"Percentage of blood volume occupied by erythrocytes."},{term:"Haemostasis",definition:"Processes that limit blood loss after vascular injury."},{term:"Homeostasis",definition:"Dynamic regulation of internal variables within functional ranges."},{term:"Hormone",definition:"Chemical messenger acting on receptor-bearing targets."},{term:"Micelle",definition:"Bile-salt aggregate carrying lipid-digestion products."},{term:"Myelin",definition:"Glial sheath that increases axonal conduction velocity."},{term:"Nephron",definition:"Functional unit of the kidney."},{term:"Neurotransmitter",definition:"Chemical released by a neuron to signal another cell."},{term:"Partial pressure",definition:"Pressure contributed by one gas in a mixture."},{term:"Peristalsis",definition:"Coordinated smooth-muscle wave propelling luminal contents."},{term:"Refractory period",definition:"Interval of absent or reduced excitability after an action potential."},{term:"Renin",definition:"Juxtaglomerular enzyme initiating angiotensin formation."},{term:"Sarcomere",definition:"Contractile unit between two Z discs."},{term:"Second messenger",definition:"Intracellular signal produced after receptor activation."},{term:"Stroke volume",definition:"Volume ejected by one ventricle per beat."},{term:"Surfactant",definition:"Alveolar mixture that lowers surface tension."},{term:"Synapse",definition:"Junction through which a neuron communicates with another cell."},{term:"Ventilation",definition:"Bulk movement of air into and out of lungs."},{term:"Zymogen",definition:"Inactive enzyme precursor activated at a controlled site."},{term:"Albumin",definition:"Major liver-derived plasma protein that contributes to colloid osmotic pressure and transport."},{term:"Antithrombin",definition:"Natural anticoagulant that inhibits thrombin and several activated clotting factors."},{term:"Basophil",definition:"Granulocyte containing histamine-rich granules and participating in hypersensitivity responses."},{term:"Bombay phenotype",definition:"Rare blood group lacking H antigen and therefore unable to express A or B antigens."},{term:"Cross-match",definition:"Compatibility test between donor erythrocytes and recipient serum or plasma."},{term:"Eosinophil",definition:"Granulocyte important in parasite defence and allergic inflammation."},{term:"Erythropoiesis",definition:"Production and maturation of erythrocytes."},{term:"Fibrin",definition:"Insoluble protein network that stabilises a blood clot."},{term:"Fibrinogen",definition:"Soluble plasma protein converted to fibrin by thrombin."},{term:"Globulin",definition:"Broad group of plasma proteins involved in transport, immunity and other functions."},{term:"Granulocyte",definition:"Leucocyte with conspicuous cytoplasmic granules: neutrophil, eosinophil or basophil."},{term:"Haemopoiesis",definition:"Formation of all blood-cell lineages from haematopoietic stem cells."},{term:"Immunoglobulin",definition:"Antibody protein produced by plasma cells."},{term:"Leucocyte",definition:"Nucleated white blood cell involved in defence and immunity."},{term:"Lymphocyte",definition:"White blood cell involved in adaptive or innate immune responses."},{term:"Megakaryocyte",definition:"Large marrow cell that releases platelets."},{term:"Monocyte",definition:"Circulating phagocytic leucocyte that can differentiate into macrophages or dendritic cells."},{term:"Neutrophil",definition:"Major circulating granulocyte specialised for rapid phagocytic defence."},{term:"Plasma cell",definition:"Differentiated B lymphocyte that secretes antibodies."},{term:"Platelet",definition:"Anucleate CLINICAL_APPLICATION_ERROR"]},{id:"C_U2T26R_ADV",conceptId:"C_U2T26R_ADV",topicId:"U2T26R",unitId:"U2",title:"Renin–Angiotensin–Aldosterone System",misconceptionIds:["MIS_U2T26R_CLINICAL_APPLICATION_ERROR"]},{id:"C_U2T27R_ADV",conceptId:"C_U2T27R_ADV",topicId:"U2T27R",unitId:"U2",title:"Hormonal Regulation of Kidney Function",misconceptionIds:["MIS_U2T27R_CLINICAL_APPLICATION_ERROR"]},{id:"C_U2T28R_ADV",conceptId:"C_U2T28R_ADV",topicId:"U2T28R",unitId:"U2",title:"Renal Clearance and Clinical Indices",misconceptionIds:["MIS_U2T28R_CLINICAL_APPLICATION_ERROR"]},{id:"C_U2T29R_ADV",conceptId:"C_U2T29R_ADV",topicId:"U2T29R",unitId:"U2",title:"Urinalysis and Renal Disorders",misconceptionIds:["MIS_U2T29R_CLINICAL_APPLICATION_ERROR"]}]};AnimalPhysiologyApp.TamilDescriptions={U1T1:"உணவுக் கால்வாய் வாய் முதல் மலத்துவாரம் வரை நீளும் தொடர்ச்சியான தசைக் குழாயாகும். மியூக்கோசாவில் சுரப்பும் உறிஞ்சுதலும் நடைபெறுகின்றன; சப் மியூக்கோசாவில் இரத்தக் குழாய்கள், நிணநீர் நாளங்கள் மற்றும் நரம்புக் குழுமங்கள் உள்ளன. வெளிப்புறத் தசைப்படலம் உணவைக் கலக்கவும் பெரிஸ்டால்சிஸ் மூலம் முன்னோக்கி நகர்த்தவும் உதவுகிறது. உமிழ்நீர்ச் சுரப்பிகள், கல்லீரல், பித்தப்பை மற்றும் கணையம் செரிமானத்திற்குத் தேவையான சுரப்புகளை வழங்குகின்றன.",U1T2:"உமிழ்நீர் உணவை ஈரப்பதப்படுத்தி, சாலிவரி அமிலேஸ் மூலம் மாவுச் செரிமானத்தைத் தொடங்குகிறது. இரைப்பைச் சுரப்பிகள் ஹைட்ரோகுளோரிக் அமிலம், பெப்சினோஜன், மியூக்கஸ், பைகார்பனேட் மற்றும் இன்ட்ரின்சிக் ஃபாக்டர் ஆகியவற்றைச் சுரக்கின்றன. கணையச் சாறு பைகார்பனேட்டுடன் புரதம், கார்போஹைட்ரேட், கொழுப்பு மற்றும் நியூக்ளிக் அமிலங்களைச் செரிப்பதற்கான நொதிகளை கொண்டுள்ளது. காஸ்ட்ரின், சீக்ரெட்டின், கோலிசிஸ்டோகைனின் போன்ற ஹார்மோன்கள் சுரப்புகளையும் குடல் இயக்கத்தையும் ஒழுங்குபடுத்துகின்றன.",U1T3:"உமிழ்நீர் மற்றும் கணைய அமிலேஸ்கள் மாவைச் சிறிய சர்க்கரைகளாக உடைக்கின்றன. குடல் பிரஷ்-போர்டர் நொதிகள் அவற்றை குளுக்கோஸ், கேலக்டோஸ் மற்றும் ஃப்ரக்டோஸ் போன்ற ஒற்றைச் சர்க்கரைகளாக மாற்றுகின்றன. குளுக்கோஸ் மற்றும் கேலக்டோஸ் SGLT1 வழியாகவும், ஃப்ரக்டோஸ் GLUT5 வழியாகவும் எண்டரோசைட்டுகளுக்குள் நுழைகின்றன; பின்னர் GLUT2 வழியாக போர்டல் இரத்தத்தில் செல்கின்றன. மனிதர்களில் செல்லுலேஸ் இல்லாததால் செல்லுலோஸின் பீட்டா-1,4 இணைப்புகள் செரிக்கப்படுவதில்லை.",U1T4:"புரதச் செரிமானம் இரைப்பையில் பெப்சின் செயலால் தொடங்குகிறது. சிறுகுடலில் டிரிப்சின், கைமோடிரிப்சின், எலாஸ்டேஸ் மற்றும் கார்பாக்சிபெப்டிடேஸ்கள் புரதங்களைச் சிறிய பெப்டைட்களாக உடைக்கின்றன. எண்டரோபெப்டிடேஸ் டிரிப்சினோஜனை டிரிப்சினாக மாற்றி, பிற கணைய ஜைமோஜன்களையும் செயல்படுத்துகிறது. அமினோ அமிலங்கள் சோடியம் சார்ந்த கடத்திகளாலும், டைபெப்டைட்கள் மற்றும் டிரைப்பெப்டைட்கள் PepT1 வழியாகவும் உறிஞ்சப்படுகின்றன.",U1T5:"பித்த உப்புகள் கொழுப்பை நுண்துகள்களாகப் பிரித்து மைசெல் உருவாக்கத்தை எளிதாக்குகின்றன. கணைய லைப்பேஸ், கோலைப்பேஸுடன் சேர்ந்து டிரைகிளிசரைட்களை மோனோகிளிசரைடுகள் மற்றும் கொழுப்பு அமிலங்களாக மாற்றுகிறது. இவை எண்டரோசைட்டுகளுக்குள் சென்று மீண்டும் எஸ்டரிபிகேஷன் செய்யப்பட்டு கைலோமைக்ரான்களாக அமைக்கப்படுகின்றன. கைலோமைக்ரான்கள் லாக்டீல்களில் நுழைந்து லிம்ப் வழியாக இரத்தத்தை அடைகின்றன; குறுகிய சங்கிலிக் கொழுப்பு அமிலங்கள் நேரடியாக போர்டல் இரத்தத்திற்குச் செல்லலாம்.",U1T6:"காற்றுக் கடத்துப் பகுதி காற்றை வடிகட்டி, சூடாக்கி, ஈரப்பதப்படுத்துகிறது; சுவாசப் பகுதி வாயுப் பரிமாற்றத்தை நடத்துகிறது. அமைதியான உள்ளிழுத்தல் செயற்பாட்டு நிகழ்வாகும்; டயஃப்ரம் மற்றும் வெளிப்புற இடைமார்பு தசைகள் சுருங்குவதால் மார்பு பருமன் அதிகரித்து அல்வியோலர் அழுத்தம் குறைகிறது. அமைதியான வெளியேற்றம் பொதுவாக நுரையீரலின் இலகுத் திரும்பும் பண்பால் நடைபெறுகிறது. Type II நியூமோசைட்டுகள் சுரக்கும் சர்ஃபாக்டன்ட் மேற்பரப்பு இழுவை குறைத்து அல்வியோலை சுருங்குவதைத் தடுக்கிறது.",U1T7:"ஆக்சிஜன் மற்றும் கார்பன் டையாக்சைடு தங்கள் பகுதி அழுத்த சரிவுகளின்படி பரவுகின்றன. ஆக்சிஜன் பெரும்பாலும் ஹீமோகுளோபினுடன் இணைந்து கடத்தப்படுகிறது. கார்பன் டையாக்சைடு, ஹைட்ரஜன் அயன், வெப்பநிலை மற்றும் 2,3-BPG அதிகரிப்பு ஹீமோகுளோபினின் ஆக்சிஜன் பற்றுதலைக் குறைத்து திசுக்களில் ஆக்சிஜன் விடுவிப்பை அதிகரிக்கிறது. கார்பன் டையாக்சைடு பெரும்பாலும் பைகார்பனேட் வடிவிலும், குறைந்த அளவில் கார்பமினோ மற்றும் கரைந்த வடிவங்களிலும் கடத்தப்படுகிறது.",U1T8:"மெடுல்லா சுவாசத் தாளத்தை உருவாக்குகிறது; பான்டைன் மையங்கள் அதை மாற்றியமைக்கின்றன. மத்திய வேதியுணர்விகள் கார்பன் டையாக்சைடு காரணமாக மூளைநாண் திரவத்தில் உருவாகும் ஹைட்ரஜன் அயன் மாற்றத்துக்கு பதிலளிக்கின்றன. கரோட்டிட் மற்றும் ஆர்டிக் உடல்களில் உள்ள புற வேதியுணர்விகள் கடுமையான தமனி ஆக்சிஜன் குறைபாட்டுக்கு வலுவாகச் செயல்படுகின்றன. நுரையீரல் உணர்விகள், உயர்நிலை மூளை மையங்கள் மற்றும் உடற்பயிற்சி ஆகியவையும் சுவாசத்தை மாற்றுகின்றன.",U2T1:"இரத்தம் பிளாஸ்மா மற்றும் உருவ உறுப்புகளால் ஆன சிறப்பு இணைப்புத் திசுவாகும். பிளாஸ்மாவில் நீர், மின்உப்புகள், ஊட்டச்சத்துகள், கழிவுகள், ஹார்மோன்கள் மற்றும் புரதங்கள் உள்ளன. உருவ உறுப்புகளில் எரித்ரோசைட்டுகள், லியூகோசைட்டுகள் மற்றும் பிளேட்லெட்டுகள் அடங்கும். இரத்தம் வாயுக்கள், ஊட்டச்சத்துகள், ஹார்மோன்கள் மற்றும் கழிவுகளை கடத்துவதோடு, வெப்பநிலை, pH, திரவ சமநிலை, நோய் எதிர்ப்பு மற்றும் ஹீமோஸ்டேசிஸையும் பராமரிக்கிறது.",U2T2:"பிளாஸ்மாவின் முக்கிய புரதங்கள் ஆல்புமின், குளோபுலின்கள் மற்றும் ஃபைப்ரினோஜன் ஆகும். கல்லீரலில் உருவாகும் ஆல்புமின் பிளாஸ்மா கொலாய்டு ஒஸ்மோட்டிக் அழுத்தத்தைப் பராமரித்து பல பொருட்களை கடத்துகிறது. ஆல்பா மற்றும் பீட்டா குளோபுலின்கள் கடத்தல், காம்ப்ளிமென்ட் மற்றும் உறைதல் செயல்களில் பங்கேற்கின்றன; காமா குளோபுலின்கள் எதிர் உடல்களாக செயல்படுகின்றன. ஃபைப்ரினோஜன் உறைதலின் போது ஃபைப்ரினாக மாற்றப்படுகிறது.",U2T3:"எரித்ரோசைட்டுகள் அணுவற்ற, இருபுறமும் பள்ளமுள்ள செல்களாக இருந்து ஹீமோகுளோபின் மூலம் சுவாச வாயுக்களை கடத்துகின்றன. நியூட்ரோபில்கள், ஈசினோபில்கள், பேசோபில்கள், லிம்போசைட்டுகள் மற்றும் மோனோசைட்டுகள் பல்வேறு நோய் எதிர்ப்பு பணிகளைச் செய்கின்றன. பிளேட்லெட்டுகள் மெகாகேரியோசைட்டுகளிலிருந்து உருவாகும் செல்துண்டுகள்; அவை முதன்மை ஹீமோஸ்டேசிஸ், உறைதல் ஆதரவு மற்றும் நாளத் திருத்தத்தில் பங்கேற்கின்றன. செல்களின் எண்ணிக்கை, வடிவம் மற்றும் செயல்பாடு ஒருங்கிணைத்து மதிப்பிடப்பட வேண்டும்.",U2T4B:"ஹீமோபோயிசிஸ் என்பது இரத்த அணுக்கள் தொடர்ந்து உருவாகும் செயல்முறையாகும். வயதானவர்களில் இது பெரும்பாலும் சிவப்பு எலும்பு மஜ்ஜையில் நடைபெறுகிறது. ஹீமடோபோயட்டிக் மூலச் செல்கள் மைலாய்டு மற்றும் லிம்பாய்டு முன்னோடி செல்களாகப் பிரிந்து பல்வேறு இரத்த அணுக்களை உருவாக்குகின்றன. எரித்ரோபோயிட்டின் சிவப்பு அணு உருவாக்கத்தையும், திராம்போபோயிட்டின் பிளேட்லெட் உருவாக்கத்தையும், காலனி தூண்டுக் காரணிகள் வெள்ளை அணு வரிசைகளையும் கட்டுப்படுத்துகின்றன.",U2T5B:"ABO இரத்தக் குழு எரித்ரோசைட் மேற்பரப்பிலுள்ள A மற்றும் B ஆன்டிஜன்களாலும், பிளாஸ்மாவில் இல்லாத ஆன்டிஜன்களுக்கு எதிரான எதிர்ப்பொருட்களாலும் நிர்ணயிக்கப்படுகிறது. பொருந்தாத இரத்த மாற்றம் தீவிர ஒட்டுணர்வு மற்றும் இன்ட்ராவாஸ்குலர் ஹீமோலைசிஸை ஏற்படுத்தலாம். Rh அமைப்பில் D ஆன்டிஜன் மிக முக்கியமானது; Anti-D இயற்கையாக இல்லாமல், இரத்தமாற்றம் அல்லது கர்ப்பம் மூலம் உருவாகலாம். இரத்தக் குழு பரிசோதனை, ஆன்டிபாடி ஸ்கிரீனிங் மற்றும் குறுக்கு பொருத்தம் பாதுகாப்பான மாற்றத்திற்குத் தேவையானவை.",U2T6B:"ஹீமோஸ்டேசிஸ் காயமடைந்த இரத்த நாளிடத்தில் இரத்த இழப்பை கட்டுப்படுத்துகிறது. முதலில் நாளச் சுருக்கம் ஏற்பட்டு, பின்னர் இரத்தத் தட்டுகள் வான் வில்லிபிராண்ட் காரணி உதவியுடன் ஒட்டிக்கொண்டு செயல்பட்டு திரளுகின்றன. இரண்டாம் நிலை ஹீமோஸ்டேசிஸில் உறைதல் காரணிகள் திராம்பினையும் ஃபைப்ரினையும் உருவாக்குகின்றன. இயற்கை எதிர்உறைதல் அமைப்புகள் மற்றும் பிளாஸ்மின் தேவையற்ற உறைதலைத் தடுத்து, உருவான உறையை பின்னர் அகற்றுகின்றன.",U2T7C:"இதயம் பெரிகார்டியத்தில் மூடப்பட்ட நான்கு அறைகள் கொண்ட தசைப் பம்பாகும். வலது இதயப்பகுதி ஆக்சிஜன் குறைந்த இரத்தத்தை நுரையீரலுக்கு அனுப்புகிறது; இடது இதயப்பகுதி ஆக்சிஜன் நிறைந்த இரத்தத்தை உடலுக்கு அனுப்புகிறது. அட்ரியோவென்ட்ரிக்குலர் மற்றும் செமிலூனர் வால்வுகள் அழுத்த வேறுபாட்டின்படி திறந்து மூடி பின்னோக்கி ஓட்டத்தைத் தடுக்கின்றன. இடது வென்ட்ரிக்கிள் உயர் சிஸ்டமிக் அழுத்தத்தை உருவாக்குவதால் அதன் சுவர் தடிப்பாக உள்ளது; கொரோனரி தமனிகள் மையோகார்டியத்திற்கு இரத்தம் வழங்குகின்றன.",U2T8C:"இதயத் தசை கோடுகளுடன், கிளைகளாகவும், இடையிணைப்புத் தட்டுகள் மூலம் மின்சாரமாக இணைக்கப்பட்டதாகவும் உள்ளது. நீண்ட செயல் மின்னழுத்தம் மற்றும் மீள்தூண்ட இயலாத காலம் காரணமாக டெட்டனஸ் ஏற்படாது. L-type கால்சியம் சேனல்கள் வழியாக நுழையும் கால்சியம், ryanodine ஏற்பிகள் மூலம் சர்கோபிளாஸ்மிக் ரெட்டிகுலத்திலிருந்து மேலும் கால்சியம் வெளியேற்றத்தைத் தூண்டும். கால்சியம் troponin C உடன் இணைந்து குறுக்குப்பாலச் சுழற்சியைத் தொடங்குகிறது; SERCA மற்றும் பிற கடத்திகள் கால்சியத்தை அகற்றி தளர்ச்சியை ஏற்படுத்துகின்றன.",U2T9C:"சைனோஅட்ரியல் நோடு இயல்பாக இதயத் துடிப்பைத் தொடங்குகிறது, ஏனெனில் அதற்கு அதிக உட்பிறப்பு இயற்கைத் துடிப்பாக்கி வீதம் உள்ளது. மின்தூண்டல் அட்ரியங்களில் பரவி atrioventricular நோடை அடைகிறது; அங்கு ஏற்படும் தாமதம் வென்ட்ரிக்கிள்கள் நிரம்ப நேரம் வழங்குகிறது. பின்னர் மின்தூண்டல் bundle of His, கட்டுக் கிளைகள் மற்றும் புர்கின்ஜி நார்கள் வழியாக விரைவாக வென்ட்ரிக்கிள்களுக்கு பரவுகிறது. sympathetic தூண்டல் வீதத்தையும் நடத்துதலையும் அதிகரிக்கிறது; parasympathetic தூண்டல் குறைக்கிறது.",U2T10C:"இதயச் சுழற்சி வென்ட்ரிக்குலர் நிரப்பு, isovolumetric contraction, ejection மற்றும் isovolumetric relaxation ஆகிய கட்டங்களைக் கொண்டது. வால்வுகளின் திறப்பு மற்றும் மூடல் அழுத்த வேறுபாட்டின் இயல்பான விளைவாகும். முதல் இதய ஒலி AV வால்வுகள் மூடுவதாலும், இரண்டாவது இதய ஒலி semilunar வால்வுகள் மூடுவதாலும் உருவாகிறது. End-diastolic பருமனிலிருந்து end-systolic பருமனை கழித்தால் ஒவ்வொரு துடிப்பிலும் வெளியேறும் இரத்த அளவு கிடைக்கும்; ஒவ்வொரு துடிப்பிலும் வெளியேறும் இரத்த அளவு/EDV என்பது வெளியேற்ற விகிதம் ஆகும்.",U2T11C:"ECG என்பது இதய மின்செயலால் உடல் மேற்பரப்பில் உருவாகும் மின்னழுத்த வேறுபாடுகளைப் பதிவு செய்கிறது. P அலை அட்ரியல் மின்தளர்ச்சியை, QRS தொகுப்பு வென்ட்ரிக்குலர் மின்தளர்ச்சியை, T அலை வென்ட்ரிக்குலர் மீள்மின்னாக்கத்தை குறிக்கிறது. PR இடைவெளி அட்ரியாவிலிருந்து அட்ரியோவென்ட்ரிக்குலர் நோடு வழியாக வென்ட்ரிக்கிள்களுக்கு மின்தூண்டல் செல்லும் நேரத்தை பிரதிபலிக்கிறது. ECG மின்செயலை மட்டுமே பதிவு செய்கிறது; இயந்திரச் சுருக்கத்தை நேரடியாகப் பதிவு செய்யாது.",U2T12C:"இதய வெளியீடு (இதய வெளியீடு) என்பது ஒரு வென்ட்ரிக்கிள் ஒரு நிமிடத்தில் வெளியேற்றும் இரத்த அளவாகும்; அது இதயத் துடிப்பு வீதம் × ஒவ்வொரு துடிப்பிலும் வெளியேறும் இரத்த அளவு எனக் கணக்கிடப்படுகிறது. வெளியீட்டு அளவை முன்சுமை (preload), பின்சுமை (afterload) மற்றும் சுருக்க வலிமை (contractility) நிர்ணயிக்கின்றன. நிலையான நிலையில் சிரை வழியாக இதயத்திற்குத் திரும்பும் இரத்த அளவும் இதய வெளியீடும் சமமாக இருக்கும். ஃபிராங்க்–ஸ்டார்லிங் விதிப்படி இயல்பான வரம்பிற்குள் அதிக நிரப்பு அதிக சுருக்க வலிமையை ஏற்படுத்துகிறது.",U2T13C:"தமனி இரத்த அழுத்தம் முதன்மையாக இதய வெளியீடு மற்றும் மொத்த புறநாள எதிர்ப்பு ஆகியவற்றின் விளைவாகும். Pulse pressure என்பது systolic மற்றும் diastolic அழுத்தங்களின் வேறுபாடு; mean arterial pressure சுமார் diastolic pressure + pulse அழுத்தத்தின் மூன்றில் ஒன்று ஆகும். சிறுதமனிகள் முக்கிய எதிர்ப்புநாள்கள்; சிரைகள் முக்கிய இரத்த சேமிப்பு நாள்கள். Baroஏற்பி reflex குறுகியகால கட்டுப்பாட்டையும், சிறுநீரக சோடியம்-நீர் சமநிலை நீண்டகால கட்டுப்பாட்டையும் வழங்குகிறது.",U2T14C:"Pulmonary circulation வலது வென்ட்ரிக்கிளிலிருந்து ஆக்சிஜன் குறைந்த இரத்தத்தை நுரையீரலுக்கு கொண்டு சென்று இடது அட்ரியத்திற்கு திருப்புகிறது. Systemic circulation இடது வென்ட்ரிக்கிளிலிருந்து திசுக்களுக்கு இரத்தத்தை வழங்கி வலது அட்ரியத்திற்கு திருப்புகிறது. Coronary circulation இதயத் தசைக்கு இரத்தத்தை வழங்குகிறது. Hepatic portal circulation குடலிலிருந்து ஊட்டச்சத்து நிறைந்த இரத்தத்தை கல்லீரலுக்கு அனுப்புகிறது; foetal சுழற்சியில் ductus venosus, foramen ovale மற்றும் ductus arteriosus முக்கியப் பாதைகளாக உள்ளன.",U2T15R:"சிறுநீரகங்கள் வயிற்றறையின் பின்புறச் சுவரில் அமைந்துள்ள ஜோடி உறுப்புகள். ஒவ்வொரு சிறுநீரகமும் புறணி, மஜ்ஜை மற்றும் சிறுநீரகப் பள்ளம் ஆகிய பகுதிகளைக் கொண்டுள்ளது. புறணியில் சிறுநீரகக் கோர்ப்பஸ்கிள்களும் சுருண்ட குழாய்களும் காணப்படுகின்றன; மஜ்ஜையில் ஹென்லே வளைவுகளும் சேகரிப்புக் குழாய்களும் சிறுநீரகப் பிரமிடுகளாக அமைந்துள்ளன. உருவான சிறுநீர் சேகரிப்புக் குழாய்கள், சிறு மற்றும் பெரிய கிண்ணங்கள், சிறுநீரகப் பள்ளம், சிறுநீர்க்குழாய் ஆகியவற்றின் வழியாகச் செல்கிறது.",U2T16R:"நெஃப்ரான் சிறுநீரகத்தின் கட்டமைப்பு மற்றும் செயற்பாட்டு அலகாகும். இது சிறுநீரகக் கோர்ப்பஸ்கிள் மற்றும் சிறுநீரகக் குழாய் ஆகியவற்றைக் கொண்டுள்ளது. கோர்ப்பஸ்கிளில் குளோமெருலஸும் போமனின் காப்சியூலும் உள்ளன; குழாய்ப் பகுதியில் அண்மைக் குழாய், ஹென்லே வளைவு, தொலைக் குழாய் மற்றும் இணைப்புக் குழாய் காணப்படுகின்றன. புறணி நெஃப்ரான்களுக்கு குறுகிய வளைவுகளும், மஜ்ஜை அண்டிய நெஃப்ரான்களுக்கு நீண்ட வளைவுகளும் இருப்பதால் பிந்தையவை செறிவூட்டப்பட்ட சிறுநீர் உருவாக்கத்தில் முக்கியப் பங்கு வகிக்கின்றன.",U2T17R:"குளோமெருலர் வடிகட்டல் என்பது குளோமெருலர் நுண்குழாய்களிலிருந்து நீரும் சிறிய கரைபொருட்களும் போமனின் இடத்திற்குச் செல்லும் செயல்முறையாகும். வடிகட்டல் தடுப்பு துளைகள் கொண்ட எண்டோத்தீலியம், குளோமெருலர் அடிப்படைப் படலம் மற்றும் போடோசைட் கால்களுக்கிடையிலான வடிகட்டல் பிளவுகள் ஆகிய மூன்று அடுக்குகளால் ஆனது. குளோமெருலர் நீரழுத்தம் வடிகட்டலை ஊக்குவிக்கிறது; போமனின் இட அழுத்தமும் பிளாஸ்மா ஒன்காட்டிக் அழுத்தமும் அதை எதிர்க்கின்றன. மையோஜெனிக் பதிலும் குழாய்–குளோமெருலர் பின்னூட்டமும் குளோமெருலர் வடிகட்டல் வீதத்தைத் தன்னியக்கமாகக் கட்டுப்படுத்துகின்றன.",U2T18R:"குழாய் மீள்உறிஞ்சுதல் என்பது வடிகட்டப்பட்ட நீரும் தேவையான கரைபொருட்களும் சிறுநீரகக் குழாயிலிருந்து மீண்டும் இரத்தத்திற்குச் செல்லும் செயல்முறையாகும். அண்மைக் குழாய் பெரும்பாலான சோடியம், நீர், பைகார்பனேட், குளுக்கோஸ் மற்றும் அமினோ அமிலங்களை மீள்உறிஞ்சுகிறது. ஹென்லே வளைவின் இறங்கும் மற்றும் ஏறும் பகுதிகள் நீரையும் உப்புகளையும் வேறுபட்ட முறையில் கையாளுகின்றன. தொலைக் குழாய் மற்றும் சேகரிப்புக் குழாய் ஹார்மோன்களின் கட்டுப்பாட்டில் இறுதி நுணுக்க ஒழுங்குபடுத்தலைச் செய்கின்றன.",U2T19R:"குழாய் சுரப்பு என்பது தேர்ந்தெடுக்கப்பட்ட பொருட்களை பெரிட்யூபுலர் நுண்குழாய் இரத்தத்திலிருந்து சிறுநீரகக் குழாய்த் திரவத்திற்குக் கொண்டு செல்லும் செயல்முறையாகும். அண்மைக் குழாய் பல கரிம அமிலங்கள், கரிமக் காரங்கள், மருந்துகள் மற்றும் வளர்சிதை மாற்றப் பொருட்களைச் சுரக்கிறது. தொலைப் பகுதிகள் ஹைட்ரஜன் மற்றும் பொட்டாசியம் அயன்களை கட்டுப்படுத்தப்பட்ட முறையில் சுரக்கின்றன. இச்செயல் அமில–காரச் சமநிலை, பொட்டாசியம் சமநிலை மற்றும் புரதத்துடன் இணைந்த பொருட்களின் வெளியேற்றத்திற்கு உதவுகிறது.",U2T20R:"எதிரோட்டப் பெருக்கி ஹென்லே வளைவில் புறணி–மஜ்ஜை ஒஸ்மோட்டிக் சரிவை உருவாக்குகிறது. மெல்லிய இறங்கும் பகுதி நீருக்கு அதிக ஊடுபுகுதன்மை கொண்டது; தடிமனான ஏறும் பகுதி சோடியம், பொட்டாசியம் மற்றும் குளோரைடு அயன்களை மீள்உறிஞ்சினாலும் நீருக்கு ஊடுபுகாது. எதிர்திசை ஓட்டத்தில் தொடர்ந்து நிகழும் இந்த வேறுபாடு சிறிய குறுக்குச் சரிவை பெரிய நீளச் சரிவாகப் பெருக்குகிறது. நீண்ட வளைவுகள் கொண்ட மஜ்ஜை அண்டிய நெஃப்ரான்கள் இதில் முக்கியப் பங்கு வகிக்கின்றன.",U2T21R:"வாசா ரெக்டா எதிரோட்டப் பரிமாற்றத்தின் மூலம் மஜ்ஜையின் ஒஸ்மோட்டிக் சரிவைப் பாதுகாக்கிறது. அதன் தலைமுடி முள் போன்ற வடிவமும் மெதுவான இரத்த ஓட்டமும் சரிவு குலையாமல் நீர் மற்றும் கரைபொருள் பரிமாற்றம் நடைபெற உதவுகின்றன. கீழிறங்கும் போது இரத்தம் கரைபொருளைப் பெற்று நீரை இழக்கிறது; மேலேறும் போது கரைபொருளை இழந்து நீரைப் பெறுகிறது. இதனால் மஜ்ஜைக்கு இரத்தம் கிடைத்தாலும் ஒஸ்மோட்டிக் சரிவு கழுவிச் செல்லாமல் காக்கப்படுகிறது.",U2T22R:"சிறுநீர் செறிவூட்டல் மஜ்ஜையின் ஒஸ்மோட்டிக் சரிவும் சேகரிப்புக் குழாயின் மாறக்கூடிய நீர் ஊடுபுகுதன்மையும் மீது சார்ந்துள்ளது. எதிர்மூத்திர ஹார்மோன், பிரின்சிபல் செல்களின் மேற்பரப்புப் படலத்தில் அக்வாபோரின்-2 நீர்வாயில்களைச் சேர்த்து நீர் மீள்உறிஞ்சுதலை அதிகரிக்கிறது. இந்த ஹார்மோன் குறைந்தால் சேகரிப்புக் குழாய்கள் நீருக்கு குறைவாக ஊடுபுகுவதால் நீர்த்த சிறுநீர் உருவாகிறது. யூரியா மறுசுழற்சி உள் மஜ்ஜையின் அதிக ஒஸ்மோட்டிக் தன்மையை நிலைநிறுத்த உதவுகிறது.",U2T23R:"சிறுநீரகச் செயற்பாடு உட்புற தன்னியக்கக் கட்டுப்பாடு, சிம்பத்தெட்டிக் நரம்புகள் மற்றும் பல ஹார்மோன்களால் ஒழுங்குபடுத்தப்படுகிறது. தன்னியக்கக் கட்டுப்பாடு ஒரு குறிப்பிட்ட வரம்பிற்குள் சிறுநீரக இரத்த ஓட்டத்தையும் குளோமெருலர் வடிகட்டல் வீதத்தையும் நிலையாக வைத்திருக்கிறது. கடுமையான இரத்த அளவு குறைவில் சிம்பத்தெட்டிக் தூண்டல் சிறுநீரக நாள்களைச் சுருக்கி ரெனின் வெளியீட்டை அதிகரிக்கிறது. ஆஞ்சியோடென்சின் II, ஆல்டோஸ்டிரோன், எதிர்மூத்திர ஹார்மோன், நேட்ரியூரெடிக் பெப்டைட்கள் மற்றும் பாராதைராய்டு ஹார்மோன் ஆகியவை நாள்தசைத் தொனியையோ குழாய்க் கடத்தலையோ மாற்றுகின்றன.",U2T24R:"சிறுநீர் கழித்தல் என்பது பான்டைன் மற்றும் பெருமூளை மையங்களால் மாற்றியமைக்கப்படும் முதுகுநாண் பிரதிபலிப்பாகும். சிறுநீர்ப்பை நிரம்பும்போது நீட்டல் உணர்விகள் தூண்டப்பட்டு உணர்வு தகவல்கள் சாக்ரல் முதுகுநாணை அடைகின்றன. பாராசிம்பத்தெட்டிக் நரம்புகள் டெட்ரூசர் தசையைச் சுருக்கி உள்புற சிறுநீர்க்குழாய் சுருக்குத் தசையின் எதிர்ப்பைக் குறைக்கின்றன. புடெண்டல் நரம்பு வழியாக வெளிப்புற சிறுநீர்க்குழாய் சுருக்குத் தசை விருப்ப கட்டுப்பாட்டில் இருந்து, சரியான ஒருங்கிணைப்பால் சிறுநீர் வெளியேற்றம் நடைபெறுகிறது.",U2T25R:"சிறுநீரகங்கள் வடிகட்டப்பட்ட பைகார்பனேட்டை மீள்உறிஞ்சி, ஹைட்ரஜன் அயன்களைச் சுரந்து, புதிய பைகார்பனேட்டை உருவாக்குகின்றன. அண்மைக் குழாய் கார்போனிக் அன்ஹைட்ரேஸ் சார்ந்த முறையில் பெரும்பாலான பைகார்பனேட்டை மீட்டெடுக்கிறது. தொலை நெஃப்ரானின் இடைநுழைவு செல்கள் ஹைட்ரஜன் அயன்களைச் சுரந்து சிறுநீரை அமிலமாக்குகின்றன. பாஸ்பேட் தாங்கல் மற்றும் அமோனியம் வெளியேற்றம் உடலிலிருந்து நிகர அமிலத்தை அகற்ற உதவுகின்றன.",U2T26R:"ரெனின்–ஆஞ்சியோடென்சின்–ஆல்டோஸ்டிரோன் அமைப்பு சிறுநீரகப் பரவல் அழுத்தம் குறைதல், மாகுலா டென்சாவுக்கு சோடியம் குளோரைடு வருகை குறைதல் அல்லது சிம்பத்தெட்டிக் தூண்டல் அதிகரித்தல் ஆகியவற்றால் செயல்படுகிறது. ரெனின், ஆஞ்சியோடென்சினோஜனை ஆஞ்சியோடென்சின் I ஆக மாற்றுகிறது; ACE அதை ஆஞ்சியோடென்சின் II ஆக மாற்றுகிறது. ஆஞ்சியோடென்சின் II நாள்சுருக்கம், ஆல்டோஸ்டிரோன் மற்றும் எதிர்மூத்திர ஹார்மோன் வெளியீடு, தாகம் மற்றும் அண்மைக் குழாய் சோடியம் மீள்உறிஞ்சுதலை அதிகரிக்கிறது. ஆல்டோஸ்டிரோன் தொலை நெஃப்ரானில் சோடியம் தக்கவைப்பையும் பொட்டாசியம் சுரப்பையும் உயர்த்துகிறது.",U2T27R:"எதிர்மூத்திர ஹார்மோன் சேகரிப்புக் குழாயின் நீர் ஊடுபுகுதன்மையை கட்டுப்படுத்துகிறது. ஆல்டோஸ்டிரோன் சோடியம் மீள்உறிஞ்சுதலையும் பொட்டாசியம் சுரப்பையும் அதிகரிக்கிறது. ANP மற்றும் BNP சோடியம் வெளியேற்றத்தை ஊக்குவித்து ரெனின்–ஆஞ்சியோடென்சின்–ஆல்டோஸ்டிரோன் அமைப்புக்கு எதிராகச் செயல்படுகின்றன. பாராதைராய்டு ஹார்மோன் கால்சியம் மீள்உறிஞ்சுதலை அதிகரித்து பாஸ்பேட் மீள்உறிஞ்சுதலைக் குறைக்கிறது. இவ்வாறு சிறுநீரகம் நீர் மற்றும் மின்உப்புச் சமநிலையை ஒருங்கிணைக்கிறது.",U2T28R:"சிறுநீரகத் தெளிவு என்பது ஒரு நேர அலகில் ஒரு பொருளிலிருந்து முழுமையாகச் சுத்தப்படுத்தப்பட்டதாகக் கருதப்படும் பிளாஸ்மா அளவாகும். அதன் சமன்பாடு: சிறுநீர் செறிவு × சிறுநீர் ஓட்டம் ÷ பிளாஸ்மா செறிவு. இனுலின் வடிகட்டப்பட்டாலும் மீள்உறிஞ்சப்படவோ சுரக்கப்படவோ இல்லாததால் அதன் தெளிவு குளோமெருலர் வடிகட்டல் வீதத்தை நெருக்கமாக அளவிடுகிறது. கிரியேட்டினின் தெளிவு மருத்துவத்தில் வசதியானது; ஆனால் சிறிய குழாய் சுரப்பு காரணமாக வடிகட்டல் வீதத்தைச் சற்று அதிகமாக மதிப்பிடலாம்.",U2T29R:"சிறுநீராய்வு சிறுநீரின் உடற் பண்புகள், வேதியியல் கூறுகள் மற்றும் நுண்ணோக்கி அடித்தட்டை மதிப்பிடுகிறது. புரதச்சிறுநீர் குளோமெருலர் தடுப்பு சேதத்தைக் குறிக்கலாம்; குளுக்கோஸ் சிறுநீர், வடிகட்டப்பட்ட குளுக்கோஸ் குழாயின் கடத்துத் திறனை மீறும்போதோ அண்மைக் குழாய் கோளாறிலோ ஏற்படலாம். இரத்தச்சிறுநீர், சிறுநீர்க் குழாய் வார்ப்புகள், படிகங்கள் மற்றும் ஒப்பீட்டு அடர்த்தி மாற்றங்கள் நோயறிதலுக்கு உதவுகின்றன. திடீர் சிறுநீரக காயம் வேகமாக உருவாகும் செயற்பாட்டு இழப்பு; நீடித்த சிறுநீரக நோய் நீண்டகால கட்டமைப்பு அல்லது செயற்பாட்டு கோளாறு ஆகும்.",U3T1:"நியூரானில் செல்கூடு, டென்ட்ரைட்டுகள் மற்றும் ஆக்சான் ஆகிய முக்கிய பகுதிகள் உள்ளன. டென்ட்ரைட்டுகள் பெரும்பாலும் தகவலைப் பெறுகின்றன; ஆக்சான் மின்தூண்டலை செல்கூட்டிலிருந்து வெளியே கொண்டு செல்கிறது. மையலின் உறை மின்கடத்தல் வேகத்தை அதிகரிக்கிறது; ரான்வியர் கணுக்களில் மின்னழுத்தக் கட்டுப்பாட்டு அயன் வாயில்கள் அதிகமாக உள்ளன. புற நரம்பு மண்டலத்தில் ஷ்வான் செல்களும், மைய நரம்பு மண்டலத்தில் ஒலிகோடென்ட்ரோசைட்டுகளும் மையலின் உறையை உருவாக்குகின்றன.",U3T2:"ஓய்வு நிலைப் படல மின்னழுத்தம் சமமற்ற அயன் பகிர்வு, தேர்ந்தெடுக்கப்பட்ட படல ஊடுபுகுதன்மை மற்றும் மின்செயற்பாட்டு கடத்தல் காரணமாக உருவாகிறது. ஓய்வுநிலையில் நியூரான் படலம் சோடியத்தை விட பொட்டாசியத்திற்கு அதிகமாக ஊடுபுகுகிறது. Na⁺/K⁺-ATPase ஒவ்வொரு ATP மூலக்கூறுக்கும் மூன்று சோடியம் அயன்களை வெளியேற்றி இரண்டு பொட்டாசியம் அயன்களை உள்ளே கொண்டு வந்து அயன் சரிவுகளைப் பராமரிக்கிறது. பொட்டாசியம் கசிவு வாயில்கள் ஓய்வு மின்னழுத்தத்தின் முக்கிய நிர்ணயிகளாகும்.",U3T3:"படல மின்னழுத்தம் வரம்பு மின்னழுத்தத்தை அடைந்தவுடன் மின்னழுத்தக் கட்டுப்பாட்டு சோடியம் வாயில்கள் திறந்து சோடியம் அயன்கள் வேகமாக உள்ளே நுழைகின்றன. பின்னர் சோடியம் வாயில்கள் செயலிழப்பதாலும் பொட்டாசியம் வாயில்கள் தாமதமாகத் திறப்பதாலும் மீள்மின்னாக்கம் ஏற்படுகிறது. சிறிது காலம் நீடிக்கும் பொட்டாசியம் கடத்துத்திறன் பிந்தைய அதிக மின்னாக்கத்தை ஏற்படுத்துகிறது. செயல் மின்னழுத்தம் அனைத்தோ-அல்லதோ தன்மை கொண்டது; தூண்டலின் வலிமை பெரும்பாலும் தூண்டல் நிகழ்வுகளின் அதிர்வெண்ணால் குறிக்கப்படுகிறது.",U3T4:"மையலின் இல்லாத ஆக்சான்களில் செயல் மின்னழுத்தம் படலத்தின் ஒவ்வொரு பகுதியிலும் தொடர்ச்சியாக மீண்டும் உருவாகிறது. மையலின் கொண்ட ஆக்சான்களில் உள்ளூர் மினோட்டம் மையலின் கீழ் விரைவாகப் பரவி ரான்வியர் கணுக்களில் மட்டும் செயல் மின்னழுத்தம் புதுப்பிக்கப்படுகிறது; இதுவே தாவல் மின்கடத்தல். ஆக்சான் விட்டம் அதிகரிப்பதும் மையலின் இருப்பதும் கடத்தல் வேகத்தை உயர்த்துகின்றன. மையலின் இழப்பு மினோட்டக் கசிவை அதிகரித்து கடத்தலை மெதுவாக்கவோ தடுக்கவோ முடியும்.",U3T5:"செயல் மின்னழுத்தம் முன்இணைப்புத் முனையை அடைந்தவுடன் மின்னழுத்தக் கட்டுப்பாட்டு கால்சியம் வாயில்கள் திறக்கின்றன. கால்சியம் அயன்கள் உள்ளே நுழைவதால் இணைப்பிடச் சிறுபைகள் படலத்துடன் இணைந்து நரம்புத் தூதுப்பொருளை வெளியிடுகின்றன. வெளியான தூதுப்பொருள் பின்இணைப்புக் ஏற்பிகளுடன் இணைந்து தூண்டும் அல்லது தடுக்கும் மின்னழுத்த மாற்றங்களை உருவாக்குகிறது. நொதி உடைப்பு, மீள்எடுத்தல் அல்லது பரவல் மூலம் அந்தச் சிக்னல் முடிவடைகிறது.",U3T6:"பிரதிபலிப்பு வளைவு உணர்வி, உணர்வு நரம்பு, ஒருங்கிணைப்பு மையம், இயக்க நரம்பு மற்றும் செயற்படுத்தி ஆகியவற்றைக் கொண்டுள்ளது. ஒற்றை இணைப்பிட நீட்டல் பிரதிபலிப்பில் ஒரே மைய இணைப்பு இருக்கும்; விலகல் பிரதிபலிப்பு பல இணைப்பிடங்களைக் கொண்டது. பரஸ்பரத் தடுப்பு இயக்கத் தசை செயல்படும் போது எதிர்த்தசையைத் தடுக்கிறது. பிரதிபலிப்புகள் தன்னியக்கமானவை என்றாலும் உயர்நிலை நரம்பு மையங்கள் அவற்றை மாற்றியமைக்க முடியும்.",U3T7:"சார்கோமியர் இரண்டு Z தட்டுகளுக்கிடையிலான தசைச் சுருக்க அலகாகும். மெல்லிய நார்கள் ஆக்டின், டிரோபோமயோசின் மற்றும் டிரோபோனின் ஆகியவற்றைக் கொண்டுள்ளன; தடிமனான நார்கள் மயோசினைக் கொண்டுள்ளன. சுருக்கத்தின் போது நார்கள் தாமே குறையாமல் ஒன்றின் மீது ஒன்று வழுக்கிச் செல்கின்றன. A பட்டை மாறாமல் இருக்கும்; I பட்டையும் H பகுதியும் குறைகின்றன.",U3T8:"இயக்க நரம்பின் முனை அசிட்டைல்கோலினை வெளியிடுகிறது. அது தசை இறுதித்தட்டிலுள்ள நிகோட்டினிக் ஏற்பிகளுடன் இணைந்து இறுதித்தட்டு மின்னழுத்தத்தை உருவாக்கி தசை செயல் மின்னழுத்தத்தைத் தொடங்குகிறது. அசிட்டைல்கோலினெஸ்டரேஸ் அசிட்டைல்கோலினை உடைத்து சிக்னலை நிறுத்துகிறது. மையஸ்தீனியா கிராவிஸில் செயல்படும் பின்இணைப்புக் நிகோட்டினிக் ஏற்பிகள் குறைவதால் மீள்மீள் செயற்பாட்டில் தசை பலவீனம் அதிகரிக்கிறது.",U3T9:"தசை செயல் மின்னழுத்தம் சார்கோலெம்மா மற்றும் T குழாய்கள் வழியாகப் பரவுகிறது. டைஹைட்ரோபைரிடின் ஏற்பிகள் மின்னழுத்த உணர்விகளாகச் செயல்பட்டு ரியானோடைன் ஏற்பிகளைத் திறக்கச் செய்கின்றன; இதனால் சர்கோபிளாஸ்மிக் ரெட்டிகுலத்திலிருந்து கால்சியம் வெளியேறுகிறது. கால்சியம் டிரோபோனின் C உடன் இணைந்து டிரோபோமயோசினை நகர்த்தி ஆக்டின்–மயோசின் குறுக்குப்பாலச் சுழற்சியைத் தொடங்குகிறது. SERCA கால்சியத்தை மீண்டும் சர்கோபிளாஸ்மிக் ரெட்டிகுலத்திற்குக் கொண்டு சென்று தளர்ச்சியை ஏற்படுத்துகிறது.",U3T10:"தசை ஆற்றல், சேமிக்கப்பட்ட ATP, பாஸ்போகிரியேட்டின், கிளைகாலிசிஸ் மற்றும் ஆக்சிடேட்டிவ் பாஸ்போரிலேஷன் ஆகியவற்றிலிருந்து பெறப்படுகிறது. பாஸ்போகிரியேட்டின் மிக வேகமான குறுகியகால ATP ஆதாரமாகச் செயல்படுகிறது. வகை I நார்கள் மெதுவாகச் சுருங்கி ஆக்சிடேட்டிவ் வளர்சிதை மாற்றம் அதிகமுள்ளதால் சோர்வைத் தாங்குகின்றன; வகை II நார்கள் வேகமாகவும் அதிக சக்தியுடனும் சுருங்குகின்றன. தசைச் சோர்வு மைய நரம்புத் தூண்டல், வளர்சிதை மாற்றப் பொருட்கள், அயன் சரிவுகள், கால்சியம் கையாளல் மற்றும் ஆற்றல் மூலங்களின் கிடைப்புத் தன்மை ஆகிய பல காரணிகளின் விளைவாகும்.",U4T1:"ஹார்மோன்கள் குறிப்பிட்ட ஏற்பிகள் கொண்ட இலக்கு செல்களில் செயல்படும் வேதியியல் தூதர்களாகும். பெப்டைடு மற்றும் கேடகோலமின் ஹார்மோன்கள் பொதுவாக படல ஏற்பிகள் மற்றும் இரண்டாம் நிலைத் தூதர்கள் வழியாகச் செயல்படுகின்றன. ஸ்டீராய்டு மற்றும் தைராய்டு ஹார்மோன்கள் பெரும்பாலும் செல்லக ஏற்பிகளுடன் இணைந்து மரபணு படியெடுத்தலை மாற்றுகின்றன. ஹார்மோன் செறிவு, ஏற்பி எண்ணிக்கை, பற்றுத்திறன் மற்றும் செல்லகச் சிக்னல் பரிமாற்றம் ஆகியவை பதிலின் வலிமையை நிர்ணயிக்கின்றன.",U4T2:"ஹைப்போதாலமஸின் வெளியீட்டு மற்றும் தடுப்பு ஹார்மோன்கள் பிட்யூட்டரி போர்டல் நாள்கள் வழியாக முன்புற பிட்யூட்டரியை கட்டுப்படுத்துகின்றன. முன்புற பிட்யூட்டரி GH, புரோலாக்டின், ACTH, TSH, FSH மற்றும் LH ஆகியவற்றைச் சுரக்கிறது. பின்புற பிட்யூட்டரி ஹைப்போதாலமிக் நியூரான்களில் உருவான ஆக்சிடோசின் மற்றும் எதிர்மூத்திர ஹார்மோனைச் சேமித்து வெளியிடுகிறது. பெரும்பாலான உள்சுரப்பி அச்சுகள் எதிர்மறைப் பின்னூட்டத்தால் கட்டுப்படுத்தப்படுகின்றன.",U4T3:"தைராய்டு பை செல்கள் அயோடைடும் தைரோகுளோபுலினும் பயன்படுத்தி T₄ மற்றும் T₃ ஹார்மோன்களை உருவாக்குகின்றன. தைராய்டு பெராக்சிடேஸ் அயோடைடு ஆக்சிடேஷன், ஆர்கனிபிகேஷன் மற்றும் இணைப்பு ஆகிய முக்கியச் செயல்களைத் தூண்டுகிறது. தைராய்டு ஹார்மோன்கள் வளர்சிதைச் செயல்திறன், உடல் வளர்ச்சி மற்றும் நரம்பு மண்டல வளர்ச்சிக்கு அவசியமானவை. TSH தைராய்டு சுரப்பியைத் தூண்டுகிறது; இரத்தத்தில் சுழலும் தைராய்டு ஹார்மோன்கள் எதிர்மறைப் பின்னூட்டத்தை வழங்குகின்றன.",U4T4:"வெளிச் செல்லிட கால்சியம் குறையும்போது பாராதைராய்டு ஹார்மோன் சுரப்பு அதிகரிக்கிறது. இந்த ஹார்மோன் சிறுநீரக கால்சியம் மீள்உறிஞ்சுதலை அதிகரித்து பாஸ்பேட் மீள்உறிஞ்சுதலைக் குறைக்கிறது; மேலும் செயற்பாட்டிலுள்ள வைட்டமின் D உருவாக்கத்தை ஊக்குவிக்கிறது. செயற்பாட்டிலுள்ள வைட்டமின் D குடலில் கால்சியம் மற்றும் பாஸ்பேட் உறிஞ்சுதலை அதிகரிக்கிறது. பாராதைராய்டு ஹார்மோன் எலும்பு கரைதலை மறைமுகமாகத் தூண்டி இரத்தக் கால்சியம் அளவை உயர்த்துகிறது.",U4T5:"அட்ரினல் புறணி மினரலோகார்டிகாய்டுகள், குளுகோகார்டிகாய்டுகள் மற்றும் அட்ரினல் ஆன்ட்ரோஜன்களை உற்பத்தி செய்கிறது. சோனா குளோமெருலோசா ஆல்டோஸ்டிரோனையும், சோனா ஃபாசிகுலேட்டா கார்டிசாலையும், சோனா ரெட்டிகுலாரிஸ் ஆன்ட்ரோஜன்களையும் உற்பத்தி செய்கின்றன. ஆல்டோஸ்டிரோன் சோடியம் தக்கவைத்தலையும் பொட்டாசியம் சுரப்பையும் அதிகரிக்கிறது; கார்டிசால் வளர்சிதை மற்றும் மனஅழுத்தத் தழுவலை ஆதரிக்கிறது. அட்ரினல் மஜ்ஜை சிம்பத்தெட்டிக் கட்டுப்பாட்டில் அட்ரினலின் மற்றும் நோரட்ரினலினை வெளியிடுகிறது.",U4T6:"கணைய பீட்டா செல்கள் இன்சுலினையும், ஆல்பா செல்கள் குளுககானையும், டெல்டா செல்கள் சோமாடோஸ்டாட்டினையும் சுரக்கின்றன. இன்சுலின் எலும்புத்தசை மற்றும் கொழுப்புத் திசுவில் GLUT4 கடத்திகளை படலத்திற்குக் கொண்டு வந்து குளுக்கோஸ் உட்சேர்க்கையை அதிகரிக்கிறது; கிளைகோஜன், கொழுப்பு மற்றும் புரத உருவாக்கத்தையும் ஊக்குவிக்கிறது. குளுககான் கல்லீரலில் கிளைகோஜன் உடைதல் மற்றும் புதுக் குளுக்கோஸ் உருவாக்கம் மூலம் இரத்தக் குளுக்கோஸை உயர்த்துகிறது. இந்த இரு ஹார்மோன்களின் சமநிலை குளுக்கோஸ் சமநிலையைப் பாதுகாக்கிறது.",U4T7:"ஆண்களில் LH, லெய்டிக் செல்களைத் தூண்டி டெஸ்டோஸ்டிரோன் உருவாக்கச் செய்கிறது; FSH மற்றும் டெஸ்டோஸ்டிரோன், செர்டோலி செல்கள் வழியாக விந்தணு உருவாக்கத்தை ஆதரிக்கின்றன. பெண்களில் முட்டைப்பை நுண்ணறைகள் ஈஸ்ட்ரோஜனை உற்பத்தி செய்கின்றன; கார்பஸ் லூட்டியம் புரோஜெஸ்டிரோன் மற்றும் ஈஸ்ட்ரோஜனைச் சுரக்கிறது. துடிப்புச் சுழற்சியுடன் வெளிவரும் GnRH பிட்யூட்டரி LH மற்றும் FSH சுரப்பைத் தக்கவைக்கிறது. தொடர்ந்து, துடிப்பில்லாமல் வழங்கப்படும் GnRH ஏற்பி உணர்திறன் குறைவால் கோனாடோட்ரோபின் சுரப்பைக் குறைக்கிறது.",U4T8:"G புரதத்துடன் இணைந்த ஏற்பிகள் cAMP–PKA அல்லது IP₃/DAG–PKC பாதைகளை இயக்கலாம். டைரோசின் கைனேஸ் வகை ஏற்பிகள் தூண்டுப்பொருள் இணைந்த பின் தாமே பாஸ்போரிலேஷன் அடைகின்றன; இன்சுலின் ஏற்பி இதற்குச் சிறந்த உதாரணம். சைட்டோகைன் ஏற்பிகள் பொதுவாக JAK–STAT பாதையைப் பயன்படுத்துகின்றன. செல்லக ஏற்பிகள் மரபணு படியெடுத்தலை மாற்றுகின்றன; பாஸ்பேடேஸ்கள், GTP உடைதல், ஏற்பி உட்சேர்த்தல் மற்றும் பின்னூட்டம் ஆகியவை சிக்னலை நிறுத்துகின்றன.",U4T9:"எதிர்மறைப் பின்னூட்டம் உள்சுரப்பி மாறிலிகளை நிலையான வரம்பில் வைத்திருக்கிறது. நேர்மறைப் பின்னூட்டம் LH எழுச்சி மற்றும் பிரசவம் போன்ற குறிப்பிட்ட செயல்களை விரைவாக முடிவிற்கு கொண்டு செல்கிறது. ஹார்மோன் சுரப்பு துடிப்பானதாகவோ, நாள்சுழற்சியுடனோ அல்லது நிகழ்வுவாரியாகவோ இருக்கலாம். கார்டிசால் மற்றும் மெலட்டோனின் போன்ற ஹார்மோன்களை மதிப்பிடும்போது மாதிரி எடுக்கும் நேரம் முக்கியமானது.",U4T10:"உள்சுரப்பிக் கோளாறுகள் முதன்மை, இரண்டாம் நிலை, மூன்றாம் நிலை, ஏற்பி சார்ந்த அல்லது அசாதாரண இடச் சுரப்பாக இருக்கலாம். நோயறிதலில் தூண்டல் ஹார்மோனையும் இலக்குச் சுரப்பி ஹார்மோனையும் இணைத்து விளக்குவது முக்கியம். முதன்மை தைராய்டு குறைசெயலில் தைராய்டு ஹார்மோன் குறைந்து TSH அதிகரிக்கும்; மையத் தைராய்டு குறைசெயலில் இரண்டும் குறைவாகவோ TSH பொருத்தமற்ற சாதாரண அளவிலோ இருக்கும். இதே இரட்டை ஹார்மோன் விளக்க முறையை பிற உள்சுரப்பி அச்சுகளின் கோளாறுகளையும் வேறுபடுத்தப் பயன்படுத்தலாம்."};const APP_DATA=AnimalPhysiologyApp.Data;AnimalPhysiologyApp.OntologyBuilder={relationshipTypes:new Set(["prerequisite","supports","regulates","causes","partOf","contains","clinicalAssociation","methodological","contrastsWith"]),build(Data,Enhancements,Diagrams,Media){const scopeUnits=Data.units.map(u=>u.id),units=Data.units;const glossary=Data.glossary||[],questions=Data.questions||[],flashcards=Data.flashcards||[];const words=s=>new Set(String(s||"").toLowerCase().replace(/[^a-z0-9\s-]/g," ").split(/\s+/).filter(w=>w.length>4));const topics=units.flatMap(u=>u.topics.map((t,i)=>{const e=Enhancements[t[0]]||{},tw=words(t[1]+" "+t[2]);const linkedGlossary=glossary.filter(g=>{const gw=words(g. gnitiveLevels:{recall:1,understand:2,apply:3,analyse:4}};(function(Data){const bank=[["U1T1","Which plexus is primarily located in the muscularis externa?",["Myenteric plexus","Submucosal plexus","Cardiac plexus","Coeliac ganglion"],0,"Strongest distractor: “Submucosal plexus”. Why it is plausible: it is the other major enteric plexus. Why it is incorrect: the submucosal plexus lies mainly in the submucosa, whereas the myenteric plexus lies between muscle layers in the muscularis externa. Misconception detected: confusion between enteric plexus locations."],["U1T1","Which process mainly mixes intestinal contents without producing net forward movement?",["Segmentation","Peristalsis","Swallowing","Defaecation"],0,"Strongest distractor: “Peristalsis”. Why it is plausible: both are gastrointestinal motor patterns. Why it is incorrect: peristalsis propels contents, whereas segmentation primarily mixes them with little net forward movement. Misconception detected: confusion between propulsive and mixing contractions."],["U1T2","Which hormone most strongly stimulates pancreatic bicarbonate secretion?",["Secretin","Gastrin","Motilin","Somatostatin"],0,"Strongest distractor: “Gastrin”. Why it is plausible: it is a major gastrointestinal hormone. Why it is incorrect: secretin responds to duodenal acid and stimulates pancreatic bicarbonate, whereas gastrin chiefly stimulates gastric acid secretion. Misconception detected: confusion among gastrointestinal hormone targets."],["U1T2","Which gastric secretion is essential for vitamin B12 absorption?",["Intrinsic factor","Pepsin","Mucin","Bicarbonate"],0,"Strongest distractor: “Pepsin”. Why it is plausible: it is a major gastric secretion. Why it is incorrect: intrinsic factor binds vitamin B12 for ileal absorption, whereas pepsin is a protease. Misconception detected: confusion between digestive enzymes and absorption cofactors."],["U1T3","Which transporter mediates fructose entry into enterocytes?",["GLUT5","SGLT1","GLUT2","Na+/K+ ATPase"],0,"Strongest distractor: “SGLT1”. Why it is plausible: it mediates intestinal monosaccharide uptake. Why it is incorrect: SGLT1 transports glucose and galactose with sodium; fructose enters through GLUT5. Misconception detected: confusion among intestinal monosaccharide transporters."],["U1T3","Why is cellulose not digested in humans?",["Humans lack cellulase for beta-1,4 bonds","Cellulose contains no glucose","Amylase is absent","Cellulose is absorbed intact"],0,"Strongest distractor: “Cellulose contains no glucose”. Why it is plausible: indigestibility may be mistaken for unusual monomer composition. Why it is incorrect: cellulose is made of glucose, but humans lack cellulase for its beta-1,4 bonds. Misconception detected: confusion between polymer composition and bond specificity."],["U1T4","Which enzyme activates trypsinogen at the intestinal brush border?",["Enteropeptidase","Pepsin","Lipase","Amylase"],0,"Strongest distractor: “Pepsin”. Why it is plausible: it participates in protein digestion. Why it is incorrect: brush-border enteropeptidase converts trypsinogen to trypsin; pepsin acts in the stomach. Misconception detected: confusion between gastric and intestinal protease activation."],["U1T4","Which transporter absorbs most dipeptides and tripeptides?",["PepT1","GLUT5","SGLT1","CFTR"],0,"Strongest distractor: “SGLT1”. Why it is plausible: it is an important intestinal cotransporter. Why it is incorrect: PepT1 transports dipeptides and tripeptides; SGLT1 transports glucose and galactose. Misconception detected: confusion between peptide and carbohydrate transporters."],["U1T5","Where are chylomicrons first released?",["Lacteals","Portal venules","Gastric veins","Pancreatic ducts"],0,"Strongest distractor: “Portal venules”. Why it is plausible: many absorbed nutrients enter portal blood. Why it is incorrect: chylomicrons first enter lacteals and reach blood through lymph. Misconception detected: confusion between lipid and water-soluble nutrient transport."],["U1T5","What is the principal function of bile salts in lipid digestion?",["Emulsification and micelle formation","Hydrolysis of peptide bonds","Activation of pepsin","Absorption of glucose"],0,"Strongest distractor: “Hydrolysis of peptide bonds”. Why it is plausible: digestion is often associated with hydrolysis. Why it is incorrect: bile salts are not enzymes; they emulsify lipids and form micelles. Misconception detected: treating bile salts as digestive enzymes."],["U1T6","Which cells produce pulmonary surfactant?",["Type II pneumocytes","Type I pneumocytes","Alveolar macrophages","Club cells"],0,"Strongest distractor: “Type I pneumocytes”. Why it is plausible: they form most of the alveolar surface. Why it is incorrect: Type II pneumocytes synthesise surfactant; Type I cells specialise in gas exchange. Misconception detected: confusion between pneumocyte functions."],["U1T6","What normally drives quiet expiration?",["Elastic recoil","Internal intercostal contraction","Abdominal contraction","Diaphragmatic contraction"],0,"Strongest distractor: “Internal intercostal contraction”. Why it is plausible: these muscles assist expiration. Why it is incorrect: they are important in forced expiration; quiet expiration is mainly passive elastic recoil. Misconception detected: confusion between quiet and forced expiration."],["U1T7","In which form is most carbon dioxide transported in blood?",["Bicarbonate","Dissolved gas","Carbaminohaemoglobin","Carbonic acid"],0,"Strongest distractor: “Carbaminohaemoglobin”. Why it is plausible: carbon dioxide binds haemoglobin. Why it is incorrect: most carbon dioxide is transported as bicarbonate, with a smaller carbamino fraction. Misconception detected: confusion about carbon-dioxide transport fractions."],["U1T7","Which change shifts the oxygen dissociation curve to the right?",["Increased carbon dioxide","Decreased temperature","Decreased 2,3-BPG","Alkalosis"],0,"Strongest distractor: “Alkalosis”. Why it is plausible: pH changes affect haemoglobin affinity. Why it is incorrect: alkalosis shifts the curve left; increased carbon dioxide shifts it right. Misconception detected: reversal of the Bohr effect."],["U1T8","What is the strongest normal acute chemical stimulus for ventilation?",["Arterial carbon dioxide acting through central chemoreceptors","Arterial oxygen within the normal range","Plasma sodium","Haematocrit"],0,"Strongest distractor: “Arterial oxygen within the normal range”. Why it is plausible: oxygen is essential for respiration. Why it is incorrect: normal acute ventilatory drive is dominated by carbon dioxide; marked hypoxaemia activates peripheral chemoreceptors. Misconception detected: overestimating normal-range oxygen control."],["U1T8","Which receptors respond strongly to marked arterial hypoxaemia?",["Carotid and aortic bodies","Central chemoreceptors","Muscle spindles","Baroreceptors"],0,"Strongest distractor: “Central chemoreceptors”. Why it is plausible: they strongly regulate ventilation. Why it is incorrect: central chemoreceptors respond mainly to carbon-dioxide-related hydrogen ion, whereas carotid and aortic bodies respond to marked hypoxaemia. Misconception detected: confusion between central and peripheral chemoreceptors."]];bank.forEach((x,i)=>{const id="U1X"+String(i+1).padStart(2,"0"),conceptId="C_"+x[0]+"_EXTENDED",shift=i%4,options=shift?[...x[2].slice(-shift),...x[2].slice(0,-shift)]:[...x[2]],answer=(x[3]+shift)%4,correct=x[2][x[3]],topicText=(Data.units.flatMap(u=>u.topics).find(t=>t[0]===x[0])||[])[2]||"The relevant physiological mechanism determines the answer.";Data.questions.push({id:id,unit:"U1",topic:x[0],type:"MCQ",stem:x[1],options:options,answer:answer,explanation:`“${correct}” is correct because it matches the defining physiological relationship in this topic. ${topicText} The alternatives fail to match the specific mechanism, sequence or structure–function relation tested.`,strongestDistractorAnalysis:x[4],difficulty:i%3===0?"ea pt through the atrioventricular conduction pathway.","Coronary arteries arise from the ascending aorta and supply the myocardium."],flowchart:"Gross Anatomy of the Heart → mechanism → regulation → clinical consequence",comparison:[["Dimension","Normal physiology","Disturbance"],["Structure/function","Coordinated","Impaired"],["Regulation","Homeostatic","Compensatory or pathological"]],clinical:"Clinical interpretation should connect altered structure, electrical activity, pressure, flow or regulation to symptoms and findings.",laboratory:"Relevant practicals include heart models, pulse examination, blood-pressure recording, heart sounds and ECG interpretation.",misconception:"Electrical events, mechanical contraction, pressure and blood flow are related but not identical measurements.",fiveMark:["Write a short note on Gross Anatomy of the Heart.","Add a labelled diagram or flowchart.","State one clinical correlation."],tenMark:"Describe gross anatomy of the heart with definition, structure, mechanism, regulation, clinical significance and labelled diagram.",revision:["The heart is a four-chambered muscular pump enclosed by the pericardium.","Use pressure gradients to explain valve and flow events.","Distinguish electrical activation from mechanical activity."]},U2T8C:{objectives:["Explain the core anatomy and physiology of cardiac muscle physiology.","Relate the mechanism to homeostasis and disease.","Apply the concept to university examination questions."],prerequisites:["Blood flow and pressure basics","Relevant Unit I integration"],mechanism:["Cardiac muscle is striated, branched and electrically coupled through gap junctions within intercalated discs.","The long action potential and refractory period prevent tetanus.","Calcium entering through L-type channels triggers further calcium release from the sarcoplasmic reticulum through ryanodine receptors.","Cytosolic calcium binds troponin C and permits cross-bridge cycling.","Calcium is later removed by SERCA, sodium–calcium exchange and membrane calcium pumps."],flowchart:"Cardiac Muscle Physiology → mechanism → regulation → clinical consequence",comparison:[["Dimension","Normal physiology","Disturbance"],["Structure/function","Coordinated","Impaired"],["Regulation","Homeostatic","Compensatory or pathological"]],clinical:"Clinical interpretation should connect altered structure, electrical activity, pressure, flow or regulation to symptoms and findings.",laboratory:"Relevant practicals include heart models, pulse examination, blood-pressure recording, heart sounds and ECG interpretation.",misconception:"Electrical events, mechanical contraction, pressure and blood flow are related but not identical measurements.",fiveMark:["Write a short note on Cardiac Muscle Physiology.","Add a labelled diagram or flowchart.","State one clinical correlation."],tenMark:"Describe cardiac muscle physiology with definition, structure, mechanism, regulation, clinical significance and labelled diagram.",revision:["Cardiac muscle is striated, branched and electrically coupled through gap junctions within intercalated discs.","Use pressure gradients to explain valve and flow events.","Distinguish electrical activation from mechanical activity."]},U2T9C:{objectives:["Explain the core anatomy and physiology of conducting system of the heart.","Relate the mechanism to homeostasis and disease.","Apply the concept to university examination questions."],prerequisites:["Blood flow and pressure basics","Relevant Unit I integration"],mechanism:["The sinoatrial node normally initiates each heartbeat because it has the highest intrinsic pacemaker rate.","Impulses spread through atrial myocardium to the atrioventricular node, where conduction slows and allows ventricular filling.","The signal then passes through the atrioventricular bundle, bundle branches and Purkinje fibres to activate ventricular myocardium rapidly.","Sympathetic stimulation accelerates pacemaker rate and conduction, whereas parasympatheti
