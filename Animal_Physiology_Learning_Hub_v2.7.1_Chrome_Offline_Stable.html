-year-old man presents with severe chest pain. Coronary angiography reveals complete occlusion of the left anterior descending (LAD) artery near its origin. Which region of the heart is most directly threatened by this occlusion?",options:["The anterior wall of the left ventricle and anterior interventricular septum","The posterior wall of the right atrium","The sinoatrial node exclusively","The pulmonary valve leaflets"],answer:0,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T7C_CLINICAL_APPLICATION_ERROR",explanation:"The LAD supplies the anterior wall of the left ventricle and the anterior two-thirds of the interventricular septum via its diagonal and septal branches. Occlusion near its origin threatens this large, clinically critical myocardial territory, commonly producing an anterior myocardial infarction.",strongestDistractorAnalysis:"‘The sinoatrial node exclusively’ is the strongest distractor: students know the SA node has its own dedicated arterial supply (usually from the right coronary artery) and, because coronary and conduction-system anatomy are taught close together, conflate occlusion of a named coronary vessel with compromise of the conduction system, when the LAD's territory is contractile myocardium, not the SA node.",conceptId:"C_U2T7C_CASE"},{id:"U2C_AR_02",unit:"U2",topic:"U2T8C",concept:"C_U2T8C_AR",type:"Assertion–Reason",stem:"Assertion: Cardiac muscle has a much longer absolute refractory period than skeletal muscle. Reason: Skeletal muscle, unlike cardiac muscle, is capable of sustained tetanic contraction.",options:["Both Assertion and Reason are true, and the Reason correctly explains the Assertion.","Both Assertion and Reason are true, but the Reason does not correctly explain the Assertion.","The Assertion is true, but the Reason is false.","The Assertion is false, but the Reason is true."],answer:1,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"logical-structure-error",misconceptionId:"MIS_U2T8C_LOGICAL_STRUCTURE_ERROR",explanation:"Both statements are individually true — cardiac muscle's absolute refractory period (~250 ms) is far longer than skeletal muscle's, and skeletal muscle can indeed sustain tetanic contraction while cardiac muscle cannot. However, the Reason does not correctly explain the Assertion: the length of the cardiac refractory period is caused by the prolonged plateau phase of the cardiac action potential (sustained by L-type calcium channel activity), not by the separate fact that skeletal muscle happens to be capable of tetany.",strongestDistractorAnalysis:"‘Both true and reason explains assertion’ is the strongest distractor: because both facts concern refractory periods and tetany and are thematically related, students assume a direct causal link. The Reason actually describes a contrasting property of skeletal muscle, not the mechanism behind cardiac muscle's own refractory-period length.",conceptId:"C_U2T8C_AR"},{id:"U2C_CASE_02",unit:"U2",topic:"U2T8C",concept:"C_U2T8C_CASE",type:"Case-based",stem:"A patient with severe renal failure has a serum potassium of 7.2 mmol/L (normal ~3.5–5.0). An ECG shows tall, peaked T waves and a widened QRS. What is the primary mechanism by which this hyperkalaemia affects cardiac muscle?",options:["It partially depolarises the resting membrane potential, inactivating fast sodium channels and slowing conduction","It directly blocks L-type calcium channels, abolishing the plateau phase","It increases SERCA activity, accelerating relaxation","It has no effect on membrane potential, only on contractile protein sensitivity"],answer:0,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T8C_CLINICAL_APPLICATION_ERROR",explanation:"Elevated extracellular potassium reduces the transmembrane potassium gradient, partially depolarising the resting membrane potential of cardiac cells. This brings fast sodium channels closer to their inactivated state, reducing the number available to open during the next action potential upstroke, which slows conduction (widening the QRS) and alters repolarisation (tall, peaked T waves).",strongestDistractorAnalysis:"‘It directly blocks L-type calcium channels, abolishing the plateau phase’ is the strongest distractor: students associate severe cardiac electrical disturbance with calcium-channel dysfunction because calcium is central to excitation–contraction coupling, but hyperkalaemia's primary, earliest effect is on resting membrane potential and sodium-channel availability, not a direct calcium-channel blockade.",conceptId:"C_U2T8C_CASE"},{id:"U2C_AR_03",unit:"U2",topic:"U2T9C",concept:"C_U2T9C_AR",type:"Assertion–Reason",stem:"Assertion: AV nodal conduction velocity is much slower than conduction through the His–Purkinje system. Reason: Slow AV nodal conduction indicates a pathological block that requires urgent clinical treatment.",options:["Both Assertion and Reason are true, and the Reason correctly explains the Assertion.","Both Assertion and Reason are true, but the Reason does not correctly explain the Assertion.","The Assertion is true, but the Reason is false.","The Assertion is false, but the Reason is true."],answer:2,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"logical-structure-error",misconceptionId:"MIS_U2T9C_LOGICAL_STRUCTURE_ERROR",explanation:"The Assertion is true: AV nodal conduction is genuinely much slower than His–Purkinje conduction, owing to small cell diameter and sparse gap-junction coupling in the AV node. The Reason is false: this slow conduction is a normal, essential physiological feature that allows atrial contraction to complete before ventricular systole begins — it is not a pathological finding requiring intervention.",strongestDistractorAnalysis:"‘Both true and reason explains assertion’ is the strongest distractor: because AV block is a genuine clinical entity, students conflate the normal physiological AV delay present in every healthy heart with pathological AV conduction block, wrongly treating the normal delay itself as abnormal.",conceptId:"C_U2T9C_AR"},{id:"U2C_CASE_03",unit:"U2",topic:"U2T9C",concept:"C_U2T9C_CASE",type:"Case-based",stem:"A patient's ECG shows P waves and QRS complexes occurring at completely independent, unrelated rates: a normal atrial rate of 75 beats per minute, and a slow ventricular rate of approximately 35 beats per minute with wide QRS complexes. What is the most likely origin of the ventricular rhythm?",options:["The SA node, conducting normally to the ventricles","A subsidiary (escape) pacemaker within the ventricular conduction system, independent of the SA node","Retrograde conduction from the AV node to the atria","Increased vagal tone slowing the SA node itself"],answer:1,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T9C_CLINICAL_APPLICATION_ERROR",explanation:"Complete (third-degree) AV block means no SA-node impulses reach the ventricles; the atria and ventricles beat independently at their own rates. The slow, wide-QRS ventricular rhythm indicates a subsidiary escape pacemaker within the ventricular conduction system has taken over, firing at its own slow intrinsic rate, entirely dissociated from the normally conducting but blocked atrial rhythm.",strongestDistractorAnalysis:"‘The SA node, conducting normally to the ventricles’ is the strongest distractor: students see a P wave present and assume the SA node must still be driving the ventricles, without recognising that complete dissociation between P-wave rate and QRS rate is the defining feature of complete heart block — the SA node fires normally, but its impulses never reach the ventricles.",conceptId:"C_U2T9C_CASE"},{id:"U2C_AR_04",unit:"U2",topic:"U2T10C",concept:"C_U2T10C_AR",type:"Assertion–Reason",stem:"Assertion: Ventricular pressure falls rapidly during isovolumetric relaxation. Reason: All four heart valves remain closed during this phase, so pressure falls purely as the ventricular muscle relaxes, without any change in ventricular volume.",options:["Both Assertion and Reason are true, and the Reason correctly explains the Assertion.","Both Assertion and Reason are true, but the Reason does not correctly explain the Assertion.","The Assertion is true, but the Reason is false.","The Assertion is false, but the Reason is true."],answer:0,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"logical-structure-error",misconceptionId:"MIS_U2T10C_LOGICAL_STRUCTURE_ERROR",explanation:"Both statements are true, and the Reason explains the Assertion: during isovolumetric relaxation the semilunar valves have just closed and the AV valves have not yet opened, so the ventricle is a sealed chamber. Pressure falls steeply as the myocardium relaxes toward atrial pressure, while volume remains fixed because no blood can enter or leave.",strongestDistractorAnalysis:"‘Assertion true, reason false’ is the strongest distractor: students who know pressure falls during this phase may assume some valve must open to allow the pressure to ‘release’, not recognising that pressure falls purely due to myocardial relaxation while the chamber remains completely sealed.",conceptId:"C_U2T10C_AR"},{id:"U2C_CASE_04",unit:"U2",topic:"U2T10C",concept:"C_U2T10C_CASE",type:"Case-based",stem:"A patient with rheumatic mitral stenosis has a thickened, calcified but still mobile mitral valve. On auscultation, S1 is noted to be unusually loud. What best explains this finding?",options:["The stenotic valve leaflets remain widely separated for longer at the start of systole before snapping shut forcefully","Mitral stenosis reduces left atrial pressure, weakening valve closure","S1 loudness is unrelated to mitral valve function","The aortic valve is closing more forcefully due to compensatory hypertrophy"],answer:0,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T10C_CLINICAL_APPLICATION_ERROR",explanation:"In mitral stenosis with a still-mobile valve, elevated left atrial pressure keeps the stenotic leaflets pushed wide open well into early systole. When ventricular pressure finally exceeds atrial pressure, the leaflets must travel further and close more abruptly and forcefully, producing an accentuated, loud S1.",strongestDistractorAnalysis:"‘Mitral stenosis reduces left atrial pressure, weakening valve closure’ is the strongest distractor: it inverts the actual haemodynamics — mitral stenosis obstructs flow from the left atrium, causing left atrial pressure to rise, not fall, which is precisely what keeps the valve open longer and produces the loud, not weakened, S1.",conceptId:"C_U2T10C_CASE"},{id:"U2C_AR_05",unit:"U2",topic:"U2T11C",concept:"C_U2T11C_AR",type:"Assertion–Reason",stem:"Assertion: A prolonged PR interval indicates a delay in conduction from the SA node through the AV node to the ventricles. Reason: The PR interval is measured from the onset of the QRS complex to the end of the T wave.",options:["Both Assertion and Reason are true, and the Reason correctly explains the Assertion.","Both Assertion and Reason are true, but the Reason does not correctly explain the Assertion.","The Assertion is true, but the Reason is false.","The Assertion is false, but the Reason is true."],answer:2,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"logical-structure-error",misconceptionId:"MIS_U2T11C_LOGICAL_STRUCTURE_ERROR",explanation:"The Assertion is true: PR interval prolongation reflects delayed atrioventricular conduction, classically seen in first-degree AV block. The Reason is false: the PR interval is measured from the onset of the P wave to the onset of the QRS complex, not from QRS onset to T-wave end — that latter span is the QT interval, a distinct measurement reflecting combined ventricular depolarisation and repolarisation.",strongestDistractorAnalysis:"‘Both true and reason explains assertion’ is the strongest distractor: students who have not precisely distinguished the PR interval from the QT interval accept any plausible-sounding ‘interval’ definition, conflating two genuinely distinct ECG measurements that happen to share the word ‘interval’.",conceptId:"C_U2T11C_AR"},{id:"U2C_CASE_05",unit:"U2",topic:"U2T11C",concept:"C_U2T11C_CASE",type:"Case-based",stem:"A routine ECG in an asymptomatic athlete shows a PR interval of 240 milliseconds (normal 120–200 ms), with every P wave followed by a normal QRS complex at a constant interval, and normal QRS duration. What does this finding represent?",options:["Complete heart block, requiring urgent pacing","First-degree AV block, reflecting delayed but preserved conduction through the AV node","Ventricular pre-excitation via an accessory pathway","Normal sinus rhythm with no conduction abnormality"],answer:1,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T11C_CLINICAL_APPLICATION_ERROR",explanation:"A uniformly prolonged PR interval, with every P wave still followed by a QRS complex at a fixed, consistent interval, defines first-degree AV block: conduction through the AV node is delayed but every impulse still successfully reaches the ventricles. This is often a benign finding in athletes with high vagal tone and does not represent failed conduction.",strongestDistractorAnalysis:"‘Complete heart block, requiring urgent pacing’ is the strongest distractor: students associate any abnormal PR interval with a severe conduction disorder, but complete heart block is defined by total dissociation between P waves and QRS complexes — the opposite of what is described here, where every P wave is still followed by a QRS at a constant, if prolonged, interval.",conceptId:"C_U2T11C_CASE"},{id:"U2C_AR_06",unit:"U2",topic:"U2T12C",concept:"C_U2T12C_AR",type:"Assertion–Reason",stem:"Assertion: Increasing afterload alone typically increases stroke volume. Reason: A higher afterload requires the ventricle to generate greater pressure before the semilunar valve opens, delaying the onset of ejection.",options:["Both Assertion and Reason are true, and the Reason correctly explains the Assertion.","Both Assertion and Reason are true, but the Reason does not correctly explain the Assertion.","The Assertion is true, but the Reason is false.","The Assertion is false, but the Reason is true."],answer:3,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"logical-structure-error",misconceptionId:"MIS_U2T12C_LOGICAL_STRUCTURE_ERROR",explanation:"The Assertion is false: with preload and contractility held constant, increasing afterload alone typically decreases stroke volume, because the ventricle must overcome greater resistance to eject the same volume and achieves less fibre shortening. The Reason is true: higher afterload does require greater pressure generation before the semilunar valve opens, prolonging isovolumetric contraction — but this correctly explains why afterload delays ejection, not why it would increase stroke volume.",strongestDistractorAnalysis:"‘Both true and reason explains assertion’ is the strongest distractor: because higher afterload sounds like it demands ‘more work’, students assume this translates into ‘more output’, missing that the extra resistance opposes ejection and reduces ventricular shortening rather than augmenting stroke volume.",conceptId:"C_U2T12C_AR"},{id:"U2C_CASE_06",unit:"U2",topic:"U2T12C",concept:"C_U2T12C_CASE",type:"Case-based",stem:"A trauma patient loses approximately 1.5 litres of blood rapidly. Heart rate rises to 130 bpm, but stroke volume falls and cardiac output declines despite unchanged myocardial contractility. What is the most direct explanation for the fall in stroke volume?",options:["Reduced venous return lowers ventricular preload, reducing fibre stretch and contractile force by the Frank–Starling mechanism","Increased afterload from vasoconstriction directly reduces stroke volume","Contractility has been directly impaired by blood loss","Reduced heart rate has shortened diastolic filling time"],answer:0,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T12C_CLINICAL_APPLICATION_ERROR",explanation:"Rapid blood loss reduces circulating volume and venous return, lowering ventricular preload (end-diastolic volume). By the Frank–Starling mechanism, reduced fibre stretch produces reduced contractile force and a smaller stroke volume, even though myocardial contractility itself is unchanged — a preload-mediated fall, not an intrinsic contractility defect.",strongestDistractorAnalysis:"‘Contractility has been directly impaired by blood loss’ is the strongest distractor: the stem explicitly states contractility is unchanged, but students often default to ‘the heart is pumping weaker’ as a generic explanation for falling stroke volume, missing that a preload-driven Frank–Starling effect can reduce stroke volume without any change in intrinsic contractile state.",conceptId:"C_U2T12C_CASE"},{id:"U2C_AR_07",unit:"U2",topic:"U2T13C",concept:"C_U2T13C_AR",type:"Assertion–Reason",stem:"Assertion: Pulse pressure is influenced more by stroke volume and arterial compliance than by mean arterial pressure directly. Reason: A stiffer, less compliant arterial wall produces a larger rise in systolic pressure, and hence a wider pulse pressure, for a given stroke volume.",options:["Both Assertion and Reason are true, and the Reason correctly explains the Assertion.","Both Assertion and Reason are true, but the Reason does not correctly explain the Assertion.","The Assertion is true, but the Reason is false.","The Assertion is false, but the Reason is true."],answer:0,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"logical-structure-error",misconceptionId:"MIS_U2T13C_LOGICAL_STRUCTURE_ERROR",explanation:"Both statements are true, and the Reason explains the Assertion: pulse pressure (systolic minus diastolic pressure) depends on how much a given stroke volume raises systolic pressure, which in turn depends on arterial compliance. A stiffer arterial wall cannot buffer the same stroke volume as effectively, producing a wider pulse pressure independent of mean arterial pressure itself.",strongestDistractorAnalysis:"‘Both true but unrelated’ is the strongest distractor: because MAP and pulse pressure are both ‘blood pressure numbers’, students assume they share the same governing variables (CO and TPR), not recognising pulse pressure is specifically shaped by stroke volume and arterial compliance, a distinct pair of determinants from those governing MAP.",conceptId:"C_U2T13C_AR"},{id:"U2C_CASE_07",unit:"U2",topic:"U2T13C",concept:"C_U2T13C_CASE",type:"Case-based",stem:"An elderly patient with long-standing hypertension has a systolic pressure of 168 mmHg and a diastolic pressure of 72 mmHg (pulse pressure 96 mmHg), despite normal stroke volume and normal cardiac output. What is the most likely explanation for this widened pulse pressure?",options:["Reduced arterial compliance due to chronic arterial wall stiffening","A markedly increased stroke volume","A markedly reduced total peripheral resistance","Reduced mean arterial pressure"],answer:0,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T13C_CLINICAL_APPLICATION_ERROR",explanation:"With stroke volume and cardiac output stated as normal, the widened pulse pressure cannot be attributed to increased ejected volume. Chronic hypertension causes structural stiffening (reduced compliance) of the large elastic arteries; a stiffer arterial tree cannot buffer the same stroke volume as effectively, producing a larger systolic rise and wider pulse pressure — a hallmark of age- and hypertension-related arterial stiffening (isolated systolic hypertension).",strongestDistractorAnalysis:"‘A markedly increased stroke volume’ is the strongest distractor: pulse pressure is genuinely influenced by stroke volume, so students default to this explanation without checking the vignette, which explicitly states stroke volume is normal — ruling this option out and pointing instead to reduced arterial compliance.",conceptId:"C_U2T13C_CASE"},{id:"U2C_AR_08",unit:"U2",topic:"U2T14C",concept:"C_U2T14C_AR",type:"Assertion–Reason",stem:"Assertion: Blood continues to flow from the pulmonary trunk into the aorta through the ductus arteriosus in a healthy newborn several days after birth. Reason: Functional closure of the ductus arteriosus is triggered by rising arterial oxygen tension and falling circulating prostaglandin E2 following the first breaths.",options:["Both Assertion and Reason are true, and the Reason correctly explains the Assertion.","Both Assertion and Reason are true, but the Reason does not correctly explain the Assertion.","The Assertion is true, but the Reason is false.","The Assertion is false, but the Reason is true."],answer:3,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"logical-structure-error",misconceptionId:"MIS_U2T14C_LOGICAL_STRUCTURE_ERROR",explanation:"The Assertion is false: in a healthy newborn, the ductus arteriosus undergoes functional closure within hours to a few days after birth, so flow through it should have ceased by several days of age — persistence beyond this defines the pathological condition patent ductus arteriosus. The Reason is true: functional closure is indeed triggered by the rise in arterial oxygen tension and fall in circulating prostaglandin E2 following the first breaths and separation of the placental circulation.",strongestDistractorAnalysis:"‘Both true and reason explains assertion’ is the strongest distractor: students correctly recall the ductus arteriosus as a genuine fetal shunt and assume it remains patent for some extended, clinically normal period after birth, rather than recognising normal closure is rapid — making persistent flow at several days of age abnormal, not physiological.",conceptId:"C_U2T14C_AR"},{id:"U2C_CASE_08",unit:"U2",topic:"U2T14C",concept:"C_U2T14C_CASE",type:"Case-based",stem:"A newborn has a continuous 'machinery' murmur heard throughout systole and diastole, and an echocardiogram confirms persistent flow through a vessel that should normally have closed shortly after birth. What is the direction of blood flow through this abnormally patent vessel, and why?",options:["Aorta to pulmonary trunk, because systemic (aortic) pressure now exceeds pulmonary arterial pressure after birth","Pulmonary trunk to aorta, the same direction as in fetal life","No net flow occurs, as pressures on both sides are now equal","Pulmonary trunk to aorta, driven by persistently high pulmonary vascular resistance"],answer:0,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T14C_CLINICAL_APPLICATION_ERROR",explanation:"In fetal life, the ductus arteriosus shunts blood from the pulmonary trunk to the aorta because pulmonary vascular resistance is high and systemic resistance is relatively low. After birth, pulmonary vascular resistance falls sharply while systemic pressure becomes higher, so if the ductus fails to close, the pressure gradient reverses and blood flows from the aorta into the pulmonary trunk — the opposite direction from the fetal shunt.",strongestDistractorAnalysis:"‘Pulmonary trunk to aorta, the same direction as in fetal life’ is the strongest distractor: students correctly recall the fetal shunt direction but fail to account for the postnatal reversal of the pressure gradient (falling pulmonary resistance, rising systemic pressure), incorrectly assuming a patent ductus simply continues the same flow pattern that existed before birth.",conceptId:"C_U2T14C_CASE"},{id:"U2R_MCQ_001",unit:"U2",topic:"U2T15R",concept:"C_U2T15R_001",type:"MCQ",stem:"Renal corpuscles are located mainly in the:",options:["Cortex","Medulla","Pelvis","Ureter"],answer:0,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T15R_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Cortex” is correct: renal corpuscles (glomerulus and Bowman's capsule) are located exclusively in the renal cortex, where the initial filtration step occurs. The medulla instead contains the loops of Henle and collecting ducts responsible for concentrating urine.",strongestDistractorAnalysis:"Medulla is the strongest distractor: because the kidney is broadly divided into cortex and medulla, and medullary pyramids are a prominent, memorable structure, students who have not fixed which region houses which nephron segment misplace the corpuscle in the medulla rather than the cortex.",conceptId:"C_U2T15R_001"},{id:"U2R_MCQ_002",unit:"U2",topic:"U2T15R",concept:"C_U2T15R_002",type:"MCQ",stem:"Urine leaves papillary ducts and enters:",options:["Proximal tubule","Minor calyces","Renal artery","Glomerulus"],answer:1,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T15R_REGULATION_ERROR",explanation:"“Minor calyces” is correct: urine draining from the papillary ducts at the tip of a renal pyramid empties directly into a surrounding minor calyx, which then merges with others into a major calyx and ultimately the renal pelvis.",strongestDistractorAnalysis:"Proximal tubule is the strongest distractor: it is a genuine part of the same nephron–collecting-system flow sequence, so students without a clear mental map of the order (proximal tubule → loop → distal tubule → collecting duct → papillary duct → calyx) select a far upstream structure for a question asking about the downstream endpoint.",conceptId:"C_U2T15R_002"},{id:"U2R_MCQ_003",unit:"U2",topic:"U2T15R",concept:"C_U2T15R_003",type:"MCQ",stem:"Vasa recta arise mainly from efferent arterioles of:",options:["Renal pelvis","Afferent arterioles only","Juxtamedullary nephrons","Cortical collecting ducts"],answer:2,difficulty:"high",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T15R_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Juxtamedullary nephrons” is correct: the vasa recta, the long, straight peritubular capillaries running alongside the loops of Henle, arise from the efferent arterioles of juxtamedullary nephrons specifically, whose glomeruli lie near the corticomedullary junction.",strongestDistractorAnalysis:"‘Afferent arterioles only’ is the strongest distractor: students confuse afferent (carrying blood towards the glomerulus) with efferent (carrying blood away from the glomerulus) — vasa recta form from the efferent, not afferent, arterioles of juxtamedullary nephrons, a classic afferent/efferent mix-up.",conceptId:"C_U2T15R_003"},{id:"U2R_MCQ_004",unit:"U2",topic:"U2T15R",concept:"C_U2T15R_004",type:"MCQ",stem:"The renal capsule is primarily:",options:["Smooth muscle","Neural tissue","Cartilage","Fibrous connective tissue"],answer:3,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T15R_REGULATION_ERROR",explanation:"“Fibrous connective tissue” is correct: the renal capsule is a thin, tough layer of dense fibrous connective tissue that encloses the kidney, providing protection but no contractile function.",strongestDistractorAnalysis:"Smooth muscle is the strongest distractor: other hollow urinary-tract structures downstream (ureter, bladder) do contain smooth muscle for peristalsis and voiding, so students over-generalise this contractile property to the renal capsule, a distinct, non-contractile structure at the kidney's outer surface.",conceptId:"C_U2T15R_004"},{id:"U2R_MCQ_005",unit:"U2",topic:"U2T16R",concept:"C_U2T16R_005",type:"MCQ",stem:"The renal corpuscle contains:",options:["Glomerulus and Bowman’s capsule","Loop and collecting duct","Pelvis and ureter","Cortex and medulla"],answer:0,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T16R_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Glomerulus and Bowman's capsule” is correct: the renal corpuscle is specifically the filtering unit at the start of the nephron, comprising the glomerular capillary tuft enclosed within the cup-shaped Bowman's capsule, where plasma is filtered into the tubular system.",strongestDistractorAnalysis:"‘Loop and collecting duct’ is the strongest distractor: both are genuine nephron-associated structures covered in the same topic, so students confuse the corpuscle's own composition (the filtering unit) with downstream tubular segments that process the filtrate after it has already left the corpuscle.",conceptId:"C_U2T16R_005"},{id:"U2R_MCQ_006",unit:"U2",topic:"U2T16R",concept:"C_U2T16R_006",type:"MCQ",stem:"Long loops are characteristic of:",options:["Renal pelvis","Juxtamedullary nephrons","All cortical nephrons","Collecting ducts only"],answer:1,difficulty:"high",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T16R_REGULATION_ERROR",explanation:"“Juxtamedullary nephrons” is correct: although only a minority (roughly 15%) of nephrons are juxtamedullary, their corpuscles lie near the corticomedullary junction and their loops of Henle extend deep into the medulla, generating the steep osmotic gradient needed for urine concentration.",strongestDistractorAnalysis:"‘All cortical nephrons’ is the strongest distractor: because most nephrons (roughly 85%) are cortical, students assume this majority type must also carry the defining long-loop feature, not recognising that only the minority juxtamedullary nephrons have loops extending deep into the medulla.",conceptId:"C_U2T16R_006"},{id:"U2R_MCQ_007",unit:"U2",topic:"U2T16R",concept:"C_U2T16R_007",type:"MCQ",stem:"The proximal tubule follows the:",options:["Ureter","Papillary duct","Renal corpuscle","Collecting duct"],answer:2,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T16R_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Renal corpuscle” is correct: filtrate leaving Bowman's capsule enters the proximal convoluted tubule directly, the first tubular segment responsible for bulk reabsorption of filtered solutes and water.",strongestDistractorAnalysis:"‘Collecting duct’ is the strongest distractor: it is a genuine nephron-associated structure discussed in this topic, but it lies much further downstream (after the distal tubule), so students without the precise nephron sequence fixed jump ahead in the pathway rather than identifying the corpuscle as the immediately preceding structure.",conceptId:"C_U2T16R_007"},{id:"U2R_MCQ_008",unit:"U2",topic:"U2T16R",concept:"C_U2T16R_008",type:"MCQ",stem:"The distal tubule eventually connects to:",options:["Renal artery","Bowman’s capsule","Glomerular capillary","Collecting system"],answer:3,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T16R_REGULATION_ERROR",explanation:"“Collecting system” is correct: filtrate leaving the distal convoluted tubule enters the collecting duct system, where final adjustments to water and electrolyte composition occur under hormonal control before urine passes to the renal pelvis.",strongestDistractorAnalysis:"‘Bowman's capsule’ is the strongest distractor: it is genuinely the starting point of the nephron tubule, continuous with the proximal tubule, so students confuse the start and end of the tubular sequence, wrongly assuming the distal tubule loops back toward its origin rather than continuing forward into the collecting system.",conceptId:"C_U2T16R_008"},{id:"U2R_MCQ_009",unit:"U2",topic:"U2T17R",concept:"C_U2T17R_009",type:"MCQ",stem:"The main force favouring filtration is:",options:["Glomerular capillary hydrostatic pressure","Plasma oncotic pressure","Bowman’s pressure","Tubular pressure"],answer:0,difficulty:"high",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T17R_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Glomerular capillary hydrostatic pressure” is correct: at roughly 55–60 mmHg, this is the dominant force favouring filtration, substantially exceeding the opposing forces (Bowman's capsule hydrostatic pressure and plasma oncotic pressure) to produce a net positive filtration pressure.",strongestDistractorAnalysis:"‘Plasma oncotic pressure’ is the strongest distractor: it is a genuine Starling force acting on the glomerular capillary, so students correctly identify it as relevant but assign it the wrong direction — oncotic pressure opposes filtration by drawing fluid back into the capillary, it does not favour it.",conceptId:"C_U2T17R_009"},{id:"U2R_MCQ_010",unit:"U2",topic:"U2T17R",concept:"C_U2T17R_010",type:"MCQ",stem:"Podocyte slit diaphragms are part of the:",options:["Ureter","Filtration barrier","Loop multiplier","Vasa recta"],answer:1,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T17R_REGULATION_ERROR",explanation:"“Filtration barrier” is correct: podocyte slit diaphragms, together with the fenestrated capillary endothelium and glomerular basement membrane, form the three-layered filtration barrier that permits water and small solutes through while restricting larger plasma proteins.",strongestDistractorAnalysis:"‘Loop multiplier’ is the strongest distractor: both terms describe specialised renal structures with a distinctive name (‘slit diaphragm’ and ‘multiplier’), so students conflate the filtration apparatus of the corpuscle with the countercurrent multiplication system of the loop of Henle, an entirely separate structure and mechanism further along the nephron.",conceptId:"C_U2T17R_010"},{id:"U2R_MCQ_011",unit:"U2",topic:"U2T17R",concept:"C_U2T17R_011",type:"MCQ",stem:"GFR autoregulation includes:",options:["Only aldosterone","Only micturition","Myogenic response and tubuloglomerular feedback","Only ADH"],answer:2,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T17R_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Myogenic response and tubuloglomerular feedback” is correct: these are the two intrinsic mechanisms of renal autoregulation, keeping GFR relatively stable across a range of arterial pressures independent of extrinsic hormonal control.",strongestDistractorAnalysis:"‘Only ADH’ is the strongest distractor: ADH is a genuine and important renal regulatory hormone discussed elsewhere in this unit, so students default to it as a general-purpose answer for renal regulation, without recognising that GFR autoregulation specifically relies on intrinsic myogenic and tubuloglomerular mechanisms, not ADH.",conceptId:"C_U2T17R_011"},{id:"U2R_MCQ_012",unit:"U2",topic:"U2T17R",concept:"C_U2T17R_012",type:"MCQ",stem:"An increase in plasma oncotic pressure tends to:",options:["Increase filtration","Increase urine flow always","Open urethral sphincter","Reduce filtration"],answer:3,difficulty:"high",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T17R_REGULATION_ERROR",explanation:"“Reduce filtration” is correct: raising plasma oncotic pressure increases the force opposing filtration at the glomerular capillary, reducing the net filtration pressure and hence GFR, all else being equal.",strongestDistractorAnalysis:"‘Increase filtration’ is the strongest distractor: it directly inverts the correct relationship. Students who have not fixed the direction of oncotic pressure's effect (an opposing, not favouring, force) assume any change in a Starling-force variable must raise filtration, rather than checking which side of the pressure balance it acts on.",conceptId:"C_U2T17R_012"},{id:"U2R_MCQ_013",unit:"U2",topic:"U2T18R",concept:"C_U2T18R_013",type:"MCQ",stem:"Most filtered glucose is reabsorbed in:",options:["Proximal tubule","Collecting duct","Thin ascending limb","Ureter"],answer:0,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T18R_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Proximal tubule” is correct: roughly 100% of filtered glucose is normally reabsorbed here via sodium-glucose cotransporters (SGLT2 and SGLT1), so no glucose ordinarily appears in the final urine.",strongestDistractorAnalysis:"‘Thin ascending limb’ is the strongest distractor: it is a genuine, specifically named nephron segment (unlike the vague ‘collecting duct’ or irrelevant ‘ureter’ options), so students who recognise it as a legitimate reabsorptive-sounding segment select it without recalling that active glucose reabsorption is a proximal tubule function, not a thin-limb one (which has no active transport capacity).",conceptId:"C_U2T18R_013"},{id:"U2R_MCQ_014",unit:"U2",topic:"U2T18R",concept:"C_U2T18R_014",type:"MCQ",stem:"The thick ascending limb is:",options:["A storage segment","Water impermeable and salt reabsorbing","Highly water permeable","A filtration segment"],answer:1,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T18R_REGULATION_ERROR",explanation:"“Water impermeable and salt reabsorbing” is correct: the thick ascending limb actively reabsorbs Na⁺, K⁺ and Cl⁻ via the Na-K-2Cl cotransporter but remains impermeable to water, diluting the tubular fluid while contributing solute to the medullary interstitium.",strongestDistractorAnalysis:"‘Highly water permeable’ is the strongest distractor: students conflate the thick ascending limb with the descending thin limb, which has the opposite permeability profile (highly water permeable, no active solute transport) — the two limbs of the loop have deliberately reciprocal properties that are easily transposed.",conceptId:"C_U2T18R_014"},{id:"U2R_MCQ_015",unit:"U2",topic:"U2T18R",concept:"C_U2T18R_015",type:"MCQ",stem:"Glucosuria can occur when:",options:["All nephrons stop filtering","Plasma glucose is zero","Transport maximum is exceeded","ADH is high"],answer:2,difficulty:"high",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T18R_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Transport maximum is exceeded” is correct: glucosuria occurs when the filtered glucose load exceeds the proximal tubule's finite reabsorptive capacity (transport maximum, Tm), so the excess remains in the tubular fluid and appears in urine.",strongestDistractorAnalysis:"‘All nephrons stop filtering’ is the strongest distractor: it describes renal failure, an unrelated and far more drastic scenario, but because it also results in an abnormal urine finding, students without a precise definition of Tm default to a generic ‘kidney failure’ explanation rather than the specific transport-saturation mechanism.",conceptId:"C_U2T18R_015"},{id:"U2R_MCQ_016",unit:"U2",topic:"U2T18R",concept:"C_U2T18R_016",type:"MCQ",stem:"Most filtered bicarbonate is reabsorbed in:",options:["Renal pelvis","Ureter","Bowman’s space","Proximal tubule"],answer:3,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T18R_REGULATION_ERROR",explanation:"“Proximal tubule” is correct: approximately 80–90% of filtered bicarbonate is reclaimed in the proximal tubule via a coupled process involving carbonic anhydrase and the Na⁺/H⁺ exchanger, well before the fluid reaches more distal segments.",strongestDistractorAnalysis:"‘Bowman's space’ is the strongest distractor: bicarbonate is genuinely present in the fluid as soon as it is filtered into Bowman's space, so students conflate the location where bicarbonate first appears in the tubular fluid with the location where it is actually reabsorbed, two distinct points along the nephron.",conceptId:"C_U2T18R_016"},{id:"U2R_MCQ_017",unit:"U2",topic:"U2T19R",concept:"C_U2T19R_017",type:"MCQ",stem:"Tubular secretion moves substances:",options:["From blood to tubular fluid","From tubule to blood","From bladder to ureter","From glomerulus to artery"],answer:0,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T19R_STRUCTURE_FUNCTION_CONFUSION",explanation:"“From blood to tubular fluid” is correct: tubular secretion is the active or passive movement of substances from the peritubular capillary blood into the tubular lumen, the reverse direction to reabsorption.",strongestDistractorAnalysis:"‘From tubule to blood’ is the strongest distractor: it precisely describes reabsorption, the paired but opposite process discussed alongside secretion. Students frequently transpose the two directions when the two processes are taught together as a pair.",conceptId:"C_U2T19R_017"},{id:"U2R_MCQ_018",unit:"U2",topic:"U2T19R",concept:"C_U2T19R_018",type:"MCQ",stem:"Organic acids are secreted mainly in:",options:["Renal pelvis","Proximal tubule","Collecting duct only","Bowman’s capsule"],answer:1,difficulty:"high",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T19R_REGULATION_ERROR",explanation:"“Proximal tubule” is correct: organic acids (and many drugs and their metabolites) are secreted mainly in the proximal tubule via dedicated organic anion transporters, the same segment responsible for the bulk of active reabsorption.",strongestDistractorAnalysis:"‘Collecting duct only’ is the strongest distractor: because secretion and the collecting duct are both discussed in the context of fine urinary composition control, students assume all secretion occurs distally, overlooking that the proximal tubule is the principal site for organic acid and base secretion specifically.",conceptId:"C_U2T19R_018"},{id:"U2R_MCQ_019",unit:"U2",topic:"U2T19R",concept:"C_U2T19R_019",type:"MCQ",stem:"Aldosterone promotes secretion of:",options:["Albumin","Bicarbonate exclusively","Potassium","Glucose"],answer:2,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T19R_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Potassium” is correct: aldosterone acts on principal cells of the distal nephron to stimulate sodium reabsorption coupled with potassium secretion into the tubular lumen, the basis of its role in potassium homeostasis.",strongestDistractorAnalysis:"‘Bicarbonate exclusively’ is the strongest distractor: aldosterone does have secondary effects promoting hydrogen-ion secretion (and thus indirectly bicarbonate generation) via intercalated cells, so students who know aldosterone affects acid–base handling wrongly promote this secondary, indirect effect over its principal, direct action on potassium secretion.",conceptId:"C_U2T19R_019"},{id:"U2R_MCQ_020",unit:"U2",topic:"U2T19R",concept:"C_U2T19R_020",type:"MCQ",stem:"Hydrogen secretion contributes to:",options:["Oxygen transport","Blood grouping","Coagulation","Acid–base balance"],answer:3,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T19R_REGULATION_ERROR",explanation:"“Acid–base balance” is correct: hydrogen-ion secretion by tubular cells, particularly alpha-intercalated cells in the distal nephron, is central to renal acid excretion and new bicarbonate generation, the kidney's contribution to long-term acid–base regulation.",strongestDistractorAnalysis:"None of the listed distractors (oxygen transport, blood grouping, coagulation) are physiologically related to hydrogen-ion handling — they belong to unrelated organ systems entirely. This item primarily tests whether the basic link between H⁺ secretion and acid–base balance has been learned, rather than discriminating between competing renal mechanisms.",conceptId:"C_U2T19R_020"},{id:"U2R_MCQ_021",unit:"U2",topic:"U2T20R",concept:"C_U2T20R_021",type:"MCQ",stem:"The counter-current multiplier is generated mainly by:",options:["Loops of Henle","Renal pelvis","Ureter","Bladder"],answer:0,difficulty:"high",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T20R_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Loops of Henle” is correct: the countercurrent multiplier arises from the parallel, opposite-direction flow in the descending and ascending limbs of the loop of Henle, combined with active NaCl reabsorption in the thick ascending limb, which progressively multiplies the osmotic gradient down the medulla.",strongestDistractorAnalysis:"None of the listed distractors (renal pelvis, ureter, bladder) are involved in generating the medullary osmotic gradient — they are downstream urine-collecting and -conducting structures with no countercurrent function. This item primarily tests whether the loop of Henle has been identified as the generating structure at all.",conceptId:"C_U2T20R_021"},{id:"U2R_MCQ_022",unit:"U2",topic:"U2T20R",concept:"C_U2T20R_022",type:"MCQ",stem:"Descending thin limb is highly permeable to:",options:["Albumin","Water","Protein","Cells"],answer:1,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T20R_REGULATION_ERROR",explanation:"“Water” is correct: the descending thin limb is highly permeable to water (via constitutive aquaporin-1 channels) but has little active solute transport, so water leaves the tubular fluid into the hypertonic medullary interstitium as the fluid descends, progressively concentrating it.",strongestDistractorAnalysis:"Albumin and protein are not physiologically plausible answers for a normal permeability question (the tubule wall is not permeable to large plasma proteins under any circumstance), so the item primarily distinguishes students who recall the descending limb's defining water permeability from those who do not, rather than testing a close conceptual confusion.",conceptId:"C_U2T20R_022"},{id:"U2R_MCQ_023",unit:"U2",topic:"U2T20R",concept:"C_U2T20R_023",type:"MCQ",stem:"Thick ascending limb reabsorbs:",options:["Albumin","Glucose by SGLT1","Na+, K+ and Cl−","Only water"],answer:2,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T20R_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Na⁺, K⁺ and Cl−” is correct: the thick ascending limb actively reabsorbs these three ions via the Na-K-2Cl cotransporter (the target of loop diuretics), while remaining impermeable to water — this is the primary solute-pumping step driving the countercurrent multiplier.",strongestDistractorAnalysis:"‘Glucose by SGLT1’ is the strongest distractor: SGLT-mediated glucose transport is a genuine renal transport mechanism discussed elsewhere in this unit (proximal tubule), so students transfer this specific, memorable transporter to the thick ascending limb, which has no role in glucose handling at all.",conceptId:"C_U2T20R_023"},{id:"U2R_MCQ_024",unit:"U2",topic:"U2T20R",concept:"C_U2T20R_024",type:"MCQ",stem:"Juxtamedullary nephrons are important because they have:",options:["No glomeruli","No tubules","Only cortical ducts","Long loops"],answer:3,difficulty:"high",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T20R_REGULATION_ERROR",explanation:"“Long loops” is correct: juxtamedullary nephrons are important specifically because their long loops of Henle penetrate deep into the medulla, generating the steep osmotic gradient on which the countercurrent multiplier depends.",strongestDistractorAnalysis:"None of the listed distractors (no glomeruli, no tubules, only cortical ducts) are anatomically accurate — juxtamedullary nephrons possess normal glomeruli and full tubular segments like any other nephron. This item primarily tests whether the single defining feature (long loop length) has been correctly identified.",conceptId:"C_U2T20R_024"},{id:"U2R_MCQ_025",unit:"U2",topic:"U2T21R",concept:"C_U2T21R_025",type:"MCQ",stem:"The vasa recta primarily:",options:["Preserve medullary gradient","Generate GFR","Produce renin","Store urine"],answer:0,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T21R_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Preserve medullary gradient” is correct: the vasa recta act as countercurrent exchangers, passively equilibrating with the surrounding interstitium as they descend and ascend, which removes reabsorbed water and solute without washing out the osmotic gradient the loop of Henle has generated.",strongestDistractorAnalysis:"None of the listed distractors (generate GFR, produce renin, store urine) describe a genuine vasa recta function — these belong to the glomerulus, juxtaglomerular apparatus and urinary tract respectively. This item primarily tests whether the vasa recta's gradient-preserving role has been correctly identified.",conceptId:"C_U2T21R_025"},{id:"U2R_MCQ_026",unit:"U2",topic:"U2T21R",concept:"C_U2T21R_026",type:"MCQ",stem:"As blood descends in vasa recta, it generally:",options:["Secretes ADH","Gains solute and loses water","Loses solute and gains water","Filters protein"],answer:1,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T21R_REGULATION_ERROR",explanation:"“Gains solute and loses water” is correct: as blood descends into the increasingly hypertonic medulla, the vasa recta lose water and gain solute by passive diffusion, equilibrating with the surrounding interstitium at each level.",strongestDistractorAnalysis:"‘Loses solute and gains water’ is the strongest distractor: it describes the correct behaviour of the ascending, not descending, limb of the vasa recta. Students transpose the two limbs' reciprocal exchange directions, the same descending/ascending confusion tested elsewhere in this unit for the loop of Henle.",conceptId:"C_U2T21R_026"},{id:"U2R_MCQ_027",unit:"U2",topic:"U2T21R",concept:"C_U2T21R_027",type:"MCQ",stem:"Slow vasa recta flow helps prevent:",options:["Micturition","Erythropoiesis","Medullary washout","Glomerular filtration"],answer:2,difficulty:"high",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T21R_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Medullary washout” is correct: slow vasa recta blood flow allows adequate time for countercurrent exchange to occur, minimising net solute removal from the medullary interstitium; rapid flow would instead sweep accumulated solute away and dissipate the gradient (washout).",strongestDistractorAnalysis:"None of the listed distractors (micturition, erythropoiesis, glomerular filtration) are affected by vasa recta flow rate — they are unrelated renal or systemic processes. This item primarily tests whether the specific consequence of flow rate on gradient preservation has been learned.",conceptId:"C_U2T21R_027"},{id:"U2R_MCQ_028",unit:"U2",topic:"U2T21R",concept:"C_U2T21R_028",type:"MCQ",stem:"Counter-current exchange is mainly:",options:["ATP-dependent throughout","A glomerular process","A bladder reflex","Passive"],answer:3,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T21R_REGULATION_ERROR",explanation:"“Passive” is correct: countercurrent exchange in the vasa recta relies entirely on passive diffusion of water and solute down their concentration gradients as blood flows through the hairpin-shaped capillaries; no active transport step drives the exchange itself.",strongestDistractorAnalysis:"‘ATP-dependent throughout’ is the strongest distractor: students conflate the vasa recta's passive exchange with the genuinely active, ATP-dependent NaCl reabsorption occurring in the adjacent thick ascending limb, attributing the tubule's active transport property to the nearby but functionally distinct capillary network.",conceptId:"C_U2T21R_028"},{id:"U2R_MCQ_029",unit:"U2",topic:"U2T22R",concept:"C_U2T22R_029",type:"MCQ",stem:"ADH increases collecting-duct water permeability by inserting:",options:["Aquaporin-2","SGLT1","CFTR","Na/K pump into lumen"],answer:0,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T22R_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Aquaporin-2” is correct: ADH binding to V2 receptors on collecting-duct principal cells triggers insertion of aquaporin-2 water channels into the apical membrane, increasing water permeability and allowing water reabsorption down the medullary osmotic gradient.",strongestDistractorAnalysis:"‘Na/K pump into lumen’ is the strongest distractor: the Na⁺/K⁺-ATPase is a genuine and essential transporter in collecting-duct principal cells, but it resides on the basolateral membrane driving sodium reabsorption, not inserted into the apical (luminal) membrane, and it is not the specific channel ADH inserts to increase water permeability.",conceptId:"C_U2T22R_029"},{id:"U2R_MCQ_030",unit:"U2",topic:"U2T22R",concept:"C_U2T22R_030",type:"MCQ",stem:"Low ADH produces:",options:["Proteinuria","Dilute urine","Maximally concentrated urine","No urine"],answer:1,difficulty:"high",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T22R_REGULATION_ERROR",explanation:"“Dilute urine” is correct: with low ADH, collecting ducts remain relatively water-impermeable, so the dilute fluid delivered from the thick ascending limb passes through largely unmodified, producing a large volume of dilute urine.",strongestDistractorAnalysis:"‘Maximally concentrated urine’ is the strongest distractor: it directly inverts the correct relationship. Students who have not fixed the direction of ADH's effect (high ADH → concentrated urine, low ADH → dilute urine) select the opposite outcome for a low-ADH state.",conceptId:"C_U2T22R_030"},{id:"U2R_MCQ_031",unit:"U2",topic:"U2T22R",concept:"C_U2T22R_031",type:"MCQ",stem:"Urea recycling contributes to:",options:["Coagulation","ECG waves","Inner medullary hypertonicity","ABO grouping"],answer:2,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T22R_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Inner medullary hypertonicity” is correct: urea recycling — reabsorption from the inner medullary collecting duct and re-secretion into the thin limbs of the loop — contributes substantially to the osmotic gradient in the inner medulla, supplementing the NaCl gradient generated by the loop.",strongestDistractorAnalysis:"None of the listed distractors (coagulation, ECG waves, ABO grouping) are physiologically related to urea handling — they belong to unrelated organ systems. This item primarily tests whether urea's specific contribution to medullary hypertonicity, beyond the NaCl-based multiplier, has been learned.",conceptId:"C_U2T22R_031"},{id:"U2R_MCQ_032",unit:"U2",topic:"U2T22R",concept:"C_U2T22R_032",type:"MCQ",stem:"Urine concentration requires:",options:["Only high GFR","Only albumin","Only aldosterone","Medullary gradient and ADH-responsive collecting ducts"],answer:3,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T22R_REGULATION_ERROR",explanation:"“Medullary gradient and ADH-responsive collecting ducts” is correct: maximal urine concentration requires both a steep medullary osmotic gradient (generated by the loop of Henle and preserved by the vasa recta) and collecting ducts capable of responding to ADH by inserting aquaporins — either component alone is insufficient.",strongestDistractorAnalysis:"‘Only high GFR’ is the strongest distractor: GFR determines the filtered load entering the nephron but does not by itself determine how concentrated the final urine becomes; students conflate the volume of fluid filtered with the separate mechanisms that concentrate it during its passage through the nephron.",conceptId:"C_U2T22R_032"},{id:"U2R_MCQ_033",unit:"U2",topic:"U2T23R",concept:"C_U2T23R_033",type:"MCQ",stem:"Renal autoregulation stabilises:",options:["Renal blood flow and GFR","ABO antibodies","Heart sounds","Ventilation"],answer:0,difficulty:"high",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T23R_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Renal blood flow and GFR” is correct: renal autoregulation, via the myogenic response and tubuloglomerular feedback, keeps both renal blood flow and GFR relatively constant across a wide range of arterial pressures (roughly 80–180 mmHg).",strongestDistractorAnalysis:"None of the listed distractors (ABO antibodies, heart sounds, ventilation) are renal parameters at all — they belong to unrelated organ systems. This item primarily tests whether the two specific quantities stabilised by renal autoregulation have been correctly identified.",conceptId:"C_U2T23R_033"},{id:"U2R_MCQ_034",unit:"U2",topic:"U2T23R",concept:"C_U2T23R_034",type:"MCQ",stem:"Severe sympathetic activation generally:",options:["Causes glucosuria only","Reduces renal blood flow and stimulates renin","Increases GFR greatly","Blocks renin"],answer:1,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T23R_REGULATION_ERROR",explanation:"“Reduces renal blood flow and stimulates renin” is correct: severe sympathetic activation causes marked afferent and efferent arteriolar vasoconstriction, reducing renal blood flow, while also directly stimulating renin release from juxtaglomerular cells via beta-1 adrenergic receptors.",strongestDistractorAnalysis:"‘Increases GFR greatly’ is the strongest distractor: students who know sympathetic activation is a generic ‘fight or flight’ response assume it universally increases organ perfusion and function, missing that the kidney is specifically a target of vasoconstriction and reduced perfusion during severe sympathetic activation, protecting more critical organs at the kidney's expense.",conceptId:"C_U2T23R_034"},{id:"U2R_MCQ_035",unit:"U2",topic:"U2T23R",concept:"C_U2T23R_035",type:"MCQ",stem:"ANP generally promotes:",options:["Potassium retention only","Renin release","Natriuresis","Sodium retention"],answer:2,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T23R_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Natriuresis” is correct: atrial natriuretic peptide, released in response to atrial stretch, promotes sodium excretion (natriuresis) by increasing GFR and directly inhibiting sodium reabsorption in the collecting duct, opposing the sodium-retaining actions of the RAAS.",strongestDistractorAnalysis:"‘Renin release’ is the strongest distractor: ANP and renin are both discussed as opposing regulators of sodium balance, so students confuse which one ANP itself does — ANP actually suppresses renin release, it does not stimulate it; the two hormones act in opposite directions on the renal handling of sodium.",conceptId:"C_U2T23R_035"},{id:"U2R_MCQ_036",unit:"U2",topic:"U2T23R",concept:"C_U2T23R_036",type:"MCQ",stem:"PTH mainly increases renal reabsorption of:",options:["Phosphate","Glucose","Albumin","Calcium"],answer:3,difficulty:"high",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T23R_REGULATION_ERROR",explanation:"“Calcium” is correct: parathyroid hormone increases distal tubular calcium reabsorption while simultaneously decreasing phosphate reabsorption, raising plasma calcium and lowering plasma phosphate.",strongestDistractorAnalysis:"Phosphate is the strongest distractor: PTH genuinely and prominently affects phosphate handling in the kidney, so students who recall ‘PTH and phosphate’ as a paired concept select phosphate without recalling that PTH's renal effect on phosphate is to decrease its reabsorption (promoting excretion), the opposite direction from its effect on calcium.",conceptId:"C_U2T23R_036"},{id:"U2R_MCQ_037",unit:"U2",topic:"U2T24R",concept:"C_U2T24R_037",type:"MCQ",stem:"The basic micturition reflex centre is in the:",options:["Sacral spinal cord","Cerebral cortex only","Cervical cord","Renal cortex"],answer:0,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T24R_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Sacral spinal cord” is correct: the basic micturition reflex is integrated in the sacral spinal cord (S2–S4), where afferent stretch signals from the bladder wall trigger parasympathetic efferent output to the detrusor muscle, though higher centres normally modulate voluntary control.",strongestDistractorAnalysis:"‘Cerebral cortex only’ is the strongest distractor: the cortex genuinely provides voluntary, learned control over the timing of micturition, so students conflate this higher modulatory role with the location of the basic reflex arc itself, which is spinal (sacral), not cortical.",conceptId:"C_U2T24R_037"},{id:"U2R_MCQ_038",unit:"U2",topic:"U2T24R",concept:"C_U2T24R_038",type:"MCQ",stem:"Parasympathetic activation causes:",options:["Glomerular filtration stop","Detrusor contraction","External sphincter contraction","Renin release"],answer:1,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T24R_REGULATION_ERROR",explanation:"“Detrusor contraction” is correct: parasympathetic activation (via pelvic nerve, S2–S4) releases acetylcholine acting on muscarinic receptors of the detrusor muscle, causing it to contract and expel urine during voiding.",strongestDistractorAnalysis:"‘External sphincter contraction’ is the strongest distractor: the external sphincter is under separate somatic (pudendal nerve) control, not parasympathetic control, so students conflate the two distinct nervous pathways governing bladder emptying — detrusor contraction (parasympathetic) and sphincter relaxation, which must occur together but via different nerves.",conceptId:"C_U2T24R_038"},{id:"U2R_MCQ_039",unit:"U2",topic:"U2T24R",concept:"C_U2T24R_039",type:"MCQ",stem:"The external urethral sphincter is controlled by:",options:["Phrenic nerve","Optic nerve","Pudendal nerve","Vagus nerve"],answer:2,difficulty:"high",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T24R_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Pudendal nerve” is correct: the external urethral sphincter is skeletal muscle under voluntary somatic control via the pudendal nerve, allowing conscious delay of micturition even when the reflex urge to void is present.",strongestDistractorAnalysis:"‘Vagus nerve’ is the strongest distractor: the vagus is the major parasympathetic nerve associated with many visceral functions, so students over-generalise its role to bladder control, missing that bladder parasympathetic supply is actually via the pelvic nerve (sacral outflow), and the external sphincter specifically is somatic (pudendal), not autonomic, altogether.",conceptId:"C_U2T24R_039"},{id:"U2R_MCQ_040",unit:"U2",topic:"U2T24R",concept:"C_U2T24R_040",type:"MCQ",stem:"During storage, sympathetic activity generally:",options:["Causes detrusor contraction","Opens external sphincter","Generates urine concentration directly","Promotes continence"],answer:3,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T24R_REGULATION_ERROR",explanation:"“Promotes continence” is correct: during the storage phase, sympathetic activity (via the hypogastric nerve) relaxes the detrusor and contracts the internal sphincter, actively promoting continence while the bladder fills.",strongestDistractorAnalysis:"‘Causes detrusor contraction’ is the strongest distractor: this describes the parasympathetic voiding response, the opposite phase to storage. Students transpose the sympathetic (storage) and parasympathetic (voiding) roles, a common autonomic mix-up when the two phases are taught together.",conceptId:"C_U2T24R_040"},{id:"U2R_MCQ_041",unit:"U2",topic:"U2T25R",concept:"C_U2T25R_041",type:"MCQ",stem:"Most bicarbonate is reclaimed in:",options:["Proximal tubule","Renal pelvis","Ureter","Bladder"],answer:0,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T25R_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Proximal tubule” is correct: approximately 80–90% of filtered bicarbonate is reclaimed in the proximal tubule, via carbonic anhydrase-dependent processing at both the luminal and basolateral membranes, before the remaining fraction is handled more distally.",strongestDistractorAnalysis:"None of the listed distractors (renal pelvis, ureter, bladder) are sites of bicarbonate transport — they are downstream urine-conducting structures with no tubular reabsorptive epithelium of this kind. This item primarily tests whether the proximal tubule has been identified as the dominant reclamation site.",conceptId:"C_U2T25R_041"},{id:"U2R_MCQ_042",unit:"U2",topic:"U2T25R",concept:"C_U2T25R_042",type:"MCQ",stem:"Ammonium excretion helps:",options:["Produce insulin","Generate new bicarbonate and excrete acid","Carry oxygen","Form fibrin"],answer:1,difficulty:"high",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T25R_REGULATION_ERROR",explanation:"“Generate new bicarbonate and excrete acid” is correct: ammonium (NH₄⁺) excretion allows the kidney to excrete hydrogen ions bound to ammonia while generating new bicarbonate within tubular cells, replenishing bicarbonate consumed by buffering metabolic acids — distinct from simply reclaiming filtered bicarbonate.",strongestDistractorAnalysis:"None of the listed distractors (insulin production, oxygen carriage, fibrin formation) are related to renal acid handling — they belong to unrelated organ systems and hormones. This item primarily tests whether ammoniagenesis's specific role in generating new bicarbonate has been learned.",conceptId:"C_U2T25R_042"},{id:"U2R_MCQ_043",unit:"U2",topic:"U2T25R",concept:"C_U2T25R_043",type:"MCQ",stem:"Alpha-intercalated cells secrete:",options:["Albumin","Erythrocytes","Hydrogen ions","Glucose"],answer:2,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T25R_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Hydrogen ions” is correct: alpha-intercalated cells in the distal nephron actively secrete H⁺ into the tubular lumen via H⁺-ATPase and H⁺/K⁺-ATPase pumps, a key step in renal acid excretion, particularly under acidotic conditions.",strongestDistractorAnalysis:"None of the listed distractors (albumin, erythrocytes, glucose) are genuine intercalated-cell secretory products — albumin and glucose are handled by proximal tubular reabsorption, not distal secretion, and erythrocytes are not a normal tubular secretion at all. This item primarily tests whether the specific secretory function of alpha-intercalated cells has been learned.",conceptId:"C_U2T25R_043"},{id:"U2R_MCQ_044",unit:"U2",topic:"U2T25R",concept:"C_U2T25R_044",type:"MCQ",stem:"Renal compensation for respiratory acidosis is:",options:["Instantaneous","Absent","Faster than neural reflexes","Slower than ventilatory compensation"],answer:3,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T25R_REGULATION_ERROR",explanation:"“Slower than ventilatory compensation” is correct: renal compensation for an acid–base disturbance takes hours to days (adjusting bicarbonate reabsorption and acid excretion), considerably slower than the ventilatory (respiratory) compensation, which acts within minutes by adjusting CO₂ elimination.",strongestDistractorAnalysis:"‘Instantaneous’ is the strongest distractor: students who know the kidney does eventually compensate effectively assume this compensation is rapid, like the neural reflexes governing ventilation, rather than recognising renal compensation is a slower, cellular adaptive process taking hours to days to fully develop.",conceptId:"C_U2T25R_044"},{id:"U2R_MCQ_045",unit:"U2",topic:"U2T26R",concept:"C_U2T26R_045",type:"MCQ",stem:"Renin converts angiotensinogen to:",options:["Angiotensin I","Angiotensin II directly","Aldosterone","ADH"],answer:0,difficulty:"high",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T26R_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Angiotensin I” is correct: renin, released from juxtaglomerular cells, cleaves circulating angiotensinogen (produced by the liver) to form angiotensin I, the first step of the RAAS cascade.",strongestDistractorAnalysis:"‘Angiotensin II directly’ is the strongest distractor: students who know renin is ‘the enzyme that starts RAAS’ assume it produces the cascade's most clinically emphasised, biologically active end-product directly, skipping the intermediate step performed by ACE, which converts angiotensin I to angiotensin II.",conceptId:"C_U2T26R_045"},{id:"U2R_MCQ_046",unit:"U2",topic:"U2T26R",concept:"C_U2T26R_046",type:"MCQ",stem:"ACE converts angiotensin I to:",options:["ANP","Angiotensin II","Renin","Aldosterone"],answer:1,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T26R_REGULATION_ERROR",explanation:"“Angiotensin II” is correct: angiotensin-converting enzyme, mainly in pulmonary vascular endothelium, cleaves angiotensin I to form angiotensin II, the principal active effector peptide of the RAAS.",strongestDistractorAnalysis:"Aldosterone is the strongest distractor: it is the hormone most closely associated with the downstream effects of RAAS activation, so students conflate ACE's direct enzymatic product (angiotensin II) with the further downstream hormone (aldosterone) that angiotensin II subsequently stimulates.",conceptId:"C_U2T26R_046"},{id:"U2R_MCQ_047",unit:"U2",topic:"U2T26R",concept:"C_U2T26R_047",type:"MCQ",stem:"Angiotensin II generally:",options:["Blocks thirst","Reduces sodium reabsorption","Causes vasoconstriction and stimulates aldosterone","Causes natriuresis only"],answer:2,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T26R_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Causes vasoconstriction and stimulates aldosterone” is correct: angiotensin II is a potent vasoconstrictor acting on arteriolar smooth muscle and also stimulates the adrenal cortex to release aldosterone, together raising blood pressure and promoting sodium retention.",strongestDistractorAnalysis:"‘Reduces sodium reabsorption’ is the strongest distractor: it inverts angiotensin II's actual effect. Students who have not fixed the direction of RAAS's overall action (a pressure- and volume-raising system) assume one of its effector hormones might act oppositely, rather than recognising all RAAS components act concordantly to retain sodium and raise pressure.",conceptId:"C_U2T26R_047"},{id:"U2R_MCQ_048",unit:"U2",topic:"U2T26R",concept:"C_U2T26R_048",type:"MCQ",stem:"Aldosterone acts mainly on:",options:["Glomerular capillaries only","Renal pelvis","Ureter","Distal nephron"],answer:3,difficulty:"high",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T26R_REGULATION_ERROR",explanation:"“Distal nephron” is correct: aldosterone acts on principal cells of the distal convoluted tubule and collecting duct, stimulating sodium reabsorption (with water following) and potassium secretion via upregulation of epithelial sodium channels and Na⁺/K⁺-ATPase.",strongestDistractorAnalysis:"‘Glomerular capillaries only’ is the strongest distractor: students who know angiotensin II acts on glomerular arterioles (a genuinely upstream RAAS effect) wrongly extend this glomerular site of action to aldosterone as well, rather than recognising aldosterone's action is specifically tubular, further downstream in the nephron.",conceptId:"C_U2T26R_048"},{id:"U2R_MCQ_049",unit:"U2",topic:"U2T27R",concept:"C_U2T27R_049",type:"MCQ",stem:"ADH primarily regulates:",options:["Water permeability","ABO antigens","Platelet count","ECG axis"],answer:0,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T27R_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Water permeability” is correct: ADH's principal renal action is increasing collecting-duct water permeability via aquaporin-2 insertion; its effects on urea transport and some vasoconstriction are secondary to this primary role.",strongestDistractorAnalysis:"None of the listed distractors (ABO antigens, platelet count, ECG axis) are influenced by ADH — they belong to unrelated organ systems. This item primarily tests whether ADH's defining renal target (water permeability) has been correctly identified.",conceptId:"C_U2T27R_049"},{id:"U2R_MCQ_050",unit:"U2",topic:"U2T27R",concept:"C_U2T27R_050",type:"MCQ",stem:"Aldosterone promotes:",options:["Calcium loss only","Sodium retention and potassium secretion","Glucose excretion","Protein filtration"],answer:1,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T27R_REGULATION_ERROR",explanation:"“Sodium retention and potassium secretion” is correct: aldosterone's principal renal actions are stimulating distal nephron sodium reabsorption (with water following osmotically) and coupled potassium secretion, its core role in electrolyte and volume homeostasis.",strongestDistractorAnalysis:"‘Glucose excretion’ is the strongest distractor: students who know aldosterone regulates tubular transport broadly may wrongly extend its action to glucose handling, which is instead governed by the proximal tubule's transport maximum for glucose, an entirely separate mechanism unrelated to aldosterone.",conceptId:"C_U2T27R_050"},{id:"U2R_MCQ_051",unit:"U2",topic:"U2T27R",concept:"C_U2T27R_051",type:"MCQ",stem:"Natriuretic peptides generally oppose:",options:["Thyroid hormone","Erythropoietin","RAAS","Insulin"],answer:2,difficulty:"high",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T27R_STRUCTURE_FUNCTION_CONFUSION",explanation:"“RAAS” is correct: natriuretic peptides (ANP, BNP) oppose the renin–angiotensin–aldosterone system at multiple levels — suppressing renin release, inhibiting aldosterone secretion and directly promoting natriuresis — acting as a counter-regulatory system to RAAS.",strongestDistractorAnalysis:"None of the listed distractors (thyroid hormone, erythropoietin, insulin) are functionally opposed by natriuretic peptides — they are unrelated endocrine axes. This item primarily tests whether natriuretic peptides' specific counter-regulatory relationship to RAAS has been learned.",conceptId:"C_U2T27R_051"},{id:"U2R_MCQ_052",unit:"U2",topic:"U2T27R",concept:"C_U2T27R_052",type:"MCQ",stem:"PTH decreases tubular reabsorption of:",options:["Calcium","Water","Glucose","Phosphate"],answer:3,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T27R_REGULATION_ERROR",explanation:"“Phosphate” is correct: PTH decreases proximal tubular phosphate reabsorption, promoting phosphate excretion, while simultaneously increasing distal tubular calcium reabsorption — its two renal actions move plasma calcium and phosphate in opposite directions.",strongestDistractorAnalysis:"Calcium is the strongest distractor: PTH is most closely associated with raising plasma calcium, so students who recall ‘PTH raises calcium’ as its defining action assume it must also increase calcium reabsorption specifically at the point tested here, missing that this question asks about the tubular reabsorption it decreases (phosphate), not the one it increases (calcium).",conceptId:"C_U2T27R_052"},{id:"U2R_MCQ_053",unit:"U2",topic:"U2T28R",concept:"C_U2T28R_053",type:"MCQ",stem:"Clearance formula is:",options:["U×V/P","P×V/U","U/P only","V/P only"],answer:0,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T28R_STRUCTURE_FUNCTION_CONFUSION",explanation:"“U×V/P” is correct: clearance is defined as the volume of plasma from which a substance is completely removed per unit time, calculated as urine concentration (U) multiplied by urine flow rate (V), divided by plasma concentration (P).",strongestDistractorAnalysis:"‘P×V/U’ is the strongest distractor: it inverts the U and P terms of the correct formula. Students who recall the three variables involved (U, V, P) but not their precise arrangement produce a plausible-looking but dimensionally and physiologically incorrect ratio.",conceptId:"C_U2T28R_053"},{id:"U2R_MCQ_054",unit:"U2",topic:"U2T28R",concept:"C_U2T28R_054",type:"MCQ",stem:"Inulin clearance measures:",options:["Micturition","GFR","Renal plasma flow","Urine concentration only"],answer:1,difficulty:"high",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T28R_REGULATION_ERROR",explanation:"“GFR” is correct: inulin is freely filtered at the glomerulus and is neither reabsorbed nor secreted by the tubules, so its clearance exactly equals the glomerular filtration rate, making it the gold-standard marker for measuring GFR.",strongestDistractorAnalysis:"‘Renal plasma flow’ is the strongest distractor: it is the quantity measured by a different marker (PAH) discussed in the same topic, so students conflate the two clearance-based renal indices, each requiring a substance with specific, distinct handling properties (freely filtered only, versus filtered and fully secreted).",conceptId:"C_U2T28R_054"},{id:"U2R_MCQ_055",unit:"U2",topic:"U2T28R",concept:"C_U2T28R_055",type:"MCQ",stem:"Creatinine clearance usually slightly:",options:["Measures only RPF","Equals urine flow","Overestimates GFR","Underestimates GFR greatly"],answer:2,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T28R_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Overestimates GFR” is correct: creatinine is freely filtered but also undergoes a small amount of proximal tubular secretion, adding extra creatinine to the urine beyond what was filtered, so creatinine clearance slightly overestimates true GFR compared with the inulin gold standard.",strongestDistractorAnalysis:"‘Underestimates GFR greatly’ is the strongest distractor: it gets both the direction and the magnitude wrong. Students who know creatinine clearance is an imperfect (not exact) GFR marker may default to assuming any imperfection means underestimation, and may overstate the size of the discrepancy, which is normally small, not great.",conceptId:"C_U2T28R_055"},{id:"U2R_MCQ_056",unit:"U2",topic:"U2T28R",concept:"C_U2T28R_056",type:"MCQ",stem:"PAH clearance approximates:",options:["GFR","Osmolar clearance only","Free-water clearance only","Effective renal plasma flow"],answer:3,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T28R_REGULATION_ERROR",explanation:"“Effective renal plasma flow” is correct: PAH is both filtered and almost completely secreted by the proximal tubule in a single renal pass, so its clearance closely approximates the effective renal plasma flow, distinct from GFR (measured by inulin, filtered but not secreted).",strongestDistractorAnalysis:"GFR is the strongest distractor: both inulin and PAH clearance are renal function markers taught together, so students conflate which marker measures which quantity — inulin (filtered only) measures GFR, while PAH (filtered and secreted) measures renal plasma flow, a larger, different quantity.",conceptId:"C_U2T28R_056"},{id:"U2R_MCQ_057",unit:"U2",topic:"U2T29R",concept:"C_U2T29R_
