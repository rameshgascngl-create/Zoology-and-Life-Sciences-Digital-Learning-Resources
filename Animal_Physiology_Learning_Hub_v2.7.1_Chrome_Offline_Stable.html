rand) 7%,var(--panel));scroll-snap-align:start;font-weight:650}.lesson-flow-arrow{display:flex;align-items:center;justify-content:center;min-width:28px;color:var(--brand2);font-size:1.45rem;font-weight:900}.graph-controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.graph-controls button[aria-pressed=true]{background:var(--brand);color:#fff}.graph-unit{margin:22px 0}.graph-node{position:relative;border-top:4px solid var(--brand)}.graph-node .graph-links{font-size:.9rem;color:var(--muted)}.graph-edge-list{margin-top:20px}.graph-flow-lane{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:12px 2px}.graph-flow-lane .step{min-width:170px;flex:0 0 170px;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;background:var(--panel)}.graph-flow-lane .arrow{font-size:1.35rem;color:var(--brand2);font-weight:900}@media (max-width:600px){.lesson-flow-step{min-width:135px}.graph-flow-lane .step{min-width:150px;flex-basis:150px}}@media (prefers-reduced-motion:reduce){.graph-flow-lane,.lesson-flow{scroll-behavior:auto}}.advanced-intro{border-left:5px solid var(--brand2)}.masterclass{padding:0;overflow:clip}.masterclass>summary{cursor:pointer;list-style:none;padding:18px;display:grid;gap:4px}.masterclass>summary::-webkit-details-marker{display:none}.masterclass>summary::after{content:"Expand masterclass";color:var(--muted);font-size:.82rem}.masterclass[open]>summary::after{content:"Collapse masterclass"}.masterclass-body{padding:0 18px 18px;border-top:1px solid var(--line)}.equation{padding:12px;border-radius:10px;background:rgba(7,94,84,.1);font-weight:700;overflow-wrap:anywhere}.knowledge-lens{border-left:4px solid var(--brand2);padding-left:14px}.advanced-bridge{background:linear-gradient(135deg,rgba(7,94,84,.08),rgba(19,124,108,.04))}@media (max-width:520px){.masterclass-body,.masterclass>summary{padding-left:14px;padding-right:14px}}</style></head><body data-theme="light"><a class="skip" href="#mainContent">Skip to main content</a><div class="shell"><aside id="sidebar" aria-label="Primary navigation"><div class="brand">Animal Physiology Hub<small>B.Sc. Zoology · Mammalian, human and comparative physiology</small></div><nav class="nav" id="nav"></nav></aside><main><header><button class="icon" id="menuBtn" type="button" aria-controls="sidebar" aria-expanded="false">☰ Menu</button><div class="search-wrap"><label class="sr-only" for="searchTypeFilter">Filter search results</label><select id="searchTypeFilter"><option value="all">All</option><option value="topic">Topics</option><option value="advanced">Advanced physiology</option><option value="glossary">Glossary</option><option value="diagram">Diagrams</option><option value="resource">Resources</option><option value="question">Questions</option><option value="flashcard">Flashcards</option></select><input id="search" type="search" role="combobox" aria-haspopup="listbox" aria-autocomplete="list" aria-expanded="false" aria-controls="searchResults" aria-label="Search all content" placeholder="Search mechanisms, topics and terms…"><div id="searchResults" class="search-results" role="listbox" aria-live="polite" aria-label="Search results" hidden></div></div><button class="icon" id="themeBtn" type="button" aria-label="Toggle dark mode">◐</button><button class="icon" id="printBtn" type="button" aria-label="Print current study view">Print</button></header><div id="mainContent" class="content" tabindex="-1"></div></main></div><script>"use strict";const AnimalPhysiologyApp={version:"2.7.1",status:"Chrome Offline Stable — deferred startup indexing, topic-level resource loading, fixed embedded-diagram routing and file-safe navigation"};AnimalPhysiologyApp.Data={units:[{id:"U1",title:"Nutrition and Respiration",icon:"🍽️",topics:[["U1T1","Digestive System Organisation","The alimentary canal is a continuous muscular tube extending from mouth to anus. Its regional specialisation permits ingestion, propulsion, mechanical digestion, chemical digestion, absorption and elimination. The mucosa supports secretion and absorption; the submucosa contains vessels and the submucosal plexus; the muscularis externa produces mixing and peristalsis; and the serosa or adventitia anchors the organ. Accessory organs—salivary glands, liver, gallbladder and pancreas—add secretions. Neural control is provided by the enteric nervous system and autonomic input, while gastrointestinal hormones coordinate secretion and motility."],["U1T2","Digestive Secretions","Saliva lubricates food and initiates starch digestion through salivary amylase. Gastric glands secrete hydrochloric acid, pepsinogen, mucus, bicarbonate and intrinsic factor. Pancreatic juice contains bicarbonate and enzymes for proteins, carbohydrates, lipids and nucleic acids. Bile salts emulsify lipids but bile contains no digestive enzyme. Intestinal secretions provide mucus, bicarbonate and brush-border enzymes. Neural reflexes and hormones such as gastrin, secretin and cholecystokinin regulate secretion."],["U1T3","Carbohydrate Digestion and Absorption","Salivary and pancreatic amylases hydrolyse starch. Brush-border maltase, sucrase-isomaltase and lactase produce monosaccharides. Glucose and galactose enter enterocytes mainly through SGLT1, fructose through GLUT5, and all leave through GLUT2 into portal blood. Cellulose is not digested because human enzymes cannot hydrolyse beta-1,4 glycosidic bonds."],["U1T4","Protein Digestion and Absorption","Pepsin begins protein digestion in the stomach. Pancreatic trypsin, chymotrypsin, elastase and carboxypeptidases act in the small intestine. Enteropeptidase activates trypsinogen, and trypsin activates other zymogens. Amino acids use sodium-dependent carriers, while dipeptides and tripeptides use PepT1 and are usually hydrolysed within enterocytes before entering portal blood."],["U1T5","Lipid Digestion and Absorption","Bile salts emulsify fat and facilitate mixed micelle formation. Pancreatic lipase with colipase converts triglycerides mainly into monoglycerides and free fatty acids. Lipid products enter enterocytes, are re-esterified and assembled into chylomicrons. Chylomicrons enter lacteals and reach blood through lymph, while short-chain fatty acids can pass directly into portal blood."],["U1T6","Pulmonary Ventilation","The conducting zone conditions air, whereas the respiratory zone contains gas-exchange surfaces. Quiet inspiration is active because diaphragm and external intercostal contraction increases thoracic volume and lowers alveolar pressure. Quiet expiration is usually passive. Surfactant from type II pneumocytes lowers surface tension and reduces alveolar collapse. Compliance, airway resistance and elastic recoil determine the work of breathing."],["U1T7","Gas Exchange and Transport","Oxygen and carbon dioxide diffuse down partial-pressure gradients. Oxygen is transported mainly bound to haemoglobin. Increased carbon dioxide, hydrogen ion, temperature and 2,3-BPG reduce haemoglobin affinity and facilitate unloading. Carbon dioxide is carried mainly as bicarbonate, with smaller carbamino and dissolved fractions. Carbonic anhydrase accelerates bicarbonate formation, and the chloride shift maintains electrical neutrality."],["U1T8","Regulation of Respiration","Medullary networks generate respiratory rhythm and pontine centres modify it. Central chemoreceptors respond indirectly to carbon dioxide through cerebrospinal-fluid hydrogen ion concentration. Peripheral chemoreceptors in carotid and aortic bodies respond strongly to low arterial oxygen and also to carbon dioxide and pH. Pulmonary receptors and higher centres further modify breathing."]]},{id:"U2",title:"Circulation and Excretion",icon:"❤️",topics:[["U2T1","Composition of Blood","Blood is a specialised connective tissue composed of plasma and formed elements. Plasma accounts for roughly 55% of blood volume and contains water, electrolytes, nutrients, metabolic wastes, hormones and proteins. Formed elements include erythrocytes, leucocytes and platelets. Blood transports respiratory gases, nutrients, hormones and wastes; distributes heat; buffers hydrogen-ion concentration; maintains fluid balance; and protects the body through immune and haemostatic mechanisms. Haematocrit represents the fraction of blood occupied by erythrocytes, whereas plasma volume and cell mass vary with hydration, altitude, age and physiological state."],["U2T2","Plasma Proteins","The principal plasma proteins are albumin, globulins and fibrinogen. Albumin, synthesised by the liver, is the most abundant and contributes strongly to plasma colloid osmotic pressure; it also transports fatty acids, bilirubin, hormones, calcium and drugs. Alpha and beta globulins include transport proteins, complement and clotting-related proteins, while gamma globulins are immunoglobulins produced by plasma cells. Fibrinogen is a soluble precursor converted to fibrin during coagulation. Protein concentration is influenced by synthesis, distribution, catabolism and loss through kidney, intestine, skin or haemorrhage."],["U2T3","Formed Elements of Blood","Erythrocytes are anucleate biconcave cells specialised for respiratory-gas transport through haemoglobin. Leucocytes include neutrophils, eosinophils, basophils, lymphocytes and monocytes, each with distinct immune functions. Platelets are cytoplasmic fragments derived from megakaryocytes and participate in primary haemostasis, coagulation support and vascular repair. A differential leucocyte count describes the relative proportions of white-cell types. Morphology, number and function must be interpreted together because a normal count does not always imply normal cellular function."],["U2T4B","Haemopoiesis","Haemopoiesis is the continuous production of blood cells from self-renewing haematopoietic stem cells. In adults it occurs mainly in red bone marrow. Stem cells generate myeloid and lymphoid progenitors that differentiate under the influence of cytokines and colony-stimulating factors. Erythropoietin from the kidney promotes erythroid survival and maturation; thrombopoietin supports megakaryocyte and platelet production; and colony-stimulating factors regulate granulocyte and monocyte lineages. Effective haemopoiesis requires iron, vitamin B12, folate, amino acids and a functional marrow microenvironment."],["U2T5B","Blood Groups and Rh Factor","The ABO system is determined by A and B carbohydrate antigens on erythrocytes and naturally occurring plasma antibodies against absent antigens. Incompatible transfusion can cause rapid agglutination and intravascular haemolysis. The Rh system includes several antigens, of which D is the most clinically important. Anti-D is not naturally present but can develop after exposure through transfusion or pregnancy. Compatibility testing includes ABO and Rh typing, antibody screening and cross-matching. The Bombay phenotype lacks the H antigen needed to express A or B antigens and requires specially compatible blood."],["U2T6B","Haemostasis and Blood Coagulation","Haemostasis limits blood loss while maintaining fluid blood elsewhere. Vascular constriction is followed by primary haemostasis, in which platelets adhere through von Willebrand factor, activate and aggregate. Secondary haemostasis generates thrombin and fibrin through tissue-factor and contact-related pathways that converge on factor X activation. Thrombin converts fibrinogen to fibrin and activates factor XIII, which stabilises the clot. Antithrombin, protein C, protein S and tissue-factor pathway inhibitor limit coagulation, while plasmin removes fibrin during fibrinolysis."],["U2T7C","Gross Anatomy of the Heart","The heart is a four-chambered muscular pump enclosed by the pericardium. The right atrium receives systemic venous blood, the right ventricle pumps it through the pulmonary trunk, the left atrium receives oxygenated pulmonary venous blood, and the left ventricle generates systemic arterial pressure. Atrioventricular valves prevent backward flow during ventricular systole, while semilunar valves prevent arterial reflux during ventricular diastole. The fibrous skeleton supports the valves and electrically insulates atria from ventricles except through the atrioventricular conduction pathway. Coronary arteries arise from the ascending aorta and supply the myocardium."],["U2T8C","Cardiac Muscle Physiology","Cardiac muscle is striated, branched and electrically coupled through gap junctions within intercalated discs. The long action potential and refractory period prevent tetanus. Calcium entering through L-type channels triggers further calcium release from the sarcoplasmic reticulum through ryanodine receptors. Cytosolic calcium binds troponin C and permits cross-bridge cycling. Calcium is later removed by SERCA, sodium–calcium exchange and membrane calcium pumps."],["U2T9C","Conducting System of the Heart","The sinoatrial node normally initiates each heartbeat because it has the highest intrinsic pacemaker rate. Impulses spread through atrial myocardium to the atrioventricular node, where conduction slows and allows ventricular filling. The signal then passes through the atrioventricular bundle, bundle branches and Purkinje fibres to activate ventricular myocardium rapidly. Sympathetic stimulation accelerates pacemaker rate and conduction, whereas parasympathetic stimulation slows nodal activity."],["U2T10C","Cardiac Cycle","The cardiac cycle includes ventricular filling, isovolumetric contraction, ejection and isovolumetric relaxation. Valve movements are passive consequences of pressure differences. The first heart sound is mainly produced by closure of atrioventricular valves; the second by closure of semilunar valves. End-diastolic volume minus end-systolic volume equals stroke volume. Ejection fraction is stroke volume divided by end-diastolic volume."],["U2T11C","Electrocardiogram","An electrocardiogram records body-surface potential differences generated by cardiac electrical activity. The P wave represents atrial depolarisation, the QRS complex ventricular depolarisation and the T wave ventricular repolarisation. The PR interval reflects conduction from atria through the atrioventricular node to ventricles. ECG records electrical events rather than mechanical contraction."],["U2T12C","Cardiac Output and Venous Return","Cardiac output is the volume pumped by one ventricle per minute and equals heart rate multiplied by stroke volume. Stroke volume is influenced by preload, afterload and contractility. Venous return and cardiac output are equal in the steady state. The Frank–Starling mechanism increases force when ventricular filling rises within physiological limits."],["U2T13C","Blood Pressure and Regulation","Arterial pressure depends primarily on cardiac output and total peripheral resistance. Pulse pressure is systolic minus diastolic pressure, while mean arterial pressure is approximated at normal heart rates by diastolic pressure plus one-third of pulse pressure. Arterioles are the principal resistance vessels and veins the major capacitance vessels. The baroreceptor reflex provides rapid regulation, whereas renal sodium and water balance dominates long-term control."],["U2T14C","Circulatory Pathways","The pulmonary circulation carries deoxygenated blood from the right ventricle to the lungs and returns oxygenated blood to the left atrium. The systemic circulation distributes blood from the left ventricle to tissues and returns it to the right atrium. Coronary circulation supplies the myocardium. The hepatic portal system directs nutrient-rich venous blood from the gastrointestinal tract to the liver. Foetal circulation uses the ductus venosus, foramen ovale and ductus arteriosus."],["U2T15R","Kidney Anatomy","The kidneys are paired retroperitoneal organs enclosed by a fibrous capsule and organised into cortex, medulla and renal pelvis. The cortex contains renal corpuscles and convoluted tubules, while the medulla contains loops of Henle and collecting ducts arranged within renal pyramids. Blood enters through the renal artery and is distributed through progressively smaller vessels to afferent arterioles and glomerular capillaries. Efferent arterioles then form peritubular capillaries or vasa recta. Urine flows through collecting ducts, papillary ducts, minor and major calyces, renal pelvis and ureter."],["U2T16R","Nephron Organisation","The nephron is the structural and functional unit of the kidney. It consists of a renal corpuscle and renal tubule. The renal corpuscle contains a glomerular capillary tuft within Bowman’s capsule. Tubular segments include proximal convoluted tubule, loop of Henle, distal convoluted tubule and connecting tubule, which drains into collecting ducts. Cortical nephrons have short loops, while juxtamedullary nephrons have long loops that descend deep into the medulla and are essential for concentrating urine."],["U2T17R","Glomerular Filtration","Glomerular filtration is the movement of water and small solutes from glomerular capillaries into Bowman’s space. The filtration barrier consists of fenestrated endothelium, glomerular basement membrane and podocyte slit diaphragms. Filtration depends on the net balance of glomerular hydrostatic pressure, Bowman’s-space hydrostatic pressure and plasma oncotic pressure, together with the filtration coefficient. Glomerular filtration rate is autoregulated through the myogenic response and tubuloglomerular feedback."],["U2T18R","Tubular Reabsorption","Tubular reabsorption returns filtered substances from tubular fluid to blood. The proximal tubule reabsorbs most filtered sodium, water, bicarbonate, glucose and amino acids. The loop of Henle separates solute and water handling between descending and ascending limbs. The distal tubule and collecting duct perform regulated fine-tuning under hormonal control. Glucose is normally reabsorbed by sodium–glucose cotransport until transport maximum is exceeded, after which glucosuria may occur."],["U2T19R","Tubular Secretion","Tubular secretion transfers selected substances from peritubular capillary blood into tubular fluid. The proximal tubule secretes organic acids, organic bases, many drugs and metabolites. Distal segments secrete hydrogen and potassium ions under regulated conditions. Secretion supports acid–base balance, potassium homeostasis and elimination of substances that are poorly filtered or protein bound. Renal clearance reflects the combined effects of filtration, reabsorption and secretion."],["U2T20R","Counter-current Multiplier","The counter-current multiplier in loops of Henle creates the corticomedullary osmotic gradient. The descending thin limb is highly permeable to water but relatively less permeable to solute, whereas the thick ascending limb actively reabsorbs sodium, potassium and chloride while remaining effectively impermeable to water. Repetition along oppositely directed flows multiplies a small transverse gradient into a large longitudinal medullary gradient. Juxtamedullary nephrons are especially important because of their long loops."],["U2T21R","Counter-current Exchanger and Vasa Recta","The vasa recta preserve the medullary osmotic gradient by passive counter-current exchange. Their hairpin arrangement and slow blood flow allow solutes and water to exchange in a way that minimises washout. As blood descends, it gains solute and loses water; as it ascends, it loses solute and gains water. The vasa recta therefore supply the medulla while maintaining the gradient created by loops of Henle."],["U2T22R","Urine Concentration and Dilution","Urine concentration depends on the medullary osmotic gradient and variable water permeability of collecting ducts. Antidiuretic hormone increases aquaporin-2 insertion into apical membranes of principal cells, permitting water reabsorption into the hyperosmotic medulla. In low antidiuretic hormone states, collecting ducts remain relatively water impermeable and dilute urine is excreted. Urea recycling from inner medullary collecting ducts contributes importantly to medullary hypertonicity."],["U2T23R","Regulation of Renal Function","Renal function is regulated by intrinsic autoregulation, sympathetic nerves and hormones. Autoregulation stabilises renal blood flow and glomerular filtration over a range of arterial pressures. Sympathetic activation constricts renal vessels and promotes renin release during severe volume loss. Angiotensin II, aldosterone, antidiuretic hormone, natriuretic peptides and parathyroid hormone alter vascular tone or tubular transport. These mechanisms coordinate extracellular-fluid volume, osmolality, electrolyte balance and pressure."],["U2T24R","Micturition Reflex","Micturition is a spinal reflex modulated by pontine and cortical centres. Bladder filling activates stretch receptors, and afferent signals enter sacral spinal segments. Parasympathetic efferents contract the detrusor and reduce resistance at the bladder neck and internal urethral sphincter. Somatic pudendal activity controls the external urethral sphincter. During storage, sympathetic and somatic activity favour continence; during voiding, coordinated parasympathetic activation and sphincter relaxation permit urine flow."],["U2T25R","Acid–Base Balance","The kidneys contribute to acid–base homeostasis by reabsorbing filtered bicarbonate, secreting hydrogen ions and generating new bicarbonate. Proximal tubules reclaim most bicarbonate through carbonic-anhydrase-dependent processes. Distal nephron intercalated cells secrete hydrogen ions and acidify urine. Phosphate buffering and ammonium excretion permit net acid elimination. Renal compensation for respiratory acid–base disturbances develops more slowly than respiratory compensation for metabolic disturbances."],["U2T26R","Renin–Angiotensin–Aldosterone System","The renin–angiotensin–aldosterone system is activated by reduced renal perfusion, reduced sodium chloride delivery to the macula densa or increased renal sympathetic activity. Renin cleaves angiotensinogen to angiotensin I, which angiotensin-converting enzyme converts to angiotensin II. Angiotensin II constricts vessels, stimulates aldosterone and antidiuretic hormone, promotes thirst and enhances proximal sodium reabsorption. Aldosterone increases sodium reabsorption and potassium secretion in the distal nephron."],["U2T27R","Hormonal Regulation of Kidney Function","Antidiuretic hormone regulates water permeability in collecting ducts. Aldosterone promotes sodium retention and potassium secretion. Atrial and brain natriuretic peptides favour sodium excretion and oppose renin–angiotensin–aldosterone activity. Parathyroid hormone increases calcium reabsorption and decreases phosphate reabsorption. Calcitonin has a comparatively modest renal role in adults. These hormones allow the kidney to integrate water, sodium, potassium, calcium and phosphate homeostasis."],["U2T28R","Renal Clearance and Clinical Indices","Renal clearance is the virtual volume of plasma completely cleared of a substance per unit time. Clearance equals urine concentration multiplied by urine flow divided by plasma concentration. Inulin clearance closely measures glomerular filtration rate because inulin is filtered but not reabsorbed, secreted or metabolised. Creatinine clearance is more practical clinically but slightly overestimates glomerular filtration because of limited tubular secretion. Para-aminohippurate clearance approximates effective renal plasma flow at low concentrations."],["U2T29R","Urinalysis and Renal Disorders","Urinalysis evaluates physical properties, chemical constituents and microscopic sediment. Proteinuria may indicate glomerular barrier injury, while glucosuria can occur when filtered glucose exceeds tubular transport capacity or when proximal tubular reabsorption is impaired. Haematuria, casts, crystals and specific-gravity changes provide diagnostic clues. Acute kidney injury is a rapid decline in renal function, whereas chronic kidney disease is persistent structural or functional abnormality. Nephrotic syndrome features heavy proteinuria, hypoalbuminaemia and oedema."]]},{id:"U3",title:"Neuromuscular Co-ordination",icon:"🧠",topics:[["U3T1","Neuron Structure","A neuron has a cell body, dendrites and an axon. Myelin increases conduction speed, and nodes of Ranvier contain high densities of voltage-gated channels. Schwann cells myelinate peripheral axons, whereas oligodendrocytes myelinate central axons. Axonal transport moves materials between soma and terminal."],["U3T2","Resting Membrane Potential","Resting potential arises from unequal ion distributions, selective permeability and electrogenic transport. Neuronal membranes are more permeable to potassium than sodium at rest. The sodium–potassium ATPase maintains gradients by moving three sodium ions out and two potassium ions in per ATP."],["U3T3","Action Potential","Threshold depolarisation opens voltage-gated sodium channels. Sodium-channel inactivation and delayed potassium-channel opening produce repolarisation. Continued potassium conductance causes after-hyperpolarisation. Action potentials are all-or-none and propagate without decrement; stimulus intensity is encoded mainly by firing frequency."],["U3T4","Nerve Impulse Conduction","In unmyelinated axons, action potentials regenerate continuously. In myelinated axons, current spreads beneath myelin and action potentials regenerate mainly at nodes—saltatory conduction. Conduction velocity increases with axon diameter and myelination."],["U3T5","Synaptic Transmission","An arriving action potential opens presynaptic calcium channels. Calcium triggers vesicle fusion and neurotransmitter release. Transmitter binds postsynaptic receptors and produces excitatory or inhibitory potentials. Signals terminate through degradation, reuptake or diffusion."],["U3T6","Reflex Arc","A reflex arc includes receptor, sensory neuron, integration centre, motor neuron and effector. Monosynaptic stretch reflexes contain one central synapse, whereas withdrawal reflexes are polysynaptic. Reciprocal inhibition coordinates opposing muscles. Reflexes are automatic but modifiable by higher centres."],["U3T7","Skeletal Muscle and Sarcomere","A sarcomere lies between two Z discs. Thin filaments contain actin, tropomyosin and troponin; thick filaments contain myosin. The A band remains approximately constant during contraction, while the I band and H zone shorten. Filaments slide past one another rather than shortening."],["U3T8","Neuromuscular Junction","Motor terminals release acetylcholine. It binds nicotinic receptors on the motor end plate and produces an end-plate potential that triggers a muscle action potential. Acetylcholinesterase terminates the signal. Myasthenia gravis reduces functional postsynaptic receptors."],["U3T9","Excitation–Contraction Coupling","The muscle action potential travels along sarcolemma and T tubules. Dihydropyridine receptors activate ryanodine receptors, releasing calcium from sarcoplasmic reticulum. Calcium binds troponin C, shifts tropomyosin and permits cross-bridge cycling. SERCA pumps calcium back for relaxation."],["U3T10","Muscle Energetics and Fatigue","ATP is supplied by stored ATP, phosphocreatine, glycolysis and oxidative phosphorylation. Type I fibres are slow and fatigue resistant; type II fibres contract faster. Fatigue can arise from central factors, metabolites, reduced calcium handling and substrate limitations; it is not explained by lactic acid alone."]]},{id:"U4",title:"Endocrine Glands and Receptors",icon:"🧬",topics:[["U4T1","Principles of Endocrine Signalling","Hormones are chemical messengers acting on receptor-bearing targets. Peptide and catecholamine hormones usually act through membrane receptors and second messengers, whereas steroid and thyroid hormones commonly act through intracellular receptors. Hormone concentration, receptor number, affinity and intracellular signalling determine response."],["U4T2","Hypothalamus and Pituitary","Hypothalamic releasing and inhibiting hormones regulate the anterior pituitary through portal vessels. The anterior pituitary secretes GH, prolactin, ACTH, TSH, FSH and LH. The posterior pituitary stores and releases oxytocin and antidiuretic hormone synthesised in hypothalamic neurons. Most axes use negative feedback."],["U4T3","Thyroid Gland","Thyroid follicular cells produce T4 and T3 using iodide and thyroglobulin. Thyroid peroxidase catalyses iodination and coupling. Thyroid hormones raise metabolic activity and are essential for growth and nervous-system development. TSH stimulates the gland, while circulating thyroid hormones provide negative feedback."],["U4T4","Parathyroid and Calcium Homeostasis","Parathyroid hormone rises when extracellular calcium falls. It increases renal calcium reabsorption, decreases phosphate reabsorption and promotes active vitamin D formation. Active vitamin D increases intestinal calcium and phosphate absorption. PTH promotes bone resorption indirectly through osteoblast-lineage signalling."],["U4T5","Adrenal Gland","The adrenal cortex produces mineralocorticoids, glucocorticoids and adrenal androgens. Aldosterone supports sodium retention and potassium secretion. Cortisol supports metabolism and stress adaptation. The adrenal medulla releases adrenaline and noradrenaline under sympathetic control."],["U4T6","Pancreatic Endocrine Function","Beta cells secrete insulin, alpha cells glucagon and delta cells somatostatin. Insulin promotes glucose uptake in muscle and adipose tissue, glycogen synthesis, lipogenesis and protein synthesis. Glucagon raises blood glucose through hepatic glycogenolysis and gluconeogenesis."],["U4T7","Gonadal Hormones","Leydig cells produce testosterone under LH stimulation, while Sertoli cells support spermatogenesis under FSH and testosterone. Ovarian follicles produce oestrogens and the corpus luteum produces progesterone and oestrogen. Pulsatile GnRH drives LH and FSH secretion."],["U4T8","Hormone Receptors and Signal Transduction","G-protein-coupled receptors can activate cAMP–PKA or IP3/DAG–PKC pathways. Receptor tyrosine kinases autophosphorylate; the insulin receptor is a key example. Cytokine receptors commonly use JAK–STAT. Intracellular receptors regulate transcription. Phosphatases, GTP hydrolysis, receptor internalisation and feedback terminate signalling."],["U4T9","Feedback and Biological Rhythms","Negative feedback stabilises endocrine variables. Positive feedback operates in specialised events such as the LH surge and labour. Hormone secretion may be pulsatile, circadian or episodic. Sampling time matters because cortisol and melatonin show strong daily rhythms."],["U4T10","Endocrine Diagnostic Logic","Endocrine disease can be primary, secondary, tertiary, receptor-mediated or ectopic. Diagnosis often requires paired interpretation of trophic and target-gland hormones. Primary hypothyroidism typically shows low thyroid hormone with high TSH, whereas secondary hypothyroidism shows low thyroid hormone with inappropriately low or normal TSH."]]}],resources:{U1T1:[{id:"READ_U1T1_001",topicId:"U1T1",provider:"OpenStax",title:"OpenStax: Overview of the Digestive System",url:"https://openstax.org/books/anatomy-and-physiology-2e/pages/23-1-overview-of-the-digestive-system",type:"reading",category:"reading",access:"online",verificationStatus:"verified",verifiedOn:"2026-07-15",language:"English",level:"undergraduate",tags:[],linkedConceptIds:["C_U1T1_CORE"],linkedSimulatorIds:[],linkedAssessmentIds:[]},{id:"VID_U1T1_001",topicId:"U1T1",provider:"CrashCourse",title:"Digestive System, Part 1: Crash Course Anatomy & Physiology #33",url:"https://www.youtube.com/watch?v=yIoTRGfcMqM",type:"video",category:"concept-builder",access:"online",durationSeconds:null,language:"English",level:"undergraduate",examinationValue:null,conceptClarity:null,clinicalValue:null,visualValue:null,laboratoryValue:null,verifiedOn:"2026-07-15",verificationStatus:"ver evel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U1T1_CORE",concept:"C_U1T1_CORE",misconceptionId:"MIS_U1T1_TOPIC_SPECIFIC_CONCEPT_CONFUSION"},{id:"Q002",unit:"U1",topic:"U1T2",type:"MCQ",stem:"Which gastrointestinal secretion contains bicarbonate and multiple digestive enzymes?",options:["Saliva","Pancreatic juice","Bile","Gastric mucus"],answer:1,explanation:"Pancreatic juice contains bicarbonate plus enzymes for proteins, carbohydrates, lipids and nucleic acids.",strongestDistractorAnalysis:"Bile emulsifies lipids but contains no digestive enzymes.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U1T2_CORE",concept:"C_U1T2_CORE",misconceptionId:"MIS_U1T2_TOPIC_SPECIFIC_CONCEPT_CONFUSION"},{id:"Q003",unit:"U1",topic:"U1T3",type:"MCQ",stem:"Glucose enters intestinal epithelial cells mainly through:",options:["GLUT2 on the apical membrane","PepT1","SGLT1","GLUT5"],answer:2,explanation:"SGLT1 cotransports glucose or galactose with sodium across the apical membrane.",strongestDistractorAnalysis:"GLUT5 transports fructose; GLUT2 chiefly mediates basolateral exit.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U1T3_CORE",concept:"C_U1T3_CORE",misconceptionId:"MIS_U1T3_TOPIC_SPECIFIC_CONCEPT_CONFUSION"},{id:"Q004",unit:"U1",topic:"U1T4",type:"MCQ",stem:"Which enzyme initiates activation of pancreatic protease zymogens in the small intestine?",options:["Pepsin","Pancreatic lipase","Lactase","Enteropeptidase"],answer:3,explanation:"Enteropeptidase activates trypsinogen, and trypsin activates other pancreatic zymogens.",strongestDistractorAnalysis:"Pepsin acts mainly in the stomach and does not initiate the intestinal zymogen cascade.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U1T4_CORE",concept:"C_U1T4_CORE",misconceptionId:"MIS_U1T4_TOPIC_SPECIFIC_CONCEPT_CONFUSION"},{id:"Q005",unit:"U1",topic:"U1T5",type:"MCQ",stem:"Long-chain dietary lipids leave enterocytes mainly as:",options:["Chylomicrons","Free glucose","Albumin-bound amino acids","Bicarbonate"],answer:0,explanation:"Long-chain lipids are re-esterified and packaged into chylomicrons that enter lacteals.",strongestDistractorAnalysis:"Short-chain fatty acids can enter portal blood directly, unlike most long-chain lipids.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U1T5_CORE",concept:"C_U1T5_CORE",misconceptionId:"MIS_U1T5_TOPIC_SPECIFIC_CONCEPT_CONFUSION"},{id:"Q006",unit:"U1",topic:"U1T6",type:"MCQ",stem:"Quiet inspiration occurs primarily because:",options:["Internal intercostals shorten the diaphragm","Diaphragmatic contraction lowers alveolar pressure","Elastic recoil raises alveolar volume","Surfactant contracts alveoli"],answer:1,explanation:"Diaphragm and external intercostal contraction increase thoracic volume and lower alveolar pressure.",strongestDistractorAnalysis:"Elastic recoil mainly supports passive quiet expiration.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U1T6_CORE",concept:"C_U1T6_CORE",misconceptionId:"MIS_U1T6_TOPIC_SPECIFIC_CONCEPT_CONFUSION"},{id:"Q007",unit:"U1",topic:"U1T7",type:"MCQ",stem:"Most carbon dioxide in blood is transported as:",options:["Carbaminohaemoglobin","Carbonic acid","Bicarbonate ions","Dissolved carbon dioxide"],answer:2,explanation:"Most carbon dioxide is converted to bicarbonate, largely within erythrocytes.",strongestDistractorAnalysis:"Carbamino and dissolved forms account for smaller fractions.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U1T7_CORE",concept:"C_U1T7_CORE",misconceptionId:"MIS_U1T7_TOPIC_SPECIFIC_CONCEPT_CONFUSION"},{id:"Q008",unit:"U1",topic:"U1T8",type:"MCQ",stem:"Central chemoreceptors respond most directly to changes in:",options:["Arterial oxygen directly","Plasma bicarbonate alone","Lung stretch only","Cerebrospinal-fluid hydrogen ion generated from carbon dioxide"],answer:3,explanation:"Central chemoreceptors respond to CSF hydrogen ion changes produced by carbon dioxide diffusion.",strongestDistractorAnalysis:"Peripheral chemoreceptors are the principal receptors for marked arterial hypoxaemia.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U1T8_CORE",concept:"C_U1T8_CORE",misconceptionId:"MIS_U1T8_TOPIC_SPECIFIC_CONCEPT_CONFUSION"},{id:"Q019",unit:"U3",topic:"U3T1",type:"MCQ",stem:"Which glial cell myelinates axons in the central nervous system?",options:["Oligodendrocyte","Schwann cell","Astrocyte","Microglial cell"],answer:0,explanation:"Oligodendrocytes myelinate central axons; Schwann cells myelinate peripheral axons.",strongestDistractorAnalysis:"Schwann cells perform the corresponding role in the PNS.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U3T1_CORE",concept:"C_U3T1_CORE",misconceptionId:"MIS_NEURON_AXON_DENDRITE_CONFUSION"},{id:"Q020",unit:"U3",topic:"U3T2",type:"MCQ",stem:"The resting neuronal membrane is most permeable to:",options:["Chloride exclusively","Potassium","Sodium","Calcium"],answer:1,explanation:"At rest, potassium leak permeability is greater than sodium permeability.",strongestDistractorAnalysis:"The sodium gradient is important, but resting permeability is lower than potassium permeability.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U3T2_CORE",concept:"C_U3T2_CORE",misconceptionId:"MIS_RMP_PUMP_VS_PERMEABILITY"},{id:"Q021",unit:"U3",topic:"U3T3",type:"MCQ",stem:"Rapid depolarisation of a neuronal action potential is caused mainly by:",options:["Closure of all ion channels","Activation of SERCA","Opening of voltage-gated sodium channels","Opening of delayed potassium channels"],answer:2,explanation:"Voltage-gated sodium channels open rapidly at threshold and drive depolarisation.",strongestDistractorAnalysis:"Delayed potassium-channel opening chiefly contributes to repolarisation.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U3T3_CORE",concept:"C_U3T3_CORE",misconceptionId:"MIS_ACTION_POTENTIAL_NA_K_SEQUENCE"},{id:"Q022",unit:"U3",topic:"U3T4",type:"MCQ",stem:"Saltatory conduction refers to action potentials regenerating mainly at:",options:["Myelin internodes","Cell bodies","Synaptic vesicles","Nodes of Ranvier"],answer:3,explanation:"In myelinated axons, action potentials regenerate at nodes of Ranvier.",strongestDistractorAnalysis:"Myelin internodes conduct current passively but are not the main sites of regeneration.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U3T4_CORE",concept:"C_U3T4_CORE",misconceptionId:"MIS_MYELIN_CONDUCTION_ROLE"},{id:"Q023",unit:"U3",topic:"U3T5",type:"MCQ",stem:"Which event directly triggers neurotransmitter vesicle fusion?",options:["Presynaptic calcium entry","Postsynaptic sodium entry","Potassium leakage from glia","Acetylcholinesterase activity"],answer:0,explanation:"Calcium entry through presynaptic voltage-gated channels triggers vesicle fusion.",strongestDistractorAnalysis:"Postsynaptic sodium entry occurs after transmitter-receptor activation.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U3T5_CORE",concept:"C_U3T5_CORE",misconceptionId:"MIS_SYNAPTIC_CA_RELEASE_SEQUENCE"},{id:"Q024",unit:"U3",topic:"U3T6",type:"MCQ",stem:"A monosynaptic stretch reflex contains:",options:["No integration centre","One central synapse","No sensory neuron","Two motor neurons only"],answer:1,explanation:"A monosynaptic reflex has one synapse between sensory and motor neurons in the CNS.",strongestDistractorAnalysis:"Withdrawal reflexes are typically polysynaptic.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U3T6_CORE",concept:"C_U3T6_CORE",misconceptionId:"MIS_REFLEX_DORSAL_VENTRAL_ROOT"},{id:"Q025",unit:"U3",topic:"U3T7",type:"MCQ",stem:"Which sarcomere region remains approximately constant during contraction?",options:["H zone","Distance between Z discs","A band","I band"],answer:2,explanation:"The A band reflects thick-filament length and remains nearly constant.",strongestDistractorAnalysis:"The I band and H zone shorten as thin filaments slide inward.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U3T7_CORE",concept:"C_U3T7_CORE",misconceptionId:"MIS_SARCOMERE_BAND_CHANGE"},{id:"Q026",unit:"U3",topic:"U3T8",type:"MCQ",stem:"The neurotransmitter at the skeletal neuromuscular junction is:",options:["Noradrenaline","Dopamine","GABA","Acetylcholine"],answer:3,explanation:"Somatic motor neurons release acetylcholine onto nicotinic receptors.",strongestDistractorAnalysis:"Noradrenaline is associated mainly with many sympathetic neuroeffector junctions.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U3T8_CORE",concept:"C_U3T8_CORE",misconceptionId:"MIS_NMJ_RECEPTOR_CONFUSION"},{id:"Q027",unit:"U3",topic:"U3T9",type:"MCQ",stem:"In skeletal muscle, calcium initiates contraction by binding to:",options:["Troponin C","Tropomyosin","Myosin ATPase directly","Dystrophin"],answer:0,explanation:"Calcium binding to troponin C shifts tropomyosin and exposes actin-binding sites.",strongestDistractorAnalysis:"Tropomyosin moves but is not the calcium-binding regulatory protein.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U3T9_CORE",concept:"C_U3T9_CORE",misconceptionId:"MIS_SERCA_VS_RYR_ROLE"},{id:"Q028",unit:"U3",topic:"U3T10",type:"MCQ",stem:"The immediate high-energy phosphate buffer in skeletal muscle is:",options:["Myoglobin","Phosphocreatine","Glycogen","Lactate"],answer:1,explanation:"Phosphocreatine rapidly regenerates ATP through creatine kinase.",strongestDistractorAnalysis:"Glycogen supports glycolysis but is not the immediate phosphate buffer.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U3T10_CORE",concept:"C_U3T10_CORE",misconceptionId:"MIS_MUSCLE_FIBRE_ENERGY_SYSTEM"},{id:"Q029",unit:"U4",topic:"U4T1",type:"MCQ",stem:"Steroid hormones commonly act through:",options:["Extracellular digestive enzymes","Gap junctions alone","Intracellular receptors regulating transcription","Ligand-gated sodium channels only"],answer:2,explanation:"Steroid hormones cross membranes and commonly bind cytosolic or nuclear receptors.",strongestDistractorAnalysis:"Membrane receptors are typical for many peptide hormones, not the canonical steroid mechanism.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U4T1_CORE",concept:"C_U4T1_CORE",misconceptionId:"MIS_PEPTIDE_VS_STEROID_RECEPTOR"},{id:"Q030",unit:"U4",topic:"U4T2",type:"MCQ",stem:"Which hormone is synthesised in hypothalamic neurons and released from the posterior pituitary?",options:["TSH","ACTH","Growth hormone","Antidiuretic hormone"],answer:3,explanation:"ADH is synthesised in hypothalamic neurons and stored/released from the posterior pituitary.",strongestDistractorAnalysis:"TSH, ACTH and GH are produced by the anterior pituitary.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U4T2_CORE",concept:"C_U4T2_CORE",misconceptionId:"MIS_ANTERIOR_POSTERIOR_PITUITARY"},{id:"Q031",unit:"U4",topic:"U4T3",type:"MCQ",stem:"Thyroid peroxidase catalyses:",options:["Iodination and coupling reactions","Conversion of T4 to T3 in every tissue","TSH synthesis","Iodide excretion"],answer:0,explanation:"Thyroid peroxidase catalyses oxidation, organification and coupling within thyroglobulin.",strongestDistractorAnalysis:"Peripheral deiodinases, not thyroid peroxidase, convert much T4 to T3.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U4T3_CORE",concept:"C_U4T3_CORE",misconceptionId:"MIS_THYROID_SYNTHESIS_ENZYME"},{id:"Q032",unit:"U4",topic:"U4T4",type:"MCQ",stem:"Parathyroid hormone lowers plasma phosphate mainly by:",options:["Increasing calcitonin release","Reducing renal phosphate reabsorption","Increasing intestinal phosphate absorption only","Blocking vitamin D formation"],answer:1,explanation:"PTH decreases proximal tubular phosphate reabsorption, promoting phosphaturia.",strongestDistractorAnalysis:"PTH also promotes active vitamin D formation rather than blocking it.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U4T4_CORE",concept:"C_U4T4_CORE",misconceptionId:"MIS_PTH_CALCIUM_PHOSPHATE_EFFECT"},{id:"Q033",unit:"U4",topic:"U4T5",type:"MCQ",stem:"Aldosterone is produced by the adrenal:",options:["Zona reticularis","Medulla","Zona glomerulosa","Zona fasciculata"],answer:2,explanation:"The zona glomerulosa produces mineralocorticoids, principally aldosterone.",strongestDistractorAnalysis:"The zona fasciculata chiefly produces glucocorticoids.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U4T5_CORE",concept:"C_U4T5_CORE",misconceptionId:"MIS_ADRENAL_ZONE_HORMONE"},{id:"Q034",unit:"U4",topic:"U4T6",type:"MCQ",stem:"Insulin increases glucose uptake most prominently in muscle and adipose tissue through:",options:["GLUT2 inhibition","SGLT1 activation","Aquaporin-2 insertion","GLUT4 translocation"],answer:3,explanation:"Insulin promotes GLUT4 translocation in skeletal muscle and adipose tissue.",strongestDistractorAnalysis:"Aquaporin-2 insertion is regulated by ADH in the kidney.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U4T6_CORE",concept:"C_U4T6_CORE",misconceptionId:"MIS_INSULIN_GLUT4_MECHANISM"},{id:"Q035",unit:"U4",topic:"U4T7",type:"MCQ",stem:"LH stimulates testosterone production primarily in:",options:["Leydig cells","Sertoli cells","Granulosa cells only","The corpus luteum in males"],answer:0,explanation:"LH stimulates Leydig cells to synthesise testosterone.",strongestDistractorAnalysis:"FSH acts mainly on Sertoli cells in the testis.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U4T7_CORE",concept:"C_U4T7_CORE",misconceptionId:"MIS_GNRH_PULSATILITY"},{id:"Q036",unit:"U4",topic:"U4T8",type:"MCQ",stem:"The insulin receptor is a:",options:["Intracellular steroid receptor","Receptor tyrosine kinase","G-protein-coupled receptor","Ligand-gated ion channel"],answer:1,explanation:"The insulin receptor has intrinsic tyrosine-kinase activity.",strongestDistractorAnalysis:"Many peptide hormones use GPCRs, but insulin is a key RTK example.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U4T8_CORE",concept:"C_U4T8_CORE",misconceptionId:"MIS_RECEPTOR_CLASS_CONFUSION"},{id:"Q037",unit:"U4",topic:"U4T9",type:"MCQ",stem:"Which endocrine event is a classic positive-feedback example?",options:["Thyroid hormone suppression of TSH","Insulin lowering blood glucose","Preovulatory LH surge","Cortisol suppression of ACTH"],answer:2,explanation:"High oestrogen concentrations can trigger positive feedback producing the LH surge.",strongestDistractorAnalysis:"The other examples are negative-feedback relationships.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U4T9_CORE",concept:"C_U4T9_CORE",misconceptionId:"MIS_CIRCADIAN_SAMPLING"},{id:"Q038",unit:"U4",topic:"U4T10",type:"MCQ",stem:"Primary hypothyroidism typically produces:",options:["Low thyroid hormone with low TSH","High thyroid hormone with high TSH","Normal thyroid hormone with absent TRH","Low thyroid hormone with high TSH"],answer:3,explanation:"Failure of the thyroid gland lowers thyroid hormone and removes negative feedback, raising TSH.",strongestDistractorAnalysis:"Low or inappropriately normal TSH with low thyroid hormone suggests central hypothyroidism.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U4T10_CORE",concept:"C_U4T10_CORE",misconceptionId:"MIS_PRIMARY_VS_SECONDARY_ENDOCRINE_FAILURE"},{id:"U2B_MCQ_001",unit:"U2",topic:"U2T1",concept:"C_U2T1_001",type:"MCQ",stem:"Which component normally occupies the greatest fraction of whole-blood volume?",options:["Plasma","Leucocytes","Platelets","Fibrin"],answer:0,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T1_STRUCTURE_FUNCTION_CONFUSION",explanation:"Plasma normally occupies the largest fraction of blood volume.",strongestDistractorAnalysis:"Fibrin is the strongest distractor: it tempts students who mentally picture clotted rather than circulating blood, forgetting fibrin is a coagulation product present only in trace amounts (as fibrinogen) in normal flowing blood, not a volume-occupying component.",conceptId:"C_U2T1_001"},{id:"U2B_MCQ_002",unit:"U2",topic:"U2T1",concept:"C_U2T1_002",type:"MCQ",stem:"Haematocrit is best defined as:",options:["Volume of platelets per litre","Percentage of blood volume occupied by erythrocytes","Total plasma-protein concentration","Percentage of leucocytes in blood"],answer:1,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T1_REGULATION_ERROR",explanation:"Haematocrit measures the erythrocyte volume fraction.",strongestDistractorAnalysis:"“Percentage of leucocytes in blood” is the strongest distractor: both this and haematocrit are expressed as a percentage of a cellular component, so students who have not fixed which cell line the term refers to often swap erythrocyte- and leucocyte-based percentages.",conceptId:"C_U2T1_002"},{id:"U2B_MCQ_003",unit:"U2",topic:"U2T1",concept:"C_U2T1_003",type:"MCQ",stem:"Which is not a formed element?",options:["Leucocyte","Platelet","Albumin","Erythrocyte"],answer:2,difficulty:"high",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T1_STRUCTURE_FUNCTION_CONFUSION",explanation:"Albumin is dissolved in plasma.",strongestDistractorAnalysis:"Platelet is the strongest distractor: because platelets are anucleate cytoplasmic fragments rather than complete cells, students sometimes reason (incorrectly) that only nucleated or ‘whole’ cells count as formed elements, and exclude platelets instead of albumin.",conceptId:"C_U2T1_003"},{id:"U2B_MCQ_004",unit:"U2",topic:"U2T1",concept:"C_U2T1_004",type:"MCQ",stem:"A major regulatory function of blood is:",options:["Synthesis of bile","Production of urine","Generation of action potentials","Distribution of heat"],answer:3,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T1_REGULATION_ERROR",explanation:"Blood distributes heat and contributes to temperature regulation.",strongestDistractorAnalysis:"“Generation of action potentials” is the strongest distractor: students often widen ‘regulatory function’ to include any regulatory process in the body, forgetting the question asks specifically what blood itself does rather than what nerves do.",conceptId:"C_U2T1_004"},{id:"U2B_MCQ_005",unit:"U2",topic:"U2T1",concept:"C_U2T1_005",type:"MCQ",stem:"Severe dehydration would initially tend to:",options:["Increase haematocrit by reducing plasma volume","Reduce erythrocyte mass immediately","Eliminate plasma proteins","Increase platelet size only"],answer:0,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T1_STRUCTURE_FUNCTION_CONFUSION",explanation:"Loss of plasma water causes haemoconcentration.",strongestDistractorAnalysis:"“Reduce erythrocyte mass immediately” is the strongest distractor: it conflates dehydration (a plasma-volume problem) with anaemia (a red-cell-mass problem). Acute water loss concentrates existing erythrocytes; it does not destroy or reduce them.",conceptId:"C_U2T1_005"},{id:"U2B_MCQ_006",unit:"U2",topic:"U2T1",concept:"C_U2T1_006",type:"MCQ",stem:"The buffy coat mainly contains:",options:["Water and electrolytes","Leucocytes and platelets","Erythrocytes and fibrin","Albumin and globulin"],answer:1,difficulty:"high",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T1_REGULATION_ERROR",explanation:"Leucocytes and platelets form the buffy coat after centrifugation.",strongestDistractorAnalysis:"“Erythrocytes and fibrin” is the strongest distractor: the buffy coat sits immediately above the packed erythrocyte layer after centrifugation, so its physical proximity to red cells leads students to include erythrocytes in its composition.",conceptId:"C_U2T1_006"},{id:"U2B_MCQ_007",unit:"U2",topic:"U2T1",concept:"C_U2T1_007",type:"MCQ",stem:"Blood is classified histologically as:",options:["Nervous tissue","Dense regular connective tissue","A specialised connective tissue","Epithelial tissue"],answer:2,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T1_STRUCTURE_FUNCTION_CONFUSION",explanation:"Blood is a specialised fluid connective tissue.",strongestDistractorAnalysis:"“Dense regular connective tissue” is the strongest distractor: it is a genuine connective-tissue subtype (e.g. tendon), so a student who correctly recalls ‘blood is connective tissue’ but has not learned its specialised fluid subclassification may pick the wrong subtype rather than the general specialised category.",conceptId:"C_U2T1_007"},{id:"U2B_MCQ_008",unit:"U2",topic:"U2T1",concept:"C_U2T1_008",type:"MCQ",stem:"Which function most directly links blood to respiratory physiology?",options:["Secretion of surfactant","Generation of ventilatory rhythm","Formation of alveoli","Transport of oxygen and carbon dioxide"],answer:3,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T1_REGULATION_ERROR",explanation:"Blood transports respiratory gases.",strongestDistractorAnalysis:"“Generation of ventilatory rhythm” is the strongest distractor: blood chemistry (CO2, pH) does influence chemoreceptors that drive ventilatory rhythm, so students conflate blood's chemical role in triggering respiration with actually generating the rhythm, which is a medullary neural function.",conceptId:"C_U2T1_008"},{id:"U2B_MCQ_009",unit:"U2",topic:"U2T2",concept:"C_U2T2_009",type:"MCQ",stem:"Which plasma protein contributes most to colloid osmotic pressure?",options:["Albumin","Fibrinogen","IgM","Haemoglobin"],answer:0,difficulty:"high",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T2_STRUCTURE_FUNCTION_CONFUSION",explanation:"Albumin is abundant and exerts the greatest oncotic effect.",strongestDistractorAnalysis:"Fibrinogen is the strongest distractor: students recall it as a ‘major’ plasma protein from coagulation teaching and assume major implies major osmotic contributor. Colloid osmotic pressure depends on molar particle concentration, not simply on being well-known; albumin's high plasma concentration (~35–50 g/L) and relatively small size give it roughly 60–80% of total oncotic pressure, far exceeding fibrinogen's much lower concentration.",conceptId:"C_U2T2_009"},{id:"U2B_MCQ_010",unit:"U2",topic:"U2T2",concept:"C_U2T2_010",type:"MCQ",stem:"Fibrinogen is converted to fibrin by:",options:["Erythropoietin","Thrombin","Plasmin","Albumin"],answer:1,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T2_REGULATION_ERROR",explanation:"Thrombin cleaves fibrinogen to form fibrin.",strongestDistractorAnalysis:"Plasmin is the strongest distractor: it is the enzyme most often mentioned in the same breath as fibrinogen and fibrin, but it acts in the opposite direction — plasmin degrades fibrin during fibrinolysis, whereas thrombin cleaves fibrinogen to generate fibrin during clot formation. Confusing formation with breakdown is the exact misconception being tested.",conceptId:"C_U2T2_010"},{id:"U2B_MCQ_011",unit:"U2",topic:"U2T2",concept:"C_U2T2_011",type:"MCQ",stem:"Gamma globulins are mainly:",options:["Respiratory pigments","Electrolytes","Immunoglobulins","Clotting phospholipids"],answer:2,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T2_STRUCTURE_FUNCTION_CONFUSION",explanation:"Gamma globulins are predominantly antibodies.",strongestDistractorAnalysis:"‘Clotting phospholipids’ is the strongest distractor: students associate globulins broadly with coagulation because some clotting factors (e.g. prothrombin) are globulins, then wrongly extend this to phospholipid cofactors (like platelet factor 3), which are not globulins at all — gamma globulins are specifically immunoglobulins secreted by plasma cells.",conceptId:"C_U2T2_011"},{id:"U2B_MCQ_012",unit:"U2",topic:"U2T2",concept:"C_U2T2_012",type:"MCQ",stem:"Hypoalbuminaemia promotes oedema primarily by:",options:["Increasing haemoglobin affinity","Blocking lymphocytes","Increasing platelet aggregation","Reducing plasma colloid osmotic pressure"],answer:3,difficulty:"high",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T2_REGULATION_ERROR",explanation:"Lower plasma oncotic pressure favours movement of fluid into tissues.",strongestDistractorAnalysis:"‘Blocking lymphocytes’ is the strongest distractor: it superficially resembles a genuine oedema mechanism (lymphatic obstruction causes lymphoedema), so students conflate lymphatic-drainage failure with the Starling-force mechanism actually being tested here, which is a fall in plasma colloid osmotic pressure reducing the force that normally draws fluid back into capillaries.",conceptId:"C_U2T2_012"},{id:"U2B_MCQ_013",unit:"U2",topic:"U2T2",concept:"C_U2T2_013",type:"MCQ",stem:"Most plasma albumin is synthesised by the:",options:["Liver","Kidney","Spleen","Bone marrow"],answer:0,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T2_STRUCTURE_FUNCTION_CONFUSION",explanation:"Hepatocytes synthesise albumin.",strongestDistractorAnalysis:"Kidney is the strongest distractor: students associate the kidney with albumin because pathological albumin loss (albuminuria in nephrotic syndrome) is a familiar clinical fact, and they wrongly transfer this association from albumin excretion to albumin synthesis, which occurs in hepatocytes, not renal tissue.",conceptId:"C_U2T2_013"},{id:"U2B_MCQ_014",unit:"U2",topic:"U2T2",concept:"C_U2T2_014",type:"MCQ",stem:"Serum differs from plasma because serum lacks most:",options:["Antibodies","Fibrinogen and consumed clotting factors","Albumin","Electrolytes"],answer:1,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T2_REGULATION_ERROR",explanation:"Serum is the fluid remaining after coagulation.",strongestDistractorAnalysis:"Antibodies is the strongest distractor: students overgeneralise ‘serum has fewer proteins than plasma’ to mean all major protein classes are reduced, including immunoglobulins. In fact antibodies remain in serum at essentially plasma concentrations; only fibrinogen and the clotting factors consumed during coagulation are depleted.",conceptId:"C_U2T2_014"},{id:"U2B_MCQ_015",unit:"U2",topic:"U2T2",concept:"C_U2T2_015",type:"MCQ",stem:"Which is a transport role of albumin?",options:["Producing antibodies","Forming platelets","Binding bilirubin and many drugs","Carrying oxygen inside erythrocytes"],answer:2,difficulty:"high",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T2_STRUCTURE_FUNCTION_CONFUSION",explanation:"Albumin transports many poorly soluble molecules.",strongestDistractorAnalysis:"‘Carrying oxygen inside erythrocytes’ is the strongest distractor: both albumin and hemoglobin are described as blood ‘transport proteins’ in introductory teaching, so students merge the two roles. Albumin is an extracellular plasma carrier for small hydrophobic and charged molecules; oxygen transport is a haemoglobin function confined to erythrocytes, an entirely separate protein and compartment.",conceptId:"C_U2T2_015"},{id:"U2B_MCQ_016",unit:"U2",topic:"U2T2",concept:"C_U2T2_016",type:"MCQ",stem:"A broad increase in immunoglobulins would most directly affect the:",options:["Albumin peak only","Haematocrit","Platelet count","Gamma region on protein electrophoresis"],answer:3,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T2_REGULATION_ERROR",explanation:"Immunoglobulins migrate mainly in the gamma region.",strongestDistractorAnalysis:"‘Albumin peak only’ is the strongest distractor: on serum protein electrophoresis, albumin is the most familiar named band, so students default to it whenever any protein change is described, rather than recognising that immunoglobulins specifically migrate in the gamma region, distinct from the albumin band.",conceptId:"C_U2T2_016"},{id:"U2B_MCQ_017",unit:"U2",topic:"U2T3",concept:"C_U2T3_017",type:"MCQ",stem:"Which formed element lacks a nucleus in normal mammalian blood?",options:["Erythrocyte","Lymphocyte","Monocyte","Neutrophil"],answer:0,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T3_STRUCTURE_FUNCTION_CONFUSION",explanation:"Mature mammalian erythrocytes are anucleate.",strongestDistractorAnalysis:"Lymphocyte is the strongest distractor: lymphocytes are the smallest leucocytes with a large nucleus occupying most of the cell and only a thin rim of visible cytoplasm, so students sometimes misread the reduced cytoplasmic prominence as ‘barely any nucleus’ and confuse it with true anucleate cells. Erythrocytes lose their nucleus entirely during maturation; lymphocytes retain a full nucleus.",conceptId:"C_U2T3_017"},{id:"U2B_MCQ_018",unit:"U2",topic:"U2T3",concept:"C_U2T3_018",type:"MCQ",stem:"Platelets arise from fragmentation of:",options:["Plasma cells","Megakaryocytes","Monocytes","Reticulocytes"],answer:1,difficulty:"high",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T3_REGULATION_ERROR",explanation:"Megakaryocytes release platelets.",strongestDistractorAnalysis:"Reticulocytes is the strongest distractor: reticulocytes are immature erythrocytes that, like platelets, are frequently discussed as an anucleate or near-anucleate blood component, so students conflate the two different processes — platelets arise by cytoplasmic fragmentation of megakaryocytes, whereas reticulocytes arise by nuclear extrusion from erythroblasts, an entirely different mechanism and cell lineage.",conceptId:"C_U2T3_018"},{id:"U2B_MCQ_019",unit:"U2",topic:"U2T3",concept:"C_U2T3_019",type:"MCQ",stem:"The most abundant normal circulating leucocyte is usually the:",options:["Eosinophil","Monocyte","Neutrophil","Basophil"],answer:2,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T3_STRUCTURE_FUNCTION_CONFUSION",explanation:"Neutrophils are normally the most numerous leucocytes.",strongestDistractorAnalysis:"Monocyte is the strongest distractor: monocytes are the largest circulating leucocyte and are emphasised heavily in teaching as macrophage precursors, which leads students to overestimate their relative abundance. In a normal differential count neutrophils make up roughly 60–70% of leucocytes, whereas monocytes are typically only 2–8%.",conceptId:"C_U2T3_019"},{id:"U2B_MCQ_020",unit:"U2",topic:"U2T3",concept:"C_U2T3_020",type:"MCQ",stem:"Which leucocyte commonly increases in parasitic infection?",options:["Erythrocyte","Platelet","Basophil only","Eosinophil"],answer:3,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T3_REGULATION_ERROR",explanation:"Eosinophils participate in defence against many parasites.",strongestDistractorAnalysis:"‘Basophil only’ is the strongest distractor: basophils, like eosinophils, participate in hypersensitivity-type responses and release histamine, so students conflate the two granulocyte types. Eosinophils are specifically recruited and elevated in helminthic/parasitic infection through IgE-mediated mechanisms; basophil elevation is not the characteristic parasitic response being tested here.",conceptId:"C_U2T3_020"},{id:"U2B_MCQ_021",unit:"U2",topic:"U2T3",concept:"C_U2T3_021",type:"MCQ",stem:"Which cell differentiates into tissue macrophages?",options:["Monocyte","Neutrophil","Erythrocyte","Platelet"],answer:0,difficulty:"high",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T3_STRUCTURE_FUNCTION_CONFUSION",explanation:"Monocytes can enter tissues and mature into macrophages.",strongestDistractorAnalysis:"Neutrophil is the strongest distractor: both neutrophils and monocytes are phagocytic innate-immune cells, so students treat them as interchangeable ‘phagocyte precursors’. Neutrophils are short-lived, terminally differentiated cells that do not become macrophages; only monocytes migrate into tissue and mature into long-lived macrophages.",conceptId:"C_U2T3_021"},{id:"U2B_MCQ_022",unit:"U2",topic:"U2T3",concept:"C_U2T3_022",type:"MCQ",stem:"The biconcave shape of erythrocytes mainly improves:",options:["Clot contraction","Surface area and deformability","DNA replication","Antibody secretion"],answer:1,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T3_REGULATION_ERROR",explanation:"Biconcavity supports efficient gas exchange and capillary passage.",strongestDistractorAnalysis:"‘Clot contraction’ is the strongest distractor: it is a genuine blood-related physiological process (clot retraction), but it is mediated by platelet contractile proteins, not by erythrocyte shape. Students conflate any ‘function improved by cell shape/structure’ with the biconcave disc's actual role, which is maximising surface-area-to-volume ratio for gas exchange and allowing deformable passage through narrow capillaries.",conceptId:"C_U2T3_022"},{id:"U2B_MCQ_023",unit:"U2",topic:"U2T3",concept:"C_U2T3_023",type:"MCQ",stem:"A differential count reports:",options:["ABO antigens","Clotting-factor activity","Relative proportions of leucocyte types","Plasma-protein fractions"],answer:2,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T3_STRUCTURE_FUNCTION_CONFUSION",explanation:"A differential count classifies white cells by type.",strongestDistractorAnalysis:"‘Plasma-protein fractions’ is the strongest distractor: both a differential leucocyte count and serum protein electrophoresis are lab reports expressed as relative proportions, and both appear in this same block of teaching, so students merge the two distinct techniques. A differential count classifies white cells by type; protein electrophoresis separates plasma proteins (albumin, globulins) by charge and size — unrelated methods and unrelated blood components.",conceptId:"C_U2T3_023"},{id:"U2B_MCQ_024",unit:"U2",topic:"U2T3",concept:"C_U2T3_024",type:"MCQ",stem:"Platelets contribute most directly to:",options:["Oxygen transport","Antibody production","Bilirubin conjugation","Primary haemostasis"],answer:3,difficulty:"high",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T3_REGULATION_ERROR",explanation:"Platelets form the primary haemostatic plug.",strongestDistractorAnalysis:"‘Antibody production’ is the strongest distractor: because platelets and lymphocytes are both discussed as circulating cells with roles in the body's defence broadly construed, students who have not cleanly separated the hemostatic and adaptive-immune cell lineages misattribute antibody synthesis (a plasma-cell/B-lymphocyte function) to platelets, which instead form the primary haemostatic plug via adhesion, activation and aggregation.",conceptId:"C_U2T3_024"},{id:"U2B_MCQ_025",unit:"U2",topic:"U2T4B",concept:"C_U2T4B_025",type:"MCQ",stem:"Adult haemopoiesis occurs mainly in:",options:["Red bone marrow","Yellow marrow exclusively","Lymph","Renal tubules"],answer:0,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T4B_STRUCTURE_FUNCTION_CONFUSION",explanation:"Red marrow is the main adult site.",strongestDistractorAnalysis:"‘Yellow marrow exclusively’ is the strongest distractor: yellow marrow is genuine bone marrow tissue, and students know that with age active marrow retreats from peripheral long bones into fatty, inactive yellow marrow, wrongly concluding this shift is total. Red marrow persists and remains the main site of haemopoiesis in the axial skeleton (vertebrae, sternum, pelvis, proximal long bones) throughout adult life.",conceptId:"C_U2T4B_025"},{id:"U2B_MCQ_026",unit:"U2",topic:"U2T4B",concept:"C_U2T4B_026",type:"MCQ",stem:"Erythropoietin is produced mainly by the:",options:["Pancreas","Kidney","Spleen","Thymus"],answer:1,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T4B_REGULATION_ERROR",explanation:"Renal interstitial cells produce most erythropoietin.",strongestDistractorAnalysis:"Spleen is the strongest distractor: the spleen is heavily associated with erythrocytes — it removes senescent red cells and can resume extramedullary haematopoiesis in marrow failure — so students transfer this red-cell association to erythropoietin synthesis itself. EPO is produced by peritubular interstitial fibroblast-like cells in the renal cortex, not by splenic tissue.",conceptId:"C_U2T4B_026"},{id:"U2B_MCQ_027",unit:"U2",topic:"U2T4B",concept:"C_U2T4B_027",type:"MCQ",stem:"The common ancestor of all blood cells is the:",options:["Reticulocyte","Plasma cell","Haematopoietic stem cell","Megakaryocyte"],answer:2,difficulty:"high",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T4B_STRUCTURE_FUNCTION_CONFUSION",explanation:"Multipotent haematopoietic stem cells generate all lineages.",strongestDistractorAnalysis:"Megakaryocyte is the strongest distractor: megakaryocytes are large, striking precursor cells that students associate with an ‘ancestor’ role because of their size and because platelets are described as fragments released from them. However, megakaryocytes are a terminally committed lineage restricted to producing platelets only; the true common ancestor of every blood cell lineage is the multipotent haematopoietic stem cell far upstream.",conceptId:"C_U2T4B_027"},{id:"U2B_MCQ_028",unit:"U2",topic:"U2T4B",concept:"C_U2T4B_028",type:"MCQ",stem:"Thrombopoietin chiefly supports production of:",options:["Neutrophils only","Erythrocytes only","Albumin","Megakaryocytes and platelets"],answer:3,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T4B_REGULATION_ERROR",explanation:"Thrombopoietin regulates megakaryopoiesis.",strongestDistractorAnalysis:"‘Erythrocytes only’ is the strongest distractor: thrombopoietin's name and structural homology with erythropoietin (both are glycoprotein cytokines acting via similar JAK-STAT signalling) lead students to assume it also drives red-cell production. Thrombopoietin specifically regulates megakaryocyte maturation and platelet release; erythropoietin, not thrombopoietin, governs erythroid output.",conceptId:"C_U2T4B_028"},{id:"U2B_MCQ_029",unit:"U2",topic:"U2T4B",concept:"C_U2T4B_029",type:"MCQ",stem:"Reticulocytes are:",options:["Immature erythrocytes recently released from marrow","Activated platelets","Mature neutrophils","Plasma-cell precursors"],answer:0,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T4B_STRUCTURE_FUNCTION_CONFUSION",explanation:"Reticulocytes are young erythroid cells.",strongestDistractorAnalysis:"‘Activated platelets’ is the strongest distractor: reticulocytes and platelets are both discussed as unusual circulating elements without a full nucleus, so students conflate the two despite entirely different origins — reticulocytes are immature erythrocytes that have just expelled their nucleus, whereas platelets are anucleate cytoplasmic fragments of megakaryocytes and were never erythroid cells.",conceptId:"C_U2T4B_029"},{id:"U2B_MCQ_030",unit:"U2",topic:"U2T4B",concept:"C_U2T4B_030",type:"MCQ",stem:"Vitamin B12 or folate deficiency impairs:",options:["Albumin transport","DNA synthesis in rapidly dividing precursors","Haemoglobin oxygen binding directly","Platelet adhesion only"],answer:1,difficulty:"high",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T4B_REGULATION_ERROR",explanation:"These vitamins are essential for nucleotide synthesis.",strongestDistractorAnalysis:"‘Haemoglobin oxygen binding directly’ is the strongest distractor: because B12/folate deficiency causes anaemia, students assume the defect must lie in haemoglobin's oxygen-carrying chemistry. The actual lesion is upstream, in DNA synthesis of rapidly dividing erythroid precursors, producing large, dysfunctional megaloblastic cells; haemoglobin's oxygen-binding biochemistry itself is unaffected.",conceptId:"C_U2T4B_030"},{id:"U2B_MCQ_031",unit:"U2",topic:"U2T4B",concept:"C_U2T4B_031",type:"MCQ",stem:"Hypoxia stimulates erythropoiesis primarily by increasing:",options:["Calcitonin","Secretin","Erythropoietin","Insulin"],answer:2,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T4B_STRUCTURE_FUNCTION_CONFUSION",explanation:"Hypoxia-inducible pathways increase renal erythropoietin.",strongestDistractorAnalysis:"Insulin is the strongest distractor: as a broadly anabolic, growth-promoting hormone, insulin is loosely associated by students with any ‘increased production’ process. Erythropoiesis in hypoxia is driven specifically by hypoxia-inducible factor pathways stabilising HIF-driven transcription of the erythropoietin gene in the kidney, a mechanism unrelated to insulin signalling.",conceptId:"C_U2T4B_031"},{id:"U2B_MCQ_032",unit:"U2",topic:"U2T4B",concept:"C_U2T4B_032",type:"MCQ",stem:"Aplastic anaemia primarily reflects failure of:",options:["Plasma oncotic pressure","ABO antigen synthesis","Fibrin breakdown","Bone-marrow blood-cell production"],answer:3,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T4B_REGULATION_ERROR",explanation:"Aplastic anaemia is marrow failure.",strongestDistractorAnalysis:"‘Fibrin breakdown’ is the strongest distractor: the term ‘aplastic’ is unfamiliar enough that students sometimes default to a coagulation-related answer purely because coagulation topics are taught nearby. ‘Aplastic’ specifically denotes failure of formation (a- = without, -plasia = formation): aplastic anaemia is bone-marrow failure to produce blood cells generally, not a defect in clot breakdown.",conceptId:"C_U2T4B_032"},{id:"U2B_MCQ_033",unit:"U2",topic:"U2T5B",concept:"C_U2T5B_033",type:"MCQ",stem:"Group A erythrocytes normally carry:",options:["A antigen","Anti-A antibody","B antigen only","No H-related structure"],answer:0,difficulty:"high",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T5B_STRUCTURE_FUNCTION_CONFUSION",explanation:"Group A cells express A antigen.",strongestDistractorAnalysis:"‘Anti-A antibody’ is the strongest distractor: it conflates the antigen carried on the red-cell surface with the antibody circulating in plasma. Group A erythrocytes display the A antigen on their membrane; the corresponding plasma antibody in a Group A individual is anti-B, not anti-A — the immune system does not produce antibodies against self-antigens.",conceptId:"C_U2T5B_033"},{id:"U2B_MCQ_034",unit:"U2",topic:"U2T5B",concept:"C_U2T5B_034",type:"MCQ",stem:"Group O plasma normally contains:",options:["Anti-D naturally in everyone","Anti-A and anti-B antibodies","No ABO antibodies","A and B antigens"],answer:1,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T5B_REGULATION_ERROR",explanation:"Group O individuals have both ABO antibodies.",strongestDistractorAnalysis:"‘Anti-D naturally in everyone’ is the strongest distractor: students who have just learned that ABO antibodies (anti-A, anti-B) occur naturally without prior antigen exposure sometimes overextend this ‘naturally occurring’ rule to the Rh system. Anti-D is fundamentally different — it is an acquired antibody that only develops after an Rh-negative person is exposed to Rh-positive red cells, unlike the naturally occurring ABO antibodies.",conceptId:"C_U2T5B_034"},{id:"U2B_MCQ_035",unit:"U2",topic:"U2T5B",concept:"C_U2T5B_035",type:"MCQ",stem:"The most clinically important Rh antigen is:",options:["B","H","D","A"],answer:2,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T5B_STRUCTURE_FUNCTION_CONFUSION",explanation:"D is the major Rh antigen in transfusion and pregnancy.",strongestDistractorAnalysis:"H antigen is the strongest distractor: H antigen is the shared precursor structure onto which A and B antigens are built in the ABO system, so students studying both systems together conflate ‘the antigen underlying the whole ABO system’ with ‘the clinically dominant antigen of the Rh system’. These are two unrelated systems; D is the Rh antigen with the greatest immunogenicity and clinical significance in transfusion and pregnancy.",conceptId:"C_U2T5B_035"},{id:"U2B_MCQ_036",unit:"U2",topic:"U2T5B",concept:"C_U2T5B_036",type:"MCQ",stem:"Anti-D antibodies usually develop after:",options:["Normal digestion","Loss of albumin","Platelet activation","Exposure to Rh-positive erythrocytes"],answer:3,difficulty:"high",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T5B_REGULATION_ERROR",explanation:"Rh antibodies arise after sensitisation.",strongestDistractorAnalysis:"‘Platelet activation’ is the strongest distractor: it is the most plausible-sounding immunology-adjacent process among the options, so students default to it when unsure. Anti-D antibody formation is an adaptive humoral immune response specifically triggered by exposure of an Rh-negative immune system to the foreign D antigen on Rh-positive erythrocytes; platelet activation is an unrelated haemostatic process with no role in antibody sensitisation.",conceptId:"C_U2T5B_036"},{id:"U2B_MCQ_037",unit:"U2",topic:"U2T5B",concept:"C_U2T5B_037",type:"MCQ",stem:"A major immediate danger of incompatible ABO transfusion is:",options:["Intravascular haemolysis","Vitamin deficiency","Reduced surfactant","Delayed erythropoiesis only"],answer:0,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T5B_STRUCTURE_FUNCTION_CONFUSION",explanatio
