 heart models, pulse examination, blood-pressure recording, heart sounds and ECG interpretation.",misconception:"Electrical events, mechanical contraction, pressure and blood flow are related but not identical measurements.",fiveMark:["Write a short note on Circulatory Pathways.","Add a labelled diagram or flowchart.","State one clinical correlation."],tenMark:"Describe circulatory pathways with definition, structure, mechanism, regulation, clinical significance and labelled diagram.",revision:["The pulmonary circulation carries deoxygenated blood from the right ventricle to the lungs and returns oxygenated blood to the left atrium.","Use pressure gradients to explain valve and flow events.","Distinguish electrical activation from mechanical activity."]},U2T15R:{objectives:["Explain the essential physiology of kidney anatomy.","Relate structure to renal homeostasis.","Apply the concept to laboratory and clinical interpretation."],prerequisites:["Basic membrane transport","Blood flow and pressure","Homeostasis"],mechanism:["The kidneys are paired retroperitoneal organs enclosed by a fibrous capsule and organised into cortex, medulla and renal pelvis.","The cortex contains renal corpuscles and convoluted tubules, while the medulla contains loops of Henle and collecting ducts arranged within renal pyramids.","Blood enters through the renal artery and is distributed through progressively smaller vessels to afferent arterioles and glomerular capillaries.","Efferent arterioles then form peritubular capillaries or vasa recta.","Urine flows through collecting ducts, papillary ducts, minor and major calyces, renal pelvis and ureter."],flowchart:"Kidney Anatomy → core mechanism → hormonal/neural regulation → clinical consequence",comparison:[["Dimension","Primary process","Clinical disturbance"],["Location","Specific nephron/urinary segment","Segment-specific dysfunction"],["Regulation","Intrinsic and hormonal","Homeostatic failure"]],clinical:"Clinical interpretation should connect altered filtration, transport, hormonal control or urinary outflow with changes in plasma composition, urine findings and volume status.",laboratory:"Relevant investigations include urinalysis, serum creatinine, estimated GFR, clearance calculations, electrolyte analysis and urine concentration tests.",misconception:"Filtration, reabsorption, secretion and excretion are distinct processes and must not be used interchangeably.",fiveMark:["Write a short note on Kidney Anatomy.","Add a labelled diagram or flowchart.","State one clinical or laboratory correlation."],tenMark:"Describe kidney anatomy with structure, mechanism, regulation, clinical significance and labelled diagram.",revision:["The kidneys are paired retroperitoneal organs enclosed by a fibrous capsule and organised into cortex, medulla and renal pelvis.","Always identify the nephron segment involved.","Link the process to extracellular-fluid and electrolyte homeostasis."]},U2T16R:{objectives:["Explain the essential physiology of nephron organisation.","Relate structure to renal homeostasis.","Apply the concept to laboratory and clinical interpretation."],prerequisites:["Basic membrane transport","Blood flow and pressure","Homeostasis"],mechanism:["The nephron is the structural and functional unit of the kidney.","It consists of a renal corpuscle and renal tubule.","The renal corpuscle contains a glomerular capillary tuft within Bowman’s capsule.","Tubular segments include proximal convoluted tubule, loop of Henle, distal convoluted tubule and connecting tubule, which drains into collecting ducts.","Cortical nephrons have short loops, while juxtamedullary nephrons have long loops that descend deep into the medulla and are essential for concentrating urine."],flowchart:"Nephron Organisation → core mechanism → hormonal/neural regulation → clinical consequence",comparison:[["Dimension","Primary process","Clinical disturbance"],["Location","Specific nephron/urinary segment","Segment-specific dysfunction"],["Regulation","Intrinsic and hormonal","Homeostatic failure"]],clinical:"Clinical interpretation should connect altered filtration, transport, hormonal control or urinary outflow with changes in plasma composition, urine findings and volume status.",laboratory:"Relevant investigations include urinalysis, serum creatinine, estimated GFR, clearance calculations, electrolyte analysis and urine concentration tests.",misconception:"Filtration, reabsorption, secretion and excretion are distinct processes and must not be used interchangeably.",fiveMark:["Write a short note on Nephron Organisation.","Add a labelled diagram or flowchart.","State one clinical or laboratory correlation."],tenMark:"Describe nephron organisation with structure, mechanism, regulation, clinical significance and labelled diagram.",revision:["The nephron is the structural and functional unit of the kidney.","Always identify the nephron segment involved.","Link the process to extracellular-fluid and electrolyte homeostasis."]},U2T17R:{objectives:["Explain the essential physiology of glomerular filtration.","Relate structure to renal homeostasis.","Apply the concept to laboratory and clinical interpretation."],prerequisites:["Basic membrane transport","Blood flow and pressure","Homeostasis"],mechanism:["Glomerular filtration is the movement of water and small solutes from glomerular capillaries into Bowman’s space.","The filtration barrier consists of fenestrated endothelium, glomerular basement membrane and podocyte slit diaphragms.","Filtration depends on the net balance of glomerular hydrostatic pressure, Bowman’s-space hydrostatic pressure and plasma oncotic pressure, together with the filtration coefficient.","Glomerular filtration rate is autoregulated through the myogenic response and tubuloglomerular feedback."],flowchart:"Glomerular Filtration → core mechanism → hormonal/neural regulation → clinical consequence",comparison:[["Force","Effect on filtration","Typical direction"],["Glomerular hydrostatic pressure","Favours filtration","Outward"],["Bowman’s-space hydrostatic pressure","Opposes filtration","Inward"],["Plasma oncotic pressure","Opposes filtration","Inward"]],clinical:"Clinical interpretation should connect altered filtration, transport, hormonal control or urinary outflow with changes in plasma composition, urine findings and volume status.",laboratory:"Relevant investigations include urinalysis, serum creatinine, estimated GFR, clearance calculations, electrolyte analysis and urine concentration tests.",misconception:"Filtration, reabsorption, secretion and excretion are distinct processes and must not be used interchangeably.",fiveMark:["Write a short note on Glomerular Filtration.","Add a labelled diagram or flowchart.","State one clinical or laboratory correlation."],tenMark:"Describe glomerular filtration with structure, mechanism, regulation, clinical significance and labelled diagram.",revision:["Glomerular filtration is the movement of water and small solutes from glomerular capillaries into Bowman’s space.","Always identify the nephron segment involved.","Link the process to extracellular-fluid and electrolyte homeostasis."]},U2T18R:{objectives:["Explain the essential physiology of tubular reabsorption.","Relate structure to renal homeostasis.","Apply the concept to laboratory and clinical interpretation."],prerequisites:["Basic membrane transport","Blood flow and pressure","Homeostasis"],mechanism:["Tubular reabsorption returns filtered substances from tubular fluid to blood.","The proximal tubule reabsorbs most filtered sodium, water, bicarbonate, glucose and amino acids.","The loop of Henle separates solute and water handling between descending and ascending limbs.","The distal tubule and collecting duct perform regulated fine-tuning under hormonal control.","Glucose is normally reabsorbed by sodium–glucose cotransport until transport maximum is exceeded, after which glucosuria may occur."],flowchart:"Tubular Reabsorption → core mechanism → hormonal/neural regulation → clinical consequence",comparison:[["Segment","Major transport role","Water permeability"],["Proximal tubule","Bulk reabsorption","High"],["Thick ascending limb","Na-K-2Cl reabsorption","Very low"],["Collecting duct","Hormonal fine-tuning","ADH-dependent"]],clinical:"Clinical interpretation should connect altered filtration, transport, hormonal control or urinary outflow with changes in plasma composition, urine findings and volume status.",laboratory:"Relevant investigations include urinalysis, serum creatinine, estimated GFR, clearance calculations, electrolyte analysis and urine concentration tests.",misconception:"Filtration, reabsorption, secretion and excretion are distinct processes and must not be used interchangeably.",fiveMark:["Write a short note on Tubular Reabsorption.","Add a labelled diagram or flowchart.","State one clinical or laboratory correlation."],tenMark:"Describe tubular reabsorption with structure, mechanism, regulation, clinical significance and labelled diagram.",revision:["Tubular reabsorption returns filtered substances from tubular fluid to blood.","Always identify the nephron segment involved.","Link the process to extracellular-fluid and electrolyte homeostasis."]},U2T19R:{objectives:["Explain the essential physiology of tubular secretion.","Relate structure to renal homeostasis.","Apply the concept to laboratory and clinical interpretation."],prerequisites:["Basic membrane transport","Blood flow and pressure","Homeostasis"],mechanism:["Tubular secretion transfers selected substances from peritubular capillary blood into tubular fluid.","The proximal tubule secretes organic acids, organic bases, many drugs and metabolites.","Distal segments secrete hydrogen and potassium ions under regulated conditions.","Secretion supports acid–base balance, potassium homeostasis and elimination of substances that are poorly filtered or protein bound.","Renal clearance reflects the combined effects of filtration, reabsorption and secretion."],flowchart:"Tubular Secretion → core mechanism → hormonal/neural regulation → clinical consequence",comparison:[["Dimension","Primary process","Clinical disturbance"],["Location","Specific nephron/urinary segment","Segment-specific dysfunction"],["Regulation","Intrinsic and hormonal","Homeostatic failure"]],clinical:"Clinical interpretation should connect altered filtration, transport, hormonal control or urinary outflow with changes in plasma composition, urine findings and volume status.",laboratory:"Relevant investigations include urinalysis, serum creatinine, estimated GFR, clearance calculations, electrolyte analysis and urine concentration tests.",misconception:"Filtration, reabsorption, secretion and excretion are distinct processes and must not be used interchangeably.",fiveMark:["Write a short note on Tubular Secretion.","Add a labelled diagram or flowchart.","State one clinical or laboratory correlation."],tenMark:"Describe tubular secretion with structure, mechanism, regulation, clinical significance and labelled diagram.",revision:["Tubular secretion transfers selected substances from peritubular capillary blood into tubular fluid.","Always identify the nephron segment involved.","Link the process to extracellular-fluid and electrolyte homeostasis."]},U2T20R:{objectives:["Explain the essential physiology of counter-current multiplier.","Relate structure to renal homeostasis.","Apply the concept to laboratory and clinical interpretation."],prerequisites:["Basic membrane transport","Blood flow and pressure","Homeostasis"],mechanism:["The counter-current multiplier in loops of Henle creates the corticomedullary osmotic gradient.","The descending thin limb is highly permeable to water but relatively less permeable to solute, whereas the thick ascending limb actively reabsorbs sodium, potassium and chloride while remaining effectively impermeable to water.","Repetition along oppositely directed flows multiplies a small transverse gradient into a large longitudinal medullary gradient.","Juxtamedullary nephrons are especially important because of their long loops."],flowchart:"Counter-current Multiplier → core mechanism → hormonal/neural regulation → clinical consequence",comparison:[["Limb","Water permeability","Main event"],["Descending thin limb","High","Water leaves"],["Thick ascending limb","Low","Salt leaves"],["Collecting duct","ADH-dependent","Water reabsorption"]],clinical:"Clinical interpretation should connect altered filtration, transport, hormonal control or urinary outflow with changes in plasma composition, urine findings and volume status.",laboratory:"Relevant investigations include urinalysis, serum creatinine, estimated GFR, clearance calculations, electrolyte analysis and urine concentration tests.",misconception:"Filtration, reabsorption, secretion and excretion are distinct processes and must not be used interchangeably.",fiveMark:["Write a short note on Counter-current Multiplier.","Add a labelled diagram or flowchart.","State one clinical or laboratory correlation."],tenMark:"Describe counter-current multiplier with structure, mechanism, regulation, clinical significance and labelled diagram.",revision:["The counter-current multiplier in loops of Henle creates the corticomedullary osmotic gradient.","Always identify the nephron segment involved.","Link the process to extracellular-fluid and electrolyte homeostasis."]},U2T21R:{objectives:["Explain the essential physiology of counter-current exchanger and vasa recta.","Relate structure to renal homeostasis.","Apply the concept to laboratory and clinical interpretation."],prerequisites:["Basic membrane transport","Blood flow and pressure","Homeostasis"],mechanism:["The vasa recta preserve the medullary osmotic gradient by passive counter-current exchange.","Their hairpin arrangement and slow blood flow allow solutes and water to exchange in a way that minimises washout.","As blood descends, it gains solute and loses water; as it ascends, it loses solute and gains water.","The vasa recta therefore supply the medulla while maintaining the gradient created by loops of Henle."],flowchart:"Counter-current Exchanger and Vasa Recta → core mechanism → hormonal/neural regulation → clinical consequence",comparison:[["Dimension","Primary process","Clinical disturbance"],["Location","Specific nephron/urinary segment","Segment-specific dysfunction"],["Regulation","Intrinsic and hormonal","Homeostatic failure"]],clinical:"Clinical interpretation should connect altered filtration, transport, hormonal control or urinary outflow with changes in plasma composition, urine findings and volume status.",laboratory:"Relevant investigations include urinalysis, serum creatinine, estimated GFR, clearance calculations, electrolyte analysis and urine concentration tests.",misconception:"Filtration, reabsorption, secretion and excretion are distinct processes and must not be used interchangeably.",fiveMark:["Write a short note on Counter-current Exchanger and Vasa Recta.","Add a labelled diagram or flowchart.","State one clinical or laboratory correlation."],tenMark:"Describe counter-current exchanger and vasa recta with structure, mechanism, regulation, clinical significance and labelled diagram.",revision:["The vasa recta preserve the medullary osmotic gradient by passive counter-current exchange.","Always identify the nephron segment involved.","Link the process to extracellular-fluid and electrolyte homeostasis."]},U2T22R:{objectives:["Explain the essential physiology of urine concentration and dilution.","Relate structure to renal homeostasis.","Apply the concept to laboratory and clinical interpretation."],prerequisites:["Basic membrane transport","Blood flow and pressure","Homeostasis"],mechanism:["Urine concentration depends on the medullary osmotic gradient and variable water permeability of collecting ducts.","Antidiuretic hormone increases aquaporin-2 insertion into apical membranes of principal cells, permitting water reabsorption into the hyperosmotic medulla.","In low antidiuretic hormone states, collecting ducts remain relatively water impermeable and dilute urine is excreted.","Urea recycling from inner medullary collecting ducts contributes importantly to medullary hypertonicity."],flowchart:"Urine Concentration and Dilution → core mechanism → hormonal/neural regulation → clinical consequence",comparison:[["Dimension","Primary process","Clinical disturbance"],["Location","Specific nephron/urinary segment","Segment-specific dysfunction"],["Regulation","Intrinsic and hormonal","Homeostatic failure"]],clinical:"Clinical interpretation should connect altered filtration, transport, hormonal control or urinary outflow with changes in plasma composition, urine findings and volume status.",laboratory:"Relevant investigations include urinalysis, serum creatinine, estimated GFR, clearance calculations, electrolyte analysis and urine concentration tests.",misconception:"Filtration, reabsorption, secretion and excretion are distinct processes and must not be used interchangeably.",fiveMark:["Write a short note on Urine Concentration and Dilution.","Add a labelled diagram or flowchart.","State one clinical or laboratory correlation."],tenMark:"Describe urine concentration and dilution with structure, mechanism, regulation, clinical significance and labelled diagram.",revision:["Urine concentration depends on the medullary osmotic gradient and variable water permeability of collecting ducts.","Always identify the nephron segment involved.","Link the process to extracellular-fluid and electrolyte homeostasis."]},U2T23R:{objectives:["Explain the essential physiology of regulation of renal function.","Relate structure to renal homeostasis.","Apply the concept to laboratory and clinical interpretation."],prerequisites:["Basic membrane transport","Blood flow and pressure","Homeostasis"],mechanism:["Renal function is regulated by intrinsic autoregulation, sympathetic nerves and hormones.","Autoregulation stabilises renal blood flow and glomerular filtration over a range of arterial pressures.","Sympathetic activation constricts renal vessels and promotes renin release during severe volume loss.","Angiotensin II, aldosterone, antidiuretic hormone, natriuretic peptides and parathyroid hormone alter vascular tone or tubular transport.","These mechanisms coordinate extracellular-fluid volume, osmolality, electrolyte balance and pressure."],flowchart:"Regulation of Renal Function → core mechanism → hormonal/neural regulation → clinical consequence",comparison:[["Dimension","Primary process","Clinical disturbance"],["Location","Specific nephron/urinary segment","Segment-specific dysfunction"],["Regulation","Intrinsic and hormonal","Homeostatic failure"]],clinical:"Clinical interpretation should connect altered filtration, transport, hormonal control or urinary outflow with changes in plasma composition, urine findings and volume status.",laboratory:"Relevant investigations include urinalysis, serum creatinine, estimated GFR, clearance calculations, electrolyte analysis and urine concentration tests.",misconception:"Filtration, reabsorption, secretion and excretion are distinct processes and must not be used interchangeably.",fiveMark:["Write a short note on Regulation of Renal Function.","Add a labelled diagram or flowchart.","State one clinical or laboratory correlation."],tenMark:"Describe regulation of renal function with structure, mechanism, regulation, clinical significance and labelled diagram.",revision:["Renal function is regulated by intrinsic autoregulation, sympathetic nerves and hormones.","Always identify the nephron segment involved.","Link the process to extracellular-fluid and electrolyte homeostasis."]},U2T24R:{objectives:["Explain the essential physiology of micturition reflex.","Relate structure to renal homeostasis.","Apply the concept to laboratory and clinical interpretation."],prerequisites:["Basic membrane transport","Blood flow and pressure","Homeostasis"],mechanism:["Micturition is a spinal reflex modulated by pontine and cortical centres.","Bladder filling activates stretch receptors, and afferent signals enter sacral spinal segments.","Parasympathetic efferents contract the detrusor and relax the internal urethral outlet.","Somatic pudendal activity controls the external urethral sphincter.","During storage, sympathetic and somatic activity favour continence; during voiding, coordinated parasympathetic activation and sphincter relaxation permit urine flow."],flowchart:"Micturition Reflex → core mechanism → hormonal/neural regulation → clinical consequence",comparison:[["Dimension","Primary process","Clinical disturbance"],["Location","Specific nephron/urinary segment","Segment-specific dysfunction"],["Regulation","Intrinsic and hormonal","Homeostatic failure"]],clinical:"Clinical interpretation should connect altered filtration, transport, hormonal control or urinary outflow with changes in plasma composition, urine findings and volume status.",laboratory:"Relevant investigations include urinalysis, serum creatinine, estimated GFR, clearance calculations, electrolyte analysis and urine concentration tests.",misconception:"Filtration, reabsorption, secretion and excretion are distinct processes and must not be used interchangeably.",fiveMark:["Write a short note on Micturition Reflex.","Add a labelled diagram or flowchart.","State one clinical or laboratory correlation."],tenMark:"Describe micturition reflex with structure, mechanism, regulation, clinical significance and labelled diagram.",revision:["Micturition is a spinal reflex modulated by pontine and cortical centres.","Always identify the nephron segment involved.","Link the process to extracellular-fluid and electrolyte homeostasis."]},U2T25R:{objectives:["Explain the essential physiology of acid–base balance.","Relate structure to renal homeostasis.","Apply the concept to laboratory and clinical interpretation."],prerequisites:["Basic membrane transport","Blood flow and pressure","Homeostasis"],mechanism:["The kidneys contribute to acid–base homeostasis by reabsorbing filtered bicarbonate, secreting hydrogen ions and generating new bicarbonate.","Proximal tubules reclaim most bicarbonate through carbonic-anhydrase-dependent processes.","Distal nephron intercalated cells secrete hydrogen ions and acidify urine.","Phosphate buffering and ammonium excretion permit net acid elimination.","Renal compensation for respiratory acid–base disturbances develops more slowly than respiratory compensation for metabolic disturbances."],flowchart:"Acid–Base Balance → core mechanism → hormonal/neural regulation → clinical consequence",comparison:[["Dimension","Primary process","Clinical disturbance"],["Location","Specific nephron/urinary segment","Segment-specific dysfunction"],["Regulation","Intrinsic and hormonal","Homeostatic failure"]],clinical:"Clinical interpretation should connect altered filtration, transport, hormonal control or urinary outflow with changes in plasma composition, urine findings and volume status.",laboratory:"Relevant investigations include urinalysis, serum creatinine, estimated GFR, clearance calculations, electrolyte analysis and urine concentration tests.",misconception:"Filtration, reabsorption, secretion and excretion are distinct processes and must not be used interchangeably.",fiveMark:["Write a short note on Acid–Base Balance.","Add a labelled diagram or flowchart.","State one clinical or laboratory correlation."],tenMark:"Describe acid–base balance with structure, mechanism, regulation, clinical significance and labelled diagram.",revision:["The kidneys contribute to acid–base homeostasis by reabsorbing filtered bicarbonate, secreting hydrogen ions and generating new bicarbonate.","Always identify the nephron segment involved.","Link the process to extracellular-fluid and electrolyte homeostasis."]},U2T26R:{objectives:["Explain the essential physiology of renin–angiotensin–aldosterone system.","Relate structure to renal homeostasis.","Apply the concept to laboratory and clinical interpretation."],prerequisites:["Basic membrane transport","Blood flow and pressure","Homeostasis"],mechanism:["The renin–angiotensin–aldosterone system is activated by reduced renal perfusion, reduced sodium chloride delivery to the macula densa or increased renal sympathetic activity.","Renin cleaves angiotensinogen to angiotensin I, which angiotensin-converting enzyme converts to angiotensin II.","Angiotensin II constricts vessels, stimulates aldosterone and antidiuretic hormone, promotes thirst and enhances proximal sodium reabsorption.","Aldosterone increases sodium reabsorption and potassium secretion in the distal nephron."],flowchart:"Renin–Angiotensin–Aldosterone System → core mechanism → hormonal/neural regulation → clinical consequence",comparison:[["Dimension","Primary process","Clinical disturbance"],["Location","Specific nephron/urinary segment","Segment-specific dysfunction"],["Regulation","Intrinsic and hormonal","Homeostatic failure"]],clinical:"Clinical interpretation should connect altered filtration, transport, hormonal control or urinary outflow with changes in plasma composition, urine findings and volume status.",laboratory:"Relevant investigations include urinalysis, serum creatinine, estimated GFR, clearance calculations, electrolyte analysis and urine concentration tests.",misconception:"Filtration, reabsorption, secretion and excretion are distinct processes and must not be used interchangeably.",fiveMark:["Write a short note on Renin–Angiotensin–Aldosterone System.","Add a labelled diagram or flowchart.","State one clinical or laboratory correlation."],tenMark:"Describe renin–angiotensin–aldosterone system with structure, mechanism, regulation, clinical significance and labelled diagram.",revision:["The renin–angiotensin–aldosterone system is activated by reduced renal perfusion, reduced sodium chloride delivery to the macula densa or increased renal sympathetic activity.","Always identify the nephron segment involved.","Link the process to extracellular-fluid and electrolyte homeostasis."]},U2T27R:{objectives:["Explain the essential physiology of hormonal regulation of kidney function.","Relate structure to renal homeostasis.","Apply the concept to laboratory and clinical interpretation."],prerequisites:["Basic membrane transport","Blood flow and pressure","Homeostasis"],mechanism:["Antidiuretic hormone regulates water permeability in collecting ducts.","Aldosterone promotes sodium retention and potassium secretion.","Atrial and brain natriuretic peptides favour sodium excretion and oppose renin–angiotensin–aldosterone activity.","Parathyroid hormone increases calcium reabsorption and decreases phosphate reabsorption.","Calcitonin has a comparatively modest renal role in adults."],flowchart:"Hormonal Regulation of Kidney Function → core mechanism → hormonal/neural regulation → clinical consequence",comparison:[["Dimension","Primary process","Clinical disturbance"],["Location","Specific nephron/urinary segment","Segment-specific dysfunction"],["Regulation","Intrinsic and hormonal","Homeostatic failure"]],clinical:"Clinical interpretation should connect altered filtration, transport, hormonal control or urinary outflow with changes in plasma composition, urine findings and volume status.",laboratory:"Relevant investigations include urinalysis, serum creatinine, estimated GFR, clearance calculations, electrolyte analysis and urine concentration tests.",misconception:"Filtration, reabsorption, secretion and excretion are distinct processes and must not be used interchangeably.",fiveMark:["Write a short note on Hormonal Regulation of Kidney Function.","Add a labelled diagram or flowchart.","State one clinical or laboratory correlation."],tenMark:"Describe hormonal regulation of kidney function with structure, mechanism, regulation, clinical significance and labelled diagram.",revision:["Antidiuretic hormone regulates water permeability in collecting ducts.","Always identify the nephron segment involved.","Link the process to extracellular-fluid and electrolyte homeostasis."]},U2T28R:{objectives:["Explain the essential physiology of renal clearance and clinical indices.","Relate structure to renal homeostasis.","Apply the concept to laboratory and clinical interpretation."],prerequisites:["Basic membrane transport","Blood flow and pressure","Homeostasis"],mechanism:["Renal clearance is the virtual volume of plasma completely cleared of a substance per unit time.","Clearance equals urine concentration multiplied by urine flow divided by plasma concentration.","Inulin clearance closely measures glomerular filtration rate because inulin is filtered but not reabsorbed, secreted or metabolised.","Creatinine clearance is more practical clinically but slightly overestimates glomerular filtration because of limited tubular secretion.","Para-aminohippurate clearance approximates effective renal plasma flow at low concentrations."],flowchart:"Renal Clearance and Clinical Indices → core mechanism → hormonal/neural regulation → clinical consequence",comparison:[["Dimension","Primary process","Clinical disturbance"],["Location","Specific nephron/urinary segment","Segment-specific dysfunction"],["Regulation","Intrinsic and hormonal","Homeostatic failure"]],clinical:"Clinical interpretation should connect altered filtration, transport, hormonal control or urinary outflow with changes in plasma composition, urine findings and volume status.",laboratory:"Relevant investigations include urinalysis, serum creatinine, estimated GFR, clearance calculations, electrolyte analysis and urine concentration tests.",misconception:"Filtration, reabsorption, secretion and excretion are distinct processes and must not be used interchangeably.",fiveMark:["Write a short note on Renal Clearance and Clinical Indices.","Add a labelled diagram or flowchart.","State one clinical or laboratory correlation."],tenMark:"Describe renal clearance and clinical indices with structure, mechanism, regulation, clinical significance and labelled diagram.",revision:["Renal clearance is the virtual volume of plasma completely cleared of a substance per unit time.","Always identify the nephron segment involved.","Link the process to extracellular-fluid and electrolyte homeostasis."]},U2T29R:{objectives:["Explain the essential physiology of urinalysis and renal disorders.","Relate structure to renal homeostasis.","Apply the concept to laboratory and clinical interpretation."],prerequisites:["Basic membrane transport","Blood flow and pressure","Homeostasis"],mechanism:["Urinalysis evaluates physical properties, chemical constituents and microscopic sediment.","Proteinuria may indicate glomerular barrier injury, while glucosuria can occur when filtered glucose exceeds tubular transport capacity or when proximal tubular reabsorption is impaired.","Haematuria, casts, crystals and specific-gravity changes provide diagnostic clues.","Acute kidney injury is a rapid decline in renal function, whereas chronic kidney disease is persistent structural or functional abnormality.","Nephrotic syndrome features heavy proteinuria, hypoalbuminaemia and oedema."],flowchart:"Urinalysis and Renal Disorders → core mechanism → hormonal/neural regulation → clinical consequence",comparison:[["Dimension","Primary process","Clinical disturbance"],["Location","Specific nephron/urinary segment","Segment-specific dysfunction"],["Regulation","Intrinsic and hormonal","Homeostatic failure"]],clinical:"Clinical interpretation should connect altered filtration, transport, hormonal control or urinary outflow with changes in plasma composition, urine findings and volume status.",laboratory:"Relevant investigations include urinalysis, serum creatinine, estimated GFR, clearance calculations, electrolyte analysis and urine concentration tests.",misconception:"Filtration, reabsorption, secretion and excretion are distinct processes and must not be used interchangeably.",fiveMark:["Write a short note on Urinalysis and Renal Disorders.","Add a labelled diagram or flowchart.","State one clinical or laboratory correlation."],tenMark:"Describe urinalysis and renal disorders with structure, mechanism, regulation, clinical significance and labelled diagram.",revision:["Urinalysis evaluates physical properties, chemical constituents and microscopic sediment.","Always identify the nephron segment involved.","Link the process to extracellular-fluid and electrolyte homeostasis."]}};Object.entries({U1T1:"Gross specimens, histological sections and motility recordings connect regional structure with secretion, absorption and propulsion.",U1T2:"Titration of gastric acidity, enzyme assays and secretory-response experiments demonstrate pH dependence and neurohormonal regulation.",U1T3:"Reducing-sugar tests, intestinal transport preparations and oral glucose-response data distinguish digestion from epithelial absorption.",U1T4:"Protease assays demonstrate substrate specificity, pH optima and zymogen activation; nitrogen balance provides a whole-body connection.",U1T5:"Emulsification demonstrations, lipase assays and faecal-fat interpretation separate physical dispersion, enzymatic hydrolysis and absorption.",U1T6:"Spirometry measures volumes and flows but not residual volume; pressure–volume curves and peak-flow recording probe mechanics and resistance.",U1T7:"Haemoglobin saturation curves, pulse oximetry and blood-gas analysis measure different variables and must not be interpreted interchangeably.",U1T8:"Respiratory recordings during controlled CO2, exercise or breath-hold protocols illustrate chemoreflex drive with appropriate safety limits."}).forEach(([id,laboratory])=>{AnimalPhysiologyApp.LessonEnhancements[id].laboratory=laboratory});Object.assign(AnimalPhysiologyApp.LessonEnhancements,{U3T1:{objectives:["Relate neuronal polarity to information flow.","Compare dendrites, soma, axon hillock, axon and terminals.","Explain axonal transport and glial support."],prerequisites:["Cell membrane","Cytoskeleton","Basic tissue organisation"],mechanism:["Dendrites and soma receive synaptic inputs.","Graded potentials spread toward the axon initial segment.","The initial segment integrates excitation and inhibition.","A threshold event initiates an action potential.","Axonal transport supplies terminals and returns signalling cargo to the soma."],flowchart:"Synaptic input → dendritic integration → axon initial segment → action potential → terminal output",comparison:[["Region","Dominant specialisation","Physiological significance"],["Dendrite","Input and local integration","Receives synapses"],["Initial segment","High NaV-channel density","Spike initiation"],["Axon terminal","Ca2+-dependent exocytosis","Neurotransmitter release"]],clinical:"Demyelination slows or blocks conduction; disrupted axonal transport contributes to distal axon degeneration and several neurodegenerative disorders.",laboratory:"Nissl staining, immunohistochemistry, tract tracing and patch-clamp recording connect neuronal structure with function.",misconception:"A neuron is not a simple electrical wire: most computation occurs through graded, spatially distributed synaptic inputs before spike initiation.",fiveMark:["Draw and label a multipolar neuron.","Differentiate dendritic and axonal functions.","Write a note on fast and slow axonal transport."],tenMark:"Explain neuronal structural polarity, functional compartments, axonal transport and the roles of major glial cells.",revision:["Initial segment is the usual spike trigger zone.","Microtubules support long-range transport.","Glia actively regulate the neuronal environment."]},U3T2:{objectives:["Derive the ionic basis of resting membrane potential.","Use Nernst and Goldman concepts correctly.","Predict effects of altered extracellular potassium."],prerequisites:["Diffusion","Electrochemical gradient","Selective membrane permeability"],mechanism:["Ion pumps establish Na+ and K+ concentration gradients.","At rest, K+ permeability exceeds Na+ permeability.","K+ efflux leaves impermeant intracellular anions behind.","The growing electrical gradient opposes further K+ loss.","The membrane potential stabilises where weighted ionic fluxes balance."],flowchart:"Ion gradients + selective permeability → charge separation → electrical opposition → stable resting potential",comparison:[["Equation","Use","Limitation"],["Nernst","Equilibrium potential for one ion","Ignores other permeant ions"],["Goldman–Hodgkin–Katz","Membrane potential from multiple ions","Requires relative permeabilities"]],clinical:"Hyperkalaemia initially depolarises cells but sustained depolarisation can inactivate voltage-gated Na+ channels and reduce excitability.",laboratory:"Intracellular microelectrodes or whole-cell patch clamp measure membrane potential; controlled changes in external K+ test predictions.",misconception:"The Na+/K+ pump maintains gradients and contributes a small electrogenic effect, but resting potential is produced mainly by selective permeability.",fiveMark:["Define resting membrane potential.","Explain the role of K+ leak channels.","Differentiate Nernst and Goldman equations."],tenMark:"Explain the ionic basis, equations, experimental evidence and physiological significance of resting membrane potential.",revision:["Permeability matters as much as concentration.","Resting Vm lies near EK, not exactly at EK.","Extracellular K+ strongly influences excitability."]},U3T3:{objectives:["Explain action-potential phases using channel states.","Distinguish absolute and relative refractory periods.","Interpret threshold and all-or-none behaviour."],prerequisites:["Resting membrane potential","Voltage-gated channels","Electrochemical gradients"],mechanism:["Depolarisation to threshold activates voltage-gated Na+ channels.","Regenerative Na+ entry produces the upstroke.","Na+ channels inactivate while delayed K+ channels open.","K+ efflux repolarises and may hyperpolarise the membrane.","Channel recovery restores resting excitability."],flowchart:"Threshold → NaV activation → rapid depolarisation → NaV inactivation + KV opening → repolarisation → recovery",comparison:[["Period","Channel basis","Response"],["Absolute refractory","Most NaV channels inactivated","No second action potential"],["Relative refractory","Some NaV recovered; K+ conductance remains high","Stronger stimulus required"]],clinical:"Local anaesthetics reduce impulse generation by blocking voltage-gated Na+ channels; channelopathies can produce episodic weakness, pain or arrhythmia.",laboratory:"Voltage clamp separates ionic currents; current clamp records membrane voltage responses to injected current.",misconception:"K+ does not enter to repolarise the membrane; repolarisation is driven mainly by outward K+ current and declining inward Na+ current.",fiveMark:["Draw a labelled action potential.","Explain the refractory periods.","Define threshold and all-or-none response."],tenMark:"Describe the ionic conductances, channel states, refractory behaviour and experimental basis of the neuronal action potential.",revision:["NaV activation is rapid.","NaV inactivation limits the upstroke.","Delayed K+ conductance restores negativity."]},U3T4:{objectives:["Compare continuous and saltatory conduction.","Explain cable properties and the length constant.","Predict effects of axon diameter and myelination."],prerequisites:["Action potential","Membrane resistance","Axial resistance"],mechanism:["Local circuit current depolarises adjacent membrane.","Unmyelinated axons regenerate spikes continuously.","Myelin raises membrane resistance and lowers capacitance.","Current spreads rapidly beneath internodes.","Nodes of Ranvier regenerate the action potential."],flowchart:"Active node → longitudinal current → next node reaches threshold → spike regeneration",comparison:[["Feature","Unmyelinated","Myelinated"], INURIA",marks:5,prompt:"Interpret urinalysis showing protein 3+, oedema and low serum albumin.",rubric:["Proteinuria recognised","Glomerular origin","Hypoalbuminaemia","Oedema mechanism","Nephrotic syndrome"]},{id:"A_VV_01",type:"viva",topicId:"U2T12C",conceptId:"C_U2T12C_CORE",subconceptId:"SC_CO_DETERMINANTS",marks:3,prompt:"Define cardiac output and name its principal determinants.",rubric:["Definition","Heart rate","Stroke volume"]},{id:"A_VV_02",type:"viva",topicId:"U2T17R",conceptId:"C_U2T17R_CORE",subconceptId:"SC_NET_FILTRATION",marks:3,prompt:"Name the forces determining net filtration pressure.",rubric:["Glomerular hydrostatic pressure","Bowman’s pressure","Plasma oncotic pressure"]},{id:"A_CL_01",type:"clinical",topicId:"U2T26R",conceptId:"C_U2T26R_CORE",subconceptId:"SC_RAAS_ANGII",marks:5,prompt:"Trace the physiological response to reduced cardiac output through renal perfusion, renin, angiotensin II and aldosterone.",rubric:["Reduced renal perfusion","Renin release","Angiotensin II","Aldosterone","Fluid-retention consequence"]},{id:"A_CL_02",type:"clinical",topicId:"U2T29R",conceptId:"C_U2T29R_CORE",subconceptId:"SC_OEDEMA",marks:5,prompt:"Explain oedema in nephrotic syndrome from podocyte injury to interstitial fluid accumulation.",rubric:["Podocyte/barrier injury","Proteinuria","Hypoalbuminaemia","Reduced oncotic pressure","Oedema"]}]};AnimalPhysiologyApp.ClinicalGraph={nodes:[{id:"CL_LOW_CO",title:"Reduced cardiac output",topicId:"U2T12C",subconceptId:"SC_CO_DETERMINANTS"},{id:"CL_LOW_RENAL_PERF",title:"Reduced renal perfusion",topicId:"U2T13C",subconceptId:"SC_BP_MAP"},{id:"CL_RENIN",title:"Renin release",topicId:"U2T26R",subconceptId:"SC_RAAS_RENIN"},{id:"CL_ANGII",title:"Angiotensin II",topicId:"U2T26R",subconceptId:"SC_RAAS_ANGII"},{id:"CL_ALDO",title:"Aldosterone-mediated retention",topicId:"U2T27R",subconceptId:"SC_RAAS_ALDO"},{id:"CL_FLUID_RET",title:"Fluid retention",topicId:"U2T27R",subconceptId:"SC_RAAS_ALDO"},{id:"CL_PODOCYTE",title:"Podocyte injury",topicId:"U2T17R",subconceptId:"SC_GLOMERULAR_BARRIER"},{id:"CL_PROTEINURIA",title:"Proteinuria",topicId:"U2T29R",subconceptId:"SC_PROTEINURIA"},{id:"CL_HYPOALBUMIN",title:"Hypoalbuminaemia",topicId:"U2T29R",subconceptId:"SC_HYPOALBUMIN"},{id:"CL_LOW_ONCOTIC",title:"Reduced plasma oncotic pressure",topicId:"U2T2",subconceptId:"SC_BLOOD_ALBUMIN"},{id:"CL_OEDEMA",title:"Generalised oedema",topicId:"U2T29R",subconceptId:"SC_OEDEMA"}],edges:[{source:"CL_LOW_CO",target:"CL_LOW_RENAL_PERF",type:"causes"},{source:"CL_LOW_RENAL_PERF",target:"CL_RENIN",type:"causes"},{source:"CL_RENIN",target:"CL_ANGII",type:"causes"},{source:"CL_ANGII",target:"CL_ALDO",type:"causes"},{source:"CL_ALDO",target:"CL_FLUID_RET",type:"causes"},{source:"CL_PODOCYTE",target:"CL_PROTEINURIA",type:"causes"},{source:"CL_PROTEINURIA",target:"CL_HYPOALBUMIN",type:"causes"},{source:"CL_HYPOALBUMIN",target:"CL_LOW_ONCOTIC",type:"causes"},{source:"CL_LOW_ONCOTIC",target:"CL_OEDEMA",type:"causes"}]};AnimalPhysiologyApp.SimulatorRegistry={all:[{id:"SIM_CO",title:"Cardiac Output",category:"Cardiovascular",equation:"CO = HR × SV",variables:["Heart rate (beats/min)","Stroke volume (mL/beat)"],example:"72 × 70 = 5.04 L/min",interpretation:"Cardiac output is the volume pumped by one ventricle per minute.",clinical:"Low output may reduce organ perfusion.",pitfalls:["Convert mL/min to L/min.","Do not confuse stroke volume with cardiac output."],topicIds:["U2T12C"],questionIds:["U2C_MCQ_041"]},{id:"SIM_MAP",title:"Mean Arterial Pressure",category:"Cardiovascular",equation:"MAP ≈ DBP + ⅓(SBP − DBP)",variables:["Systolic pressure","Diastolic pressure"],example:"120/80 gives ≈93 mmHg",interpretation:"MAP estimates effective arterial perfusion pressure at normal heart rates.",clinical:"Persistent elevation increases cardiovascular and renal risk.",pitfalls:["Approximation is less accurate at extreme heart rates."],topicIds:["U2T13C"],questionIds:["U2C_MCQ_050"]},{id:"SIM_CLEARANCE",title:"Renal Clearance",category:"Renal",equation:"C = U × V / P",variables:["Urine concentration","Urine flow","Plasma concentration"],example:"50 × 2 / 1 = 100 mL/min",interpretation:"Clearance is the virtual plasma volume cleared per unit time.",clinical:"Marker choice determines whether GFR or renal plasma flow is estimated.",pitfalls:["Use consistent units.","Plasma concentration must be non-zero."],topicIds:["U2T28R"],questionIds:["U2R_MCQ_053"]},{id:"SIM_FILTERED_LOAD",title:"Filtered Load",category:"Renal",equation:"Filtered load = GFR × plasma concentration",variables:["GFR","Plasma concentration"],example:"125 mL/min × 1 mg/mL = 125 mg/min",interpretation:"Filtered load is the amount entering Bowman’s space per minute.",clinical:"It helps explain transport maximum and glucosuria.",pitfalls:["Use plasma concentration in compatible units."],topicIds:["U2T17R","U2T18R"],questionIds:[]},{id:"SIM_ECG",title:"Basic ECG Interpretation",category:"Cardiovascular",equation:"Electrical sequence: P → QRS → T",variables:["Wave identity","Interval meaning"],example:"QRS represents ventricular depolarisation.",interpretation:"ECG records electrical, not direct mechanical, activity.",clinical:"PR prolongation suggests delayed AV conduction.",pitfalls:["Do not equate ECG waves directly with contraction."],topicIds:["U2T11C"],questionIds:["U2C_MCQ_025"]}]};AnimalPhysiologyApp.AdvancedPhysiology=[{id:"ADV_CONTROL",title:"Homeostatic Control, Gain and Dynamic Stability",level:"Advanced undergraduate",linkedTopics:["U1T8","U2T13C","U2T23R","U4T9"],core:"Homeostasis is dynamic regulation around an operating range, not maintenance of an absolutely fixed value. A regulated variable is sensed, compared with an effective reference or physiological objective, and altered through effectors. Negative feedback reduces error; feed-forward control anticipates disturbance; positive feedback is useful only when a terminating event exists. Delay, excessive gain and interacting loops can produce oscillation rather than stability.",mechanism:["Disturbance changes a regulated variable.","Sensors transduce the change.","An integrating network estimates error and context.","Effectors change fluxes or behaviour.","Feedback modifies further controller output."],equation:"Control-system gain = correction produced ÷ residual error; closed-loop stability also depends on delay and feedback sign.",comparative:"Endotherms regulate core temperature tightly, whereas many ectotherms combine behavioural regulation with physiological tolerance. Both strategies are controlled responses, but their energy costs differ.",research:"Analyse a time-series response, not a single before/after value. Estimate latency, peak response, settling time, overshoot and steady-state error.",question:"Why can a very high-gain physiological controller become harmful?",answer:"If feedback is delayed, strong correction can overshoot the target and produce oscillation or instability, as seen in some ventilatory periodicities and endocrine rhythms."},{id:"ADV_ALLOMETRY",title:"Scaling, Allometry and Physiological Design",level:"Advanced undergraduate",linkedTopics:["U1T6","U2T12C","U3T10","U4T1"],core:"Animals are not geometrically identical machines at different sizes. Surface area, volume, transport distance and support requirements scale differently with body mass. Allometry expresses a trait as Y = aMᵇ. The exponent is an empirical biological summary, not a universal constant; it varies with trait, lineage, temperature, developmental stage and statistical method.",mechanism:["Body mass changes geometric and transport constraints.","Selection modifies organ dimensions and network architecture.","Mass-specific rates often decline with size.","Absolute flows and storage capacities usually increase.","Ecology and phylogeny modify the observed scaling relation."],equation:"Y = aMᵇ; after log transformation: log Y = log a + b log M.",comparative:"A mouse has higher mass-specific metabolic demand and heart rate than an elephant, while the elephant has much greater absolute oxygen consumption and stroke volume.",research:"A log–log plot estimates b, but species cannot always be treated as statistically independent because shared ancestry affects traits; phylogenetically informed models may be needed.",question:"Why is a ratio such as metabolic rate/body mass sometimes misleading?",answer:"Dividing by mass assumes an exponent of exactly 1. When the true exponent differs, the ratio remains systematically related to body size."},{id:"ADV_THERMAL",title:"Thermal Physiology: Exchange, Regulation and Tolerance",level:"Advanced undergraduate",linkedTopics:["U2T13C","U3T10","U4T2","U4T9"],core:"Heat balance integrates metabolic heat production with radiation, conduction, convection and evaporation. Endothermy refers to the dominant source of heat, whereas homeothermy refers to stability of body temperature; the terms are not synonyms. Thermal acclimation changes phenotype within a lifetime, while adaptation is a population-level evolutionary process.",mechanism:["Thermal receptors signal skin and core conditions.","Hypothalamic networks integrate temperature with hydration and circadian state.","Autonomic effectors alter skin blood flow, sweating, panting or non-shivering thermogenesis.","Somatic and behavioural responses modify exposure.","Cellular heat-shock and membrane responses protect function within limits."],equation:"Body heat storage = metabolic heat ± radiation ± conduction ± convection − evaporation.",comparative:"Desert mammals concentrate urine and tolerate variable peripheral temperature; birds use respiratory evaporation; reptiles regulate mainly through posture, shade and activity timing.",research:"Critical thermal limits depend on heating rate, hydration, oxygen availability and endpoint definition. Report all protocol details before comparing species.",question:"Can an ectotherm thermoregulate?",answer:"Yes. Ectotherms often regulate body temperature behaviourally and may adjust circulation, colour or evaporative loss; they rely less on sustained metabolic heat production."},{id:"ADV_OSMO",title:"Comparative Osmoregulation Across Aquatic and Terrestrial Habitats",level:"Advanced undergraduate",linkedTopics:["U2T18R","U2T20R","U2T22R","U2T27R"],core:"Water and ions move according to chemical and electrochemical gradients, so animals must balance permeability with regulated transport. Freshwater animals face water gain and salt loss; marine teleosts face water loss and salt gain; elasmobranchs retain urea and trimethylamine oxide; terrestrial animals must reduce evaporative loss while excreting nitrogen and solutes.",mechanism:["External salinity establishes passive water and ion fluxes.","Epithelia control paracellular permeability.","Ion pumps create electrochemical driving forces.","Secondary transporters and channels move specific solutes.","Kidney, gill, gut and endocrine signals coordinate whole-animal balance."],equation:"Osmotic pressure is proportional to the concentration of osmotically active particles; effective tonicity depends on membrane permeability to each solute.",comparative:"Freshwater fish produce abundant dilute urine and actively take up ions at gills; marine teleosts drink seawater and secrete excess salts through specialised ionocytes.",research:"Combine water flux, ion flux, transporter expression and hormone measurements. A change in plasma osmolality alone cannot identify the responsible organ or transporter.",question:"Why are osmolarity and tonicity not interchangeable?",answer:"Osmolarity counts all dissolved particles, whereas tonicity predicts sustained cell-volume change and therefore depends on whether solutes cross the cell membrane."},{id:"ADV_HYPOXIA",title:"Hypoxia, High Altitude and Diving Physiology",level:"Advanced undergraduate",linkedTopics:["U1T7","U1T8","U2T3","U2T12C"],core:"Oxygen delivery depends on ventilation, diffusion, haemoglobin concentration and affinity, cardiac output and regional perfusion. Hypoxaemia is low arterial oxygen; tissue hypoxia is inadequate cellular oxygen availability and may occur even with normal arterial oxygen. Acclimatisation coordinates ventilation, acid–base compensation, erythropoiesis and tissue-level changes over different timescales.",mechanism:["Reduced inspired PO2 lowers alveolar and arterial PO2.","Peripheral chemoreceptors increase ventilation.","Renal bicarbonate loss permits sustained ventilatory drive.","Erythropoietin increases red-cell production over days to weeks.","Circulatory and cellular adjustments redistribute oxygen use."],equation:"Oxygen delivery DO2 = cardiac output × arterial oxygen content; CaO2 ≈ 1.34 × Hb × SaO2 + 0.003 × PaO2.",comparative:"Diving mammals store large quantities of oxygen in blood and muscle, reduce heart rate and selectively perfuse essential organs; high-altitude birds combine effective ventilation with specialised pulmonary and haemoglobin properties.",research:"Separate oxygen partial pressure, saturation, content and delivery. Pulse oximetry estimates saturation but does not measure haemoglobin concentration or tissue perfusion.",question:"Why can a severely anaemic animal be hypoxic despite normal PaO2?",answer:"PaO2 measures dissolved oxygen tension, whereas most oxygen content is haemoglobin bound; low haemoglobin markedly reduces content and delivery."},{id:"ADV_EXERCISE",title:"Integrated Exercise Physiology and Performance Limits",level:"Advanced undergraduate",linkedTopics:["U1T6","U1T7","U2T12C","U3T10"],core:"Exercise is a whole-animal perturbation requiring anticipatory neural drive and matched responses of muscle, circulation, ventilation, metabolism, temperature control and endocrine systems. Oxygen consumption rises through increased cardiac output and arteriovenous oxygen difference. The limiting step depends on task, species, training state, environment and disease.",mechanism:["Central command and muscle afferents accelerate cardiorespiratory responses.","Motor units are recruited according to force demand.","Cardiac output and active-muscle blood flow rise.","Ventilation matches CO2 production and acid–base demand.","Recovery restores phosphocreatine, ion gradients, temperature and substrates."],equation:"Fick principle: VO2 = cardiac output × (arterial O2 content − venous O2 content).",comparative:"Migratory birds sustain extreme aerobic output; sprinting mammals depend heavily on anaerobic flux; diving animals tolerate interrupted ventilation and prioritise stored oxygen.",research:"VO2max, lactate threshold, critical power and fatigue tests measure different constructs. Protocol and motivation affect apparent performance.",question:"Does rising lactate prove that muscle has become completely anaerobic?",answer:"No. Lactate can rise while oxidative metabolism remains substantial; production, oxidation and clearance occur simultaneously."},{id:"ADV_STRESS",title:"Neuroendocrine Stress, Allostasis and Recovery",level:"Advanced undergraduate",linkedTopics:["U3T5","U4T2","U4T5","U4T9"],core:"Stress physiology reallocates resources in response to predicted or actual challenge. The sympathetic–adrenal system responds rapidly; the hypothalamic–pituitary–adrenal axis acts over minutes to hours; immune, metabolic and behavioural systems participate. Allostasis is stability achieved through change, whereas allostatic load refers to cumulative cost when activation is excessive, repeated or poorly terminated.",mechanism:["Sensory and cognitive networks evaluate threat or demand.","Autonomic output changes circulation and energy mobilisation.","CRH–ACTH signalling increases glucocorticoids.","Glucocorticoids reshape metabolism, immunity and neural processing.","Feedback and safety signals support termination and recovery."],equation:"There is no single stress index: interpretation requires a multivariable, time-resolved profile rather than one cortisol value.",comparative:"Season, social hierarchy, reproductive state and predation risk alter the adaptive meaning of glucocorticoid responses across species.",research:"Handling and sampling themselves can activate stress systems. Use rapid sampling, habituation, remote monitoring or validated non-invasive matrices where appropriate.",question:"Why is cortisol not a simple bad-stress marker?",answer:"Cortisol is an essential adaptive hormone with circadian and metabolic roles; its meaning depends on timing, context, magnitude, duration and recovery."},{id:"ADV_RHYTHMS",title:"Chronophysiology and Biological Time",level:"Advanced undergraduate",linkedTopics:["U1T8","U2T23R","U4T2","U4T9"],core:"Physiology is organised in time. Circadian clocks anticipate daily environmental cycles; ultradian oscillations support pulsatile endocrine signalling; seasonal clocks coordinate reproduction, migration and metabolism. Phase, amplitude and period are distinct variables, and internal desynchrony can occur when organs reset at different rates.",mechanism:["Molecular feedback loops generate cellular oscillation.","Light and other zeitgebers reset phase.","Central pacemakers coordinate neural and endocrine outputs.","Peripheral clocks respond to feeding, temperature and hormones.","Timed outputs alter organ sensitivity as well as hormone concentration."],equation:"A simple rhythm model is y(t) = mesor + amplitude × cos(2πt/period + phase), but biological waveforms may require richer models.",comparative:"Photoperiodic mammals use melatonin duration to signal season; tidal and lunar rhythms organise physiology in many marine animals.",research:"Random clock-time sampling can confound group comparisons. Record light cycle, feeding schedule, sleep and sampling phase.",question:"Why might the same cortisol value mean different things at 08:00 and 23:00?",answer:"Because expected concentration and physiological phase differ across the circadian cycle; interpretation requires time-specific context."},{id:"ADV_INTEGRATION",title:"Cross-System Integration: From Perturbation to Phenotype",level:"Advanced undergraduate",linkedTopics:["U2T13C","U2T25R","U3T6","U4T10"],core:"Advanced physiology asks how linked systems respond to a perturbation. Haemorrhage, exercise, heat or salt loading cannot be explained by one organ. Immediate neural responses, intermediate hormonal responses and slower renal or structural changes may initially compensate but later become maladaptive.",mechanism:["Define the primary perturbation and affected variables.","Map immediate sensor and reflex responses.","Add endocrine and local mediators.","Track organ fluxes over minutes, hours and days.","Separate compensation from correction of the initiating cause."],equation:"Mass balance: change in body store = intake or production − output or consumption. This is the backbone of fluid, ion, gas and energy analysis.",comparative:"The same mass-balance logic applies to water in a camel, oxygen in a diving seal and nitrogen in a uricotelic bird, although organs and molecular strategies differ.",research:"Build causal diagrams before selecting measurements. A downstream biomarker may correlate with severity without identifying the primary mechanism.",question:"Why can physiological compensation become pathological?",answer:"A response useful in the short term—such as vasoconstriction or fluid retention—can impose chronic pressure, volume or metabolic costs if the initiating disturbance persists."},{id:"ADV_METHODS",title:"Experimental Physiology, Quantification and Causal Inference",level:"Advanced undergraduate",linkedTopics:["U2T11C","U2T28R","U3T5","U4T10"],core:"Physiological knowledge depends on measurement validity. A signal must be calibrated, sampled at an adequate rate and interpreted with its units, noise, biological variability and instrument response. Correlation, temporal sequence and intervention provide progressively stronger causal evidence, but confounding and measurement artefacts remain possible.",mechanism:["State a mechanistic hypothesis.","Operationally define variables and controls.","Choose temporal and spatial resolution appropriate to the process.","Calibrate and acquire raw data without selective exclusion.","Analyse uncertainty, effect size and plausible alternative explanations."],equation:"Signal-to-noise ratio, coefficient of variation and confidence intervals describe different properties; statistical significance does not measure physiological importance.",comparative:"Non-invasive telemetry supports natural behaviour, while isolated preparations permit tighter control; the most informative design often triangulates across levels.",research:"Predefine exclusion rules, show individual observations, retain raw traces and distinguish technical replicates from independent biological replicates.",question:"Why is a larger sample not a cure for systematic measurement bias?",answer:"More observations reduce random uncertainty but do not correct a device or protocol that consistently measures the wrong value."}];AnimalPhysiologyApp.ConceptRegistry=function(Data){const byId={},errors=[];(Data.concepts||[]).forEach(c=>{if(byId[c.id])errors.push("Duplicate concept "+c.id);byId[c.id]=c});(Data.questions||[]).forEach(q=>{const c=byId[q.conceptId];if(!c)errors.push("Unresolved concept "+q.conceptId+" for "+q.id);else if(c.topicId!==q.topic||c.unitId!==q.unit)errors.push("Concept ownership mismatch for "+q.id)});return{byId:byId,all:Object.values(byId),errors:errors}}(AnimalPhysiologyApp.Data);AnimalPhysiologyApp.Ontology=AnimalPhysiologyApp.OntologyBuilder.build(AnimalPhysiologyApp.Data,AnimalPhysiologyApp.LessonEnhancements||{},AnimalPhysiologyApp.DiagramRegistry||{},AnimalPhysiologyApp.MediaRegistry||{});AnimalPhysiologyApp.KnowledgeGraph=function(O,D){const ontologyNodes=new Map([...O.units||[],...O.topics||[]].map(n=>[n.id,n]));const nodes=[];(D.units||[]).forEach(u=>{nodes.push({...ontologyNodes.get(u.id),id:u.id,title:u.title,type:"unit",unitId:u.id,topicIds:u.topics.map(t=>t[0])});u.topics.f es or edges.</p></section>`}function directEvidenceSummary(){const scores=state.assessmentEvidence||{},byType={};Object.entries(scores).forEach(([id,v])=>{const task=AnimalPhysiologyApp.AssessmentFramework.tasks.find(x=>x.id===id);if(!task)return;(byType[task.type]||(byType[task.type]=[])).push(v.percent)});return Object.fromEntries(Object.entries(AnimalPhysiologyApp.AssessmentFramework.types).map(([type,meta])=>[type,{label:meta.label,count:(byType[type]||[]).length,score:(byType[type]||[]).length?Math.round((byType[type]||[]).reduce((a,b)=>a+b,0)/(byType[type]||[]).length):null}]))}function renderAssessmentCentre(){const groups=Object.keys(AnimalPhysiologyApp.AssessmentFramework.types);main.innerHTML=`<h1>University-Style Assessment Centre</h1><p>These tasks directly measure diagram, short-note, long-answer, practical, viva and clinical-reasoning performance. Self-scoring uses explicit rubrics and is stored locally.</p>${groups.map(type=>{const meta=AnimalPhysiologyApp.AssessmentFramework.types[type],tasks=AnimalPhysiologyApp.AssessmentFramework.tasks.filter(t=>t.type===type);return`<section><h2>${esc(meta.label)}</h2><div class="grid">${tasks.map(t=>{const saved=state.assessmentEvidence[t.id];return`<article class="card"><span class="badge">${t.marks} marks · ${esc(t.topicId)}</span><h3>${esc(t.prompt)}</h3><ol>${t.rubric.map(r=>`<li>${esc(r)}</li>`).join("")}</ol><label>Rubric points achieved (0–${t.rubric.length})<input type="number" min="0" max="${t.rubric.length}" value="${saved?saved.points:""}" data-assessment-score="${t.id}"></label><p id="score_${t.id}" aria-live="polite">${saved?`Recorded: ${saved.percent}%`:"Not yet assessed."}</p><button type="button" class="btn secondary" data-page="lesson" data-arg="${t.topicId}">Open linked lesson</button></article>`}).join("")}</div></section>`}).join("")}`}function renderSimulators(){main.innerHTML=`<h1>Unified Simulator Framework</h1><p>Every simulator uses the same theory → equation → variables → worked example essed.</p><div class="grid"><section class="card"><h2>MCQ-derived readiness</h2><div class="timer">${avg}%</div><p>Based on quiz evidence, confidence, prerequisites and retention.</p></section><section class="card"><h2>Total MCQ attempts</h2><div class="timer">${rows.reduce((s,r)=>s+r.a,0)}</div></section><section class="card"><h2>Revision due</h2><div class="timer">${AnimalPhysiologyApp.Intelligence.dueTopics().length}</div></section></div><h2>Direct assessment evidence</h2><div class="grid">${Object.values(evidence).map(e=>`<section class="card"><h3>${esc(e.label)}</h3><div class="timer">${e.score===null?"—":e.score+"%"}</div><p>${e.count?`${e.count} completed task${e.count===1?"":"s"}.`:"Insufficient evidence — complete a rubric task."}</p></section>`).join("")}</div><div style="overflow:auto"><table class="compare"><caption>Topic-level MCQ-derived diagnostic indicators</caption><thead><tr><th>Topic</th><th>Attempts</th><th>Mastery</th><th>Weakness</th><th>Readiness</th><th>Calibration</th><th>Root review</th></tr></thead><tbody>${rows.map(r=>`<tr><td><button type="button" class="btn secondary" data-page="lesson" data-arg="${r.id}">${esc(r.title)}</button></td><td>${r.a}</td><td>${r.m}%</td><td>${r.w}%</td><td>${r.ready}%</td><td>${esc(r.cal.label)}</td><td>${esc(r.root)}</td></tr>`).join("")}</tbody></table></div>`}function renderRevision(){const due=AnimalPhysiologyApp.Intelligence.dueTopics();main.innerHTML=`<h1>Adaptive Revision Queue</h1><p>Priority combines accuracy, confidence, difficulty, recency, misconceptions and prerequisite mastery.</p>${due.length?`<div class="grid">${due.map(x=>{const t=topic(x.id),r=topic(AnimalPhysiologyApp.Intelligence.rootCause(x.id));return`<article class="card"><span class="badge">Priority ${x.weakness}</span><h2>${esc(t?t[1]:x.id)}</h2><p>Mastery ${x.mastery}% · Weakness ${x.weakness}%</p><p><strong>Start with:</strong> ${esc(r?r[1]:x.id)}</p><button type="button" class="btn" data-page="quiz" data-arg="${x.id}">Review questi
