n:"Pre-existing antibodies can cause rapid haemolysis.",strongestDistractorAnalysis:"‘Delayed erythropoiesis only’ is the strongest distractor: because it at least involves red cells, it seems more plausible than the other options, but it describes a slow production-rate problem. Incompatible ABO transfusion instead triggers an acute, complement-mediated intravascular haemolysis as pre-existing recipient antibodies attack the transfused donor cells within minutes — an immediate destructive event, not a delayed production deficit.",conceptId:"C_U2T5B_037"},{id:"U2B_MCQ_038",unit:"U2",topic:"U2T5B",concept:"C_U2T5B_038",type:"MCQ",stem:"Cross-matching principally tests:",options:["Plasma albumin synthesis","Compatibility between donor cells and recipient plasma","Kidney filtration","Platelet lifespan"],answer:1,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T5B_REGULATION_ERROR",explanation:"Cross-match detects clinically important incompatibility.",strongestDistractorAnalysis:"‘Platelet lifespan’ is the strongest distractor: students sometimes assume any pre-transfusion laboratory test broadly screens ‘compatibility’ of all blood components. Cross-matching is specifically a serological test confirming that donor erythrocytes will not be attacked by antibodies present in the recipient's plasma; it does not assess platelet function or survival.",conceptId:"C_U2T5B_038"},{id:"U2B_MCQ_039",unit:"U2",topic:"U2T5B",concept:"C_U2T5B_039",type:"MCQ",stem:"The Bombay phenotype lacks:",options:["All immunoglobulins","Fibrinogen","H antigen","D antigen only"],answer:2,difficulty:"high",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T5B_STRUCTURE_FUNCTION_CONFUSION",explanation:"Without H antigen, A and B determinants cannot be expressed.",strongestDistractorAnalysis:"‘D antigen only’ is the strongest distractor: because D antigen has been the focus of several preceding Rh-system questions in this topic, students carry that association forward and misapply it to the Bombay phenotype, which is an ABO-system anomaly. Bombay phenotype individuals lack the H antigen, the precursor structure required to build both A and B antigens, and is entirely unrelated to Rh D status.",conceptId:"C_U2T5B_039"},{id:"U2B_MCQ_040",unit:"U2",topic:"U2T5B",concept:"C_U2T5B_040",type:"MCQ",stem:"Haemolytic disease of the fetus and newborn is classically associated with:",options:["Maternal albumin","Fetal anti-A IgM crossing placenta","Platelet-derived serotonin","Maternal anti-D IgG"],answer:3,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T5B_REGULATION_ERROR",explanation:"Maternal IgG anti-D can cross the placenta.",strongestDistractorAnalysis:"‘Fetal anti-A IgM crossing placenta’ is the strongest distractor: it combines two genuine but misapplied facts — ABO natural antibodies are indeed largely IgM, but IgM's large pentameric structure prevents placental crossing, and critically the direction is reversed (maternal antibody affects the fetus, not the reverse). Classic hemolytic disease of the fetus and newborn results from maternal anti-D IgG, the only immunoglobulin class actively transported across the placenta via the neonatal Fc receptor.",conceptId:"C_U2T5B_040"},{id:"U2B_MCQ_041",unit:"U2",topic:"U2T6B",concept:"C_U2T6B_041",type:"MCQ",stem:"Primary haemostasis mainly produces the:",options:["Platelet plug","Stable cross-linked fibrin clot alone","Erythrocyte mass","Plasma oncotic gradient"],answer:0,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T6B_STRUCTURE_FUNCTION_CONFUSION",explanation:"Primary haemostasis forms a platelet plug.",strongestDistractorAnalysis:"‘Stable cross-linked fibrin clot alone’ is the strongest distractor: students often blur primary and secondary haemostasis into a single undifferentiated ‘clotting’ process and default to the more memorable end-result (the stable fibrin clot). Primary haemostasis specifically refers to the rapid platelet plug formed by adhesion and aggregation at the injury site; stabilisation by cross-linked fibrin is the product of the separate, slower coagulation cascade (secondary haemostasis).",conceptId:"C_U2T6B_041"},{id:"U2B_MCQ_042",unit:"U2",topic:"U2T6B",concept:"C_U2T6B_042",type:"MCQ",stem:"Platelet adhesion at vascular injury depends strongly on:",options:["Transferrin","von Willebrand factor","Albumin","Erythropoietin"],answer:1,difficulty:"high",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T6B_REGULATION_ERROR",explanation:"vWF bridges platelets to exposed subendothelium.",strongestDistractorAnalysis:"Transferrin is the strongest distractor: it is, like von Willebrand factor, a circulating plasma glycoprotein with a specific binding/transport role, so students pattern-match on ‘named plasma glycoprotein’ without checking function. Transferrin transports iron and has no role in platelet adhesion; vWF specifically bridges platelet surface receptors to exposed subendothelial collagen at a site of vascular injury.",conceptId:"C_U2T6B_042"},{id:"U2B_MCQ_043",unit:"U2",topic:"U2T6B",concept:"C_U2T6B_043",type:"MCQ",stem:"The extrinsic pathway is initiated by exposure of:",options:["Haemoglobin","Plasmin","Tissue factor","Albumin"],answer:2,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T6B_STRUCTURE_FUNCTION_CONFUSION",explanation:"Tissue factor initiates the extrinsic pathway.",strongestDistractorAnalysis:"Plasmin is the strongest distractor: it belongs to the same coagulation-cascade vocabulary as this topic, so students select it without distinguishing pathway initiation from pathway breakdown. Tissue factor, exposed by damaged endothelium or subendothelial tissue, is what initiates the extrinsic pathway; plasmin acts at the opposite end of haemostasis, degrading fibrin during fibrinolysis once the clot has served its purpose.",conceptId:"C_U2T6B_043"},{id:"U2B_MCQ_044",unit:"U2",topic:"U2T6B",concept:"C_U2T6B_044",type:"MCQ",stem:"Thrombin converts:",options:["Plasminogen to albumin","Factor XIII to vitamin K","Platelets to erythrocytes","Fibrinogen to fibrin"],answer:3,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T6B_REGULATION_ERROR",explanation:"Thrombin cleaves fibrinogen.",strongestDistractorAnalysis:"‘Factor XIII to vitamin K’ is the strongest distractor: Factor XIII is a genuine coagulation factor discussed elsewhere in this topic, giving the option surface plausibility, but the stated conversion is physiologically meaningless — Factor XIII is an enzyme (transglutaminase) that cross-links fibrin, not a substrate converted into a vitamin. Thrombin's actual role is cleaving fibrinopeptides from fibrinogen to generate fibrin monomers.",conceptId:"C_U2T6B_044"},{id:"U2B_MCQ_045",unit:"U2",topic:"U2T6B",concept:"C_U2T6B_045",type:"MCQ",stem:"Factor XIII chiefly:",options:["Cross-links fibrin","Activates erythropoietin","Carries oxygen","Forms antibodies"],answer:0,difficulty:"high",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T6B_STRUCTURE_FUNCTION_CONFUSION",explanation:"Activated factor XIII stabilises fibrin.",strongestDistractorAnalysis:"‘Activates erythropoietin’ is the strongest distractor: it names a genuine hormone covered earlier in this unit (haemopoiesis), so students conflate coagulation factors with erythropoietic regulators purely because both are discussed under ‘Blood’. Factor XIII (fibrin-stabilising factor) is a transglutaminase enzyme that cross-links fibrin strands to stabilise the clot; it has no hormonal or erythropoietic role.",conceptId:"C_U2T6B_045"},{id:"U2B_MCQ_046",unit:"U2",topic:"U2T6B",concept:"C_U2T6B_046",type:"MCQ",stem:"The principal fibrinolytic enzyme is:",options:["Trypsin","Plasmin","Thrombin","Pepsin"],answer:1,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T6B_REGULATION_ERROR",explanation:"Plasmin digests fibrin.",strongestDistractorAnalysis:"Thrombin is the strongest distractor: it is the enzyme most closely associated with this topic's clotting cascade, so students confuse the pro-coagulant enzyme that generates fibrin (thrombin) with the enzyme that later degrades it (plasmin) — the same formation-versus-breakdown confusion tested elsewhere in this bank. Plasmin, not thrombin, is the principal fibrinolytic enzyme.",conceptId:"C_U2T6B_046"},{id:"U2B_MCQ_047",unit:"U2",topic:"U2T6B",concept:"C_U2T6B_047",type:"MCQ",stem:"PT/INR is especially sensitive to the:",options:["Fibrinolytic pathway only","Erythropoietic pathway","Extrinsic and common pathways","Platelet count only"],answer:2,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T6B_STRUCTURE_FUNCTION_CONFUSION",explanation:"PT evaluates tissue-factor and common pathway activity.",strongestDistractorAnalysis:"‘Platelet count only’ is the strongest distractor: students sometimes generalise ‘clotting test’ to mean any measure related to haemostasis, including platelet number. PT/INR specifically evaluates coagulation-factor activity in the extrinsic pathway (factor VII) and the shared common pathway (factors X, V, II, fibrinogen); it does not assess platelet count or function, which require a separate platelet count or bleeding-time/function assay.",conceptId:"C_U2T6B_047"},{id:"U2B_MCQ_048",unit:"U2",topic:"U2T6B",concept:"C_U2T6B_048",type:"MCQ",stem:"Haemophilia A results from deficiency of:",options:["Factor I","von Willebrand factor in every case","Albumin","Factor VIII"],answer:3,difficulty:"high",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T6B_REGULATION_ERROR",explanation:"Haemophilia A is factor VIII deficiency.",strongestDistractorAnalysis:"‘Von Willebrand factor in every case’ is the strongest distractor: because Factor VIII circulates in plasma bound to and stabilised by vWF, and because von Willebrand disease and haemophilia A produce overlapping bleeding symptoms, students conflate the two distinct disorders. Haemophilia A is specifically an X-linked genetic deficiency of Factor VIII itself; it is not caused by vWF deficiency, though severe vWF deficiency can secondarily lower Factor VIII levels in the separate condition of von Willebrand disease.",conceptId:"C_U2T6B_048"},{id:"U2B_ADV_01",unit:"U2",topic:"U2T1",concept:"C_U2T1_ADV01",type:"Assertion–Reason",stem:"Assertion: Blood is a connective tissue. Reason: Its cells are suspended in an extracellular matrix called plasma.",options:["Both are true, and the reason correctly explains the assertion","Both are true, but the reason does not explain the assertion","Assertion true, reason false","Assertion false, reason true"],answer:0,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T1_CLINICAL_APPLICATION_ERROR",explanation:"The Assertion is true and the Reason is also true. The Reason supplies the physiological mechanism that directly accounts for the Assertion. Assertion evaluated: “Blood is a connective tissue.” Reason evaluated: “Its cells are suspended in an extracellular matrix called plasma.” Blood is a specialised connective tissue composed of plasma and formed elements. Plasma accounts for roughly 55% of blood volume and contains water, electrolytes, nutrients, metabolic wastes, hormones and proteins. Formed elements include erythrocytes, leucocytes and platelets. Blood transports respiratory gases, nutrients, hormones and wastes; distributes heat; buffers hydrogen-ion concentration; maintains fluid balance; and protects the body through immune and haemostatic mechanisms. Haematocrit represents the fraction of blood occupied by erythrocytes, whereas plasma volume and cell mass vary with hydration, altitude, age and physiological state. In an Assertion–Reason answer, evaluate the truth of each statement before deciding whether a causal explanation exists.",strongestDistractorAnalysis:"“Both are true, but the reason does not explain the assertion” is the strongest distractor: it correctly recognises that plasma is an extracellular matrix, but wrongly implies this fact is incidental to blood’s classification. Students choose it when they treat ‘connective tissue’ as defined mainly by cell type rather than by the defining criterion — cells embedded in an extracellular matrix — which plasma satisfies directly and is precisely why the Reason does explain the Assertion.",conceptId:"C_U2T1_ADV01"},{id:"U2B_ADV_02",unit:"U2",topic:"U2T2",concept:"C_U2T2_ADV02",type:"Assertion–Reason",stem:"Assertion: Severe hypoalbuminaemia can cause oedema. Reason: Albumin contributes substantially to plasma colloid osmotic pressure.",options:["Assertion false, reason true","Both are true, and the reason correctly explains the assertion","Both are true, but the reason does not explain the assertion","Assertion true, reason false"],answer:1,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T2_CLINICAL_APPLICATION_ERROR",explanation:"The Assertion is true and the Reason is also true. The Reason supplies the physiological mechanism that directly accounts for the Assertion. Assertion evaluated: “Severe hypoalbuminaemia can cause oedema.” Reason evaluated: “Albumin contributes substantially to plasma colloid osmotic pressure.” The principal plasma proteins are albumin, globulins and fibrinogen. Albumin, synthesised by the liver, is the most abundant and contributes strongly to plasma colloid osmotic pressure; it also transports fatty acids, bilirubin, hormones, calcium and drugs. Alpha and beta globulins include transport proteins, complement and clotting-related proteins, while gamma globulins are immunoglobulins produced by plasma cells. Fibrinogen is a soluble precursor converted to fibrin during coagulation. Protein concentration is influenced by synthesis, distribution, catabolism and loss through kidney, intestine, skin or haemorrhage. In an Assertion–Reason answer, evaluate the truth of each statement before deciding whether a causal explanation exists.",strongestDistractorAnalysis:"‘Both are true, but the reason does not explain the assertion’ is the strongest distractor: in Assertion–Reason items, students trained to be cautious about causal claims often default to this option whenever they are unsure the link is direct, even when it demonstrably is. Here the causal chain is direct: albumin's high molar plasma concentration is precisely what generates most of the colloid osmotic pressure that opposes capillary filtration, so its loss directly explains why fluid escapes into the interstitium as oedema.",conceptId:"C_U2T2_ADV02"},{id:"U2B_ADV_03",unit:"U2",topic:"U2T3",concept:"C_U2T3_ADV03",type:"Assertion–Reason",stem:"Assertion: Platelets are complete nucleated cells. Reason: They originate from megakaryocytes.",options:["Both are true, and the reason explains the assertion","Both are true, but unrelated","Assertion false, reason true","Assertion true, reason false"],answer:2,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T3_CLINICAL_APPLICATION_ERROR",explanation:"The Assertion is false, whereas the Reason is true; the true statement does not rescue the incorrect Assertion. Assertion evaluated: “Platelets are complete nucleated cells.” Reason evaluated: “They originate from megakaryocytes.” Erythrocytes are anucleate biconcave cells specialised for respiratory-gas transport through haemoglobin. Leucocytes include neutrophils, eosinophils, basophils, lymphocytes and monocytes, each with distinct immune functions. Platelets are cytoplasmic fragments derived from megakaryocytes and participate in primary haemostasis, coagulation support and vascular repair. A differential leucocyte count describes the relative proportions of white-cell types. Morphology, number and function must be interpreted together because a normal count does not always imply normal cellular function. In an Assertion–Reason answer, evaluate the truth of each statement before deciding whether a causal explanation exists.",strongestDistractorAnalysis:"‘Both are true, and the reason explains the assertion’ is the strongest distractor: platelets are colloquially called ‘blood cells’, so students assume this means they are complete nucleated cells like erythrocytes' precursors or leucocytes, and separately know they arise from megakaryocytes, wrongly concluding both statements are true and causally linked. In fact platelets are anucleate cytoplasmic fragments shed from megakaryocyte cytoplasm — they never possessed a nucleus of their own — making the Assertion false while the Reason (megakaryocyte origin) remains true.",conceptId:"C_U2T3_ADV03"},{id:"U2B_ADV_04",unit:"U2",topic:"U2T4B",concept:"C_U2T4B_ADV04",type:"Assertion–Reason",stem:"Assertion: Chronic hypoxia can increase erythrocyte production. Reason: Hypoxia stimulates renal erythropoietin release.",options:["Both are true, but unrelated","Assertion true, reason false","Assertion false, reason true","Both are true, and the reason correctly explains the assertion"],answer:3,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T4B_CLINICAL_APPLICATION_ERROR",explanation:"The Assertion is true and the Reason is also true. The Reason supplies the physiological mechanism that directly accounts for the Assertion. Assertion evaluated: “Chronic hypoxia can increase erythrocyte production.” Reason evaluated: “Hypoxia stimulates renal erythropoietin release.” Haemopoiesis is the continuous production of blood cells from self-renewing haematopoietic stem cells. In adults it occurs mainly in red bone marrow. Stem cells generate myeloid and lymphoid progenitors that differentiate under the influence of cytokines and colony-stimulating factors. Erythropoietin from the kidney promotes erythroid survival and maturation; thrombopoietin supports megakaryocyte and platelet production; and colony-stimulating factors regulate granulocyte and monocyte lineages. Effective haemopoiesis requires iron, vitamin B12, folate, amino acids and a functional marrow microenvironment. In an Assertion–Reason answer, evaluate the truth of each statement before deciding whether a causal explanation exists.",strongestDistractorAnalysis:"‘Both are true, but unrelated’ is the strongest distractor: students who correctly verify both statements as individually true sometimes hesitate to commit to a causal link out of examination caution, even when the link is explicit. Here the causal chain is direct: hypoxia stimulates renal interstitial cells to release erythropoietin, and it is precisely this erythropoietin release that drives the increased erythrocyte production described in the Assertion.",conceptId:"C_U2T4B_ADV04"},{id:"U2B_ADV_05",unit:"U2",topic:"U2T5B",concept:"C_U2T5B_ADV05",type:"Assertion–Reason",stem:"Assertion: Anti-D is naturally present in all Rh-negative individuals. Reason: Rh antibodies generally arise after exposure.",options:["Assertion false, reason true","Both are false","Both are true","Assertion true, reason false"],answer:0,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T5B_CLINICAL_APPLICATION_ERROR",explanation:"The Assertion is false, whereas the Reason is true; the true statement does not rescue the incorrect Assertion. Assertion evaluated: “Anti-D is naturally present in all Rh-negative individuals.” Reason evaluated: “Rh antibodies generally arise after exposure.” The ABO system is determined by A and B carbohydrate antigens on erythrocytes and naturally occurring plasma antibodies against absent antigens. Incompatible transfusion can cause rapid agglutination and intravascular haemolysis. The Rh system includes several antigens, of which D is the most clinically important. Anti-D is not naturally present but can develop after exposure through transfusion or pregnancy. Compatibility testing includes ABO and Rh typing, antibody screening and cross-matching. The Bombay phenotype lacks the H antigen needed to express A or B antigens and requires specially compatible blood. In an Assertion–Reason answer, evaluate the truth of each statement before deciding whether a causal explanation exists.",strongestDistractorAnalysis:"‘Both are true’ is the strongest distractor: because anti-D is clinically emphasised as an important antibody, students assume its presence is an inherent trait of being Rh-negative, similar to how anti-A/anti-B are naturally present in the ABO system. In fact anti-D is not present at birth or by default — it is acquired only after prior sensitising exposure to Rh-positive erythrocytes, making the Assertion false while the Reason (that Rh antibodies generally arise after exposure) remains true.",conceptId:"C_U2T5B_ADV05"},{id:"U2B_ADV_06",unit:"U2",topic:"U2T6B",concept:"C_U2T6B_ADV06",type:"Assertion–Reason",stem:"Assertion: Fibrinolysis is required after tissue repair. Reason: Plasmin degrades fibrin.",options:["Assertion false, reason true","Both are true, and the reason correctly explains the assertion","Both are true, but unrelated","Assertion true, reason false"],answer:1,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T6B_CLINICAL_APPLICATION_ERROR",explanation:"The Assertion is true and the Reason is also true. The Reason supplies the physiological mechanism that directly accounts for the Assertion. Assertion evaluated: “Fibrinolysis is required after tissue repair.” Reason evaluated: “Plasmin degrades fibrin.” Haemostasis limits blood loss while maintaining fluid blood elsewhere. Vascular constriction is followed by primary haemostasis, in which platelets adhere through von Willebrand factor, activate and aggregate. Secondary haemostasis generates thrombin and fibrin through tissue-factor and contact-related pathways that converge on factor X activation. Thrombin converts fibrinogen to fibrin and activates factor XIII, which stabilises the clot. Antithrombin, protein C, protein S and tissue-factor pathway inhibitor limit coagulation, while plasmin removes fibrin during fibrinolysis. In an Assertion–Reason answer, evaluate the truth of each statement before deciding whether a causal explanation exists.",strongestDistractorAnalysis:"‘Both are true, but unrelated’ is the strongest distractor: students correctly judge both statements true but hesitate to commit to a causal link out of examination caution. The link here is direct and necessary: plasmin's proteolytic degradation of fibrin is precisely the mechanism that removes a clot once tissue repair is complete, which is why fibrinolysis is required after repair — the Reason directly explains the Assertion.",conceptId:"C_U2T6B_ADV06"},{id:"U2B_ADV_07",unit:"U2",topic:"U2T1",concept:"C_U2T1_ADV07",type:"Case-based",stem:"A dehydrated student has a raised haematocrit but unchanged red-cell mass. What best explains the result?",options:["Increased platelet production","Haemolysis","Reduced plasma volume","Acute erythropoiesis"],answer:2,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T1_CLINICAL_APPLICATION_ERROR",explanation:"Reduced plasma volume best explains the scenario: dehydration removes water from the extracellular compartment, concentrating an unchanged number of erythrocytes within a smaller plasma volume and raising haematocrit. The stem explicitly states red-cell mass is unchanged, which rules out any option invoking new red-cell production or destruction.",strongestDistractorAnalysis:"“Acute erythropoiesis” is the strongest distractor: students associate a raised haematocrit with ‘more red cells made’, but erythropoiesis takes days to raise cell numbers and is explicitly excluded by the stem's statement that red-cell mass is unchanged — the question also tests careful reading of the given data.",conceptId:"C_U2T1_ADV07"},{id:"U2B_ADV_08",unit:"U2",topic:"U2T2",concept:"C_U2T2_ADV08",type:"Case-based",stem:"A patient with severe liver disease develops oedema and low serum albumin. Which Starling-force change is most direct?",options:["Increased erythrocyte osmotic pressure","Reduced arterial oxygen pressure","Increased platelet adhesion","Reduced plasma oncotic pressure"],answer:3,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T2_CLINICAL_APPLICATION_ERROR",explanation:"In hepatic failure, reduced hepatocyte synthetic capacity lowers plasma albumin, the principal determinant of plasma colloid oncotic pressure. This directly reduces the osmotic force that normally opposes capillary hydrostatic pressure and draws filtered fluid back into the vasculature, so fluid accumulates in the interstitium as oedema — a direct Starling-force change, unlike the distractors, which involve compartments (erythrocytes, platelets) or variables (arterial oxygen tension) outside the Starling equation.",strongestDistractorAnalysis:"‘Increased erythrocyte osmotic pressure’ is the strongest distractor: it contains the word ‘osmotic’ and references a blood component, inviting pattern-matching to the correct answer. However, erythrocyte intracellular osmotic pressure plays no part in the Starling equation, which concerns plasma colloid oncotic pressure and interstitial fluid pressures across the capillary wall — the mechanism actually disturbed by hepatic hypoalbuminaemia.",conceptId:"C_U2T2_ADV08"},{id:"U2B_ADV_09",unit:"U2",topic:"U2T3",concept:"C_U2T3_ADV09",type:"Case-based",stem:"A blood smear shows marked neutrophilia during an acute bacterial infection. Which function is most relevant?",options:["Rapid phagocytic defence","Antibody secretion","Oxygen carriage","Fibrin formation"],answer:0,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T3_CLINICAL_APPLICATION_ERROR",explanation:"Rapid phagocytic defence is the best answer: neutrophils are the first innate-immune cells recruited to a site of acute bacterial infection, migrating within hours via chemotaxis to phagocytose and destroy invading bacteria. This rapid, non-specific response precedes and does not require antibody involvement, which depends on a slower adaptive response from plasma cells; neutrophils also do not carry oxygen or form fibrin, functions specific to erythrocytes and the coagulation cascade respectively.",strongestDistractorAnalysis:"‘Antibody secretion’ is the strongest distractor: students associate ‘infection’ broadly with antibody-mediated immunity, overlooking the timescale mismatch — antibody production by plasma cells is an adaptive response that takes days, whereas neutrophilia reflects the innate system's rapid phagocytic mobilisation within hours of an acute bacterial insult, which is what is being directly tested in this scenario.",conceptId:"C_U2T3_ADV09"},{id:"U2B_ADV_10",unit:"U2",topic:"U2T4B",concept:"C_U2T4B_ADV10",type:"HOTS",stem:"A patient with chronic kidney disease develops normocytic anaemia. Which physiological link is most important?",options:["Excess albumin synthesis","Reduced erythropoietin production","Excess intrinsic factor","Increased thrombopoietin"],answer:1,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T4B_CLINICAL_APPLICATION_ERROR",explanation:"Reduced erythropoietin production is the best answer: the kidneys are the principal source of erythropoietin, and progressive nephron loss in chronic kidney disease reduces the renal interstitial tissue mass available to synthesise it. Because red-cell precursors receive a weaker erythropoietic stimulus while iron, B12 and folate supply remain otherwise normal, the resulting anaemia is normocytic and normochromic — distinguishing it from the macrocytic anaemia caused by B12/intrinsic-factor deficiency.",strongestDistractorAnalysis:"‘Excess intrinsic factor’ is the strongest distractor: it invokes a genuine cause of anaemia (intrinsic-factor deficiency impairs B12 absorption, producing macrocytic anaemia), but the stem specifies normocytic anaemia, which rules out the B12/folate-deficiency mechanism entirely. In chronic kidney disease, failing renal tissue cannot produce adequate erythropoietin, and reduced erythropoietin stimulation — not a vitamin-absorption defect — is what produces the normocytic picture.",conceptId:"C_U2T4B_ADV10"},{id:"U2B_ADV_11",unit:"U2",topic:"U2T5B",concept:"C_U2T5B_ADV11",type:"Case-based",stem:"An Rh-negative mother previously sensitised to D antigen carries an Rh-positive fetus. Which antibody class can cross the placenta?",options:["IgA anti-D","IgE anti-D","IgG anti-D","IgM anti-D"],answer:2,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T5B_CLINICAL_APPLICATION_ERROR",explanation:"IgG anti-D is the best answer: after an initial sensitising exposure to D antigen, a subsequent exposure — such as a further Rh-positive pregnancy — triggers a rapid anamnestic response dominated by class-switched IgG antibody. Unlike the pentameric IgM produced in a primary response, IgG is a smaller monomeric immunoglobulin actively transported across the placenta via the neonatal Fc receptor, allowing it to bind fetal Rh-positive erythrocytes and cause haemolytic disease of the fetus and newborn.",strongestDistractorAnalysis:"IgM anti-D is the strongest distractor: the stem states the mother was ‘previously sensitised’, and a first exposure to D antigen classically produces an initial IgM response, so students who recall this primary-response detail select IgM. However, on re-exposure (as in a subsequent Rh-positive pregnancy) the anamnestic response is dominated by class-switched IgG, and IgM's large pentameric structure in any case prevents it from crossing the placenta — only IgG is actively transported across via the neonatal Fc receptor.",conceptId:"C_U2T5B_ADV11"},{id:"U2B_ADV_12",unit:"U2",topic:"U2T6B",concept:"C_U2T6B_ADV12",type:"HOTS",stem:"A patient has prolonged aPTT with normal PT and normal platelet count. Which defect is most consistent?",options:["Severe thrombocytopenia","Isolated factor VII deficiency","Excess erythropoietin","Intrinsic-pathway factor deficiency"],answer:3,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T6B_CLINICAL_APPLICATION_ERROR",explanation:"Intrinsic-pathway factor deficiency is the best answer: aPTT specifically screens the intrinsic pathway (factors XII, XI, IX, VIII) together with the common pathway, while PT screens the extrinsic pathway (factor VII) together with the same common pathway. A prolonged aPTT with a normal PT localises the defect to a factor unique to the intrinsic arm — consistent with, for example, haemophilia A (factor VIII) or haemophilia B (factor IX) — since any common-pathway or extrinsic-pathway defect would also prolong the PT, and the normal platelet count rules out a primary platelet disorder.",strongestDistractorAnalysis:"‘Isolated factor VII deficiency’ is the strongest distractor: factor VII is a genuine coagulation factor, so students who have not precisely mapped each factor to its test pathway select it without checking consistency against the given data. Factor VII specifically drives the extrinsic pathway measured by PT; an isolated factor VII deficiency would prolong PT, which the stem explicitly states is normal — ruling this option out and pointing instead to a factor confined to the intrinsic pathway (VIII, IX, XI or XII), which PT does not detect but aPTT does.",conceptId:"C_U2T6B_ADV12"},{id:"U2C_MCQ_001",unit:"U2",topic:"U2T7C",concept:"C_U2T7C_001",type:"MCQ",stem:"Which chamber has the thickest wall?",options:["Left ventricle","Right ventricle","Right atrium","Left atrium"],answer:0,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T7C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Left ventricle” is correct: it must generate enough pressure to overcome systemic vascular resistance (mean arterial pressure ~93 mmHg) and drive blood through the entire systemic circulation, whereas the right ventricle only overcomes the much lower pulmonary vascular resistance. By Laplace's law, sustaining greater wall tension against this higher afterload requires a thicker myocardial wall.",strongestDistractorAnalysis:"Right ventricle is the strongest distractor: both ventricles eject an equal stroke volume, so students assume equal workload and equal wall thickness, overlooking that afterload — not stroke volume — is what determines wall tension and hence wall thickness; the LV faces roughly six times the resistance the RV does.",conceptId:"C_U2T7C_001"},{id:"U2C_MCQ_002",unit:"U2",topic:"U2T7C",concept:"C_U2T7C_002",type:"MCQ",stem:"Mitral valve lies between?",options:["Right ventricle and pulmonary trunk","Left atrium and left ventricle","Right atrium and right ventricle","Left ventricle and aorta"],answer:1,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T7C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Left atrium and left ventricle” is correct: the mitral (bicuspid) valve is the left-sided atrioventricular valve, opening during diastole to allow flow from the left atrium into the left ventricle and closing during systole to prevent backflow.",strongestDistractorAnalysis:"‘Right atrium and right ventricle’ is the strongest distractor: it names the tricuspid valve, the mitral valve's structural and functional counterpart on the right side. Both are atrioventricular valves with parallel roles, so students confuse the two mirrored valves rather than confusing an AV valve with an unrelated semilunar valve.",conceptId:"C_U2T7C_002"},{id:"U2C_MCQ_003",unit:"U2",topic:"U2T7C",concept:"C_U2T7C_003",type:"MCQ",stem:"Fibrous skeleton primarily?",options:["Carries oxygen","Produces hormones","Supports valves and electrically insulates atria from ventricles","Generates pacemaker potentials"],answer:2,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T7C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Supports valves and electrically insulates atria from ventricles” is correct: the fibrous skeleton is a dense connective-tissue framework encircling the valve rings that anchors the leaflets and electrically isolates atrial from ventricular myocardium, forcing all normal conduction through the AV node and bundle of His.",strongestDistractorAnalysis:"‘Generates pacemaker potentials’ is the strongest distractor: because the fibrous skeleton's insulating role is discussed alongside the conduction system, students attribute an active electrical function to what is a passive connective-tissue structure. Insulating a pathway is not the same as generating the signal that travels through it — that is the specific role of the SA and AV nodes.",conceptId:"C_U2T7C_003"},{id:"U2C_MCQ_004",unit:"U2",topic:"U2T7C",concept:"C_U2T7C_004",type:"MCQ",stem:"Coronary arteries arise from?",options:["Pulmonary trunk","Vena cava","Coronary sinus","Ascending aorta"],answer:3,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T7C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Ascending aorta” is correct: the right and left coronary arteries arise from the right and left aortic sinuses immediately above the aortic valve, at the root of the ascending aorta, with coronary filling occurring predominantly during diastole.",strongestDistractorAnalysis:"Coronary sinus is the strongest distractor: it shares the word ‘coronary’ and belongs to the same coronary circulation, so students conflate it with the coronary arteries' origin. The coronary sinus is in fact the venous drainage channel returning deoxygenated myocardial blood to the right atrium — the opposite end of the circuit from where the arteries originate.",conceptId:"C_U2T7C_004"},{id:"U2C_MCQ_005",unit:"U2",topic:"U2T7C",concept:"C_U2T7C_005",type:"MCQ",stem:"Pulmonary veins enter?",options:["Left atrium","Right atrium","Left ventricle","Right ventricle"],answer:0,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T7C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Left atrium” is correct: two pairs of pulmonary veins return freshly oxygenated blood from the lungs directly into the left atrium, the only veins in the body carrying oxygenated blood.",strongestDistractorAnalysis:"Right atrium is the strongest distractor: by the systemic-circuit naming convention, students default to assuming any ‘vein’ returns blood to the right side of the heart (as the venae cavae do), not recognising the pulmonary veins are the specific exception that enter the left atrium to complete the pulmonary circuit.",conceptId:"C_U2T7C_005"},{id:"U2C_MCQ_006",unit:"U2",topic:"U2T7C",concept:"C_U2T7C_006",type:"MCQ",stem:"Coronary sinus drains into?",options:["Pulmonary trunk","Right atrium","Left atrium","Aorta"],answer:1,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T7C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Right atrium” is correct: the coronary sinus, the main venous channel draining deoxygenated blood from the myocardium via the great, middle and small cardiac veins, empties into the right atrium near the inferior vena cava.",strongestDistractorAnalysis:"Left atrium is the strongest distractor: having just learned that pulmonary veins drain into the left atrium, students overgeneralise ‘venous drainage enters the left atrium’ to the coronary sinus as well, rather than recognising coronary venous blood instead follows the general systemic venous return pathway into the right atrium.",conceptId:"C_U2T7C_006"},{id:"U2C_MCQ_007",unit:"U2",topic:"U2T8C",concept:"C_U2T8C_007",type:"MCQ",stem:"Cardiac cells are electrically coupled by?",options:["Myelin","Collagen","Gap junctions","Tight junctions"],answer:2,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T8C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Gap junctions” is correct: cardiac myocytes are electrically coupled at intercalated discs through gap junctions — low-resistance channels formed by connexons — allowing the action potential to spread rapidly from cell to cell as a functional syncytium.",strongestDistractorAnalysis:"Tight junctions is the strongest distractor: both are named junction types found within the intercalated disc, so students conflate them by location. Tight junctions provide a barrier/adhesive seal and do not conduct ionic current; only gap junctions form the low-resistance pores that permit direct electrical coupling between adjacent myocytes.",conceptId:"C_U2T8C_007"},{id:"U2C_MCQ_008",unit:"U2",topic:"U2T8C",concept:"C_U2T8C_008",type:"MCQ",stem:"Prolonged refractory period prevents?",options:["Pacemaker activity","Valve closure","Coronary perfusion","Tetanus"],answer:3,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T8C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Tetanus” is correct: the cardiac action potential's prolonged plateau phase produces a correspondingly long refractory period, preventing the ventricle from being re-excited and summating contractions before it has had time to relax and refill — essential for the heart's pump function.",strongestDistractorAnalysis:"Coronary perfusion is the strongest distractor: refractoriness and diastolic coronary filling are temporally linked (both occur while the ventricle is relaxed), so students mistake this coincidence for a causal function. The refractory period's actual role is preventing tetanic summation, not enabling coronary flow, which is a separate consequence of diastolic relaxation.",conceptId:"C_U2T8C_008"},{id:"U2C_MCQ_009",unit:"U2",topic:"U2T8C",concept:"C_U2T8C_009",type:"MCQ",stem:"Trigger calcium enters through?",options:["L-type calcium channels","Fast sodium channels only","Potassium leak channels","Chloride channels"],answer:0,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T8C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“L-type calcium channels” is correct: during the plateau phase of the cardiac action potential, calcium entering through L-type (‘slow’) calcium channels triggers a much larger release of calcium from the sarcoplasmic reticulum — calcium-induced calcium release — which activates contraction.",strongestDistractorAnalysis:"‘Fast sodium channels only’ is the strongest distractor: fast Na⁺ channels genuinely drive the rapid upstroke (phase 0) of the action potential, so students conflate the channel responsible for depolarisation with the distinct channel responsible for triggering excitation–contraction coupling.",conceptId:"C_U2T8C_009"},{id:"U2C_MCQ_010",unit:"U2",topic:"U2T8C",concept:"C_U2T8C_010",type:"MCQ",stem:"Calcium binds?",options:["Titin","Troponin C","Tropomyosin","Actin only"],answer:1,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T8C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Troponin C” is correct: calcium binds troponin C, causing a conformational change in the troponin complex that displaces tropomyosin away from the myosin-binding sites on actin, permitting cross-bridge cycling.",strongestDistractorAnalysis:"Tropomyosin is the strongest distractor: it is the protein that is mechanically repositioned as a downstream consequence of calcium binding, so students confuse the actual calcium-binding target (troponin C) with the protein whose movement calcium indirectly causes.",conceptId:"C_U2T8C_010"},{id:"U2C_MCQ_011",unit:"U2",topic:"U2T8C",concept:"C_U2T8C_011",type:"MCQ",stem:"SERCA returns calcium to?",options:["Nucleus","Mitochondrial matrix","Sarcoplasmic reticulum","Extracellular fluid"],answer:2,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T8C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Sarcoplasmic reticulum” is correct: the SERCA pump actively transports cytosolic calcium back into the sarcoplasmic reticulum during relaxation, lowering cytosolic calcium and allowing tropomyosin to re-cover the myosin-binding sites.",strongestDistractorAnalysis:"‘Extracellular fluid’ is the strongest distractor: calcium is indeed also extruded from the cell, but via the separate Na⁺/Ca²⁺ exchanger (NCX), not SERCA. Students conflate the two distinct calcium-removal pathways — SERCA restores intracellular stores in the SR, while NCX clears calcium out of the cell entirely.",conceptId:"C_U2T8C_011"},{id:"U2C_MCQ_012",unit:"U2",topic:"U2T8C",concept:"C_U2T8C_012",type:"MCQ",stem:"Sympathetic stimulation usually?",options:["Stops calcium entry","Reduces rate","Closes coronary arteries","Increases contractility"],answer:3,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T8C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Increases contractility” is correct: sympathetic stimulation acts via beta-1 adrenergic receptors to raise intracellular calcium entry and SR calcium handling, increasing the force of contraction (positive inotropy) alongside its separate effect of raising heart rate.",strongestDistractorAnalysis:"‘Reduces rate’ is the strongest distractor: students sometimes assume autonomic effects on rate and contractility must move in opposite directions. In fact sympathetic stimulation increases both heart rate (positive chronotropy) and contractile force (positive inotropy) simultaneously — they are not reciprocal effects.",conceptId:"C_U2T8C_012"},{id:"U2C_MCQ_013",unit:"U2",topic:"U2T9C",concept:"C_U2T9C_013",type:"MCQ",stem:"Normal pacemaker?",options:["SA node","AV node","Purkinje fibres","Bundle branches"],answer:0,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T9C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“SA node” is correct: the sinoatrial node has the fastest intrinsic rate of spontaneous depolarisation of any cardiac tissue, so it normally sets the heart's rhythm and is termed the primary pacemaker.",strongestDistractorAnalysis:"AV node is the strongest distractor: it does possess intrinsic automaticity and can act as a subsidiary pacemaker, so students confuse ‘a’ pacemaker with ‘the’ normal pacemaker. The AV node's intrinsic rate is slower than the SA node's, which is precisely why the SA node normally dominates and suppresses it.",conceptId:"C_U2T9C_013"},{id:"U2C_MCQ_014",unit:"U2",topic:"U2T9C",concept:"C_U2T9C_014",type:"MCQ",stem:"AV nodal delay permits?",options:["Coronary flow only","Ventricular filling","Atrial repolarisation only","Valve calcification"],answer:1,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T9C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Ventricular filling” is correct: the AV node delays conduction from atria to ventricles by roughly 0.1 seconds, allowing atrial contraction to complete and empty its contents into the ventricles before ventricular systole begins.",strongestDistractorAnalysis:"‘Atrial repolarisation only’ is the strongest distractor: atrial repolarisation does happen to occur during this delay, but that is a coincidence of timing, not the delay's purpose. The AV delay exists specifically to sequence atrial contraction before ventricular contraction, optimising ventricular filling.",conceptId:"C_U2T9C_014"},{id:"U2C_MCQ_015",unit:"U2",topic:"U2T9C",concept:"C_U2T9C_015",type:"MCQ",stem:"Normal electrical bridge through fibrous skeleton?",options:["Vagus nerve","Papillary muscle","AV bundle","Coronary sinus"],answer:2,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T9C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“AV bundle” is correct: the bundle of His is the sole normal electrical pathway crossing the electrically insulating fibrous skeleton, carrying the impulse from the AV node into the ventricular conduction system.",strongestDistractorAnalysis:"Papillary muscle is the strongest distractor: papillary muscles are ventricular structures loosely associated with ‘connecting’ via chordae tendineae to the valve leaflets, but this is a purely mechanical connection. Students confuse this structural link with the specific electrical bridge role that only the AV bundle performs.",conceptId:"C_U2T9C_015"},{id:"U2C_MCQ_016",unit:"U2",topic:"U2T9C",concept:"C_U2T9C_016",type:"MCQ",stem:"Rapid ventricular conduction by?",options:["AV valves","Coronary veins","Chordae tendineae","Purkinje fibres"],answer:3,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T9C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Purkinje fibres” is correct: these large, fast-conducting fibres distribute the impulse rapidly throughout the ventricular myocardium, ensuring near-simultaneous ventricular depolarisation and coordinated contraction.",strongestDistractorAnalysis:"Chordae tendineae is the strongest distractor: their fibrous, cord-like appearance superficially resembles the Purkinje fibre network, so students conflate the two. Chordae tendineae are purely mechanical structures anchoring valve leaflets to papillary muscles and carry no electrical signal.",conceptId:"C_U2T9C_016"},{id:"U2C_MCQ_017",unit:"U2",topic:"U2T9C",concept:"C_U2T9C_017",type:"MCQ",stem:"Parasympathetic stimulation usually?",options:["Slows SA and AV nodal activity","Raises contractility strongly","Raises TPR directly","Increases renin"],answer:0,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T9C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Slows SA and AV nodal activity” is correct: vagal (parasympathetic) stimulation releases acetylcholine at the SA and AV nodes, hyperpolarising pacemaker cells and slowing both heart rate and AV conduction.",strongestDistractorAnalysis:"‘Raises TPR directly’ is the strongest distractor: students overextend cardiac vagal effects to the vasculature generally. Parasympathetic innervation of the heart is largely confined to the SA and AV nodes with minimal ventricular effect, while total peripheral resistance is predominantly regulated by sympathetic, not parasympathetic, tone.",conceptId:"C_U2T9C_017"},{id:"U2C_MCQ_018",unit:"U2",topic:"U2T9C",concept:"C_U2T9C_018",type:"MCQ",stem:"If SA node fails, rhythm may arise from?",options:["Coronary veins","Subsidiary pacemaker","Platelets","Papillary muscles"],answer:1,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T9C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Subsidiary pacemaker” is correct: if the SA node fails, tissue elsewhere in the conduction system (such as the AV node or Purkinje fibres) with its own slower intrinsic automaticity can take over as an ectopic or subsidiary pacemaker.",strongestDistractorAnalysis:"Papillary muscles is the strongest distractor among the options: it names a genuine contractile ventricular structure, so a student unsure of pacemaker hierarchy may guess a muscular structure rather than correctly identifying that pacemaker function belongs to specialised conduction tissue, not ordinary contractile myocardium.",conceptId:"C_U2T9C_018"},{id:"U2C_MCQ_019",unit:"U2",topic:"U2T10C",concept:"C_U2T10C_019",type:"MCQ",stem:"During isovolumetric contraction?",options:["Semilunar valves open","Volume increases","All valves closed","AV valves open"],answer:2,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T10C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“All valves closed” is correct: during isovolumetric contraction, ventricular pressure is rising rapidly but has not yet exceeded aortic or pulmonary pressure, so the semilunar valves remain shut while the AV valves have already closed — volume is therefore constant.",strongestDistractorAnalysis:"‘Semilunar valves open’ is the strongest distractor: this describes the phase immediately following isovolumetric contraction (ejection). Students conflate the two adjacent phases, not realising semilunar valves stay closed throughout isovolumetric contraction precisely because ventricular pressure has not yet surpassed arterial pressure.",conceptId:"C_U2T10C_019"},{id:"U2C_MCQ_020",unit:"U2",topic:"U2T10C",concept:"C_U2T10C_020",type:"MCQ",stem:"S1 mainly reflects closure of?",options:["Semilunar valves","Coronary ostia","Venae cavae","AV valves"],answer:3,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T10C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“AV valves” is correct: S1 (‘lub’) marks the onset of ventricular systole and is produced by closure of the mitral and tricuspid (atrioventricular) valves as ventricular pressure exceeds atrial pressure.",strongestDistractorAnalysis:"‘Semilunar valves’ is the strongest distractor: students frequently swap which heart sound corresponds to which valve closure. S1 is AV valve closure at the start of systole; S2, not S1, is semilunar valve closure at the end of systole.",conceptId:"C_U2T10C_020"},{id:"U2C_MCQ_021",unit:"U2",topic:"U2T10C",concept:"C_U2T10C_021",type:"MCQ",stem:"Stroke volume equals?",options:["EDV minus ESV","ESV minus EDV","HR × pressure","SBP − DBP"],answer:0,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T10C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“EDV minus ESV” is correct: stroke volume is the volume ejected per beat, calculated as end-diastolic volume (maximum ventricular filling) minus end-systolic volume (volume remaining after ejection).",strongestDistractorAnalysis:"‘SBP − DBP’ is the strongest distractor: this is in fact the formula for pulse pressure, a related but distinct quantity from a different topic in this unit. Students confuse the two ‘subtraction’ formulas — stroke volume is a ventricular volume difference, pulse pressure is an arterial pressure difference.",conceptId:"C_U2T10C_021"},{id:"U2C_MCQ_022",unit:"U2",topic:"U2T10C",concept:"C_U2T10C_022",type:"MCQ",stem:"Ejection begins when ventricular pressure exceeds?",options:["Pericardial pressure","Aortic or pulmonary pressure","Atrial pressure only","Venous pressure only"],answer:1,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T10C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Aortic or pulmonary pressure” is correct: ejection begins once rising ventricular pressure exceeds the pressure in the great artery downstream, forcing the semilunar valve open.",strongestDistractorAnalysis:"‘Atrial pressure only’ is the strongest distractor: the atrioventricular pressure gradient governs opening and closing of the AV valves, not the semilunar valves. Students apply the wrong pressure comparison — the one relevant to filling — to the question of when ejection (governed by the ventricular–arterial gradient) begins.",conceptId:"C_U2T10C_022"},{id:"U2C_MCQ_023",unit:"U2",topic:"U2T10C",concept:"C_U2T10C_023",type:"MCQ",stem:"S2 marks start of?",options:["Ejection","Rapid filling","Ventricular diastole","Atrial systole"],answer:2,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T10C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Ventricular diastole” is correct: S2 is produced by semilunar valve closure at the very end of ejection, marking the transition into diastole, beginning with isovolumetric relaxation.",strongestDistractorAnalysis:"Ejection is the strongest distractor: S2 occurs at the end of ejection, so students associate the sound with the phase it terminates rather than the phase it initiates. S2 marks the start of diastole, not a feature of the ejection phase itself.",conceptId:"C_U2T10C_023"},{id:"U2C_MCQ_024",unit:"U2",topic:"U2T10C",concept:"C_U2T10C_024",type:"MCQ",stem:"Ejection fraction equals?",options:["EDV/SV","HR×SV","PP/MAP","SV/EDV"],answer:3,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T10C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“SV/EDV” is correct: ejection fraction is the proportion of end-diastolic volume ejected per beat, a dimensionless index of ventricular pumping efficiency, typically 55–70% in a healthy heart.",strongestDistractorAnalysis:"‘HR×SV’ is the strongest distractor: this is the formula for cardiac output, a closely related but distinct quantity from an adjacent topic. Students confuse ejection fraction (a ratio describing pump efficiency) with cardiac output (an absolute flow rate).",conceptId:"C_U2T10C_024"},{id:"U2C_MCQ_025",unit:"U2",topic:"U2T11C",concept:"C_U2T11C_025",type:"MCQ",stem:"P wave?",options:["Atrial depolarisation","Atrial contraction","Ventricular depolarisation","Ventricular repolarisation"],answer:0,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T11C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Atrial depolarisation” is correct: the P wave is the ECG's electrical record of the depolarisation wavefront spreading across the atria, immediately preceding atrial mechanical contraction.",strongestDistractorAnalysis:"‘Atrial contraction’ is the strongest distractor: depolarisation and contraction are closely linked in sequence, so students conflate the electrical event the ECG actually records (depolarisation) with the mechanical event it triggers a fraction of a second later (contraction).",conceptId:"C_U2T11C_025"},{id:"U2C_MCQ_026",unit:"U2",topic:"U2T11C",concept:"C_U2T11C_026",type:"MCQ",stem:"QRS?",options:["Valve closure","Ventricular depolarisation","Atrial depolarisation","Ventricular filling"],answer:1,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T11C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Ventricular depolarisation” is correct: the QRS complex represents the rapid, high-amplitude spread of depolarisation through the ventricular myocardium via the His–Purkinje system.",strongestDistractorAnalysis:"‘Atrial depolarisation’ is the strongest distractor: P wave and QRS complex are the two depolarisation waveforms in sequence, and students may transpose which chamber's depolarisation each one represents.",conceptId:"C_U2T11C_026"},{id:"U2C_MCQ_027",unit:"U2",topic:"U2T11C",concept:"C_U2T11C_027",type:"MCQ",stem:"T wave?",options:["AV delay","Ejection","Ventricular repolarisation","Atrial depolarisation"],answer:2,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T11C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Ventricular repolarisation” is correct: the T wave represents the electrical recovery (repolarisation) of the ventricular myocardium following the QRS complex.",strongestDistractorAnalysis:"‘AV delay’ is the strongest distractor: AV nodal delay is represented by the PR segment, an earlier and distinct part of the trace. Students who have not clearly mapped each ECG feature to its specific electrical event confuse the late-cycle T wave with the earlier PR interval.",conceptId:"C_U2T11C_027"},{id:"U2C_MCQ_028",unit:"U2",topic:"U2T11C",concept:"C_U2T11C_028",type:"MCQ",stem:"PR interval reflects?",options:["Only Purkinje conduction","Only ventricular muscle","Coronary flow","Atrial-to-ventricular conduction"],answer:3,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T11C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Atrial-to-ventricular conduction” is correct: the PR interval spans the entire conduction time from SA node initiation and atrial depolarisation through the AV nodal delay to the onset of ventricular depolarisation.",strongestDistractorAnalysis:"‘Only Purkinje conduction’ is the strongest distractor: Purkinje conduction is genuinely part of the pathway captured within the PR interval, so students narrow the interval's meaning to just its fastest, most distal component rather than the full atrium-to-ventricle conduction time it actually represents.",conceptId:"C_U2T11C_028"},{id:"U2C_MCQ_029",unit:"U2",topic:"U2T11C",concept:"C_U2T11C_029",type:"MCQ",stem:"Atrial repolarisation usually?",options:["Hidden in QRS","P wave","T wave","ST segment"],answer:0,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T11C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Hidden in QRS” is correct: atrial repolarisation is a small electrical event that occurs at roughly the same time as the much larger QRS complex of ventricular depolarisation, and is masked within it on a standard ECG.",strongestDistractorAnalysis:"P wave is the strongest distractor: since the P wave represents atrial depolarisation, students who have not distinguished depolarisation from repolarisation assume atrial repolarisation must also appear at or near the P wave, rather than recognising it is a separate, later event obscured by the QRS complex.",conceptId:"C_U2T11C_029"},{id:"U2C_MCQ_030",unit:"U2",topic:"U2T11C",concept:"C_U2T11C_030",type:"MCQ",stem:"ECG records primarily?",options:["Cardiac output directly","Electrical activity","Pressure directly","Valve movement directly"],answer:1,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T11C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Electrical activity” is correct: the ECG is a surface recording of the heart's electrical depolarisation and repolarisation sequence; it does not directly measure mechanical, pressure or output events.",strongestDistractorAnalysis:"‘Pressure directly’ is the strongest distractor: ECG changes are often taught alongside correlated pressure events in the cardiac cycle, so students conflate the electrical signal actually recorded with the mechanical and haemodynamic events it merely correlates with in time.",conceptId:"C_U2T11C_030"},{id:"U2C_MCQ_031",unit:"U2",topic:"U2T12C",concept:"C_U2T12C_031",type:"MCQ",stem:"Cardiac output equals?",options:["EDV − HR","SV/HR","HR × SV","MAP × PP"],answer:2,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T12C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“HR × SV” is correct: cardiac output is the volume of blood ejected by the heart per minute, calculated as heart rate multiplied by stroke volume.",strongestDistractorAnalysis:"‘SV/HR’ is the strongest distractor: it uses the same two correct variables with the wrong operation. Students who recall that cardiac output involves HR and SV but not the precise relationship default to a plausible-looking but incorrect ratio instead of a product.",conceptId:"C_U2T12C_031"},{id:"U2C_MCQ_032",unit:"U2",topic:"U2T12C",concept:"C_U2T12C_032",type:"MCQ",stem:"Preload relates to?",options:["Aortic resistance only","Pacemaker rate","Coronary pressure","Ventricular filling"],answer:3,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T12C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Ventricular filling” is correct: preload is the degree of ventricular stretch at the end of diastole, determined by the volume of blood filling the ventricle before contraction.",strongestDistractorAnalysis:"‘Aortic resistance only’ is the strongest distractor: aortic resistance is precisely what defines afterload, not preload. Preload and afterload are the two most commonly transposed terms in this topic, and students swap one paired concept for the other.",conceptId:"C_U2T12C_032"},{id:"U2C_MCQ_033",unit:"U2",topic:"U2T12C",concept:"C_U2T12C_033",type:"MCQ",stem:"Afterload is?",options:["Resistance to ejection","Blood remaining after ejection","Venous return only","Pacemaker potential"],answer:0,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T12C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Resistance to ejection” is correct: afterload is the resistance (chiefly arterial pressure and vascular resistance) the ventricle must overcome to eject blood during systole.",strongestDistractorAnalysis:"‘Blood remaining after ejection’ is the strongest distractor: the word ‘after’ in ‘afterload’ misleadingly suggests something occurring after ejection, like end-systolic volume, rather than correctly denoting the resistance opposed DURING ejection — a verbal misreading rather than a physiological one.",conceptId:"C_U2T12C_033"},{id:"U2C_MCQ_034",unit:"U2",topic:"U2T12C",concept:"C_U2T12C_034",type:"MCQ",stem:"Frank–Starling predicts increased filling usually?",options:["Reduces fibre length","Increases force","Stops contraction","Closes AV valves permanently"],answer:1,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T12C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Increases force” is correct: the Frank–Starling mechanism states that, within physiological limits, increased ventricular filling stretches sarcomeres toward their optimal length, improving actin–myosin overlap and increasing contractile force.",strongestDistractorAnalysis:"‘Reduces fibre length’ is the strongest distractor: it directly inverts the correct relationship. Increased filling (preload) increases sarcomere length up to the optimum, which is precisely what raises contractile force — this option tests whether students have the direction of the relationship right, not just its terminology.",conceptId:"C_U2T12C_034"},{id:"U2C_MCQ_035",unit:"U2",topic:"U2T12C",concept:"C_U2T12C_035",type:"MCQ",stem:"Venous return equals cardiac output?",options:["Only during haemorrhage","Only pulmonary","In steady state","Never"],answer:2,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T12C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“In steady state” is correct: over time, venous return to the heart must equal cardiac output for circulatory volume to remain in equilibrium — what flows in must flow out.",strongestDistractorAnalysis:"‘Only during haemorrhage’ is the strongest distractor: haemorrhage is a scenario commonly discussed alongside venous return, so students associate the equality specifically with pathological contexts rather than recognising it as the normal steady-state relationship underlying circulatory equilibrium at all times.",conceptId:"C_U2T12C_035"},{id:"U2C_MCQ_036",unit:"U2",topic:"U2T12C",concept:"C_U2T12C_036",type:"MCQ",stem:"Exercise raises cardiac output through?",options:["Only lower venous return","Only lower contractility","Only longer diastole","HR and SV changes"],answer:3,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T12C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“HR and SV changes” is correct: exercise raises cardiac output through coordinated increases in both heart rate and stroke volume, driven by sympathetic stimulation, enhanced contractility and increased venous return.",strongestDistractorAnalysis:"‘Only longer diastole’ is the strongest distractor: it seems intuitive that more filling time would raise output, but exercise increases heart rate, which actually shortens diastole. The genuine mechanism is a coordinated rise in both HR and SV, not an increase in filling time.",conceptId:"C_U2T12C_036"},{id:"U2C_MCQ_037",unit:"U2",topic:"U2T13C",concept:"C_U2T13C_037",type:"MCQ",stem:"MAP mainly depends on?",options:["CO and TPR","Haematocrit alone","Albumin alone","Lung compliance"],answer:0,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T13C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“CO and TPR” is correct: mean arterial pressure is the product of cardiac output and total peripheral resistance, the two principal haemodynamic determinants of arterial pressure.",strongestDistractorAnalysis:"‘Haematocrit alone’ is the strongest distractor: haematocrit does influence blood viscosity, one contributor to vascular resistance, so students isolate this single factor and treat it as the primary determinant rather than recognising MAP is most directly set by CO and TPR as a whole.",conceptId:"C_U2T13C_037"},{id:"U2C_MCQ_038",unit:"U2",topic:"U2T13C",concept:"C_U2T13C_038",type:"MCQ",stem:"Main resistance vessels?",options:["Aorta","Arterioles","Veins","Capillaries"],answer:1,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T13C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Arterioles” is correct: arterioles possess thick smooth-muscle walls capable of active vasoconstriction and vasodilation, making them the principal site of adjustable vascular resistance in the circulation.",strongestDistractorAnalysis:"Capillaries is the strongest distractor: capillaries have the smallest individual diameter of any vessel, so students assume the narrowest vessels must offer the greatest resistance. Resistance instead depends on the collective, actively adjustable arteriolar bed, not the passive, thin-walled capillaries.",conceptId:"C_U2T13C_038"},{id:"U2C_MCQ_039",unit:"U2",topic:"U2T13C",concept:"C_U2T13C_039",type:"MCQ",stem:"Main capacitance vessels?",options:["Capillaries","Coronary arteries","Veins","Arterioles"],answer:2,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T13C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Veins” is correct: veins are thin-walled and highly distensible, storing roughly 60–70% of total circulating blood volume, which is why they are termed capacitance vessels.",strongestDistractorAnalysis:"Arterioles is the strongest distractor: having just been identified as the main resistance vessels, students assume the same vessel type also serves the capacitance role, not recognising resistance and capacitance are distinct vascular functions assigned to different vessel categories.",conceptId:"C_U2T13C_039"},{id:"U2C_MCQ_040",unit:"U2",topic:"U2T13C",concept:"C_U2T13C_040",type:"MCQ",stem:"Pulse pressure?",options:["DBP − SBP","MAP − DBP","CO×HR","SBP − DBP"],answer:3,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T13C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“SBP − DBP” is correct: pulse pressure is the difference between systolic and diastolic pressure, reflecting stroke volume and arterial compliance.",strongestDistractorAnalysis:"‘MAP − DBP’ is the strongest distractor: this expression is mathematically related to pulse pressure (it equals roughly one-third of pulse pressure, from the MAP approximation formula), so students confuse this derived, partial relationship with the direct definition of pulse pressure itself.",conceptId:"C_U2T13C_040"},{id:"U2C_MCQ_041",unit:"U2",topic:"U2T13C",concept:"C_U2T13C_041",type:"MCQ",stem:"Approximate MAP?",options:["DBP + one-third PP","SBP + DBP","PP only","CO/TPR"],answer:0,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T13C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“DBP + one-third PP” is correct: this is the standard clinical approximation for mean arterial pressure, accounting for diastole occupying roughly two-thirds of the cardiac cycle at resting heart rates.",strongestDistractorAnalysis:"‘CO/TPR’ is the strongest distractor: it inverts the true physiological relationship (MAP = CO × TPR, not CO/TPR), and students conflate the underlying physiological determinant of MAP with the separate clinical bedside approximation formula used to estimate it from a blood-pressure cuff reading.",conceptId:"C_U2T13C_041"},{id:"U2C_MCQ_042",unit:"U2",topic:"U2T13C",concept:"C_U2T13C_042",type:"MCQ",stem:"Long-term BP control depends strongly on?",options:["Surfactant","Renal salt and water balance","ECG intervals","Platelets"],answer:1,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T13C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Renal salt and water balance” is correct: long-term blood pressure is set predominantly by the kidney's control of extracellular fluid volume, through mechanisms such as pressure natriuresis and the renin–angiotensin–aldosterone system, distinct from the fast-acting baroreflex.",strongestDistractorAnalysis:"‘ECG intervals’ is the strongest distractor among the options: it is the most superficially cardiovascular-sounding term, so students associate any measured cardiac parameter with blood-pressure regulation, rather than recognising that long-term BP control is a renal, volume-based mechanism, distinct from cardiac electrical activity.",conceptId:"C_U2T13C_042"},{id:"U2C_MCQ_043",unit:"U2",topic:"U2T14C",concept:"C_U2T14C_043",type:"MCQ",stem:"Pulmonary arteries carry?",options:["Portal blood","Coronary venous blood","Deoxygenated blood from right ventricle","Oxygenated blood to left atrium"],answer:2,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T14C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Deoxygenated blood from right ventricle” is correct: the pulmonary trunk carries deoxygenated blood from the right ventricle to the lungs for gas exchange — the exception to the rule that arteries carry oxygenated blood.",strongestDistractorAnalysis:"‘Oxygenated blood to left atrium’ is the strongest distractor: this describes the pulmonary veins, not the pulmonary arteries. Students who apply the systemic naming convention (arteries = oxygenated, veins = deoxygenated) to the pulmonary circuit select the reversed description.",conceptId:"C_U2T14C_043"},{id:"U2C_MCQ_044",unit:"U2",topic:"U2T14C",concept:"C_U2T14C_044",type:"MCQ",stem:"Pulmonary veins carry?",options:["Deoxygenated blood to right ventricle","Blood to liver","Blood from myocardium","Oxygenated blood to left atrium"],answer:3,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T14C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Oxygenated blood to left atrium” is correct: the pulmonary veins return freshly oxygenated blood from the lungs to the left atrium, the reverse-naming exception paired with the pulmonary arteries.",strongestDistractorAnalysis:"‘Deoxygenated blood to right ventricle’ is the strongest distractor: this describes the pulmonary trunk/arteries, not the pulmonary veins. Having learned that one pulmonary vessel is deoxygenated and one is oxygenated, students transpose which vessel carries which.",conceptId:"C_U2T14C_044"},{id:"U2C_MCQ_045",unit:"U2",topic:"U2T14C",concept:"C_U2T14C_045",type:"MCQ",stem:"Hepatic portal vein carries blood from?",options:["Gut to liver","Heart to lungs","Kidney to heart","Liver to aorta"],answer:0,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T14C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Gut to liver” is correct: the hepatic portal vein is a portal vessel connecting two capillary beds, carrying nutrient-rich blood from the gastrointestinal capillaries directly to the hepatic sinusoids for processing before it reaches the systemic circulation.",strongestDistractorAnalysis:"‘Liver to aorta’ is the strongest distractor: it involves the liver, matching the keyword, but reverses both the direction and vessel type. Draining blood away from the liver into the systemic venous system is the role of the hepatic vein into the inferior vena cava, not the portal vein, which by definition connects two capillary beds rather than draining an organ into the systemic circuit.",conceptId:"C_U2T14C_045"},{id:"U2C_MCQ_046",unit:"U2",topic:"U2T14C",concept:"C_U2T14C_046",type:"MCQ",stem:"Coronary circulation supplies?",options:["Bone marrow","Myocardium","Alveoli","Renal cortex"],answer:1,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T14C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Myocardium” is correct: the coronary circulation is the heart's own dedicated blood supply, delivering oxygen and nutrients to the cardiac muscle itself via the coronary arteries.",strongestDistractorAnalysis:"Alveoli is the strongest distractor: coronary and pulmonary circulations are the two ‘special’ named circulations most often discussed together in this topic, so students confuse the heart's own blood supply (coronary, supplying myocardium) with the lung's blood supply (pulmonary, supplying alveoli for gas exchange).",conceptId:"C_U2T14C_046"},{id:"U2C_MCQ_047",unit:"U2",topic:"U2T14C",concept:"C_U2T14C_047",type:"MCQ",stem:"Ductus arteriosus connects?",options:["Umbilical vein and IVC","Portal vein and liver","Pulmonary trunk and aorta","Atria"],answer:2,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T14C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Pulmonary trunk and aorta” is correct: the ductus arteriosus is a fetal shunt connecting the pulmonary trunk directly to the aorta, bypassing the non-aerated fetal lungs.",strongestDistractorAnalysis:"‘Atria’ is the strongest distractor: this describes the foramen ovale, the other major fetal shunt, discussed alongside the ductus arteriosus. Students transpose the two shunts — the foramen ovale connects the right and left atria, while the ductus arteriosus connects the pulmonary trunk and aorta.",conceptId:"C_U2T14C_047"},{id:"U2C_MCQ_048",unit:"U2",topic:"U2T14C",concept:"C_U2T14C_048",type:"MCQ",stem:"Foramen ovale connects?",options:["Right and left ventricles","Aorta and pulmonary trunk","Umbilical arteries","Right and left atria"],answer:3,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T14C_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Right and left atria” is correct: the foramen ovale is a fetal interatrial shunt allowing oxygenated blood entering the right atrium from the placenta to bypass the non-aerated lungs by flowing directly into the left atrium.",strongestDistractorAnalysis:"‘Aorta and pulmonary trunk’ is the strongest distractor: this describes the ductus arteriosus, the other major fetal shunt. Students transpose the two shunts in the reverse direction from the previous question — confusing the interatrial shunt (foramen ovale) with the great-vessel shunt (ductus arteriosus).",conceptId:"C_U2T14C_048"},{id:"U2C_AR_01",unit:"U2",topic:"U2T7C",concept:"C_U2T7C_AR",type:"Assertion–Reason",stem:"Assertion: The left ventricular myocardial wall is considerably thicker than the right ventricular wall. Reason: The left ventricle must generate substantially higher pressure to overcome systemic vascular resistance, which greatly exceeds pulmonary vascular resistance.",options:["Both Assertion and Reason are true, and the Reason correctly explains the Assertion.","Both Assertion and Reason are true, but the Reason does not correctly explain the Assertion.","The Assertion is true, but the Reason is false.","The Assertion is false, but the Reason is true."],answer:0,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"logical-structure-error",misconceptionId:"MIS_U2T7C_LOGICAL_STRUCTURE_ERROR",explanation:"Both statements are true, and the Reason explains the Assertion. The left ventricular wall (roughly 8–12 mm) is markedly thicker than the right ventricular wall (roughly 3–5 mm) because it must overcome systemic vascular resistance (mean arterial pressure ~93 mmHg), far exceeding the pulmonary vascular resistance the right ventricle overcomes. By Laplace's law, sustaining greater wall tension against this higher afterload requires a proportionally thicker wall.",strongestDistractorAnalysis:"‘Both true but unrelated’ is the strongest distractor: a student may verify both statements as individually true but hesitate to commit to a causal link, not recognising that afterload — via Laplace's law — is precisely the mechanism behind the wall-thickness disparity, not a coincidental parallel fact.",conceptId:"C_U2T7C_AR"},{id:"U2C_CASE_01",unit:"U2",topic:"U2T7C",concept:"C_U2T7C_CASE",type:"Case-based",stem:"A 58
