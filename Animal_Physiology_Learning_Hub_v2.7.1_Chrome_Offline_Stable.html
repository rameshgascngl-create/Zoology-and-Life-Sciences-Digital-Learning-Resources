057",type:"MCQ",stem:"Heavy proteinuria suggests damage to:",options:["Glomerular filtration barrier","SA node","Pulmonary alveoli","Platelets"],answer:0,difficulty:"high",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T29R_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Glomerular filtration barrier” is correct: substantial proteinuria indicates damage to the filtration barrier (fenestrated endothelium, basement membrane, podocyte slit diaphragms), which normally restricts the passage of large plasma proteins such as albumin.",strongestDistractorAnalysis:"None of the listed distractors (SA node, pulmonary alveoli, platelets) are structures whose damage produces proteinuria — they belong to unrelated organ systems. This item primarily tests whether the filtration barrier has been identified as the structure responsible for normally excluding protein from the filtrate.",conceptId:"C_U2T29R_057"},{id:"U2R_MCQ_058",unit:"U2",topic:"U2T29R",concept:"C_U2T29R_058",type:"MCQ",stem:"Nephrotic syndrome includes:",options:["Haemophilia","Proteinuria, hypoalbuminaemia and oedema","Polycythaemia and hypertension only","Glucosuria only"],answer:1,difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T29R_REGULATION_ERROR",explanation:"“Proteinuria, hypoalbuminaemia and oedema” is correct: nephrotic syndrome is defined by this triad, arising from a severely damaged glomerular filtration barrier that allows heavy protein loss into urine, depleting plasma albumin and reducing plasma oncotic pressure, which drives fluid into the interstitium as oedema.",strongestDistractorAnalysis:"‘Polycythaemia and hypertension only’ is the strongest distractor: hypertension is a genuine feature seen in some renal disease, so students who know renal disorders can raise blood pressure select a plausible-sounding renal complication pairing, without recalling the specific, defining triad of nephrotic syndrome tested here.",conceptId:"C_U2T29R_058"},{id:"U2R_MCQ_059",unit:"U2",topic:"U2T29R",concept:"C_U2T29R_059",type:"MCQ",stem:"Urinary casts arise mainly in:",options:["Bladder wall","Renal artery","Renal tubules","Urethra only"],answer:2,difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"structure-function-confusion",misconceptionId:"MIS_U2T29R_STRUCTURE_FUNCTION_CONFUSION",explanation:"“Renal tubules” is correct: urinary casts are cylindrical structures formed by precipitation of Tamm-Horsfall protein (and sometimes trapped cells or debris) within the lumen of the renal tubules, taking the tubule's shape before being washed into the urine.",strongestDistractorAnalysis:"‘Bladder wall’ is the strongest distractor: students who know casts are found in urine and associate the urinary tract generally with cast formation select a more familiar, downstream urinary structure, missing that casts specifically form within the narrow tubular lumen upstream, not in the larger bladder cavity.",conceptId:"C_U2T29R_059"},{id:"U2R_MCQ_060",unit:"U2",topic:"U2T29R",concept:"C_U2T29R_060",type:"MCQ",stem:"Glucosuria may occur when:",options:["Plasma glucose is absent","GFR is zero","ADH is high","Filtered glucose exceeds transport capacity"],answer:3,difficulty:"high",cognitiveLevel:"apply",diagnosticCategory:"regulation-error",misconceptionId:"MIS_U2T29R_REGULATION_ERROR",explanation:"“Filtered glucose exceeds transport capacity” is correct: glucosuria occurs when the filtered glucose load surpasses the proximal tubule's finite reabsorptive transport maximum, so the unreabsorbed excess remains in the tubular fluid and appears in urine.",strongestDistractorAnalysis:"‘ADH is high’ is the strongest distractor: ADH is a prominent renal regulatory hormone discussed elsewhere in this unit, so students default to it as a general explanation for an abnormal urine finding, without recognising that ADH governs water handling and urine concentration, not glucose transport, which is entirely unrelated to glucosuria.",conceptId:"C_U2T29R_060"},{id:"U2R_ADV_01",unit:"U2",topic:"U2T15R",concept:"C_U2T15R_ADV",type:"Case-based",stem:"A renal artery branch is obstructed. Which structure is directly downstream in renal perfusion?",options:["Afferent arteriole and glomerulus","Ureter first","Bladder","External sphincter"],answer:0,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T15R_CLINICAL_APPLICATION_ERROR",explanation:"“Afferent arteriole and glomerulus” is correct: renal arterial blood flows sequentially from renal artery → segmental → interlobar → arcuate → interlobular arteries → afferent arteriole → glomerulus. Obstruction of a renal artery branch therefore directly compromises perfusion to the afferent arteriole and glomerulus it supplies, before any urine has even been formed.",strongestDistractorAnalysis:"‘Ureter first’ is the strongest distractor: ‘downstream’ is a directional term more commonly used for urine flow in renal physiology teaching, so students misapply it to blood flow when the stem specifically asks about arterial perfusion, not urine drainage — the ureter is downstream in the urinary pathway, not the vascular one.",conceptId:"C_U2T15R_ADV"},{id:"U2R_ADV_02",unit:"U2",topic:"U2T16R",concept:"C_U2T16R_ADV",type:"HOTS",stem:"A nephron with a very long loop is most important for which function?",options:["ECG generation","Urine concentration","Blood grouping","Coagulation"],answer:1,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T16R_CLINICAL_APPLICATION_ERROR",explanation:"“Urine concentration” is correct: nephrons with very long loops of Henle (juxtamedullary nephrons) penetrate deep into the medulla, generating and sustaining the steep corticomedullary osmotic gradient that the collecting ducts rely on, under ADH control, to concentrate urine.",strongestDistractorAnalysis:"None of the listed distractors are physiologically plausible — they are drawn from unrelated organ systems (cardiac electrical activity, blood typing, coagulation) with no structural or functional link to nephron loop length. This item primarily tests whether the basic structure–function link between loop length and urine-concentrating ability has been learned, rather than discriminating between closely competing renal concepts.",conceptId:"C_U2T16R_ADV"},{id:"U2R_ADV_03",unit:"U2",topic:"U2T17R",concept:"C_U2T17R_ADV",type:"Case-based",stem:"Plasma oncotic pressure rises markedly. What happens to GFR?",options:["No effect ever","Micturition starts","GFR decreases","GFR increases"],answer:2,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T17R_CLINICAL_APPLICATION_ERROR",explanation:"“GFR decreases” is correct: a marked rise in plasma oncotic pressure increases the force opposing glomerular filtration, reducing net filtration pressure and therefore reducing GFR, consistent with the same Starling-force logic tested in this topic's MCQs.",strongestDistractorAnalysis:"‘GFR increases’ is the strongest distractor: it inverts the correct relationship in the same way the MCQ distractor does. Students who treat oncotic pressure as a generically ‘active’ or ‘stimulating’ force, rather than specifically an opposing force in the Starling balance, assume its rise must increase rather than decrease filtration.",conceptId:"C_U2T17R_ADV"},{id:"U2R_ADV_04",unit:"U2",topic:"U2T18R",concept:"C_U2T18R_ADV",type:"HOTS",stem:"Plasma glucose exceeds transport maximum. What appears in urine?",options:["Proteinuria only","Haematuria","No urinary change","Glucosuria"],answer:3,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T18R_CLINICAL_APPLICATION_ERROR",explanation:"“Glucosuria” is correct: when plasma glucose concentration rises high enough that the filtered glucose load exceeds the proximal tubule's transport maximum, the unreabsorbed excess remains in the tubular fluid and is excreted, producing glucosuria — as classically seen in poorly controlled diabetes mellitus.",strongestDistractorAnalysis:"‘Proteinuria only’ is the strongest distractor: both glucosuria and proteinuria are abnormal urinary findings taught together as markers of renal or metabolic dysfunction, so students conflate the specific consequence of exceeding a solute's transport maximum (glucosuria) with a different pathology involving glomerular barrier damage (proteinuria).",conceptId:"C_U2T18R_ADV"},{id:"U2R_ADV_05",unit:"U2",topic:"U2T19R",concept:"C_U2T19R_ADV",type:"Case-based",stem:"A drug is strongly protein bound but actively secreted. Why can renal clearance exceed GFR?",options:["Tubular secretion adds drug to filtrate","Reabsorption removes all drug","GFR becomes zero","Albumin is filtered freely"],answer:0,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T19R_CLINICAL_APPLICATION_ERROR",explanation:"“Tubular secretion adds drug to filtrate” is correct: because the drug is strongly protein-bound, only a small fraction is freely filtered at the glomerulus; however, active tubular secretion by peritubular transporters adds additional drug directly from the blood into the tubular fluid, independent of filtration, allowing total clearance to exceed the GFR-based filtered load.",strongestDistractorAnalysis:"‘Albumin is filtered freely’ is the strongest distractor: it is scientifically false (albumin is normally almost entirely excluded by the filtration barrier) but sounds superficially plausible to students who assume any protein-bound substance must somehow bypass the barrier alongside its carrier protein, rather than recognising that only the small free (unbound) drug fraction is filtered, with secretion accounting for the additional clearance.",conceptId:"C_U2T19R_ADV"},{id:"U2R_ADV_06",unit:"U2",topic:"U2T20R",concept:"C_U2T20R_ADV",type:"HOTS",stem:"A loop diuretic blocks Na-K-2Cl transport. What happens to medullary gradient?",options:["ADH rises automatically enough to compensate fully","Medullary gradient decreases","Gradient increases greatly","GFR doubles"],answer:1,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T20R_CLINICAL_APPLICATION_ERROR",explanation:"“Medullary gradient decreases” is correct: by blocking the Na-K-2Cl cotransporter in the thick ascending limb, a loop diuretic prevents the active solute reabsorption that drives the countercurrent multiplier, directly weakening the medullary osmotic gradient and impairing the kidney's maximal urine-concentrating ability.",strongestDistractorAnalysis:"‘ADH rises automatically enough to compensate fully’ is the strongest distractor: although ADH release can increase in response to volume loss from diuresis, this is a separate, partial compensatory response and cannot restore a gradient that is no longer being actively generated by the blocked cotransporter — students overestimate ADH's ability to compensate for a primary generation defect.",conceptId:"C_U2T20R_ADV"},{id:"U2R_ADV_07",unit:"U2",topic:"U2T21R",concept:"C_U2T21R_ADV",type:"Case-based",stem:"Medullary blood flow increases greatly. What happens to concentration ability?",options:["No effect","Filtration barrier thickens","Gradient washout increases","Gradient strengthens"],answer:2,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T21R_CLINICAL_APPLICATION_ERROR",explanation:"“Gradient washout increases” is correct: a marked increase in medullary blood flow through the vasa recta reduces the time available for countercurrent exchange to equilibrate, so more solute is carried away from the interstitium than usual, dissipating (washing out) the osmotic gradient and impairing concentrating ability.",strongestDistractorAnalysis:"‘Gradient strengthens’ is the strongest distractor: it inverts the correct relationship. Students who assume more blood flow generically means more efficient function (as with increased flow elsewhere in the body) miss that, specifically for vasa recta, slow flow — not fast flow — is what preserves the gradient by allowing full equilibration.",conceptId:"C_U2T21R_ADV"},{id:"U2R_ADV_08",unit:"U2",topic:"U2T22R",concept:"C_U2T22R_ADV",type:"HOTS",stem:"ADH is absent. What happens to collecting-duct water permeability?",options:["Permeability increases","GFR stops","Aldosterone disappears","Permeability decreases and urine dilutes"],answer:3,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T22R_CLINICAL_APPLICATION_ERROR",explanation:"“Permeability decreases and urine dilutes” is correct: in the absence of ADH, aquaporin-2 channels are not inserted into the collecting-duct apical membrane, so the duct remains water-impermeable; the already-dilute fluid delivered from the ascending limb passes through largely unmodified, producing dilute urine.",strongestDistractorAnalysis:"‘Permeability increases’ is the strongest distractor: it inverts the correct relationship, the same ADH-direction error tested in this topic's MCQs. Students who have not fixed that ADH's presence (not its absence) increases permeability select the opposite outcome when ADH is stated to be absent.",conceptId:"C_U2T22R_ADV"},{id:"U2R_ADV_09",unit:"U2",topic:"U2T23R",concept:"C_U2T23R_ADV",type:"Case-based",stem:"Severe haemorrhage activates sympathetic nerves. What renal response is expected?",options:["Renal vasoconstriction and renin release","Marked natriuresis","Renin suppression","No change"],answer:0,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T23R_CLINICAL_APPLICATION_ERROR",explanation:"“Renal vasoconstriction and renin release” is correct: severe haemorrhage triggers strong sympathetic activation, which constricts renal afferent and efferent arterioles to protect systemic blood pressure and directly stimulates renin release from juxtaglomerular cells, initiating RAAS activation to restore volume and pressure.",strongestDistractorAnalysis:"‘Marked natriuresis’ is the strongest distractor: it describes the opposite physiological response. Students who know the kidney has natriuretic mechanisms (such as ANP) available may wrongly predict this response during haemorrhage, missing that severe volume loss triggers sodium- and water-retaining mechanisms (RAAS), not natriuretic ones.",conceptId:"C_U2T23R_ADV"},{id:"U2R_ADV_10",unit:"U2",topic:"U2T24R",concept:"C_U2T24R_ADV",type:"HOTS",stem:"A pudendal nerve lesion affects which component of continence?",options:["ADH synthesis","Voluntary control of external sphincter","Renin secretion","Glomerular filtration"],answer:1,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T24R_CLINICAL_APPLICATION_ERROR",explanation:"“Voluntary control of external sphincter” is correct: the external urethral sphincter is innervated by the somatic pudendal nerve; a lesion here would impair voluntary, conscious control over sphincter closure, potentially causing incontinence, while leaving the autonomic detrusor reflex itself intact.",strongestDistractorAnalysis:"‘Renin secretion’ is the strongest distractor among the incorrect options: it is a genuine renal regulatory process discussed elsewhere in this unit, so students select a plausible-sounding renal term without checking that renin secretion is a juxtaglomerular, hormonal process entirely unrelated to pudendal nerve function, which governs skeletal muscle control of the external sphincter.",conceptId:"C_U2T24R_ADV"},{id:"U2R_ADV_11",unit:"U2",topic:"U2T25R",concept:"C_U2T25R_ADV",type:"Case-based",stem:"A patient with chronic respiratory acidosis shows raised bicarbonate. What organ mediates this compensation?",options:["Skin only","SA node","Kidney","Platelets"],answer:2,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T25R_CLINICAL_APPLICATION_ERROR",explanation:"“Kidney” is correct: in chronic respiratory acidosis, sustained hypercapnia drives the kidney to increase net acid excretion and generate additional new bicarbonate over hours to days, raising plasma bicarbonate to partially compensate for the persistently low pH — a slower, renal (metabolic) compensation for a respiratory disturbance.",strongestDistractorAnalysis:"None of the listed distractors (skin, SA node, platelets) have any acid–base regulatory function — they are unrelated organ systems and cell types. This item primarily tests whether the kidney has been identified as the organ responsible for metabolic compensation of a chronic respiratory disturbance.",conceptId:"C_U2T25R_ADV"},{id:"U2R_ADV_12",unit:"U2",topic:"U2T26R",concept:"C_U2T26R_ADV",type:"HOTS",stem:"A patient takes an ACE inhibitor. Which product decreases?",options:["Renin","Angiotensinogen","ANP","Angiotensin II"],answer:3,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T26R_CLINICAL_APPLICATION_ERROR",explanation:"“Angiotensin II” is correct: ACE inhibitors block the enzyme that converts angiotensin I to angiotensin II, so a patient taking one will show reduced circulating angiotensin II (and consequently reduced aldosterone release), the therapeutic basis for their use in hypertension and heart failure.",strongestDistractorAnalysis:"Renin is the strongest distractor: it is the RAAS component students most associate with ‘the start of the cascade’, but ACE inhibitors act further downstream, blocking the conversion step, not renin release itself — in fact, by interrupting negative feedback, ACE inhibitors typically cause a compensatory rise, not a fall, in renin.",conceptId:"C_U2T26R_ADV"},{id:"U2R_ADV_13",unit:"U2",topic:"U2T27R",concept:"C_U2T27R_ADV",type:"Case-based",stem:"ANP rises during atrial stretch. What renal response follows?",options:["Natriuresis increases","Sodium retention increases","Renin increases","ADH increases obligatorily"],answer:0,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T27R_CLINICAL_APPLICATION_ERROR",explanation:"“Natriuresis increases” is correct: atrial stretch (from increased venous return or blood volume) triggers ANP release, which promotes sodium and water excretion (natriuresis) by increasing GFR and directly inhibiting collecting-duct sodium reabsorption, helping to reduce circulating volume back towards normal.",strongestDistractorAnalysis:"‘ADH increases obligatorily’ is the strongest distractor: students who know atrial stretch is a volume-sensing signal assume all volume-regulating hormones respond in the same direction, missing that ANP release in response to atrial stretch specifically opposes fluid retention, whereas ADH release is triggered by a different set of stimuli (osmolality, severe hypovolaemia), not obligately by atrial stretch itself.",conceptId:"C_U2T27R_ADV"},{id:"U2R_ADV_14",unit:"U2",topic:"U2T28R",concept:"C_U2T28R_ADV",type:"HOTS",stem:"Urine inulin is 50 mg/mL, flow 2 mL/min and plasma inulin 1 mg/mL. What is clearance?",options:["2 mL/min","100 mL/min","25 mL/min","50 mL/min"],answer:1,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T28R_CLINICAL_APPLICATION_ERROR",explanation:"‘100 mL/min’ is correct. Clearance = U × V / P. Substituting the given values: 50 mg/mL × 2 mL/min ÷ 1 mg/mL = 100 mL/min. Because inulin is freely filtered and neither reabsorbed nor secreted, this clearance value directly estimates the glomerular filtration rate.",strongestDistractorAnalysis:"‘2 mL/min’ is the strongest distractor: it is simply the urine flow rate (V) restated without applying the clearance formula at all. Students who are unsure which of the three given numbers to combine, and how, select the most prominent single value from the stem rather than performing the U×V/P calculation.",conceptId:"C_U2T28R_ADV"},{id:"U2R_ADV_15",unit:"U2",topic:"U2T29R",concept:"C_U2T29R_ADV",type:"Case-based",stem:"A patient has heavy proteinuria and oedema. Which syndrome is most likely?",options:["Haemophilia","Hyperthyroidism","Nephrotic syndrome","Polycythaemia"],answer:2,difficulty:"high",cognitiveLevel:"analyse",diagnosticCategory:"clinical-application-error",misconceptionId:"MIS_U2T29R_CLINICAL_APPLICATION_ERROR",explanation:"“Nephrotic syndrome” is correct: the combination of heavy proteinuria and oedema is the hallmark presentation of nephrotic syndrome, arising from severe glomerular filtration barrier damage that permits large-scale protein loss, depleting plasma albumin and reducing plasma oncotic pressure to drive fluid into the interstitium.",strongestDistractorAnalysis:"None of the listed distractors (haemophilia, hyperthyroidism, polycythaemia) produce this specific combination of heavy proteinuria and oedema through a glomerular mechanism — they are unrelated haematological and endocrine conditions. This item primarily tests whether the classic proteinuria–oedema presentation has been linked to its defining renal syndrome.",conceptId:"C_U2T29R_ADV"},{id:"EXP001",unit:"U3",topic:"U3T1",type:"MCQ",stem:"Which neuronal region normally integrates most incoming postsynaptic potentials?",options:["Axon terminal","Myelin sheath","Cell body and axon hillock","Node of Ranvier"],answer:2,explanation:"The soma and axon hillock integrate excitatory and inhibitory postsynaptic potentials before threshold is reached. The axon terminal chiefly releases neurotransmitter.",strongestDistractorAnalysis:"Strongest distractor: “Axon terminal”. Why it is plausible: the axon terminal is a specialised neuronal region involved in synaptic communication, so it may be mistaken for a site where incoming signals are processed. Why it is incorrect: It is a neuronal output region, but it releases transmitter rather than integrating most incoming postsynaptic potentials. Misconception detected: Confusion between neuronal input integration and synaptic output.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U3T1_CORE",concept:"C_U3T1_CORE",misconceptionId:"MIS_NEURON_AXON_DENDRITE_CONFUSION"},{id:"EXP002",unit:"U3",topic:"U3T1",type:"Diagram-oriented MCQ",stem:"In a labelled neuron, the process carrying impulses away from the soma is the:",options:["Axon","Nucleus","Dendrite","Nissl body"],answer:0,explanation:"The axon conducts action potentials away from the soma. Dendrites are specialised mainly for receiving synaptic input.",strongestDistractorAnalysis:"Strongest distractor: “Dendrite”. Why it is plausible: both axons and dendrites are elongated neuronal processes that conduct electrical changes, making their direction of information flow easy to confuse. Why it is incorrect: Dendrites receive synaptic input and usually conduct graded potentials towards the soma; the axon carries action potentials away from it. Misconception detected: Confusion between dendritic input and axonal output.",difficulty:"easy",cognitiveLevel:"apply",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U3T1_CORE",concept:"C_U3T1_CORE",misconceptionId:"MIS_NEURON_AXON_DENDRITE_CONFUSION"},{id:"EXP003",unit:"U3",topic:"U3T2",type:"MCQ",stem:"The sodium–potassium pump transports:",options:["Three sodium ions out and two potassium ions in","Only potassium ions","Two sodium ions out and three potassium ions in","Equal numbers of sodium and potassium ions"],answer:0,explanation:"The Na⁺/K⁺-ATPase is electrogenic and maintains the gradients underlying resting membrane potential by exporting three Na⁺ for every two K⁺ imported.",strongestDistractorAnalysis:"Strongest distractor: “Equal numbers of sodium and potassium ions”. Why it is plausible: the pump exchanges both sodium and potassium, so an electroneutral one-for-one exchange may seem intuitively reasonable. Why it is incorrect: The pump transports both ions, but its stoichiometry is three sodium ions out for two potassium ions in. Misconception detected: Confusion about Na⁺/K⁺-ATPase stoichiometry.",difficulty:"easy",cognitiveLevel:"remember",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U3T2_CORE",concept:"C_U3T2_CORE",misconceptionId:"MIS_RMP_PUMP_VS_PERMEABILITY"},{id:"EXP004",unit:"U3",topic:"U3T2",type:"HOTS",stem:"Marked elevation of extracellular potassium usually makes the resting membrane potential:",options:["More negative","Unchanged","Less negative","Equal to the calcium equilibrium potential"],answer:2,explanation:"Raised extracellular K⁺ reduces the outward potassium gradient, so the potassium equilibrium potential and resting potential become less negative.",strongestDistractorAnalysis:"Strongest distractor: “More negative”. Why it is plausible: potassium is strongly associated with the negative resting potential, so increasing extracellular potassium may be wrongly assumed to make the cell more negative. Why it is incorrect: Raised extracellular potassium reduces the outward potassium gradient and makes the resting potential less negative. Misconception detected: Incorrect prediction of extracellular potassium effects.",difficulty:"hard",cognitiveLevel:"analyse",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U3T2_CORE",concept:"C_U3T2_CORE",misconceptionId:"MIS_RMP_EXTRACELLULAR_K_EFFECT"},{id:"EXP005",unit:"U3",topic:"U3T3",type:"MCQ",stem:"The absolute refractory period is caused mainly by:",options:["Opening of ligand-gated chloride channels","Failure of the sodium–potassium pump","Inactivation of voltage-gated sodium channels","Depletion of extracellular potassium"],answer:2,explanation:"Most voltage-gated Na⁺ channels are inactivated during the absolute refractory period and cannot reopen until repolarisation restores availability.",strongestDistractorAnalysis:"Strongest distractor: “Failure of the sodium–potassium pump”. Why it is plausible: the sodium–potassium pump maintains the ionic gradients required for excitability, so it may be mistaken for the immediate cause of refractoriness. Why it is incorrect: The pump maintains long-term gradients, but the immediate absolute refractory period is caused by sodium-channel inactivation. Misconception detected: Confusion between gradient maintenance and channel-state refractoriness.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U3T3_CORE",concept:"C_U3T3_CORE",misconceptionId:"MIS_REFRACTORY_PERIOD_CHANNEL_STATE"},{id:"EXP006",unit:"U3",topic:"U3T3",type:"Diagram-oriented MCQ",stem:"On an action-potential graph, the rapid rising phase represents mainly:",options:["Sodium influx","Calcium removal by SERCA","Potassium efflux","Chloride influx"],answer:0,explanation:"Rapid depolarisation is produced chiefly by Na⁺ influx through voltage-gated sodium channels. K⁺ efflux dominates repolarisation.",strongestDistractorAnalysis:"Strongest distractor: “Potassium efflux”. Why it is plausible: potassium movement is central to the action potential and dominates the falling phase, so the rising and falling ionic currents are commonly reversed. Why it is incorrect: Potassium efflux produces repolarisation; rapid depolarisation is produced mainly by sodium influx. Misconception detected: Confusion between depolarisation and repolarisation ion movements.",difficulty:"easy",cognitiveLevel:"apply",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U3T3_CORE",concept:"C_U3T3_CORE",misconceptionId:"MIS_ACTION_POTENTIAL_NA_K_SEQUENCE"},{id:"EXP007",unit:"U3",topic:"U3T4",type:"MCQ",stem:"Conduction velocity is greatest in an axon that is:",options:["Large and myelinated","Large but lacking ion channels","Small and unmyelinated","Small and heavily branched"],answer:0,explanation:"Large diameter lowers internal resistance, while myelin reduces current loss and capacitance. Together these properties accelerate propagation.",strongestDistractorAnalysis:"Strongest distractor: “Small and unmyelinated”. Why it is plausible: all axons conduct action potentials, and a smaller fibre may be incorrectly assumed to conduct faster because ions have a shorter distance to cross. Why it is incorrect: Small diameter raises internal resistance and absent myelin increases current loss, so conduction is slower. Misconception detected: Confusion about axon diameter and myelination.",difficulty:"easy",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U3T4_CORE",concept:"C_U3T4_CORE",misconceptionId:"MIS_MYELIN_CONDUCTION_ROLE"},{id:"EXP008",unit:"U3",topic:"U3T4",type:"Case-based",stem:"Demyelination slows conduction primarily because it:",options:["Raises membrane resistance","Eliminates the sodium gradient immediately","Increases current leakage across the membrane","Shortens synaptic delay"],answer:2,explanation:"Myelin normally raises membrane resistance. Its loss permits current leakage and may prevent depolarising current from reaching the next node.",strongestDistractorAnalysis:"Strongest distractor: “Raises membrane resistance”. Why it is plausible: myelin is an electrical insulator that raises membrane resistance, so students may accidentally attribute that same effect to its loss. Why it is incorrect: Myelin raises membrane resistance; demyelination lowers it and permits current leakage. Misconception detected: Reversal of myelin’s electrical effect.",difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U3T4_CORE",concept:"C_U3T4_CORE",misconceptionId:"MIS_MYELIN_CONDUCTION_ROLE"},{id:"EXP009",unit:"U3",topic:"U3T5",type:"MCQ",stem:"An inhibitory postsynaptic potential commonly results from:",options:["Sodium influx","Presynaptic calcium entry alone","Chloride influx or potassium efflux","Closure of every leak channel"],answer:2,explanation:"Opening Cl⁻ or K⁺ channels hyperpolarises or stabilises the postsynaptic membrane away from threshold, reducing firing probability.",strongestDistractorAnalysis:"Strongest distractor: “Sodium influx”. Why it is plausible: sodium entry is a common postsynaptic ion movement and is strongly associated with synaptic transmission, even though it usually produces excitation. Why it is incorrect: Sodium influx commonly depolarises the postsynaptic membrane and tends to produce excitation rather than inhibition. Misconception detected: Confusion between excitation and inhibition.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U3T5_CORE",concept:"C_U3T5_CORE",misconceptionId:"MIS_TEMPORAL_SPATIAL_SUMMATION"},{id:"EXP010",unit:"U3",topic:"U3T5",type:"Case-based",stem:"Blocking presynaptic voltage-gated calcium channels immediately reduces:",options:["Neurotransmitter release","Postsynaptic receptor number","Axonal resting potential","Myelin synthesis"],answer:0,explanation:"Calcium entry into the presynaptic terminal is the immediate trigger for synaptic-vesicle fusion and transmitter release.",strongestDistractorAnalysis:"Strongest distractor: “Postsynaptic receptor number”. Why it is plausible: postsynaptic receptor number strongly influences synaptic strength, so it may be confused with the presynaptic mechanism that controls immediate transmitter release. Why it is incorrect: Receptor number affects responsiveness, but blocking presynaptic calcium immediately prevents vesicle fusion and transmitter release. Misconception detected: Confusion between presynaptic release and postsynaptic sensitivity.",difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U3T5_CORE",concept:"C_U3T5_CORE",misconceptionId:"MIS_SYNAPTIC_CA_RELEASE_SEQUENCE"},{id:"EXP011",unit:"U3",topic:"U3T6",type:"MCQ",stem:"Reciprocal inhibition means that:",options:["The antagonist is inhibited while the agonist contracts","The reflex requires conscious initiation","Agonist and antagonist contract equally","The sensory limb bypasses the spinal cord"],answer:0,explanation:"Inhibitory interneurons suppress the antagonist while the agonist motor pathway is activated, permitting coordinated movement.",strongestDistractorAnalysis:"Strongest distractor: “Agonist and antagonist contract equally”. Why it is plausible: agonists and antagonists can contract together during joint stabilisation, so co-contraction may be confused with reciprocal inhibition. Why it is incorrect: Reciprocal inhibition suppresses the antagonist while the agonist is activated; equal contraction describes co-contraction. Misconception detected: Confusion between reciprocal inhibition and co-contraction.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U3T6_CORE",concept:"C_U3T6_CORE",misconceptionId:"MIS_REFLEX_DORSAL_VENTRAL_ROOT"},{id:"EXP012",unit:"U3",topic:"U3T6",type:"Practical-context MCQ",stem:"Damage to a dorsal root primarily interrupts the:",options:["Motor limb of a spinal reflex","Neuromuscular junction","Sensory limb of a spinal reflex","Muscle contractile apparatus"],answer:2,explanation:"Dorsal roots carry sensory afferents into the spinal cord, whereas motor efferents leave mainly through ventral roots.",strongestDistractorAnalysis:"Strongest distractor: “Motor limb of a spinal reflex”. Why it is plausible: both dorsal and ventral roots participate in the same spinal reflex arc, and their sensory and motor functions are frequently interchanged. Why it is incorrect: Motor efferents leave mainly through the ventral root; the dorsal root carries sensory afferents. Misconception detected: Confusion between dorsal sensory and ventral motor roots.",difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U3T6_CORE",concept:"C_U3T6_CORE",misconceptionId:"MIS_REFLEX_DORSAL_VENTRAL_ROOT"},{id:"EXP013",unit:"U3",topic:"U3T7",type:"MCQ",stem:"During skeletal-muscle shortening, which sarcomere region remains approximately constant in length?",options:["I band","H zone","A band","Distance between Z discs"],answer:2,explanation:"The A band corresponds to thick-filament length and remains essentially constant; the I band and H zone shorten as overlap increases.",strongestDistractorAnalysis:"Strongest distractor: “I band”. Why it is plausible: the I band is a prominent labelled sarcomere region and changes during contraction, so it is often selected when students do not distinguish variable from constant bands. Why it is incorrect: The I band shortens as overlap increases; the A band reflects thick-filament length and remains approximately constant. Misconception detected: Confusion about sarcomere band changes.",difficulty:"easy",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U3T7_CORE",concept:"C_U3T7_CORE",misconceptionId:"MIS_SARCOMERE_BAND_CHANGE"},{id:"EXP014",unit:"U3",topic:"U3T7",type:"Diagram-oriented MCQ",stem:"In a labelled sarcomere, the Z disc marks the:",options:["Boundary of a sarcomere","Motor end plate","Centre of the A band","Site of calcium storage"],answer:0,explanation:"A sarcomere extends from one Z disc to the next. The M line lies at the centre of the A band.",strongestDistractorAnalysis:"Strongest distractor: “Centre of the A band”. Why it is plausible: the Z disc and M line are both conspicuous vertical landmarks in sarcomere diagrams, making their positions easy to interchange. Why it is incorrect: The M line occupies the centre of the A band; Z discs define sarcomere boundaries. Misconception detected: Confusion between the Z disc and M line.",difficulty:"easy",cognitiveLevel:"apply",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U3T7_CORE",concept:"C_U3T7_CORE",misconceptionId:"MIS_SARCOMERE_BAND_CHANGE"},{id:"EXP015",unit:"U3",topic:"U3T8",type:"MCQ",stem:"The skeletal-muscle motor end plate contains mainly:",options:["Nicotinic acetylcholine receptors","Beta-adrenergic receptors","Muscarinic acetylcholine receptors","GABA-A receptors"],answer:0,explanation:"Nicotinic acetylcholine receptors are ligand-gated cation channels that generate the end-plate potential.",strongestDistractorAnalysis:"Strongest distractor: “Muscarinic acetylcholine receptors”. Why it is plausible: muscarinic and nicotinic receptors both bind acetylcholine and belong to cholinergic signalling, so the receptor subtype at skeletal muscle can be confused. Why it is incorrect: Muscarinic receptors also bind acetylcholine, but the skeletal motor end plate uses nicotinic ligand-gated receptors. Misconception detected: Confusion between nicotinic and muscarinic receptors.",difficulty:"easy",cognitiveLevel:"remember",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U3T8_CORE",concept:"C_U3T8_CORE",misconceptionId:"MIS_NMJ_RECEPTOR_CONFUSION"},{id:"EXP016",unit:"U3",topic:"U3T8",type:"Case-based",stem:"Myasthenia gravis commonly causes fatigable weakness by reducing functional:",options:["Muscle troponin","Motor-neuron myelin","Postsynaptic nicotinic receptors","Acetylcholine synthesis in all cases"],answer:2,explanation:"Loss of functional postsynaptic receptors lowers the safety factor for neuromuscular transmission, so repeated activity more readily fails.",strongestDistractorAnalysis:"Strongest distractor: “Motor-neuron myelin”. Why it is plausible: demyelinating disorders and neuromuscular-junction disorders can both produce weakness and fatigability, making motor-neuron myelin a clinically plausible alternative. Why it is incorrect: Demyelination impairs conduction, but myasthenia gravis chiefly reduces postsynaptic nicotinic receptors. Misconception detected: Confusion between neuromuscular-junction and demyelinating disease.",difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U3T8_CORE",concept:"C_U3T8_CORE",misconceptionId:"MIS_NMJ_RECEPTOR_CONFUSION"},{id:"EXP017",unit:"U3",topic:"U3T9",type:"MCQ",stem:"In skeletal muscle, the dihydropyridine receptor acts mainly as a:",options:["Calcium pump in the sarcoplasmic reticulum","Myosin ATPase","Voltage sensor in the T-tubule membrane","Nicotinic receptor"],answer:2,explanation:"The dihydropyridine receptor senses T-tubule depolarisation and activates the ryanodine receptor to release sarcoplasmic-reticulum calcium.",strongestDistractorAnalysis:"Strongest distractor: “Calcium pump in the sarcoplasmic reticulum”. Why it is plausible: the dihydropyridine receptor lies within the calcium-handling triad close to the sarcoplasmic reticulum, so it may be confused with the SERCA calcium pump. Why it is incorrect: SERCA is the calcium pump; the dihydropyridine receptor is the T-tubule voltage sensor. Misconception detected: Confusion among DHPR, RyR and SERCA.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U3T9_CORE",concept:"C_U3T9_CORE",misconceptionId:"MIS_SERCA_VS_RYR_ROLE"},{id:"EXP018",unit:"U3",topic:"U3T9",type:"HOTS",stem:"Inhibition of SERCA would cause:",options:["Prolonged cytosolic calcium and delayed relaxation","Immediate loss of all ATP","Faster relaxation","Failure of acetylcholine release"],answer:0,explanation:"SERCA pumps Ca²⁺ back into the sarcoplasmic reticulum. Inhibition leaves cytosolic calcium elevated and prolongs contraction.",strongestDistractorAnalysis:"Strongest distractor: “Faster relaxation”. Why it is plausible: SERCA is directly associated with muscle relaxation, so students may mistakenly assume that inhibiting a relaxation-related protein would shorten rather than delay relaxation. Why it is incorrect: SERCA is required for calcium removal, so inhibition prolongs cytosolic calcium and delays relaxation. Misconception detected: Reversal of SERCA’s role.",difficulty:"hard",cognitiveLevel:"analyse",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U3T9_CORE",concept:"C_U3T9_CORE",misconceptionId:"MIS_SERCA_VS_RYR_ROLE"},{id:"EXP019",unit:"U3",topic:"U3T10",type:"MCQ",stem:"The fastest short-term ATP-buffering system during intense activity is:",options:["Phosphocreatine","Ketone oxidation","Oxidative phosphorylation","Protein catabolism"],answer:0,explanation:"Phosphocreatine rapidly donates phosphate to ADP through creatine kinase during the first seconds of intense activity.",strongestDistractorAnalysis:"Strongest distractor: “Oxidative phosphorylation”. Why it is plausible: oxidative phosphorylation produces most ATP during sustained exercise and is therefore easily mistaken for the fastest immediate ATP-buffering system. Why it is incorrect: Oxidative phosphorylation supports sustained ATP production, whereas phosphocreatine responds most rapidly in the first seconds. Misconception detected: Confusion between immediate and sustained ATP supply.",difficulty:"easy",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U3T10_CORE",concept:"C_U3T10_CORE",misconceptionId:"MIS_MUSCLE_FIBRE_ENERGY_SYSTEM"},{id:"EXP020",unit:"U3",topic:"U3T10",type:"Case-based",stem:"Endurance exercise relies heavily on fibres that are:",options:["Type IIx and rapidly fatigable","Non-striated and involuntary","Type I, oxidative and fatigue resistant","Denervated"],answer:2,explanation:"Type I fibres contain abundant mitochondria, myoglobin and capillaries, making them suited to sustained aerobic work.",strongestDistractorAnalysis:"Strongest distractor: “Type IIx and rapidly fatigable”. Why it is plausible: Type IIx fibres generate rapid, powerful contractions and are prominent during intense exercise, so power output may be confused with endurance capacity. Why it is incorrect: Type IIx fibres generate high power but fatigue rapidly; endurance relies mainly on oxidative Type I fibres. Misconception detected: Confusion between fast glycolytic and slow oxidative fibres.",difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U3T10_CORE",concept:"C_U3T10_CORE",misconceptionId:"MIS_MUSCLE_FIBRE_ENERGY_SYSTEM"},{id:"EXP021",unit:"U4",topic:"U4T1",type:"MCQ",stem:"A hormone can directly affect only cells possessing the appropriate:",options:["Capillary bed","Nucleus","Mitochondrion","Receptor"],answer:3,explanation:"Hormonal specificity depends on receptor expression and receptor-coupled signalling, not merely delivery of hormone to the tissue.",strongestDistractorAnalysis:"Strongest distractor: “Nucleus”. Why it is plausible: many hormones ultimately alter nuclear gene expression, so the presence of a nucleus may be mistaken for the feature that defines a target cell. Why it is incorrect: A nucleus is needed for many genomic effects, but receptor expression—not nuclear presence alone—defines target-cell specificity. Misconception detected: Confusion between receptor specificity and intracellular location.",difficulty:"easy",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U4T1_CORE",concept:"C_U4T1_CORE",misconceptionId:"MIS_HORMONE_RECEPTOR_SPECIFICITY"},{id:"EXP022",unit:"U4",topic:"U4T1",type:"Case-based",stem:"A peptide hormone usually signals through:",options:["Ribosomal RNA","A membrane receptor and second messenger","Direct binding to nuclear DNA","Passive diffusion through cholesterol"],answer:1,explanation:"Most peptide hormones are poorly lipid soluble and therefore bind cell-surface receptors that activate intracellular second messengers.",strongestDistractorAnalysis:"Strongest distractor: “Direct binding to nuclear DNA”. Why it is plausible: several hormones regulate transcription through intracellular receptors, so direct nuclear action may be overgeneralised to water-soluble peptide hormones. Why it is incorrect: This describes steroid or thyroid hormone action; most peptide hormones use membrane receptors and second messengers. Misconception detected: Confusion between peptide and lipid-soluble hormone signalling.",difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U4T1_CORE",concept:"C_U4T1_CORE",misconceptionId:"MIS_PEPTIDE_VS_STEROID_RECEPTOR"},{id:"EXP023",unit:"U4",topic:"U4T2",type:"MCQ",stem:"Which posterior-pituitary hormone is synthesised in hypothalamic neurons?",options:["Growth hormone","Antidiuretic hormone","TSH","ACTH"],answer:1,explanation:"ADH is synthesised in hypothalamic nuclei and transported down axons for storage and release from the posterior pituitary.",strongestDistractorAnalysis:"Strongest distractor: “Growth hormone”. Why it is plausible: growth hormone is a major pituitary hormone and is closely associated with pituitary function, so anterior synthesis may be confused with posterior release. Why it is incorrect: Growth hormone is synthesised by anterior-pituitary somatotrophs; ADH is synthesised in hypothalamic neurons and released posteriorly. Misconception detected: Confusion between anterior-pituitary synthesis and posterior-pituitary release.",difficulty:"easy",cognitiveLevel:"remember",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U4T2_CORE",concept:"C_U4T2_CORE",misconceptionId:"MIS_ANTERIOR_POSTERIOR_PITUITARY"},{id:"EXP024",unit:"U4",topic:"U4T2",type:"Diagram-oriented MCQ",stem:"Hypothalamic releasing hormones reach the anterior pituitary through the:",options:["Coronary circulation","Vasa recta","Thoracic duct","Hypophyseal portal system"],answer:3,explanation:"The portal system delivers hypothalamic factors directly to anterior-pituitary cells at high local concentrations.",strongestDistractorAnalysis:"Strongest distractor: “Coronary circulation”. Why it is plausible: the coronary circulation is a specialised named vascular bed, so it may be chosen when the distinct portal route between hypothalamus and anterior pituitary is not recalled. Why it is incorrect: Coronary vessels supply the heart; hypothalamic factors reach the anterior pituitary through the hypophyseal portal system. Misconception detected: Confusion between portal and systemic vascular beds.",difficulty:"easy",cognitiveLevel:"apply",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U4T2_CORE",concept:"C_U4T2_CORE",misconceptionId:"MIS_ANTERIOR_POSTERIOR_PITUITARY"},{id:"EXP025",unit:"U4",topic:"U4T3",type:"MCQ",stem:"Thyroid peroxidase is required for:",options:["Cortisol synthesis","Insulin receptor phosphorylation","PTH secretion","Iodide oxidation, organification and coupling"],answer:3,explanation:"Thyroid peroxidase catalyses key steps in T3 and T4 synthesis, including iodide oxidation, organification and coupling of iodotyrosines.",strongestDistractorAnalysis:"Strongest distractor: “Insulin receptor phosphorylation”. Why it is plausible: both thyroid peroxidase and insulin-receptor phosphorylation involve endocrine enzymes and phosphorylation-related chemistry, so their functions may be conflated. Why it is incorrect: The insulin receptor is a receptor tyrosine kinase; thyroid peroxidase catalyses iodide oxidation, organification and coupling. Misconception detected: Confusion between thyroid synthesis enzymes and receptor signalling.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U4T3_CORE",concept:"C_U4T3_CORE",misconceptionId:"MIS_THYROID_SYNTHESIS_ENZYME"},{id:"EXP026",unit:"U4",topic:"U4T3",type:"Case-based",stem:"Primary hypothyroidism usually produces:",options:["High T4 and high TSH","Low T4 and high TSH","High T4 and low TSH","Low T4 and low TSH"],answer:1,explanation:"Thyroid failure lowers T4, reducing negative feedback and increasing pituitary TSH. Low T4 with low TSH suggests central disease.",strongestDistractorAnalysis:"Strongest distractor: “Low T4 and low TSH”. Why it is plausible: both T4 and TSH can be low in central hypothyroidism, and students may incorrectly assume that failure of any part of the thyroid axis lowers both hormones. Why it is incorrect: That pattern indicates central failure; primary thyroid failure causes low T4 with compensatory high TSH. Misconception detected: Confusion between primary and central hypothyroidism.",difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U4T3_CORE",concept:"C_U4T3_CORE",misconceptionId:"MIS_PRIMARY_VS_CENTRAL_THYROID"},{id:"EXP027",unit:"U4",topic:"U4T4",type:"MCQ",stem:"Parathyroid hormone lowers plasma phosphate partly by:",options:["Suppressing all bone turnover","Decreasing renal phosphate reabsorption","Increasing renal phosphate reabsorption","Blocking vitamin D activation"],answer:1,explanation:"PTH decreases proximal tubular phosphate reabsorption, causing phosphaturia while helping raise extracellular calcium.",strongestDistractorAnalysis:"Strongest distractor: “Increasing renal phosphate reabsorption”. Why it is plausible: PTH conserves calcium in the kidney, so students may incorrectly assume that it also conserves phosphate, the other major mineral in bone. Why it is incorrect: This would retain phosphate; PTH lowers plasma phosphate by reducing proximal tubular reabsorption. Misconception detected: Reversal of PTH’s phosphate effect.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U4T4_CORE",concept:"C_U4T4_CORE",misconceptionId:"MIS_PTH_CALCIUM_PHOSPHATE_EFFECT"},{id:"EXP028",unit:"U4",topic:"U4T4",type:"Case-based",stem:"After parathyroidectomy, the immediate major risk is:",options:["Hypercalcaemia","Severe hypernatraemia","Polycythaemia","Hypocalcaemic neuromuscular excitability"],answer:3,explanation:"Loss of PTH can lower plasma calcium and increase neuromuscular excitability, potentially producing tetany.",strongestDistractorAnalysis:"Strongest distractor: “Hypercalcaemia”. Why it is plausible: the parathyroid glands are strongly associated with raising blood calcium, so the direction of the calcium change after their removal may be mentally reversed. Why it is incorrect: Parathyroid removal lowers PTH and can cause hypocalcaemia with increased neuromuscular excitability. Misconception detected: Reversal of the expected calcium disturbance.",difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U4T4_CORE",concept:"C_U4T4_CORE",misconceptionId:"MIS_PTH_CALCIUM_PHOSPHATE_EFFECT"},{id:"EXP029",unit:"U4",topic:"U4T5",type:"MCQ",stem:"Aldosterone is produced mainly in the adrenal:",options:["Zona fasciculata","Zona reticularis","Medulla","Zona glomerulosa"],answer:3,explanation:"The zona glomerulosa synthesises mineralocorticoids; the fasciculata produces cortisol, the reticularis androgens, and the medulla catecholamines.",strongestDistractorAnalysis:"Strongest distractor: “Zona fasciculata”. Why it is plausible: the zona fasciculata is the largest and most familiar adrenal cortical zone, so it may be incorrectly generalised as the source of all cortical hormones. Why it is incorrect: The fasciculata mainly produces cortisol; aldosterone is produced in the zona glomerulosa. Misconception detected: Confusion among adrenal cortical zones.",difficulty:"easy",cognitiveLevel:"remember",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U4T5_CORE",concept:"C_U4T5_CORE",misconceptionId:"MIS_ADRENAL_ZONE_HORMONE"},{id:"EXP030",unit:"U4",topic:"U4T5",type:"Diagram-oriented MCQ",stem:"In an adrenal diagram, the medulla releases:",options:["Thyroxine","Adrenaline and noradrenaline","Cortisol","Aldosterone"],answer:1,explanation:"Chromaffin cells of the adrenal medulla release catecholamines under sympathetic control; steroid hormones arise from the cortex.",strongestDistractorAnalysis:"Strongest distractor: “Cortisol”. Why it is plausible: cortisol is one of the best-known adrenal hormones, so the distinction between cortical steroid secretion and medullary catecholamine secretion may be overlooked. Why it is incorrect: Cortisol is a cortical glucocorticoid; the medulla releases adrenaline and noradrenaline. Misconception detected: Confusion between adrenal cortical and medullary hormones.",difficulty:"easy",cognitiveLevel:"apply",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U4T5_CORE",concept:"C_U4T5_CORE",misconceptionId:"MIS_ADRENAL_ZONE_HORMONE"},{id:"EXP031",unit:"U4",topic:"U4T6",type:"MCQ",stem:"Insulin increases skeletal-muscle glucose uptake by promoting:",options:["Glycogen breakdown","GLUT4 translocation","SGLT1 insertion","Glucagon secretion"],answer:1,explanation:"Insulin signalling moves GLUT4 to the plasma membrane in skeletal muscle and adipose tissue, increasing facilitated glucose entry.",strongestDistractorAnalysis:"Strongest distractor: “SGLT1 insertion”. Why it is plausible: SGLT1 is a well-known glucose transporter in intestinal and renal absorption, so it may be incorrectly transferred to insulin-dependent skeletal muscle uptake. Why it is incorrect: SGLT1 functions mainly in intestine and kidney; insulin-regulated muscle glucose uptake uses GLUT4. Misconception detected: Confusion between SGLT1 and GLUT4.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U4T6_CORE",concept:"C_U4T6_CORE",misconceptionId:"MIS_INSULIN_GLUT4_MECHANISM"},{id:"EXP032",unit:"U4",topic:"U4T6",type:"Case-based",stem:"Destruction of pancreatic beta cells produces hyperglycaemia mainly through:",options:["Excess GLUT4 translocation","Lactase deficiency","Universal excess somatostatin","Insulin deficiency"],answer:3,explanation:"Insulin deficiency reduces glucose uptake and storage while allowing increased hepatic glucose production.",strongestDistractorAnalysis:"Strongest distractor: “Excess GLUT4 translocation”. Why it is plausible: GLUT4 is central to insulin action, so increased GLUT4 movement may be mistaken for a cause of beta-cell-related hyperglycaemia rather than an insulin-dependent glucose-lowering response. Why it is incorrect: More GLUT4 translocation would lower glucose; beta-cell destruction causes insulin deficiency and reduced GLUT4 recruitment. Misconception detected: Reversal of insulin’s effect on glucose uptake.",difficulty:"moderate",cognitiveLevel:"analyse",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U4T6_CORE",concept:"C_U4T6_CORE",misconceptionId:"MIS_INSULIN_GLUT4_MECHANISM"},{id:"EXP033",unit:"U4",topic:"U4T7",type:"MCQ",stem:"Luteinising hormone stimulates testosterone production by:",options:["Sertoli cells","Posterior-pituitary cells","Granulosa cells in males","Leydig cells"],answer:3,explanation:"LH acts on Leydig cells to stimulate testosterone synthesis; FSH acts mainly on Sertoli cells to support spermatogenesis.",strongestDistractorAnalysis:"Strongest distractor: “Sertoli cells”. Why it is plausible: Leydig and Sertoli cells are neighbouring testicular cells regulated by gonadotropins, so their respective LH and FSH functions are commonly interchanged. Why it is incorrect: Sertoli cells support spermatogenesis under FSH; LH stimulates testosterone production in Leydig cells. Misconception detected: Confusion between Leydig and Sertoli cells.",difficulty:"easy",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U4T7_CORE",concept:"C_U4T7_CORE",misconceptionId:"MIS_GNRH_PULSATILITY"},{id:"EXP034",unit:"U4",topic:"U4T7",type:"HOTS",stem:"Continuous non-pulsatile GnRH eventually suppresses gonadal function because it:",options:["Blocks all steroid receptors","Desensitises pituitary GnRH receptors","Up-regulates receptors indefinitely","Destroys Leydig cells directly"],answer:1,explanation:"Physiological GnRH pulsatility sustains LH and FSH release, whereas continuous exposure causes pituitary receptor desensitisation.",strongestDistractorAnalysis:"Strongest distractor: “Up-regulates receptors indefinitely”. Why it is plausible: chronic ligand exposure can alter receptor expression, so continuous GnRH may be incorrectly assumed to sustain receptor up-regulation instead of causing desensitisation. Why it is incorrect: Continuous GnRH causes pituitary receptor desensitisation rather than sustained up-regulation. Misconception detected: Confusion about pulsatile versus continuous GnRH.",difficulty:"hard",cognitiveLevel:"analyse",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U4T7_CORE",concept:"C_U4T7_CORE",misconceptionId:"MIS_GNRH_PULSATILITY"},{id:"EXP035",unit:"U4",topic:"U4T8",type:"MCQ",stem:"Which receptor class is represented by the insulin receptor?",options:["Intracellular steroid receptor","Receptor tyrosine kinase","G-protein-coupled receptor","Ligand-gated chloride channel"],answer:1,explanation:"The insulin receptor autophosphorylates tyrosine residues and recruits intracellular signalling proteins.",strongestDistractorAnalysis:"Strongest distractor: “G-protein-coupled receptor”. Why it is plausible: many peptide hormones signal through G-protein-coupled receptors, making that common receptor class a plausible but incorrect generalisation for insulin. Why it is incorrect: Many peptide hormones use GPCRs, but the insulin receptor is a receptor tyrosine kinase. Misconception detected: Confusion among receptor classes.",difficulty:"easy",cognitiveLevel:"remember",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U4T8_CORE",concept:"C_U4T8_CORE",misconceptionId:"MIS_RECEPTOR_CLASS_CONFUSION"},{id:"EXP036",unit:"U4",topic:"U4T8",type:"Matching-concept MCQ",stem:"Which receptor–pathway pairing is correct?",options:["Insulin receptor — ligand-gated sodium channel","Steroid receptor — extracellular protease","Cytokine receptor — voltage-gated calcium channel","Beta-adrenergic receptor — cAMP/PKA"],answer:3,explanation:"Beta-adrenergic receptors are GPCRs that commonly activate adenylyl cyclase, cAMP and protein kinase A. The other pairings confuse distinct receptor classes.",strongestDistractorAnalysis:"Strongest distractor: “Insulin receptor — ligand-gated sodium channel”. Why it is plausible: the insulin receptor is a membrane receptor activated by a peptide hormone, so it may be mistakenly grouped with ligand-gated ion channels rather than receptor tyrosine kinases. Why it is incorrect: The insulin receptor is a receptor tyrosine kinase; beta-adrenergic receptors correctly signal through cAMP and PKA. Misconception detected: Confusion between RTKs, ion channels and GPCRs.",difficulty:"moderate",cognitiveLevel:"understand",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U4T8_CORE",concept:"C_U4T8_CORE",misconceptionId:"MIS_RECEPTOR_CLASS_CONFUSION"},{id:"EXP037",unit:"U4",topic:"U4T9",type:"MCQ",stem:"Cortisol concentration is normally highest in the:",options:["Late evening","Same concentration throughout the day","Midnight after every meal","Early morning"],answer:3,explanation:"Cortisol follows a circadian rhythm, typically peaking in the early morning and declining toward midnight.",strongestDistractorAnalysis:"Strongest distractor: “Late evening”. Why it is plausible: cortisol is associated with stress and daytime activity, so an evening peak may seem plausible without recall of its early-morning circadian maximum. Why it is incorrect: Cortisol normally declines during the day and is usually highest in the early morning. Misconception detected: Confusion about cortisol’s circadian phase.",difficulty:"easy",cognitiveLevel:"remember",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U4T9_CORE",concept:"C_U4T9_CORE",misconceptionId:"MIS_CIRCADIAN_SAMPLING"},{id:"EXP038",unit:"U4",topic:"U4T9",type:"Case-based",stem:"A single hormone measurement can mislead when secretion is:",options:["Receptor mediated","Pulsatile or circadian","Carried in blood","Produced by endocrine cells"],answer:1,explanation:"Pulsatile and circadian secretion produces time-dependent variation, so timed or repeated sampling may be required.",strongestDistractorAnalysis:"Strongest distractor: “Carried in blood”. Why it is plausible: hormones are measured in blood and protein binding can influence measured concentration, so transport may be confused with the time-dependent variability caused by pulsatile or circadian secretion. Why it is incorrect: Blood transport is common to hormones; pulsatile or circadian secretion makes a single sample time-sensitive. Misconception detected: Confusion between transport and secretion pattern.",difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U4T9_CORE",concept:"C_U4T9_CORE",misconceptionId:"MIS_CIRCADIAN_SAMPLING"},{id:"EXP039",unit:"U4",topic:"U4T10",type:"MCQ",stem:"Low cortisol with high ACTH most strongly suggests:",options:["Normal feedback","Primary adrenal failure","Pituitary ACTH deficiency","Ectopic cortisol production"],answer:1,explanation:"Primary adrenal failure lowers cortisol and removes negative feedback, so ACTH rises. Central failure produces low or inappropriately normal ACTH.",strongestDistractorAnalysis:"Strongest distractor: “Pituitary ACTH deficiency”. Why it is plausible: both primary adrenal failure and pituitary ACTH deficiency can produce low cortisol, making the ACTH direction the easily missed discriminating feature. Why it is incorrect: Pituitary deficiency gives low or inappropriately normal ACTH; high ACTH with low cortisol indicates primary adrenal failure. Misconception detected: Confusion between primary and central adrenal failure.",difficulty:"moderate",cognitiveLevel:"apply",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U4T10_CORE",concept:"C_U4T10_CORE",misconceptionId:"MIS_PRIMARY_VS_SECONDARY_ENDOCRINE_FAILURE"},{id:"EXP040",unit:"U4",topic:"U4T10",type:"HOTS",stem:"A low target-gland hormone with a low trophic hormone suggests:",options:["Primary target-gland failure","Target-gland autonomy","Normal positive feedback","Secondary or tertiary endocrine failure"],answer:3,explanation:"When both hormones are low, the defect is usually pituitary or hypothalamic. Primary target-gland failure generally raises the trophic hormone.",strongestDistractorAnalysis:"Strongest distractor: “Primary target-gland failure”. Why it is plausible: a low target-gland hormone immediately suggests gland failure, so primary disease may be selected without using the low trophic hormone to identify central failure. Why it is incorrect: Primary gland failure usually raises the trophic hormone; low target and trophic hormones indicate central failure. Misconception detected: Confusion between primary and secondary/tertiary endocrine failure.",difficulty:"hard",cognitiveLevel:"analyse",diagnosticCategory:"topic-specific-concept-confusion",conceptId:"C_U4T10_CORE",concept:"C_U4T10_CORE",misconceptionId:"MIS_PRIMARY_VS_SECONDARY_ENDOCRINE_FAILURE"}],flashcards:[{unit:"U1",topic:"U1T1",front:"Digestive System Organisation",back:"The alimentary canal is a continuous muscular tube extending from mouth to anus."},{unit:"U1",topic:"U1T2",front:"Digestive Secretions",back:"Saliva lubricates food and initiates starch digestion through salivary amylase."},{unit:"U1",topic:"U1T3",front:"Carbohydrate Digestion and Absorption",back:"Salivary and pancreatic amylases hydrolyse starch."},{unit:"U1",topic:"U1T4",front:"Protein Digestion and Absorption",back:"Pepsin begins protein digestion in the stomach."},{unit:"U1",topic:"U1T5",front:"Lipid Digestion and Absorption",back:"Bile salts emulsify fat and facilitate mixed micelle formation."},{unit:"U1",topic:"U1T6",front:"Pulmonary Ventilation",back:"The conducting zone conditions air, whereas the respiratory zone contains gas-exchange surfaces."},{unit:"U1",topic:"U1T7",front:"Gas Exchange and Transport",back:"Oxygen and carbon dioxide diffuse down partial-pressure gradients."},{unit:"U1",topic:"U1T8",front:"Regulation of Respiration",back:"Medullary networks generate respiratory rhythm and pontine centres modify it."},{unit:"U3",topic:"U3T1",front:"Neuron Structure",back:"A neuron has a cell body, dendrites and an axon."},{unit:"U3",topic:"U3T2",front:"Resting Membrane Potential",back:"Resting potential arises from unequal ion distributions, selective permeability and electrogenic transport."},{unit:"U3",topic:"U3T3",front:"Action Potential",back:"Threshold depolarisation opens voltage-gated sodium channels."},{unit:"U3",topic:"U3T4",front:"Nerve Impulse Conduction",back:"In unmyelinated axons, action potentials regenerate continuously."},{unit:"U3",topic:"U3T5",front:"Synaptic Transmission",back:"An arriving action potential opens presynaptic calcium channels."},{unit:"U3",topic:"U3T6",front:"Reflex Arc",back:"A reflex arc includes receptor, sensory neuron, integration centre, motor neuron and effector."},{unit:"U3",topic:"U3T7",front:"Skeletal Muscle and Sarcomere",back:"A sarcomere lies between two Z discs."},{unit:"U3",topic:"U3T8",front:"Neuromuscular Junction",back:"Motor terminals release acetylcholine."},{unit:"U3",topic:"U3T9",front:"Excitation–Contraction Coupling",back:"The muscle action potential travels along sarcolemma and T tubules."},{unit:"U3",topic:"U3T10",front:"Muscle Energetics and Fatigue",back:"ATP is supplied by stored ATP, phosphocreatine, glycolysis and oxidative phosphorylation."},{unit:"U4",topic:"U4T1",front:"Principles of Endocrine Signalling",back:"Hormones are chemical messengers acting on receptor-bearing targets."},{unit:"U4",topic:"U4T2",front:"Hypothalamus and Pituitary",back:"Hypothalamic releasing and inhibiting hormones regulate the anterior pituitary through portal vessels."},{unit:"U4",topic:"U4T3",front:"Thyroid Gland",back:"Thyroid follicular cells produce T4 and T3 using iodide and thyroglobulin."},{unit:"U4",topic:"U4T4",front:"Parathyroid and Calcium Homeostasis",back:"Parathyroid hormone rises when extracellular calcium falls."},{unit:"U4",topic:"U4T5",front:"Adrenal Gland",back:"The adrenal cortex produces mineralocorticoids, glucocorticoids and adrenal androgens."},{unit:"U4",topic:"U4T6",front:"Pancreatic Endocrine Function",back:"Beta cells secrete insulin, alpha cells glucagon and delta cells somatostatin."},{unit:"U4",topic:"U4T7",front:"Gonadal Hormones",back:"Leydig cells produce testosterone under LH stimulation, while Sertoli cells support spermatogenesis under FSH and testosterone."},{unit:"U4",topic:"U4T8",front:"Hormone Receptors and Signal Transduction",back:"G-protein-coupled receptors can activate cAMP–PKA or IP3/DAG–PKC pathways."},{unit:"U4",topic:"U4T9",front:"Feedback and Biological Rhythms",back:"Negative feedback stabilises endocrine variables."},{unit:"U4",topic:"U4T10",front:"Endocrine Diagnostic Logic",back:"Endocrine disease can be primary, secondary, tertiary, receptor-mediated or ectopic."},{unit:"U2",topic:"U2T1",front:"What is haematocrit?",back:"The proportion of blood volume occupied by erythrocytes."},{unit:"U2",topic:"U2T1",front:"Name the two major components of blood.",back:"Plasma and formed elements."},{unit:"U2",topic:"U2T1",front:"State three broad functions of blood.",back:"Transport, regulation/homeostasis and protection."},{unit:"U2",topic:"U2T2",front:"Which plasma protein contributes most to colloid osmotic pressure?",back:"Albumin."},{unit:"U2",topic:"U2T2",front:"Where is fibrinogen synthesised?",back:"Predominantly in the liver."},{unit:"U2",topic:"U2T2",front:"What are gamma globulins?",back:"Immunoglobulins produced by plasma cells."},{unit:"U2",topic:"U2T3",front:"Which leucocyte is usually most abundant in normal adult blood?",back:"Neutrophil."},{unit:"U2",topic:"U2T3",front:"From which cell are platelets derived?",back:"Megakaryocyte."},{unit:"U2",topic:"U2T3",front:"Why is the erythrocyte biconcave?",back:"It increases surface-area-to-volume ratio and deformability."},{unit:"U2",topic:"U2T4B",front:"Which hormone chiefly stimulates erythropoiesis?",back:"Erythropoietin from the kidney."},{unit:"U2",topic:"U2T4B",front:"Where does adult haemopoiesis mainly occur?",back:"Red bone marrow."},{unit:"U2",topic:"U2T4B",front:"Which vitamin deficiency causes defective DNA synthesis and megaloblastic change?",back:"Vitamin B12 or folate deficiency."},{unit:"U2",topic:"U2T5B",front:"Which ABO antibodies are present in group A plasma?",back:"Anti-B antibodies."},{unit:"U2",topic:"U2T5B",front:"What is the clinically most important Rh antigen?",back:"D antigen."},{unit:"U2",topic:"U2T5B",front:"Why is the Bombay phenotype special?",back:"It lacks H antigen and cannot express A or B antigens."},{unit:"U2",topic:"U2T6B",front:"What converts fibrinogen into fibrin?",back:"Thrombin."},{unit:"U2",topic:"U2T6B",front:"What mediates platelet adhesion to damaged vessel wall?",back:"von Willebrand factor."},{unit:"U2",topic:"U2T6B",front:"What enzyme degrades fibrin?",back:"Plasmin."},{unit:"U2",topic:"U2T7C",front:"Thickest cardiac chamber wall?",back:"Left ventricle."},{unit:"U2",topic:"U2T7C",front:"Function of fibrous skeleton?",back:"Valve support and electrical insulation."},{unit:"U2",topic:"U2T7C",front:"Origin of coronary arteries?",back:"Ascending aorta."},{unit:"U2",topic:"U2T8C",front:"Why is tetanus prevented?",back:"Long refractory period."},{unit:"U2",topic:"U2T8C",front:"Trigger for SR calcium release?",back:"Calcium entry through L-type channels."},{unit:"U2",topic:"U2T8C",front:"Protein binding calcium?",back:"Troponin C."},{unit:"U2",topic:"U2T9C",front:"Normal pacemaker?",back:"SA node."},{unit:"U2",topic:"U2T9C",front:"Importance of AV nodal delay?",back:"Allows ventricular filling."},{unit:"U2",topic:"U2T9C",front:"Rapid ventricular fibres?",back:"Purkinje fibres."},{unit:"U2",topic:"U2T10C",front:"Cause of S1?",back:"Closure of AV valves."},{unit:"U2",topic:"U2T10C",front:"Stroke volume formula?",back:"EDV minus ESV."},{unit:"U2",topic:"U2T10C",front:"All valves closed during?",back:"Isovolumetric contraction and relaxation."},{unit:"U2",topic:"U2T11C",front:"P wave?",back:"Atrial depolarisation."},{unit:"U2",topic:"U2T11C",front:"QRS complex?",back:"Ventricular depolarisation."},{unit:"U2",topic:"U2T11C",front:"T wave?",back:"Ventricular repolarisation."},{unit:"U2",topic:"U2T12C",front:"Cardiac output formula?",back:"Heart rate × stroke volume."},{unit:"U2",topic:"U2T12C",front:"Define preload.",back:"Ventricular filling/stretch."},{unit:"U2",topic:"U2T12C",front:"Define afterload.",back:"Resistance to ejection."},{unit:"U2",topic:"U2T13C",front:"Pulse pressure?",back:"Systolic minus diastolic pressure."},{unit:"U2",topic:"U2T13C",front:"Main resistance vessels?",back:"Arterioles."},{unit:"U2",topic:"U2T13C",front:"Approximate MAP?",back:"DBP + one-third pulse pressure."},{unit:"U2",topic:"U2T14C",front:"Coronary circulation supplies?",back:"Myocardium."},{unit:"U2",topic:"U2T14C",front:"Hepatic portal route?",back:"Gut to liver before systemic circulation."},{unit:"U2",topic:"U2T14C",front:"Foetal shunts?",back:"Ductus venosus, foramen ovale, ductus arteriosus."},{unit:"U2",topic:"U2T15R",front:"Where are renal corpuscles located?",back:"Renal cortex."},{unit:"U2",topic:"U2T15R",front:"Where do papillary ducts drain?",back:"Minor calyces."},{unit:"U2",topic:"U2T15R",front:"What follows the efferent arteriole?",back:"Peritubular capillaries or vasa recta."},{unit:"U2",topic:"U2T16R",front:"Functional unit of kidney?",back:"Nephron."},{unit:"U2",topic:"U2T16R",front:"What forms the renal corpuscle?",back:"Glomerulus and Bowman’s capsule."},{unit:"U2",topic:"U2T16R",front:"Which nephrons concentrate urine most effectively?",back:"Juxtamedullary nephrons."},{unit:"U2",topic:"U2T17R",front:"Three layers of filtration barrier?",back:"Fenestrated endothelium, basement membrane and podocyte slit diaphragm."},{unit:"U2",topic:"U2T17R",front:"Main force favouring filtration?",back:"Glomerular hydrostatic pressure."},{unit:"U2",topic:"U2T17R",front:"Two autoregulatory mechanisms?",back:"Myogenic response and tubuloglomerular feedback."},{unit:"U2",topic:"U2T18R",front:"Where is most filtered sodium reabsorbed?",back:"Proximal tubule."},{unit:"U2",topic:"U2T18R",front:"What is transport maximum?",back:"Maximum tubular transport rate for a solute."},{unit:"U2",topic:"U2T18R",front:"Which nephron segment is water impermeable and actively reabsorbs Na-K-2Cl?",back:"Thick ascending limb."},{unit:"U2",topic:"U2T19R",front:"Purpose of tubular secretion?",back:"Elimination and regulation of acid–base and potassium balance."},{unit:"U2",topic:"U2T19R",front:"Where are many organic acids/bases secreted?",back:"Proximal tubule."},{unit:"U2",topic:"U2T19R",front:"Which ion is secreted under aldosterone influence?",back:"Potassium."},{unit:"U2",topic:"U2T20R",front:"Main role of thick ascending limb?",back:"Generates medullary gradient by salt reabsorption without water."},{unit:"U2",topic:"U2T20R",front:"Which limb is water permeable?",back:"Descending thin limb."},{unit:"U2",topic:"U2T20R",front:"Which nephrons are crucial for multiplier action?",back:"Juxtamedullary nephrons."},{unit:"U2",topic:"U2T21R",front:"Role of vasa recta?",back:"Preserve medullary gradient by counter-current exchange."},{unit:"U2",topic:"U2T21R",front:"Why slow blood flow?",back:"Minimises washout of medullary solute."},{unit:"U2",topic:"U2T21R",front:"What happens to descending vasa recta?",back:"Gains solute and loses water."},{unit:"U2",topic:"U2T22R",front:"How does ADH increase water reabsorption?",back:"Promotes aquaporin-2 insertion."},{unit:"U2",topic:"U2T22R",front:"Where does urea recycling matter most?",back:"Inner medulla."},{unit:"U2",topic:"U2T22R",front:"Low ADH causes?",back:"Dilute urine."},{unit:"U2",topic:"U2T23R",front:"What is renal autoregulation?",back:"Stabilisation of renal blood flow and GFR across pressure changes."},{unit:"U2",topic:"U2T23R",front:"What stimulates renin release?",back:"Low perfusion, low macula-densa NaCl or sympathetic activity."},{unit:"U2",topic:"U2T23R",front:"Which hormone promotes natriuresis?",back:"ANP/BNP."},{unit:"U2",topic:"U2T24R",front:"Main parasympathetic effect during voiding?",back:"Detrusor contraction and internal outlet relaxation."},{unit:"U2",topic:"U2T24R",front:"Somatic nerve controlling external sphincter?",back:"Pudendal nerve."},{unit:"U2",topic:"U2T24R",front:"Where is the basic reflex centre?",back:"Sacral spinal cord."},{unit:"U2",topic:"U2T25R",front:"Where is most bicarbonate reabsorbed?",back:"Proximal tubule."},{unit:"U2",topic:"U2T25R",front:"Two urinary buffers?",back:"Phosphate and ammonium."},{unit:"U2",topic:"U2T25R",front:"Which cells secrete hydrogen distally?",back:"Alpha-intercalated cells."},{unit:"U2",topic:"U2T26R",front:"Enzyme released by juxtaglomerular cells?",back:"Renin."},{unit:"U2",topic:"U2T26R",front:"ACE converts?",back:"Angiotensin I to angiotensin II."},{unit:"U2",topic:"U2T26R",front:"Aldosterone effect?",back:"Increases distal sodium reabsorption and potassium secretion."},{unit:"U2",topic:"U2T27R",front:"ADH target?",back:"Collecting-duct water permeability."},{unit:"U2",topic:"U2T27R",front:"PTH renal effect on phosphate?",back:"Decreases phosphate reabsorption."},{unit:"U2",topic:"U2T27R",front:"Natriuretic peptides do what?",back:"Promote sodium excretion and oppose RAAS."},{unit:"U2",topic:"U2T28R",front:"Clearance formula?",back:"U × V / P."},{unit:"U2",topic:"U2T28R",front:"Best experimental GFR marker?",back:"Inulin."},{unit:"U2",topic:"U2T28R",front:"Clinical endogenous GFR marker?",back:"Creatinine."},{unit:"U2",topic:"U2T29R",front:"Heavy proteinuria suggests?",back:"Glomerular barrier injury."},{unit:"U2",topic:"U2T29R",front:"What is nephrotic syndrome?",back:"Heavy proteinuria, hypoalbuminaemia and oedema."},{unit:"U2",topic:"U2T29R",front:"What can urinary casts indicate?",back:"Renal tubular or glomerular pathology depending on type."},{id:"FCEXP001",unit:"U3",topic:"U3T1",front:"Axon hillock",back:"Integrates synaptic potentials and commonly initiates the action potential."},{id:"FCEXP002",unit:"U3",topic:"U3T2",front:"Na⁺/K⁺ pump",back:"Moves 3 Na⁺ out and 2 K⁺ in per ATP."},{id:"FCEXP003",unit:"U3",topic:"U3T3",front:"Absolute refractory period",back:"Most voltage-gated Na⁺ channels are inactivated; no second action potential can occur."},{id:"FCEXP004",unit:"U3",topic:"U3T4",front:"Demyelination",back:"Increases current leakage and slows or blocks conduction."},{id:"FCEXP005",unit:"U3",topic:"U3T5",front:"Temporal summation",back:"Rapid repeated postsynaptic potentials from one input summate over time."},{id:"FCEXP006",unit:"U3",topic:"U3T6",front:"Dorsal root",back:"Carries sensory afferent fibres into the spinal cord."},{id:"FCEXP007",unit:"U3",topic:"U3T7",front:"Sarcomere bands",back:"A band remains constant; I band and H zone shorten during contraction."},{id:"FCEXP008",unit:"U3",topic:"U3T8",front:"NMJ receptor",back:"The motor end plate uses nicotinic acetylcholine receptors."},{id:"FCEXP009",unit:"U3",topic:"U3T9",front:"SERCA",back:"Returns Ca²⁺ to the sarcoplasmic reticulum during relaxation."},{id:"FCEXP010",unit:"U3",topic:"U3T10",front:"Type I fibre",back:"Slow oxidative, mitochondria-rich and fatigue resistant."},{id:"FCEXP011",unit:"U4",topic:"U4T1",front:"Target-cell specificity",back:"A hormone requires the appropriate receptor to produce a response."},{id:"FCEXP012",unit:"U4",topic:"U4T2",front:"Hypophyseal portal system",back:"Carries hypothalamic factors directly to the anterior pituitary."},{id:"FCEXP013",unit:"U4",topic:"U4T3",front:"Primary hypothyroidism",back:"Low T4 with high TSH."},{id:"FCEXP014",unit:"U4",topic:"U4T4",front:"PTH and phosphate",back:"PTH decreases proximal tubular phosphate reabsorption."},{id:"FCEXP015",unit:"U4",topic:"U4T5",front:"Adrenal zones",back:"Glomerulosa—aldosterone; fasciculata—cortisol; reticularis—androgens."},{id:"FCEXP016",unit:"U4",topic:"U4T6",front:"Insulin and GLUT4",back:"Insulin promotes GLUT4 translocation in muscle and adipose tissue."},{id:"FCEXP017",unit:"U4",topic:"U4T7",front:"GnRH pulsatility",back:"Pulsatile GnRH sustains LH/FSH; continuous exposure suppresses them."},{id:"FCEXP018",unit:"U4",topic:"U4T8",front:"Insulin receptor",back:"A receptor tyrosine kinase."},{id:"FCEXP019",unit:"U4",topic:"U4T9",front:"Cortisol rhythm",back:"Normally highest in the early morning."},{id:"FCEXP020",unit:"U4",topic:"U4T10",front:"Central endocrine failure",back:"Low target hormone with low or inappropriately normal trophic hormone."}],glossary:[{term:"Action potential",definition:"Rapid regenerative membrane-potential change mediated by voltage-gated ion channels."},{term:"Aldosterone",definition:"Mineralocorticoid promoting sodium reabsorption and potassium secretion."},{term:"Alveolus",definition:"Pulmonary air sac specialised for gas exchange."},{term:"Baroreceptor",definition:"Stretch-sensitive receptor involved in arterial-pressure regulation."},{term:"Bohr effect",definition:"Reduced haemoglobin oxygen affinity caused by increased carbon dioxide, hydrogen ion or temperature."},{term:"Cardiac output",definition:"Heart rate multiplied by stroke volume."},{term:"Chemoreceptor",definition:"Receptor detecting chemical variables such as oxygen, carbon dioxide or hydrogen ion."},{term:"Chylomicron",definition:"Lipoprotein carrying absorbed dietary lipid through lymph."},{term:"Compliance",definition:"Volume change produced by a given pressure change."},{term:"Depolarisation",definition:"Change toward a less negative membrane potential."},{term:"Endocrine",definition:"Hormonal signa
