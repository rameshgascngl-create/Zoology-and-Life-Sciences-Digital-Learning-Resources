        {id:"d2l2",title:"Ventilation, drainage and waste management",lead:"Air, water and manure movement determine respiratory health, hoof condition, fly burden and environmental impact.",sections:[["Ventilation and flooring","Natural ventilation uses openings, ridge outlets and building orientation to remove heat, moisture and gases. Mechanical air movement may be needed in humid heat. Floors require grip and a gentle slope toward drains without causing lameness. Bedding must remain dry and comfortable."],["Waste as a managed resource","Frequent manure removal reduces pathogen and fly exposure. Channels, pits, composting, biogas and nutrient application should prevent runoff into water sources. Farm plans must account for wash water and rainfall. Protective equipment and safe gas awareness are essential around confined manure storage."]],key:"A clean-looking shed can still be poorly ventilated; humidity and ammonia are functional indicators.",exam:"Relate ventilation, drainage and manure handling to animal health and environmental safety."},
        {id:"d2l3",title:"Winter and summer management",lead:"Thermal stress changes intake, water use, immunity, fertility and milk production before severe clinical signs appear.",sections:[["Summer management","Heat load is reduced with shade, high air movement, reflective roofing, sprinkling or evaporative cooling where humidity permits, abundant cool water and feeding during cooler hours. Ration density may need adjustment when dry-matter intake falls. Overcrowding and wet holding areas worsen stress."],["Winter management","Winter management prioritises dry bedding, wind protection, adequate energy, calf warmth and ventilation without draught at animal level. Closing sheds completely can trap moisture and gases. Use weather forecasts, respiration rate, posture, intake and production records to act early."]],key:"Thermal comfort requires balancing air movement, moisture and metabolic heat rather than sealing or soaking the shed indiscriminately.",exam:"Prepare a season-specific management plan for hot-humid and cool-wet conditions."}
      ]},
      {id:"d3",title:"Feed and Feeding Management",hours:9,summary:"Roughages, concentrates, supplements, additives and stage-specific feeding of calves, adults and pregnant animals.",flow:["Estimate requirement","Test feed resources","Balance ration","Deliver consistently","Monitor response"],revision:["Roughage supports rumen function; concentrate raises nutrient density.","Protein and energy must be balanced with effective fibre and minerals.","Body condition and records reveal long-term feeding adequacy."],lessons:[
        {id:"d3l1",title:"Feedstuffs, roughages and concentrates",lead:"A dairy ration must support rumen fermentation, maintenance, production and health at an affordable cost.",sections:[["Feed classes","Roughages contain substantial structural fibre and include pasture, fodder, hay, silage and crop residues. Concentrates are nutrient-dense: cereal grains and by-products are commonly energy-rich, while oilseed cakes and selected meals are protein-rich. Chemical composition, digestibility, palatability, toxins, spoilage and price determine actual value."],["Rumen perspective","Microbes ferment carbohydrates to volatile fatty acids and supply microbial protein when fermentable energy and nitrogen are synchronised. Effective fibre stimulates chewing, saliva and rumen buffering. Abrupt concentrate increase risks acidosis; ration changes should be gradual and feed physically mixed where practical."]],key:"A feed ingredient is not intrinsically good or bad; value depends on quality, amount and the complete ration.",exam:"Differentiate roughage, energy concentrate and protein concentrate with their rumen effects."},
        {id:"d3l2",title:"Minerals, vitamins and feed additives",lead:"Micronutrients are required in small amounts but both deficiency and indiscriminate excess can impair production.",sections:[["Mineral and vitamin supplements","Mineral supplements provide calcium, phosphorus, magnesium, sodium and trace minerals that support skeletal, metabolic and reproductive functions. Vitamin supplements commonly address vitamins A, D and E, while rumen microbes supply many B vitamins under normal conditions. Requirements vary with growth, pregnancy, lactation and feed composition."],["Feed additives and safety","Buffers, yeasts, enzymes, toxin binders and other feed additives may be used for defined purposes with evidence and correct dosage. Additives cannot repair fundamentally poor forage or hygiene. Ingredient identity, expiry, storage, legal approval and withdrawal requirements must be checked; routine antimicrobial growth promotion raises resistance concerns."]],key:"Supplement according to requirement and ration analysis, not simply because a product is available.",exam:"Construct principles for safe mineral, vitamin and additive use in dairy rations."},
        {id:"d3l3",title:"Feeding calves, adults and pregnant animals",lead:"Nutrient allocation changes across the life cycle, so one herd ration cannot meet every physiological state.",sections:[["Calves and growing stock","Early high-quality colostrum provides antibodies, nutrients and bioactive factors. Clean milk or replacer, water and palatable calf starter support rumen development; weaning should use intake and health rather than age alone. Growing heifers need steady skeletal growth without excessive fat deposition that can impair future performance."],["Adults and pregnancy","Lactating cows require intake matched to milk yield and composition, with attention to fibre, energy, protein and water. Dry and transition periods prepare the rumen and mineral metabolism for calving and lactation. Pregnant heifers need nutrients for their own growth plus the fetus, and should be monitored using body-condition trends."]],key:"The transition period is a high-risk metabolic bridge, not a nonproductive pause.",exam:"Compare feeding priorities for calves, lactating cows and pregnant heifers."}
      ]},
      {id:"d4",title:"Milk and Dairy Products",hours:9,summary:"Milk composition, spoilage, pasteurisation, nutrition, dairy products and livelihood value.",flow:["Hygienic milking","Rapid filtration and cooling","Quality testing","Heat processing","Cold-chain distribution"],revision:["Milk composition varies with species, breed, diet, lactation and health.","Pasteurisation reduces pathogens but does not sterilise milk.","Cold-chain failure can undo hygienic production and processing."],lessons:[
        {id:"d4l1",title:"Milk composition and factors affecting quality",lead:"Milk is an emulsion, colloid and solution whose composition reflects both mammary biology and production conditions.",sections:[["Components","Water is the major component. Fat occurs as globules; casein micelles and whey proteins supply amino acids; lactose is the principal carbohydrate; minerals, vitamins, enzymes and cells contribute additional properties. Total solids and solids-not-fat are important quality measures. Colostrum differs markedly from mature milk."],["Variation and testing","Breed, stage of lactation, nutrition, season, milking interval, mastitis and adulteration affect composition and quality. Sensory inspection cannot detect all hazards. Density, acidity, fat, protein, somatic-cell count and microbiological tests answer different questions and require representative samples."]],key:"Milk yield and milk composition should be interpreted together rather than treating volume as the only outcome.",exam:"Describe milk as a physicochemical system and explain major sources of variation."},
        {id:"d4l2",title:"Spoilage, pasteurisation and safe handling",lead:"Milk supports rapid microbial growth, so contamination control and temperature management must begin at the udder.",sections:[["Milk spoilage","Microorganisms enter from the udder, skin, equipment, water, handlers and environment. Milk spoilage produces acidity, off-flavour, gas, proteolysis or lipolysis. Hygienic milking, clean equipment, rapid cooling and protected transport reduce initial load and growth. Antibiotic residues and chemical adulterants are separate hazards."],["Heat processing","Pasteurisation uses validated time–temperature combinations to destroy major pathogens with limited quality change; common systems include low-temperature long-time and high-temperature short-time treatment. It is not sterilisation, so post-process contamination and warm storage remain dangerous. Product-specific regulation and routine verification are essential."]],key:"Safety is a chain: healthy animal, clean milking, rapid cooling, correct processing and protected storage.",exam:"Explain why pasteurised milk still requires hygienic handling and refrigeration."},
        {id:"d4l3",title:"Nutrition, dairy products and livelihood",lead:"Processing converts a perishable raw material into products with different composition, storage life and market value.",sections:[["Products and nutrition","Curd and fermented products use selected microbes; butter and ghee concentrate milk fat; paneer and cheese concentrate proteins and fat; milk powder removes water. Milk supplies high-quality protein, calcium and other nutrients, but composition and suitability vary among individuals and products. Fermentation can improve flavour and shelf life but does not justify poor hygiene."],["Enterprise value","Product choice should follow local demand, processing skill, legal compliance, packaging, cold-chain capacity and by-product use. Value addition can stabilise income and create employment, but costs of energy, quality testing, losses and marketing must be calculated. Transparent records protect both producer and consumer."]],key:"Value addition is economically meaningful only when safety, yield, shelf life and market demand are quantified.",exam:"Compare three dairy products in processing principle, composition and enterprise requirements."}
      ]},
      {id:"d5",title:"Diseases, Vaccination and Biosecurity",hours:9,summary:"Bacterial, protozoan, helminth, viral and trypanosome diseases with prevention, vaccination and farm biosecurity.",flow:["Exclude hazards","Detect early","Isolate and diagnose","Treat appropriately","Review prevention"],revision:["Clinical signs overlap; confirm causes before targeted treatment.","Vaccination reduces risk but cannot replace sanitation or quarantine.","Biosecurity includes entry, movement, isolation, records and vector control."],lessons:[
        {id:"d5l1",title:"Bacterial diseases: mastitis and Johne's disease",lead:"Bacterial control depends on breaking transmission while preserving milk safety and antimicrobial effectiveness.",sections:[["Mastitis","Mastitis is mammary inflammation, commonly infectious, expressed clinically or subclinically. Entry through the teat canal is influenced by milking hygiene, equipment, teat condition, bedding and pathogen reservoir. Detection uses udder and milk examination, somatic-cell indicators and culture where appropriate. Control combines clean milking sequence, teat care, equipment maintenance, dry-period strategy and veterinary treatment."],["Johne's disease","Mycobacterium avium subsp. paratuberculosis causes chronic enteritis, progressive weight loss and production decline, with infection often acquired early and disease recognised much later. Control relies on herd testing strategy, hygiene around calving, preventing calf exposure to contaminated manure and cautious introduction of replacements."]],key:"Long incubation means apparently healthy carriers can sustain herd infection.",exam:"Prepare an integrated mastitis-control plan and contrast it with Johne's-disease control."},
        {id:"d5l2",title:"Protozoan, helminth and trypanosome infections",lead:"Parasitic disease reflects interactions among host immunity, parasite life cycle, vector or environment and management.",sections:[["Major groups","Coccidiosis commonly affects young stock through environmentally resistant oocysts. Theileriosis is tick-borne and can cause fever, lymph-node enlargement and anaemia. Tapeworm infections and lung fluke disease depend on parasite species, intermediate hosts and grazing exposure. Trypanosomiasis is transmitted mechanically or biologically by biting vectors in affected regions and produces systemic illness."],["Integrated control","Diagnosis may combine clinical examination, faecal tests, blood smears, serology or molecular methods. Strategic treatment must use veterinary guidance and resistance-aware dosing. Manure management, dry calf areas, grazing strategy, intermediate-host control, tick and fly management, quarantine and monitoring interrupt life cycles more sustainably than repeated unverified treatment."]],key:"Map the parasite life cycle before selecting a control point.",exam:"Compare the transmission and integrated control of coccidiosis, theileriosis and trypanosomiasis."},
        {id:"d5l3",title:"Viral disease, vaccination and farm biosecurity",lead:"Prevention is decisive for highly contagious viral disease because treatment does not remove the underlying virus.",sections:[["Viral threats","Foot-and-mouth disease spreads rapidly among cloven-hoofed animals and causes fever and vesicular lesions with major production and trade consequences. Infectious bovine rhinotracheitis affects respiratory and reproductive health and can establish latent infection. Suspected outbreaks require prompt veterinary and statutory reporting; movement may need restriction."],["Biosecurity system","Purchase from known herds, quarantine and test new or returning animals, control visitors and vehicles, isolate sick stock, manage carcasses and waste, protect feed and water, control vectors and keep health records. Vaccination plans must match regional risk and official programmes, maintain cold chain and record product, batch and date. Immunisation complements rather than substitutes for these barriers."]],key:"Biosecurity is a layered routine practised every day, not an emergency action after disease appears.",exam:"Design a practical biosecurity and vaccination framework for a small dairy farm."}
      ]}
    ]
  }
  ];
  const enrichment={
    g1l1:[["Analytical depth","Mendelian expectations are best treated as explicit statistical models. The multiplication rule combines independent events, whereas the addition rule combines mutually exclusive routes. Binomial expansion predicts the probability of a specified number of offspring with a phenotype, and chi-square analysis evaluates whether observed departures are larger than sampling alone would reasonably produce. A nonsignificant result does not prove the model; it means the data do not justify rejecting it. Reciprocal crosses, test crosses and larger families help distinguish autosomal inheritance from sex linkage, maternal effects, lethality and reduced penetrance."],["From classical ratios to genomes","Modern segregation analysis follows molecular variants directly through families and experimental crosses. Single-nucleotide polymorphisms, short tandem repeats and sequence haplotypes reveal inheritance even when phenotypes are subtle or environmentally modified. Yet the same logic remains: identify parental phase, define possible gametes, predict transmission and compare prediction with observation. This continuity between pea crosses and genome-scale mapping is pedagogically important because high-throughput data do not remove the need for carefully framed genetic hypotheses."]],
    g1l2:[["Pathway logic behind modified ratios","Modified ratios can be reconstructed by grouping the sixteen genotypic classes of a dihybrid cross according to pathway output. In a two-step pigment pathway, a recessive block at either required step may collapse several genotypes into the same colourless phenotype, producing 9:7. In recessive epistasis, a homozygous recessive upstream block may mask variation at a downstream locus, giving 9:3:4. Drawing the biochemical sequence before memorising a ratio reveals why different molecular architectures generate different phenotypic classes."],["Contemporary interpretation","Gene interaction is now studied through regulatory networks, quantitative expression and genetic-background effects. A variant that is mild in one strain may be severe in another because modifier loci alter protein dosage, pathway redundancy or developmental compensation. This explains variable expression in experimental organisms and human disease. The rigorous conclusion is therefore not merely that genes interact, but that phenotype is an emergent property of interacting alleles, cellular context, development and environment."]],
    g1l3:[["Three-point mapping as inference","A three-point test cross contains more information than three separate two-point crosses. The least frequent reciprocal classes usually represent double crossovers; comparison with parental classes identifies the locus whose allele arrangement has switched and therefore lies in the middle. Recombination in each interval includes its single crossovers plus double crossovers. Coefficient of coincidence equals observed divided by expected double crossovers, while interference equals one minus that value. These calculations reveal both gene order and whether one crossover alters the probability of another nearby."],["Limits and modern mapping","Recombination is uneven across genomes: hotspots, cold regions, centromeres, sex and chromatin state affect the relation between physical and genetic distance. Dense SNP maps, linkage disequilibrium, genome-wide association studies and long-read haplotypes now complement classical crosses. Somatic-cell hybrids historically assigned genes to chromosomes, whereas fluorescence in situ hybridisation and genome assemblies provide finer localisation. A map is therefore model- and population-dependent, not a perfectly uniform ruler."]],
    g1l4:[["Variance components and experimental design","Phenotypic variance can be written conceptually as Vᴾ=Vᴳ+Vᴱ+Vᴳ×ᴱ, with Vᴳ further partitioned into additive, dominance and epistatic components. Estimation requires related individuals or designed populations raised across representative environments. Common-garden and reciprocal-transplant designs reduce confounding, while parent–offspring regression or animal models estimate additive resemblance. Measurement error inflates environmental variance, and restricted environments can make heritability appear higher by suppressing environmental variation."],["Selection and responsible interpretation","The breeder's equation R=h²S predicts short-term response when additive effects, selection regime and environment remain comparable. Long-term response may slow because allele frequencies change, genetic correlations oppose the target or inbreeding reduces fitness. Contemporary genomic selection estimates breeding values from dense markers, but prediction accuracy depends on the reference population. Heritability never ranks the social worth of traits or people; it is a population-specific statistical description, not a measure of biological inevitability."]],
    g2l1:[["From one gene–one enzyme to regulatory architecture","The one gene–one enzyme formulation was historically powerful but incomplete. Many genes encode structural RNAs or regulatory RNAs; many proteins contain subunits from several loci; and one locus can produce multiple isoforms by alternative transcription initiation, splicing, editing or polyadenylation. Enhancers may act over long distances within three-dimensional chromatin domains. Consequently, defining the functional boundary of a gene may require sequence, transcription, chromatin and perturbation evidence rather than a coding region alone."],["Pangenomes and structural variation","A single linear reference genome underrepresents population diversity and makes some variants difficult to detect. The Human Pangenome Reference Consortium introduced graph-based assemblies representing multiple haplotypes, improving access to structural variation and reducing reference bias. Long-read sequencing now resolves repeat expansions, inversions and complex rearrangements that short reads often miss. These advances update the gene concept without replacing classical genetics: phenotype still depends on inheritance, expression, dosage and biological context."]],
    g2l2:[["Damage recognition and pathway choice","DNA damage is a chemical abnormality; mutation is a permanent sequence change after failed or error-prone processing. Glycosylases in base-excision repair recognise specific altered bases, whereas nucleotide-excision repair detects helix distortion. Mismatch repair recognises replication-associated mispairing. Double-strand breaks are repaired by template-guided homologous recombination mainly in S/G₂ or by nonhomologous end joining throughout more of the cell cycle. Defects in these pathways generate characteristic mutation patterns and cancer predispositions."],["Genome editing as a mechanistic probe","CRISPR nucleases, base editors and prime editors deliberately recruit cellular repair or chemical conversion to alter chosen sequences. Their outcomes reveal the same principles studied in natural mutagenesis: target recognition, repair-template availability, mosaicism, off-target change and selection of edited cells. Genome editing is therefore not simply a technology topic; it is an experimental demonstration of how break type and repair pathway determine the final genotype. Clinical interpretation also requires ethical review, especially for heritable germ-line alteration."]],
    g2l3:[["Cytogenetic resolution ladder","Methods answer questions at different scales. Conventional karyotyping surveys chromosome number and large rearrangements; G-banding identifies regional patterns; FISH tests a targeted locus or chromosome; chromosomal microarrays detect submicroscopic copy-number imbalance; and genome sequencing can identify nucleotide changes and many structural variants. Balanced rearrangements may be missed by dosage arrays, while repeat-rich breakpoints can challenge short-read sequencing. Appropriate testing therefore begins with the suspected scale and type of alteration."],["Pedigree probability and uncertainty","Bayesian pedigree analysis updates a prior genetic risk with new evidence such as phenotype, age, biochemical testing or molecular results. Penetrance may depend on age, sex or environment, and de novo variants can create an affected child with unaffected parents. Germ-line mosaicism explains recurrence after an apparently new mutation. A strong pedigree answer must state these qualifications instead of forcing every family into a perfectly clean textbook pattern."]],
    g2l4:[["Metabolic reasoning across disorders","Inborn errors become memorable when organised by pathway logic. Loss of an enzyme may cause substrate accumulation, product deficiency, diversion into toxic metabolites or failure of energy storage and release. Phenylketonuria illustrates toxicity prevented by early dietary management; lysosomal disorders illustrate progressive storage within multiple organs; haemoglobin disorders illustrate structural versus quantitative protein defects. Gout is more complex, reflecting urate production, renal handling and multiple susceptibility loci rather than a single universal Mendelian cause."],["Contemporary diagnosis and counselling","Newborn screening uses biochemical markers to identify treatable disorders before irreversible injury. Confirmatory testing may combine enzyme assay, metabolomics, targeted sequencing, exome/genome analysis and family studies. Counselling must distinguish a pathogenic variant from a variant of uncertain significance, and a molecular diagnosis from a guaranteed prognosis. Reproductive options, cascade testing and emerging therapies should be discussed nondirectively, with attention to consent, privacy, disability perspectives and equitable access."]],
    g3l1:[["Testing equilibrium correctly","Expected genotype counts are calculated from allele frequencies estimated in the sample and compared with observations using an appropriate goodness-of-fit or exact test. Rare alleles and small samples violate simple chi-square assumptions. Population subdivision creates a heterozygote deficit—the Wahlund effect—even when each subpopulation is internally at equilibrium. Inbreeding also reduces heterozygosity but through nonrandom mating. The same observed deviation can therefore arise from different processes, and additional population or pedigree information is required."],["Genomic applications","Hardy–Weinberg expectations remain central to quality control in association studies because large deviations can reveal genotyping error, sample contamination or population structure. They also support carrier-frequency estimation and forensic calculations when assumptions are stated. Genome-scale datasets do not make the law obsolete; they make violations easier to detect and interpretation more demanding because ancestry, relatedness and technical batch effects must be modelled explicitly."]],
    g3l2:[["Selection in changing environments","Fitness is relative to a specified environment and generation. An allele favoured under infection pressure may carry a cost when that pressure is absent; pesticide and antimicrobial resistance likewise reflect benefits under exposure and trade-offs elsewhere. Selection can act on standing variation faster than waiting for a new mutation. Polygenic adaptation may involve small coordinated shifts at many loci, making it harder to detect than a classic selective sweep."],["Migration–selection balance","Gene flow can introduce adaptive variants, restore diversity and reduce inbreeding, but it can also swamp local adaptation when migrants contribute alleles poorly suited to the recipient environment. The outcome depends on migration rate, selection strength, dominance and landscape structure. Conservation programmes therefore evaluate both genetic rescue and outbreeding risk rather than assuming that either complete isolation or unrestricted mixing is always desirable."]],
    g3l3:[["Effective size and genomic signatures","Effective population size is reduced by unequal sex ratio, reproductive skew, fluctuating abundance and overlapping generations. Loss of heterozygosity occurs roughly in proportion to 1/(2Nₑ) per generation in an ideal diploid population. Runs of homozygosity, linkage disequilibrium and allele-frequency spectra allow genomic inference of recent and ancient Nₑ. These estimates depend on mutation and recombination models and should be interpreted as historical summaries, not exact head counts."],["Neutrality as a testable baseline","The neutral and nearly neutral theories generate quantitative expectations for polymorphism and divergence. Comparing within-species variation with between-species substitution, or synonymous with nonsynonymous change, can reveal departures consistent with selection. Demographic expansion and bottlenecks can mimic selective signatures, so robust inference compares multiple loci and alternative demographic models. Neutrality is valuable precisely because it is a null model against which adaptive claims can be tested."]],
    g3l4:[["Load in finite populations","Mutation continually introduces deleterious alleles, while selection removes them with an efficiency that depends on dominance and population size. Recessive alleles can hide in heterozygotes; drift can overwhelm weak selection in small populations. Inbreeding exposes recessive load and may cause inbreeding depression, whereas purging is incomplete and context-dependent. Conservation decisions therefore combine pedigree, demographic and genomic evidence rather than assuming that all deleterious variation can be removed safely."],["Polymorphism from molecules to ecosystems","Balanced polymorphisms may reflect heterozygote advantage, negative frequency dependence or spatially variable selection. Transient polymorphism occurs during replacement, and neutral polymorphism persists through mutation–drift balance. Contemporary sequencing reveals enormous rare-variant diversity, but frequency alone does not establish function. Demonstrating adaptive polymorphism requires evidence connecting genotype, phenotype, fitness and environment."]],
    g4l1:[["Requirements for an evolvable protocell","A credible origin-of-life model must integrate compartmentation, energy capture, catalysis, heredity and variation. Fatty-acid vesicles can form spontaneously under selected conditions and may grow or divide physically, but stable replication requires compatible chemistry. Mineral surfaces can concentrate reactants; wet–dry cycles can drive condensation; hydrothermal gradients provide energy and catalytic settings. No single environment yet explains every transition, so competing hypotheses should be compared by experimentally testable steps."],["Avoiding false certainty","Miller–Urey-type experiments demonstrate abiotic synthesis under specified gas mixtures; they do not reproduce the entire early Earth or create life. Ribozymes demonstrate catalytic RNA potential; they do not establish that a complete RNA world necessarily existed. Strong academic writing separates observation, experimental possibility and historical inference. It also recognises that origin-of-life research addresses pre-Darwinian chemical evolution before reliable template replication made biological natural selection possible."]],
    g4l2:[["Rate heterogeneity and model choice","Substitution rates differ among genes, sites, lineages and time scales. Purifying selection slows protein change, whereas relaxed constraint or positive selection may accelerate selected regions. Multiple hits cause saturation, particularly at rapidly evolving sites. Relaxed-clock methods allow branch-specific rate variation, but broader flexibility increases dependence on priors and calibration. Reporting the alignment, substitution model, clock model and calibration uncertainty is therefore part of the result, not technical decoration."],["Ancient DNA and time calibration","Ancient DNA provides directly dated sequences that can calibrate recent evolutionary rates and reveal migration, admixture and population replacement. Damage patterns, contamination and short fragments require specialised authentication. Fossils remain essential for deeper nodes, but their age usually constrains a lineage minimum rather than the exact divergence event. Molecular dates should be presented as probability intervals that may shift when new fossils, genomes or models are added."]],
    g4l3:[["Phylogenomics beyond a single tree","Different genes may support different trees because of incomplete lineage sorting, duplication and loss, introgression or horizontal transfer. Species-tree methods model discordance across many loci rather than concatenating every site blindly. Orthology assessment is critical: comparing paralogues can reconstruct duplication history instead of species history. Network methods may be more appropriate when reticulation is substantial. Thus, the Universal Tree of Life is a powerful framework, but microbial gene exchange means that some evolutionary history is network-like."],["Evaluating support and error","Bootstrap support measures repeatability under resampled characters, not the probability that a clade is absolutely true. Bayesian posterior probability depends on model and prior assumptions. Long-branch attraction can mislead parsimony and poorly specified models; taxon sampling often matters as much as sequence length. A rigorous tree interpretation checks alignment quality, model adequacy, outgroup choice and concordance before building an evolutionary narrative."]],
    g4l4:[["Genomics of reproductive isolation","Speciation genes affect mate choice, ecological performance, chromosome pairing or hybrid development, but isolation usually accumulates across many loci. Divergence with gene flow produces genomic regions of stronger differentiation against a background of exchange. Polyploidy can create rapid isolation in plants and some animals, whereas reinforcement strengthens prezygotic barriers where maladaptive hybrids occur. Genomic islands are evidence requiring explanation, not automatic proof of one mechanism."],["Species delimitation and conservation","DNA barcoding, multispecies coalescent models, morphology, ecology and behaviour may disagree about lineage boundaries. Over-splitting can inflate species counts, while under-recognition can hide distinct conservation units. The best decision uses integrative taxonomy and states the operational concept employed. Adaptive radiation additionally requires showing that lineage diversification is associated with ecological opportunity and trait divergence, rather than merely observing many related species."]],
    g5l1:[["Developmental mechanisms in macroevolution","Major morphological change often involves altered timing, location or level of conserved developmental regulators rather than entirely new genes. Hox patterning, gene-regulatory networks, modularity and developmental bias influence which variants arise and remain viable. Evo-devo therefore connects microevolutionary mutation and selection with the origin of large-scale form. Developmental constraint limits possibilities, while modular systems can permit one structure to change with fewer harmful effects elsewhere."],["Diversification and extinction","Clade diversity reflects speciation minus extinction through time. Key innovations may increase ecological opportunity, but apparent associations can be confounded by age, geography or environmental change. Mass extinctions remove lineages nonrandomly and restructure ecosystems, after which surviving clades may radiate. Modern macroevolution uses time-calibrated phylogenies and fossil occurrence models, yet incomplete sampling and uncertain preservation must remain explicit."]],
    g5l2:[["Measuring tempo rather than choosing slogans","Morphological stasis can result from stabilising selection, developmental constraint, habitat tracking or limited resolution. Rapid change around speciation can occur in small isolated populations and appear abrupt in stratigraphic sections. Other characters within the same lineage may evolve gradually. The productive question is therefore which traits change, at what measured rate, in which populations and under what sampling resolution—not whether all evolution is punctuated or gradual."],["Coevolutionary evidence","Reciprocal adaptation is supported when each partner's traits impose selection on the other and matched changes occur across populations or time. Geographic mosaics contain hotspots of strong reciprocal selection, coldspots of weak interaction and gene flow connecting them. Experimental evolution, cross-infection designs and phylogenetic comparisons can test coevolution. Mere ecological association, even if close, is insufficient without evidence of reciprocal evolutionary response."]],
    g5l3:[["Integrating fossil and molecular evidence","Primate relationships are reconstructed from shared derived characters, stratigraphic age and molecular sequences. Molecular clocks estimate branching times, whereas fossils reveal anatomical combinations and minimum ages. Dental form, orbit orientation, limb mobility and braincase features provide distinct evidence. Convergence must be considered because similar diets or locomotion can produce resemblance without close ancestry. Total-evidence analyses combine living and fossil characters in one explicit framework."],["What genomes add","Comparative genomics identifies conserved elements, gene-family change and regulatory evolution, but genomic difference is not a linear measure of organismal superiority. Incomplete lineage sorting means some human genomic regions may be closer to gorilla than chimpanzee homologues despite the accepted species tree. This is expected when ancestral populations were large and divergences close in time. Such discordance illustrates why species evolution cannot be reduced to one gene tree."]],
    g5l4:[["A branching hominin record","Australopithecus, Paranthropus and multiple Homo lineages overlapped in time; the record is not a single ladder. Fossils indicate that bipedal adaptations preceded major brain enlargement. Ancient DNA has demonstrated interbreeding among modern humans, Neanderthals and Denisovan-related populations, while proteins can extend molecular inference to some older remains. Each method has geographic and preservation biases, so absence of evidence in one region is not evidence of absence."],["Gene–culture coevolution","Cultural practices modify selection pressures: dairying influenced lactase persistence, subsistence affects metabolism and disease exposure, and technology changes survival. Language depends on distributed neural networks, vocal learning, social interaction and cultural transmission; no single fossil or gene establishes its origin. Human altruism and morality combine evolved social capacities with institutions, norms and teaching. Biological explanation should neither deny culture nor treat culture as independent of evolved cognition."]],
    p1l1:[["Comparative design principles","Digestive design reflects particle size, food chemistry, feeding interval and microbial partnership. Sponges capture suspended particles intracellularly; cnidarians combine extracellular digestion in a gastrovascular cavity with intracellular completion; annelids and vertebrates use a complete regionalised gut. Ruminants ferment before the small intestine, whereas hindgut fermenters place microbial chambers after much enzymatic digestion. This position affects access to microbial protein, passage rate and the ability to reprocess contents."],["Nutritional geometry","Animals regulate multiple nutrients rather than calories alone. The geometric framework models how protein, carbohydrate, lipid and micronutrient targets interact, explaining why a diet abundant in energy can remain nutritionally imbalanced. Appetite, toxin dilution, gut capacity and symbiont needs constrain choice. Contemporary nutritional physiology therefore studies food selection as a multidimensional regulatory problem linking neural reward, endocrine signals, microbiota and ecological availability."]],
    p1l2:[["Enteric nervous integration","The myenteric plexus primarily coordinates motility, while the submucosal plexus regulates secretion, absorption and local blood flow. Sensory neurons detect stretch and luminal chemistry; interneurons organise ascending excitation and descending inhibition; motor neurons act on smooth muscle and glands. This intrinsic circuitry can generate peristaltic reflexes without central command, although vagal and sympathetic pathways alter gain according to feeding, stress and systemic need."],["Motility as a clinical variable","Gastric emptying depends on meal volume, particle size, fat, acidity and duodenal feedback. The migrating motor complex sweeps the fasting small intestine, whereas colonic mass movements support defaecation. Disorders may arise from neuropathy, myopathy, inflammation or mechanical obstruction, and similar symptoms can conceal different mechanisms. Transit tests and manometry therefore measure specific functions rather than treating 'indigestion' as one physiological entity."]],
    p1l3:[["Membrane transport and energy coupling","Apical sodium–glucose cotransport uses the sodium electrochemical gradient maintained by basolateral Na⁺/K⁺-ATPase; facilitated transport then releases glucose to blood. Peptides enter through proton-linked transporters and are hydrolysed intracellularly. Iron absorption is regulated by systemic hepcidin, while calcium transport responds to vitamin D. These examples show how whole-body need alters epithelial transporter expression rather than absorption being a passive property of food alone."],["Microbiome and host metabolism","Colonic microbes ferment otherwise indigestible substrates into short-chain fatty acids that support colonocytes and influence immune and metabolic signalling. Microbial composition is shaped by diet, drugs, transit and host biology, but association does not automatically prove causation. Current research uses metagenomics, metabolomics and controlled interventions to distinguish microbial function from simple taxonomic lists. The microbiome extends digestive capacity while remaining an ecosystem, not an additional human organ with one fixed composition."]],
    p1l4:[["Mechanistic differential diagnosis","Epigastric pain can reflect mucosal inflammation, ulceration, biliary disease, pancreatic disease or even non-digestive causes. H. pylori disrupts mucosal defence and drives inflammation; non-steroidal anti-inflammatory drugs reduce protective prostaglandins. Cholesterol stones reflect supersaturation, nucleation and gallbladder stasis, while pigment stones have different origins. Portal hypertension in cirrhosis produces collateral vessels, ascites and splenic effects beyond loss of hepatocyte function."],["Evidence and prevention","Endoscopy, imaging, liver chemistry, elastography and pathogen testing examine different levels of dysfunction. Vaccination against hepatitis viruses, safe alcohol use, metabolic-risk reduction, infection treatment and medication stewardship prevent selected causes of chronic liver injury. Educationally, the crucial distinction is between a symptom, a physiological lesion and an aetiological diagnosis. Treatment follows cause and severity; the chapter should not be used for self-diagnosis."]],
    p2l1:[["Quantitative respiratory mechanics","Minute ventilation equals tidal volume multiplied by respiratory frequency, whereas alveolar ventilation subtracts anatomical dead space before multiplying. Thus rapid shallow breathing may move considerable air but ventilate alveoli poorly. Compliance is volume change per pressure change; fibrosis lowers compliance, whereas loss of elastic tissue may increase compliance but impair expiration. Poiseuille's relation shows why small airway-radius changes greatly alter resistance, especially during bronchoconstriction."],["Comparative exchange solutions","Fish gills use countercurrent blood–water flow to maintain diffusion gradients across lamellae. Insect tracheae deliver gases directly to tissues, reducing reliance on blood pigments, while bird lungs use unidirectional parabronchial airflow and cross-current exchange. Mammalian tidal lungs mix fresh and residual air but provide enormous alveolar area. Comparing these systems reveals design trade-offs involving medium density, body size, activity, water loss and structural support."]],
    p2l2:[["Cooperativity and tissue delivery","Haemoglobin's sigmoidal binding curve arises from cooperative transitions among subunits. High pulmonary oxygen tension favours loading, while metabolites in active tissues lower affinity and promote unloading. The Bohr effect describes pH and carbon-dioxide influence on oxygen binding; the Haldane effect describes how oxygenation influences carbon-dioxide and proton carriage. Together they coordinate exchange at lungs and tissues rather than functioning as isolated textbook shifts."],["Integrated chemoreflexes","Central chemoreceptors respond to brain extracellular acidity generated when carbon dioxide crosses the blood–brain barrier. Peripheral chemoreceptors respond rapidly to hypoxaemia, acidity and carbon dioxide. During exercise, ventilation rises through feed-forward motor signals, proprioception and chemical feedback before major arterial gas disturbance. Chronic hypoxia changes receptor sensitivity, erythropoiesis and vascular tone, showing that respiratory regulation operates across seconds to weeks."]],
    p2l3:[["Interpreting functional tests","An obstructive spirometric pattern shows disproportionate reduction of forced expiratory flow, while restriction requires confirmation of reduced lung volumes. Diffusing capacity evaluates gas transfer and may fall with membrane thickening, lost area or reduced capillary blood. Pulse oximetry estimates haemoglobin saturation but does not directly measure ventilation or tissue delivery. Arterial blood gases distinguish oxygenation, carbon-dioxide retention and acid–base effects."],["Host–pathogen and inflammatory context","Pneumonia may be bacterial, viral, fungal or aspiration-related; tuberculosis reflects host containment of Mycobacterium tuberculosis within granulomatous lesions. Asthma includes heterogeneous inflammatory phenotypes rather than one uniform pathway. Vaccination, ventilation, infection control, reduced smoke exposure and timely professional care act at different causal levels. Mechanistic comparison prevents the scientifically weak habit of grouping all cough and breathlessness as equivalent disease."]],
    p2l4:[["Acclimatisation and adaptation","At altitude, hyperventilation improves alveolar oxygen but causes respiratory alkalosis; renal bicarbonate loss permits continued ventilation. Erythropoietin raises red-cell mass over time, while capillary and metabolic adjustments alter tissue delivery. Genetic adaptations in long-resident high-altitude populations modify hypoxia pathways differently from short-term acclimatisation. In diving and deep-sea organisms, pressure effects on gases, membranes and proteins generate distinct solutions rather than one general 'extreme physiology' response."],["Space omics and systems physiology","Microgravity redistributes fluid, unloads bone and muscle, alters vestibular input and perturbs immune and circadian regulation. The Space Omics and Medical Atlas integrates molecular, cellular and physiological measurements across missions and model systems, illustrating how modern physiology connects multi-omic change with organ-level function. Bioluminescence research similarly spans luciferin chemistry, symbiosis, neural control and ecological purpose. These are systems problems that require multiple levels of evidence."]],
    p3l1:[["Stem-cell hierarchy and demand","Haematopoietic stem cells balance self-renewal with lineage commitment within bone-marrow niches. Hypoxia-inducible signalling increases renal erythropoietin, while inflammation can restrict iron availability through hepcidin despite adequate stores. Reticulocyte count therefore helps distinguish marrow response from simple cell number. Leucocyte and platelet production are likewise adjusted by cytokines, infection and consumption. Blood counts are dynamic outputs of production, distribution and destruction."],["Coagulation as a cell-based process","The classical intrinsic and extrinsic diagrams help organise factors, but physiological haemostasis is better understood as initiation on tissue-factor-bearing cells, amplification on activated platelets and propagation of thrombin. Endothelial surfaces normally inhibit adhesion and coagulation; injury reverses this balance locally. Virchow's triad—stasis, endothelial injury and hypercoagulability—explains thrombosis risk. Coagulation tests sample selected pathways and cannot alone reproduce the entire in-vivo system."]],
    p3l2:[["Pressure–volume analysis","A ventricular pressure–volume loop integrates filling, isovolumetric contraction, ejection and relaxation. Its width represents stroke volume and enclosed area approximates external stroke work. Increased preload generally raises stroke volume through length-dependent activation; increased afterload initially reduces ejection; increased contractility lowers end-systolic volume. This framework connects cellular muscle properties with arterial pressure and whole-heart performance."],["Electromechanical coupling","The ECG records surface voltage differences, not contraction itself. The P wave represents atrial depolarisation, QRS ventricular depolarisation and T wave ventricular repolarisation. Calcium entry through L-type channels triggers larger sarcoplasmic-reticulum release in cardiac myocytes, and autonomic signals change pacemaker slope, conduction and calcium cycling. Electrical and mechanical events are linked but separated in time, which is why careful correlation is required."]],
    p3l3:[["Flow, resistance and organ autoregulation","Flow equals pressure difference divided by resistance, and small arteriolar-radius changes strongly influence resistance. The heart and brain maintain relatively stable flow across a pressure range through myogenic and metabolic mechanisms, whereas skin and gut change flow according to temperature and digestion. During exercise, sympathetic control supports pressure while local metabolites override constriction in active muscle. Regulation is therefore distributed, not imposed by one central command."],["From lesion to intervention","Coronary angiography shows lumen anatomy but not every aspect of plaque vulnerability or microvascular disease. Fractional flow measurements can assess whether a narrowing limits perfusion. Angioplasty restores local patency, while antiplatelet therapy, lipid reduction, blood-pressure control, exercise and other measures address thrombosis or systemic atherosclerotic risk. The distinction between opening one vessel and modifying the disease process is essential for accurate physiological explanation."]],
    p3l4:[["Plaque biology","Atherogenesis begins with retention and modification of apolipoprotein-B-containing particles in the arterial wall, endothelial activation and monocyte recruitment. Macrophage foam cells, smooth-muscle migration and extracellular matrix form a plaque whose fibrous cap may stabilise or rupture. A severe fixed narrowing can limit flow during exertion, whereas rupture of a less obstructive vulnerable plaque may trigger acute thrombosis. Percentage stenosis alone therefore does not capture all risk."],["Lymphatic pumping and immunity","Initial lymphatics open when tissue pressure pulls anchoring filaments; collecting vessels contain valves and smooth-muscle segments that contract intrinsically and respond to skeletal movement and respiration. Lymph nodes expose antigens to organised immune cells while filtering particles. Intestinal lacteals transport chylomicrons. Primary or acquired lymphatic failure produces protein-rich oedema, inflammation and tissue remodelling, demonstrating that lymphatics regulate both volume and immune traffic."]],
    p4l1:[["Cable properties of axons","Membrane resistance, internal resistance and capacitance determine how far and how fast local voltage spreads. Myelin increases effective membrane resistance and lowers capacitance, allowing nodes to be spaced for rapid reliable regeneration. Temperature, axon diameter and ion-channel distribution also influence velocity. Local anaesthetics block voltage-gated sodium channels, illustrating how conduction can fail even when resting gradients remain largely present."],["Information coding","One action potential has stereotyped amplitude, but stimulus intensity can be represented by firing frequency, recruitment of additional neurons and temporal pattern. Adaptation filters constant inputs, while bursts or synchrony may emphasise change. Neurons integrate thousands of graded synaptic potentials before generating spikes. Thus, 'all-or-none' applies to the individual action potential, not to the richness of information carried by a neural population."]],
    p4l2:[["Synaptic plasticity","Short-term facilitation and depression reflect presynaptic calcium and vesicle availability. Long-term potentiation and depression involve receptor trafficking, kinase signalling, gene expression and structural change, providing cellular models of learning while not equating one mechanism with all memory. Inhibitory circuits shape timing and prevent runaway excitation. Network function depends on excitation–inhibition balance, neuromodulation and homeostatic plasticity."],["Modern resolution across scales","EEG captures millisecond-scale population activity but localises sources imperfectly. Structural MRI distinguishes anatomy; diffusion MRI estimates fibre orientation; functional MRI measures slow haemodynamic correlates of activity. Magnetoencephalography, intracranial recording and optical methods add other trade-offs. Contemporary brain cell atlases use single-cell transcriptomics to reveal neuronal and vascular heterogeneity, but molecular cell types must still be connected to circuit physiology and behaviour."]],
    p4l3:[["Excitation, force and fatigue","Motor units vary in size, contraction speed and fatigue resistance. Recruitment generally proceeds from smaller fatigue-resistant units to larger high-force units, while firing rate changes force. Muscle length and shortening velocity affect tension; elastic elements store and return energy. Fatigue can arise from central drive, neuromuscular transmission, metabolite accumulation, excitation–contraction coupling or substrate limitation, so it is not simply depletion of ATP."],["Disorder as circuit dysfunction","A seizure is a transient network event; epilepsy is a disorder with an enduring predisposition to recurrent seizures. Meningeal inflammation can raise intracranial pressure and injure neural tissue through infection and immune response. At the neuromuscular junction, altered acetylcholine release, receptor function or breakdown produces distinct weakness patterns. Comparing lesion sites—central network, peripheral nerve, junction and muscle—creates a more useful diagnostic framework than memorising symptom lists."]],
    p4l4:[["Sensory coding in skin","Slowly adapting receptors signal sustained pressure and shape; rapidly adapting receptors emphasise onset, offset or vibration. Small receptive fields and dense innervation support fine discrimination. Nociceptors detect potentially damaging mechanical, thermal or chemical conditions, while spinal and descending circuits modulate pain. Pain is an experience influenced by context and central processing, not a direct meter of tissue damage."],["Retinal computation","Photoreceptors release less glutamate in light, creating sign-inverting ON and sign-preserving OFF pathways through bipolar cells. Horizontal and amacrine interactions generate centre–surround organisation, contrast sensitivity and temporal filtering before signals leave the eye. Colour depends on comparison among cone classes rather than one receptor encoding a complete colour. Visual perception then integrates retinal output with eye movements, cortical processing, attention and prior information."]],
    p5l1:[["Clearance and filtration concepts","Glomerular filtration rate depends on filtration coefficient and net Starling forces. Clearance describes the virtual plasma volume cleared of a substance per unit time. A freely filtered, neither reabsorbed nor secreted marker estimates GFR; a substance almost completely removed from renal plasma estimates effective renal plasma flow. Creatinine is clinically practical but affected by production and tubular handling, so estimates carry assumptions."],["Comparative excretion","Freshwater animals face water gain and ion loss, marine teleosts face water loss and salt gain, and terrestrial animals must conserve water while eliminating nitrogen. Malpighian tubules, nephridia and vertebrate kidneys use secretion, filtration and selective transport in different combinations. Nitrogenous product and organ design therefore reflect environment, phylogeny, body size and developmental stage rather than one universal progression toward a 'better' kidney."]],
    p5l2:[["Segment-specific transport","The proximal tubule reabsorbs filtered bicarbonate, nutrients and much sodium and water. The thick ascending limb actively transports salt but is water-impermeable, diluting tubular fluid and building the medullary gradient. Distal segments fine-tune sodium, potassium, calcium and acid–base balance. Collecting-duct aquaporin insertion responds to vasopressin, making water recovery conditional on both gradient and hormone. Urea recycling strengthens the inner-medullary osmotic environment."],["Contemporary cellular maps","Single-cell and spatial multi-omic kidney atlases distinguish cell types, segment transitions and injury states across nephron and interstitium. These datasets update the simplified nephron diagram by revealing cellular heterogeneity and maladaptive repair pathways. They do not replace renal physiology: transcript abundance must be connected to transporter localisation, membrane flux, blood flow and whole-body balance. Their value lies in linking molecular state to established functional compartments."]],
    p5l3:[["Failure as a systems disturbance","Reduced filtration retains nitrogenous solutes, disrupts potassium and acid–base balance, and impairs volume regulation. Loss of erythropoietin contributes to anaemia, while disturbed vitamin-D activation and phosphate handling affect bone. Acute injury and chronic disease differ in time course and reversibility. Estimated GFR and urinary albumin assess complementary aspects and must be interpreted with clinical context."],["Replacement and limitation","Diffusive clearance in dialysis depends on concentration gradient, membrane area and blood–dialysate flow; ultrafiltration removes water by transmembrane pressure. Larger or protein-bound solutes are harder to remove. Peritoneal membrane transport varies among patients and over time. Transplantation can restore broader renal function but introduces immune and medication challenges. No modality precisely reproduces continuous endocrine, metabolic and regulatory activity of native kidneys."]],
    p5l4:[["Follicle dynamics and endocrine transitions","Follicle recruitment, selection and dominance depend on gonadotropins and local ovarian factors. Granulosa and theca cells cooperate in steroid synthesis. After ovulation, luteal progesterone transforms the endometrium from proliferative to secretory. Without implantation, luteolysis lowers progesterone and menstruation follows; with implantation, embryonic hCG rescues early luteal function until placental steroid production is established."],["Contemporary reproductive physiology","Single-cell atlases of endometrium, ovary and fallopian tube reveal changing epithelial, stromal, vascular and immune states across cycle, pregnancy and ageing. Assisted reproduction separates stimulation, oocyte retrieval, fertilisation, embryo culture and transfer, making normal control points experimentally visible. These technologies also raise questions of access, consent, embryo governance and long-term evidence. Mechanistic knowledge should be paired with ethical and clinical boundaries."]],
    b1l1:[["From description to causal explanation","A strong behavioural study distinguishes a behavioural state, which has measurable duration, from an event, which is effectively instantaneous. It identifies the animal's available information, specifies the comparison and separates correlation from manipulation. Proximate mechanisms can themselves have evolutionary histories, while an adaptive function must be demonstrated through consequences for survival or reproduction. Tinbergen's questions are therefore intersecting research programmes rather than four mutually exclusive labels."],["Replication and field validity","Behaviour varies among individuals, seasons and social contexts. Pseudoreplication occurs when repeated observations of one individual or group are treated as independent animals. Mixed-effects models, preregistered criteria and repeated populations improve inference. Field experiments retain ecological realism but face uncontrolled variation; laboratory work isolates mechanisms but may alter motivation or opportunity. Converging evidence across settings is usually stronger than privileging either one automatically."]],
    b1l2:[["Reaction norms and indirect genetic effects","A genotype may produce different behaviours across environments, and genotypes may differ in the shape of this reaction norm. Social partners also form part of the environment: genes expressed in one individual can alter another's phenotype, creating indirect genetic effects. Maternal provisioning, hormone exposure and early social experience can generate durable behavioural differences without changing DNA sequence. Experimental design must therefore separate direct inheritance, shared environment and socially mediated development."],["Genomics without genetic determinism","Genome-wide association and transcriptomic studies can identify variants or pathways correlated with behavioural variation, but effect sizes are usually small and context-dependent. Population structure, measurement quality and multiple testing require stringent control. Polygenic prediction developed in one population may transfer poorly to another. The scientifically responsible conclusion is that genomic data illuminate biological pathways and variation; they do not convert complex behaviour into a fixed genetic destiny."]],
    b1l3:[["Designing an informative ethogram","Categories should be mutually distinguishable, biologically meaningful and visible at the chosen distance. Broad states such as feeding may need subcategories for searching, handling and ingestion when sequence matters. Pilot observations reveal ambiguous definitions and rare events. Inter-observer agreement can be quantified rather than assumed. Context variables—location, partner identity, resource, disturbance and time—should be recorded when they test the hypothesis."],["Contemporary automated observation","Computer vision, acoustic classifiers and accelerometers can extend observation across long periods, but algorithms inherit biases from training labels, camera placement and species morphology. Automated output must be validated against independent human-coded or physiological ground truth. Rare behaviours and novel contexts are especially vulnerable to misclassification. Technology improves scale; it does not eliminate the need for operational definitions, sampling theory and welfare-sensitive deployment."]],
    b2l1:[["Sexual selection after mating","Competition continues after copulation through sperm competition, cryptic female choice and differential investment. Testis size, mating plugs, sperm traits and female reproductive physiology may reflect this post-copulatory selection. Sexual conflict arises when the fitness interests of mates differ, potentially driving antagonistic coevolution. These processes complicate simple narratives in which one sex chooses and the other merely competes."],["Dynamic mating strategies","Mating behaviour depends on condition, age, status, density and operational sex ratio. Frequency-dependent tactics can coexist when the success of one tactic falls as it becomes common. Genetic parentage analysis often reveals mating outside observed social pairs, separating social system from genetic system. A complete account links ecological distribution, mate access, parental care, behavioural observation and reproductive outcome."]],
    b2l2:[["Multilevel accounting of social fitness","Inclusive-fitness and multilevel-selection formulations can describe the same evolutionary change when costs and benefits are partitioned consistently. What matters empirically is assortment: cooperators must interact disproportionately with individuals or groups in which cooperation yields a transmitted advantage. Kin recognition is not always required because limited dispersal or family structure can create assortment. Relatedness is a statistical property of social partners relative to the population, not simply a genealogical label."],["Conflict within cooperation","Cooperative societies contain reproductive conflict, policing, dominance and negotiation. Eusocial colonies regulate worker reproduction; cooperative breeders balance helping with future dispersal; group hunters divide uncertain benefits. Stable cooperation may combine kinship, repeated interaction, partner choice and sanctions. Rather than asking whether a species is cooperative or selfish, analyse how incentives change across roles, ecological conditions and time."]],
    b2l3:[["Signal detection and information theory","Receivers must discriminate a signal from environmental noise and irrelevant variation. Signal-to-noise ratio, redundancy and multimodal combination influence reliability. In acoustic communication, habitat filters frequency and temporal pattern; in chemical communication, persistence supports long-term marking but reduces rapid modulation. Information content can be quantified, but information alone does not establish intentional meaning. Receiver response and fitness consequences complete the communication analysis."],["Parent–offspring conflict and negotiation","An offspring may be selected to demand more investment than maximises parental lifetime fitness, while parents allocate among current young and future reproduction. Begging can honestly reflect need when costs or shared interests stabilise it, yet competition among siblings can exaggerate signals. Cross-fostering, playback and food-manipulation experiments test causality. Care is thus a dynamic negotiation shaped by relatedness, condition and ecological risk."]],
    b3l1:[["Hierarchical habitat choice","Selection occurs at multiple scales: geographic range, home range, patch and immediate microsite. Resource-selection functions compare used with available locations, but availability must reflect what the animal could realistically access. Presence does not necessarily indicate preference if dominant competitors exclude individuals from better habitat. Likewise, preference does not guarantee fitness when human-altered cues create ecological traps. Demography is needed to evaluate habitat quality."],["Movement ecology in the biologging era","GPS, accelerometers, magnetometers, depth sensors and heart-rate loggers connect movement with behaviour, energetics and environment. Large tracking datasets reveal migration corridors and responses to storms or disturbance. Tags can nevertheless alter drag, balance, social signalling or energy expenditure; device effects must be tested. Machine-learning classifications require validated training data and uncertainty reporting, especially when exported across individuals or species."]],
    b3l2:[["Associative structure beyond labels","Classical and operant conditioning share prediction-error processes: learning is strongest when outcomes differ from expectation. Blocking shows that temporal pairing alone is insufficient when an existing cue already predicts the outcome. Extinction creates new inhibitory learning rather than necessarily erasing the original association, explaining context-dependent recovery. These phenomena move the discussion beyond lists of conditioning types toward mechanisms of prediction and updating."],["Cognition with ecological validity","Food-storing birds, navigating insects and social mammals solve different information problems. Tests should reproduce relevant perceptual and motivational conditions and rule out inadvertent cueing. Flexible transfer to novel situations supports richer inference than success after extensive training on one task. Comparative cognition is strongest when it combines controlled experiments, natural behaviour and neural or sensory evidence without ranking species on a single human-centred scale."]],
    b3l3:[["State-dependent optimality","The same patch can be acceptable to a hungry, cold or subordinate animal and unacceptable to a satiated or dominant one. Dynamic-state models incorporate future consequences, energy reserves and mortality risk, while nutrient-space models add protein, carbohydrate and micronutrient balance. Apparent suboptimality may reflect an unmeasured currency or constraint. A useful model exposes these assumptions and generates testable deviations rather than explaining every outcome after the fact."],["Stress, allostasis and welfare","Allostasis anticipates demand by changing physiology and behaviour, whereas chronic allostatic load can impair growth, reproduction and immunity. Glucocorticoids are metabolic regulators, not a universal numerical measure of suffering; low values may occur after system exhaustion and high values during adaptive activity. Welfare assessment should combine behaviour, injury, health, physiological indicators and opportunity for valued activities. Environmental enrichment must be evaluated by animal use and outcome, not by human appearance."]],
    b4l1:[["Evidence accumulation and confidence","Sequential-sampling models propose that noisy evidence accumulates until a decision boundary is reached. Wider boundaries increase accuracy but delay action; urgency or predation may favour faster decisions. Some animals show uncertainty monitoring by declining difficult trials or seeking information, but alternative reinforcement histories must be excluded. Confidence-like behaviour is therefore analysed operationally through choices, latency and information seeking rather than assumed from human analogy."],["Memory as a distributed process","Working memory supports immediate manipulation, while long-term memory includes procedural, spatial, recognition and event-like components. Consolidation depends on neural reactivation and can be modified during reconsolidation after retrieval. Forgetting may reduce interference and update outdated information rather than represent simple failure. Ecological demands predict specialisations, yet performance also depends on sensory access, motivation and testing format."]],
    b4l2:[["Collective computation in colonies","Honeybee nest-site choice illustrates distributed evidence accumulation. Scouts advertise sites by dances whose persistence reflects quality; cross-inhibitory stop signals reduce competing recruitment; a quorum at a site triggers commitment. No individual compares all alternatives, yet colony-level selection can produce accurate outcomes. The case links individual decision rules, feedback and emergent social organisation without invoking a central commander."],["Plasticity in division of labour","Age polyethism is flexible: young workers usually perform brood and nest tasks, while older workers forage, but colony demography and resource need can accelerate or reverse transitions. Juvenile hormone, nutrition, gene expression and social signals interact. Hygienic behaviour and defence similarly vary among colonies and environments. This makes honeybees a powerful model for connecting molecular physiology with social behaviour and applied colony management."]],
    b4l3:[["Operational levels of representation","A representation can be indexed by whether information guides behaviour when the referent is absent, supports transfer to new contexts or combines with other symbols. The waggle dance shows displacement; learned labels in selected animals show category reference; human language additionally exhibits productive syntax and open-ended generativity. Treating all communication as either language or non-language hides meaningful intermediate capacities."],["Consciousness and cautious inference","No single mirror test, neuron count or verbal analogy settles consciousness. Researchers combine flexible learning, pain-related trade-offs, expectation, memory, metacognitive behaviour, sleep and neural organisation. Negative results can reflect sensory or motor mismatch rather than absence of capacity. Ethical precaution may be justified before scientific certainty, but claims should state exactly which affective or awareness dimension the evidence addresses."]],
    b5l1:[["Phase-response analysis","A light pulse can delay, advance or minimally affect the clock depending on circadian phase. A phase-response curve maps these effects and explains why the same light exposure has different consequences at different biological times. Entrainment occurs when daily phase shifts compensate for the difference between endogenous period and 24 hours. Constant-light or constant-dark experiments separate endogenous rhythmicity from direct environmental responses."],["Cellular oscillators and coupling","CLOCK/BMAL1-driven transcription and PER/CRY-mediated repression form a core mammalian loop, while accessory loops stabilise phase and amplitude. Individual cells can oscillate, but intercellular coupling in the suprachiasmatic nucleus increases precision. Peripheral tissues retain clocks whose phase responds to feeding, hormones and temperature. Modern reporters track these oscillations in living cells, linking molecular feedback to organ and behavioural rhythms."]],
    b5l2:[["Multiple zeitgebers and misalignment","Retinal light strongly entrains the central clock, while meal timing, activity and temperature influence peripheral tissues. Shift work and rapid time-zone travel create internal desynchrony because components re-entrain at different rates. Social jet lag describes mismatch between biological and imposed schedules. Experimental interpretation must record light history, sleep, feeding and sampling time because an apparent disease difference may actually reflect phase difference."],["Photoperiodic measurement","Organisms may measure night length through melatonin duration or compare light with a circadian photosensitive phase. Long- and short-day breeders use these signals differently. In birds, deep-brain photoreceptors and thyroid-hormone pathways contribute to seasonal reproductive activation. Climate change and artificial light at night can uncouple photoperiod from temperature and food peaks, creating ecological consequences that chronobiology can predict and test."]],
    b5l3:[["Chronopharmacological mechanisms","Time of administration can change gastric emptying, liver metabolism, renal clearance, receptor abundance, immune traffic and disease activity. A drug may therefore show rhythmic pharmacokinetics, rhythmic target sensitivity or both. Chronotherapy requires evidence for the specific agent, outcome and patient schedule; one preferred time cannot be generalised across diseases. Recent randomised studies also show that plausible timing hypotheses may fail to improve selected outcomes, making negative evidence important."],["From population timing to personal phase","Clock time is an imperfect proxy for biological time because chronotype, light exposure, age, shift work and illness change phase. Melatonin onset, core temperature, actigraphy and transcriptomic markers can estimate internal phase, but feasibility and validation differ. Contemporary chronomedicine aims to personalise timing while avoiding overclaiming from small or retrospective studies. The research frontier is rigorous prospective testing with adherence, safety and clinically meaningful endpoints."]],
    d1l1:[["Whole-farm systems analysis","A dairy enterprise links crop residues, fodder, animals, labour, manure, energy, water and markets. Gross milk income alone can conceal purchased-feed cost, replacement cost, reproductive delay, health loss and unpaid family labour. Partial budgeting compares a proposed change with the current system, while cash-flow planning reveals seasonal shortages. Biological efficiency, economic return, animal welfare and environmental effect should be assessed together because improvement in one metric can worsen another."],["Sustainability and climate context","Ruminants convert cellulose-rich biomass into food but emit enteric methane and produce nutrient-rich waste. Emission intensity per unit milk may fall with better health, fertility, feed quality and lifetime productivity, yet total resource use still matters. Manure storage and land application influence methane, nitrous oxide and water quality. Climate-resilient dairying therefore combines heat adaptation, water security, fodder planning, disease surveillance and realistic herd size rather than relying on one technological fix."]],
    d1l2:[["Genotype by environment interaction","A breed's ranking can change across feeding level, heat load and disease pressure. High genetic potential for milk may not be expressed under limited nutrition, while locally adapted breeds may sustain fertility, survival and lower input costs. Crossbreeding can exploit heterosis, especially for low-heritability fitness traits, but indiscriminate crossing erodes breed identity and produces inconsistent animals. A breeding plan must specify the target production environment and maintain pedigree records."],["Genomic selection and diversity","Genomic breeding values use dense markers and a reference population with reliable phenotypes to predict young animals before progeny records accumulate. Accuracy depends on population relatedness, data quality and trait definition. Selection now includes fertility, longevity, udder health, feed efficiency and heat tolerance alongside yield. Rare indigenous alleles and breeds are genetic resources; conservation and improvement should be planned together rather than treating local diversity as an obstacle to productivity."]],
    d1l3:[["Reproductive efficiency as a system","Oestrus expression is influenced by nutrition, heat stress, lameness, postpartum disease and observation frequency. The practical chain includes heat detection, insemination at an appropriate interval, hygienic semen deposition, pregnancy diagnosis and rebreeding decisions. Conception rate alone is insufficient: submission rate, pregnancy rate, calving interval and pregnancy loss identify different bottlenecks. Records convert reproductive failure from a vague impression into a diagnosable process."],["Semen technology and governance","Semen collection centres require donor health screening, traceable identification, hygienic processing, quality assessment, cryopreservation and cold-chain control. Sex-sorted semen can alter replacement planning but often has lower conception under some conditions and higher cost. Embryo transfer and genomic testing accelerate dissemination of elite genetics while increasing the importance of inbreeding control and broad breeding objectives. Use must follow authorised veterinary and breeding programmes."]],
    d2l1:[["Cow-centred design","Lying time, walking confidence, feeding access, social competition and thermal comfort are measurable design outcomes. Stall or bed dimensions should fit animal size; abrasive or slippery floors increase lesions and fear; dead ends and sharp turns disrupt movement. Stocking density influences feeding displacement and rest. Model design therefore begins with animal behaviour and body dimensions, then integrates labour, machinery and future expansion."],["Biosecurity by layout","New animals, sick animals, calving areas, calves, feed, manure and milk should move through routes that minimise cross-contamination. Isolation requires separate airspace or distance, equipment and drainage—not merely a labelled pen. A clean-to-dirty work sequence and handwashing points reduce transfer. Vehicle and visitor entry can be controlled without blocking emergency access. Spatial planning converts biosecurity from a written rule into routine behaviour."]],
