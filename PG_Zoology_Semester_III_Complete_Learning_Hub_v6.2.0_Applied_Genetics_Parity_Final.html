    d2l2:[["Heat, moisture and air quality","Respiration, manure and wet surfaces add water vapour, carbon dioxide, ammonia and bioaerosols. Air exchange must remove contaminants while avoiding draught at calf level. Temperature–humidity index provides a screening measure for heat load but does not capture solar radiation, airspeed or individual adaptation. Respiration rate, panting, body temperature, lying and intake provide animal-based evidence of actual thermal strain."],["Circular nutrient management","Manure contains nitrogen, phosphorus, organic matter and pathogens. Separation, composting or anaerobic digestion can recover value, but storage and application must match crop need and rainfall risk. Anaerobic pits can accumulate lethal gases, requiring exclusion and trained procedures. Nutrient budgeting prevents repeated overapplication near the shed while distant fields remain deficient. Wastewater and silage effluent also require containment, not dilution into surface water."]],
    d2l3:[["Physiological cost of heat","Cows reduce feed intake and shift blood toward skin during heat stress, while panting alters acid–base balance and maintenance requirements. Milk yield and fertility may decline before obvious collapse. Shade blocks radiation; fans increase convective and evaporative loss; sprinklers must wet skin sufficiently and be paired with airflow. Cooling holding areas can be especially valuable because crowding concentrates heat. Water-point number, flow and cleanliness become critical."],["Seasonal preparedness","Winter care focuses on dry insulation, calf energy, wind protection and continued ventilation. Seasonal plans should secure fodder, bedding, water, backup power and disease-control supplies before extreme conditions. Body-condition, lameness, mastitis, fertility and production records can be examined by season to identify recurring failures. Management is stronger when thresholds for action are defined in advance rather than relying on subjective impressions of discomfort."]],
    d3l1:[["Rumen fermentation and ration balance","Carbohydrate fermentation produces acetate, propionate and butyrate with different roles in fat synthesis, glucose supply and epithelial metabolism. Microbial protein depends on synchronised fermentable energy and rumen-available nitrogen. Excess rapidly fermentable starch can lower pH and disturb microbial communities, while very low-quality roughage limits intake through rumen fill. Ration formulation must therefore balance nutrients and physical form, not merely meet a crude-protein percentage."],["Feed evaluation","Dry matter standardises comparison among wet and dry feeds. Proximate analysis provides broad fractions, while neutral- and acid-detergent fibre better describe cell-wall content; laboratory digestibility and energy systems refine prediction. Representative sampling is essential because a single handful may not reflect a silage pit or feed batch. Mycotoxins, rancidity, soil contamination and adulteration can make chemically adequate feed biologically unsafe."]],
    d3l2:[["Mineral interactions and transition risk","Calcium, phosphorus and magnesium interact in absorption and metabolism, while trace minerals may compete for transport. Excess supplementation can be toxic or polluting. Around calving, calcium demand rises abruptly, and ration strategies aim to prepare homeostatic mechanisms rather than simply add indiscriminate calcium. Vitamin status depends on diet, storage, sunlight, rumen function and physiological stage. Blood or feed analysis may be needed when deficiency is suspected."],["Evidence-based additive use","An additive should have a defined target, plausible mechanism, independent evidence, legal status and measurable response. Buffers may support selected high-concentrate rations; yeast products can alter rumen conditions; mycotoxin binders are compound-specific; methane inhibitors require validated delivery and food-safety assessment. Farm trials should use comparable groups and adequate duration. Marketing claims without ration context or outcome records are not evidence."]],
    d3l3:[["Early-life programming","Timely colostrum management depends on quality, quantity, cleanliness and speed. Passive transfer can be assessed rather than assumed. Starter intake stimulates rumen papilla development through fermentation products, while water is required for microbial activity even when liquid feed is provided. Growth should be monitored by weight or structural measures. Disease and undernutrition during calfhood can reduce future performance long after apparent recovery."],["Precision feeding by physiological group","Grouping cows by production and stage can reduce over- and underfeeding, but regrouping may increase social stress. Feed-bunk management, mixing accuracy, sorting behaviour and dry-matter change alter the ration actually consumed. Transition-cow monitoring includes body condition, rumination, intake, calving difficulty and early-lactation disease. Precision systems add sensors, but consistent observation and verified feed delivery remain the foundation."]],
    d4l1:[["Milk synthesis at the alveolus","Mammary epithelial cells synthesise lactose, proteins and lipids, drawing water osmotically into secretion. Myoepithelial contraction under oxytocin ejects milk from alveoli, whereas stress can impair let-down without stopping synthesis immediately. Blood flow and nutrient partitioning support lactation. Fat globules, casein micelles and dissolved lactose give milk simultaneous emulsion, colloid and solution properties relevant to processing."],["Quality data and adulteration control","Somatic-cell count indicates mammary inflammation at animal or bulk-tank level but is not a direct pathogen count. Standard plate count reflects viable microbial load under specified conditions. Freezing point, density and component analysis help detect added water or compositional abnormality. Rapid tests are screening tools whose sensitivity, specificity and calibration matter. A defensible quality programme combines sampling protocol, instrument control and confirmatory testing."]],
    d4l2:[["Time–temperature science","Microbial destruction is probabilistic and depends on organism, matrix and temperature. Pasteurisation schedules are validated to achieve a defined safety margin while limiting flavour and nutrient change. Phosphatase testing can verify adequate heat treatment in appropriate products. Ultra-high-temperature treatment and aseptic packaging pursue commercial sterility through a different process. Recontamination after heating remains a major hazard, so zoning and packaging hygiene are as important as the heater."],["Indian regulatory context","Milk and dairy businesses must follow applicable FSSAI identity, hygiene, contaminant, residue, labelling and storage requirements rather than treating 'natural' as proof of safety. Procurement records, chilling, tanker cleanliness and traceability allow a contaminated lot to be investigated. Antibiotic residues can disrupt fermentation and pose public-health concerns. The cold chain slows growth but does not reverse toxins or deterioration already produced."]],
    d4l3:[["Product microbiology and chemistry","Curd formation may result from acid-induced casein coagulation, whereas rennet cheeses use enzymatic destabilisation followed by whey removal and ripening. Butter inverts the cream emulsion through churning; ghee removes water and non-fat solids by heating. Milk powder stability depends on water activity, packaging and oxidation. Each process selects a different component fraction and therefore changes nutrient density, texture, hazard and shelf life."],["Enterprise design and truthful claims","Yield must be measured from a known volume and composition of raw milk, with losses and by-products recorded. Shelf-life studies require defined packaging and storage rather than guesswork. Product labels should not make unsupported therapeutic claims. Market testing, batch costing, legal registration, sanitation schedules and recall capability distinguish an enterprise from informal production. Whey and other by-products can become foods or inputs only when their quality and market are planned."]],
    d5l1:[["Mastitis epidemiology","Contagious pathogens spread mainly during milking, whereas environmental pathogens arise from bedding, manure and water; control priorities therefore differ. Bulk-tank counts, individual somatic-cell records, clinical-case cultures and treatment outcomes locate herd problems. Selective dry-cow strategies require veterinary oversight and reliable infection data. Chronic high-cell-count animals may remain reservoirs even when milk appears normal."],["Johne's disease as a long-horizon problem","Infection is often acquired by calves, followed by a prolonged silent period before shedding or clinical disease. Test sensitivity varies with stage, so one negative result does not prove freedom. Calving hygiene, separation from adult manure, management of colostrum and milk, risk-based testing and purchase policy must operate for years. Control succeeds through consistent exposure reduction, not rapid medication of visible cases."]],
    d5l2:[["Life-cycle-based parasitology","Coccidia multiply in intestinal cells after resistant oocysts are ingested; crowding and contaminated calf environments raise exposure. Theileria uses tick vectors and has intracellular stages affecting blood and lymphoid cells. Flukes require suitable intermediate hosts and wet habitats, while tapeworm cycles vary by species. Trypanosomes rely on biting vectors and evade immunity through antigenic variation. These differences determine whether sanitation, pasture, vector or host treatment is the strongest control point."],["Anthelmintic and acaricide stewardship","Underdosing, frequent blanket treatment and repeated use of one drug class select resistance. Weight estimation, calibrated equipment, product quality, timing and post-treatment assessment improve use. Targeted selective treatment preserves susceptible parasite refugia in selected systems, but requires diagnostics and local expertise. Vector control also combines habitat, animal treatment, surveillance and quarantine rather than escalating chemical use alone."]],
    d5l3:[["Outbreak logic and official response","Foot-and-mouth disease spreads rapidly through direct contact, fomites and aerosols under suitable conditions; suspected vesicular disease demands immediate veterinary and statutory action. Infectious bovine rhinotracheitis can establish latency, allowing apparently recovered animals to remain epidemiologically important. Vaccination may reduce disease and transmission but protection depends on antigen match, programme coverage and timing. Farm-level improvisation cannot replace official outbreak control."],["One Health antimicrobial stewardship","WOAH standards emphasise disease prevention, diagnosis, veterinary oversight, correct choice and dose, treatment records, withdrawal periods and monitoring of antimicrobial use. Biosecurity, vaccination, housing, nutrition and early detection reduce the need for treatment. Culture and susceptibility testing guide selected cases. Critically important antimicrobials should never be used casually for growth promotion or as a substitute for hygiene; resistance connects animal, human and environmental health."]]

  const geneticsDeepening={
    g1l1:[["Advanced integration · probability and inference","A Mendelian cross is a generative model: parental genotypes determine gamete probabilities, fertilisation combines those probabilities, and phenotype rules map genotypes to observations. This framing separates biological assumptions from arithmetic. Likelihood methods can compare competing inheritance models, while chi-square tests ask whether discrepancies exceed sampling expectation. Power depends on family size and effect visibility; therefore, an apparently unusual small family does not automatically refute segregation."],["Recent advances · direct observation of transmission","Dense sequencing and long-read phasing can follow complete parental haplotypes rather than one visible marker at a time. Single-gamete and embryo datasets reveal recombination, segregation distortion and de novo mutation at high resolution. These approaches strengthen rather than replace classical crosses: investigators must still specify phase, expected transmission and ascertainment. The central update is that inheritance can now be tested across whole haplotypes and structural variants that were previously invisible."],["Worked example · testing a dihybrid ratio","In 320 F₂ offspring, a 9:3:3:1 model predicts 180, 60, 60 and 20 individuals. Suppose the observations are 174, 66, 58 and 22. Calculate Σ(O−E)²/E across the four classes and compare the result with a chi-square distribution using three degrees of freedom. Before interpreting significance, verify that classes were scored independently and that viability, linkage or penetrance did not systematically change the counts."]],
    g1l2:[["Advanced integration · networks, dosage and epistasis","Epistasis is best understood as non-additivity within a causal network. An upstream enzyme can determine whether a downstream colour modifier is visible; a transcription factor can alter many targets; and dosage compensation can buffer a partial loss of function. Statistical epistasis describes departure from an additive model, whereas mechanistic epistasis identifies a physical or biochemical dependency. The two overlap only when experiments connect the statistical interaction to molecular causation."],["Recent advances · modifier screens and single-cell phenotypes","CRISPR perturbation screens, single-cell transcriptomics and quantitative imaging now expose modifier genes that alter penetrance or severity. The same pathogenic variant can produce distinct cellular states because background variants change pathway capacity, stress responses or developmental timing. Current genetics therefore treats expressivity as a distribution generated by genotype, cell state and environment, not as noise around a single canonical phenotype."],["Worked example · reconstructing 9:7","Let genes C and P encode consecutive steps required for purple pigment. Only C_P_ individuals complete both steps; C_pp, ccP_ and ccpp remain colourless. In an F₂ cross, the four purple-producing genotype classes total 9/16, while the three blocked groups total 7/16. Writing the pathway first explains the ratio and predicts that supplying the missing intermediate may rescue one block but not the other."]],
    g1l3:[["Advanced integration · recombination as an evolutionary process","Crossovers are both mapping events and mechanisms that reshuffle ancestry. The probability of exchange varies with chromosomal position, sex, sequence motifs and chromatin. Interference makes adjacent crossovers non-independent, while gene conversion can transfer short tracts without reciprocal flanking-marker exchange. A genetic map therefore measures transmission behaviour in a defined cross or population; it is not identical to physical DNA distance."],["Recent advances · long-read phasing and recombination maps","Long-read sequencing resolves multi-kilobase haplotypes, repetitive regions and structural rearrangements that confound short-read mapping. Large pedigrees and single-sperm sequencing generate fine-scale recombination maps and reveal individual variation in hotspot use. Pangenome graphs further reduce reference bias when haplotypes contain insertions or inversions. These tools explain why the same physical interval may have different genetic lengths across populations or sexes."],["Worked example · three-point mapping","A test cross yields parental classes ABC/abc at 410 and 398, double crossovers AbC/aBc at 8 and 10, and four single-crossover classes totalling 174. The allele that switches relative to the parental arrangement identifies the middle gene. Add double crossovers to each relevant interval before calculating map distance. Expected double crossovers equal the product of interval recombination fractions multiplied by total progeny; comparing observed and expected values gives coincidence and interference."]],
    g1l4:[["Advanced integration · covariance and genotype–environment interaction","Quantitative inheritance depends not only on variances but also on covariances among traits and environments. Selection on body size may indirectly alter maturation time when breeding values are genetically correlated. Reaction norms show that genotypes can differ in both mean performance and environmental sensitivity. Consequently, one heritability estimate cannot be transported uncritically between populations, age groups, diets or climates."],["Recent advances · genomic prediction and polygenic scores","Dense genomic markers are now used to estimate breeding values and polygenic scores without identifying every causal variant. A 2024 multi-population clinical validation study illustrates the need to optimise and test scores across diverse ancestry groups before implementation. Prediction may fall when linkage disequilibrium, allele frequency or environment differs from the training cohort. Genomic scores stratify probability; they do not diagnose an individual or erase social and environmental determinants."],["Worked example · response to selection","A population has mean mass 40 g. Selected parents average 46 g, so S=6 g. If narrow-sense heritability is 0.35, the breeder's equation predicts R=2.1 g and an offspring mean near 42.1 g under comparable conditions. State why this is a one-generation expectation: allele frequencies, genetic correlations, assortative mating and a changed environment can all alter later responses."]],
    g2l1:[["Advanced integration · functional boundaries of genes","A gene can be defined through inheritance, transcription, molecular product or regulatory function, and these boundaries do not always coincide. Overlapping transcripts, alternative promoters, antisense RNAs and distant enhancers challenge the idea of one compact coding unit. Functional assignment therefore combines comparative conservation, expression, chromatin contacts, variant segregation and perturbation. A sequence is not established as a disease gene merely because it lies near an associated marker."],["Recent advances · pangenomes and complete haplotypes","The draft human pangenome and subsequent graph-based references represent multiple assembled haplotypes instead of forcing every read onto one linear genome. Long reads and telomere-to-telomere assemblies improve detection of segmental duplications, repeat expansions and complex structural variants. The conceptual advance is population-aware reference structure: 'reference' is an analytical coordinate system, not a normal or ideal human genome."],["Worked example · classifying a variant","A substitution in the last nucleotide of an exon is synonymous at the codon level but weakens a splice-donor signal. RNA analysis shows exon skipping and a frameshift. Classifying it only as 'silent' would be wrong. A defensible interpretation integrates population frequency, segregation, RNA consequence, protein domain, functional assay and phenotype, then records whether the evidence supports pathogenicity, benignity or continuing uncertainty."]],
    g2l2:[["Advanced integration · repair pathway competition","A DNA lesion enters a decision network shaped by lesion chemistry, chromatin, replication and cell-cycle stage. Resection promotes homologous recombination, whereas protection of broken ends favours end joining. Mismatch repair can correct polymerase errors yet also influence the fate of genome-editing intermediates. Checkpoint failure permits damaged templates to replicate, turning reversible damage into fixed mutation and chromosomal instability."],["Recent advances · PE7 prime editing","A 2024 Nature study used genome-scale CRISPR-interference screens to identify the RNA-binding protein La as a determinant of prime editing. Fusing its RNA-binding domain to a prime editor produced PE7 and improved intended editing across several contexts by supporting pegRNA function. The result illustrates a central principle: editing efficiency depends on cellular RNA stability and repair environment, not only on guide–target complementarity."],["Worked example · selecting an editing strategy","To correct a pathogenic G→A substitution, compare nuclease-directed homology repair, base editing and prime editing. Ask whether the desired change lies within an editor window, whether bystander bases are present, whether dividing cells provide a donor-template pathway, and whether the edit can be installed without a double-strand break. Final evaluation must quantify intended alleles, indels, off-target changes, mosaicism and functional rescue—not editing percentage alone."]],
    g2l3:[["Advanced integration · resolution matched to hypothesis","Genetic tests form a resolution ladder rather than a hierarchy in which the newest method always wins. A karyotype reveals whole-chromosome architecture, FISH answers a targeted positional question, arrays measure dosage, and sequence analysis detects nucleotide-level variation. Repeat expansions, balanced rearrangements and low-level mosaicism need specialised methods. Test selection should begin with phenotype, inheritance pattern and suspected variant class."],["Recent advances · optical and long-read genome analysis","Long-read sequencing and optical genome mapping increasingly unify detection of structural variation, repeat length and haplotype phase. Trio analysis distinguishes inherited from de novo events, while low-pass genome sequencing can quantify some mosaic aneuploidies. These approaches reduce diagnostic fragmentation but still require orthogonal confirmation, validated pipelines and careful interpretation of incidental or uncertain findings."],["Worked example · Bayesian pedigree revision","A dominant disorder has 80% penetrance. An at-risk adult has a prior carrier probability of 1/2 but remains unaffected beyond the usual age of onset. The probability of being unaffected is 0.2 for a carrier and 1.0 for a non-carrier. Bayes' rule gives a posterior carrier probability of (0.5×0.2)/[(0.5×0.2)+(0.5×1.0)]=1/6. Molecular testing can then update this risk further."]],
    g2l4:[["Advanced integration · pathway-to-phenotype reasoning","An inborn error may injure through substrate accumulation, toxic side products, missing product, energy failure or organ-specific storage. Residual enzyme activity, alternative pathways and treatment timing explain why individuals with the same locus can differ. A mechanistic case analysis should move through gene, protein, reaction, metabolite, cell, organ and clinical sign rather than memorising an isolated list of symptoms."],["Recent advances · integrated genomic and metabolic diagnosis","Exome or genome sequencing is increasingly combined with metabolomics, enzyme assays and newborn-screening data. Rapid sequencing can shorten diagnosis in critically ill infants, yet a molecular variant remains most useful when biochemical and phenotypic evidence converge. Emerging substrate-reduction, chaperone, RNA and gene therapies are disorder-specific; long-term effectiveness, access and off-target effects remain essential questions."],["Worked example · recurrence and counselling","Two unaffected parents have a child with a confirmed autosomal-recessive enzyme deficiency and both are carriers. Each pregnancy has probabilities of 1/4 affected, 1/2 carrier and 1/4 unaffected non-carrier; previous outcomes do not change the next conception. Counselling should distinguish recurrence probability from prognosis, explain testing limits and present reproductive options without directing the family's choice."]],
    g3l1:[["Advanced integration · disequilibrium has multiple causes","Hardy–Weinberg departure is a diagnostic signal, not a named evolutionary force. Inbreeding, assortative mating, population mixture, viability selection and genotyping error can all reduce observed heterozygosity. Excess heterozygosity can follow negative assortative mating or some forms of selection. Replicate populations, ancestry covariates and technical quality metrics are needed before a biological explanation is preferred."],["Recent advances · biobank-scale quality control","Modern association studies apply equilibrium tests across millions of variants, stratified by ancestry and sometimes by sex. Extreme deviations can flag assay failure, copy-number variation or sample contamination, but genuine disease association may also produce deviation in selected case groups. Large datasets make tests highly sensitive, so effect size, allele count and biological context matter alongside a small P value."],["Worked example · allele and carrier frequency","If an autosomal-recessive phenotype occurs in 1 of 10,000 births under stated equilibrium assumptions, q²=0.0001 and q=0.01. Then p=0.99 and expected heterozygote frequency 2pq≈0.0198, or about 1 in 50.5. This is an estimate for the sampled population; substructure, consanguinity, allelic heterogeneity or incomplete diagnosis can invalidate the simple calculation."]],
    g3l2:[["Advanced integration · selection across life history","Fitness is the integrated contribution of survival, mating and reproduction across a life cycle. An allele can improve juvenile survival but reduce adult fertility, producing antagonistic effects whose net value depends on age structure. Dominance determines how selection sees rare alleles, and fluctuating environments can reverse genotype rankings. Selection coefficients therefore belong to a defined ecological and demographic model."],["Recent advances · temporal and polygenic selection","Ancient genomes, archived specimens and longitudinal pathogen datasets allow allele frequencies to be observed through time rather than inferred only from present-day patterns. Polygenic adaptation is evaluated through coordinated shifts across many loci, with strong controls for population history. Current studies emphasise that demographic change can mimic selection; inference should compare neutral simulations, linked variation and independent functional evidence."],["Worked example · change under selection","Genotype fitnesses are AA=1, Aa=1 and aa=0.8, with q(a)=0.20. Begin with Hardy–Weinberg genotype frequencies, multiply each by its fitness, sum to obtain mean fitness, then renormalise. Count a alleles among survivors to obtain the next-generation q. Repeating the calculation shows why a partially recessive deleterious allele is removed rapidly when common but slowly when mostly hidden in heterozygotes."]],
    g3l3:[["Advanced integration · coalescent perspective","The coalescent traces sampled alleles backward to common ancestors. Small effective size shortens expected coalescence time and increases stochastic variation among loci; recombination allows different genomic segments to possess different genealogies. This framework connects drift, linkage disequilibrium and demographic inference. A genomic estimate of past effective size is therefore an average over ancestral reproduction and model assumptions, not a census reconstructed person by person."],["Recent advances · ancestral recombination graphs","Ancestral recombination graphs and identity-by-descent methods increasingly reconstruct local genealogies across whole genomes, including ancient samples. A 2024 Nature Genetics study improved detection of shared segments in ancient DNA, allowing fine-scale kinship and demographic reconstruction despite missing data. These methods can separate recent relatedness from deeper population history, provided damage, coverage and reference bias are modelled."],["Worked example · expected heterozygosity loss","For an ideal diploid population with Nₑ=50, the expected fraction of heterozygosity retained after one generation is 1−1/(2Nₑ)=0.99. After 20 generations it is approximately 0.99²⁰≈0.818. The calculation shows cumulative drift, but real populations violate constant size, random reproduction and isolation. A brief severe bottleneck can dominate the long-term harmonic mean of Nₑ."]],
    g3l4:[["Advanced integration · load, masking and purging","Mutation load depends on mutation rate and fitness effect, while realised inbreeding depression depends on the recessive deleterious alleles carried by a population. Inbreeding can expose such alleles to selection, but rapid inbreeding may cause extinction before effective purging and mildly harmful variants can persist. Conservation management must therefore balance avoidance of close mating, retention of diversity and controlled gene flow."],["Recent advances · rare variation at population scale","Long-read and pangenome datasets reveal rare structural variants that were poorly represented in older surveys. Functional annotation now integrates conservation, gene dosage, expression and experimental perturbation, but most rare variants cannot be assigned a fitness effect confidently. Conservation genomics increasingly prioritises demographic recovery because larger populations make selection more effective while also retaining adaptive potential."],["Worked example · frequency-dependent polymorphism","Two colour morphs are attacked by predators that form a search image for the common type. When morph A rises in frequency, its survival falls relative to rare morph B; when B becomes common, the advantage reverses. Plot relative fitness against frequency and locate the intersection. That equilibrium is stable only if each morph has an advantage when rare and migration or drift does not overwhelm the restoring selection."]],
    g4l1:[["Advanced integration · systems chemistry before heredity","Origin-of-life models must explain how reaction networks persist far from equilibrium. Compartment boundaries concentrate reactants but also restrict nutrient entry; catalytic molecules accelerate reactions but must themselves be produced; template copying creates heredity but error rates limit sequence length. Coupling these requirements exposes trade-offs that are hidden when RNA, metabolism and membranes are considered separately."],["Recent advances · synthetic protocell experiments","Contemporary protocell research combines fatty-acid or mixed membranes, non-enzymatic RNA copying, ribozymes and chemically driven growth–division cycles. Microfluidic selection can test whether compartments with advantageous chemistry proliferate. These systems remain models, not recreated ancestors. Their value lies in turning broad historical narratives into measurable transitions such as uptake, replication fidelity, catalytic gain and competition among compartments."],["Worked example · discriminating hypotheses","Design an experiment comparing RNA polymerisation on a mineral surface with polymerisation in solution. Standardise monomer concentration, temperature and wet–dry cycling; include mineral-free and monomer-free controls. Measure product length, sequence fidelity and release from the surface. A higher yield would support catalytic plausibility under those conditions but would not prove that the tested mineral was the historical site of life's origin."]],
    g4l2:[["Advanced integration · clocks, coalescence and calibration","A gene divergence time and a population split time are not automatically identical. Alleles coalesce before the populations containing them separate, while introgression can transfer younger ancestry across species boundaries. Substitution models correct for unobserved multiple hits, and relaxed clocks allow branch-specific rates. Calibrations should be expressed as probability distributions that reflect fossil placement and geological uncertainty."],["Recent advances · directly dated ancient genomes","Ancient genomes provide dated tips that help estimate recent rates and expose population replacement or admixture. Improved identity-by-descent and ancestral-recombination methods now use fragmented, low-coverage sequences more efficiently. The strongest analyses authenticate molecular damage, model contamination and compare several demographic histories. Ancient DNA therefore narrows some timelines while revealing that a single bifurcating tree may be inadequate."],["Worked example · two calibration models","Two sequences differ at 8% of sites. Under a simple corrected distance of 0.09 substitutions per site and a calibration rate of 1.5×10⁻⁹ substitutions per site per year per lineage, the split estimate is d/(2r)=30 million years. Recalculate if the credible rate is 1.0–2.0×10⁻⁹. The resulting interval demonstrates why reporting only a central date creates false precision."]],
    g4l3:[["Advanced integration · gene-tree discordance","A species tree describes population branching, but each locus follows its own genealogy. Rapid successive divergences allow ancestral alleles to persist and sort differently, producing incomplete lineage sorting. Introgression generates another pattern of discordance, while duplication creates paralogous histories. Quartet frequencies, genomic location and branch lengths help distinguish these processes; simply choosing the majority gene tree may conceal biologically important reticulation."],["Recent advances · phylogenomics with complete genomes","Long reads, chromosome-level assemblies and pangenomes reduce missing sequence and reference bias in comparative genomics. Species-tree and network methods can now analyse thousands of loci while explicitly modelling coalescence or gene flow. More data do not guarantee the correct history: systematic error from alignment, compositional bias or wrong orthology can strengthen an incorrect answer with high statistical support."],["Worked example · reading support correctly","A bootstrap analysis gives 96% support to clade (A,B), while an alternative locus places B with C. The 96% value means that resampled characters repeatedly recover (A,B) under the chosen data and method; it is not a 96% probability that all assumptions are true. Examine whether the discordant locus is paralogous, introgressed or affected by low information before discarding it."]],
    g4l4:[["Advanced integration · coupling ecological and genetic isolation","Divergent selection can reduce gene flow when migrants or hybrids perform poorly in contrasting habitats. Assortative mating may become genetically associated with habitat preference, strengthening isolation. Dobzhansky–Muller incompatibilities arise when alleles that evolved separately interact negatively in hybrids. Recombination can break associations among barrier loci, so genomic architecture influences whether divergence persists despite migration."],["Recent advances · genomic clines and speciation continua","Whole-genome sampling across hybrid zones estimates locus-specific introgression and tests whether barrier regions resist gene flow. Current work treats speciation as a continuum from weakly structured populations to strongly isolated lineages. Genomic islands alone are not decisive because low recombination can also elevate differentiation. Ecological experiments, mating data and hybrid fitness are needed to establish the process."],["Worked example · testing reinforcement","Compare mate preference in populations that occur with a related species and populations outside the contact zone. If females in sympatry discriminate more strongly, test whether hybrids have reduced fitness and whether preference differences remain in a common environment. This design distinguishes reinforcement from learned avoidance or unrelated geographic divergence. Replicated contact zones provide stronger evidence than one sympatric–allopatric pair."]],
    g5l1:[["Advanced integration · hierarchical evolutionary explanation","Macroevolutionary patterns combine trait change within lineages with differential speciation and extinction among lineages. A trait can appear associated with high diversity because it promotes speciation, lowers extinction, arose early or occurs in a well-sampled clade. Comparative methods model shared ancestry so that species are not treated as independent observations. Fossils add extinct combinations that living-only trees cannot recover."],["Recent advances · joint fossil–molecular models","Bayesian total-evidence and fossilised birth–death approaches estimate topology, divergence times and diversification using molecular sequences, morphological characters and fossil ages together. These models expose uncertainty in fossil placement rather than assigning every fossil to a fixed node. Their conclusions remain sensitive to sampling and character coding, encouraging explicit comparison of alternative evolutionary histories."],["Worked example · diversification rate","Clade X has 160 species and an estimated crown age of 20 million years; clade Y has 40 species and the same age. A simple pure-birth comparison suggests faster net diversification in X, but this is not yet evidence that X's key trait caused the difference. Test extinction assumptions, incomplete sampling, clade replication and the timing of trait origin before making a causal claim."]],
    g5l2:[["Advanced integration · stasis is an evolutionary outcome","Morphological stasis can coexist with molecular evolution and ecological tracking. Stabilising selection may maintain a phenotype while allele frequencies change at neutral loci; populations may move geographically to remain in a preferred environment; and developmental systems may channel variation. Punctuated patterns therefore require explanation at the level of trait, population and stratigraphic resolution rather than being used as a universal alternative to selection."],["Recent advances · evolutionary time series","Ancient DNA, sedimentary DNA and densely sampled fossils allow trait or allele trajectories to be examined through environmental change. Time series can reveal selection reversals, migration and population replacement that a two-time-point comparison confuses. In coevolution studies, archived hosts and pathogens can be cross-tested through time, distinguishing reciprocal adaptation from a one-sided response."],["Worked example · reciprocal selection experiment","Collect host and parasite populations from three locations. Measure infection success in all local and foreign combinations, then select hosts against parasites and parasites against hosts for several generations. Reciprocal change requires that evolved host resistance alters parasite fitness and evolved parasite infectivity alters host fitness. A single demonstration that a parasite harms its host establishes antagonism, not coevolution."]],
    g5l3:[["Advanced integration · mosaic primate adaptation","Grasping, stereopsis, locomotor flexibility, diet and social learning did not evolve as one indivisible primate package. Trait combinations reflect arboreal substrates, activity pattern, feeding ecology and developmental history. Dental and postcranial characters may support different placements when convergence occurs. Explicit character matrices and model-based phylogenetics make these conflicts visible rather than resolving them by an intuitive resemblance to living forms."],["Recent advances · comparative primate genomics","Chromosome-level assemblies across primates reveal lineage-specific duplications, inversions and regulatory changes, while incomplete lineage sorting preserves alternative genealogies from rapid ancestral divergences. Comparative genomics is most informative when linked to expression, anatomy or experimental function. A human-specific sequence difference is a candidate mechanism, not evidence by itself for a uniquely human trait."],["Worked example · evaluating a fossil primate","A fossil has a postorbital bar, grasping hallux, specialised molars and a mosaic ankle. Code each character without assuming the conclusion, record uncertainty and compare alternative positions on a reference tree. Stratigraphic age can rule out some descendant relationships but does not identify ancestry automatically. The preferred placement should minimise unsupported change or maximise model likelihood and report competing hypotheses."]],
    g5l4:[["Advanced integration · population networks in human evolution","Hominin evolution includes population splits, contractions, expansions and renewed gene flow. Introgressed fragments vary in length because recombination shortens them each generation; their genomic distribution also reflects natural selection. Archaeology and palaeoenvironmental data supply behavioural and ecological context, but material cultures should not be equated automatically with one biological population. Human evolutionary history is better represented as a branching network than a ladder."],["Recent advances · refined Neanderthal admixture timing","Genome studies reported in 2024–2025 used early modern human remains and ancestry-segment lengths to constrain the shared Neanderthal admixture contributing to present-day non-Africans to roughly 45,000–49,000 years ago. Other analyses show recurrent gene flow in both directions. The update demonstrates how directly dated genomes revise demographic models while preserving uncertainty about geography, duration and later selection on introgressed regions."],["Worked example · dating introgression from fragments","Suppose introgressed ancestry blocks average 0.012 Morgans. Under a simplified pulse model, expected length is approximately 1/t, giving about 83 generations since admixture. With a 29-year generation interval, that is roughly 2,400 years before the sampled individual. Real analyses use the full length distribution, recombination maps, continuous-gene-flow alternatives and confidence intervals; one average cannot establish a precise historical date."]]

  const geneticsEvidenceSynthesis={
    g1l1:[["Evidence synthesis · from ratio to conclusion","A strong segregation analysis reports the biological model, sampling design, expected counts, statistical result and plausible alternative mechanisms. Reciprocal-cross asymmetry suggests sex linkage, cytoplasmic inheritance or maternal effects; reciprocal equality supports but does not prove autosomal inheritance. Missing classes can reflect lethality or ascertainment, whereas distorted reciprocal classes can reflect meiotic drive. The final conclusion should therefore specify which model is supported, which assumptions were tested and what additional cross or molecular marker would discriminate the remaining alternatives. This structure converts a solved Punnett square into a defensible genetic inference."]],
    g1l2:[["Evidence synthesis · separating allelic and locus effects","When a phenotypic ratio is modified, first determine whether the interaction occurs between alleles of one locus or products of different loci. Complementation tests, rescue experiments, double-mutant analysis and pathway intermediates address different levels of causation. A ratio alone rarely identifies the molecular network uniquely because several mechanisms can group genotype classes similarly. The strongest answer combines the cross with a biochemical or developmental prediction—for example, which precursor should accumulate, whether one gene is upstream and whether tissue-specific expression changes the phenotype. This prevents ratio memorisation from being mistaken for mechanistic explanation."]],
    g1l3:[["Evidence synthesis · genetic maps are conditional estimates","A rigorous linkage map states the cross, marker phase, sample size and uncertainty. Recombinant fractions below 50% do not prove that loci are physically close if segregation distortion or scoring error is present. Conversely, a value near 50% cannot distinguish different chromosomes from a very long same-chromosome interval. Comparing physical assemblies with pedigree-based maps can reveal inversions, recombination suppression or assembly error. Mapping conclusions become strongest when gene order is reproduced in reciprocal crosses or families and when molecular phase confirms which chromosome carries each allele combination."]],
    g1l4:[["Evidence synthesis · prediction rather than genetic determinism","Variance components are useful only when the phenotype, population and environment are defined. A high genomic prediction accuracy within one breed or ancestry can fall sharply in another because marker–causal-variant associations differ. Cross-validation must separate close relatives and preferably test a genuinely independent population. Ethical interpretation also distinguishes prediction of population variance from explanation of individual worth or destiny. A complete quantitative-genetics answer should state measurement reliability, environmental range, family structure, response variable and the intended decision, then discuss how prediction might fail under changing climate, management or population composition."]],
    g2l1:[["Evidence synthesis · assigning function to sequence","Evidence for gene function has levels: co-location and association generate hypotheses; expression and conservation add plausibility; segregation links a variant to inheritance; and targeted perturbation can demonstrate necessity or sufficiency in a model. None alone guarantees the mechanism in a patient or species. Pangenome references improve variant discovery, but detected sequence difference still requires functional interpretation. A well-argued gene assignment therefore triangulates genomic context, transcript structure, protein or RNA product, cellular phenotype and organismal consequence while explicitly separating evidence obtained in humans, model organisms and cultured cells."]],
    g2l2:[["Evidence synthesis · efficacy, precision and safety are different outcomes","Genome-editing reports should separate intended-edit frequency, product purity, indels, bystander edits, off-target changes and biological rescue. High efficiency can coexist with a mixture of unwanted alleles, while a lower editing percentage may still restore sufficient function. Bulk sequencing may conceal mosaic clones, and computational off-target prediction cannot replace empirical testing. For therapeutic reasoning, delivery, immune response, persistence, cell type and long-term surveillance matter as much as molecular precision. Germ-line editing adds intergenerational risk and social consequences that cannot be resolved by improving technical accuracy alone."]],
    g2l3:[["Evidence synthesis · integrating pedigree and laboratory data","A pedigree defines prior probabilities; cytogenetic, biochemical and sequence tests update them. Discordance may arise through nonpenetrance, mosaicism, phenocopy, misassigned relationships or a wrong disease model. The correct response is not to force the family into the first pattern recognised, but to revisit assumptions and test the most discriminating individuals. Trio analysis is powerful for de novo variants, whereas multiple affected relatives strengthen segregation evidence. Reports should also distinguish a causal result, a carrier finding, an incidental finding and an uncertain result because each has different counselling implications."]],
    g2l4:[["Evidence synthesis · diagnosis is not prognosis","Identifying a pathogenic variant establishes a molecular explanation more reliably than it predicts severity, age of onset or treatment response. Residual activity, modifier genes, diet, infections and access to care alter outcomes. Biochemical markers can show current pathway disturbance, whereas genotype may reveal lifelong risk before symptoms. Screening programmes therefore need sensitive first-line tests, specific confirmation and a proven beneficial intervention. Ethical evaluation includes false positives, consent, storage of genomic data and equitable follow-up. The educational endpoint is an integrated diagnostic pathway, not the assumption that sequencing alone solves the disorder."]],
    g3l1:[["Evidence synthesis · a null model needs diagnostic follow-up","After detecting Hardy–Weinberg deviation, inspect genotype clusters, missingness, read depth and batch effects before invoking selection. Then evaluate ancestry structure, relatedness, sex linkage and mating system. Deviations confined to one laboratory batch favour technical error; deviations replicated across cohorts and linked to survival or reproduction support biology. In case–control studies, controls are usually expected to be closer to equilibrium than cases at a genuinely associated disease locus. Reporting only a P value loses the direction, magnitude and possible source of the departure."]],
    g3l2:[["Evidence synthesis · proving natural selection","A candidate selective sweep should be supported by more than low diversity. Population expansion, background selection and recombination variation can generate similar signals. Strong inference combines allele-frequency change, extended haplotypes, population differentiation, ecological correlation, functional effect and a demographic null model. Experimental fitness measurements or temporal samples are especially valuable. The answer should also specify the target: selection may act on a linked causal allele rather than the typed marker. This evidence hierarchy guards against turning every striking genomic pattern into an adaptation story."]],
    g3l3:[["Evidence synthesis · model dependence of demographic history","Different genomic summaries emphasise different time depths. Runs of homozygosity reveal recent parental relatedness and bottlenecks; linkage disequilibrium informs recent effective size; site-frequency spectra and coalescent methods reach deeper but depend strongly on mutation, recombination and structure. A single panmictic model may translate historical subdivision into a false size change. Robust demographic inference compares alternative models, uses independent chromosomes or populations and reports intervals rather than a visually precise curve. Ancient genomes provide powerful checkpoints because they sample earlier population states directly."]],
    g3l4:[["Evidence synthesis · conserving adaptive capacity","Removing every suspected deleterious allele is neither feasible nor desirable because effects are often recessive, environment-dependent or uncertain. Severe selection can reduce population size and lose neutral or adaptive diversity. Management priorities therefore include restoring habitat and demography, avoiding close inbreeding, monitoring fitness and using gene flow strategically. Genomic load metrics should be validated against survival and reproduction rather than treated as direct measures of extinction risk. Balanced polymorphisms may also be beneficial under heterogeneous environments, so conservation must preserve evolutionary options as well as current mean performance."]],
    g4l1:[["Evidence synthesis · evaluating origin-of-life claims","Historical plausibility increases when a proposed reaction uses geochemically realistic inputs, proceeds under tolerable conditions, connects to the next transition and survives competing side reactions. Yield alone is not enough if purification is implausible or the product destroys the membrane that must contain it. Experiments should test robustness across temperature, salinity, pH and cycling rather than one optimised recipe. No single successful step establishes a full pathway; the research programme advances by linking independently demonstrated steps into a system capable of imperfect heredity and differential persistence."]],
    g4l2:[["Evidence synthesis · transparent molecular dating","A credible date should identify sequences, alignment, substitution model, clock model and each calibration prior. Sensitivity analyses remove calibrations in turn, compare strict and relaxed clocks and test whether major clades alter rate estimates. Fossil uncertainty includes both numerical age and phylogenetic placement. Ancient DNA dates may calibrate recent branches directly but do not solve deep-time saturation. When models disagree, the disagreement is biological information about rate heterogeneity or inadequate sampling, not a reason to report whichever estimate best matches expectation."]],
    g4l3:[["Evidence synthesis · confidence without overconfidence","Phylogenomic conclusions should be checked across loci, character partitions, taxon samples and plausible substitution models. A clade supported by many linked sites may represent one genomic history rather than thousands of independent observations. Species-tree methods address incomplete lineage sorting, while network analyses test reticulation; neither automatically corrects poor orthology. Branch support, concordance factors and alternative topology tests answer different questions. The final tree should be presented as a model-supported hypothesis with clearly labelled uncertainty, especially where rapid radiations produce short internal branches."]],
    g4l4:[["Evidence synthesis · documenting a speciation process","Species delimitation and mechanism should not be collapsed. Genomic clusters may identify independently evolving lineages, but explaining their origin requires geography, ecology, mating and hybrid-fitness evidence. Reproductive barriers can be asymmetric and incomplete, and different loci may cross a hybrid zone at different rates. A persuasive speciation study samples the contact zone, measures assortative mating, estimates migration and tests fitness in relevant environments. Conservation decisions may still require action before every mechanism is resolved, but the operational species concept and uncertainty should be explicit."]],
    g5l1:[["Evidence synthesis · avoiding trait-based evolutionary stories","A key innovation hypothesis requires replicated transitions or a model that separates the focal trait from clade age, geography and correlated traits. Extinction can erase counterexamples, and taxonomic practice can inflate apparent diversification. Fossils help identify whether diversity increased after trait origin and whether similar structures evolved independently. Developmental evidence then asks how the innovation was produced without assuming that novelty required wholly new genes. This multi-level approach connects mutation and development to ecological performance and lineage birth–death dynamics without invoking evolutionary progress."]],
    g5l2:[["Evidence synthesis · tempo at the correct resolution","Testing evolutionary tempo requires a defined trait, calibrated sequence and sampling interval. Apparent jumps can result from missing strata, population replacement or measurement of only endpoint forms; apparent gradualism can result from averaging several rapid transitions. Model comparison can evaluate stasis, directional change and random walks in fossil series. Coevolution demands an additional reciprocal dimension: temporal matching or cross-population experiments must show that change in each partner modifies selection on the other. Labels are conclusions after measurement, not substitutes for it."]],
    g5l3:[["Evidence synthesis · reconstructing primate relationships","A robust primate phylogeny distinguishes shared derived characters from ancestral retention and convergence. Locomotor similarity may evolve repeatedly in comparable habitats, while dental characters can be strongly shaped by diet. Molecular sequences clarify living relationships but cannot reveal the complete anatomy of extinct branches. Total-evidence analyses combine fossils and genomes, yet results depend on character coding and fossil placement. Conclusions should therefore identify which characters support a node, which conflict and how stratigraphic age constrains—without automatically determining—the inferred relationship."]],
    g5l4:[["Evidence synthesis · integrating biology and culture","Human evolutionary explanations must avoid both genetic reductionism and the claim that culture floats outside biology. Learned practices alter diet, pathogens, mating and survival, creating new selective environments; genetic changes can in turn modify development and behaviour without determining a cultural outcome. Ancient genomes, fossils and artefacts record different components and time scales. Strong synthesis aligns their dates and uncertainties, distinguishes ancestry from identity and rejects ranking living populations as evolutionary stages. The result is a plural, branching history of populations whose biological and cultural trajectories repeatedly interacted."]]

  const geneticsTransferTasks={
    g1l1:[["Transfer task","Construct two competing explanations for an unexpected 2:1 progeny ratio—recessive lethality and segregation distortion. Specify the reciprocal crosses, developmental-stage counts and molecular genotypes that would distinguish them. Conclude with the result pattern expected under each hypothesis rather than merely naming the ratio."]],
    g1l2:[["Transfer task","Given a colourless double mutant and two single mutants with different accumulated metabolites, infer gene order in a pigment pathway. Predict the F₂ phenotypic classes and identify which metabolite-feeding experiment would test whether one gene acts upstream of the other."]],
    g1l3:[["Transfer task","Use a three-point progeny table to identify parental, single-crossover and double-crossover classes. Calculate both interval distances and interference, then explain how an inversion in one parent would change recombinant recovery without necessarily changing the physical order of loci."]],
    g1l4:[["Transfer task","Design a breeding study across two temperatures to estimate additive variance and genotype–environment interaction. State the relatives required, the response variable, the environmental replication and why randomising families across environments is necessary for an unbiased heritability estimate."]],
    g2l1:[["Transfer task","A long-read genome reveals a structural insertion absent from the linear reference and close to a developmental enhancer. Propose evidence needed to connect it with disease: inheritance, allele frequency, chromatin contact, expression, cellular perturbation and phenotype. Rank association below demonstrated mechanism."]],
    g2l2:[["Transfer task","Compare base editing and prime editing for correcting one transition beside two editable bystander bases. Define the desired allele, predicted unwanted products, sequencing assay and functional endpoint. Choose a strategy only after considering editing purity, delivery and the relevant cell type."]],

    g2l4:[["Transfer task","Prepare a counselling explanation for a couple carrying the same recessive metabolic-disease allele. Include independent recurrence probabilities, newborn treatment, limits of genotype-based prognosis, testing options, privacy and nondirective decision-making in language suitable for an informed family discussion."]],
    g3l1:[["Transfer task","A marker deviates from Hardy–Weinberg equilibrium in cases but not controls. List technical and biological explanations, then propose checks using genotype plots, call rate, ancestry strata and disease association. Explain why the deviation alone cannot identify selection or causality."]],
    g3l2:[["Transfer task","An insecticide-resistance allele rises during spraying and falls after withdrawal. Model the direction of selection in both environments, predict a fitness trade-off and propose a time-series sampling design that separates selection from seasonal migration and population replacement."]],
    g3l3:[["Transfer task","Two threatened populations have equal census size but different reproductive skew and runs of homozygosity. Decide which has lower effective size, justify the genomic indicators and propose demographic actions that increase the number of successful breeders rather than only the head count."]],
    g3l4:[["Transfer task","A proposed conservation cross increases heterozygosity but reduces offspring survival in one habitat. Frame alternative explanations involving local adaptation, maternal effects and genetic incompatibility. Design reciprocal and common-environment crosses before deciding whether to continue genetic rescue."]],
    g4l1:[["Transfer task","Evaluate a claim that one laboratory reaction 'created a step toward life.' Ask whether inputs are geochemically plausible, products persist, side reactions are controlled, compartments are compatible and the product contributes to heredity or metabolism. Separate demonstrated chemistry from historical inference."]],
    g4l2:[["Transfer task","Two clock analyses produce ages differing by ten million years. Compare taxon sampling, orthology, saturation, substitution model, rate prior and fossil placement. Report a justified interval and sensitivity result instead of selecting the estimate nearest the expected fossil narrative."]],
    g4l3:[["Transfer task","A rapid radiation yields three conflicting quartet topologies. Explain expected frequencies under incomplete lineage sorting, then identify genomic asymmetry that would suggest introgression. Recommend species-tree and network analyses and state why concatenation alone may give misleading certainty."]],
    g4l4:[["Transfer task","Study two host-associated insect forms that overlap geographically. Measure host preference, assortative mating, migration, hybrid fitness and genomic clines. Decide whether evidence supports polymorphism, incipient sympatric speciation or established species, naming the operational species concept used."]],
    g5l1:[["Transfer task","Test whether a feeding innovation increased diversification. Map the trait onto a time-calibrated phylogeny, include fossils and incomplete sampling, compare speciation–extinction models and examine replicated origins. Explain why one species-rich clade with the trait is insufficient causal evidence."]],
    g5l2:[["Transfer task","Given a fossil sequence with long stasis and an apparent abrupt shift, propose sampling, dating and trait-measurement checks. Compare stasis, directional-change and random-walk models, and identify evidence that the shift represents local evolution rather than immigration of another population."]],
    g5l3:[["Transfer task","Place a mosaic fossil primate using a documented character matrix. Distinguish probable convergence from shared derived states, incorporate stratigraphic age and compare morphology with molecular constraints from living taxa. Report at least one plausible alternative placement and the evidence needed to reject it."]],
    g5l4:[["Transfer task","Integrate an ancient genome, artefact assemblage and palaeoclimate record without assuming that one material culture equals one ancestry. Build a timeline of population movement, admixture and ecological change, then distinguish biological ancestry, learned behaviour and later cultural identity in the conclusion."]]

  const geneticsTransferExtensions={
    g1l1:"Worked-analysis scaffold: For 300 fertilised embryos from Aa × Aa, recessive lethality predicts 75 AA, 150 Aa and 75 aa before death, then a 1:2 ratio among surviving genotypes. Apply chi-square separately at embryo and adult stages. Distortion acting during gametogenesis should already alter conception-stage frequencies and may differ between reciprocal crosses.",
    g1l2:"Worked-analysis scaffold: Build a table linking each genotype to the blocked enzyme, accumulated precursor and supplementation response. A downstream intermediate should rescue an upstream block but not a mutation affecting its own conversion. Use the double-mutant phenotype to order the genes, then verify that altered viability has not distorted the apparent F₂ classes.",
    g1l3:"Worked-analysis scaffold: For each interval, add its single-crossover classes to both double-crossover classes before dividing by total progeny. Expected double crossovers equal the product of interval recombination fractions multiplied by sample size; coincidence is observed divided by expected, and interference is one minus coincidence. Report sampling uncertainty when recombinant classes are small.",
    g1l4:"Worked-analysis scaffold: Fit phenotype as population mean plus family, environment, family-by-environment and residual effects. Estimate additive variance from the specified relationship design, then calculate h² separately within each temperature and predict R=h²S. A changed family ranking across temperatures signals interaction and warns against exporting one selection estimate across environments.",
    g2l1:"Worked-analysis scaffold: Begin with trio phasing and ancestry-matched frequency data, then test whether the insertion contacts the enhancer target and changes allele-specific expression. Recreate and correct the variant in a relevant cell model, using isogenic controls. Cosegregation and statistical association raise plausibility, but reciprocal functional perturbation provides the stronger causal bridge.",
    g2l2:"Worked-analysis scaffold: Quantify intended product purity as intended reads divided by all edited reads, and report bystander substitutions, indels and unedited alleles separately. Sequence predicted off-target sites at adequate depth and test phenotypic rescue in the relevant cell type. A higher headline editing rate is inferior if functional correction is less precise.",
    g2l3:"Worked-analysis scaffold: Record diagnostic yield and unresolved variant classes after every stage rather than calling a negative result normal. Trio sequencing helps identify de novo and compound-heterozygous variants; long-read or repeat-directed testing addresses regions poorly resolved by short reads. Consent should cover incidental findings, data retention and periodic reinterpretation of uncertain variants.",
    g2l4:"Worked-analysis scaffold: For Aa × Aa, each conception independently has 25% affected, 50% carrier and 25% noncarrier probability; outcomes in earlier pregnancies do not alter the next risk. Convert these values into natural frequencies, explain residual test uncertainty and separate recurrence probability from the likely severity or treatability of an affected child's condition.",
    g3l1:"Worked-analysis scaffold: Calculate allele frequencies from the observed genotypes, derive p², 2pq and q² expected counts and use an exact test when rare classes are small. Reanalyse after removing low-quality calls and within ancestry strata. Case-only disequilibrium may follow genuine disease association, so quality-controlled controls are essential before invoking selection or error.",
    g3l2:"Worked-analysis scaffold: Estimate frequency change at matched seasonal intervals in sprayed, unsprayed and migration-source populations. A resistance cost predicts slower survival or reproduction without insecticide, while continued increase everywhere weakens that explanation. Replicated temporal samples and neutral ancestry markers help distinguish genotype-specific selection from immigration, drift and wholesale population replacement.",
    g3l3:"Worked-analysis scaffold: Under unequal sex contribution, compare the approximation Ne=4NmNf/(Nm+Nf) with pedigree- or genomic-based estimates that also capture family-size variance. Long runs of homozygosity indicate recent parental relatedness; short runs reflect older history. Management should equalise breeder contribution, avoid close kin mating and retain locally adaptive lineages.",
    g3l4:"Worked-analysis scaffold: Use reciprocal F₁, F₂ and backcross families raised in both habitats. Immediate F₁ improvement supports heterosis, whereas decline in recombinant generations can reveal disrupted coadapted complexes; reciprocal differences implicate maternal or cytoplasmic effects. Compare survival and reproduction, not heterozygosity alone, before extending translocation or assisted-gene-flow programmes.",
    g4l1:"Worked-analysis scaffold: Score the claim against measurable criteria: prebiotic plausibility of inputs, yield above controls, persistence through wet–dry or thermal cycles, compatibility with compartments and contribution to catalysis or templated inheritance. Include blank and alternative-substrate controls. Success on one criterion demonstrates useful chemistry, not a complete pathway or unique historical event.",
    g4l2:"Worked-analysis scaffold: Construct a sensitivity matrix crossing strict versus relaxed clocks, alternative substitution models and defensible calibration sets. Remove each influential fossil calibration in turn and compare posterior ages and credible intervals. If conclusions change qualitatively, report calibration dependence explicitly; agreement among models is informative only when their assumptions and data are not effectively identical.",
    g4l3:"Worked-analysis scaffold: For an internode of length t coalescent units, the concordant gene-tree probability is 1−(2/3)e⁻ᵗ and each discordant topology has probability (1/3)e⁻ᵗ. Incomplete lineage sorting therefore predicts symmetric discordant counts. A significant discordant asymmetry or nonzero D-statistic can motivate an introgression model, but ancestral structure must be tested and D alone does not establish gene-flow direction.",
    g4l4:"Worked-analysis scaffold: Predefine thresholds for host-choice divergence, assortative mating and migrant ancestry before inspecting the genomic results. Fit clines for diagnostic loci and compare their centres and widths with neutral expectations. Strong habitat association without reproductive isolation supports ecotypes; concordant barriers to gene flow and reduced hybrid fitness support a later stage of speciation.",
    g5l1:"Worked-analysis scaffold: Compare repeated independent origins and matched sister clades rather than one focal radiation. Include fossil occurrence and incomplete extant sampling, then test whether results survive alternative diversification models and hidden-state effects. Trait-dependent rate models can produce false positives when unmeasured geography or ecology drives both the innovation and lineage accumulation.",
    g5l2:"Worked-analysis scaffold: Bin specimens by independently dated horizons, quantify the same homologous trait with observer-blind measurements and model within-horizon variance. Compare stasis, directional and unbiased-random-walk likelihoods using penalised model support. A discontinuity accompanied by provenance or associated-fauna change favours immigration; transitional local forms and stratigraphic continuity strengthen an in-situ interpretation.",
    g5l3:"Worked-analysis scaffold: Analyse the documented matrix under equal and alternative defensible character weights, then repeat after removing highly correlated dental or locomotor characters. Bootstrap or posterior support should accompany the preferred placement. If a small character subset drives the result, present the competing topology and identify which newly preserved anatomical region would be most discriminating.",
    g5l4:"Worked-analysis scaffold: Anchor individuals and artefacts with direct dates where possible, test genetic affinity using allele-sharing statistics and model admixture time independently of object style. Compare isotopic mobility with genomic ancestry to separate movement from cultural transmission. Treat population labels as analytical summaries, not timeless ethnic identities, and propagate dating uncertainty through the combined timeline."

  const contemporaryFrames={
    genetics:["Population-scale genomics now uses graph and pangenome references to represent structural and sequence diversity that a single linear reference misses.","Genome editing is interpreted through DNA-repair outcomes, mosaicism, off-target risk, delivery constraints and ethical governance—not as an automatically precise replacement of one base.","Ancient DNA, phylogenomics and evo-devo increasingly connect molecular evidence with fossils, development, demography and ecology."],
    physiology:["Single-cell and spatial atlases refine organ physiology by locating cell states, signalling neighbourhoods and disease-associated transitions within intact tissues.","Integrated physiology links molecular transport to whole-body homeostasis through feedback, reserve capacity, allostasis and organ cross-talk.","Wearable sensing, organoids and computational models extend measurement but still require validation against mechanism and clinical or organismal outcomes."],
    behaviour:["High-resolution biologging, acoustic sensing and machine learning expand observation while preserving the need for explicit ethograms and independent validation.","Contemporary behavioural analysis joins Tinbergen's four questions with genomics, endocrine state, developmental plasticity, ecological constraint and social networks.","Circadian research increasingly measures individual biological phase and tests treatment timing rather than assuming clock time is equivalent across organisms."],
    dairy:["Whole-farm analysis connects productivity with welfare, disease prevention, climate resilience, nutrient cycling, water use and livelihood stability.","Precision sensors support—rather than replace—cow-level observation, diagnostic reasoning, calibration and veterinary oversight.","One Health stewardship integrates biosecurity, vaccination, responsible antimicrobial use, residue control, traceability and environmental protection."]
