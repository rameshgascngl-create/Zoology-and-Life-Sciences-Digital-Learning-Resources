  const unitAssessment={
    g1:{short:[
      {q:"How does a three-point test cross establish gene order and map distance?",a:"Identify the two most frequent progeny as parental classes and the two least frequent as double crossovers. The allele that switches relative to the parental arrangement is the middle gene. Calculate each interval from its single crossovers plus both double-crossover classes, divided by total progeny. Compare observed and expected double crossovers to estimate coincidence and interference."},
      {q:"Why does narrow-sense heritability predict selection response more directly than broad-sense heritability?",a:"Narrow-sense heritability contains additive genetic variance, whose average allelic effects are predictably transmitted from parents to offspring. Broad-sense heritability also contains dominance and epistatic variance, which may be disrupted by segregation and recombination. Thus the breeder's equation R=h²S uses the additive component, while both estimates remain population- and environment-specific."}
    ],essay:{q:"Explain how extensions of Mendelian analysis connect gene interaction, linkage and quantitative inheritance without rejecting segregation.",a:"Begin with segregation and independent assortment as chromosome-based null expectations. Show how dominance, codominance and epistasis alter phenotype classes while alleles still segregate. Use test-cross data to identify linkage phase, recombinant classes and mapping limits, including hidden multiple crossovers. Extend from identifiable loci to polygenic traits by partitioning phenotypic variance and distinguishing H² from h². Include one numerical cross, one linkage calculation and the breeder's equation, then conclude that observed ratios depend on biological mechanism, sampling and environment."}},
    g2:{short:[
      {q:"Compare nucleotide-excision repair with homologous recombination repair.",a:"Nucleotide-excision repair recognises bulky helix-distorting lesions, removes a short damaged oligonucleotide and resynthesises the gap from the opposite strand. Homologous recombination repairs a double-strand break by copying from an intact homologous template, usually the sister chromatid. They therefore differ in lesion class, molecular intermediates, cell-cycle availability and expected fidelity."},
      {q:"Why can neither a karyotype nor a pedigree alone provide a complete genetic diagnosis?",a:"A karyotype resolves large numerical and structural chromosome changes but usually misses single-nucleotide variants and small copy-number changes. A pedigree estimates inheritance patterns but can be distorted by small family size, nonpenetrance, variable expression, phenocopy and new mutation. Diagnosis therefore integrates clinical phenotype, family history, biochemical evidence and an appropriately scaled molecular or cytogenetic test."}
    ],essay:{q:"Develop an evidence-based framework for investigating and counselling a family with a suspected inherited disorder.",a:"Define the phenotype and construct a three-generation pedigree before assigning an inheritance model. Generate competing autosomal, sex-linked, mitochondrial, chromosomal and multifactorial hypotheses, explicitly considering penetrance and new mutation. Select tests by scale: karyotype or FISH for visible rearrangements, copy-number analysis for submicroscopic dosage change and sequencing for nucleotide-level variants. Classify variants with population, segregation, functional and computational evidence. Communicate residual uncertainty, recurrence risk and reproductive options non-directively, protect confidentiality and recommend reanalysis when evidence or reference databases change."}},
    g3:{short:[
      {q:"How should Hardy–Weinberg equilibrium be used as a diagnostic null model?",a:"Estimate allele frequencies from observed genotypes, calculate expected p², 2pq and q² frequencies, and compare observed with expected counts using an appropriate test. A significant departure does not identify one cause: nonrandom mating, selection, migration, mutation, population subdivision, genotyping error and sampling can produce similar patterns. The model is therefore a starting point for hypothesis testing, not a claim that populations do not evolve."},
      {q:"Distinguish genetic drift from natural selection using population-genetic predictions.",a:"Drift is stochastic sampling whose effects intensify as effective population size declines; replicate populations can change in different directions and neutral diversity is lost predictably. Selection produces systematic allele-frequency change conditional on genotype–fitness differences, although demographic history can mimic its genomic signature. Strong inference compares neutral expectations, linked variation, replication, phenotype–fitness evidence and explicit demographic models."}
    ],essay:{q:"Explain how mutation, selection, drift, gene flow and nonrandom mating jointly determine population variation.",a:"Start with mutation as the ultimate source of new alleles, usually too weak to explain rapid frequency change alone. Derive Hardy–Weinberg expectations, then show that nonrandom mating alters genotype frequencies while selection, drift and migration can change allele frequencies. Contrast deterministic selection coefficients with stochastic change governed by effective population size. Explain how gene flow may introduce variation or oppose local adaptation, and how bottlenecks alter linkage and diversity. Use a worked two-allele example, then discuss why genomic data require demographic null models before adaptive conclusions are accepted."}},
    g4:{short:[
      {q:"Why may a gene tree disagree with the species tree?",a:"Individual loci have their own coalescent histories. An ancestral polymorphism can persist through closely spaced speciation events, producing incomplete lineage sorting, while introgression transfers alleles across species boundaries. Duplication, gene loss, recombination and analytical error add further discordance. Species-tree inference therefore requires multiple loci, models of lineage sorting and explicit tests for reticulate evolution."},
      {q:"What assumptions must be evaluated before using a molecular clock?",a:"Sequence change must be modelled with an appropriate substitution process, and rate constancy should be tested rather than assumed. Calibrations need justified fossil, geological or biogeographic priors, while saturation, purifying selection, generation time and lineage-specific rates can bias dates. Credible intervals should incorporate uncertainty in topology, rate variation and calibration placement."}
    ],essay:{q:"Construct a genomic explanation of speciation from population divergence to reproductive isolation.",a:"Define the geographical and ecological context, then trace how selection, drift and restricted gene flow create heterogeneous genomic divergence. Distinguish barrier loci from linked regions and background selection, and explain how inversions or reduced recombination may preserve coadapted alleles. Analyse prezygotic and postzygotic isolation, reinforcement and hybrid-zone clines. Use gene-tree discordance to separate incomplete lineage sorting from introgression, and avoid treating one high-divergence region as proof of a speciation gene. Conclude with reciprocal crosses, fitness estimates, demographic modelling and functional validation as complementary evidence."}},
    g5:{short:[
      {q:"How do fossils and molecular phylogenies provide different but complementary evolutionary evidence?",a:"Fossils directly document morphology, minimum lineage ages, geographic occurrence and extinction, but preservation and sampling are uneven. Molecular phylogenies estimate relationships and divergence from inherited sequence variation, yet depend on substitution models and calibrations. Congruence strengthens inference; disagreement can reveal homoplasy, incomplete sampling, uncertain fossil placement or inappropriate molecular assumptions."},
      {q:"Why is human evolution represented as a branching and reticulate history rather than a linear ladder?",a:"Hominin lineages diversified, overlapped in time and sometimes exchanged genes. Ancient DNA demonstrates introgression among anatomically modern humans, Neanderthals and Denisovan-related populations, while fossils show mosaic combinations of traits. No living population is evolutionarily more advanced; all share recent ancestry and retain mixtures shaped by migration, drift, selection and culture."}
    ],essay:{q:"Evaluate the major evidence for human evolution within a modern macroevolutionary framework.",a:"Place hominins within primate phylogeny using shared derived traits and molecular evidence. Organise fossils chronologically but emphasise branching, mosaic evolution and uncertainty in species boundaries. Integrate bipedal locomotion, dentition, encephalisation, life history, tool use and dispersal with palaeoenvironmental evidence. Use ancient genomes to explain population replacement and introgression without equating genetic clusters with simple fossil species. Address dating methods, preservation bias and the distinction between ancestry and similarity. End by linking microevolutionary processes to long-term diversification rather than presenting a progressive ladder."}},
    p1:{short:[
      {q:"How does nutritional geometry improve on evaluating one nutrient at a time?",a:"Nutritional geometry represents foods and intake in a multidimensional nutrient space. It tests how animals regulate mixtures, trade one nutrient against another and experience performance surfaces for growth, reproduction or longevity. This reveals interactions and imbalances hidden by single-nutrient optima, although conclusions depend on the nutrients measured, physiological state and available food choices."},
      {q:"Explain the local neural logic of the peristaltic reflex.",a:"Luminal distension or mucosal stimulation activates intrinsic sensory pathways. Ascending enteric circuits produce contraction of circular muscle on the oral side, while descending inhibitory circuits relax muscle on the aboral side. Coordinated secretion and longitudinal muscle activity assist propulsion. Interstitial cells of Cajal organise slow-wave excitability, but neural and hormonal signals determine whether contractions become effective peristalsis."}
    ],essay:{q:"Integrate digestion, absorption and metabolic allocation in a comparative account of animal nutrition.",a:"Begin with acquisition and mechanical processing, then compare intracellular digestion with extracellular digestion in specialised compartments. Link enzyme specificity, pH and transit time to macromolecule hydrolysis. Trace carbohydrates and amino acids into portal blood, and lipids through micelles, enterocytes and transport particles. Explain how enteric, autonomic and endocrine signals coordinate motility, secretion and satiety. Use energy budgets and nutritional geometry to connect absorbed nutrients with maintenance, growth and reproduction. Include one vertebrate and one invertebrate example, and treat microbiomes as context-dependent metabolic partners rather than universal explanations."}},
    p2:{short:[
      {q:"Why is arterial oxygen content more informative than oxygen partial pressure alone?",a:"Partial pressure reflects dissolved oxygen and drives diffusion, but most blood oxygen is bound to haemoglobin. Arterial content therefore depends chiefly on haemoglobin concentration and saturation, with only a small dissolved contribution. Severe anaemia can leave arterial PO₂ normal while greatly reducing oxygen content and delivery; delivery also depends on cardiac output and tissue extraction."},
      {q:"Differentiate homeostasis, allostasis and acclimatisation.",a:"Homeostasis describes regulated internal variables maintained within viable ranges through feedback. Allostasis emphasises context-dependent and anticipatory adjustment of regulatory output to meet predicted demand. Acclimatisation is a reversible suite of changes developed by an individual after sustained environmental exposure. These concepts overlap but refer respectively to regulation, adaptive adjustment of regulation and the time-dependent organismal outcome."}
    ],essay:{q:"Explain how respiratory exchange and thermal regulation are integrated across environments.",a:"Apply Fick's principle to show that exchange depends on surface area, barrier thickness, diffusion gradient and ventilation or perfusion. Compare gills, tracheae and lungs in relation to water, air, convection and dead space. Distinguish ventilation, diffusion, haemoglobin loading, oxygen content and tissue delivery, including Bohr and Haldane effects. Then connect metabolic heat production, insulation, evaporation and circulatory heat exchange to feedback control. Use aquatic hypoxia and terrestrial heat stress as contrasting cases, and distinguish short-term reflexes from acclimatisation and evolutionary adaptation."}},
    p3:{short:[
      {q:"How do preload, afterload and contractility alter stroke volume?",a:"Greater preload increases fibre length and stroke volume through the Frank–Starling mechanism within physiological limits. Higher afterload opposes ventricular ejection and can reduce stroke volume, especially when compensation fails. Increased contractility raises force and ejection at a given preload and afterload. Heart rate, filling time and ventricular compliance modify all three relationships."},
      {q:"Why must coagulation be balanced by anticoagulant and fibrinolytic systems?",a:"Platelet activation and thrombin generation rapidly contain vascular injury, but unrestrained clotting would obstruct intact vessels. Endothelial inhibitors, antithrombin and the protein C system spatially limit coagulation, while fibrinolysis removes fibrin during repair. Bleeding and thrombosis are therefore opposite consequences of a network whose localisation, timing and feedback must remain balanced."}
    ],essay:{q:"Develop an integrated account of circulation from electrical activation to tissue oxygen delivery.",a:"Follow impulse generation in pacemaker tissue through cardiac conduction and excitation–contraction coupling. Relate pressure–volume changes to valves, preload, afterload, contractility, stroke volume and cardiac output. Explain how arteriolar resistance distributes flow and how capillary Starling forces govern exchange. Integrate local metabolic control with autonomic and baroreflex regulation of mean arterial pressure. Finally calculate oxygen delivery from cardiac output and arterial oxygen content. Use heart failure or haemorrhage to show how compensatory mechanisms preserve pressure yet may impair tissue perfusion."}},
    p4:{short:[
      {q:"How do ionic gradients generate a resting potential and an action potential?",a:"Pumps establish unequal ion distributions, while selective resting permeability makes the membrane voltage approach the equilibrium potential of the dominant permeant ions. Depolarisation opens voltage-gated channels, creating positive feedback and the action-potential upstroke; subsequent inactivation and potassium conductance repolarise the cell. Refractory periods impose directionality and limit firing frequency."},
      {q:"Connect excitation–contraction coupling with force regulation in skeletal muscle.",a:"A motor-neuron action potential releases acetylcholine, depolarising the muscle membrane and transverse tubules. Voltage sensors activate sarcoplasmic-reticulum calcium release; calcium binds troponin, moving tropomyosin and permitting cross-bridge cycling. Force varies through motor-unit recruitment, firing frequency, muscle length and load. Calcium reuptake terminates activation and consumes metabolic energy."}
    ],essay:{q:"Explain how nervous systems transform sensory information into coordinated movement.",a:"Begin with receptor transduction and receptive fields, distinguishing stimulus intensity coding from modality and spatial coding. Trace graded potentials to action potentials, saltatory conduction and chemical synaptic transmission. Explain EPSP and IPSP integration, presynaptic modulation and plasticity. Follow motor commands to motor units and excitation–contraction coupling, then describe proprioceptive and reflex feedback that corrects movement. Compare one vertebrate reflex with an invertebrate circuit to show conserved principles and different architectures. Avoid describing neural pathways as simple one-way chains; emphasise recurrent control and context."}},
    p5:{short:[
      {q:"How do filtration, reabsorption and secretion determine renal excretion?",a:"The filtered load equals plasma concentration multiplied by glomerular filtration rate. Tubular reabsorption returns selected filtered material to blood, while secretion adds substances from peritubular blood to the tubule. Excretion therefore equals filtration minus reabsorption plus secretion. Comparing clearance with GFR indicates the net handling of a substance, provided production and measurement assumptions are valid."},
      {q:"How does the hypothalamic–pituitary–gonadal axis generate both negative and positive feedback?",a:"Pulsatile GnRH stimulates pituitary LH and FSH, which regulate gonadal steroidogenesis and gametogenesis. Steroids and inhibins usually suppress hypothalamic and pituitary output. In the preovulatory female, sustained high oestradiol under appropriate cycle conditions reverses the sign of feedback, producing the LH surge; ovulation and luteal hormones then terminate that state."}
    ],essay:{q:"Integrate osmoregulation, nitrogen excretion and reproductive endocrinology as problems of controlled internal transport.",a:"Compare osmoconformity and osmoregulation, then relate ammonia, urea and uric acid to toxicity, water cost and energy demand. Explain glomerular filtration, tubular transport and countercurrent multiplication, using clearance to quantify renal function. Include endocrine regulation of water and ions and an extrarenal strategy from an aquatic or desert animal. Then map GnRH, gonadotropins, gonadal hormones and feedback across gametogenesis, ovulation, pregnancy or parturition. The unifying theme is regulated flux across epithelia and between compartments, constrained by environment, energy and life-history state."}},
    b1:{short:[
      {q:"How do Tinbergen's four questions prevent incomplete explanations of behaviour?",a:"Mechanism identifies immediate neural, hormonal or sensory causes; ontogeny traces development and experience; function tests fitness consequences; phylogeny reconstructs evolutionary history. Answers at one level do not replace the others. A complete programme separates their hypotheses and measurements, then examines how they interact without treating an adaptive story as a mechanism or a mechanism as proof of adaptation."},
      {q:"What design choices make an ethogram-based study reproducible?",a:"Define mutually exclusive or explicitly overlapping behaviours using observable criteria, pilot the ethogram and specify sampling rule, observation interval and subject selection. Blind observers where possible, quantify inter-observer reliability and preserve the true experimental unit. Record environmental covariates and missing visibility. These controls reduce category drift, pseudoreplication and selective recording."}
    ],essay:{q:"Design a rigorous study of individual differences in an animal behaviour.",a:"State a Tinbergen-level question and operationally define the behaviour. Choose focal, scan or all-occurrence sampling to match state duration and event rarity. Use repeated observations to estimate within-individual consistency, randomise order and separate technical repeats from independent animals or groups. Measure sex, age, social context and environment as candidate covariates. If genetic effects are proposed, use pedigrees, cross-fostering or genomic relatedness while separating maternal and shared-environment effects. Predefine exclusions and analysis, report observer reliability and uncertainty, and avoid labelling repeatability as genetic determination."}},
    b2:{short:[
      {q:"How does Hamilton's rule guide rather than automatically prove an explanation by kin selection?",a:"The inequality rb>c predicts when a social effect can be favoured, but relatedness, recipient benefit and actor cost must be estimated at the correct behavioural and demographic scale. Alternative mechanisms such as direct reciprocity, mutualism or coercion may generate the same observation. Kin selection becomes persuasive when fitness accounting, relatedness structure and comparative or experimental evidence agree."},
      {q:"Why must animal communication be analysed as a sender–receiver system?",a:"A signal is shaped by its effect on receivers, whose sensory systems, decision rules and interests create selection on signal form. Honest information may be maintained by production costs, indices, social enforcement or shared interests, while conflict permits exaggeration and eavesdropping. Environmental transmission and receiver psychology therefore belong in the same analysis as signal production."}
    ],essay:{q:"Evaluate how sexual selection and social evolution shape animal communication.",a:"Distinguish intrasexual competition, mate choice and postcopulatory processes, then relate the operational sex ratio and Bateman gradients to predicted selection intensity. Analyse signal production, transmission and reception, including sensory ecology and environmental noise. Compare index, handicap-like and conventional mechanisms of honesty, and explain when sender and receiver interests diverge. Add kin-selected calls, reciprocal exchanges or cooperative signals to extend beyond mating. Use manipulative playback or signal-alteration evidence, fitness measures and phylogenetic comparison, while avoiding the assumption that conspicuousness alone demonstrates adaptation."}},
    b3:{short:[
      {q:"Distinguish model-free learning from model-based or cognitive-map control.",a:"Model-free learning updates cached action values from reward-prediction errors and can be efficient but inflexible after contingencies change. Model-based control uses an internal representation of transitions or spatial relations to evaluate prospective outcomes. Behaviour may combine both systems; devaluation, detour and contingency-degradation tests are needed because successful performance alone does not reveal the underlying representation."},
      {q:"What does the marginal value theorem predict about patch departure?",a:"A forager should leave a depleting patch when its instantaneous gain rate falls to the average gain rate available in the habitat after travel time is included. Longer travel predicts longer patch residence, whereas richer alternatives predict earlier departure. Tests must measure the animal's experienced gains and constraints, not assume that human-defined patch quality equals perceived value."}
    ],essay:{q:"Explain how environmental information, learning and optimality models can be integrated to understand foraging.",a:"Describe how sensory cues generate uncertain evidence and how prior experience updates expectations through associative or spatial learning. Use signal-detection or sequential-sampling ideas to model commitment under error costs. Apply optimal-diet and marginal-value models as explicit benchmarks, stating currency, constraints and travel costs. Then incorporate predation risk, competition, nutrient balance and state dependence, which can make apparently suboptimal choices adaptive. Discuss ecological traps where cue–fitness relationships change. Strong tests manipulate information or payoff, track individual experience and compare predictions from competing learning and optimisation models."}},
    b4:{short:[
      {q:"What evidence shows that the honeybee waggle dance communicates spatial information?",a:"Dance angle covaries with direction relative to the sun and waggle duration with distance. Recruits preferentially search in the communicated sector, and experimental displacement, clock shift or manipulation of dance information changes their search. Odour and social cues contribute to recruitment, but controlled experiments show that symbolic spatial information has an independent causal role."},
      {q:"How should claims about animal awareness be evaluated?",a:"Define the proposed capacity behaviourally, derive predictions that separate it from conditioning, cue following and simple heuristics, and use transfer or metacognitive tests with appropriate controls. Seek convergent evidence across tasks, sensory modalities and neural measures. Conclusions should be graded by evidential strength; failure on one human-designed task does not prove absence, and success does not justify unrestricted human-like attribution."}
    ],essay:{q:"Critically evaluate evidence for complex cognition in a nonhuman animal.",a:"Choose a specific capacity such as planning, uncertainty monitoring, numerical judgement or symbolic communication. Describe the simplest associative account and the richer representational hypothesis, then identify experiments that discriminate them through novel transfer, devaluation, cue control or prospective choice. Evaluate sample size, trial history, sensory access, experimenter influence and replication. Integrate ecological relevance and comparative neural evidence without assuming that brain size alone determines competence. Conclude with the narrowest claim supported, recognising domain specificity and avoiding both anthropomorphism and reflexive underinterpretation."}},
    b5:{short:[
      {q:"Which observations establish that a rhythm is generated by a circadian oscillator?",a:"The rhythm persists with an approximately 24-hour free-running period under constant conditions, entrains to a periodic cue, and shows systematic phase shifts described by a phase-response curve. Temperature compensation supports clock identity. Direct environmental masking must be separated from oscillator phase because a light or temperature change can alter activity without resetting the clock."},
      {q:"How can a phase-response curve guide chronotherapy?",a:"A phase-response curve predicts whether a timed cue or treatment advances, delays or minimally shifts circadian phase. Therapy can then be scheduled to align drug exposure with target physiology or to correct misalignment. Translation requires an individual phase marker, pharmacokinetic and safety data, and recognition that clock time is an imperfect substitute for biological time."}
    ],essay:{q:"Explain the organisation, entrainment and applied significance of biological rhythms.",a:"Distinguish ultradian, circadian and infradian outputs, then define oscillator, input pathway and overt rhythm. Explain free-running period, phase, amplitude, temperature compensation and entrainment, using a phase-response curve to distinguish advances from delays. Describe coupled central and peripheral clocks and the coordinating roles of light, feeding and social cues. Separate entrainment from masking and analyse jet lag or shift work as internal and external misalignment. Conclude with photoperiodism and chronotherapy, stressing that interventions require reliable phase assessment rather than clock time alone."}},
    d1:{short:[
      {q:"Why are submission rate, conception rate and pregnancy rate interpreted together?",a:"Submission rate measures how effectively eligible females are detected and bred; conception rate measures success per service; pregnancy rate combines both processes per breeding interval. A low pregnancy rate can therefore arise from poor heat detection, poor fertility or both. Interpretation needs clear eligibility rules, pregnancy diagnosis timing, semen handling and records of voluntary waiting period and culling."},
      {q:"How does a selection index convert records into a breeding decision?",a:"An index weights estimated breeding values for economically or biologically important traits according to the breeding objective. It can balance milk yield with fertility, health, longevity and feed efficiency rather than maximising one trait. Weights depend on reliable records, genetic parameters and economic values; correlated responses and inbreeding must be monitored across generations."}
    ],essay:{q:"Design a sustainable cattle-improvement and reproductive-management programme for a dairy herd.",a:"Define the production environment and breeding objective before choosing locally adapted, specialised or crossbred animals. Establish unique identification and records for yield, fertility, health, longevity and pedigree. Use estimated breeding values or genomic predictions with balanced trait weights and control inbreeding. Integrate oestrus detection, insemination timing, semen cold-chain quality, pregnancy diagnosis and postpartum health. Evaluate technologies with a partial budget and monitor submission, conception, pregnancy and culling rates. Preserve welfare and adaptation rather than pursuing maximum yield irrespective of heat, feed or disease constraints."}},
    d2:{short:[
      {q:"Why is the temperature–humidity index useful but insufficient for heat-stress management?",a:"THI combines ambient temperature and humidity into an accessible risk indicator, but it omits solar radiation, wind, night cooling, animal production level, coat, acclimatisation and access to water. Decisions should combine THI with respiration rate, body temperature, intake, behaviour and facility measurements. Thresholds are therefore context-specific rather than universal biological boundaries."},
      {q:"How does overstocking affect both production and welfare?",a:"Too many cows per stall, feed space or water point increases competition, standing time and displacement while reducing rest and synchronised feeding. Consequences include lameness risk, variable intake, social stress and reduced milk performance. Stocking density must be expressed relative to the limiting resource, because adequate floor area does not compensate for insufficient stalls or feed access."}
    ],essay:{q:"Propose an evidence-based dairy housing plan for a hot-humid environment.",a:"Select an elevated, drained site and orient structures to limit solar load while promoting prevailing airflow. Provide dry, comfortable resting space, non-slip alleys, adequate feed frontage and multiple high-flow water points. Match stocking density to stalls and access resources. Combine shade, ridge and sidewall ventilation, fans and correctly managed water cooling, with separate provisions for calves, transition cows, sick animals and calving. Design manure flow and drainage to reduce pathogen exposure without contaminating water. Monitor microclimate, respiration, lying time, lameness, lesions and production, then adapt the plan to measured bottlenecks."}},
    d3:{short:[
      {q:"Why must physically effective fibre and fermentable carbohydrate be balanced?",a:"Effective fibre stimulates chewing, saliva buffering and rumen motility, whereas fermentable carbohydrate supports microbial growth and propionate supply. Excess rapidly fermentable substrate with inadequate fibre lowers rumen pH and destabilises intake and milk fat; excessive bulky fibre limits energy intake. Balance is assessed through particle size, NDF, digestibility, sorting, faeces, rumination and performance."},
      {q:"Why are transition cows vulnerable to negative energy balance?",a:"Feed intake often falls before calving while energy demand rises sharply with lactation. Adipose mobilisation supplies fuel but excessive non-esterified fatty acids and ketone production burden the liver and are associated with ketosis, displaced abomasum, immune dysfunction and poor fertility. Prevention integrates body-condition control, palatable balanced diets, comfortable access and early metabolic monitoring."}
    ],essay:{q:"Construct a feeding programme that links rumen function, nutrient requirements and herd monitoring.",a:"Group animals by physiological state and estimate dry-matter intake, maintenance, growth, pregnancy and lactation requirements. Test feeds and formulate metabolizable energy, protein, minerals and vitamins while providing adequate NDF and physically effective fibre. Explain microbial fermentation to acetate, propionate, butyrate and microbial protein, and synchronise fermentable energy with nitrogen. Introduce diets gradually, secure water and bunk access and limit sorting. Give transition cows a dedicated strategy. Audit refusals, body condition, milk components, rumination, faeces, lameness and metabolic indicators, revising the ration when animal responses disagree with formulation."}},
    d4:{short:[
      {q:"How do D-value and z-value support validation of milk heat treatment?",a:"At a fixed temperature, the D-value is the time required for a one-log reduction of a target microorganism. The z-value is the temperature change that shifts the D-value tenfold. Together they permit comparison of time–temperature combinations, but validation must specify the target organism, initial load, product matrix, equipment performance and post-process contamination control."},
      {q:"Why does milk quality require both compositional and hygienic measurements?",a:"Fat, protein, lactose, solids-not-fat and freezing point describe nutritional and economic composition, while total bacterial count, somatic-cell count, residues and adulterants address hygiene, udder health and safety. One domain cannot infer the other: composition may be normal despite contamination, and safe milk may still fail product specifications. Sampling integrity and calibrated methods are essential."}
    ],essay:{q:"Describe a farm-to-product milk-quality system based on preventive control.",a:"Begin with udder health, clean housing, potable water and withdrawal-period records. Standardise premilking preparation, teat sanitation, equipment function and rapid cooling. Maintain an unbroken cold chain with traceable sampling and tests for composition, somatic cells, microbial load, residues and adulteration. Map processing hazards using HACCP, identify critical control points and define measurable limits, monitoring, corrective action and verification. Explain pasteurisation with D- and z-values without calling it sterilisation, and prevent recontamination through hygienic design, packaging and storage. Use deviations to improve the process rather than merely reject the final batch."}},
    d5:{short:[
      {q:"How do control priorities differ for contagious and environmental mastitis?",a:"Contagious pathogens spread mainly during milking, so priorities include postmilking teat disinfection, gloves, equipment function, segregation and management of chronically infected cows. Environmental pathogens arise from bedding, manure, water and transition-period exposure, so clean dry resting areas, premilking preparation and host resistance are central. Culture and herd pattern should guide classification and treatment."},
      {q:"How can refugia slow anthelmintic resistance?",a:"Parasites in refugia escape drug exposure and retain susceptible alleles. Their offspring dilute resistant alleles from treated survivors, slowing resistance evolution. Blanket frequent treatment removes this dilution. Targeted selective treatment, efficacy testing, quarantine protocols and pasture management can preserve refugia, but decisions must balance resistance control with animal health and local parasite epidemiology."}
    ],essay:{q:"Develop an integrated herd-health and biosecurity plan consistent with One Health principles.",a:"Map routes of introduction and spread through purchased animals, people, equipment, feed, water, manure, wildlife and milk. Use supplier risk assessment, quarantine, diagnostic testing, vaccination where appropriate and isolation of clinical cases. Build mastitis, reproductive, calf and parasite surveillance from consistent records and laboratory confirmation. Apply hygiene, ventilation, nutrition and stocking controls before relying on medicines. Set treatment protocols with veterinary oversight, culture where useful, respect withdrawal periods and audit antimicrobial use and resistance. Include carcass and manure management, worker safety and zoonotic communication. Review outcomes after outbreaks and revise critical control points."}}

d="exam">Examination focus</h2><div class="callout"><strong>Structured-answer prompt</strong>${esc(l.exam)}</div></article><aside class="sidecard"><div class="panel"><h3>Chapter structure</h3><nav class="toc">${sections.map((s,i)=>`<a href="#s${i+1}">${esc(s[0])}</a>`).join("")}<a href="#process">Mechanistic sequence</a><a href="#synthesis">Unit-level synthesis</a><a href="#exam">Examination focus</a></nav></div><div class="panel"><h3>Scholarly note</h3><textarea id="noteBox" maxlength="12000" placeholder="Record an explanation, comparison, evidence source or unresolved question…">${esc(state.notes[l.id]||"")}</textarea><button class="btn small primary" data-save-note="${l.id}" type="button" style="margin-top:8px">Save note</button></div></aside></div><nav class="pager no-print" aria-label="Chapter navigation">${prev?`<button class="btn" data-open-lesson="${prev.lesson.id}" type="button">← Previous</button>`:"<span></span>"}<span>${idx+1} / ${courseLessons.length}</span>${next?`<button class="btn primary next" data-open-lesson="${next.lesson.id}" type="button">Next →</button>`:`<button class="btn primary next" data-open-course="${c.id}" type="button">Course overview</button>`}</nav>${footer()}</section>`;}
  function renderSearch(){app.innerHTML=`<section class="view">${crumbs([{label:"Home",action:'data-go="home"'},{label:"Search"}])}<div class="sectionhead"><div><p class="eyebrow">COURSE-WIDE FINDER</p><h2>Search every chapter</h2><p>Search titles, mechanisms, disorders, key points and examination prompts.</p></div></div><div class="searchbox"><label class="sr-only" for="searchInput">Search learning content</label><input id="searchInput" type="search" placeholder="Try: heritability, countercurrent, waggle dance, pasteurisation…" autocomplete="off"><button class="btn primary" type="button" data-run-search>Search</button></div><div class="results" id="searchResults"><div class="empty">Enter at least two characters to search ${allLessons.length} chapters and ${glossary.length} glossary entries.</div></div>${footer()}</section>`;setTimeout(()=>document.getElementById("searchInput")?.focus(),0);}
  function runSearch(){clearTimeout(searchTimer);const input=document.getElementById("searchInput"),box=document.getElementById("searchResults");if(!input||!box)return;const q=normalizeSearchText(input.value);if(q.length<2){box.innerHTML='<div class="empty">Enter at least two characters.</div>';return;}const index=ensureSearchIndex(),lessonHits=index.lessons.filter(item=>item.text.includes(q)).slice(0,40).map(item=>item.ref),termHits=index.terms.filter(item=>item.text.includes(q)).slice(0,15).map(item=>item.term);box.innerHTML=(lessonHits.length?lessonHits.map(x=>`<button class="result" data-open-lesson="${x.lesson.id}" type="button"><strong>${esc(x.lesson.title)}</strong><span>${esc(x.course.title)} · Unit ${roman(x.ui+1)} — ${esc(x.unit.title)}</span></button>`).join(""):"")+(termHits.length?termHits.map(t=>`<div class="result"><strong>${esc(t[0])}</strong><span>${esc(t[1])}</span></div>`).join(""):"")||'<div class="empty">No matching chapter or glossary term.</div>';}
  function assessmentMarkup(unit){const bank=unitAssessment[unit.id];if(!bank)return "";return `<details style="margin-top:12px"><summary class="btn small">Short-answer models</summary>${bank.short.map((item,i)=>`<div class="callout"><strong>Question ${i+1}: ${esc(item.q)}</strong>${esc(item.a)}</div>`).join("")}</details><details style="margin-top:12px"><summary class="btn small">Essay framework</summary><div class="callout"><strong>${esc(bank.essay.q)}</strong>${esc(bank.essay.a)}</div></details>`;}
  function renderRevision(courseId){const c=getCourse(courseId)||courses[0];app.innerHTML=`<section class="view">${crumbs([{label:"Home",action:'data-go="home"'},{label:"Revision"}])}<div class="sectionhead"><div><p class="eyebrow">REVISE AND WRITE</p><h2>Unit-level consolidation</h2><p>Use the key distinctions first, then answer the structured prompts without notes.</p></div></div><div class="row no-print" style="margin-bottom:16px">${courses.map(x=>`<button class="chip" data-revise-course="${x.id}" type="button" ${x.id===c.id?'aria-pressed="true"':''}>${esc(x.title)}</button>`).join("")}</div><div class="revision-grid">${c.units.map((u,ui)=>`<article class="panel revision-card"><p class="eyebrow">UNIT ${roman(ui+1)}</p><h3>${esc(u.title)}</h3><ul>${u.revision.map(r=>`<li>${esc(r)}</li>`).join("")}</ul><details style="margin-top:12px"><summary class="btn small">Examination prompts</summary><ol>${u.lessons.map(l=>`<li>${esc(l.exam)}</li>`).join("")}</ol></details>${assessmentMarkup(u)}</article>`).join("")}</div><div class="sectionhead"><div><p class="eyebrow">REFERENCE</p><h2>Essential glossary</h2><p>${glossary.length} searchable definitions across all four courses.</p></div></div><div class="searchbox no-print"><label class="sr-only" for="glossaryInput">Filter glossary</label><input id="glossaryInput" type="search" placeholder="Filter ${glossary.length} terms…"><button class="btn" data-filter-glossary type="button">Filter</button></div><dl class="glossary" id="glossaryList" style="margin-top:14px">${glossary.map(t=>`<div class="term"><dt>${esc(t[0])}</dt><dd>${esc(t[1])}</dd></div>`).join("")}</dl>${footer()}</section>`;}
  function filterGlossary(){clearTimeout(glossaryTimer);const input=document.getElementById("glossaryInput"),list=document.getElementById("glossaryList");if(!input||!list)return;const q=normalizeSearchText(input.value),hits=ensureSearchIndex().terms.filter(item=>item.text.includes(q)).map(item=>item.term);list.innerHTML=hits.length?hits.map(t=>`<div class="term"><dt>${esc(t[0])}</dt><dd>${esc(t[1])}</dd></div>`).join(""):'<div class="empty">No glossary match.</div>';}
  function renderQuiz(){if(!quiz){app.innerHTML=`<section class="view">${crumbs([{label:"Home",action:'data-go="home"'},{label:"Quiz"}])}<div class="sectionhead"><div><p class="eyebrow">ACTIVE RECALL</p><h2>Build a 10-question test</h2><p>Questions are drawn across units and explanations follow every response.</p></div></div><div class="panel" style="max-width:680px"><label for="quizCourse"><strong>Question coverage</strong></label><select id="quizCourse" style="display:block;width:100%;min-height:50px;margin:10px 0 18px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--ink);padding:0 12px"><option value="all">All four courses</option>${courses.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join("")}</select><button class="btn primary" data-start-quiz type="button">Start quiz</button></div>${footer()}</section>`;return;}if(quiz.finished){const percent=pct(quiz.score,quiz.items.length);app.innerHTML=`<section class="view">${crumbs([{label:"Home",action:'data-go="home"'},{label:"Quiz results"}])}<div class="panel scorebox"><p class="eyebrow">QUIZ COMPLETE</p><b>${quiz.score} / ${quiz.items.length}</b><h2>${percent>=80?"Strong retrieval":percent>=60?"Developing mastery":"Review before retesting"}</h2><p>${percent}% correct. Explanations were provided after every answer.</p><div class="row" style="justify-content:center"><button class="btn primary" data-restart-quiz type="button">New quiz</button><button class="btn" data-go="revision" type="button">Open revision</button></div></div>${footer()}</section>`;return;}const item=quiz.items[quiz.index],answered=quiz.answer!==null;app.innerHTML=`<section class="view">${crumbs([{label:"Home",action:'data-go="home"'},{label:"Quiz"}])}<div class="quiz-layout"><div class="panel"><p class="eyebrow">QUESTION ${quiz.index+1} OF ${quiz.items.length}${item.d?` · ${esc(item.d)}`:""}</p><div class="progressline"><span style="--p:${pct(quiz.index,quiz.items.length)}%"></span></div><p class="question">${esc(item.q)}</p><div class="options">${item.o.map((o,i)=>`<button class="option ${answered?(i===item.a?"correct":i===quiz.answer?"wrong":""):""}" data-answer="${i}" type="button" ${answered?"disabled":""}><span class="optionkey">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join("")}</div>${answered?`<div class="feedback ${quiz.answer===item.a?"good":"bad"}"><strong>${quiz.answer===item.a?"Correct":"Not correct"}.</strong> ${esc(item.e)}</div><button class="btn primary" data-next-question type="button" style="margin-top:14px">${quiz.index===quiz.items.length-1?"View result":"Next question"}</button>`:""}</div><aside class="panel scorebox"><span>Current score</span><b>${quiz.score}</b><p class="kicker">Questions answered: ${quiz.index+(answered?1:0)}</p></aside></div>${footer()}</section>`;}
  function startQuiz(){const cid=document.getElementById("quizCourse")?.value||"all",pool=questions.filter(q=>cid==="all"||q.c===cid),items=shuffle(pool).slice(0,Math.min(10,pool.length));quiz={items,index:0,score:0,answer:null,finished:false};renderQuiz();window.scrollTo(0,0);}
  function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
  function renderProgress(){const total=allLessons.length,done=state.completed.length;app.innerHTML=`<section class="view">${crumbs([{label:"Home",action:'data-go="home"'},{label:"Progress"}])}<div class="sectionhead"><div><p class="eyebrow">LOCAL STUDY RECORD</p><h2>${done} of ${total} chapters completed</h2><p>Progress, bookmarks, notes and quiz history are stored only on this device.</p></div></div><div class="progress-grid">${courses.map(c=>{const d=courseDone(c),t=c.units.flatMap(u=>u.lessons).length;return `<article class="panel"><p class="eyebrow">${esc(c.code)}</p><h3>${esc(c.title)}</h3><div class="progressline"><span style="--p:${pct(d,t)}%"></span></div><p>${d} / ${t} · ${pct(d,t)}%</p><button class="btn small" data-open-course="${c.id}" type="button">Review course</button></article>`}).join("")}</div><div class="sectionhead"><div><p class="eyebrow">SAVED</p><h2>Bookmarks and quiz history</h2></div></div><div class="progress-grid"><div class="panel"><h3>Bookmarked chapters</h3>${state.bookmarks.length?state.bookmarks.map(id=>{const x=getLesson(id);return x?`<button class="result" data-open-lesson="${id}" type="button"><strong>${esc(x.lesson.title)}</strong><span>${esc(x.course.title)}</span></button>`:""}).join(""):'<p class="kicker">No bookmarks yet.</p>'}</div><div class="panel"><h3>Recent quiz scores</h3>${state.quizHistory.length?`<ol>${[...state.quizHistory].reverse().map(h=>`<li>${h.score}/${h.total} · ${esc(h.date)}</li>`).join("")}</ol>`:'<p class="kicker">No completed quizzes yet.</p>'}</div></div>${footer()}</section>`;}
  app.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.go){quiz=null;setRoute(b.dataset.go);return;}if(b.dataset.openCourse){setRoute("course",{courseId:b.dataset.openCourse});return;}if(b.dataset.openLesson){setRoute("lesson",{lessonId:b.dataset.openLesson});return;}if(b.dataset.toggleComplete){const id=b.dataset.toggleComplete;state.completed=state.completed.includes(id)?state.completed.filter(x=>x!==id):[...state.completed,id];const persisted=save();renderLesson(id);persistenceToast(persisted,state.completed.includes(id)?"Chapter completed":"Completion removed");return;}if(b.dataset.toggleBookmark){const id=b.dataset.toggleBookmark;state.bookmarks=state.bookmarks.includes(id)?state.bookmarks.filter(x=>x!==id):[...state.bookmarks,id];const persisted=save();renderLesson(id);persistenceToast(persisted,state.bookmarks.includes(id)?"Bookmark saved":"Bookmark removed");return;}if(b.dataset.saveNote){const box=document.getElementById("noteBox"),id=b.dataset.saveNote;state.notes[id]=(box?.value||"").slice(0,12000);persistenceToast(save(),"Note saved");return;}if(b.dataset.speak){speakLesson(b.dataset.speak);return;}if(b.hasAttribute("data-run-search")){runSearch();return;}if(b.dataset.reviseCourse){setRoute("revision",{courseId:b.dataset.reviseCourse});return;}if(b.hasAttribute("data-filter-glossary")){filterGlossary();return;}if(b.hasAttribute("data-start-quiz")){startQuiz();return;}if(b.hasAttribute("data-restart-quiz")){quiz=null;renderQuiz();return;}if(b.dataset.answer!==undefined&&quiz&&quiz.answer===null){quiz.answer=Number(b.dataset.answer);if(quiz.answer===quiz.items[quiz.index].a)quiz.score++;renderQuiz();return;}if(b.hasAttribute("data-next-question")&&quiz){let persisted=true;if(quiz.index<quiz.items.length-1){quiz.index++;quiz.answer=null;}else{quiz.finished=true;state.quizHistory.push({score:quiz.score,total:quiz.items.length,date:new Date().toLocaleDateString()});state.quizHistory=state.quizHistory.slice(-20);persisted=save();}renderQuiz();window.scrollTo(0,0);if(!persisted)toast("Quiz result kept for this session only");return;}if(b.hasAttribute("data-retry-start")){startApp();return;}});
  app.addEventListener("input",e=>{if(e.target.id==="searchInput")queueSearch("lesson");if(e.target.id==="glossaryInput")queueSearch("glossary");});
  document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.closest("#app"))return;if(b.dataset.view){quiz=null;setRoute(b.dataset.view);return;}if(b.dataset.openCourse){setRoute("course",{courseId:b.dataset.openCourse});return;}});
  function speakLesson(id){const x=getLesson(id);if(!x||!("speechSynthesis" in window)){toast("Read-aloud is not available in this browser");return;}speechSynthesis.cancel();const text=[x.lesson.title,x.lesson.lead,...lessonSections(x.lesson).flat(),"Core interpretive principle",x.lesson.key,"Unit synthesis",...x.unit.revision,"Examination focus",x.lesson.exam].join(". ");const utterance=new SpeechSynthesisUtterance(text);utterance.lang="en-IN";utterance.rate=.92;speechSynthesis.speak(utterance);toast("Read-aloud started");}

  document.getElementById("exportBtn").addEventListener("click",()=>{const payload={type:"PG_ZOOLOGY_SEM3_BACKUP",version:APP_VERSION,exportedAt:new Date().toISOString(),state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`PG_Zoology_Sem3_Backup_${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("Backup exported");});
  document.getElementById("importBtn").addEventListener("click",()=>document.getElementById("importFile").click());document.getElementById("importFile").addEventListener("change",async e=>{const file=e.target.files?.[0];if(!file)return;try{const raw=JSON.parse(await file.text());if(raw.type!=="PG_ZOOLOGY_SEM3_BACKUP"||!raw.state)throw new Error("Invalid backup");state=normalize(raw.state);applyPrefs();const persisted=save();closeTools();setRoute("home");persistenceToast(persisted,"Backup restored");}catch(_){toast("This is not a valid app backup");}finally{e.target.value="";}});

  function showStartupFailure(error){console.error("PG Zoology startup recovery",error);app.innerHTML=`<section class="view"><div class="panel" role="alert"><p class="eyebrow">STARTUP RECOVERY</p><h1>The learning content could not be displayed.</h1><p>Your file remains open. Retry once; if the problem continues, reopen the original HTML file in Chrome.</p><button class="btn primary" data-retry-start type="button">Retry loading</button></div></section>`;}
  function startApp(){try{initHistory();applyPrefs();render();primeSearchIndex();}catch(error){showStartupFailure(error);}}
  window.addEventListener("pagehide",()=>{save();},{capture:true});
  window.addEventListener("pageshow",event=>{if(!event.persisted)return;state=loadState();try{applyPrefs();render();}catch(error){showStartupFailure(error);}});

  startApp();
