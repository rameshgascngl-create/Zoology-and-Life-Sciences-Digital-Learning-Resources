  const physiologyDeepening={
    p1l1:[["Advanced integration · nutritional geometry","Nutrition is a multidimensional regulation problem rather than a search for maximum energy alone. Animals balance protein, carbohydrate, lipid, minerals and defensive compounds while facing gut-capacity, handling-time and predation constraints. Nutritional-geometry experiments map intake in nutrient space and distinguish an animal's preferred target from the compromise reached on imbalanced foods. Comparative interpretation must also consider body size, metabolic strategy, life stage and whether symbiotic microbes unlock otherwise inaccessible substrates."],["Recent advances · cells, circuits and feeding state","Single-cell and spatial methods now connect vagal afferents, hypothalamic populations, enteroendocrine cells and adipose signals with feeding decisions. These atlases reveal cellular diversity, but a molecular cluster is not automatically a functional neuron type: perturbation, recording and behavioural tests are still required. Current work increasingly studies how nutrient identity, gut distension, circadian phase and learned sensory cues converge, replacing the older idea of one universal hunger centre."],["Worked example · an energy budget","A 0.5 kg animal consumes 80 kJ of food, loses 18 kJ in faeces and 7 kJ in urine, and expends 42 kJ in maintenance and activity. Assimilated energy is 55 kJ and production energy is 13 kJ. Assimilation efficiency is 55/80, whereas net production efficiency uses assimilated energy as its denominator. State the denominator explicitly: two ratios can describe the same animal yet answer different biological questions."]],
    p1l2:[["Advanced integration · motility as coupled control","Gastrointestinal movement emerges from smooth-muscle properties, interstitial cells of Cajal, enteric circuits, autonomic input and local chemical conditions. Slow waves set windows of excitability; spike activity produces contraction. Distension activates ascending excitatory and descending inhibitory pathways that polarise the peristaltic reflex. Segmentation, migrating motor complexes, gastric accommodation and sphincter control are distinct programmes, so the phrase increased motility is physiologically incomplete unless region, pattern and function are specified."],["Recent advances · enteric repair and neuroimmune physiology","Human gut maps resolve enteric neurons, glia, immune cells and stromal niches across anatomical layers. Experimental work has also tested cell therapy for enteric neuropathy and shown that defined enteric neuronal populations can alter mucosal immune responses. Translation remains demanding: engrafted cells must survive, integrate with smooth muscle and sensory circuits, and improve coordinated transit without obstruction or dysrhythmia. These studies reposition the enteric nervous system as a modifiable organ network."],["Worked example · reading manometry","Suppose oesophageal manometry records a swallowed bolus followed by sequential contractions at 22, 28 and 34 cm from the incisors, each delayed by 1.2 s. The orderly distal progression supports propagated peristalsis. Simultaneous high-amplitude contractions would suggest failed inhibitory sequencing, whereas low-amplitude waves could reflect weak propulsion. Interpret pressure together with bolus clearance because a pressure trace measures force and timing, not transport success directly."]],
    p1l3:[["Advanced integration · vectorial transport","Epithelial absorption is vectorial because apical and basolateral membranes contain different transporters. The Na+/K+-ATPase lowers intracellular sodium and thereby powers secondary active uptake of glucose, amino acids and selected ions. Water follows effective osmotic gradients through transcellular and paracellular routes. Lipids take a different path: micelles deliver products to enterocytes, re-esterification and apolipoproteins generate chylomicrons, and lymphatic entry initially bypasses the portal vein. Surface area alone cannot explain absorption without these energetic and trafficking mechanisms."],["Recent advances · spatial gut biology","Spatial and single-cell atlases show that absorptive, secretory and immune programmes change along the crypt-villus and proximal-distal axes. Organoids permit causal tests of epithelial transport and infection, but lack the full neural, vascular, microbial and mechanical environment unless deliberately reconstructed. Current evidence therefore combines atlas-based hypotheses with flux measurements, isotope tracing and perturbation. Cell identity should be linked to what crosses an epithelium, at what rate and under which gradients."],["Worked example · oral rehydration","In secretory diarrhoea, chloride secretion may remain high, yet coupled sodium-glucose uptake is often preserved. A solution containing appropriate glucose and sodium promotes solute entry, and water follows osmotically. Excess glucose can instead retain water in the lumen, while plain water does not replace salt efficiently. The example demonstrates a general principle: therapy exploits an intact transport pathway and must respect concentration, electroneutrality and total osmotic load."]],
    p1l4:[["Advanced integration · barrier failure as a systems problem","The gastrointestinal barrier includes mucus, epithelial junctions, antimicrobial products, immune tolerance, motility and portal-hepatic clearance. Disease can begin with altered secretion, dysmotility, immune injury, infection, vascular insufficiency or hepatobiliary obstruction, yet these processes interact. Cholestasis reduces bile delivery and fat absorption; portal hypertension changes vascular pressures; inflammation can increase permeability and reshape microbial metabolism. Mechanistic diagnosis therefore traces a symptom such as diarrhoea or jaundice back through transport, tissue injury and organ communication."],["Recent advances · multi-omic disease stratification","Contemporary studies combine endoscopy, histology, microbial metagenomics, metabolites and host single-cell profiles to divide apparently similar disorders into molecular subgroups. Associations between a microbe and disease do not establish causation because drugs, diet, inflammation and transit all alter the microbiome. Stronger evidence requires temporal sampling, functional products, perturbation and reproducible host response. Patient-derived organoids add a tractable model for epithelial mechanisms but cannot reproduce the entire gut-liver axis."],["Worked example · localising jaundice","Unconjugated hyperbilirubinaemia points toward excess production or impaired conjugation; conjugated bilirubin with pale stools and raised cholestatic enzymes suggests impaired bile flow. Dark urine is more compatible with water-soluble conjugated pigment than unconjugated bilirubin bound to albumin. These patterns localise a process but do not name one disease. Complete reasoning adds history, haemolysis indices, liver-cell injury markers and imaging before assigning cause."]],
    p2l1:[["Advanced integration · mechanics and diffusion","Ventilation depends on pressure gradients created by respiratory muscles acting against elastic recoil and airway resistance. Compliance is ΔV/ΔP; very stiff lungs require greater pressure for a given volume, whereas excessive compliance can impair recoil. Airway resistance rises steeply as radius falls, while turbulent flow adds complexity in large airways. Gas transfer then depends on surface area, membrane thickness, diffusion coefficient and partial-pressure gradient. Ventilation and diffusion are sequentially connected but must be measured separately."],["Recent advances · spatial lung atlases","Developmental and adult spatial atlases now map epithelial, endothelial, immune and mesenchymal cells within precise airway and alveolar niches. They reveal regional cell states that bulk tissue averages obscure and help compare healthy lungs with asthma or fibrosis. An atlas is descriptive evidence; lineage tracing, organoid models and physiological measurements are needed to show whether a cell state drives repair or disease. The emerging view treats the respiratory membrane as a multicellular vascular-epithelial unit."],["Worked example · Fick's law","If effective surface area halves and membrane thickness doubles while the diffusion gradient and gas properties remain constant, diffusive capacity falls to one quarter. The calculation follows rate proportional to area divided by thickness. In vivo, compensation by recruitment, altered perfusion or increased ventilation may partly mask this structural loss. State those assumptions before using the simple ratio to predict arterial oxygenation."]],
    p2l2:[["Advanced integration · content, tension and carriage","Partial pressure describes dissolved gas and drives diffusion; oxygen content includes haemoglobin-bound plus dissolved oxygen. Severe anaemia can therefore produce normal PaO2 but low arterial oxygen content. The sigmoidal dissociation curve supports loading in lungs and unloading in tissues; increased CO2, acidity and temperature shift affinity to aid release. The Haldane effect describes deoxygenated haemoglobin's increased capacity for CO2 and protons, complementing the Bohr effect rather than duplicating it."],["Recent advances · integrated gas sensing","Research now resolves oxygen sensing from carotid-body glomus cells and mitochondrial signalling to hypoxia-inducible transcription and vascular remodelling. Wearable oximetry and computational models provide long time series, but saturation alone cannot diagnose ventilation, haemoglobin concentration or tissue delivery. Motion, skin perfusion and dyshemoglobins can distort readings. Contemporary interpretation combines sensor limitations with arterial gases, haemoglobin and the clinical or comparative context."],["Worked example · arterial oxygen content","Use CaO2≈1.34×Hb×SaO2+0.003×PaO2. With Hb 8 g dL−1, saturation 98% and PaO2 100 mmHg, content is about 10.8 mL dL−1, substantially below the value at Hb 15 despite excellent saturation. The dissolved term contributes only about 0.3. This explains why a normal pulse-oximeter reading does not exclude low oxygen-carrying capacity."]],
    p2l3:[["Advanced integration · patterns of failure","Obstructive disease increases expiratory flow limitation, often lowering FEV1/FVC; restrictive disease reduces lung volumes and may preserve or raise that ratio. Neither label alone specifies gas exchange. Ventilation-perfusion inequality commonly causes hypoxaemia, true shunt responds poorly to added oxygen, and diffusion limitation becomes more visible during exercise. Respiratory failure must therefore be classified with spirometry, volumes, diffusion, blood gases and context rather than inferred from breathlessness alone."],["Recent advances · diseased airway ecosystems","Spatial profiling of airway walls in asthma resolves epithelial, immune, vascular and stromal neighbourhoods that vary across patients and anatomical sites. Such work supports mechanism-based endotypes rather than one uniform asthma model. However, cross-sectional cell states may be consequences of treatment or inflammation. Longitudinal sampling, functional perturbation and treatment-response studies are needed before an atlas marker becomes a clinical target."],["Worked example · spirometry","A patient has FEV1 1.6 L and FVC 3.2 L, giving a ratio of 0.50; after bronchodilator FEV1 rises to 2.0 L. The low ratio supports airflow obstruction and the improvement indicates reversibility under the test conditions. Restriction cannot be confirmed from low FVC alone because air trapping can reduce it; total lung capacity is required. Compare measurements with appropriate reference equations rather than one universal cutoff."]],
    p2l4:[["Advanced integration · acclimation, adaptation and limits","Homeostasis is active regulation around context-dependent ranges, not constancy of every variable. Acclimation is a reversible within-lifetime response, whereas adaptation is a heritable population change across generations. At altitude, hyperventilation improves alveolar oxygen but initially lowers CO2; renal bicarbonate loss then permits sustained ventilation. Heat, cold, diving and spaceflight impose different interacting demands on circulation, fluid balance, metabolism and redox control. Critical limits emerge when compensatory capacity is exhausted."],["Recent advances · extreme-environment physiology","Multi-omic studies of spaceflight, high-altitude populations and divers integrate gene regulation, metabolism, immunity and microbiomes with organ physiology. These datasets are rich but often small, confounded by training and environment, and unable to prove adaptation from expression alone. Bioluminescence research likewise links luciferin chemistry to oxygen use, signalling ecology and engineered imaging. The strongest analyses connect molecular changes to performance, reversibility and evolutionary history."],["Worked example · altitude gas equation","At sea level, inspired oxygen pressure is roughly 0.21×(760−47)=150 mmHg. At a barometric pressure of 500 mmHg it falls to about 95 mmHg before accounting for alveolar CO2. The drop follows pressure, not a change in oxygen fraction. Hyperventilation lowers alveolar CO2 and partly defends alveolar oxygen, but cannot restore sea-level inspired pressure."]],
    p3l1:[["Advanced integration · blood production and haemostasis","Haemopoiesis balances stem-cell self-renewal with lineage commitment under cytokines, marrow niches and demand signals such as erythropoietin. Haemostasis is a regulated surface reaction: platelet adhesion and activation build a primary plug, tissue-factor initiation generates thrombin, fibrin stabilises the site, and anticoagulant and fibrinolytic systems restrict the response. The cell-based model explains why a list of soluble factors alone cannot capture localisation, platelet surfaces or endothelial control."],["Recent advances · dynamic cell states","Single-cell lineage tracing and transcriptomics reveal continuous haematopoietic trajectories and age-related clonal expansions rather than rigid, identical branch points. Platelet research increasingly examines immune signalling and heterogeneous platelet states. Clonal haematopoiesis is associated with inflammatory and cardiovascular risk, yet association is not deterministic disease. Functional studies must distinguish a clone that merely marks ageing from one that changes cytokine production or thrombosis."],["Worked example · laboratory localisation","Prolonged prothrombin time with normal activated partial thromboplastin time initially localises to the extrinsic/common screening pathway; isolated prolonged aPTT localises toward intrinsic/common factors or an inhibitor. If both are prolonged, common-pathway deficiency, severe liver dysfunction, consumption or anticoagulant exposure becomes more plausible. Screening times do not measure bleeding risk perfectly; platelet number, fibrinogen, mixing studies and clinical history complete the analysis."]],
    p3l2:[["Advanced integration · the pressure-volume loop","A ventricular pressure-volume loop joins filling, isovolumetric contraction, ejection and isovolumetric relaxation. End-diastolic volume reflects preload, arterial impedance contributes to afterload, and end-systolic relations index contractile state. Increased preload widens the loop through Frank-Starling recruitment; increased afterload can raise end-systolic volume and reduce stroke volume. Heart rate then converts stroke volume to cardiac output, while pressure-volume area relates to myocardial energy demand."],["Recent advances · cardiac spatial biology","Human heart atlases now place cardiomyocyte states, fibroblasts, immune cells, vessels and conduction-system niches within three-dimensional tissue architecture. Spatial cell communities clarify why an infarct border, fibrotic region and conduction node behave differently despite sharing an organ. These maps nominate cell interactions; electrophysiology, mechanics and perturbation are required to establish function. The modern heart is therefore studied as coupled electrical, mechanical, metabolic and cellular networks."],["Worked example · output and ejection fraction","If end-diastolic volume is 130 mL and end-systolic volume is 55 mL, stroke volume is 75 mL and ejection fraction is 75/130, about 58%. At 72 beats min−1, cardiac output is 5.4 L min−1. Ejection fraction is a proportion, not total output: a small ventricle can have a normal fraction yet deliver inadequate stroke volume."]],
    p3l3:[["Advanced integration · nested cardiovascular control","Mean arterial pressure is governed approximately by cardiac output multiplied by total peripheral resistance. Rapid baroreflexes alter autonomic drive; local metabolites and myogenic responses match flow to tissue demand; kidneys control blood volume and long-term pressure through sodium balance and renin-angiotensin-aldosterone signalling. These loops interact across time scales. A measured pressure is therefore an outcome, not a direct readout of one controller."],["Recent advances · continuous phenotyping and vascular atlases","Wearable sensors and ambulatory monitoring reveal nocturnal, postural and activity-dependent pressure patterns missed by isolated clinic readings. Organotypic vascular atlases show that endothelial and mural cells differ across tissues, while brain-vessel maps expose specialised barrier and transport states. More data do not automatically mean better inference: calibration, posture, cuff or optical artefact, missingness and reference standards remain central."],["Worked example · MAP and resistance","For a pressure of 120/75 mmHg, MAP is approximately 75+(45/3)=90 mmHg at a normal heart rate. If cardiac output is 5 L min−1, systemic vascular resistance is proportional to 90/5, ignoring central venous pressure for this estimate. When pressure falls, decide whether flow, resistance or both changed before assigning a cause."]],
    p3l4:[["Advanced integration · plaque, clot and fluid exchange","Atherosclerosis is a chronic arterial-wall process involving retained lipoproteins, endothelial signalling, inflammatory cells, smooth-muscle transitions and extracellular matrix. Plaque rupture or erosion exposes thrombogenic surfaces and can trigger an occlusive clot; stable narrowing and acute thrombosis are related but distinct. Capillary filtration depends on hydrostatic and oncotic forces plus endothelial permeability, while lymph returns excess fluid and macromolecules. Oedema can therefore arise from several mechanistically different failures."],["Recent advances · plaques as cellular ecosystems","Integrated single-cell and spatial plaque atlases identify macrophage, T-cell, endothelial and smooth-muscle states within fibrous caps, lipid cores and adjacent vessel regions. They refine candidate mechanisms of instability but do not let one cell marker predict rupture by itself. Causal translation requires longitudinal imaging, perturbation and clinical outcomes. Lymphatic research similarly treats vessels as active immune and lipid-transport interfaces rather than passive drains."],["Worked example · oedema reasoning","Raised venous pressure increases capillary hydrostatic pressure and filtration; low plasma albumin reduces reabsorptive oncotic force; inflammation increases permeability; lymphatic obstruction limits return. All can produce swelling but predict different accompanying signs and protein content. A useful answer names the altered Starling or lymphatic term, the anatomical distribution and the compensations, instead of treating oedema as one diagnosis."]],
    p4l1:[["Advanced integration · cable properties and excitability","Membrane voltage reflects ion gradients, selective permeability and electrogenic pumps. Local current spreads farther when membrane resistance is high and internal resistance is low; myelin increases effective membrane resistance and lowers capacitance, enabling saltatory conduction. Threshold emerges from regenerative channel activation opposed by leak and inactivation. Axon diameter, temperature, nodal organisation and channel density therefore influence velocity. An action potential is all-or-none locally, but firing frequency and timing encode graded information."],["Recent advances · channel and myelin diversity","Patch clamp, optical voltage indicators and high-resolution connectomics increasingly relate channel expression and nodal architecture to circuit function. Patient variants and induced neurons reveal channelopathies, while glial studies show that myelin adapts to activity and metabolic need. Transcript abundance alone cannot specify electrical behaviour because channel localisation, modulation and membrane geometry matter. Modern neurophysiology integrates molecular identity with direct recordings and conduction measurements."],["Worked example · equilibrium potential","The Nernst equation predicts that increasing extracellular potassium makes EK less negative when intracellular potassium is held constant. Resting voltage consequently depolarises toward threshold, but sustained depolarisation can inactivate sodium channels and reduce excitability. This resolves the apparent paradox that elevated potassium may first excite and later weaken conduction. Numerical use requires temperature, ion valence and concentrations on the correct sides of the membrane."]],
    p4l2:[["Advanced integration · synapses as computations","A postsynaptic response depends on transmitter release probability, receptor type, driving force, dendritic location and concurrent conductances. Temporal and spatial summation determine whether the axon initial segment reaches threshold. Short-term facilitation or depression changes transmission over milliseconds to seconds; long-term plasticity changes efficacy through receptor trafficking, signalling and structural remodelling. Reflexes can be rapid without being simple, because interneurons, descending control and sensory context reshape their gain."],["Recent advances · multimodal brain measurement","Large cell and vascular atlases, dense electrophysiology, calcium imaging, EEG and MRI now describe brain activity at different spatial and temporal scales. EEG measures summed electrical fields; functional MRI usually tracks a haemodynamic correlate, not spikes directly. Agreement across modalities strengthens interpretation, but neurovascular coupling can change with disease or state. Contemporary analysis therefore aligns scale and causal claim instead of treating every coloured brain map as direct neural activation."],["Worked example · summation","Two excitatory postsynaptic potentials of 5 mV each may reach a 10 mV threshold if they overlap sufficiently, but not if membrane decay separates them. A simultaneous inhibitory conductance near the soma can shunt both without large hyperpolarisation. Predict firing from timing, location and conductance, not arithmetic amplitudes alone. This is why identical presynaptic spike counts can yield different outputs under different network states."]],
    p4l3:[["Advanced integration · motor-unit and cross-bridge control","Force is graded by motor-unit recruitment, firing rate, muscle length, shortening velocity and fibre metabolic state. Calcium exposes actin sites, but ATP binding is required to detach myosin and ATP hydrolysis re-cocks the head. Isometric contraction produces force without whole-muscle shortening; isotonic movement changes length against load. Fatigue can arise centrally, at the neuromuscular junction, through excitation-contraction coupling or from metabolic and ionic changes, so one metabolite cannot explain every decline."],["Recent advances · muscle cell atlases and disease models","A human skeletal-muscle atlas across adulthood has resolved fibre-associated nuclei, satellite cells, vascular cells and immune-stromal states that change with ageing. Organoids and induced neuromuscular systems allow controlled studies of motor-neuron and muscle disorders, although they do not reproduce full loading, innervation or circulation. The field now connects molecular cell states to force, regeneration and functional performance rather than using expression differences as endpoints alone."],["Worked example · force-frequency response","A single stimulus produces a twitch; a second stimulus before complete calcium removal increases force by temporal summation. Higher frequency can produce unfused and then fused tetanus. If force falls despite continued stimulation, test whether membrane activation, calcium release, cross-bridge capacity or energy supply failed. Recording both action potentials and tension separates electrical from contractile fatigue."]],
    p4l4:[["Advanced integration · coding from receptor to perception","Sensory systems encode stimulus modality through labelled pathways, intensity through firing and recruitment, and space through receptive fields and population maps. Rapidly adapting receptors emphasise change; slowly adapting receptors preserve steady information. In the retina, photoreceptors, horizontal, bipolar and amacrine cells create contrast-sensitive ganglion output. Colour depends on comparing cone responses, not on one wavelength detector. Perception then combines sensory evidence with attention, context and prior expectation."],["Recent advances · retinal and skin models","Retinal organoids, adaptive-optics imaging and single-cell atlases permit cell-specific study of degeneration and therapy; spatial skin maps resolve sensory, immune and repair niches. Organoids reproduce selected developmental and cellular features but lack complete vascularisation, mechanics and long-range central processing. A restored photoreceptor response therefore does not by itself demonstrate restored vision. Current research links cell rescue to circuit transmission and behaviour."],["Worked example · discrimination threshold","If a person detects a 2 g increment on a 20 g reference but needs 10 g on a 100 g reference, ΔI/I is 0.1 in both cases, consistent with Weber-like scaling over that range. The law is approximate and breaks near sensory limits. The calculation distinguishes relative sensitivity from an absolute threshold and can be applied to pressure, light or sound only within the tested modality and intensity range."]],
    p5l1:[["Advanced integration · comparative excretion and clearance","Nitrogen excretion reflects toxicity, water availability, energy cost and developmental ecology. Within vertebrate kidneys, filtration is intentionally broad and tubular transport produces selectivity. Clearance expresses the virtual plasma volume cleared of a substance per time; inulin approximates filtration when freely filtered and neither secreted nor reabsorbed, whereas para-aminohippurate can estimate renal plasma flow under limited conditions. Acid-base control couples bicarbonate recovery, proton secretion, ammoniagenesis and ventilation."],["Recent advances · the kidney cellular atlas","A multicentre human kidney atlas integrates healthy reference tissue with acute and chronic injury, mapping epithelial, immune, endothelial and stromal states. It reveals maladaptive repair programmes and neighbourhoods missed by average expression. Atlas associations still require temporal and functional evidence: a cell state found beside fibrosis may drive, restrain or simply accompany injury. The resource is most powerful when joined to transport physiology, pathology and clinical trajectory."],["Worked example · clearance","If urine concentration of a marker is 60 mg mL−1, urine flow is 1 mL min−1 and plasma concentration is 0.5 mg mL−1, clearance is U×V/P=120 mL min−1. This estimates GFR only if marker assumptions hold. If the substance is secreted, clearance can exceed GFR; if reabsorbed, it falls below GFR."]],
    p5l2:[["Advanced integration · segmental transport and concentration","The proximal tubule performs bulk iso-osmotic reabsorption. The thick ascending limb reabsorbs salt while remaining water-impermeable, creating a corticomedullary gradient and diluting tubular fluid. Descending limbs lose water; vasa recta exchange limits washout. Vasopressin inserts aquaporin-2 in collecting-duct principal cells and also supports inner-medullary urea recycling. Urine concentration therefore depends on loop architecture, flow, solute transport, medullary blood supply and hormonal water permeability."],["Recent advances · quantitative renal microenvironments","Spatial transcriptomics and multiplex imaging now map transport proteins and injury states along nephron segments and medullary zones. Microphysiological kidney chips test flow, shear and drug transport, but often model only selected cells and lack the full countercurrent geometry. Computational models integrate segmental fluxes and can expose impossible verbal explanations. Predictions remain conditional on transporter kinetics, nephron number and species-specific anatomy."],["Worked example · free-water reasoning","When urine osmolality is below plasma osmolality, the kidney is excreting water in excess of isotonic solute clearance; when urine is concentrated, free water is conserved. A urine flow of 2 mL min−1 at 150 mOsm kg−1 with plasma at 300 gives osmolar clearance of 1 mL min−1 and positive free-water clearance of 1 mL min−1."]],
    p5l3:[["Advanced integration · injury, chronic loss and replacement","Acute kidney injury is a rapid fall in function caused by haemodynamic, intrinsic or obstructive processes; chronic kidney disease combines persistent structural or functional abnormality with systemic consequences. Reduced filtration alters potassium, acid-base balance, volume, toxin handling, erythropoietin and mineral metabolism. Stones reflect supersaturation, nucleation, growth and retention. Dialysis uses diffusion and convection to replace selected clearance and fluid functions but cannot reproduce endocrine regulation or continuous nephron adaptation."],["Recent advances · precision nephrology","Kidney organoids, injury atlases, genetic diagnosis and machine-learning risk models aim to classify disease by mechanism rather than late serum markers alone. Biomarkers may detect tubular stress before creatinine rises, but clinical usefulness requires validation across populations and proof that acting on the result improves outcomes. Bioartificial devices remain experimental because durable vascular access, cell function, immune compatibility and scale are formidable. Precision claims should distinguish prediction from effective intervention."],["Worked example · dialysis dose","Kt/V relates dialyser clearance K, treatment time t and distribution volume V. Increasing K or time raises small-solute dose, while a larger V lowers the ratio if other terms stay fixed. The measure is useful but incomplete: volume control, middle molecules, nutrition, residual kidney function and patient outcomes also matter. A numerical target should not be mistaken for complete physiological replacement."]],
    p5l4:[["Advanced integration · reproductive endocrine dynamics","Pulsatile GnRH drives pituitary gonadotropins; pulse pattern, gonadal steroids, inhibins and life stage shape the response. Follicle selection increases oestradiol, sustained high oestradiol enables positive feedback and the LH surge, and the corpus luteum supplies progesterone after ovulation. Implantation requires synchrony between embryo and receptive endometrium. Pregnancy, parturition and lactation then redistribute endocrine control among ovary, placenta, uterus, pituitary and suckling-driven neural circuits."],["Recent advances · reproductive tissue atlases","Human endometrial atlases resolve epithelial, stromal, vascular and immune changes across the cycle, while spatial studies of ageing myometrium identify altered cell states relevant to labour and disease. These maps clarify heterogeneity but sampling time is critical: a phase difference can appear to be a disease difference. Organoid and assembloid models test hormone responses and implantation signals, yet cannot fully reproduce maternal circulation, mechanics or immune adaptation."],["Worked example · cycle reconstruction","A rise in follicular oestradiol followed by an LH surge predicts ovulation; subsequent progesterone and secretory endometrium indicate luteal activity. If progesterone falls without implantation, menstruation follows. During early pregnancy, embryonic hCG preserves the corpus luteum until placental steroid production is sufficient. Reconstructing the sequence is more informative than memorising isolated hormone peaks because each signal changes the next tissue response."]]

  const physiologyEvidenceSynthesis={
    p1l1:[["Evidence synthesis · from intake to fitness","A convincing nutritional explanation connects food composition to ingestion, absorption, metabolic allocation, performance and ultimately survival or reproduction. Pair cafeteria choice with measured assimilation and life-history outcomes. Control prior diet, sex, developmental stage and microbial status. A preference is not proof of benefit, and a short-term energy maximum may trade against toxin exposure or nutrient balance."]],
    p1l2:[["Evidence synthesis · establishing enteric causation","To show that an enteric circuit controls motility, combine anatomy with selective activation or inhibition, pressure or transit measurements and rescue. Correlation between neuron abundance and constipation is insufficient. Ex vivo preparations preserve local reflexes but remove central and endocrine inputs; in vivo tests restore the system while adding behavioural and systemic confounders. Convergent evidence defines the level of claim."]],
    p1l3:[["Evidence synthesis · measuring absorption","Transporter expression suggests capacity, whereas uptake flux demonstrates movement. Use luminal and blood-side concentrations, isotope-labelled substrate, membrane potential or inhibitor controls, and tissue integrity. Whole-animal appearance in blood additionally reflects gastric delivery, liver handling and tissue removal. Distinguish digestion failure from mucosal uptake failure by measuring the substrate form actually presented to the transporter."]],
    p1l4:[["Evidence synthesis · separating marker and mechanism","A biomarker may classify injury without causing it. Robust disease models use temporal order, dose-response, tissue localisation, experimental perturbation and independent replication. Multi-omic agreement can narrow hypotheses, but shared inflammation can make unrelated disorders look molecularly similar. Report whether evidence comes from patients, animals, organoids or association databases because each supports a different causal reach."]],
    p2l1:[["Evidence synthesis · matching scale to measurement","Spirometry measures bulk flow, plethysmography estimates volumes, diffusion tests gas-transfer capacity, imaging shows structure and microscopy resolves the barrier. No single method spans all scales. Interpret an observed limitation by asking whether the dominant resistance is airway, tissue, surface or perfusion, and use a complementary test that could falsify that localisation."]],
    p2l2:[["Evidence synthesis · oxygen delivery, not saturation alone","Tissue oxygen delivery equals cardiac output multiplied by arterial oxygen content. Studies that report saturation without haemoglobin and flow cannot fully assess delivery. Venous extraction, lactate and organ-specific perfusion add downstream evidence but are context dependent. Separate sensor validation from physiological interpretation, especially at low perfusion, motion, altitude and atypical haemoglobin states."]],
    p2l3:[["Evidence synthesis · disease endotypes","A mechanistic respiratory endotype should be reproducible, biologically coherent and predict a differential response or outcome. Clustering symptoms or expression profiles is only a discovery step. External cohorts, stable sampling procedures and prospective treatment tests are needed. Medication exposure and exacerbation state can create apparent groups, so longitudinal evidence is especially valuable."]],
    p2l4:[["Evidence synthesis · proving adaptation","Population differences at altitude or heat do not prove genetic adaptation. Establish environmental exposure, common-garden or migrant responses, genomic selection evidence and a phenotype-fitness link. Acclimatisation, developmental plasticity and population structure are alternatives. Spaceflight studies require pre-flight baselines and recovery sampling to separate transient response from persistent change."]],
    p3l1:[["Evidence synthesis · haemostasis in context","A factor concentration, clotting time and clinical bleeding phenotype are related but not interchangeable. Assays use artificial activators and plasma, whereas in vivo haemostasis depends on vessel wall, platelets, flow and fibrinolysis. Mechanistic conclusions are strongest when biochemical assays, cellular models and patient phenotypes converge and when anticoagulant exposure and inflammation are controlled."]],
    p3l2:[["Evidence synthesis · joining map and function","Spatial cardiac atlases identify candidate cell interactions; electrocardiography, optical mapping, force measurement and perfusion reveal what tissue does. Perturbing a ligand-receptor pair can test a proposed niche, but model maturity and species differences limit translation. Report whether a result concerns cell identity, electrical propagation, contraction or whole-organ output."]],
    p3l3:[["Evidence synthesis · causal pressure physiology","A pressure association can reflect altered cardiac output, resistance, volume, medication or measurement context. Repeated ambulatory measurements improve phenotype definition; interventions that selectively change a controller strengthen causation. Genetic instruments and longitudinal cohorts can complement experiments but depend on explicit assumptions. Always identify the time scale of regulation being tested."]],
    p3l4:[["Evidence synthesis · vulnerable plaque claims","Plaque size alone does not define rupture risk. Cap thickness, lipid core, inflammation, matrix turnover, haemorrhage and local mechanics contribute, while most histology is obtained after an event or surgery. Prospective imaging and outcomes are needed to validate a marker. For lymphatic claims, measure actual flow or tracer clearance rather than inferring function from vessel density."]],
    p4l1:[["Evidence synthesis · linking variant to excitability","A channel variant becomes mechanistically persuasive when segregation or population data, expression, biophysical recording and cellular or organismal phenotype agree. Overexpression can distort stoichiometry, and induced neurons may be developmentally immature. Rescue by the reference allele or a mechanism-matched drug strengthens inference, but off-target and background effects require controls."]],
    p4l2:[["Evidence synthesis · interpreting brain signals","Temporal precedence, localisation and behavioural correlation do not alone establish necessity. Lesion or inhibition tests necessity; activation tests sufficiency under defined conditions; recording describes association. Each has compensatory and off-target limitations. EEG and MRI signals should be interpreted through their generators and resolution, not converted directly into mental labels."]],
    p4l3:[["Evidence synthesis · from molecular state to force","Muscle expression differences should be joined to calcium handling, contractile force, fatigue resistance and regeneration. Fibre-type composition and physical activity are major confounders in human samples. Satellite-cell abundance is not equivalent to successful repair. Longitudinal loading or injury models help distinguish adaptive state changes from causes of weakness."]],
    p4l4:[["Evidence synthesis · demonstrating restored sensation","Cell survival or receptor currents are intermediate outcomes. Restoration of sensation requires transmission through downstream circuits and behaviour that depends on the relevant modality. Use sham procedures, blinded thresholds and tasks matched to the organism's sensory range. Improved performance must be separated from learning, cue use and motor recovery."]],
    p5l1:[["Evidence synthesis · kidney reference standards","Serum creatinine is influenced by muscle production as well as filtration; estimated GFR depends on validated population equations. Measured clearance has collection and marker assumptions. A strong renal study combines appropriate reference measurement, repeated sampling and segment-specific injury evidence. Cross-species comparisons must account for nephron architecture and nitrogen strategy."]],
    p5l2:[["Evidence synthesis · testing countercurrent models","The countercurrent mechanism is supported by segment permeability, transporter localisation, micropuncture or imaging gradients and responses to loop diuretics or vasopressin. Static tissue osmolality alone cannot reveal causal flux. Models should conserve mass and reproduce urine flow and composition under water loading and deprivation, not merely one endpoint."]],
    p5l3:[["Evidence synthesis · useful biomarkers and devices","Diagnostic discrimination, earlier detection and outcome improvement are separate claims. A biomarker can predict risk yet fail to guide beneficial treatment. Device studies should report clearance spectrum, haemodynamic tolerance, access complications, residual function and patient-centred outcomes. Laboratory kidney constructs require comparison with mature human transport and endocrine functions."]],
    p5l4:[["Evidence synthesis · time as a biological variable","Cycle day assigned from a calendar can misclassify tissue state. Combine hormone measurements, histology and ovulation evidence, and record contraception, parity and age. Implantation models test selected interactions, whereas pregnancy outcomes reflect embryo, endometrium, immunity and systemic health. Reproductive evidence is strongest when phase is measured rather than assumed."]]

  const physiologyTransferExtensions={
    p1l1:"Present the foods in nutrient coordinates and distinguish gross intake, assimilated intake and retained energy. Include a no-choice treatment to reveal compromise rules and repeat the test after altering energetic state. A strong interpretation predicts both the direction of choice and its physiological consequence, considers toxin dilution and gut capacity, and avoids treating short-term preference as an adaptation unless performance or reproductive evidence supports it.",
    p1l2:"Your explanation should identify the sensory limb, ascending excitatory pathway, descending inhibitory pathway, effector muscle and expected pressure sequence. Record transit as well as contraction because force without aboral movement is not successful propulsion. Include a sham manipulation and test whether restoring nitrergic signalling rescues coordination. State whether the evidence supports a local enteric mechanism, central modulation or both.",
    p1l3:"For each condition, name the missing enzyme, detergent or transporter; predict the chemical form remaining in the lumen; and state whether absorbed products normally enter portal blood or lymph. Add one discriminating test such as faecal fat, pancreatic enzyme output, bile-flow imaging or an oral-versus-intravenous tolerance comparison. Explain how inflammation or rapid transit could produce a similar final symptom through a different route.",
    p1l4:"Calculate or interpret a stool osmotic gap only after checking units and sample quality. Secretory loss often continues during fasting, osmotic loss falls when the offending solute is removed, and inflammatory injury adds blood, protein or immune markers; mixed mechanisms are common. Link each proposed measurement to a falsifiable prediction. End by identifying red-flag findings that require urgent clinical evaluation rather than experimental dietary manipulation.",
    p2l1:"Use pressure-volume and flow-pressure relationships rather than descriptive labels alone. Fibrosis lowers compliance, bronchoconstriction raises resistance, and emphysematous recoil loss can ease inflation yet impair expiration through dynamic airway collapse. Predict the pressure required for a tidal volume, the shape of expiratory flow and the likely spirometric or volume result. Then identify how respiratory-muscle fatigue could imitate or amplify each pattern.",
    p2l2:"Construct a table with inspired oxygen, PaO2, saturation, haemoglobin, arterial oxygen content and cardiac output. Anaemia primarily reduces capacity, carbon monoxide reduces available binding and alters unloading, while altitude lowers inspired and alveolar oxygen tension. Calculate content for at least one case. Explain why pulse oximetry, arterial gases and tissue lactate answer different questions and why a normal value in one column cannot validate the others.",
    p2l3:"First calculate FEV1/FVC and compare it with an age-appropriate lower limit, then use total lung capacity to confirm or reject restriction. A low diffusion capacity can arise from membrane loss, thickening or reduced capillary blood volume; arterial gases add the net exchange outcome. Include test quality, bronchodilator response and exercise context. Your alternative should be a mechanism capable of producing the observed pattern, not merely another disease name.",
    p2l4:"For immediate response, measure ventilation, gases and autonomic variables within hours; for developmental plasticity, compare people raised at different altitudes while controlling ancestry; for adaptation, combine common-environment physiology with population-genetic and fitness evidence. Predict reversibility after descent for each mechanism. Explicitly separate a selected DNA variant from a transient expression response, and identify population structure as a competing explanation for allele-frequency differences.",
    p3l1:"Use the tests as pathway screens rather than literal simulations of in-vivo clotting. A mixing study that corrects suggests a factor deficiency; failure to correct suggests an inhibitor, although timing and anticoagulants complicate interpretation. Add platelet function and clinical context when mucosal bleeding occurs with normal times. Include liver function, consumption and medication history when both times are prolonged, and explain why thrombosis can coexist with apparently prolonged laboratory clotting.",
    p3l2:"Anchor every loop at end-diastolic and end-systolic volume and show valve events. Increased preload widens stroke volume through length-dependent activation; increased afterload leaves more end-systolic volume; increased contractility steepens the end-systolic relation and empties the ventricle more completely. State what is held constant, because reflex heart-rate or vascular changes can alter the observed loop. Relate loop area to external work without equating it with total myocardial oxygen cost.",
    p3l3:"Trace reduced carotid-sinus and aortic-arch stretch to lower afferent firing, medullary integration, increased sympathetic and reduced vagal output, then predict tachycardia, stronger contraction and arteriolar and venous constriction. With autonomic failure, pressure recovery is delayed and symptoms may follow cerebral hypoperfusion. Separate this rapid response from slower renal sodium retention. Specify how beat-to-beat pressure and heart-rate recordings would test the predicted timing.",
    p3l4:"Apply the modern Starling framework cautiously: endothelial glycocalyx and lymph flow influence steady-state exchange, so simple arterial-end filtration and venous-end reabsorption is incomplete. Venous obstruction raises hydrostatic pressure, hypoalbuminaemia lowers plasma oncotic force, inflammation raises permeability, and lymphatic failure prevents protein return. Add one tracer, protein measurement or anatomical observation that differentiates them, and predict whether elevating the limb would substantially change the swelling.",
    p4l1:"For demyelination, expect increased current leak, reduced safety factor and slowed or blocked saltatory conduction; sodium-channel block reduces regenerative inward current; hyperkalaemia shifts resting voltage and can cause depolarisation block. Compare threshold and amplitude at proximal and distal recording sites. Include temperature and axon diameter as controls. A complete answer identifies which manipulation changes passive spread, which changes active regeneration and why both can culminate in conduction failure.",
    p4l2:"Necessity can be tested by selective inhibition during the modified reflex, while sufficiency can be tested by activating the pathway in the absence of the usual instructive signal. Record presynaptic activity, postsynaptic response and behaviour on aligned trials. Use anatomical, temporal and cell-type controls, and verify that the manipulation does not simply impair movement or sensation. Rescue or an orthogonal perturbation strengthens the conclusion beyond one tool.",
    p4l3:"If nerve spikes fail, investigate central or axonal activation; if nerve spikes persist but muscle spikes fail, localise toward neuromuscular transmission; if muscle spikes persist but calcium falls, test excitation-contraction coupling; if calcium remains normal while tension falls, examine cross-bridge and metabolic capacity. Normalise force to muscle size and control temperature and length. Recovery kinetics can distinguish transient metabolite accumulation from structural damage.",
    p4l4:"Estimate a psychometric function rather than declaring threshold from one response. Interleave reference and comparison stimuli, include catch trials, balance presentation side, and calculate the stimulus producing a predefined correct-response probability. Repeat sessions to assess reliability. For colour, control luminance so brightness cannot substitute for chromatic discrimination; for touch, control contact area and rate. Report sensory threshold separately from confidence, reaction time and motor accuracy.",
    p5l1:"Use C=UV/P with simultaneous plasma sampling and steady conditions. A filtered-only marker approximates GFR, net reabsorption makes clearance lower, and secretion makes it higher until transport saturates. Incomplete collection usually lowers measured excretion and therefore calculated clearance, but changing plasma level or flow can add bias. Compare the marker with creatinine and explain how muscle production, drug interference or extrarenal elimination alters interpretation.",
    p5l2:"A loop diuretic weakens gradient generation, absent vasopressin prevents the collecting duct from using an existing gradient, and water loading suppresses vasopressin physiologically. For each case, predict sodium excretion, urine flow, urine osmolality and medullary gradient. Add a desmopressin response to distinguish hormone deficiency from renal insensitivity. Explain why vasa-recta washout or reduced urea recycling can also impair concentration despite intact aquaporins.",
    p5l3:"Build the comparison by physiological function, not treatment name. Dialysis can clear small solutes and remove fluid intermittently or continuously depending on modality, but it incompletely replaces endocrine functions, metabolic signalling and adaptive segmental transport. Include vascular or peritoneal access, haemodynamic stability, infection risk, residual kidney function and patient schedule. Explain why identical urea-based dose indices can coexist with different volume control, symptom burden and outcomes.",
    p5l4:"Label hypothalamus, pituitary, follicle, corpus luteum, endometrium and early trophoblast. Most ovarian-steroid feedback is negative, sustained preovulatory oestradiol permits positive feedback, and embryonic hCG rescues luteal progesterone after implantation. Add inhibin effects on FSH and distinguish prolactin-driven milk synthesis from oxytocin-driven ejection. Predict how anovulation, luteal failure or absent implantation would alter both hormones and endometrial state."

  const behaviourDeepening={
    b1l1:[["Advanced integration · levels, causes and predictions","Tinbergen's four questions become analytically powerful when each produces a different prediction. A mechanistic hypothesis may predict an immediate change after sensory blockade; an ontogenetic hypothesis predicts dependence on experience; a functional hypothesis predicts consequences for survival or reproduction; a phylogenetic hypothesis predicts correspondence with lineage history. These explanations can all be true simultaneously. Experimental design should identify the causal level being tested and avoid using present-day utility as evidence for evolutionary origin."],["Recent advances · computational ethology","High-speed video, pose estimation, acoustic arrays, accelerometers and GPS now quantify behaviour at temporal and spatial scales unavailable to unaided observation. Unsupervised models can identify recurrent movement motifs, while supervised classifiers recognise predefined acts. Algorithms inherit sampling and labelling biases: a cluster is not automatically a meaningful behavioural category, and high test accuracy may fail in new habitats or individuals. Contemporary ethology therefore combines automated measurement with transparent definitions and human validation."],["Worked example · choosing a sampling rule","A troop shows grooming states lasting minutes and rare aggressive events lasting seconds. Ten-minute scan sampling may estimate the proportion of animals grooming but miss most aggression. Focal continuous recording preserves sequence and duration for one subject, while all-occurrence sampling captures attacks across the group. A defensible study can combine methods, report observation effort per individual and calculate inter-observer agreement from independently coded video."]],
    b1l2:[["Advanced integration · reaction norms and indirect effects","Behavioural phenotype can be expressed as genotype, environment, genotype-by-environment interaction and residual variation. A reaction norm describes one genotype across environments; crossing norms show that genotypes change rank. Genes may influence sensory thresholds, hormone production, learning rate or social responses rather than encode a fixed act. Social partners also create indirect genetic effects because one individual's genotype alters another's environment. Heritability remains specific to the population and conditions in which variance was measured."],["Recent advances · from variants to behavioural mechanisms","Genome-wide association, transcriptomics, neural recording and CRISPR perturbation increasingly link behavioural variation to molecular and circuit mechanisms. Polygenic scores or expression signatures are predictions, not explanations, and population structure can generate false associations. Wild studies now combine pedigrees, genomic relatedness and repeated behavioural measures to estimate plasticity and selection. Strong inference connects variant to cellular effect, organismal behaviour and ecological consequence while testing environmental and developmental alternatives."],["Worked example · a cross-fostering design","Eggs from bold and shy parental lines are exchanged between nests before parental care begins. Offspring are reared in common conditions and tested repeatedly in a novel arena with observers blind to origin. A biological-parent effect supports inherited or pre-transfer influences; a foster-parent effect supports rearing environment; an interaction suggests differential sensitivity. Maternal provisioning before transfer remains a limitation and should be measured or addressed with additional breeding designs."]],
    b1l3:[["Advanced integration · behaviour as a measurement system","An ethogram is a measurement model: categories must be mutually interpretable, observable and matched to the question. States have duration; events are brief occurrences. One-zero or instantaneous sampling estimates neither event count nor exact duration without assumptions. Reliability should be assessed with chance-corrected agreement or appropriate continuous measures, not percentage agreement alone. Repeated measures also require individual identity in analysis because observations from the same animal are not independent replicates."],["Recent advances · biologging with welfare controls","Modern tags combine GPS, depth, sound, heart rate and tri-axial acceleration to reconstruct activity and environmental exposure. Yet capture and tagging can alter movement; a 2024 multi-species analysis found post-tagging recovery patterns that varied with human exposure. Device mass, attachment, drag, battery life and data loss must therefore enter study design. Remote methods reduce observer intrusion only after their own behavioural effects have been quantified."],["Worked example · estimating reliability","Two observers independently classify 100 intervals as feeding or not feeding. They agree on 90, but feeding is extremely common, so chance agreement may already be high. Cohen's kappa compares observed with expected chance agreement and may be modest despite 90% raw agreement. Examine the confusion matrix to locate systematic disagreement, revise definitions, retrain observers and repeat reliability testing before analysing treatment effects."]],
    b2l1:[["Advanced integration · selection, conflict and strategy","Sexual selection emerges from variance in reproductive success, not simply conspicuous ornaments. Operational sex ratio, potential reproductive rate, parental investment and resource defensibility shape competition and choice. Bateman gradients quantify how reproductive success changes with mating success but depend on accurate parentage data. Alternative tactics may be genetically fixed, condition dependent or frequency dependent. Sexual conflict occurs when one trait increases the actor's fitness while imposing a cost on mates, producing counter-adaptation rather than progress toward harmony."],["Recent advances · social genomics and parentage","Genomic parentage assignment, automated tracking and hormone or transcript measurements now connect courtship behaviour to actual reproductive success. These tools often reveal divergence between social pairing and genetic parentage. Network position can influence mating opportunity, but correlation may reflect age, quality or spatial overlap. Experimental manipulation, longitudinal data and explicit null models are needed before assigning causal advantage to a signal or tactic."],["Worked example · operational sex ratio","A breeding aggregation contains 30 sexually active males and 10 receptive females, giving a male-biased operational ratio of 3:1 even if the adult population sex ratio is equal. The pattern predicts stronger male competition only when encounter rate and mating access are actually constrained. If most males provide prolonged care and temporarily leave the mating pool, the operational ratio can reverse. Always define the time window and reproductive state used in the count."]],
    b2l2:[["Advanced integration · inclusive fitness and social scale","Hamilton's rule rB>C evaluates whether an actor's direct cost is outweighed by relatedness-weighted benefit to a recipient under specified conditions. Relatedness is a regression measure relative to the population, not merely a pedigree label. Reciprocity relies on repeated interaction and contingent response; mutualism provides immediate net benefit. Multilevel selection partitions change within and between groups and can be mathematically compatible with inclusive-fitness accounting. The empirical task is to measure who pays, who benefits and how assortment occurs."],["Recent advances · collective behaviour in the wild","Drone video, proximity tags and automated identity tracking now resolve leadership, information flow and multilevel social structure. Fine-scale studies of horses and wild guineafowl show how local interaction rules and social relationships shape shared movement without a central commander. Such patterns are not proof of group-level cognition: researchers must compare alternative models based on attraction, alignment, dominance, spatial position and individual information."],["Worked example · Hamilton's rule","An alarm call reduces the caller's expected offspring by 0.2 but increases survival equivalents of three full siblings by 0.2 each. With r=0.5, total indirect benefit is 3×0.5×0.2=0.3, which exceeds the cost. The inequality predicts potential spread only if estimates refer to marginal causal effects, the behaviour is heritable and recipients would otherwise lack the benefit. Double-counting shared environmental effects invalidates the calculation."]],
    b2l3:[["Advanced integration · signal design and receiver psychology","Communication is a coevolved interaction among signaller, transmission channel and receiver. Signal-detection theory separates sensitivity from decision threshold when receivers balance missed detections against false alarms. Environmental attenuation, masking and sensory tuning shape signal form; receivers may exploit cues outside the intended channel. Honesty can arise from production cost, physical constraint, index linkage or aligned interests, whereas manipulation and resistance can coevolve. Parental signals and offspring begging are similarly negotiated under related but non-identical interests."],["Recent advances · bioacoustics at scale","Passive acoustic networks and machine learning now detect vocal activity across landscapes and track community recovery. Zero-shot and transfer-learning systems can reduce annotation demands, but performance often declines for rare species, unfamiliar habitats and overlapping calls. Classifier output establishes acoustic pattern, not semantic meaning. Playback, contextual observation and receiver response are required to infer information content or communicative function."],["Worked example · separating cue from signal","A predator unintentionally rustles vegetation and prey flee: the sound is a cue to prey. A bird alarm call alters group escape and has been shaped through signalling interactions: it is a signal. To test referential content, play calls without the predator, control amplitude and caller identity, and compare receiver responses across contexts. A response to playback demonstrates influence, while meaning requires ruling out a general arousal explanation."]],
    b3l1:[["Advanced integration · maps, compasses and movement decisions","Orientation maintains a bearing; navigation estimates position and directs movement toward a goal. Path integration updates a home vector from self-motion, whereas map-based navigation uses external spatial information. Animals can combine landmarks, odour, celestial rotation, polarised light and geomagnetic information, recalibrating one cue against another. Movement paths also reflect energetic state, wind, currents, predation and stopover decisions. A straight track is therefore an outcome, not evidence for one sensory mechanism."],["Recent advances · tracking and sensory experiments","High-resolution biologging, drones and long-term movement archives join trajectories to physiology and environmental layers. A 2025 study provided neural and behavioural evidence that Bogong moths use stellar orientation together with geomagnetic information during nocturnal migration. At the same time, re-analyses of magnetic-displacement studies stress sensitivity and geographic ambiguity. Modern navigation research gains strength from controlled cue rotation, sensory recording and real-world release tests."],["Worked example · path integration error","An ant walks 3 m east and 4 m north. Its ideal home vector is 5 m toward the southwest, from the 3-4-5 triangle. If the return direction is systematically rotated when a polarised-light pattern is rotated but distance remains accurate, the manipulation implicates compass calibration rather than odometric estimation. Random errors increasing with path length instead suggest cumulative integration noise."]],
    b3l2:[["Advanced integration · prediction-error learning","Associative learning depends on informativeness, timing and surprise rather than simple co-occurrence. Prediction-error models explain blocking: a new cue gains little strength when an established cue already predicts the outcome. Extinction usually adds context-dependent inhibitory learning rather than erasing the original association, allowing renewal or spontaneous recovery. Cognitive maps and model-based choice represent relational or outcome structure, while model-free habits cache action values. Experiments should compare these mechanisms with matched sensory, motivational and motor demands."],["Recent advances · computationally explicit cognition","Reinforcement-learning models, neural recordings and compact recurrent networks are now used to infer the strategies animals employ across trials. A 2025 study trained tiny recurrent networks to expose candidate decision algorithms rather than merely maximise prediction. Model fit alone does not prove the animal uses that algorithm; competing models, parameter recovery, novel transfer tests and neural or perturbational evidence are needed. Computational precision should narrow claims, not decorate them."],["Worked example · blocking","Group 1 first learns tone→food, then receives tone+light→food. Group 2 receives the compound without prior tone training. If light alone evokes less responding in Group 1, prior prediction by the tone blocked learning about light. Include unpaired and salience controls because weak light perception or overshadowing can mimic the effect. The result shows that contingency and prediction error matter beyond temporal pairing."]],
    b3l3:[["Advanced integration · dynamic foraging and allostasis","Marginal-value theory predicts departure when instantaneous patch gain falls to the habitat-wide average including travel time. State-dependent models add reserves, future opportunities and mortality; nutritional geometry adds macronutrient balance. Competition changes resource value through depletion or direct interference. Stress responses mobilise energy and alter vigilance, immunity and reproduction; short-term allostasis can be adaptive, whereas chronic load has cumulative costs. A glucocorticoid value alone cannot distinguish beneficial mobilisation from poor welfare."],["Recent advances · hidden state from movement","Accelerometers and GPS can reveal subtle changes before visible illness. A 2024 biologging study reported reduced local movement associated with subclinical infection, illustrating how behavioural time series can act as early phenotypes. Yet altered movement may reflect temperature, reproduction, habitat or device effects. Health inference requires baselines, diagnostic confirmation and models that account for environmental opportunity."],["Worked example · patch departure","Two patches begin with equal food. Travel to patch A takes 2 minutes and to B takes 8 minutes. As within-patch gain declines, the longer travel time to B lowers the habitat average achievable by switching and predicts longer residence once B is entered. Plot cumulative gain against total travel-plus-foraging time; the optimal tangent identifies departure. Risk or nutrient imbalance can rationally shift the observed point away from the energy-only prediction."]],
    b4l1:[["Advanced integration · bounded decisions and memory systems","Sequential-sampling models propose that noisy evidence accumulates toward a threshold. Higher thresholds improve accuracy but delay action; urgency, predation and energetic state change the optimal boundary. Working memory maintains immediately relevant information, while reference, episodic-like, spatial and procedural memories support different tasks. Retrieval can update a memory through reconsolidation. An innate predisposition may define what is attended to, while learning calibrates its expression; instinct and cognition are therefore not mutually exclusive categories."],["Recent advances · discovering strategies rather than ranking intelligence","High-density trial data and interpretable computational models identify whether animals use reinforcement history, latent state, uncertainty or prospective information. Cross-species comparison is moving away from a single intelligence ladder toward ecological problems and process-level mechanisms. Large datasets improve power but do not fix task unfairness: sensory access, motivation, rearing and motor requirements must be measured. Transfer to novel conditions remains stronger evidence of flexible representation than extensive retraining on one pattern."],["Worked example · speed-accuracy trade-off","A predator-discrimination task offers a safe option after weak evidence and an escape option after strong evidence. Raising the decision threshold decreases false alarms but increases response time and potentially missed attacks. Manipulate urgency independently of stimulus clarity and fit both choice and latency distributions. A shift in threshold differs from improved sensory sensitivity, which separates signal and noise distributions rather than merely changing the criterion."]],
    b4l2:[["Advanced integration · colony-level computation","Honeybee task allocation is plastic: age biases progression from nursing to foraging, but colony demography, nutrition, juvenile hormone and social signals can accelerate or reverse it. In waggle dances, body angle relative to gravity maps solar azimuth and waggle duration correlates with distance; odour and landscape guide recruits near the advertised site. Repeated dances provide positive feedback, stop signals provide cross-inhibition and quorum responses convert distributed evidence into colony action. No bee possesses the entire decision state."],["Recent advances · automated bee behaviour","Markerless or tagged tracking now reconstructs individual trajectories inside hives, and 2024 analyses used waggle-derived distances to characterise foraging landscapes. Social learning research also shows that young bees improve dance performance after observing experienced dancers, challenging an entirely pre-programmed interpretation. Automation must still validate identity swaps, occlusion and dance decoding against expert annotation and field outcomes."],["Worked example · decoding a dance","A dancer performs a waggle run 30° left of vertical while the sun is south of the hive. Recruits should fly approximately 30° east of the opposite solar bearing after converting the gravity reference to the current solar compass; exact geographic direction must be drawn for the specified sun azimuth. Longer waggle duration predicts greater distance. Account for solar movement, dialect calibration and odour before claiming exact coordinates."]],
    b4l3:[["Advanced integration · operationalising representation and affect","Representational evidence strengthens when information guides behaviour after the referent is absent, transfers to new contexts or combines systematically with other information. Metacognition-like behaviour can be tested through uncertainty responses, information seeking or confidence-sensitive wagering, but learned avoidance of difficult stimuli is an alternative. Affective inference combines preference, motivational trade-offs, judgement bias, physiology and analgesic response. Consciousness is multidimensional, so no mirror test or neuron count supplies a universal verdict."],["Recent advances · scalable cognition with ethical consequences","Markerless three-dimensional tracking, automated home-cage tasks and shared datasets allow larger samples and less intrusive longitudinal tests. Machine classifiers of vocal emotion remain candidate tools whose labels depend on validated behavioural and physiological states. Contemporary welfare science increasingly separates sentience, pain, positive affect and agency rather than using one broad claim. Ethical precaution can be reasonable under uncertainty, but scientific reports must state which capacity was actually tested."],["Worked example · judgement bias","Animals are trained that one tone predicts reward and another predicts a mild negative outcome. After a housing manipulation, ambiguous intermediate tones test optimism-like or pessimism-like expectation. Faster approach can indicate positive judgement bias only if hearing, hunger, locomotion and general arousal are controlled. Repeat probes sparingly to prevent ambiguous tones from acquiring their own learned value, and combine behaviour with independent welfare measures."]],
    b5l1:[["Advanced integration · oscillator dynamics","Circadian period is measured under constant conditions; phase identifies timing relative to a reference, and amplitude quantifies rhythm strength. Entrainment requires stable phase alignment when zeitgeber period differs from free-running period. A phase-response curve maps advances, delays and insensitive phases after a stimulus. Cellular transcription-translation loops are coupled to phosphorylation, degradation, metabolism and intercellular signals. In the mammalian suprachiasmatic nucleus, coupling makes a population of noisy cellular clocks more precise than isolated oscillators."],["Recent advances · network photoentrainment","Optogenetic and circuit studies increasingly test how retinal input resets populations of clock neurons. A 2025 study supported a dynamic network model in which functional groups integrate light signals during discrete photoentrainment rather than a single labelled-line pathway. Other work links regulatory evolution to differences in circadian plasticity between Drosophila species. These findings connect molecular loops, network organisation and ecological light regimes while retaining the need for free-running behavioural validation."],["Worked example · entrainment arithmetic","An animal has a free-running period of 24.4 hours but entrains to a 24-hour light-dark cycle. Its clock must on average advance about 0.4 hours per cycle to maintain a stable phase. Whether morning or evening light supplies that correction depends on the phase-response curve. If the required daily shift exceeds the range of entrainment, stable phase locking fails and the activity rhythm drifts."]],
    b5l2:[["Advanced integration · clocks across tissues and seasons","The suprachiasmatic nucleus coordinates mammalian activity and endocrine timing through neural, hormonal, temperature and behavioural signals, while peripheral clocks retain autonomous oscillation. Feeding can strongly reset liver and gut without equally shifting the central light-entrained clock, producing internal misalignment. Photoperiodic systems measure night duration or circadian coincidence to time reproduction, migration, moult and diapause. Melatonin conveys darkness duration, but the downstream response depends on species, reproductive strategy and seasonal history."],["Recent advances · plasticity across environments","Comparative genomics and behavioural experiments show that circadian plasticity evolves through regulatory change rather than clock loss alone. Long-term tracking also reveals phenological shifts that may mismatch food or temperature as climate changes. Laboratory square-wave lighting simplifies natural twilight, moonlight and spectral variation, so field validation is essential. Current chronobiology increasingly measures multiple zeitgebers—light, food, temperature and social timing—rather than treating clock time as biological phase."],["Worked example · melatonin duration","Under an 8-hour light and 16-hour dark cycle, nocturnal melatonin secretion is generally longer than under 16 hours light and 8 hours dark. A short-day breeder and a long-day breeder can translate the same duration in opposite reproductive directions through downstream circuitry. A light pulse during the night may shorten or split the signal depending on phase. Thus melatonin encodes darkness duration; it does not carry one universal reproductive instruction."]],
    b5l3:[["Advanced integration · coupled rhythms and temporal diagnosis","Ultradian oscillations include GnRH pulses, feeding bouts and sleep stages; infradian rhythms include ovarian and seasonal cycles. Coupling can create harmonics, beats or phase relationships, so a repeated pattern need not arise from one oscillator. Cosinor models estimate mesor, amplitude and acrophase for approximately sinusoidal data, while actograms and spectral methods handle other structures. Ageing can weaken amplitude and synchrony, but reduced activity or irregular schedules can also flatten observed rhythms."],["Recent advances · personalised biological time","Wearables, repeated molecular sampling and computational phase markers aim to estimate internal time from light, activity, temperature or transcript profiles. Chronotherapy trials show that plausible timing effects must be tested for the specific drug, dose, disease and outcome; not every schedule improves benefit. Current research distinguishes rhythmic pharmacokinetics from rhythmic target sensitivity and increasingly reports adherence and sleep timing. Population clock time remains an imperfect proxy for individual circadian phase."],["Worked example · interpreting a cosinor","A fitted rhythm has mesor 100 units, amplitude 20 and acrophase 14:00. The model predicts a peak near 120 at 14:00 and a trough near 80 roughly 12 hours later. If sampling occurs only at 08:00 and 20:00, phase and amplitude may be poorly identified. Add repeated evenly distributed observations across cycles, inspect residuals and compare rhythmic with non-rhythmic models before claiming endogenous timing."]]
