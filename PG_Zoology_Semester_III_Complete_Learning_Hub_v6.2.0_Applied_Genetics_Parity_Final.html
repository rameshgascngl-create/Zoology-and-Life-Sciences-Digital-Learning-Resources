  const behaviourEvidenceSynthesis={
    b1l1:[["Evidence synthesis · causal ladders","Description establishes what occurred; association links variables; manipulation tests a causal contribution; comparative and fitness evidence address evolutionary function. A complete study need not answer all four of Tinbergen's questions, but its conclusion must remain at the level actually tested. Replication across individuals, contexts and populations determines generality. Automated measurement increases sample volume without upgrading an observational design into an experiment."]],
    b1l2:[["Evidence synthesis · separating inheritance and environment","Pedigrees and genomic relatedness estimate variance, cross-fostering changes rearing association, and common-garden designs reduce environmental heterogeneity. None alone removes prenatal effects, assortative mating or genotype-dependent environment choice. Repeated measures estimate individual plasticity, while reciprocal transplants test reaction norms in ecologically relevant settings. Report uncertainty in heritability and avoid extrapolating it to new populations."]],
    b1l3:[["Evidence synthesis · observations are not independent by default","The animal, not every video frame, is usually the biological replicate. Pseudoreplication inflates certainty when repeated intervals are analysed as unrelated samples. Mixed models, balanced observation schedules and blinded coding help, but cannot repair an ethogram that changes during treatment scoring. Archive definitions, calibration clips and exclusions so another observer can reproduce the measurement process."]],
    b2l1:[["Evidence synthesis · demonstrating sexual selection","Ornament-mating association is insufficient if age or territory quality affects both. Measure mating success, genetic parentage and lifetime reproductive output; manipulate the candidate trait where ethical and test receiver response. Phylogenetic comparisons address repeated evolutionary association but require shared ancestry and ecological covariates. Distinguish selection measured within one season from evolutionary response across generations."]],
    b2l2:[["Evidence synthesis · identifying cooperation","A behaviour that benefits another may be mutualistic, reciprocal, kin-selected, coerced or a by-product. Estimate the actor's counterfactual fitness without the act and the recipient's marginal benefit. Manipulate relatedness, partner history or group structure where possible. Group-level performance does not prove group selection unless within- and between-group changes are explicitly partitioned."]],
    b2l3:[["Evidence synthesis · from acoustic pattern to meaning","A classifier can detect calls; contextual correlation suggests information; controlled playback tests receiver response; referential interpretation additionally excludes arousal, identity and urgency alternatives. Use calls from multiple signallers as replicates and avoid treating multiple playbacks of one recording as independent. Receiver sensory range and habitat transmission should shape stimulus construction."]],
    b3l1:[["Evidence synthesis · proving a navigation mechanism","Displacement shows return ability, cue rotation tests directional dependence, sensory disruption tests necessity and neural recording links candidate receptors. Each manipulation can add stress or conflict among cues. A successful return does not reveal whether the animal used a map, compass, memorised route or social following. Convergent tests across unfamiliar locations provide stronger localisation evidence."]],
    b3l2:[["Evidence synthesis · model comparison","Learning models should be fitted to trial-level choices and tested on held-out or transfer conditions. Parameter identifiability must be checked because different mechanisms can produce similar learning curves. Neural correlation supports biological plausibility but does not select one algorithm without perturbation. Report whether the model explains acquisition, extinction, transfer and individual variation rather than only average accuracy."]],
    b3l3:[["Evidence synthesis · stress and welfare","Glucocorticoids, heart rate, movement and immune markers are context-sensitive, and no single direction always means poor welfare. Combine health, injury, preference, abnormal behaviour, cognitive bias and opportunity for valued activity. Establish each animal's baseline and environmental opportunity before interpreting reduced movement. Acute adaptive responses and chronic allostatic load require different sampling time scales."]],
    b4l1:[["Evidence synthesis · fair cognitive comparison","Species differ in vision, smell, motor anatomy, motivation and prior experience. A task can underestimate capacity when its response format is unnatural and overestimate it through inadvertent cues. Use perceptual controls, preregistered criteria, novel transfer and sufficient individuals. Convergent success across different task structures supports a process more strongly than one spectacular subject."]],
    b4l2:[["Evidence synthesis · colony and individual levels","Colony success emerges from individual rules, but colony-level labels do not identify those rules. Track individuals, manipulate recruitment or inhibition and measure both resource information and collective outcome. Dance angle and duration must be calibrated against actual flight. Odour, experienced foragers and landscape familiarity are alternative routes recruits may use after leaving the hive."]],
    b4l3:[["Evidence synthesis · graded claims under uncertainty","Preference supports value, motivational trade-off supports importance, analgesic response supports pain-related processing and judgement bias supports affective expectation. None alone proves a human-like emotion. Metacognitive claims require controls for stimulus difficulty and learned avoidance. State the tested capacity precisely, use convergent methods and separate ethical precaution from empirical certainty."]],
    b5l1:[["Evidence synthesis · establishing an endogenous clock","A rhythm observed in light-dark conditions may be driven directly by the environment. Demonstrate persistence under constant conditions, estimate period across multiple cycles, reset phase predictably and test temperature compensation. Constant conditions can themselves alter health or behaviour, so controls and limited exposure matter. Molecular oscillation and behavioural rhythm should be linked rather than assumed equivalent."]],
    b5l2:[["Evidence synthesis · central versus peripheral timing","A tissue rhythm can reflect its own oscillator, systemic driving or rhythmic behaviour. Ex vivo persistence supports autonomy; selective clock disruption and timed feeding test causal inputs; phase relationships show coordination. Sampling one time point cannot distinguish phase shift from expression change. Photoperiodic studies must record prior light history, spectral composition and twilight conditions."]],
    b5l3:[["Evidence synthesis · chronotherapy standards","A time-of-day association can arise from patient selection, meal timing, staffing or disease phase. Randomised schedules, adequate adherence, prespecified outcomes and internal-phase measurement strengthen inference. Demonstrating rhythmic drug concentration is not the same as improved clinical outcome. Negative trials are essential evidence against broad claims that every treatment has one universally optimal clock time."]]
  };
  const behaviourTransferTasks={
    b1l1:[["Transfer task · build four hypotheses","Choose bird song, parental care or predator avoidance and write one mechanistic, ontogenetic, functional and phylogenetic hypothesis. Give a distinct prediction and study design for each, then identify which conclusions cannot be drawn from the proposed evidence."]],
    b1l2:[["Transfer task · partition behavioural variation","Design a reciprocal cross-fostering or common-garden experiment for a boldness difference between populations. Include repeated measurements, parental origin, rearing environment and a test environment that can expose genotype-by-environment interaction."]],
    b1l3:[["Transfer task · construct an ethogram","Develop a state-and-event ethogram for six observable behaviours in a social mammal. Select focal, scan or all-occurrence sampling for each outcome and create a plan for observer training, blinding and reliability assessment."]],
    b2l1:[["Transfer task · test a mating signal","Design a field experiment to determine whether a colour or acoustic ornament affects mate choice rather than territory acquisition. Include a manipulation, sham control, genetic parentage and a measure of survival cost."]],
    b2l2:[["Transfer task · classify cooperation","For alarm calling, cooperative breeding and food sharing, calculate or outline actor cost, recipient benefit, relatedness and repeated interaction. Decide whether kin selection, reciprocity, mutualism or by-product benefit best fits each case."]],
    b2l3:[["Transfer task · analyse communication","Trace one acoustic, chemical or visual signal through production, propagation, detection and receiver response. Predict how environmental noise changes signal design and propose a playback or presentation experiment that distinguishes information from general arousal."]],
    b3l1:[["Transfer task · identify a navigation system","Design a displacement experiment that separates landmark following, path integration, celestial compass and geomagnetic information. Specify release sites, cue manipulations, tracking variables and the pattern expected under each mechanism."]],
    b3l2:[["Transfer task · distinguish learning processes","Construct a controlled experiment that separates habituation from sensory adaptation, or model-free habit from goal-directed choice. Include acquisition, transfer or devaluation and a competing explanation."]],
    b3l3:[["Transfer task · solve a patch problem","Use travel time and a declining gain curve to predict patch departure with the marginal-value theorem. Then add predation risk, nutrient balance or social interference and explain how the prediction should change."]],
    b4l1:[["Transfer task · model a decision","Create a two-choice evidence-accumulation task with manipulable signal clarity and urgency. Predict separate changes in sensitivity, decision threshold, accuracy and latency, and explain how current energetic state could alter the boundary."]],
    b4l2:[["Transfer task · decode colony information","Given sun position, waggle angle, duration and food odour, infer the advertised direction and relative distance. Then design a test of whether recruits rely on dance information, odour, private memory or a combination."]],
    b4l3:[["Transfer task · evaluate an awareness claim","Choose mirror use, uncertainty response, judgement bias or analgesic preference. State the narrow capacity tested, construct sensory and learning controls, and specify what additional converging evidence would justify a stronger inference."]],
    b5l1:[["Transfer task · verify a circadian rhythm","Design an actogram experiment under entrained and constant conditions. Estimate free-running period, apply light pulses at two phases and predict advances or delays from a phase-response curve."]],
    b5l2:[["Transfer task · diagnose internal misalignment","Create a schedule in which light, feeding and activity cues disagree. Predict phases of the central activity rhythm and two peripheral rhythms, then identify measurements that distinguish direct masking from clock resetting."]],
    b5l3:[["Transfer task · test treatment timing","Design a randomised study comparing two treatment times. Define internal-phase assessment, pharmacokinetic and clinical outcomes, adherence monitoring and an analysis that separates clock time from biological time."]]

  const behaviourTransferExtensions={
    b1l1:"For every hypothesis, name the biological scale, independent variable, response variable and causal alternative. A playback can test immediate sensory mechanism but not historical origin; a cross-fostering study can test developmental input but not fitness; a comparative analysis can address evolutionary association but needs phylogenetic correction. End with one result that would falsify each explanation rather than listing only supporting observations.",
    b1l2:"Measure the same individuals in at least two environments so intercepts and plasticity slopes can be estimated separately. Randomise foster assignment, record prenatal or egg effects and keep observers blind. Predict the pattern for additive inherited influence, rearing effect and crossing reaction norms. Explain why high heritability within either population would not show that the between-population difference is genetic.",
    b1l3:"Define each item using posture or movement rather than intent words such as angry or happy. Identify the biological replicate and balance observation across time and enclosure position. Ask two observers to code an unseen calibration set, calculate a chance-corrected reliability measure and revise ambiguous categories before treatment data are opened. Report behaviours likely to be missed by the chosen sampling interval.",
    b2l1:"Manipulate the signal independently of body condition, confirm that receivers perceive the change and prevent treatment from altering dominance or territory. Follow marked individuals across the breeding season and assign offspring genetically. Analyse mating success, offspring survival and future reproduction because an ornament can increase mating while reducing longevity. State whether the evidence supports receiver preference, male competition or both.",
    b2l2:"Use marginal changes, not total group productivity, and define the reference population for relatedness. For reciprocity, manipulate partner history and test contingent return rather than simple repeated association. For kin selection, compare help while controlling familiarity and spatial proximity. If group composition changes success, partition within- and between-group selection before claiming that benefit to the group explains evolutionary spread.",
    b2l3:"Calibrate stimuli within the species' hearing, colour or chemical range and use multiple signallers as independent exemplars. Randomise presentation, standardise amplitude or concentration and code responses blind. A response to an isolated signal shows receiver sensitivity; differential response to category-matched stimuli can show encoded information; transfer to a new context provides stronger evidence. Do not infer semantic meaning from classifier labels alone.",
    b3l1:"Use familiar and unfamiliar release sites and include sham-handled controls for tagging or sensory manipulation. Rotate one cue while leaving others unchanged, then measure initial bearing, route shape, correction and homing success. Compass use predicts directional rotation; path integration predicts dependence on the outbound journey; landmark navigation should deteriorate at unfamiliar sites. Cue conflict may reveal weighting rather than one exclusive mechanism.",
    b3l2:"For habituation, show response recovery after a novel stimulus or rest and verify that the sensory pathway still responds. For goal-directed action, devalue the outcome or degrade action-outcome contingency; persistence suggests habit but can also reflect incomplete devaluation or strong motivation. Fit trial-level learning models and use novel transfer trials. A group-average curve should not replace evidence about individual strategies.",
    b3l3:"Plot cumulative gain against time and use the tangent from total travel time to derive the energy-rate optimum. Test departures across several travel distances rather than one patch. Predation may favour earlier leaving, while nutrient shortage may favour longer residence in a low-energy but essential-nutrient patch. Measure competitor density and state variables so deviation from the energy model becomes an informative test instead of an error.",
    b4l1:"Vary stimulus overlap to change sensitivity and impose deadlines or asymmetric costs to change threshold. Fit both choices and reaction times; accuracy alone cannot distinguish a cautious criterion from better perception. Repeat the task after manipulating reserves or predation cues and predict boundary movement. Verify motor speed independently, because slower responses could reflect impairment rather than greater evidence accumulation.",
    b4l2:"Draw vertical, sun azimuth and predicted food bearing before converting the angle. Calibrate duration against flights in the local landscape rather than using one universal distance. In the experiment, displace recruits, remove floral odour or provide conflicting private experience while tracking departures and arrivals. Colony recruitment is the outcome of dance decoding plus search, memory and environmental accessibility; measure each stage separately.",
    b4l3:"Mirror behaviour requires visual and motivational controls; uncertainty responses require matched reward history and stimulus difficulty; judgement bias requires control of hunger, sensory threshold and locomotion; analgesic choice requires evidence that the drug does not simply sedate or reward. Use several methods that share the target capacity but not the same confound. State where ethical precaution may exceed the certainty of the scientific conclusion.",
    b5l1:"Record enough cycles for period estimation and remove transient days after environmental change. A true circadian rhythm should free-run near 24 hours rather than disappear immediately. Deliver identical light pulses at early and late subjective night and compare phase shifts with untreated controls. Separate phase resetting from acute masking by continuing observation after the pulse. Report period and uncertainty, not only a visually persuasive actogram.",
    b5l2:"Keep total light, calories and activity opportunity comparable while shifting their timing. Measure melatonin or central activity phase, liver metabolic expression and gut or temperature rhythm across the whole cycle. If feeding shifts liver phase without equivalently shifting central activity, internal desynchrony is supported. Direct suppression of activity only during light exposure is masking unless the subsequent free-running phase also changes.",
    b5l3:"Stratify or adjust for chronotype, sleep, meals and shift work, and measure whether assigned times correspond to different biological phases. Repeated drug concentration distinguishes rhythmic exposure from rhythmic target response; patient-centred outcomes establish usefulness. Predefine adverse effects and avoid selecting the best time after examining many endpoints. A null result should constrain the timing claim rather than be dismissed as poor personalisation."

  const dairyDeepening={
    d1l1:[["Advanced integration · the dairy farm as a biological enterprise","A dairy system converts feed, water, labour, land and animal genetic potential into milk, calves, manure and livelihood. Yield per cow is only one metric. Sound evaluation includes feed cost, reproductive delay, replacement rate, disease loss, unpaid labour, capital depreciation, welfare and environmental externalities. Mixed crop-livestock systems can recycle residues and nutrients, while specialised systems may gain scale but depend more strongly on purchased inputs and reliable markets. System boundaries must be stated before comparing efficiency."],["Recent advances · records, resilience and precision support","Digital milk meters, activity sensors, rumination tags and farm-management records can detect deviations earlier than periodic observation. Their value depends on calibration, connectivity, false-alert cost and a clear action pathway; a sensor is not a diagnosis. Climate-resilient planning now combines heat protection, fodder reserves, water security, breed suitability and health surveillance. Smallholder relevance requires technologies that remain maintainable, interpretable and economically justified under local conditions."],["Worked example · partial budgeting","A cooling intervention costs ₹60,000 annually and is expected to recover ₹45,000 in milk income, avoid ₹18,000 in fertility losses and add ₹5,000 in electricity-related maintenance already included incorrectly by one analyst. Count only changes caused by the proposal and avoid double-counting. If genuine added benefits are ₹63,000 and added costs ₹60,000, the estimated annual net change is ₹3,000 before uncertainty and capital-risk analysis."]],
    d1l2:[["Advanced integration · selection in a defined environment","Breed choice is a genotype-by-environment decision. High milk potential may not be expressed under heat, disease pressure or limited feed, whereas locally adapted cattle can maintain fertility, survival and lower input costs. Selection objectives should combine milk solids, fertility, longevity, udder health, calving ease, feed efficiency and heat tolerance rather than reward volume alone. Crossbreeding exploits complementarity and heterosis but requires a planned mating structure; indiscriminate crossing produces variable animals and erodes identifiable genetic resources."],["Recent advances · genomic selection and diversity","Dense markers predict genomic breeding values when a relevant reference population has reliable phenotypes. Accuracy falls when training animals differ genetically or environmentally from the target herd. Current studies integrate disease resistance, methane or feed-efficiency traits and adaptive variation, while sequence surveys reveal diversity lost by narrow selection. Genomic information accelerates decisions but cannot compensate for poor recording, biased phenotypes or an undefined breeding goal."],["Worked example · a selection index","Bull A transmits greater milk yield but poorer daughter fertility; Bull B gives moderate yield, better udder health and longer productive life. Assign economic and welfare weights before ranking them. A simple index may be I=0.4 milk solids+0.25 fertility+0.2 udder health+0.15 longevity after standardising traits. Changing weights can reverse the ranking, demonstrating that selection is a declared objective, not a neutral search for the highest-yield animal."]],
    d1l3:[["Advanced integration · reproductive efficiency as a chain","Reproductive performance depends on postpartum recovery, oestrus expression, detection, semen handling, insemination timing, uterine health, embryo survival and pregnancy diagnosis. Submission rate and conception rate multiply to determine pregnancy rate, so a herd can fail through missed heats even when conception among inseminated cows is good. Artificial insemination disseminates selected genetics and reduces bull movement, but only when semen identity, cold chain, hygiene, trained deposition and records are reliable. Anatomy determines where and when interventions act."],["Recent advances · reproductive sensing and embryo technology","Activity, rumination, progesterone and computer-vision systems estimate oestrus or impending calving, but parity, lameness, heat stress and housing affect performance. A 2024 posture-based study explored early warning for abnormal calving. Sex-sorted semen, embryo transfer, in-vitro embryo production and genomic testing can accelerate genetic gain while increasing the need for inbreeding control, recipient management and economic evaluation. Automated alerts should trigger skilled examination, not unsupervised treatment."],["Worked example · pregnancy rate","During a 21-day cycle, 80 of 100 eligible cows are inseminated and 32 become pregnant. Submission rate is 80%, conception rate is 32/80=40%, and pregnancy rate is 32%. If conception remains 40% but submission rises to 90%, expected pregnancies become 36. The calculation localises whether improvement should target heat detection, insemination success or both."]],
    d2l1:[["Advanced integration · cow-centred housing design","Housing is successful when it supports lying, rising, feeding, drinking, movement, social avoidance, calving and care. Stall or bed dimensions must match animal size; abrasive or slippery floors increase injury; crowding reduces lying and subordinate access to feed. Loose, free-stall, tie and open systems create different trade-offs in movement, labour, hygiene and climate protection. Design should map clean and dirty flows, isolate sick or incoming animals and allow safe human and animal escape routes."],["Recent advances · behaviour-based facility assessment","Computer vision, location tags and automated lameness scoring quantify lying bouts, queueing, feeding displacement and gait. Early-warning models can support inspection, but performance can change with breed, floor, lighting and camera angle. Welfare assessment increasingly combines resource measures such as stall width with animal outcomes such as lesions, fear and resting time. A technically compliant structure can still fail if cows avoid using it."],["Worked example · feed-space pressure","A pen holds 60 cows with 36 effective feeding positions. The stocking ratio is 60/36=1.67 cows per position. Even if total feed is adequate, peak delivery can create displacement and uneven intake, especially for fresh or subordinate cows. Compare feeding time, refusals, sorting and body condition before concluding that ration formulation is the cause. Adding space, access time or grouping may address the actual constraint."]],
    d2l2:[["Advanced integration · air, water and nutrient flows","Animals, manure and wet surfaces add heat, moisture, ammonia, carbon dioxide and bioaerosols. Ventilation must exchange contaminated air without creating harmful draughts at calf level. Drainage depends on graded, non-slip surfaces, separated clean water and manure pathways, and maintenance that prevents pooling. Manure is both a pathogen source and a nutrient resource; storage and land application must match crop requirement, rainfall, soil and groundwater risk. Anaerobic spaces can contain lethal gases and require controlled access."],["Recent advances · monitored barns and circular management","Low-cost sensors can map temperature, humidity, airspeed, ammonia and water use, but placement and calibration determine whether readings represent cow exposure. Anaerobic digestion can recover biogas, while separation or composting changes nutrient form and handling. No technology eliminates mass balance: nitrogen, phosphorus, pathogens and greenhouse gases shift among air, water, soil and products. Whole-farm accounting prevents a local improvement from exporting pollution elsewhere."],["Worked example · water and drainage planning","If 50 lactating cows drink an average 80 L daily during hot weather, drinking demand is 4,000 L per day before cleaning and cooling water. A trough delivering 20 L min−1 requires at least 200 aggregate flow-minutes, but peak access and reserve capacity matter more than the daily average. Measure refill rate at operating pressure and route overflow away from feed and resting areas."]],
    d2l3:[["Advanced integration · thermoregulation across seasons","Heat stress reduces feed intake, redirects blood to skin, increases respiration and can disturb acid-base balance, immunity, fertility and milk synthesis. Temperature-humidity index is a screening tool but omits solar radiation, airspeed, coat, acclimation and individual susceptibility. Shade reduces radiant load; fans increase convection; sprinklers require sufficient skin wetting paired with airflow; abundant clean water is essential. Cold management protects calves and wet animals while preserving ventilation, dry bedding and energy supply."],["Recent advances · heat stress beyond the milking period","A 2024 prospective cohort linked heat exposure in the close-up dry period with later milk, fertility and immunometabolic outcomes, demonstrating carry-over risk before lactation. Infrared and internal-temperature systems aim to identify vulnerable cows earlier, but thresholds require local validation. Climate adaptation therefore begins with seasonal design, not emergency response after yield falls. Animal-based measures such as panting, respiration, body temperature and intake verify whether environmental control is working."],["Worked example · interpreting THI","Suppose two barns share the same calculated THI, but one has direct afternoon sun and still air while the other has shade and 3 m s−1 airspeed. Cow heat load will differ despite equal THI. Compare panting score, respiration, water intake and body temperature. The example shows why an index should trigger assessment rather than substitute for it."]],
    d3l1:[["Advanced integration · rumen fermentation and physical form","Rumen microbes convert carbohydrates into acetate, propionate and butyrate, synthesize microbial protein and release gases. Acetate supports milk-fat synthesis, propionate is a major glucose precursor and butyrate fuels rumen epithelium. Rapidly fermentable starch without effective fibre can lower pH and alter intake, motility and microbial ecology. Ration quality depends on dry matter, nutrient density, digestibility, particle size, mixing accuracy and sorting—not on crude protein percentage alone."],["Recent advances · host-genome–microbiome networks","A 2024 study integrated genotypes, rumen microbial profiles and feed-efficiency phenotypes in dairy cows, identifying direct and mediated associations. Such networks generate mechanistic hypotheses but do not make every microbial association causal. Passage rate and feed intake can change microbial abundance as well as the reverse. Current precision nutrition therefore combines individual intake, milk energy, body change and rumen function rather than promising one universal probiotic."],["Worked example · dry-matter ration","A cow receives 20 kg silage at 35% dry matter and 6 kg concentrate at 90% dry matter. Dry-matter intake is 7.0+5.4=12.4 kg, not 26 kg. The ration is 56.5% silage dry matter and 43.5% concentrate dry matter. Nutrient calculations and feed costs must use dry matter, while bunk delivery and water availability still operate on as-fed amounts."]],
    d3l2:[["Advanced integration · minerals, transition physiology and additives","Macro- and trace minerals interact in absorption, endocrine regulation and toxicity. Around calving, calcium demand rises abruptly; prevention aims to prepare homeostatic mobilisation and absorption rather than indiscriminately add calcium. Magnesium supports parathyroid responses, and excess potassium can complicate cation-anion balance. Additives require a defined target, plausible mechanism, legal status, dose, ration context and independent outcome evidence. Buffers, yeasts, enzymes, mycotoxin binders and methane inhibitors are not interchangeable categories."],["Recent advances · methane and evidence quality","Enteric methane represents both greenhouse-gas output and lost feed energy, stimulating additive, microbial and breeding research. Results depend on basal diet, delivery consistency, adaptation period, measurement system, milk response, residues and life-cycle effects. In-vitro gas reduction is not equivalent to durable whole-cow benefit. Rapid food or feed tests also require validated sensitivity, specificity and matrix performance. New technology should enter a ration only after safety, efficacy and economics are jointly assessed."],["Worked example · evaluating an additive trial","Thirty cows receive an additive and produce 1.2 kg more milk than 30 controls, but groups differed in days in milk before treatment. The comparison is confounded. A better trial blocks or randomises by parity and lactation stage, measures baseline intake and production, keeps the ration identical, records adverse effects and reports confidence intervals. Profit equals verified response value minus product and delivery costs, not the largest observed cow response."]],
    d3l3:[["Advanced integration · life-stage feeding","Colostrum management is governed by quality, quantity, cleanliness and speed, followed by verification of passive transfer. Water and starter intake promote rumen development even while milk is fed. Heifers require steady skeletal growth without excessive fat deposition. Late pregnancy and early lactation create competing demands for fetal growth, colostrum, milk and immunity; falling intake can produce negative energy balance, fat mobilisation and metabolic disease risk. Body-condition trajectory is more informative than one isolated score."],["Recent advances · transition and early-warning phenotypes","Automated feeders, rumination collars and activity systems can detect changes around disease or calving. A 2025 study examined feeding behaviour, milk and serum indices around parturition, reflecting the shift toward longitudinal transition phenotyping. Prediction is not prevention unless alerts lead to timely examination and effective management. Calf research similarly links early growth and disease to later performance, making verified colostrum transfer and growth records investments rather than optional paperwork."],["Worked example · calf growth target","A calf weighs 40 kg at birth and 82 kg at 60 days. Average daily gain is (82−40)/60=0.70 kg day−1. Interpret this with health, skeletal growth, milk or replacer intake and starter consumption. A satisfactory average can hide growth interruption during diarrhoea, so weekly or fortnightly measurements provide better diagnostic resolution than birth and weaning weights alone."]],
    d4l1:[["Advanced integration · milk synthesis and analytical quality","Mammary epithelial cells synthesize lactose, caseins and much of milk fat; lactose draws water osmotically, while blood supplies precursors, minerals and immune components. Composition varies with species, breed, diet, stage, parity, health and milking interval. Somatic-cell count indicates mammary inflammation at cow or bulk level but is not itself a bacterial count. Density, freezing point, fat, protein, lactose, microbial counts and residues answer different quality questions and require representative sampling."],["Recent advances · rapid phenotyping and authentication","Mid-infrared spectra, in-line sensors and machine learning estimate components, metabolic indicators or abnormal milk patterns at scale. Rapid tests can screen antibiotic residues or adulteration, but calibration drift and population shift create false reassurance. Confirmatory laboratory methods, chain of custody and known detection limits remain essential. Data become actionable when linked to cow identity, milking event, treatment record and corrective investigation."],["Worked example · solids calculation","One hundred kilograms of milk contains 4.0% fat and 8.7% solids-not-fat. Total solids are 12.7 kg and water is 87.3 kg. If water is added, both component percentages and freezing point shift, but natural variation and measurement error must be considered. A defensible adulteration conclusion uses calibrated instruments, legal sampling and confirmatory analysis rather than density alone."]],
    d4l2:[["Advanced integration · process lethality and recontamination","Pasteurisation applies a validated time-temperature combination to reduce specified pathogens while limiting quality change. Microbial death is logarithmic: D-value is time for a 90% reduction at one temperature, and z-value describes temperature sensitivity. Heating does not remove preformed toxins, chemical residues or all spores. Post-process contamination can erase the safety gain, so equipment zoning, cleaning verification, packaging hygiene and cold-chain control are integral to the process."],["Recent advances · risk-based food-safety verification","Rapid analytical kits increasingly screen pathogens, Enterobacteriaceae or antimicrobial residues in milk matrices, but approved use is analyte- and product-specific. Hazard analysis identifies biological, chemical and physical hazards, sets critical limits and defines corrective action. FSSAI requirements govern identity, hygiene, contaminants, residues and labelling in India; operators must consult the current applicable regulation rather than rely on a generic safe-milk claim. Traceability enables targeted recall and root-cause analysis."],["Worked example · log reduction","If milk initially contains 10⁶ target organisms per mL and a validated process delivers a 5-log reduction, the expected survivor level is about 10 organisms per mL under the model. A 5-log process is not automatically sufficient for every pathogen or starting load. Verify temperature distribution, holding time and post-process sampling; a clean outlet result cannot compensate for an unmonitored cold chain."]],
    d4l3:[["Advanced integration · product chemistry and value chains","Fermented products use selected microbes to acidify milk; rennet cheeses enzymatically destabilise casein before whey removal and ripening. Butter forms by phase inversion of cream, ghee removes water and non-fat solids by heating, and powder stability depends on water activity, packaging and oxidation. Each process changes yield, nutrient density, hazard and by-products. Enterprise viability depends on raw-milk composition, batch losses, energy, labour, packaging, cold storage, regulation, market demand and truthful labelling."],["Recent advances · authenticity and circular utilisation","Spectroscopy, chromatography and DNA or protein methods increasingly detect adulteration, species substitution and process damage. Models must be validated on local products because recipe and breed variation can mimic fraud. Whey, manure heat and process water can be recovered only after quality and safety assessment; circularity is not permission to redirect contaminated waste into food or feed. Small enterprises gain resilience through cooperative chilling, shared testing and documented batch traceability."],["Worked example · product yield and margin","From 100 L milk, a unit obtains 12 kg product sold at ₹360 kg−1. Revenue is ₹4,320. If milk, culture, fuel, labour, packaging, testing and losses total ₹3,750, batch contribution is ₹570 before rent, depreciation, finance and unsold stock. Compare actual yield with milk solids and record whey or moisture; unexplained high yield may indicate inconsistent composition rather than superior efficiency."]],
    d5l1:[["Advanced integration · mastitis and Johne's epidemiology","Contagious mastitis pathogens spread mainly during milking, whereas environmental pathogens originate in bedding, manure and water; control priorities therefore differ. Clinical signs, culture or molecular tests, somatic-cell patterns and treatment history should be linked at cow and herd levels. Johne's disease arises from Mycobacterium avium subsp. paratuberculosis, commonly acquired early and followed by long silent infection. Stage-dependent shedding and test sensitivity make one negative result insufficient to declare freedom."],["Recent advances · molecular phenotypes and targeted control","Genomic and transcriptomic studies seek markers for udder health or paratuberculosis response, including a 2024 analysis of microRNAs associated with inflammatory pathways. Biomarkers can reveal mechanisms or risk but must be validated for diagnostic sensitivity, specificity and timing. Mastitis control increasingly uses pathogen patterns and treatment outcomes to avoid blanket antimicrobial use. Johne's control remains a long-horizon programme of calving hygiene, calf exposure reduction, purchase policy and repeated risk-based testing."],["Worked example · interpreting screening results","A herd test has 80% sensitivity and 98% specificity. In 1,000 cattle with 5% true prevalence, about 40 of 50 infected animals test positive, while roughly 19 of 950 uninfected animals are false positive. Positive predictive value is about 40/59, or 68%. Even a good test behaves differently as prevalence changes, so confirmatory testing and herd history matter."]],
    d5l2:[["Advanced integration · life cycles determine control points","Coccidia multiply in intestinal cells after resistant oocysts are ingested; hygiene and stocking affect exposure. Theileria depends on competent ticks and has intracellular host stages. Flukes require suitable intermediate hosts and wet habitats; tapeworm cycles vary by species; trypanosomes use biting vectors and antigenic variation. Treatment alone cannot control every stage. Effective plans identify the host, vector or intermediate host, environmental reservoir, season and stage most vulnerable to intervention."],["Recent advances · resistance-aware parasitology","Molecular assays, quantitative faecal tests and vector surveillance improve species identification and treatment evaluation. Resistance evolves when repeated blanket dosing removes susceptible parasites and leaves resistant survivors. Correct weight, calibrated delivery, product quality and post-treatment assessment are basic stewardship. Targeted selective treatment can preserve susceptible refugia in suitable systems, but requires validated indicators and local expertise. Vector management combines habitat, quarantine, surveillance and strategic acaricide use."],["Worked example · faecal egg-count reduction","Mean pre-treatment egg count is 800 eggs g−1 and post-treatment count is 160. Apparent reduction is (800−160)/800×100=80%. This may be inadequate for a product and parasite expected to show much higher efficacy, but interpretation requires control animals, sampling interval, species and confidence limits. Do not respond by automatic redosing before checking weight estimation, administration, reinfection and resistance."]],
    d5l3:[["Advanced integration · layered disease prevention","Biosecurity reduces the probability that pathogens enter, spread or leave a farm. Layers include purchase policy, isolation, vaccination, clean-to-dirty movement, equipment separation, visitor and vehicle control, wildlife or vector management, carcass disposal and rapid reporting. Foot-and-mouth disease is highly contagious and suspected vesicular disease requires immediate official veterinary action. Infectious bovine rhinotracheitis can establish latency, so recovered animals may remain epidemiologically relevant. Vaccination reduces risk but does not replace surveillance or movement control."],["Recent advances · One Health stewardship and outbreak intelligence","Current WOAH standards integrate disease prevention, diagnostic testing, vaccination, veterinary oversight, antimicrobial records, withdrawal periods and monitoring of use. Antimicrobial lists are not treatment instructions; local authorisation, pathogen, susceptibility and clinical context govern selection. Genomic surveillance and digital traceability can link outbreaks, but data quality and rapid reporting determine value. Stewardship protects animal welfare by treating bacterial disease effectively while preventing routine drug use from substituting for hygiene, ventilation or vaccination."],["Worked example · an entry-risk pathway","A purchased cow arrives without verified health history and joins the milking herd immediately. Map the pathway: source infection, transport stress, direct contact, shared equipment and milk-line exposure. A layered control would pre-purchase assess, transport cleanly, isolate, examine and test according to veterinary policy before staged entry. If vesicular signs appear, stop movement and notify authorities rather than sample or treat informally."]]

  const dairyEvidenceSynthesis={
    d1l1:[["Evidence synthesis · compare systems with declared boundaries","Per-cow yield, profit per litre, land use, labour return, welfare and emissions intensity can rank the same farms differently. Include replacement animals, purchased feed, manure nutrients and unpaid labour. Use sensitivity analysis for milk price, feed cost and reproductive performance. A technology is scalable only if maintenance, skills, cash flow and failure consequences are considered alongside biological efficacy."]],
    d1l2:[["Evidence synthesis · from marker to breeding value","Marker association must be validated in the target population and converted into prediction using reliable phenotypes and relationships. A high genomic value does not guarantee one animal's outcome. Compare prediction accuracy, inbreeding, correlated responses and genotype-by-environment interaction. Indigenous-breed conservation requires effective population size and mating plans, not preservation of appearance alone."]],
    d1l3:[["Evidence synthesis · reproductive records localise failure","Submission rate, conception rate, pregnancy loss, days open and calving interval describe different bottlenecks. Sensor alerts should be compared with a defined reference such as progesterone, ultrasound or observed ovulation and evaluated for false positives. Randomised trials are needed before claiming that detection technology improves pregnancies rather than merely generates alerts."]],
    d2l1:[["Evidence synthesis · use animal outcomes","Dimensions and stocking ratios are exposure measures; lying time, lesions, lameness, cleanliness, displacement and fear show animal response. Observe across parity, time of day and season. A barn comparison can be confounded by feeding and herd health. Before rebuilding, identify whether space, surface, social access or management practice is the modifiable cause."]],
    d2l2:[["Evidence synthesis · environmental sensors need calibration","Ammonia or humidity readings depend on location, height, airflow and instrument drift. Map several cow-level zones and compare with respiratory, cleanliness and bedding outcomes. Nutrient budgets should reconcile manure produced, stored, exported and applied. A digester's biogas output does not alone establish reduced whole-farm emissions when leakage and displaced energy are omitted."]],
    d2l3:[["Evidence synthesis · heat exposure and response","THI describes weather combination, while panting, temperature, intake and production measure the animal. Longitudinal baselines help distinguish heat from disease. Cooling trials should randomise comparable pens or use crossover designs, record airspeed and water, and include fertility and dry cows. Yield recovery without welfare or resource accounting is an incomplete outcome."]],
    d3l1:[["Evidence synthesis · ration on paper versus ration consumed","Laboratory composition, mixer accuracy, particle distribution, feed delivery, refusals and sorting determine actual intake. Representative sampling is critical because one handful cannot describe a silage face or total mixed ration. Multi-omic associations with feed efficiency remain hypotheses until diet, passage rate and intervention establish direction."]],
    d3l2:[["Evidence synthesis · additive claims","Demand a specified product, dose, ration, animal stage, comparator and meaningful endpoint. In-vitro fermentation, short production trials, residue safety and life-cycle outcomes answer different questions. Replication and confidence intervals matter more than one significant response. Legal approval does not guarantee economic benefit, and natural origin does not guarantee safety."]],
    d3l3:[["Evidence synthesis · transition time series","A single low intake after calving cannot establish metabolic disease. Combine prepartum trend, body condition, parity, rumination, milk, ketone or mineral measurements and clinical examination. For calves, verify colostrum quality and passive transfer rather than assuming ingestion equals absorption. Growth curves reveal interruption better than one weaning weight."]],
    d4l1:[["Evidence synthesis · representative milk sampling","Component and microbial results vary by cow, milking, agitation, storage and sampling point. Use aseptic, mixed and traceable samples appropriate to the question. A screening sensor must be calibrated against a reference method and challenged with local breeds, products and abnormal samples. Somatic cells indicate inflammation but do not identify the pathogen."]],
    d4l2:[["Evidence synthesis · verify the process, not only the product","Temperature records, holding time, flow diversion, cleaning validation and package integrity document control before final testing. End-product sampling can miss intermittent failure. Rapid tests require known detection limits and confirmatory procedures. Hazard analysis should specify critical limits, monitoring, corrective action and record review rather than list generic hazards."]],
    d4l3:[["Evidence synthesis · enterprise claims require batches","Measure raw-milk composition, product yield, losses, shelf life, sensory acceptability and cost across repeated batches. Market interest is not equivalent to willingness to pay. Authentication models require independent local validation. Include unsold stock, returns, cold-chain failure and regulatory testing before presenting a profitable demonstration batch as a stable livelihood."]],
    d5l1:[["Evidence synthesis · stage and prevalence shape diagnosis","Culture, PCR, somatic-cell count, antibody and cellular tests detect different targets at different infection stages. Sensitivity and specificity must be interpreted with pre-test probability and herd purpose. Repeated testing may reduce uncertainty but cannot repair biased sampling. A biomarker associated with inflammation is not automatically specific for mastitis or Johne's disease."]],
    d5l2:[["Evidence synthesis · test resistance rather than assume it","Post-treatment egg counts, larval culture, molecular markers or vector assays support resistance assessment, each with limitations. Apparent failure can arise from underdosing, reinfection, wrong species or poor product. Use controls and confidence intervals. Treatment-frequency reduction should be paired with health and production monitoring so refugia-based stewardship does not become neglect."]],
    d5l3:[["Evidence synthesis · prevention and treatment are linked","Vaccination effectiveness depends on antigen match, cold chain, schedule, coverage and host response. Antibiotic treatment addresses susceptible bacterial disease, not viral outbreaks or poor ventilation. Farm records should connect diagnosis, drug, dose, withdrawal, response and recurrence. Outbreak investigation needs timelines, animal movements and contacts rather than blame based on the first detected case."]]

  const dairyTransferExtensions={
    d1l1:"State the time horizon and whether family labour, owned fodder and manure nutrients receive an economic value. Calculate contribution margin before fixed capital and run sensitivity tests for feed and milk prices. A stronger system is not simply the one with higher yield: compare reproductive resilience, debt exposure and failure recovery. Identify one measurement that could overturn your preferred option.",
    d1l2:"Standardise traits before combining them and justify each economic or welfare weight. Predict correlated responses if selection emphasises yield alone. Include a maximum acceptable inbreeding rate, record accuracy and a mating rule. Explain when heterosis is useful and why continuous unplanned crossing does not preserve it. Test whether predicted merit transfers from the reference population to the target climate and feeding system.",
    d1l3:"Separate missed insemination, failure to conceive and later pregnancy loss. Stratify results by parity, days postpartum, season, lameness and uterine disease. If an activity sensor is proposed, calculate sensitivity, positive predictive value and false alerts against a reference. The intervention should address the identified bottleneck; more semen cannot correct poor heat detection, and more alerts cannot correct low conception.",
    d2l1:"Measure lying time, hock lesions, gait, cleanliness, feed displacement and water waiting across cow groups and daily peaks. A plan drawing should show widths, turning points, non-slip surfaces, drainage direction and separation of calves, calving and isolation. Rank corrections by welfare risk, infection risk, cost and operational feasibility. Verify after modification that cows actually use the intended space.",
    d2l2:"Use peak flow as well as daily volume, and distinguish clean rainwater, process water and contaminated effluent. Quantify manure nitrogen and phosphorus entering, stored, exported and applied. Place air sensors at cow or calf level in representative zones and calibrate them. For pits or digesters, state exclusion, gas detection and rescue procedures; ventilation does not make entry into confined manure spaces safe.",
    d2l3:"Define escalating thresholds for observation, shade, fans, sprinklers, ration timing and emergency veterinary review. Check trough refill and backup power before the hot period. Compare treated and untreated or baseline periods using animal response, not THI alone. Include carry-over fertility and dry-period effects. Water and electricity costs belong in the evaluation, but resource savings must not be achieved by leaving cows thermally compromised.",
    d3l1:"Use laboratory values on a dry-matter basis and calculate the ration actually consumed after refusals. Assess particle distribution and feed sorting at delivery and later. Predict how excess rapidly fermentable carbohydrate changes rumen pH, fibre digestion, milk fat and intake. A balanced calculation still fails if the mixer is inaccurate, feed heats in the bunk or subordinate cows cannot gain access.",
    d3l2:"Separate mechanistic plausibility, controlled efficacy, field effectiveness, regulatory status and farm economics. Reject trials that confound treatment with lactation stage or ration. For methane claims, report absolute emissions, yield per intake and emissions intensity per milk, because these can move differently. Define a stopping rule for adverse intake, milk quality or residue findings. Marketing terms such as natural, probiotic or precision are not evidence.",
    d3l3:"For calves, include passive-transfer verification, sanitation and morbidity; for heifers, monitor structural growth and age at breeding; for transition cows, track condition loss, intake, rumination, calcium and ketone risk. Convert all feeds to dry matter and account for water separately. Set action thresholds before data collection. Explain how a good group average can conceal individual calves or fresh cows requiring intervention.",
    d4l1:"Trace sample identity from cow or tank through mixing, collection, temperature and analysis. Use the correct reference method for each suspected problem. High somatic cells support inflammation but not a pathogen; abnormal freezing point supports altered dissolved-solids balance but not deliberate dilution by itself. Link residues to treatment and withdrawal records. Require confirmation before imposing herd-level or legal conclusions. When indicators conflict, repeat representative sampling and examine calibration, storage and biological variation before escalation.",
    d4l2:"Identify raw-milk contamination, chemical residues, equipment fragments, insufficient heating, post-process contamination and cold-chain failure as distinct hazards. For each critical point, name a measurable limit, responsible person, frequency and corrective action. Calculate the intended log reduction and verify instrument calibration and flow diversion. Finished-product testing samples only a fraction of output and should verify, not replace, process control.",

  const geneticsGlossary=[
    ["Locus","A defined chromosomal position occupied by a gene, marker or other identifiable DNA sequence."],
    ["Genotype","The allelic constitution of an organism at one or more specified loci."],
    ["Phenotype","An observable or measurable characteristic produced by genotype, environment, development and their interactions."],
    ["Expressivity","The degree or intensity with which a genotype is manifested among individuals who express it."],
    ["Pleiotropy","A condition in which variation at one gene influences multiple phenotypic traits."],
    ["Recombination fraction","The proportion of meiotic products recombinant for two loci; it approaches but cannot exceed 0.5."],
    ["Centimorgan","A genetic-map unit corresponding to a one-percent recombination frequency over a short chromosomal interval."],
    ["Coefficient of coincidence","Observed double crossovers divided by the number expected if exchanges in adjacent intervals were independent."],
    ["Interference","The extent to which one crossover changes the probability of another nearby crossover; calculated as one minus coincidence."],
    ["Coupling phase","A linkage arrangement in which two specified alleles occur together on one homologue and their alternatives on the other."],
    ["Repulsion phase","A linkage arrangement in which each homologue carries one of two specified alleles and one alternative allele."],
    ["Quantitative trait locus","A genomic region statistically associated with variation in a continuously distributed trait."],
    ["Dominance variance","Genetic variance arising because the heterozygote value departs from the midpoint of the two homozygotes."],
    ["Phenotypic variance","The observed population variance of a trait, partitionable into genetic, environmental and interaction components."],
    ["Selection differential","Difference between the mean phenotype of selected parents and that of the population before selection."],
    ["Response to selection","Change in the population mean across generations attributable to selection, often predicted as narrow-sense heritability multiplied by selection differential."],
    ["Transition mutation","A nucleotide substitution between two purines or between two pyrimidines."],
    ["Transversion mutation","A nucleotide substitution that exchanges a purine for a pyrimidine or vice versa."],
    ["Frameshift mutation","An insertion or deletion not divisible by three that changes the downstream reading frame of a coding sequence."],
    ["Nondisjunction","Failure of homologous chromosomes or sister chromatids to segregate normally, generating cells with abnormal chromosome numbers."],
    ["Mosaicism","Presence within one individual of two or more genetically distinct cell populations derived from a single zygote."],
    ["Base-excision repair","DNA-repair pathway in which a glycosylase removes a small altered base before the site is processed and resynthesised."],
    ["Nucleotide-excision repair","DNA-repair pathway that excises an oligonucleotide containing a bulky helix-distorting lesion and restores the gap by synthesis."],
    ["Mismatch repair","Post-replicative correction system that removes mispaired bases and small insertion–deletion loops from the newly synthesised strand."],
    ["Homologous recombination repair","High-fidelity repair of a DNA double-strand break using a homologous DNA molecule as a template."],
    ["Nonhomologous end joining","Direct ligation of DNA double-strand-break ends, often with small sequence changes at the junction."],
    ["Base editing","Targeted genome editing that chemically converts one base into another without deliberately producing a double-strand break."],

    ["Introgression","Stable incorporation of genetic material from one population or species into another through hybridisation and repeated backcrossing."],
    ["Incomplete lineage sorting","Persistence of ancestral allelic lineages across successive speciation events, causing some gene trees to differ from the species tree."],
    ["Paralogue","Gene copy related to another gene by a duplication event within an evolutionary lineage."],
    ["Neutral theory","Theory proposing that much molecular variation evolves through mutation and random fixation of selectively neutral or nearly neutral variants."],

    ["Reproductive isolation","Biological barriers that reduce gene exchange between populations before or after fertilisation."],
    ["Reinforcement","Evolution of stronger prezygotic isolation when selection acts against low-fitness hybrids in regions of contact."],
    ["Hybrid zone","Geographic region in which genetically differentiated populations meet, mate and produce hybrid descendants."],
    ["Gene–culture coevolution","Reciprocal evolutionary interaction in which culturally transmitted practices alter selection and genetic change influences cultural capacity."],
    ["Punctuated equilibrium","Macroevolutionary model in which long intervals of relative morphological stability are interrupted by comparatively rapid change associated with lineage splitting."]

  const physiologyGlossary=[
    ["Allostasis","Achievement of stability through anticipatory or context-dependent physiological change rather than maintenance of one fixed set point."],
    ["Nutritional geometry","Multidimensional framework examining how organisms balance interacting nutrients and how those mixtures affect performance and health."],
    ["Enteric nervous system","Intrinsic neural network of the gastrointestinal tract that coordinates motility, secretion, blood flow and local reflexes."],
    ["Interstitial cells of Cajal","Gastrointestinal pacemaker and conduction cells that generate or transmit slow-wave electrical activity to smooth muscle."],
    ["Peristaltic reflex","Local enteric response in which contraction occurs orally and relaxation aborally to propel luminal contents."],
    ["Sodium–glucose cotransporter 1","Apical intestinal and renal transporter that uses the sodium electrochemical gradient to move glucose into epithelial cells."],
    ["Micelle","Small aggregate of bile salts and lipids that carries digestion products through the intestinal unstirred water layer."],
    ["Airway resistance","Pressure difference required to generate airflow, strongly influenced by airway radius and gas-flow pattern."],
    ["Lung compliance","Change in lung volume per unit change in transpulmonary pressure; reduced in stiff lungs and increased when elastic recoil is lost."],
    ["Physiological dead space","Volume of inspired gas that does not participate effectively in gas exchange, including conducting airways and ventilated but underperfused alveoli."],
    ["Pulmonary shunt","Blood flow reaching the arterial circulation without adequate contact with ventilated alveoli."],
    ["Bohr effect","Reduction in haemoglobin oxygen affinity caused chiefly by increased carbon dioxide, hydrogen ions or temperature in metabolically active tissues."],

    ["Erythropoietin","Hormone produced mainly by the kidney during tissue hypoxia that stimulates red-cell production in bone marrow."],
    ["Thrombin","Central coagulation protease that converts fibrinogen to fibrin and amplifies platelet and clotting-factor activation."],
    ["Fibrinolysis","Enzymatic dissolution of fibrin, principally through plasmin generated from plasminogen."],

    ["Nernst potential","Equilibrium voltage for one ion at which its electrical and chemical driving forces exactly balance."],

    ["Saltatory conduction","Rapid action-potential propagation in myelinated axons by regenerative current flow between nodes of Ranvier."],

    ["Motor unit","One motor neuron and all skeletal-muscle fibres innervated by its axonal branches."],
    ["Excitation–contraction coupling","Sequence linking electrical or chemical excitation of a muscle cell to cytosolic calcium elevation and force generation."],

    ["Glomerular filtration rate","Volume of plasma ultrafiltrate formed by all functioning renal glomeruli per unit time."],

    ["Dialysis adequacy (Kt/V)","Dimensionless estimate relating dialyser urea clearance, treatment time and body urea-distribution volume."],
    ["Hypothalamic–pituitary–gonadal axis","Endocrine network in which hypothalamic GnRH controls pituitary gonadotropins and gonadal steroidogenesis, gametogenesis and feedback."],
    ["LH surge","Rapid increase in luteinising hormone that triggers ovulation and luteinisation in spontaneous ovulators."],

    ["Positive feedback","Regulatory loop in which an initial change promotes further change in the same direction until a terminating event intervenes."],
    ["Acclimatisation","Reversible physiological adjustment of an individual to a changed natural or experimental environment."],
    ["Q10 coefficient","Ratio describing how the rate of a physiological or biochemical process changes for a ten-degree Celsius temperature increase."],
    ["Oxygen dissociation curve","Relationship between oxygen partial pressure and haemoglobin saturation, shaped by affinity, cooperativity and allosteric modifiers."],
    ["Respiratory quotient","Ratio of carbon dioxide produced to oxygen consumed, used to infer the predominant metabolic fuel under defined conditions."],

  const behaviourGlossary=[
    ["Tinbergen’s four questions","Complementary analysis of behaviour through mechanism, ontogeny, adaptive function and phylogenetic history."],
    ["Proximate explanation","Account of the immediate mechanisms and developmental processes that produce a behaviour."],
    ["Ultimate explanation","Account of a behaviour in terms of its fitness consequences and evolutionary history."],
    ["Ontogeny","Developmental history through which genes, experience and environment shape a trait within an individual."],
    ["Behavioural function","Contribution of a behaviour to survival or reproductive success under specified ecological conditions."],
    ["Phylogenetic history","Evolutionary origin and transformation of a trait inferred by comparison among lineages."],
    ["Scan sampling","Recording the behaviour of each visible group member at predetermined sampling instants."],
    ["All-occurrence sampling","Recording every observed instance of a predefined, usually infrequent, behaviour during an observation period."],
    ["Instantaneous sampling","Scoring the state present at exact time points to estimate activity budgets or state prevalence."],
    ["Pseudoreplication","Treating nonindependent measurements as independent replicates, thereby exaggerating effective sample size and inferential confidence."],
    ["Inter-observer reliability","Degree to which independent observers applying the same operational definitions produce consistent behavioural records."],
    ["Indirect genetic effect","Influence of one individual's genotype on another individual's phenotype through social or environmental interaction."],
    ["Operational sex ratio","Ratio of sexually receptive males to receptive females available in a mating population at a given time."],
    ["Bateman gradient","Slope relating mating success to reproductive success, used to quantify the opportunity for sexual selection."],
    ["Sexual selection","Differential reproductive success caused by competition for mates or fertilisations and by mate choice."],
    ["Parental investment","Parental expenditure that increases offspring fitness while reducing the parent's capacity to invest in other offspring."],
    ["Hamilton’s rule","Condition rb greater than c under which a social act can spread when relatedness-weighted benefit exceeds actor cost."],
    ["Reciprocal altruism","Repeated exchange of costly help among nonrelatives when future return, partner recognition and control of cheating make cooperation advantageous."],
    ["Mutualism","Interaction in which participating individuals obtain a net fitness benefit under the conditions being considered."],
    ["Sensory ecology","Study of how environmental signals, sensory-system design and animal decisions interact in natural contexts."],
    ["Signal detection theory","Framework separating sensory sensitivity from decision criterion when stimuli are uncertain and errors have unequal consequences."],
    ["Ecological trap","Human-altered situation in which formerly reliable cues direct organisms toward habitats or choices that now reduce fitness."],
    ["Orientation","Use of directional information to align movement without necessarily determining geographic position or a complete route."],
    ["Path integration","Continuous updating of position relative to a starting point by integrating direction and distance travelled."],
    ["Imprinting","Rapid, often phase-sensitive learning that produces durable recognition or preference without conventional repeated reinforcement."],
    ["Blocking","Failure to learn about a new cue because an established cue already predicts the same outcome."],
    ["Extinction learning","New learning that a previously predictive cue no longer produces its expected outcome; it does not simply erase the original association."],
    ["Cognitive map","Internal representation of spatial relations that can support flexible routes, shortcuts and detours."],
    ["Model-free learning","Action-value learning from prediction errors without an explicit internal model of environmental transitions."],
    ["Marginal value theorem","Optimal-foraging model predicting patch departure when current gain rate falls to the habitat-wide average including travel time."],
    ["Sequential sampling","Decision process in which noisy evidence accumulates over time until it reaches a response threshold."],
    ["Working memory","Short-duration maintenance and manipulation of information needed to guide an ongoing task."],
    ["Judgement bias","Systematic tendency for affective state to alter interpretation of ambiguous cues, used cautiously in animal-welfare assessment."],
    ["Metacognition","Monitoring or control of one's own uncertainty or knowledge state, inferred in animals through carefully controlled behavioural tests."],
    ["Phase-response curve","Plot showing the direction and magnitude of circadian phase shifts produced by a stimulus delivered at different internal times."],
    ["Circadian phase","Position within an endogenous circadian cycle, estimated using a defined marker such as activity onset or melatonin timing."],
    ["Masking","Direct effect of an environmental factor on observed rhythmic output without a corresponding shift of the underlying oscillator."],
    ["Free-running rhythm","Endogenous rhythm expressed without periodic time cues, revealing its intrinsic period."],
    ["Acrophase","Timing of the fitted peak of a rhythmic variable, commonly estimated by cosinor analysis."],
    ["Chronotype","Stable individual tendency toward earlier or later timing of sleep, activity or other circadian outputs."]
  ];
  const dairyGlossary=[

    ["Contribution margin","Revenue remaining after variable costs, available to cover fixed costs and profit."],

    ["Genomic selection","Prediction of breeding merit using genome-wide marker information combined with phenotypes and pedigree in a reference population."],
    ["Submission rate","Proportion of eligible females inseminated during a defined breeding interval, reflecting heat detection and breeding management."],
    ["Conception rate","Proportion of inseminations that establish a recognised pregnancy under a specified diagnostic definition."],
    ["Pregnancy rate","Proportion of eligible nonpregnant females becoming pregnant per breeding cycle; approximately submission rate multiplied by conception rate."],

    ["Dry matter","Feed remaining after water is removed; the basis for comparing nutrient supply and intake across feeds of different moisture content."],

    ["Rumen fermentation","Anaerobic microbial conversion of feed into volatile fatty acids, gases, microbial biomass and other metabolites in the rumen."],
    ["Volatile fatty acids","Short-chain acids produced during rumen fermentation, principally acetate, propionate and butyrate, that provide major metabolic energy."],
    ["Acetate","Rumen volatile fatty acid used extensively for oxidation and milk-fat synthesis."],

    ["Butyrate","Rumen volatile fatty acid largely converted by the rumen epithelium to ketone bodies before reaching peripheral circulation."],
    ["Residual feed intake","Difference between observed feed intake and intake predicted from production and maintenance; lower values indicate greater feed efficiency under the model."],
    ["Passive transfer","Acquisition by the newborn of maternal immunoglobulins, chiefly through timely ingestion and absorption of adequate high-quality colostrum."],

    ["D-value","Decimal-reduction time: exposure duration at a specified temperature required to reduce a target microbial population by ninety percent."],

    ["Contagious mastitis pathogen","Mammary pathogen transmitted mainly between cows during milking, requiring control of udder-to-udder spread."],
    ["Environmental mastitis pathogen","Mammary pathogen acquired chiefly from bedding, manure, soil or water, requiring control of exposure and host susceptibility."],

    ["One Health","Collaborative framework recognising that human, animal and environmental health are biologically and operationally interconnected."],
