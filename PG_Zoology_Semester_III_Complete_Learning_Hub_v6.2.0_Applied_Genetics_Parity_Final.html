  <script>
  "use strict";
  const APP_VERSION="6.2.0";
  const courses=[
  {
    id:"genetics",code:"ZP233CC1",title:"Genetics and Evolution",kind:"Core Course V",hours:90,color:"#6b4bc3",
    description:"From Mendelian inheritance and chromosome mapping to population genetics, molecular phylogeny and human evolution.",
    units:[
      {id:"g1",title:"Mendelian Genetics",hours:18,summary:"Inheritance patterns, gene interaction, linkage, mapping, quantitative inheritance and heritability.",flow:["Alleles segregate","Genes interact","Linked loci recombine","Markers map loci","Phenotype partitions"],revision:["Test crosses reveal genotype and linkage phase.","Recombination frequency estimates map distance below 50%.","Broad- and narrow-sense heritability answer different questions."],lessons:[
        {id:"g1l1",title:"Mendelian principles and analytical crosses",lead:"Mendelian ratios are probability statements produced by chromosome behaviour, not immutable numerical laws.",sections:[["Core inheritance logic","A gene occupies a locus and may occur as alternative alleles. During meiosis, paired alleles segregate because homologous chromosomes separate; alleles at unlinked loci assort independently because homologous pairs orient independently at metaphase I. Dominance describes the phenotype of a heterozygote and does not imply that one allele is biologically stronger or more frequent."],["Solving crosses","Begin with explicit symbols, infer parental genotypes and list gametes before constructing a Punnett square or probability tree. A test cross with a homozygous recessive tester exposes gametic output. Departure from an expected ratio should be evaluated with sample size, viability, penetrance and linkage in mind before concluding that Mendelism has failed."]],key:"Segregation is universal for allelic pairs; independent assortment applies only when loci behave as unlinked.",exam:"Explain a dihybrid test cross and show how its progeny distinguish independent assortment from linkage."},
        {id:"g1l2",title:"Gene interactions and multiple alleles",lead:"Phenotypic ratios change when products of different loci participate in the same developmental or biochemical pathway.",sections:[["Interaction patterns","Complementary genes require a dominant allele at both loci for one phenotype, commonly yielding 9:7. Supplementary interaction occurs when one gene produces a basic phenotype and another modifies it. In recessive or dominant epistasis, an allele at one locus masks expression at another, producing ratios such as 9:3:4 or 12:3:1. These are modifications of the 9:3:3:1 phenotypic ratio; segregation itself remains Mendelian."],["Allelic series","A population can contain more than two alleles at a locus although a diploid individual carries only two. ABO blood groups illustrate an allelic series: Iᴬ and Iᴮ are codominant and both dominate i. Multiple allelism increases population-level variation and may create dominance hierarchies, codominance or lethal combinations."]],key:"Always distinguish interaction between loci from dominance relationships between alleles of one locus.",exam:"Use a biochemical pathway to explain why complementary gene action produces a 9:7 ratio."},
        {id:"g1l3",title:"Linkage, crossing over and chromosome maps",lead:"Linkage records the physical continuity of loci, while crossing over generates recombinant chromatids.",sections:[["Mechanism and evidence","Linked genes lie on the same chromosome and tend to pass together. During pachytene, homologues are aligned by the synaptonemal complex; reciprocal exchange occurs between nonsister chromatids and chiasmata later mark exchange sites. Coupling and repulsion describe the arrangement of alleles on homologues. Complete linkage is rare; incomplete linkage produces parental and recombinant gametes."],["Mapping strategies","Recombination frequency equals recombinant progeny divided by total progeny ×100 and approximates centimorgans for short intervals. Three-point crosses reveal gene order and double crossovers; interference compares observed with expected double crossovers. Tetrad analysis directly follows meiotic products, while molecular markers and somatic-cell hybrids locate genes without relying solely on visible phenotypes."]],key:"A two-point value can underestimate distance because even numbers of crossovers restore parental combinations.",exam:"Describe a three-point test cross, identify gene order and calculate interference."},
        {id:"g1l4",title:"Polygenic inheritance and heritability",lead:"Quantitative traits arise from many loci whose effects are filtered through development and environment.",sections:[["Continuous variation","Polygenes contribute small additive or interacting effects, producing a graded distribution rather than discrete classes. Height, body mass and milk yield are typical quantitative traits. Phenotypic variance can be partitioned into genetic, environmental and interaction components; genetic variance may be additive, dominance or epistatic."],["Heritability","Broad-sense heritability H²=Vᴳ/Vᴾ includes all genetic variance. Narrow-sense heritability h²=Vᴬ/Vᴾ isolates additive variance and therefore predicts response to selection: R=h²S. A high heritability applies to a specified population and environment; it does not mean that the trait is genetically fixed or insensitive to environmental change."]],key:"Heritability explains variation among individuals in a population, not the genetic proportion of an individual's trait.",exam:"Differentiate H² and h² and discuss why heritability can change across environments."}
      ]},
      {id:"g2",title:"Molecular and Human Genetics",hours:18,summary:"Gene concepts, mutations, DNA repair, cytogenetics, pedigrees, metabolic disorders and counselling.",flow:["DNA is altered","Damage is sensed","Repair or mutation","Cellular consequence","Clinical interpretation"],revision:["Mutation is heritable sequence change; DNA damage is a chemical lesion.","Karyotypes detect large numerical and structural changes, not single-base variants.","Pedigree probability must include penetrance and family information."],lessons:[
        {id:"g2l1",title:"The gene concept and mutation",lead:"The gene has evolved from an abstract hereditary factor to a regulated DNA unit whose products can be alternatively processed.",sections:[["Changing gene concept","Classical genetics defined a gene by inheritance; biochemical genetics linked genes to enzymes; molecular genetics identified DNA sequences that generate functional RNA or protein. Exons, introns, promoters, enhancers and regulatory RNAs show that a gene is not simply one uninterrupted coding segment. Alternative promoters and splicing allow one locus to generate multiple products."],["Mutation spectrum","Substitutions may be synonymous, missense or nonsense. Insertions and deletions can shift the reading frame, while repeat expansion, transposition and altered splice sites create other outcomes. Germ-line mutations can enter the next generation; somatic mutations create mosaicism and contribute to cancer. Phenotypic effect depends on location, dosage, cellular context and environmental interaction."]],key:"Mutation supplies new heritable variation; selection and drift determine its population fate.",exam:"Classify point mutations and relate each class to possible protein consequences."},
        {id:"g2l2",title:"Mutagens, chromosomal mutation and DNA repair",lead:"Genome stability depends on preventing lesions, accurately repairing them and eliminating cells with irreparable damage.",sections:[["Sources and chromosome changes","Ionising radiation produces strand breaks; ultraviolet light forms pyrimidine dimers; base analogues, alkylating agents and intercalators alter pairing or replication. Chromosomal deletions, duplications, inversions and translocations change structure, whereas aneuploidy and polyploidy change chromosome number. Their effects arise from gene dosage, breakpoint disruption and meiotic imbalance."],["Repair pathways","Direct reversal repairs selected lesions. Base-excision repair removes small damaged bases; nucleotide-excision repair removes bulky helix-distorting lesions. Mismatch repair corrects replication errors. Homologous recombination accurately repairs double-strand breaks using a template, while nonhomologous end joining is quicker but error-prone. Checkpoints coordinate repair with cell-cycle arrest or apoptosis."]],key:"The repair pathway selected depends on lesion type, cell-cycle phase and availability of a homologous template.",exam:"Compare nucleotide-excision repair, mismatch repair and double-strand-break repair."},
        {id:"g2l3",title:"Human chromosomes, karyotyping and pedigree analysis",lead:"Cytogenetic and pedigree methods connect observable family patterns with chromosomal and genetic mechanisms.",sections:[["Cytogenetic tools","A karyotype arranges metaphase chromosomes by size, centromere position and band pattern. G-banding identifies reproducible chromosomal regions; high-resolution banding improves breakpoint localisation. Fluorescence in situ hybridisation uses labelled probes for targeted sequences, and chromosome painting distinguishes whole chromosomes or complex rearrangements. Modern arrays detect smaller copy-number changes but do not replace every cytogenetic method."],["Pedigree reasoning","Autosomal dominant traits usually show vertical transmission and affect both sexes; autosomal recessive traits may skip generations and increase with consanguinity. X-linked recessive traits often affect males and lack father-to-son transmission. Mitochondrial traits pass through affected mothers. Small families, nonpenetrance, variable expression, new mutation and phenocopy can obscure these patterns."]],key:"A pedigree supports a mode of inheritance probabilistically; it rarely proves one without molecular or biochemical confirmation.",exam:"Construct criteria for distinguishing autosomal dominant, X-linked recessive and mitochondrial inheritance."},
        {id:"g2l4",title:"Genetic disorders and counselling",lead:"Inherited disease should be understood from molecular lesion to metabolic pathway, phenotype, diagnosis and family risk.",sections:[["Representative disorders","Phenylketonuria impairs phenylalanine metabolism; alkaptonuria blocks homogentisate breakdown; albinism reduces melanin synthesis; gout involves urate accumulation influenced by purine handling, renal excretion and genetic susceptibility; ADA deficiency compromises lymphocyte survival; Von Gierke disease impairs hepatic glucose release; G6PD deficiency predisposes erythrocytes to oxidative haemolysis. Tay-Sachs and Gaucher diseases are lysosomal storage disorders. Sickle-cell disease alters β-globin structure, while thalassaemia reduces globin-chain synthesis."],["Counselling process","Genetic counselling is nondirective communication that integrates diagnosis, pedigree, recurrence risk, available testing, reproductive choices and psychosocial support. Risk estimates must state assumptions and uncertainty. Informed consent, confidentiality, respect for disability, avoidance of coercion and culturally sensitive communication are essential."]],key:"Accurate counselling separates medical facts and probabilities from the family's autonomous decision.",exam:"Present an integrated account of one inborn error from gene defect to counselling considerations."}
      ]},
      {id:"g3",title:"Population Genetics and Evolution",hours:18,summary:"Allele frequencies, Hardy-Weinberg equilibrium, evolutionary forces, genetic load and polymorphism.",flow:["Count genotypes","Estimate alleles","Set null model","Test deviation","Infer forces"],revision:["Hardy-Weinberg is a null model, not a claim that populations never evolve.","Selection acts on phenotypes but changes allele frequencies.","Drift is strongest when effective population size is small."],lessons:[
        {id:"g3l1",title:"Mendelian populations and Hardy-Weinberg equilibrium",lead:"Population genetics shifts attention from individual crosses to the distribution of alleles through generations.",sections:[["The equilibrium model","For two alleles A and a with frequencies p and q, p+q=1. Under random mating, large population size, no migration, no mutation and no selection, genotype frequencies become p², 2pq and q² after one generation. The expansion (p+q)² gives the expected proportions. The model supplies a baseline against which observed genotype frequencies can be tested."],["Applications and limits","For a recessive phenotype, q² can estimate disease frequency and q its allele frequency when assumptions are reasonable. Codominant markers permit direct allele counting, and multiple-allele loci use the sum of all allele frequencies. Deviations may indicate population structure, inbreeding, genotyping error or evolutionary forces; the model alone does not identify which cause operates."]],key:"Separate allele-frequency calculation from the statistical test of genotype equilibrium.",exam:"Derive the Hardy-Weinberg proportions and solve an autosomal recessive frequency problem."},
        {id:"g3l2",title:"Selection, mutation and migration",lead:"Directional processes introduce alleles or alter their expected reproductive contribution.",sections:[["Selection and fitness","Relative fitness compares genotype contributions to the next generation; the selection coefficient is the proportional fitness reduction. Directional selection favours one extreme, stabilising selection favours intermediates, and disruptive selection favours both extremes. Balancing mechanisms—including heterozygote advantage and frequency-dependent selection—can preserve variation."],["Mutation and gene flow","Mutation is weak per generation but the ultimate source of new alleles. Migration changes allele frequencies when immigrants differ genetically and may oppose local selection. Mutation-selection balance can maintain deleterious recessives at low frequency. Evolutionary outcomes reflect combined forces rather than isolated textbook categories."]],key:"Gene flow homogenises populations at neutral loci but can also introduce adaptive alleles.",exam:"Explain how heterozygote advantage maintains a balanced polymorphism."},
        {id:"g3l3",title:"Genetic drift, effective size and neutral evolution",lead:"Chance sampling can dominate evolutionary change even when alleles have equal fitness.",sections:[["Drift and population size","Genetic drift is random fluctuation caused by finite sampling of gametes. It reduces heterozygosity, increases differentiation and may fix or lose alleles. Founder events and bottlenecks intensify drift. Effective population size depends on sex ratio, variance in reproductive success and fluctuations in census size, and is often much smaller than the number counted."],["Neutralist hypothesis","The neutral theory proposes that much molecular substitution involves selectively neutral or nearly neutral variants fixed by drift. Neutrality does not deny phenotypic adaptation; it distinguishes mechanisms across classes of change. Molecular polymorphism, substitution rate and allele-frequency spectra provide evidence for testing neutral and selective explanations."]],key:"A population can have a large census yet a small effective size and therefore strong drift.",exam:"Differentiate founder effect, bottleneck and continuing drift using their genetic consequences."},
        {id:"g3l4",title:"Genetic load, death and polymorphism",lead:"Population fitness is shaped by deleterious alleles, selection history and mechanisms that maintain diversity.",sections:[["Genetic load","Genetic load is the reduction in mean population fitness relative to an optimal reference genotype. Mutation load, segregation load and substitutional load describe different sources. Genetic death represents failure to contribute genetically to the next generation, not necessarily physical death. The concept must be applied cautiously because fitness is environment-dependent."],["Polymorphism","A genetic polymorphism is the stable occurrence of two or more variants at appreciable frequency. Balanced polymorphism may be maintained by heterozygote advantage, habitat heterogeneity or frequency dependence. Transient polymorphism occurs while one allele replaces another. Protein, DNA-marker and sequence data reveal diversity invisible at the morphological level."]],key:"Persistent polymorphism requires an explanation for why selection or drift has not eliminated alternatives.",exam:"Discuss genetic load and balanced polymorphism without treating fitness as an absolute property."}
      ]},
      {id:"g4",title:"Molecular Evolution and Speciation",hours:18,summary:"Origin-of-life hypotheses, molecular clocks, phylogenetic inference, species concepts and speciation.",flow:["Compare homologues","Choose model","Infer tree","Assess support","Interpret history"],revision:["Homology is common ancestry; similarity alone is not proof.","A molecular clock requires calibration and rate evaluation.","Reproductive isolation can evolve before, during or after geographic separation."],lessons:[
        {id:"g4l1",title:"Origin of life and early molecular evolution",lead:"Origin-of-life research asks how chemical systems acquired compartmentation, information, metabolism and evolvability.",sections:[["Chemical evolution","Plausible pathways include abiotic synthesis of organic molecules, concentration on mineral surfaces or hydrothermal systems, polymer formation and enclosure in protocell membranes. The RNA-world hypothesis is attractive because RNA can store information and catalyse reactions, but it does not by itself solve nucleotide synthesis, replication fidelity or metabolic integration."],["Evidence and inference","Experiments test chemical plausibility, whereas phylogenetic reconstruction addresses later common ancestry. Early Earth evidence is incomplete and later organisms have extensively modified ancient pathways. Strong explanations therefore combine geochemistry, comparative genomics, laboratory chemistry and explicit acknowledgement of unresolved transitions."]],key:"Chemical evolution and biological evolution are connected but methodologically distinct research problems.",exam:"Critically evaluate the RNA-world hypothesis and its unresolved limitations."},
        {id:"g4l2",title:"Molecular clocks and sequence evolution",lead:"Molecular change can estimate time only after rate variation, selection and calibration are addressed.",sections:[["Principle of the clock","If substitutions accumulate at an approximately predictable rate, genetic distance can be related to divergence time. Synonymous sites, proteins and organelle genomes evolve at different rates. Saturation hides multiple substitutions, and purifying or positive selection alters observed patterns. Strict-clock assumptions should therefore be tested against relaxed-clock models."],["Calibration and interpretation","Fossils, geological events and dated biogeographic separations provide calibration points with uncertainty. Orthologous sequences are required for species divergence; paralogues record gene duplication. Estimates should report credible intervals and sensitivity to models, taxa and calibrations rather than a single apparently exact date."]],key:"A molecular clock is a calibrated statistical model, not a universal metronome.",exam:"Describe the assumptions, calibration and major sources of error in molecular dating."},
        {id:"g4l3",title:"Phylogenetic trees and the Universal Tree of Life",lead:"Phylogenetic methods infer branching hypotheses from characters; they do not arrange modern species on a ladder of progress.",sections:[["Tree construction","Distance methods compress differences into pairwise values, while parsimony seeks the tree with the fewest changes. Model-based likelihood and Bayesian methods evaluate explicit substitution processes. Multiple-sequence alignment establishes positional homology; poor alignment can invalidate later analysis. Outgroups root a tree, and bootstrap or posterior support evaluates clade stability."],["Reading trees","Nodes represent common ancestors, tips are sampled lineages and rotations around a node do not change relationships. Branch length may represent change or time depending on the tree. Ribosomal RNA comparisons revealed three major domains—Bacteria, Archaea and Eukarya—while horizontal gene transfer shows that different genes can have different histories."]],key:"Interpret sister groups and common ancestors from branching order, not from left-to-right tip position.",exam:"Compare distance and parsimony approaches and explain how support for a clade is assessed."},
        {id:"g4l4",title:"Species concepts, speciation and adaptive radiation",lead:"Speciation is the evolutionary formation of independently evolving lineages, often through multiple isolating barriers.",sections:[["Species and isolation","The biological concept emphasises reproductive isolation, the phylogenetic concept emphasises diagnosable ancestry and the ecological concept emphasises niche. No single concept works equally well for fossils, asexuals and hybridising populations. Prezygotic barriers prevent mating or fertilisation; postzygotic barriers reduce hybrid survival or fertility."],["Geographic modes","Allopatric speciation begins with geographic separation and divergence through selection and drift. Sympatric speciation occurs without a geographic barrier through mechanisms such as polyploidy, host shift or assortative mating. Adaptive radiation is rapid lineage diversification associated with ecological opportunity, key innovation or colonisation of new environments."]],key:"Allopatry and sympatry describe geography; the genetic mechanisms of isolation still require demonstration.",exam:"Compare allopatric and sympatric speciation and relate adaptive radiation to ecological opportunity."}
      ]},
      {id:"g5",title:"Higher Categories and Primate Evolution",hours:18,summary:"Evolutionary tempo, macroevolution, coevolution, primate origins, hominins and human behavioural evolution.",flow:["Variation arises","Lineages diverge","Innovations spread","Clades diversify","Traits are reconstructed"],revision:["Micro- and macroevolution differ in scale, not in exemption from population processes.","Punctuated equilibrium concerns temporal pattern, not instantaneous speciation.","Human evolution is branching and mosaic, not a linear march."],lessons:[
        {id:"g5l1",title:"Microevolution, macroevolution and higher categories",lead:"Patterns above the species level emerge from lineage origination, transformation and extinction across deep time.",sections:[["Evolutionary scales","Microevolution tracks allele-frequency change within populations. Macroevolution studies patterns among species and clades, while mega-evolution is a historical term for major organisational transitions. Higher categories are retrospective groupings of branching lineages, not evolutionary goals. Developmental constraints, key innovations, ecological opportunity and mass extinction influence large-scale diversity."],["Rates and trends","Evolutionary rate can refer to molecular substitution, morphological change or lineage diversification, so units must be specified. A trend may arise through persistent change within lineages or differential proliferation and extinction among lineages. Apparent direction does not imply foresight or inevitable progress."]],key:"Large-scale patterns require both population-level mechanisms and lineage-level birth–death history.",exam:"Explain how macroevolutionary trends can arise without invoking evolutionary purpose."},
        {id:"g5l2",title:"Gradualism, punctuated equilibrium and coevolution",lead:"Evolution varies in tempo, and reciprocal selection can couple the trajectories of interacting species.",sections:[["Tempo of change","Phyletic gradualism predicts cumulative transformation within lineages. Punctuated equilibrium predicts long morphological stasis interrupted by comparatively rapid change associated with speciation. Rapid is geological rather than instantaneous. Fossil sampling, trait choice and time resolution must be considered before the patterns are contrasted."],["Coevolution","Coevolution occurs when interacting populations impose reciprocal selection. Host–parasite arms races, plant–pollinator matching and mimicry systems are examples, but reciprocal evolutionary evidence is required; interaction alone is insufficient. Geographic mosaic theory recognises that selection strength and gene flow vary among populations."]],key:"Punctuated equilibrium and gradualism can describe different clades, traits or intervals within one history.",exam:"Critically compare gradualism and punctuated equilibrium using fossil evidence."},
        {id:"g5l3",title:"Primate origins and anthropoid evolution",lead:"Primate history is reconstructed from fossils, comparative anatomy, behaviour and molecular phylogeny.",sections:[["Primate foundations","Characteristic tendencies include grasping extremities, nails, enhanced stereoscopic vision, flexible limbs, prolonged development and complex social learning. Primates divide broadly into strepsirrhines and haplorhines; anthropoids include New World monkeys, Old World monkeys and apes. Shared derived characters and molecular data, not superficial resemblance, establish relationships."],["Interpreting fossils","Early primate and anthropoid fossils are mosaics of ancestral and derived traits. Dating, stratigraphic context and phylogenetic analysis constrain interpretation. Modern apes are relatives rather than ancestors of humans; humans and chimpanzees share a common ancestral population."]],key:"Primate phylogeny is branching; no living species is a surviving lower stage of another.",exam:"Summarise the evidence used to reconstruct anthropoid primate evolution."},
        {id:"g5l4",title:"Hominins, bipedalism, language and morality",lead:"Human evolution combined locomotor, dietary, cognitive, technological and social changes at different rates.",sections:[["Hominin sequence","Australopithecines show habitual bipedalism with relatively small brains. The genus Homo includes a diverse branching record with changes in body proportions, brain organisation, dispersal and technology. Bipedalism altered the pelvis, vertebral column, lower limb and foot; competing explanations include energetic efficiency, thermoregulation and transport, none acting alone."],["Communication and social evolution","Speech depends on neural control, vocal anatomy, auditory processing and learned symbolic systems. Language leaves limited direct fossil evidence, so inference uses endocasts, archaeology, genetics and comparative cognition. Altruism can evolve through kin selection, reciprocity, mutualism and group-structured processes. Moral systems add cultural transmission and normative judgement to evolved social capacities."]],key:"Human traits evolved mosaically and through gene–culture interaction, not as one package appearing at a single moment.",exam:"Discuss bipedalism and language as mosaic adaptations in human evolution."}
      ]}
    ]
  },
  {
    id:"physiology",code:"ZP233CC2",title:"Advanced Animal Physiology",kind:"Core Course VI",hours:90,color:"#087c78",
    description:"Integrated human and comparative physiology from nutrition and homeostasis to circulation, neural control, excretion and reproduction.",
    units:[
      {id:"p1",title:"Nutrition and Digestion",hours:18,summary:"Feeding strategies, gastrointestinal structure, motility, secretion, absorption and major digestive disorders.",flow:["Food acquisition","Mechanical processing","Enzymatic hydrolysis","Epithelial absorption","Metabolic distribution"],revision:["Digestive compartments match diet and feeding mode.","Motility mixes, stores and propels under neural and hormonal control.","Absorption depends on surface area, gradients and specific transporters."],lessons:[
        {id:"p1l1",title:"Types of nutrition and feeding mechanisms",lead:"Animal feeding systems connect ecological opportunity with specialised capture, processing and digestive structures.",sections:[["Nutritional modes","Animals are heterotrophs that obtain carbon and energy by ingesting other organisms or organic matter. Herbivory, carnivory, omnivory, detritivory, fluid feeding, deposit feeding and suspension feeding impose different mechanical and biochemical demands. Intracellular digestion dominates in simple forms, while extracellular digestion in a cavity or complete gut permits regional specialisation."],["Functional adaptation","Filter feeders coordinate current generation with particle retention; predators integrate sensory detection, capture and handling; herbivores rely on prolonged retention, grinding and microbial fermentation to exploit cellulose. Feeding mechanism, gut architecture, symbionts and enzyme repertoire should be analysed as a functional system rather than as isolated structures."]],key:"Feeding is an ecological process; digestion is the mechanical and chemical conversion that follows acquisition.",exam:"Compare suspension feeding, predation and herbivory in relation to digestive specialisation."},
        {id:"p1l2",title:"Functional anatomy and gastrointestinal movement",lead:"The mammalian alimentary canal is a regionalised muscular tube coordinated by intrinsic and extrinsic neural circuits.",sections:[["Regional organisation","The oral cavity initiates processing, the oesophagus transports, the stomach stores and acidifies, the small intestine completes digestion and absorbs, and the large intestine recovers water and houses dense microbiota. Mucosa, submucosa, muscularis externa and serosa form the basic wall plan. Villi and microvilli greatly amplify intestinal surface area."],["Motility","Swallowing, receptive relaxation, gastric mixing, peristalsis, segmentation and mass movements are generated by smooth muscle, interstitial cells of Cajal and the enteric nervous system. Parasympathetic activity generally promotes digestion; sympathetic activity suppresses it. Distension and chemical composition activate local reflexes that match motility to luminal conditions."]],key:"Peristalsis propels contents; segmentation primarily mixes them and renews contact with the absorptive surface.",exam:"Relate layers of the gastrointestinal wall to peristalsis and segmentation."},
        {id:"p1l3",title:"Secretions, digestion and absorption",lead:"Digestive secretions create the pH, enzymes and emulsifying conditions required to convert food into transportable molecules.",sections:[["Secretory integration","Saliva lubricates and initiates carbohydrate digestion. Gastric acid denatures proteins and activates pepsin; mucus and bicarbonate protect the epithelium. Pancreatic enzymes digest carbohydrates, proteins, lipids and nucleic acids, while bicarbonate neutralises acid. Bile salts emulsify fat and form micelles. Secretin, cholecystokinin, gastrin and neural reflexes coordinate delivery."],["Transport across the intestine","Monosaccharides and amino acids use carrier-mediated systems, often linked to sodium gradients. Fatty acids and monoacylglycerols enter enterocytes from micelles, are re-esterified and exported as chylomicrons through lymph. Water follows osmotic gradients; electrolytes, vitamins and minerals use region-specific pathways. The portal circulation carries most water-soluble products to the liver."]],key:"Luminal digestion, brush-border digestion and epithelial transport are distinct but coupled stages.",exam:"Trace dietary lipid from emulsification to entry into systemic circulation."},
        {id:"p1l4",title:"Gastrointestinal and hepatobiliary disorders",lead:"Disorders become intelligible when structural damage is connected to altered secretion, motility, obstruction or inflammation.",sections:[["Upper and intestinal disorders","Gastritis reflects gastric mucosal inflammation, commonly associated with Helicobacter pylori or irritants. Peptic ulcers arise when damaging influences exceed mucosal defence. Appendicitis typically follows luminal obstruction and inflammation. Symptoms overlap, so clinical diagnosis cannot be made from pain location alone."],["Liver and gallbladder","Gallstones form when bile components precipitate and may obstruct biliary flow. Liver cirrhosis is diffuse fibrosis with regenerative nodules that distort hepatic architecture, impair synthetic and detoxifying functions, and increase portal resistance. Prevention and treatment depend on cause; the educational focus is physiological consequence, not self-diagnosis."]],key:"Link each disorder to the normal function lost: barrier integrity, flow, secretion, metabolism or vascular organisation.",exam:"Compare the physiological basis of peptic ulcer, gallstones and cirrhosis."}
      ]},
      {id:"p2",title:"Respiration and Homeostasis",hours:18,summary:"Gas exchange and its control, respiratory disease, osmo- and thermoregulation, extreme environments and bioluminescence.",flow:["Ventilation","Diffusion","Blood transport","Tissue exchange","Feedback control"],revision:["Partial-pressure gradients drive gas diffusion.","Homeostasis uses sensors, integrators and effectors around regulated variables.","Extreme-environment physiology balances performance against physical limits."],lessons:[
        {id:"p2l1",title:"Respiratory anatomy, ventilation and gas exchange",lead:"Efficient respiration requires bulk flow to exchange surfaces and diffusion across a thin, large and well-perfused barrier.",sections:[["Ventilation mechanics","Conducting airways condition and distribute air; respiratory bronchioles and alveoli provide exchange area. Diaphragmatic contraction lowers intrathoracic pressure during quiet inspiration. Elastic recoil supports expiration. Surfactant lowers surface tension and stabilises small alveoli. Compliance and airway resistance determine the work of breathing."],["Diffusion and matching","Oxygen and carbon dioxide move down partial-pressure gradients. Diffusing capacity depends on area, thickness, solubility and pressure difference. Ventilation–perfusion matching maximises exchange; shunt and dead space represent mismatches. Comparative organs—gills, tracheae and lungs—solve the same transport problem under different physical constraints."]],key:"Ventilation moves the medium; diffusion crosses the respiratory membrane; perfusion carries gases away.",exam:"Apply Fick's principle to explain efficient alveolar gas exchange."},
        {id:"p2l2",title:"Transport and regulation of respiratory gases",lead:"Blood chemistry and neural feedback stabilise tissue gas delivery despite changing activity and environment.",sections:[["Gas transport","Most oxygen binds reversibly to haemoglobin. The dissociation curve shifts right with increased carbon dioxide, acidity, temperature and 2,3-BPG, facilitating tissue unloading. Carbon dioxide travels dissolved, as carbamino compounds and mainly as bicarbonate formed through carbonic anhydrase; chloride shift maintains electrical balance."],["Control of breathing","Medullary networks generate respiratory rhythm, while pontine centres shape it. Central chemoreceptors respond strongly to carbon-dioxide-driven changes in cerebrospinal fluid pH; peripheral carotid and aortic bodies respond to low arterial oxygen, carbon dioxide and pH. Pulmonary receptors and voluntary pathways modify the automatic pattern."]],key:"At sea level, rising carbon dioxide is normally a stronger ventilatory stimulus than modest oxygen change.",exam:"Explain the oxyhaemoglobin dissociation curve and its physiological shifts."},
        {id:"p2l3",title:"Respiratory disorders and physiological disruption",lead:"Asthma, pneumonia and tuberculosis impair ventilation or diffusion through different mechanisms.",sections:[["Obstructive and infectious patterns","Bronchial asthma involves variable airway inflammation, hyperresponsiveness and reversible narrowing, increasing expiratory resistance. Pneumonia fills or thickens alveolar regions with inflammatory material, disturbing diffusion and ventilation–perfusion matching. Pulmonary tuberculosis produces chronic granulomatous tissue injury and may cause cavitation and fibrosis."],["Functional interpretation","Dyspnoea and reduced oxygenation can result from obstruction, reduced compliance, lost exchange area, shunt or diffusion limitation. Spirometry distinguishes airflow patterns, while imaging and microbiological tests address structure and cause. Infection control and professional diagnosis are essential; this lesson explains mechanisms rather than prescribing treatment."]],key:"Similar symptoms can arise from different physiological defects, so mechanism-based testing matters.",exam:"Compare how asthma, pneumonia and tuberculosis impair respiratory function."},
        {id:"p2l4",title:"Homeostasis, extreme environments and bioluminescence",lead:"Animals maintain internal function by regulated exchange while adapting to pressure, temperature and oxygen challenges.",sections:[["Osmotic and thermal regulation","Osmoconformers approximate environmental osmolarity; osmoregulators maintain internal conditions through epithelia, kidneys and ion transport. Endotherms generate substantial metabolic heat; ectotherms depend more strongly on environmental sources, though both use behavioural and physiological regulation. Countercurrent exchange and evaporative cooling illustrate specialised heat control."],["Environmental physiology and light production","Deep-sea animals face pressure, cold, darkness and limited food; high altitude imposes hypobaric hypoxia; spaceflight alters loading, fluid distribution and circadian cues. Bioluminescence commonly results from luciferin oxidation catalysed by luciferase or photoproteins. It functions in camouflage, signalling, prey attraction and defence, often with microbial symbionts."]],key:"Adaptation is inherited population change; acclimatisation is a reversible individual response.",exam:"Integrate high-altitude acclimatisation with oxygen transport and ventilatory control."}
      ]},
      {id:"p3",title:"Circulation",hours:18,summary:"Blood formation and clotting, cardiac organisation, cardiac cycle, regulation, vascular disease and lymph.",flow:["Electrical excitation","Mechanical contraction","Pressure gradient","Directed blood flow","Tissue exchange"],revision:["Pacemaker depolarisation initiates rhythm; conduction coordinates chambers.","Flow depends on pressure difference and resistance.","Haemostasis limits blood loss but pathological thrombosis obstructs vessels."],lessons:[
        {id:"p3l1",title:"Haemopoiesis and blood clotting",lead:"Blood-cell production and haemostasis are dynamic systems balancing replacement, defence and vascular integrity.",sections:[["Blood-cell formation","Adult haemopoiesis occurs mainly in bone marrow from multipotent haematopoietic stem cells. Erythropoietin promotes red-cell production during hypoxia; thrombopoietin supports megakaryocytes and platelets; colony-stimulating factors regulate leucocyte lineages. Differentiation and cell removal maintain population sizes suited to physiological demand."],["Haemostasis","Vascular injury causes vasoconstriction, platelet adhesion and activation, followed by a fibrin-stabilised coagulation cascade. Tissue factor initiates the major physiological pathway; thrombin amplifies coagulation and converts fibrinogen to fibrin. Antithrombin, protein C pathways and fibrinolysis constrain the clot. Failure causes bleeding; inappropriate activation causes thrombosis."]],key:"Primary haemostasis builds a platelet plug; secondary haemostasis stabilises it with fibrin.",exam:"Trace haemostasis from endothelial injury to clot dissolution."},
        {id:"p3l2",title:"Heart types, human cardiac anatomy and cycle",lead:"Cardiac design coordinates filling and ejection while valves preserve one-way pressure-driven flow.",sections:[["Myogenic and neurogenic hearts","In myogenic hearts, rhythmicity originates in cardiac muscle or specialised pacemaker tissue, as in vertebrates. In neurogenic hearts, neural activity initiates each beat, as in many arthropods. The human sinoatrial node drives atrial depolarisation; the atrioventricular node delays conduction before the His–Purkinje system activates ventricles."],["The cardiac cycle","Ventricular filling, isovolumetric contraction, ejection and isovolumetric relaxation follow pressure changes. Atrioventricular and semilunar valves open passively when pressure gradients favour flow. Heart sounds mainly reflect valve closure and vibration. Stroke volume, heart rate and cardiac output connect the cycle to systemic demand."]],key:"Valves do not actively pull open; pressure differences determine their state.",exam:"Correlate ECG events, pressure changes, valve movements and heart sounds during one cardiac cycle."},
        {id:"p3l3",title:"Cardiovascular regulation and clinical assessment",lead:"Neural, hormonal and local mechanisms match pressure and flow to organ needs.",sections:[["Short- and long-term control","Baroreceptors in the carotid sinus and aortic arch rapidly adjust autonomic output when arterial pressure changes. Sympathetic activity increases heart rate, contractility and selected vascular tone; vagal activity slows the heart. Local metabolites dilate active tissues. Renin–angiotensin–aldosterone, vasopressin and renal salt-water balance provide longer-term volume and pressure control."],["Angiogram and angioplasty","Angiography visualises vessel lumens using contrast and imaging. Angioplasty opens a narrowed artery with a balloon and often a stent, improving flow but not removing the systemic causes of atherosclerosis. These procedures involve benefits and risks and belong to specialised clinical care."]],key:"Mean arterial pressure is shaped chiefly by cardiac output and total peripheral resistance.",exam:"Explain the baroreceptor reflex and distinguish it from long-term renal regulation."},
        {id:"p3l4",title:"Atherosclerosis, thrombosis, angina and lymph",lead:"Vascular pathology changes perfusion, while the lymphatic system returns interstitial fluid and supports immune surveillance.",sections:[["Cardiovascular disease","Atherosclerosis is a chronic inflammatory process involving lipid retention, endothelial dysfunction and plaque formation. Plaque rupture can trigger coronary thrombosis and acute ischaemia. Angina pectoris is chest discomfort from transient myocardial oxygen imbalance; it is a manifestation, not a single anatomical lesion."],["Lymphatic organisation","Blind-ended lymphatic capillaries collect excess interstitial fluid, proteins and absorbed intestinal lipids. Larger vessels pass lymph through nodes and return it to the venous circulation. Lymph contains fluid, solutes, lipids and immune cells. Obstruction or failure causes oedema, showing its central role in fluid balance."]],key:"The lymphatic circulation is a one-way return route without a central pump.",exam:"Relate plaque development and thrombosis to coronary blood flow, then explain lymphatic fluid return."}
      ]},
      {id:"p4",title:"Neuromuscular System and Sense Organs",hours:18,summary:"Neurons, synapses, impulse conduction, reflexes, EEG/MRI, neural disorders, muscle contraction, skin and eye.",flow:["Stimulus","Membrane potential","Synaptic integration","Motor output","Feedback"],revision:["Action potentials are all-or-none; firing frequency encodes intensity.","Synapses transform and integrate signals.","Calcium couples electrical excitation to muscle contraction."],lessons:[
        {id:"p4l1",title:"Neurons, action potentials and conduction",lead:"Neurons communicate by controlled ion movement across excitable membranes.",sections:[["Resting and active membranes","The resting potential reflects selective permeability, potassium leak and ionic gradients maintained by the sodium–potassium pump. Threshold opening of voltage-gated sodium channels produces rapid depolarisation; sodium-channel inactivation and potassium efflux repolarise the membrane. Refractory periods enforce direction and limit firing frequency."],["Propagation","Local current brings adjacent membrane to threshold. Myelin increases membrane resistance and decreases capacitance, allowing saltatory conduction between nodes of Ranvier. Axon diameter also increases conduction speed. Demyelination disrupts timing and may block transmission even when the axon remains physically present."]],key:"The pump maintains gradients over time; voltage-gated channels generate the rapid action potential.",exam:"Explain the ionic basis of an action potential and saltatory conduction."},
        {id:"p4l2",title:"Synapses, neurotransmitters, reflexes, EEG and MRI",lead:"Neural function emerges from synaptic integration across circuits rather than isolated impulses.",sections:[["Chemical transmission and reflexes","Presynaptic calcium entry triggers vesicle fusion and transmitter release. Receptors produce excitatory or inhibitory postsynaptic potentials; spatial and temporal summation determine whether threshold is reached. A reflex arc includes receptor, afferent pathway, integrating centre, efferent pathway and effector, with descending control able to modify the response."],["Recording and imaging","Electroencephalogram (EEG) records summed cortical electrical activity at the scalp with high temporal but limited spatial resolution. MRI uses nuclear magnetic properties and radiofrequency signals to create structural images; functional MRI infers activity from blood-oxygen-level changes. Neither technique directly reads thoughts, and each answers different physiological questions."]],key:"EEG measures electrical field patterns; MRI primarily reconstructs tissue structure or haemodynamic contrast.",exam:"Compare EEG and MRI in physiological basis, resolution and application."},
        {id:"p4l3",title:"Neural disorders and skeletal-muscle contraction",lead:"Disordered neural activity and impaired muscle activation reveal the importance of coordinated excitation.",sections:[["Meningitis and epilepsy","Meningitis is inflammation of the meninges, often infectious, and can rapidly impair nervous-system function. Epilepsy is a tendency to recurrent unprovoked seizures arising from abnormal network synchrony; it is not a single cause or one seizure type. Both require professional diagnosis and may involve urgent care."],["Excitation–contraction coupling","A motor-neuron action potential releases acetylcholine at the neuromuscular junction. The muscle action potential enters T tubules, triggering sarcoplasmic-reticulum calcium release. Calcium binds troponin, moves tropomyosin and permits actin–myosin cross-bridge cycling powered by ATP. Calcium reuptake produces relaxation."]],key:"ATP is required for cross-bridge cycling and for restoring calcium and ion gradients.",exam:"Trace events from motor-neuron firing to skeletal-muscle relaxation."},
        {id:"p4l4",title:"Skin and eye as sensory systems",lead:"Sense organs convert specific physical or chemical energy into neural signals interpreted by the brain.",sections:[["Skin receptors","The skin contains free nerve endings and specialised receptors contributing to touch, pressure, vibration, temperature, pain and proprioceptive context. Receptive-field size and adaptation rate determine sensitivity to spatial detail and sustained stimulation. Sensation depends on labelled neural pathways and central integration, not on the receptor alone."],["Vision","The cornea and lens focus light on the retina. Rods support high sensitivity in dim light; cones support colour and high acuity. Phototransduction hyperpolarises photoreceptors when light activates opsin pathways. Retinal circuits perform early contrast processing before ganglion-cell axons form the optic nerve. Accommodation changes lens shape for near vision."]],key:"A receptor transduces energy; perception is the nervous system's constructed interpretation.",exam:"Explain retinal phototransduction and compare rods with cones."}
      ]},
      {id:"p5",title:"Excretion and Reproduction",hours:18,summary:"Nitrogenous waste, renal function, urine formation, micturition, renal disorders and human reproductive physiology.",flow:["Filtration","Selective reabsorption","Tubular secretion","Concentration","Excretion"],revision:["Excretory product reflects water availability, toxicity and energy cost.","The nephron filters broadly then selectively modifies filtrate.","Reproduction is coordinated by hypothalamic, pituitary and gonadal feedback."],lessons:[
        {id:"p5l1",title:"Excretory patterns, kidney and nephron",lead:"Excretion removes metabolic wastes while kidneys regulate volume, osmolarity, ions, acid–base balance and endocrine signals.",sections:[["Nitrogenous strategies","Ammonotelic animals excrete highly soluble ammonia, usually with abundant water. Ureotelic animals convert ammonia to urea, balancing toxicity and water use. Uricotelic animals excrete uric acid with minimal water loss at greater energetic cost. Habitat, development and phylogeny influence the strategy."],["Renal organisation","Each nephron includes a renal corpuscle, proximal tubule, loop of Henle, distal tubule and collecting system. Cortical and juxtamedullary nephrons differ in loop length. The juxtaglomerular apparatus links tubular sodium delivery with renin release and filtration control. Renal blood flow is arranged for filtration and countercurrent exchange."]],key:"Kidneys are regulatory organs; waste removal is only one component of their work.",exam:"Compare ammonotelism, ureotelism and uricotelism, then outline nephron organisation."},
        {id:"p5l2",title:"Urine formation, countercurrent mechanism and micturition",lead:"Filtration is followed by highly selective tubular transport and variable water recovery.",sections:[["Filtration and transport","Glomerular pressure filters water and small solutes while retaining cells and most proteins. Proximal tubules reclaim most filtered load. The loop of Henle establishes a medullary osmotic gradient through countercurrent multiplication; vasa recta preserve it by exchange. Aldosterone promotes sodium recovery, and vasopressin increases collecting-duct water permeability."],["Micturition","Bladder filling activates stretch receptors. Spinal parasympathetic pathways contract detrusor muscle and relax the internal outlet, while higher centres and somatic control regulate the external sphincter. Continence and voiding therefore require coordinated autonomic, somatic and central mechanisms."]],key:"The loop builds the gradient; the vasa recta preserve it; the collecting duct uses it under hormonal control.",exam:"Explain countercurrent multiplication and the role of vasopressin in concentrated urine."},
        {id:"p5l3",title:"Renal disorders, calculi and dialysis",lead:"Loss of filtration or flow disturbs nearly every regulated component of the internal environment.",sections:[["Nephritis and calculi","Nephritis denotes inflammatory renal injury and can reduce filtration or cause blood and protein to enter urine. Renal calculi form when urinary solutes supersaturate, nucleate and grow; obstruction produces pain and may damage the kidney. Composition and cause vary, so prevention is not one universal rule."],["Dialysis","Haemodialysis moves solutes and water across an artificial semipermeable membrane between blood and dialysate; peritoneal dialysis uses the peritoneum as the exchange surface. Diffusion removes small solutes and controlled pressure removes fluid. Dialysis replaces selected excretory functions but not all endocrine and homeostatic roles of healthy kidneys."]],key:"Dialysis is selective physicochemical replacement, not complete biological kidney function.",exam:"Compare haemodialysis and peritoneal dialysis using diffusion and ultrafiltration."},
        {id:"p5l4",title:"Gonads, cycles, pregnancy, parturition and lactation",lead:"Human reproduction is regulated through cyclic endocrine feedback and tissue interactions from gametogenesis to parental investment.",sections:[["Gonads and cycles","Testes contain seminiferous tubules for spermatogenesis and Leydig cells for testosterone. Ovarian follicles support oocyte development and steroid production. In the menstrual cycle, follicular oestrogen prepares the endometrium and sustained high oestrogen triggers the LH surge and ovulation; the corpus luteum then produces progesterone. The oestrous cycle differs in receptivity and endometrial handling among mammals."],["Pregnancy and birth","Implantation establishes maternal–embryonic signalling; human chorionic gonadotropin maintains the early corpus luteum and the placenta later produces key hormones. Parturition involves uterine activation and positive feedback through cervical stretch and oxytocin. Prolactin supports milk production and oxytocin milk ejection; suckling maintains neuroendocrine responses."]],key:"Negative feedback regulates most of the cycle, while the preovulatory LH surge and labour use positive feedback.",exam:"Integrate the ovarian, uterine and pituitary events of the menstrual cycle."}
      ]}
    ]
  },
  {
    id:"behaviour",code:"ZP233EC1",title:"Animal Behaviour and Chronobiology",kind:"Elective Course V(a)",hours:60,color:"#b35a16",
    description:"Mechanistic, developmental, ecological and evolutionary analysis of behaviour, cognition and biological timekeeping.",
    units:[
      {id:"b1",title:"Understanding Animal Behaviour",hours:12,summary:"Questions, methods, genetic and environmental influences, social interaction, ethology and behavioural recording.",flow:["Define behaviour","Form hypothesis","Record objectively","Analyse pattern","Explain at four levels"],revision:["Proximate and ultimate questions are complementary.","Heritability describes population variation, not behavioural immutability.","An ethogram must define observable categories before sampling."],lessons:[
        {id:"b1l1",title:"Significance and approaches to behavioural study",lead:"Behaviour is an organism's coordinated response to internal state and external information, studied from mechanism to evolutionary function.",sections:[["Four complementary questions","Tinbergen's framework asks about mechanism, development, function and phylogeny. Mechanism includes sensory, neural, endocrine and muscular processes; ontogeny follows behavioural change over a lifetime; function evaluates consequences for survival and reproduction; phylogeny reconstructs evolutionary history. A complete explanation does not replace one level with another."],["Study designs","Observation describes natural patterns, experiments manipulate candidate causes and comparative methods test evolutionary associations across species. Field realism and laboratory control offer different strengths. Good behavioural science uses operational definitions, appropriate controls, adequate sampling, blinding where feasible and respect for animal welfare."]],key:"Avoid saying a behaviour occurs 'because it is adaptive' without testing mechanism and fitness consequences.",exam:"Apply Tinbergen's four questions to bird song or parental care."},
        {id:"b1l2",title:"Genetic basis, heritability and habitat effects",lead:"Genes influence behavioural reaction norms through development; environments determine which possibilities are expressed.",sections:[["Genetic analysis","Selection lines, cross-fostering, common-garden experiments, pedigrees, quantitative-genetic models and molecular methods help separate inherited and environmental contributions. Heritability of behaviour estimates a population variance component, not an individual's genetic determination. Behaviour is often polygenic and context-sensitive. Gene expression in neural and endocrine pathways can alter thresholds, timing or learning rather than encoding a fixed action in isolation."],["Habitat and plasticity","Light, temperature, food distribution, predation and social density change costs and information. Phenotypic plasticity allows one genotype to produce different behaviour across environments; a reaction norm describes that pattern. Developmental experience can have lasting organisational effects, while immediate context produces activational changes."]],key:"Genetic influence and environmental responsiveness are compatible; they are not opposite explanations.",exam:"Design a cross-fostering or common-garden study for a behavioural difference."},
        {id:"b1l3",title:"Ethology, social shaping and behavioural recording",lead:"Reliable behavioural evidence begins with a clear ethogram and a sampling rule matched to the research question.",sections:[["Social context and ethology","Classical ethology emphasised species-typical behaviour in natural settings, including sign stimuli, fixed-action patterns and motivation. Modern work integrates learning, cognition and plasticity. Conspecifics can facilitate, inhibit or socially transmit behaviour, creating feedback between individual decisions and group structure."],["Recording methods","Focal-animal sampling records one subject intensively; scan sampling records states across a group; all-occurrence sampling targets rare events. Continuous recording preserves sequence and duration, whereas interval methods trade detail for feasibility. Inter-observer reliability, clear state–event distinctions and avoidance of anthropomorphic labels strengthen the record."]],key:"Select the sampling method before observation and report what could have been missed.",exam:"Prepare an ethogram and sampling plan for a captive social mammal."}
      ]},
      {id:"b2",title:"Evolution and Social Behaviour",hours:12,summary:"Natural and sexual selection, altruism, mating systems, social organisation, communication, group living and parental care.",flow:["Trait varies","Fitness differs","Signals and strategies interact","Social structure emerges","Frequencies change"],revision:["Sexual selection can oppose survival selection.","Altruistic acts require inclusive-fitness accounting.","Signals must be analysed through production, transmission, reception and response."],lessons:[
        {id:"b2l1",title:"Natural selection, sexual selection and mating systems",lead:"Behavioural strategies evolve when their lifetime reproductive consequences differ and variation is heritable.",sections:[["Selection on behaviour","Natural selection favours context-dependent strategies that increase inclusive fitness, not necessarily maximum immediate survival. Sexual selection operates through competition for mates and mate choice. Anisogamy, operational sex ratio, parental investment and resource distribution influence the intensity and direction of selection."],["Mating systems","Monogamy, polygyny, polyandry and promiscuity describe patterns of mating association, not automatic genetic parentage. Ecological constraints, mate-guarding, resource defence and care requirements shape systems. Alternative reproductive tactics may be condition-dependent or maintained by frequency-dependent selection."]],key:"A mating-system label is a starting description; mechanisms and actual reproductive success require measurement.",exam:"Relate parental investment and operational sex ratio to sexual selection."},
        {id:"b2l2",title:"Altruism, group living and social organisation",lead:"Social behaviours are evaluated through direct fitness, effects on relatives and repeated interactions.",sections:[["Evolution of cooperation","Kin selection is expressed through Hamilton's rule, rB>C, where genetic relatedness weights the recipient's benefit. Reciprocal altruism requires repeated interaction, recognition and protection against persistent cheating. Mutualism benefits participants immediately, while by-product benefits arise incidentally. Group selection claims require careful comparison with within-group processes."],["Costs and organisation","Groups can improve predator detection, defence, information transfer and cooperative care, but also increase competition, disease and reproductive conflict. Dominance, territoriality, dispersal and fission–fusion dynamics organise access. Social structure emerges from repeated individual interactions constrained by ecology and life history."]],key:"Do not infer altruism from appearance; quantify costs, benefits and recipients.",exam:"Use Hamilton's rule and reciprocity to compare two routes to cooperation."},
        {id:"b2l3",title:"Perception, communication and parental care",lead:"Communication succeeds when a produced signal changes receiver behaviour in a way shaped by selection.",sections:[["Signals and sensory ecology","Visual, acoustic, chemical, tactile and electrical signals differ in range, persistence, directionality and habitat performance. Sensory systems filter available information; ultraviolet patterns, low-frequency sound or chemical trails may be invisible to human observers. Honest signals can be maintained by cost, physical constraint or shared interest, while deception remains possible."],["Parental care","Care includes guarding, provisioning, brooding, transport and teaching-like facilitation. Its evolution depends on offspring need, certainty of parentage, future reproductive opportunities and partner response. Conflict occurs between parents and offspring and between caregiving partners. Visual adaptations and signalling must be studied in the physical environment where they function."]],key:"A cue provides information incidentally; a signal has been shaped or maintained for communication.",exam:"Analyse one communication system from signal production to receiver response."}
      ]},
      {id:"b3",title:"Animals and the Environment",hours:12,summary:"Habitat selection, orientation, homeostasis, environmental change, learning, foraging, competition and stress.",flow:["Sample environment","Integrate internal state","Learn or orient","Choose action","Update future choice"],revision:["Habitat preference may create an ecological trap in a changed environment.","Learning changes behaviour through experience; performance can conceal learning.","Optimality models define a benchmark under stated constraints."],lessons:[
        {id:"b3l1",title:"Habitat selection, orientation and coordination",lead:"Animals select habitats through imperfect information, inherited preferences, experience and current physiological state.",sections:[["Choice and movement","Habitat selection operates hierarchically from geographic range to microhabitat. Ideal-free models provide useful null expectations but real animals face dominance, travel cost and information limits. Orientation maintains a bearing; navigation determines position and route. Sun compasses, star patterns, landmarks, odours and geomagnetic cues may be integrated."],["Coordination with environment","Circadian and seasonal programmes anticipate predictable change, while taxis and kinesis respond directly. Sensory calibration and path integration support return journeys. Anthropogenic change can decouple evolved preferences from fitness, producing ecological traps such as attraction to misleading light or unsuitable breeding cues."]],key:"Demonstrating navigation requires excluding simple trail following or fixed compass orientation.",exam:"Compare compass orientation, path integration and true navigation."},
        {id:"b3l2",title:"Conditioning, learning and cognition",lead:"Learning changes future behaviour through experience, while cognition refers to information acquisition, representation and use.",sections:[["Learning mechanisms","Habituation reduces response to repeated harmless stimulation; sensitisation increases responsiveness. Classical conditioning links predictive stimuli, while operant conditioning links actions with consequences. Latent learning, social learning and imprinting show that reinforcement is not the only route. Controls must distinguish learning from fatigue, sensory adaptation and motivational change."],["Cognitive interpretation","Memory includes acquisition, consolidation, retention and retrieval. Spatial maps, categorisation, numerical discrimination and problem solving are tested with species-appropriate tasks. A simpler associative explanation should be considered, but 'simple' does not mean uninteresting. Performance reflects perception, motivation and motor ability as well as cognitive capacity."]],key:"Design tasks around the animal's sensory world instead of forcing a human-centred test.",exam:"Differentiate habituation, classical conditioning, operant conditioning and imprinting."},
        {id:"b3l3",title:"Foraging, competition and environmental stress",lead:"Foraging decisions balance energetic gain with time, predation, nutrient mixture and uncertainty.",sections:[["Decision models","Optimal-foraging models predict diet choice, patch residence or movement under defined currencies and constraints. The marginal-value theorem predicts leaving a patch when its gain rate falls to the environmental average. Risk-sensitive choices depend on energy budget and variance. Real diets also require nutrients and avoidance of toxins."],["Stress and competition","Competition is exploitative when individuals deplete a shared resource and interference-based when they directly restrict access. Environmental stressors activate neuroendocrine and behavioural responses that can restore performance short term but impose costs when chronic. Coping style, predictability, control and prior experience influence outcomes."]],key:"Optimality is a testable benchmark, not a claim that every observed choice is perfect.",exam:"Apply the marginal-value theorem and discuss why real animals may deviate from its prediction."}
      ]},
      {id:"b4",title:"Understanding Complex Behaviour",hours:12,summary:"Instinct, cognition, memory, decisions, reproduction, honeybee behaviour, representation, awareness and emotion.",flow:["Perceive options","Retrieve information","Assign value","Select action","Learn outcome"],revision:["Innate behaviour can still be modified by experience.","Decision rules are evaluated under uncertainty and trade-offs.","Claims about awareness require converging, species-appropriate evidence."],lessons:[
        {id:"b4l1",title:"Instinct, memory and animal decision-making",lead:"Complex decisions combine evolved predispositions, acquired information and current costs rather than choosing through human-like deliberation.",sections:[["Innate and learned components","Instinct refers to reliably developing behavioural organisation, not behaviour wholly independent of environment. Memory systems may be short- or long-term, reference or working, spatial, recognition-based or procedural. Retrieval is reconstructed and context-sensitive. Innate biases often guide what is learned quickly."],["Decision mechanisms","Animals compare options using sensory evidence, expected reward, delay, risk and opportunity cost. Sequential-sampling models describe evidence accumulation to a threshold. Speed–accuracy trade-offs, state dependence and bounded information explain choices that appear inconsistent under a simple maximisation rule."]],key:"Ask what information was available to the animal at the moment of choice.",exam:"Explain state-dependent decision-making with a speed–accuracy trade-off."},
        {id:"b4l2",title:"Reproductive behaviour and honeybee communication",lead:"Reproductive sequences coordinate recognition, competition and parental investment; eusocial insects add colony-level organisation.",sections:[["Reproductive sequences","Courtship signals species identity, condition and readiness, while timing reduces reproductive interference. Hormones modulate motivation and responsiveness, but social and environmental feedback shapes expression. Post-copulatory selection includes sperm competition and cryptic female choice."],["Honeybee complexity","Workers shift tasks with age and colony need. Round dances recruit to nearby resources, while waggle dances encode direction relative to the sun and approximate distance through dance orientation and duration. Odours communicate resource identity. Colony decisions emerge through recruitment, inhibitory signals, quorum processes and distributed information rather than a central controller."]],key:"The waggle dance transmits spatial information, but recruits also use odour and landscape cues.",exam:"Describe waggle-dance coding and explain how colonies reach distributed decisions."},
        {id:"b4l3",title:"Mental representation, awareness and emotion",lead:"Cognitive interpretations should be neither dismissed automatically nor accepted from anthropomorphic resemblance alone.",sections:[["Representation and language-like systems","A representation carries information used beyond the immediate stimulus. Displacement, symbolic reference, combinatorial structure and intentional use provide progressively stronger evidence for language-like capacity. Animal communication systems can be sophisticated without matching the open-ended grammar of human language."],["Awareness and affect","Evidence for affective states includes judgement bias, preference, avoidance, physiology and flexible trade-offs. Metacognition-like uncertainty responses and mirror-guided behaviour address aspects of awareness but are sensitive to training and sensory ecology. Ethical decisions should use the best converging evidence while recognising uncertainty."]],key:"Operationalise each claim—emotion, representation or awareness—before choosing a test.",exam:"Critically assess two lines of evidence used to infer animal emotion or awareness."}
      ]},
      {id:"b5",title:"Chronobiology",hours:12,summary:"Circadian clocks, central and peripheral systems, photoperiodism, ultradian and infradian rhythms, ageing and chronomedicine.",flow:["Zeitgeber detected","Clock is entrained","Phase signal spreads","Output is gated","Feedback resets"],revision:["A rhythm must free-run to demonstrate endogenous timing.","The central clock coordinates rather than generates every peripheral rhythm.","Treatment time can change efficacy and toxicity."],lessons:[
        {id:"b5l1",title:"Circadian rhythms and biological clocks",lead:"Circadian systems generate approximately 24-hour organisation and synchronise it to environmental time.",sections:[["Clock properties","An endogenous circadian rhythm persists under constant conditions, can be entrained by zeitgebers and is relatively temperature compensated. Phase, period and amplitude describe the waveform. Light pulses shift phase differently depending on biological time, summarised by a phase-response curve."],["Molecular mechanism","Transcription–translation feedback loops generate oscillation: clock proteins promote expression of their own repressors, followed by delayed degradation and renewed activation. Post-translational modification tunes period and stability. Clock genes also regulate output pathways, creating rhythmic physiology and behaviour."]],key:"Daily repetition alone does not prove a circadian clock; persistence without external cycles is critical.",exam:"Describe the defining properties and molecular basis of a circadian rhythm."},
        {id:"b5l2",title:"Central, peripheral and photoperiodic organisation",lead:"Multiple tissue clocks are coordinated by environmental cues and systemic signals.",sections:[["Clock hierarchy","In mammals, the suprachiasmatic nucleus receives retinal light information and coordinates behavioural and endocrine rhythms. Peripheral clocks exist in liver, gut and other tissues and respond to feeding, temperature, hormones and neural signals. Misalignment can occur when social timing, light and feeding cues disagree."],["Seasonal timing","Photoperiodism measures day length to time reproduction, migration, moult or diapause. Melatonin duration conveys night length in many vertebrates. The response depends on circadian phase, so identical light exposure can have different effects depending on timing."]],key:"Peripheral clocks are autonomous oscillators but remain coordinated by central and behavioural cues.",exam:"Explain how photoperiod and melatonin can organise seasonal reproduction."},
        {id:"b5l3",title:"Ultradian, infradian rhythms and chronomedicine",lead:"Biological timing spans seconds to years and can be used to interpret ageing, disease and treatment response.",sections:[["Rhythms beyond one day","Ultradian rhythms have periods shorter than 24 hours, including pulsatile hormone release and sleep cycles. Infradian rhythms exceed 24 hours, including menstrual and seasonal cycles. Oscillations can interact through coupling, and ageing commonly reduces amplitude or alters phase and sleep consolidation."],["Clinical timing","Chronopharmacology studies how biological time changes drug absorption, distribution, targets and toxicity. Chronotherapy schedules intervention to improve benefit or reduce harm; chronomedicine more broadly incorporates temporal patterns into diagnosis and care. Timing recommendations are treatment-specific and require clinical evidence rather than general self-scheduling."]],key:"Dose and timing are separate variables; an optimal schedule depends on disease rhythm and drug kinetics.",exam:"Differentiate chronobiology, chronopharmacology, chronotherapy and chronomedicine."}
      ]}
    ]
  },
  {
    id:"dairy",code:"ZP233SE1",title:"Dairy Farming",kind:"Skill Enhancement Course II",hours:45,color:"#2873b8",
    description:"Applied dairy science covering breeds and breeding, housing, nutrition, milk handling, disease prevention and biosecurity.",
    units:[
      {id:"d1",title:"Introduction, Breeds and Breeding",hours:9,summary:"Importance of dairying, cattle classification and selection, artificial insemination, management and anatomy.",flow:["Define production goal","Evaluate breed","Select parents","Plan mating","Record outcome"],revision:["Breed choice must match climate, feed and market.","Selection changes allele frequencies through differential breeding.","Artificial insemination improves access to sires but requires accurate heat detection."],lessons:[
        {id:"d1l1",title:"Dairy farming, advantages and production systems",lead:"Dairying converts forage and labour into food, income and manure, but profitability depends on coordinated biological and business management.",sections:[["Role and systems","Dairy farming supplies milk, supports regular household cash flow, creates rural employment and integrates with cropping through manure and crop residues. Systems range from small mixed farms to specialised enterprises. Productivity should be evaluated per animal and per unit of feed, land, labour and water rather than by milk yield alone."],["Planning constraints","Climate, fodder availability, veterinary access, labour skill, credit, market distance, chilling and waste disposal determine feasibility. Animal welfare and environmental load are core production variables. A resilient farm budgets for seasonal feed gaps, reproductive delays, disease outbreaks and price fluctuation."]],key:"High-yield animals are not automatically profitable when maintenance, heat stress and feed costs are ignored.",exam:"Evaluate the biological, economic and cultural importance of dairying in an integrated farm."},
        {id:"d1l2",title:"Cattle breeds, classification and selection",lead:"Breed evaluation combines ancestry and visible form with measured performance under the target environment.",sections:[["Breed groups","Indigenous zebu cattle are generally heat tolerant and adapted to local disease and feed conditions; examples include Sahiwal, Red Sindhi, Gir and Tharparkar. Exotic dairy breeds such as Holstein Friesian and Jersey offer high yield under suitable management. Crossbreeding seeks complementarity but requires a stable breeding objective and records."],["Selection criteria","Choose animals using health, conformation, udder and teat structure, feet and legs, reproductive history, lactation yield, fat and protein, calving interval, longevity and family or genomic information. Correct age, stage of lactation and environment before comparing performance. Visual appeal cannot substitute for production and fertility records."]],key:"Selection is most reliable when phenotype, pedigree and repeated performance records agree.",exam:"Compare indigenous, exotic and crossbred cattle for a warm-climate dairy system."},
        {id:"d1l3",title:"Breeding, artificial insemination and general anatomy",lead:"Reproductive management connects genetic improvement with accurate observation, anatomy and animal handling.",sections:[["Breeding and AI","A breeding plan defines economically important traits and avoids inbreeding. Artificial insemination permits wide use of evaluated sires and improves disease control compared with uncontrolled mating. Success depends on heat detection, semen handling, hygienic technique, insemination timing, uterine health and follow-up records."],["Functional anatomy","The ruminant digestive system includes rumen, reticulum, omasum and abomasum, supporting microbial fermentation. The female tract includes ovaries, oviducts, uterus, cervix and vagina; the udder contains secretory alveoli, ducts, gland cisterns and teats. Knowledge of landmarks supports feeding, breeding, calving care and milking hygiene."]],key:"Technology cannot compensate for missed oestrus, poor nutrition or weak records.",exam:"Describe artificial insemination from heat detection to pregnancy confirmation."}
      ]},
      {id:"d2",title:"Dairy Housing and Management",hours:9,summary:"Model-house design, open and shed housing, layout, ventilation, drainage, waste and seasonal management.",flow:["Choose dry site","Orient and ventilate","Separate functional zones","Drain safely","Monitor comfort"],revision:["Housing should keep animals dry, cool, clean and easy to observe.","Drainage slope and water supply are planned together.","Seasonal management begins before heat or cold stress is visible."],lessons:[
        {id:"d2l1",title:"Model dairy-house design and housing systems",lead:"A dairy house is a health-management system whose layout controls comfort, hygiene, labour and disease transmission.",sections:[["System choices","Loose or open housing permits movement and group management, while conventional stalls provide individual control but demand more labour and restrict movement. Choice depends on herd size, climate, land, feed delivery, manure handling and management skill. Calves, sick animals, calving cows and milk handling need dedicated areas."],["Layout principles","Select an elevated, well-drained site with clean water and road access. Orient sheds to reduce solar load and exploit prevailing wind. Provide adequate resting, feeding and loafing space, non-slip floors, shade and safe animal flow. Separate clean milk routes from manure and isolation areas."]],key:"Efficient layout shortens routine work without forcing animals through stressful or contaminated routes.",exam:"Design and justify the functional zones of a model dairy unit."},
